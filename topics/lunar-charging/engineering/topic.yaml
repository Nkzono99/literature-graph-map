- paper_id: P000049
  group: removal
  role: 中和と回収を組み合わせる特許
  summary:
    question: 宇宙服に付着したダストを離脱させた後に回収し、居住区への持ち込みをどう防ぐか。
    method: 正負のイオンシャワーによる中和と、粒子を再帯電して正の板へ捕集する回収器、床下フィルタを組み合わせる。エアロック内の気体供給・送風、リングや旋回アーム、施設外の梯子配置を例示する。
    contribution: 中和だけでなく回収まで含めた宇宙服除塵の運用・装置構成を提案した登録特許。除去率や真空下の動作性能は本文で検証されていない。
