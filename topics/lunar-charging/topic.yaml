- paper_id: P000009
  group: grain-charging
  role: 空隙の電子再吸収
  summary:
    question: 粉体面の粒子は、平均的なシース電場からの見積もりを超える電荷と離脱力をどう得るか。
    method: 模擬粉体に紫外線・電子ビーム・プラズマを照射する比較実験と、粒子間空隙での電子再吸収モデルを組み合わせた。
    contribution: 微小空隙への放出電子の再吸収が局所的な負帯電と反発力を強めるpatched charge modelを提案し、実験で観測した粒子の跳躍を説明した。
