schema_version: 1
topic_id: lunar-mineralogy
title: 月の鉱物・元素組成
question: 軌道分光と返還試料、模擬物実験から、月の組成と衝突・加熱による物質変化をどう読み取るか。
synopsis:
- 月の組成は、軌道分光、返還試料、模擬物実験を組み合わせて読まれる。斜長石（[@P000172]）やかんらん石（[@P000173]）の分布は地殻形成と深部物質の露出を制約し、γ線観測（[@P000175]）は全球の元素共変動と地域差を示す。
- 分光の比較には観測幾何と較正の統一が先に必要であり（[@P000277]）、吸収帯の不検出を鉱物の不存在と置き換えることはできない（[@P000174]）。返還試料は、衝突による蒸発・再凝縮（[@P000286]、[@P000287]）、衝撃記録（[@P000378]）、Li同位体による分化と改変（[@P000372]）を粒子スケールで与える。
- 加熱によるFeの移動と磁性相の生成（[@P000297]）、水の吸着（[@P000336]）、熱伝導と成熟度（[@P000331]）は、鉱物相だけでなく表面・粒子間の構造が物性を左右することを示す。
review:
- heading: 鉱物の分布から、地殻と深部物質を考える
  paragraphs:
  - "[@P000172]は新鮮露頭の1250 nm吸収と鉱物粒子の混合モデルから斜長石約98 vol%の純斜長岩（PAN）を月の表裏で捉えた。調査した新鮮な高地露頭とクレーター径から、著者は深さ約3–少なくとも30 kmにPAN層または大パッチを推論する。これは全球地殻体積の直接測定ではなく、上部地殻全体をPANとしたAl2O3約35 wt%も極端な条件付き外挿である。[@P000173]のかんらん石分布は、衝突盆地周辺で深部物質が露出した可能性を考える入口である。"
  - UとThは表側PKTで濃集し、全球の濃度相関はR²=0.97、回帰の傾きは0.269±0.007だった。一方、裏側東高地と西高地の広域平均では、Thが0.36±0.02と0.33±0.02
    ppmで統計誤差内にあるのに対し、Uの報告値は0.34±0.01と0.21±0.01 ppmと異なる。併記された±は全系統誤差を含む誤差予算としては示されず、−0.11
    ppmのU補正案の適用も明記されない。著者は不均一な地殻形成の可能性を示唆するが、Uの絶対較正に関する系統誤差と形成後の元素移動を残している。全球的な元素の共変動と地域的な組成差を両立させて読む結果である[@P000175]。
  - '[@P000174]のイルメナイト富化スペクトル候補は、表側の盆地周縁の火砕堆積物に多く、既存TiO₂地図で高Tiとされる海の主要分布域では同じ特徴が検出されなかった。この違いには輝石との混合、粒径、成熟度、Tiを含む他鉱物相が関係し得るため、未検出をイルメナイトの不存在へ置き換えることはできず、火砕堆積物と高Ti海の含有率の優劣も未確定である。（PDF
    pp.6–7,16,18–19, §§3.1,3.2.6,4.2–4.3）'
  - 組成と地下熱環境をつなぐ[@P000337]は、Chang’e-2のマイクロ波輝度温度を地質図と比較し、Aristarchus周辺で火砕堆積物が光学・レーダー推定より広い可能性を示した。鉱物の吸収帯による表層の分布と、マイクロ波が捉える深さの熱的な性質を対応させて解釈する。
  - "[@P000173]はSPの連続スペクトルを1.6 µm未満で解析し、245観測点を34地点に整理した。露出の多くは地殻厚約30–50 kmの盆地周辺で、新鮮なクレーター壁や放出物にある。一部の代表スペクトルが約0.7 µmで絶対反射率0.23未満という暗さはduniteに富むモデルと整合するが、下部地殻のMg-rich plutonや衝撃で斜長石の帯が消えた可能性も残り、上部マントル起源は示唆にとどまる。赤道での観測面積は約20%で、非検出の解釈には観測範囲と新鮮露出への偏りを考慮する。"
  - "[@P000337]は、Aristarchusの火砕被覆で昼夜のTB差が小さい特徴を用い、低TBD域がMontes HarbingerとMontes Agricolaへ連続するとしてLPDの分布拡大を推定した。7.8–37 GHzの特徴を主に使い、3 GHzの昼の例外は別に検討する。FeO・TiO2だけでなくレゴリス厚さ、宇宙風化、塵被覆、地下層構造、岩石存在度も同じ特徴を生みうるため、境界は推定域である。水などの揮発性成分による蓄熱の説明も定量的に確認されていない。"
- heading: 機器の違いをそろえてから、組成を比べる
  paragraphs:
  - One Moon, Many Measurementsの3論文は、同じ月の観測を放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]に分けて比較する。鉱物分布の差を読む前に、観測幾何と較正がそろっているかを確認するための文献群である。
  - 較正後の光学特性の解釈に関わる[@P000374]は、粒径と金属鉄を操作して反射・偏光を比較した。天然土壌との違いから、実験試料にないアグルチネートの役割も課題とした。
- heading: 返還試料から、衝突で動く元素と粒子の形を読む
  paragraphs:
  - "Chang'e-6のNi同位体[@P000286]は、微小隕石の供給源と蒸発・再凝縮の履歴を制約する。Chang'e-5のかんらん石上に堆積したクロム鉄鉱[@P000287]は、衝突蒸気から二次鉱物が生じた証拠として解釈された。軌道から得る鉱物分布に、粒子の表面で起きる元素移動を補う研究である。"
  - "[@P000286]では、Chang’e-6のレゴリスや一部凝集・角礫化した岩片が重いNi同位体を示す一方、おおむね未角礫化の低Ti玄武岩片2個は著しく軽い。著者は元素・同位体の比較から結晶化や拡散で説明しにくいとし、衝突蒸気の再凝縮を採る。風化影響を除いた局所玄武岩の基準値0.19 ± 0.04‰は大岩片2個に基づくため、風化した岩片の値をマントルの初生組成へ直接読み替えない。"
  - 粒子の形や鉱物の組合せは地盤の力学にも関わる。[@P000293]は三次元形状から粒子同士のかみ合いを計算し、[@P000290]は形状・摩擦・付着と安息角の関係を調べる。分光から読む組成と、集団としての流れやすさを結び付ける際の比較材料になる。
  - ガラス質結合に着目した[@P000373]は、焼結粒子を含む模擬地盤の強化と軟化を測定した。粒子形状の計算へ、結合構造の実験制約を補う。
- heading: 加熱によるFeの移動が磁性を変える
  paragraphs:
  - '[@P000297]は低酸素分圧で加熱した玄武岩質模擬物について、Feの移動と磁性相の生成を追った。800°C付近での磁化増加と、さらに高温での低下を、Feを含む相の変化で説明する。実験の温度・酸素条件を踏まえることで、月面物質の熱履歴と磁気特性を考える基礎になる。'
- heading: 電気的風化、水吸着、熱と磁性をつなぐ
  paragraphs:
  - "[@P000311]・[@P000312]は絶縁破壊によるレゴリス改変を推定した。表面での水保持を調べる[@P000336]は、鉱物の金属サイトと水素結合の寄与が被覆率で変わることを示す。[@P000331]は粒子構造と熱伝導率を成熟度へ接続し、[@P000323]は衝突ガラスに残るγ鉄の磁区構造を示した。鉱物相だけでなく、表面・粒子間の構造と熱履歴が、保持・熱輸送・磁化を左右する。"
  - "[@P000331]は、ガラス相割合、二次元フラクタル次元、粒子体積と温度から粒子固有熱伝導率を予測し、アグルチネート内部の界面と粒子間接触が熱輸送を妨げる仕組みを検討した。鉱物相の割合だけでなく、粒内空隙・界面と充填構造を合わせて成熟度を考える視点を与える。ガラスビーズ接触半径は統計不足による仮定で、100 K値は先行測定温度域より低い外挿を含む。"
  - "[@P000336]は斜長石CaAl2Si2O8、Fe含有輝石MgFeSi2O6、イルメナイトFeTiO3、Fe含有かんらん石Mg3FeSi2O8の理想結晶面を第一原理計算で比較した。単分子の固定は同じ面内ではTi・Fe・Caの露出サイトが有利だが、水を増やすと表面方位と水素結合を支える配置にも左右される。選定輝石(110)面では利用可能金属サイト基準の10%から100%へ平均吸着が−0.87から−1.16 eV/H2Oに強まり、初期固定の強さだけでは多数の水の安定化を順位づけられない。粗さ・欠陥・非晶質を含まない静的理想面の比較として位置づけられる。単分子値とのセル・分子数対応、差分値の区間規格化、ICOHPの図表差には未解決点が残る。"
  - "[@P000323]はChang’e-6衝突ガラス2片からNi<0.8 wt.%のfcc γFeを同定した。各薄片25球のγ相比率は64%と76%で、玄武岩片の粗粒Feはbcc α相だった。保存機構として微量Cと極急冷の相乗作用を提案するが、C濃度と冷却速度は測定していない。"
- heading: 試料の鉱物とLi同位体から、分化と改変を分ける
  paragraphs:
  - Chang’e-5試料の鉱物モードと衝撃記録をラマン分光で調べた[@P000378]に対し、[@P000371]は一つの玄武岩の詳細分析からマグマ源と衝撃圧力を検討する。対象粒子数と組織の違いを踏まえて読み合わせる。
  - Li同位体の基準値を調べた[@P000375]と[@P000376]を踏まえ、[@P000377]は高温分化に伴う分別を検討した。[@P000372]は月隕石へ試料範囲を広げ、マントルの代表値と地殻の二次改変を分けて再評価している。
  - "[@P000375]は、月玄武岩・ガラスのδ⁷Liの幅を、初期のかんらん石に富む集積岩と後期の単斜輝石に富む高Ti源の違いに関連づけた。αolivine-melt=0.999を仮定したRayleighモデルでは95%結晶化後の残液が2.5‰超重くなるが、月の鉱物–融体分別係数は未確定である。斜長岩62255の+8.89±0.18‰（2σ）には後期Li添加の可能性が残る。一方、土壌67601の<25 μm画分は+8.44‰と粗粒画分より重く、太陽風注入の影響を火成岩全岩の分化傾向から区別した。 太陽風量の概算には原子数換算と混合近似の未解決問題が残る。"
- heading: 月裏側試料から、注入と風化の記録を読む
  paragraphs:
  - "[@P000452]は炭素に富む一粒子の有機様物質と黒鉛を同位体・結合・組織から識別し、外来物質の変換を論じた。[@P000433]は希ガスの同位体と放出から太陽風注入の表裏差を調べる。試料に残る成分を、供給源とその後の変質に分けるための異なるトレーサーである。"
  - "[@P000433]は、Chang’e-6の七分取試料の希ガスを全溶融・段階加熱で分析し、Chang’e-5より太陽風Kr・Xeが高温側で多く放出することから深い注入を推定した。平均20Ne/22Neは11.34±0.22で強く分別され、原因は未解決である。Xeによる代表宇宙線曝露年代670±117 Maと、捕獲Ar比が示す比較的若い太陽風記録は異なる履歴指標であり、鉱物による保持・外来成分混合・ガス損失を分けて比較する必要がある。"
  - "[@P000456]は軟X線発光とSEMから還元・非晶質化を捉え、[@P000461]はmicro-CTと機械学習で多数粒子の形態を比較した。後者は異なる履歴で似た形態分布を得て、形状変化の早い飽和を示唆する。電子状態の変化と粒子全体の形態は測る尺度が異なるため、一方の風化指標を他方へ単純換算しない。"
  - "[@P000461]は、Chang’e-5/6玄武岩の斜長石体積比を39.36/31.32%と推定し、相体積比に既往地球化学の回帰を適用してTiO₂/Al₂O₃を6.08/11.60、6.17/9.43 wt%と求めた。玄武岩の鉱物組成と土壌全体の外来物質混合を区別し、200 μm超の手選別アグルチネート各42粒では平均void ratioが0.23/0.11と異なることを示す。低空隙を高温の衝突融液・脱ガスで説明するのは、冷却・溶着・気泡連結等にも依存する非一意な解釈である。同じ粒子種の外形分布は主に20–200 μm画分で似ており、著者は引用モデルによるCE5最大曝露年代約2.2 Maより前の形態飽和を提案する。鉱物組成・空隙構造の差と外形の収束は併存し、形態を普遍的な曝露時計とする検証は残る。要点は未編集の採択原稿に基づく。"
- heading: スパッタを、結合と粗さの問題として扱う
  paragraphs:
  - "[@P000444]は模擬物を使うイオン照射の予備測定を、[@P000441]は実月試料の粗さ・空隙による収率抑制を示した。[@P000460]は衝突後の結合エネルギーの部位差を選択的スパッタへつなぐモデルである。[@P000440]の負イオン観測を使う逆推定を合わせると、表面組成、微細形状、結合、入射種と観測される放出分布を対応させて比べられる。"
  - "[@P000440]はChang’e-6試料の酸化物組成と注入水素を合わせた多元素材料モデルを、負水素イオンの散乱・スパッタ推定に用いた。共通有効結合エネルギーのMAPは5.45 eV（68% HDI4.57–6.49 eV）であり、個別鉱物の同定値ではない。平均微視的斜面角27.7°を仮定する粗面モデルでは、平均放出方位213°の宏観放出角75°を越える領域では、著者は両放出成分の低下を再衝突・可視性制約によると解釈する。負イオン化と輸送を介した推定には、バルク組成と数十nmの表層水素の合成、着陸排気による地表攪乱という条件が残る。要点はarXiv:2602.16567v1原稿に基づく。"
  - "[@P000441]は実月土由来の薄膜の収率が単鉱物向け結合モデルからの計算より低いことを示し、H 0.47、He 0.66の係数でSDTrimSPを補正した（1 keV/amu）。AFMで調べた薄膜と圧粉体の平均局所傾斜角は6.2°と27.7°で、粗さによる収率低下は大入射角で現れ、垂直付近では増加する。多成分ガラスに強い結合または低密度が生じるという説明は仮説で、組成だけの混合則と表面結合モデルを検証する放出エネルギー測定が課題として残る。Methodsの68051と他箇所の68501の試料番号相違は未解決。"
  - "[@P000460]はFe2SiO4への4 nm衝突体の12 km/s・45°衝突で、300 KのFe表面結合エネルギーが未衝突面4.3 eVに対して床5.8 eV、噴出物2.0 eVとなることを計算した。1 keV H+のTRIM計算では噴出物の放出Fe比0.15207が床0.18113より小さく、著者は噴出物での相対Fe濃集をnpFe0形成に結びつける。金属化・核形成率・粒径の直接計算ではなく、純Fe2SiO4の構造変化と選択的スパッタに基づく機構提案である。"
- heading: 鉱物相と原料価値を、反応条件から結ぶ
  paragraphs:
  - "[@P000423]と[@P000424]はApollo土壌・火山ガラスの水素還元で、初期鉄量と鉱物別の反応性を原料評価へつないだ。[@P000425]は模擬物の反応と表面積変化を、[@P000422]は鉱物別の非平衡中間相を調べる。[@P000427]の連続式反応器では溶融も生成速度を変える。自然の水の保持を表す組成指標と、外部H₂を使う工程の反応収率は区別して扱う。"
  - "[@P000425]のFJS-1メスバウアー解析では、1173 K還元後に金属鉄が現れ、輝石・かんらん石の相対スペクトル面積は大きく変わらなかった。著者はイルメナイト、Fe³⁺相、磁性鉄酸化物を主な還元源とした。地球由来の低Ti海・高Ti海・海と高地の中間の模擬物を比べた結果であり、スペクトル面積を鉱物質量分率と同一視せず、磁性相の推定と実月試料の相構成を区別する。"
  - "[@P000422]は実月土ではなくLMS模擬物を873 Kで120 min水素還元し、輝石のa軸方向の秩序を残す半非晶質層状中間構造、かんらん石の非晶質シリカとFe欠乏・Mg富化結晶、イルメナイトの多孔質ルチルと金属Feを区別した。平衡計算で予測される生成相との違いから、酸化物の構造再編が還元を制約すると著者は解釈する。これは反応後の局所構造による推定で、鉱物別の拡散係数や時系列の直接測定ではない。出版者補足S2–S4は温度と時間が同時に異なるSEM像で、主試験の同条件反復には当たらず、S4ではキャプションの鉱物列挙と表示パネルに差が残る。"
  - "[@P000427]ではFJS-1をH₂ 3 vol%で1373 K、10 min処理すると未処理粒子の亀裂や微粒子が見えなくなり、著者はNa-rich低融点成分の溶融が粒内への水素拡散を妨げると解釈した。これはNa分布や拡散係数の直接測定を伴わない機構説明である。別条件の1273 K・H₂ 10 vol%・10 min処理では、Fe・Tiを含むイルメナイトとされた領域に粒内多孔化とEDSのO信号欠乏が観察され、水として酸素を抽出した形態変化と対応づけられた。両観察は処理条件が異なり、実月鉱物の一つの連続反応経路を示すものとしては扱えない。"
- heading: 深部反応と、氷の分光校正へ広げる
  paragraphs:
  - "[@P000455]は核–マントル境界条件の実験で鉄に富む(Fe,Mg)Oを形成し、混合物の速度・密度から低速度帯を説明する。深部の直接採取による鉱物同定ではなく、地球物理制約に対応する反応モデルである。表面側の[@P000471]は氷と高地模擬物の反射を粒径・形状・観測角・含有率で比べた。近赤外の帯深さを氷量へ変換するには、粒子の光路長と混合状態の校正が要る。"
  - "[@P000455]は純鉄とFo100/Fo90のかんらん石を4.5 GPa、1473–1673 Kで反応させ、Fe比0.42–0.76のMw形成を示した。酸素フガシティーは回収相の活動度からIW−0.2±0.2と計算する。相平衡計算では斜方輝石を含めるとMwの安定域が狭まり、母岩組成と酸素供給が形成を左右する。核冷却に伴う酸素排出を有力な供給源とする著者の機構解釈は、月深部でのMw直接同定とは区別して位置づける。推定の評価には混合則、酸素収支の規格化、速度誤差、試料実測組成を合わせて検討する必要がある。"
