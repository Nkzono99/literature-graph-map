schema_version: 1
topic_id: lunar-charging-sheath
title: 月面の電流収支・光電子シース
question: 月面の電位と、その上に広がる光電子シースを決める電流・材料特性・プラズマ条件。
synopsis:
- 月面の電位は、プラズマから流入する電子・イオンと、光電子・二次電子として出ていく電荷の電流収支で決まる（[@P000002]）。月試料の放出特性（[@P000001]）と観測から整理した電位・電場の規模（[@P000020]）が、材料特性から表面電位へ進む基礎である。
- 放出電子が表面近くにとどまると、電位が空間的に変わる光電子シースが生じ、電位の極小を持つ非単調な構造も現れる。PIC計算（[@P000007]）、真空実験（[@P000092]）、磁気圏尾部の観測との照合（[@P000036]）は、その構造を異なる方法で調べている。イオン温度や入射角（[@P000055]）、放出電流の条件（[@P000038]）が電位分布を変える。
- 電流収支へ入れる放出・散乱特性は、観測から制約され始めた（[@P000362]、[@P000363]）。表面で生成される電子と、シースや磁場を通って観測点へ届く電子を対応させることが、モデルと観測を結ぶ条件である。
review:
- heading: 電流の釣り合いと電子放出
  paragraphs:
  - '[@P000002]の電流収支は、プラズマの電子・イオンが運ぶ電荷と、光電子・二次電子として出ていく電荷を釣り合わせる。放出特性を測る[@P000001]と、月面電場やシースを整理する[@P000020]を併せて読むと、材料特性から表面電位へ進む筋道が分かる。'
  - '[@P000020]は、観測で推定した地表電位を遮蔽長で割ってシース電場の規模を整理した。昼側の+10 Vと有効遮蔽長1 mは約10 V/mと整合し、終端では約10
    mを仮定して内向き約1～10 V/mを見積もる。終端イオンシースの模式図にはλD≫10 mと記され、遠夜側の約100 mと約1 V/mは推測に残る。この整理から、後続のシース研究では電位分布と有効遮蔽長をどの粒子集団が決めるかが課題になる。'
  - 磁気圏ローブ中の昼側について、[@P000162]は太陽活動に応じた放出電流から電位を予測し、[@P000161]は観測光電子のエネルギーずれから電位を推定する。放出モデルと観測を往復して電流収支を調べる研究として読める。
  - 電流収支を入力条件ごとに調べた[@P000038]では、光放出電流JP0の増加が光電子密度を増やしてDebye長を短くし、表面電場を電位以上に強める。JP0を固定した光電子温度Tpの変化では電位とDebye長がともに増え、ゼロ電位角は変わらないが、光電子密度np0を固定すれば放出電流も変わり、この不変性は成り立たない。さらに非単調PICとの著者比較では、単調モデルの電位は周囲プラズマ基準の表面電位より電位障壁差に近かった。
  - "[@P000510]は月土の既報光電子収率と1 AUのFISMスペクトルを組み合わせ、垂直入射の光電子電流を太陽極小・極大・X28フレアで5.05、15.5、40 μA/m²と計算した。光電子温度2 eV、太陽風電子密度5 cm⁻³・温度10 eVに固定した電流釣合いモデルでは、電場は4.9、12.5、25 V/m、静電的移動の代理量E²は23.7、153、632 V²/m²となる。太陽高度角や追加帯電過程を省いた推定で、粒子離脱条件を直接求めたものではない。光電子源の太陽活動依存をシースモデルへ持ち込む研究として位置づけられる。太陽風電子密度の単位は図4のcm⁻³に従うが、本文¶9にはcm⁻⁵と印刷され、原資料内に不一致が残る。式1の積分測度の符号と電流・粒子流束の換算には原式の表記上の曖昧さが残る。"
- heading: 単一の表面電位から、空間構造へ
  paragraphs:
  - "表面から出た電子の一部は電場で引き戻され、シースに電位の極小が生じる場合がある。[@P000007]はPICで光電子とダストの運動を追い、[@P000030]は初期光電流を測り、UV光電子シースの分布診断を計画した。磁気圏尾部では、Lunar Prospectorを使う[@P000033]とARTEMISを使う[@P000036]が非単調な電位構造を論じている。太陽風電子の流れを含む半解析モデルは[@P000011]に進める。"
  - Lunar Prospectorによる非単調シースの議論に続き、[@P000036]はARTEMIS P1の電子だけでなくイオン温度も用いて、磁気圏尾部の日照側シースを一次元PICと照合した。イオン温度を上げると電位極小への落差が浅くなり、電子温度が低下してTi/Teが臨界比を超える時間帯には冷たいビームが消える。残る低エネルギーの上向きフラックス、探査機電位による汚染範囲、初期時間帯の予測との差も比較条件に含める。
  - シース内を動く粒子には、場所ごとの電場と電子・イオン電流が同時に効く。[@P000167]は帯電と軌道を連成し、希薄な条件では電子1個ずつの出入りが運動を変えることを示した。
  - シース内の力をダスト輸送へ結び付ける際には、表面から離れるまでの接触も条件になる。[@P000256]の総説はレゴリスの力学と帯電・運動を横断し、離脱時の電荷分布と微小粒子の実験を課題として整理した。シースが与える電場と、粒子を保持する力を対応させるための入口となる。
  - 電子・光電子の速度分布に加え、イオンの熱圧力と境界から入る速度も電流収支・遮蔽を変える。[@P000055]はMaxwell分布の電子と一次元定常イオン流を連立し、法線入射速度がBohm速度を十分上回るθ=40°・60°では温度効果が小さく、θ=80°では低温側に電位の初期低下、θ=85°では負の電位極小と光電子障壁の弱化が生じることを示した。さらに、シース端のBohm条件を満たしても正電位層に実数のイオン解がない場合を指摘し、通過条件に合わせた境界速度の修正を提案した。
  - "[@P000033]は、地球プラズマシート中の昼側電子分布を一次元PICと比較し、非単調電位による周囲電子の反射と脱出光電子の加速で主要特徴を説明した。光電子電流4.5×10⁻⁶ A m⁻²、温度2.2 eV、周囲密度10⁵ m⁻³、電子と等しいイオンパラメータを仮定した100–500 eVの計算では、表面電荷密度は約+3.9×10⁻¹¹ C m⁻²となる。電子反射が示す負の電位障壁と表面電荷の符号を分けて解釈する必要がある。この比較は一事例と上記のモデル条件に基づく。"
  - "[@P000511]は1998年5月のCMEを条件に3種の1次元PICを比較し、太陽風電子電流の増加が月昼側の光電子捕捉を弱めることを示した。PH計算では通常太陽風の表面／上流光電子密度比30が衝撃波後と後期CMEで2.5となるが、前者は負電位による加速、後者はイオン電流を含む約+1 Vの弱い捕捉に由来する。放出5倍を仮定したフレアでは比125となる。密度比は加速の影響も含み、コード間で定量差があるため、脱出割合や普遍的な閾値と同一視せず、平坦面・磁場法線方向の局所モデルの結果として位置づける。 Table 1の規格化とZ熱速度の印刷値には未解決の留保がある。"
  - "[@P000520]は太陽照度、元素組成、エネルギー依存の非弾性平均自由行程、非弾性尾と複数Auger遷移を含む光電子源を計算し、装置応答を通して太陽風中の100–800 eVスペクトルを概ね再現した。磁気圏尾では放出係数αと月面電位UMが縮退し、一意な電位推定はESAの分解能に制約される。プラズマシートの一事例ではUM=0の区間でα=0.51を校正して短時間一定と仮定し、200–800 eVのスペクトルシフトから得る表面電位とビームエネルギーから得る上空の電位最小値が相関した。これにより非単調シースの表面値と最小値を分ける診断の成立可能性を示すが、固定αと高温電子混入の条件が残る。 Fig4aの事例日には本文・captionとプロットの不一致がある。 Fig7fの平均スペクトル時刻12:15–12:16 UTCも本文の校正区間12:14–12:16 UTCと異なる。"
  - "光電子源、捕捉密度、電位診断は、シースの別の部分を制約する。[@P000510]は太陽照度と月土収率から放出電流を計算し、温度を固定した簡略モデルへ渡す。[@P000511]は環境電子・イオン電流の変化による捕捉を複数PICで比較し、密度比には脱出だけでなく加速も含まれる。[@P000520]は放出スペクトルと装置応答から表面電位と上空の極小を分けるが、放出係数の校正と短時間一定の仮定が必要になる。供給、運動、観測応答の条件を分けることで、太陽活動が帯電へ作用する経路を比較できる。"
- heading: 実験の光電子シースを計算と照合する
  paragraphs:
  - "[@P000030]はLPSC2010の2ページ会議要旨で、172 nmのXeエキシマランプを使い、真空中でランプから10 cmに置いたZr面に約1 µA/cm²の光電流密度を報告した。光電子エネルギー2 eVを仮定したDebye長は約0.1 mであり、槽内でシースを調べる設計につなげる。円筒Langmuirプローブとemissiveプローブによる診断を記すが、分布のモデル比較は今後の計画で、電位極小やダスト浮上の測定結果は掲載されない。本文はµA/cm²、Fig.2の縦軸はµA/m²と印刷され、単位表記が一致しない。照射幾何や測定定義の詳述がなく、この資料だけではどちらを採るべきか確定できない。Debye長は導出未提示の著者推定である。"
  - '[@P000092]の真空・金属面実験は、放出電子の返還と別の放出面から来る電子が、光電子層の密度を変えることを示した。負のグリッドに対する浮遊面の電位は約+1.5
    Vへ近づき、二面からの電子を含む1D PICが密度分布を概ね再現する。外部の太陽風プラズマやレゴリスを含む月面条件への値の移行には条件差があり、この論文では電位極小やダスト浮上を直接測っていない。'
- heading: 電流収支へ入れる放出・散乱特性を観測で制約する
  paragraphs:
  - "[@P000362]では正の月面電位が放出電子を減速・捕捉するため、軌道の電子スペクトルを探査機電位と月面電位の双方で補正する。ローブ15–25 V、太陽風0–10 Vを置く選定4日の解析では、電位幅の寄与は19・49 eV光子で約2–3倍だが217 eVでは小さく、放出エネルギー分布の未知性が217 eVの収率をほぼ4桁変える。シースモデルでは、約20 eV超の推定下限10⁻³と、この分布依存性を併せて扱う必要がある。本文の4日集計に基づく推定である。"
  - "[@P000363]は太陽風中の昼側・弱地殻磁場域で、BSEが磁化して月面に再衝突することで有効な脱出係数が下がると解釈した。50–600 eV、high-PHE-yield補正では磁場と表面法線の角度10–20°でη≈0.25–0.35、50–60°で≈0.10–0.20である。表面での放出と遠方へ届く流束を区別する結果であり、再衝突に伴う追加二次電子を含むシース電位の自己無撞着計算は今後の課題となる。high-PHE-yield補正・Dapor由来PFでの数値は本文の概略値であり、各エネルギービンの上下限ではない。PF比較は本文のFig.10に基づく。数値はFigshare DOI 10.6084/m9.figshare.24223444.v1のデータに基づく。要旨の減少表現と本文の明瞭でないという表現の差、およびfig8_orb四分位列の意味は保留。"
  - '[@P000364]の光電子統計は、電位補正した表面流束が太陽照射に従い、識別可能性が降下電子によって抑えられることを示す。約500 eV Auger電子と100
    eV電子の流束を用いる際は、EFIの宇宙機電位と同伴論文からの月面電位補正を区別する必要がある。数密度やシース厚を直接与える結果ではなく、昼側電流収支・電位モデルへつながる観測制約として利用する。傾きの選別閾値は本文と図2で一致せず、実際の設定は未確定である。'
- heading: シースでの反射を、放出イオンの加速へつなぐ
  paragraphs:
  - '[@P000432]は月起源の冷たいイオンが光電子シースで反復反射して数百eVへ達し、運動電場でさらに加速される経路を示した。磁気尾ローブ中のかぐや観測との比較であり、局所シースの構造と軌道上のイオン分布を結ぶ。静電場の反射と、その後の大域電場の仕事を分けると、どの電位を観測が制約するかを検討しやすい。'
- heading: 放出分布と無限遠条件から、シースを閉じる
  paragraphs:
  - "[@P000527]は、光電子放出面と無限遠の境界分布から、帰還・脱出・反射電子の密度を作り、非単調な一次元定常シースを求める枠組みを示した。無限遠の準中性・零電場と総電流ゼロを同時に課すため、放出流束と平均エネルギーだけで接続可能性が決まるとは限らない。[@P000011]の半解析解とPICの比較へつなげると、境界分布・入射ドリフト・イオンの仮定をそろえて検証する必要が分かる。"
