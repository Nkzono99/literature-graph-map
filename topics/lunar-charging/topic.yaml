schema_version: 1
topic_id: lunar-charging
title: 月面帯電：光電子シース・宇宙環境・地形・ダスト
question: 月面の電位は何で決まり、日照・宇宙環境・地形・粒子の配置によってどう変わるか。
public: true
scope:
  include:
  - 月面の電流収支と光電子シース
  - 月面電位の軌道観測と宇宙環境
  - クレーター・空洞の局所帯電
  - 粒子の帯電機構と移動実験
  exclude:
  - 帯電対策装置の設計
  - 摩擦帯電の詳細
  - ダストの長距離輸送量の推定
