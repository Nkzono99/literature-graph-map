  role: 中間粒径の優先的な堆積拡がり
  summary:
    question: 凝集力と重力の競合が予測する中間粒径の動きやすさは、同じ形状の粒子堆積を使う実験でも現れるか。
    method: 負にバイアスした板上に直径約5–25 µmの単分散ポリスチレンを同じ堆積形状で置き、アルゴンプラズマに1時間さらした。前後のCCD像から半径方向の拡がりを求め、曝露後の水平電位分布も測定した。
    contribution: 試験した5種類では直径15 µmの堆積が最も広がり、5・25 µmでは拡がりが小さかった。凝集を含むモデルと整合する粒径選択性を示したが、離脱時の鉛直電場・粒子電荷は未測定で、凝集係数はモデルからの逆算、Q∝d²は一意に確定していない。
