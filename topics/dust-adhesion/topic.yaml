      url: https://ntrs.nasa.gov/api/citations/19980018487/downloads/19980018487.pdf
      locator: PDF p.8–10 / printed p.790–792, Eq.(25)–(28), ξyield仮定; p.13 / printed p.795, §4.2.2, Eq.(43); p.15 / printed p.797, §5
