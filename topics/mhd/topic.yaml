- paper_id: P000406
  group: codes
  role: 物理・数値モジュールを選び、条件をそろえて性能を比べるPLUTO
  summary:
    question: 圧縮性の強い天体流体を、古典・特殊相対論、磁場の有無に応じて解く際、物理モデルと数値手法をどう組み合わせ、精度・頑健性・計算量を比較するか。
    method: 保存変数から基本変数へ変換し、再構成・Riemann解法・時間更新を分けた有限体積RSAを実装。HD・MHD・RHD・RMHDを選択し、MHDのCT/八波形式、方向分割/非分割更新、直交曲線座標を複数の検証課題で比べた。
    contribution: モジュール式の公開PLUTOと七つの検証課題を示した。回転MHD衝撃波管では指定した線形/RK2構成でHLLDがRoe並みの誤差と良い計算効率を示し、回転体や相対論的衝撃波では格子の時間制限、閉包と薄い殻の解像が結果に影響することを示した。
