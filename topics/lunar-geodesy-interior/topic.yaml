schema_version: 1
topic_id: lunar-geodesy-interior
title: 月の地形計測・重力・内部構造
question: 地形・重力・月震と試料の記録から、月の地殻構造と内部活動の履歴をどう推定するか。
synopsis:
- 月の地殻構造は、地形と重力を重ねて推定される。かぐやの地形（[@P000169]）と裏側の重力場（[@P000170]）は盆地の環状異常と中心異常を分け、地殻厚（[@P000180]）やGRAILによる密度構造（[@P000301]）へつながった。推定値は密度や補償の仮定を介するため、観測量とモデル条件を分けて読む。
- 内部活動の履歴は、反復する浅発月震（[@P000304]）、若い試料の古地磁気（[@P000288]）、コア試料の熱履歴（[@P000299]）から制約される。熱物性は全球の観測（[@P000334]）から極低温（[@P000335]、[@P000339]）へ拡張され、氷の構造が熱伝導を変える実験（[@P000338]）が加わった。
- 現地の深度測定（[@P000366]）は、軌道と試料からの推定に新しい制約を加え始めている。重力の空間分解能、地震観測点の数、試料の起源が、それぞれの推定の適用範囲を決める。
review:
- heading: 高さと重力の組合せから、地殻の厚さを推定する
  paragraphs:
  - レーザー高度計による[@P000169]は全球の地形を与える。
  - Namikiらは、SELENEのリレー追跡から推定した重力場をLALT地形と比較し、裏側・リム側の盆地縁に対応する環状異常と、補正後も残る中心異常を分けた。地殻密度2800
    kg/m³を仮定したブーゲー異常との比較で、鋭い中心ピークのType Iと、フリーエア中心高が20–60%小さい広いType IIを分類した。中心のマントル隆起・過剰補償や局所的な脆性変形、表側でのより大きな緩和は著者の内部構造・熱史の解釈であり、観測の地域差と地形・密度・流動則の条件を伴う。[@P000170]
  - '[@P000180]は、この地形と重力から地殻厚を計算した。地殻厚は密度や補償の仮定を介した推定量なので、観測された高度・重力とモデルの条件を合わせて参照する。'
- heading: 重力の空間分解能が、探せる地下構造を変える
  paragraphs:
  - "[@P000194]はGRAIL由来球面調和場の重力勾配と仮想南北軌道の相互相関を併用し、地形密度2560 kg/m³で補正したBouguer異常とfree-air異常の双方に残る線状質量欠損を抽出した。打切り・テーパーを変えても残る候補を採用する一方、極軌道の南北ストライピングにより東西構造に感度が偏る。Schröterリル延長は密度欠損2560 kg/m³の楕円断面モデルで幅3.75 km・高さ600 m・長さ約60 kmに最良適合するが、管断面を空間分解した観測ではない。モデル探索範囲・深さ依存性・寸法のトレードオフと動画による持続性判定は本文の著者報告として扱う。"
- heading: 密度構造から、衝突破砕とマグマの貫入を探る
  paragraphs:
  - "[@P000301]はGRAILとLOLAを二層モデルで解釈し、月裏側の多孔質な上層と密な下層を推定した。[@P000307]はOrientaleの地下構造を衝突後の流動と断層形成で説明する。[@P000289]では大型火山候補に伴う重力異常を貫入岩体と解釈しており、同じ重力でも地質条件に応じた密度モデルが必要になる。"
  - "[@P000307]はGRAIL/LOLA由来の地殻厚をOrientaleの軸対称衝突計算と比較し、初期地殻48–52 kmのモデルで方位平均プロファイルと環位置をおおむね再現した。52 kmモデルは中心の冷たい地殻キャップが厚いため選好され、最適モデルの薄化域半径約200 kmは噴出物起源域半径と5%以内で一致する。外側正断層は地殻・マントル境界の変位と局所薄化を作るが、重力逆解析の仮定と地殻厚程度の分解能がその見え方を左右する。長期隆起と正重力異常の説明は引用研究に依拠し、3時間の衝突計算から分けて読む。要点は機関リポジトリの投稿稿に基づく。"
- heading: 月震波形で震源と浅部構造を調べる
  paragraphs:
  - '[@P000304]は反復する浅発月震を見いだし、すべり方向と潮汐位相の関係を調べた。[@P000300]はP波の偏波とS波・P波の時刻差から、単一観測点で震源を求める。前者は断層の起動、後者は定位手法に焦点を置く。'
  - "[@P000302]はApollo17に基づく浅部速度構造で二次元合成波形を作り、H/V、地震波干渉法、並進・回転計測、DASを比較した。天井厚の影響は強い一方、底面の拘束は弱く、このモデルで1Hz超のRayleigh波が主に感度を持つのは上部10mだった。より深い構造には低周波ノイズが必要だが、その月面での利用可能性は未実証である。干渉法の群速度は空洞により高周波で増加し低周波で低下するため、位相速度の低下と区別して読む必要がある。SI Tables S1–S4は未入手で、全計算組合せと各曲線の固定条件の対応は未確認である。試料の熱履歴を使う[@P000299]は、Apollo 17コアから地中の温度勾配を求める。地震波と熱の記録を合わせることで、重力だけでは決まらない浅部の性質を補える。"
  - "[@P000304]はApollo14・15・16のSP波形を1–10Hz、P到達前後12分の窓で比較し、KO‐26/KO‐40を反復浅発月震H1と解釈した。この1対は近地点側と遠地点側で起きても同極性で、著者は潮汐応力がすべり起動を支配しない可能性を示す。応力降下7.6/3.9MPaとモーメント–半径関係は地震に似るが、震源位置の制約は弱く、浅発月震全体への一般化は残る。円形クラックモデルの半径はC=2.81、β=4.4km/s、fc=4.0–4.5Hzで本文0.36–0.41kmと報告される一方、式への直接代入との差が未解決である。"
- heading: 若い試料の磁化から全球磁場の停止を制約する
  paragraphs:
  - '[@P000288]は月裏側起源と推定される隕石の古地磁気を測り、若いApollo試料と比較した。約7億年前の弱い磁場の記録は、過去約10億年間に全球的なダイナモ磁場がなかった可能性を支持する。試料の起源と記録年代を踏まえて内部活動の時間史を読む。'
  - "[@P000288]は、裏側起源の可能性が高い月隕石NWA 15528の約0.7 Gaの角礫化時磁場を調べた。95%区間がゼロを含む12試料片と校正係数f′=4を使う主解析で、古強度0.11±0.21 μT、上限0.32 μTを得る。f′=1.34では同群の上限0.95 μT、全28片を含む平均では約1.8 μTとなり、忠実度実験の検出下限も約1 μTにとどまる。表側の既報試料と合わせ、後期の核ダイナモが全球的に停止した可能性を支持するが、起源位置と経験的な年代推定には幅があり、極微弱な後期活動は排除しきれない。"
- heading: 低温の熱伝導と、火成岩体の制約
  paragraphs:
  - Divinerの全球熱物性を求めた[@P000334]に対し、[@P000335]は100 K未満まで固体熱伝導を拡張し、[@P000339]は赤道から永久影まで一貫して扱うモデルを作った。[@P000338]は氷含有模擬物の実験で、氷量と粒子間の氷構造がともに熱伝導へ効くことを示す。火成起源の制約には、重力・磁場を共同解析したDewarの[@P000322]と、マイクロ波温度からAristarchusを調べた[@P000337]を比較できる。
  - 浅部の断熱層は、月の内部からの熱を地表温度へ結び付ける際の境界条件になる。[@P000334]は表面・深部の密度と接触伝導率を固定した1次元モデルで夜間温度へ適合させ、物性分布の尺度Hと273
    K換算熱慣性を地図化した。日周赤外観測の感度は主にcm深さにあり、密度・伝導率を独立に求める適合は非一意だった。モデルの地熱流0.018 W m⁻²は仮定した底面境界値なので、内部熱流の新しい全球測定とは区別する。
  - "[@P000331]は、粒子固有熱伝導率のGPR予測を浅層レゴリスの定常熱抵抗ネットワークへ接続した。100–101 K、平均粒径50 µm、空隙率45%のモデルでは、アグルチネート割合0〜80%で巨視的熱伝導率が2.46〜0.60×10⁻³ W m⁻¹ K⁻¹へ低下する。Diviner逆解析との照合は成熟度の相対順位を支持するが、浅層の緩い充填や逆解析条件による値の差があり、異なる手法の絶対値を混ぜた判定には較正が必要となる。"
  - "[@P000337]はAristarchus台地で、7.8–37 GHzの昼の低TB・夜の高TBに加え、3 GHzではほぼ月面一日を通じた高TBを示した。同緯度の補間格子曲線では03時の西側海に対する超過が4周波数順に約6.3・9.6・9.6・10.4 Kとなる。高い地下温度・地熱流束は説明候補だが、誘電特性、密度、埋没岩石、層構造などと分離できず、この研究はHFの大きさを制約していない。西側比較地点は宣言範囲の外にあり、夜37 GHzの原図間の温度目盛りにも未解決の差が残る。"
  - "[@P000322]は地形とMohoの重力寄与を除き、密度と磁化をVI結合で共同逆解析した。Dewar地下の幅約60 km、深さ約9 kmまでの高密度・磁化体は火成岩体と整合し、次数深度検討でも約11 kmより浅い密度成分を支持する。ただし合成試験では密度の鉛直範囲が磁化深度へ引かれ、真に非重複の体も重複解として復元される。共通位置の解を地下岩体の一意な形状とみなすには、地震などの別の拘束が必要になる。"
- heading: 高度と重力の観測を選ぶ
  paragraphs:
  - LALTのレーザー高度観測[@P000169]は、かぐやによる地形・内部構造研究の入口である。LOLAもレーザー高度を測り、GRAILは衛星間の追跡から重力場を求める。LOLA地形とGRAIL重力を組み合わせた密度構造の解析は[@P000301]、GRAILの重力勾配から空洞候補を探す研究は[@P000194]を参照できる。高度、重力、推定された密度・空洞形状を順に対応させると、観測量と逆解析の結果を区別して読める。
- heading: 軌道・試料からの推定に、ロボットの深度測定を加える
  paragraphs:
  - Divinerに基づく熱物性推定[@P000334]やApollo 17コアの熱履歴[@P000299]に対し、[@P000366]はBlue Ghost
    Mission 1のLISTERで窒素ガス掘削を実施し、0.288〜0.971 mの8深度で温度・熱伝導率を測った。測定場所と深さが分かる現地データを加える装置実証である。設計深度3
    mへの到達と熱データの詳細解析は残るため、低温モデル[@P000339]との定量照合は解析結果を待って行う。
- heading: 試料のLi同位体で内部組成を補う
  paragraphs:
  - 重力が捉える密度構造に、[@P000375]と[@P000376]のLi同位体比較を加えると、月内部の組成を別の観点から検討できる。[@P000372]は月隕石から地球に近いマントル値を支持した。
  - "[@P000375]は、初期マグマオーシャン集積岩由来と選んだ石英ノルム玄武岩2試料とオレンジガラス1試料から、月の代表δ⁷Liを+3.8±0.4‰（1σ）と推定した。地球上部マントルの約+4‰、火星玄武岩やユークライトの多くと近い一方、月玄武岩・ガラスの約+3.4〜+6.4‰の幅はRb、Li/Yb、Ga/Hfなどの分化指標と関係する。これは月内部の集積岩源の違いを示す地球化学的制約であり、月全体の直接測定値や下部マントルの確定値ではない。"
- heading: 低速度帯を、核とマントルの反応から制約する
  paragraphs:
  - "[@P000455]は核–マントル反応によるMw生成を示し、別途合成した鉄に富むMwの音速を測定して、Mw5–15 wt%、かんらん石91.5–81.5 wt%、メルト3.5 wt%の混合で既往LVZモデルのVp・Vs・密度に適合させた。Mw単独は密度が高く、Mwとかんらん石だけでは速度が高いため、引用のメルト速度経験関係が適合の条件となる。地震・測地逆解析を鉱物反応と結ぶ候補であり、深部の直接的な鉱物同定や酸素排出の観測ではない。推定の評価には混合則、酸素収支の規格化、速度誤差、試料実測組成を合わせて検討する必要がある。"
