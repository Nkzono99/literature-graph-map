  summary:
    question: 月模擬レゴリスJSC-1では、粒子同士の接触だけで帯電が起こるか。また、粒径の違いが帯電の正負にどう関係するかを調べる。
    method: 試料を75〜500 μmにふるい分け、容器壁との接触を避ける窒素流動床で混合した。帯電粒子を正負別に静電回収し、粒径分布を比較した。
    contribution: ふるい分けた試料では、小さい粒子が負、大きい粒子が正に帯電する傾向を確認した。粒子同士の接触による粒径依存の電荷分離を月模擬レゴリスで示した。
