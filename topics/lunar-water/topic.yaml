- paper_id: P000145
  group: plasma-environment
  role: 極域磁場と露出氷の空間対応・スパッタ損失抑制の仮説
  summary:
    question: 南北極の露出氷分布の違いに、永久影クレーター上空の地殻磁場による太陽風の偏向が関わるか。
    method: LP・Kaguyaの低高度で外部磁場の混入が少ない磁力計データを選び、ESD法で高度30 km・20 kmに正規化した極域磁場地図を作成。約60 km分解能で地形および既報M3露出氷推定分布と比較した。
    contribution: 南極Shoemaker・Sverdrup上空に高度20 kmで約4 nTの異常と露出氷の概略的な重なりを示し、磁場を氷のスパッタ損失計算へ含める必要を提案した。氷保存効果は先行解析に基づく仮説で、極域イオン束や損失率の低下量は未計算。
