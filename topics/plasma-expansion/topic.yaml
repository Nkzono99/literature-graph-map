- paper_id: P000100
  group: electron-models
  role: 放出条件と異方的電子分布が決めるプルーム冷却
  summary:
    question: 無衝突mesothermalプルームで、電子の局所速度分布と放出面の非中性条件は、巨視的な冷却・等温領域をどう決めるか。
    method: 実質量比の電子・イオン完全運動論静電PICで、有限幅2Dプルームを計算。主条件は陽子mi/me=1836、Ti0/Te0=0.01、vbeam/vte0=0.1、M0=4.29。ゼロ電流・非中性放出model Aと、準中性Maxwell貯蔵域model Bを比較し、方向別温度と局所EVDFを調べる。
    contribution: 非中性放出では中心域・電子冷却域・ほぼ等温域が現れ、電位井戸の内外で電子EVDFが変わる。準中性放出へ変えると巨視的構造が似ていても軸方向冷却と局所分布が異なり、単一平衡電子流体の全域適用に限界がある。
