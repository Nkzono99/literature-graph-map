- paper_id: P000390
  group: environment
  locked_fields: []
  role: LDEXの衝突検出で捉えた非対称なダスト雲
  summary:
    question: 月の周囲には持続的なダスト雲があるか。その空間分布と流星群への応答は、どの供給機構と整合するか。
    method: LADEE搭載LDEXの約80日分の稼働で得た約14万件の個別衝突を解析し、主に半径0.3 µm以上の粒子について高度・地方時・流星群との対応を調べた。衝突時の電離電荷を質量・速度モデルで粒子量へ換算した。
    contribution: 明け方に偏る持続的な雲と流星群時の増加を捉え、流入隕石モデルとの比較から彗星由来粒子の衝突による噴出物と解釈した。粒子の起源や飛行中の正味電荷を直接測った結果ではない。半径約0.1 µmの積分電流解析は別の感度条件を持ち、Szalayらと同じLDEX観測に基づく。
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-08'
