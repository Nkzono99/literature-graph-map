  role: 光電子流束・検出確率の環境依存
  summary:
    question: 月面の光電子流束と検出確率は、宇宙環境の違いにどう応答するか。
    method: 酸素Auger電子のピークでARTEMISの光電子を選別し、磁気圏ローブ中と太陽風中で統計比較。
    contribution: 光電子流束と検出確率の変動・環境依存を整理し、昼側の電流収支を制約する観測資料を整備した。
