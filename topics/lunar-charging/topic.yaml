- paper_id: P000002
  group: photoelectron-sheath
  role: 電流収支の基礎
  summary:
    question: 太陽風・磁気圏尾部や日照条件によって、月面電位はどう変わるか。
    method: 電子・イオンの流入と光電子・二次電子の放出を電流収支で扱い、表面電位を推定した。
    contribution: 昼側の正帯電から夜側・高温プラズマ中の強い負帯電までを、入射電流と放出電流の釣り合いで整理した。
