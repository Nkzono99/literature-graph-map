    question: 電子ビームで浮上した月模擬土では、捕集粒子の粒径構成が元試料とどう異なり、移動距離にどう依存するか。
    method: JSC-1に120 eVの電子ビームを1時間照射し、飛び出した粒子を粘着面に回収した。画像の投影面積に等しい円の直径を求め、各々を規格化した捕集・対照分布を比較した。移動距離からは、弾道と射出角を仮定して初速を推定した。
    contribution: 小粒子が捕集集団で相対的に多く、分布比は約23±9 µm付近で減り方が変わった。分布比は絶対的な離脱確率ではなく、接触距離と初速もモデルを介する推定である。初速と粒径の逆比例は最大粒径側の包絡線として整合し、全粒子の速度則や総輸送量を測った結果ではない。
