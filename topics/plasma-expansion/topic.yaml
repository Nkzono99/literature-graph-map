- paper_id: P000105
  group: lunar-wake
  role: 自己相似膨張から中央衝撃波・電子熱化とイオンスケール波へ
  summary:
    question: 磁力線方向の月ウェイク再充填で、電子の冷却、対向イオン流の衝突、粒子間エネルギー移送と波動励起はどうつながるか。
    method: 電子・イオンをともに粒子で扱う1次元電磁VPIC。B0に平行な移流切片で初期空洞からtωpi=14400まで追跡し、mi/me=100・Rl/di=13.2の条件で自己相似解、Hamiltonian・x成分エネルギー分配、偏波とk–ωスペクトルを比較。
    contribution: 初期の自己相似的イオン加速・平行冷却に、非等温電子の冷却と理論との差を加えて示した。中央静電衝撃波の電位差が流入イオンを減速・反射し、主に電子熱へエネルギーを移して平坦分布を作ることを診断した。右旋磁気音波の移流成長を異常サイクロトロン共鳴で解釈し、EMIC波は短い実行時間のため未確認の予測として残した。
