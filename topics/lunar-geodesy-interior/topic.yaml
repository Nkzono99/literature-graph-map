- paper_id: P000322
  role: Dewar磁気異常の埋没火成岩体
  summary:
    question: Dewarの磁場源はどのような構造で、古い月ダイナモをどう制約するか。
    method: 軌道の重力・磁場を共同逆解析し、磁化量と重なる盆地噴出物による年代制約を組み合わせる。
    contribution: 浅部の高密度・磁化体を埋没玄武岩として解釈し、約42億年前のダイナモを支持するモデル制約を示した。
