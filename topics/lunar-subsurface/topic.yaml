- paper_id: P000295
  group: mechanics
  role: 形成時の形態と構造安定性の統合
  summary:
    question: 月の溶岩チューブは、どの形状と強度なら安定に残るか。
    method: 溶岩流と崩落口の解析、数値力学を組み合わせ、幅300〜4,000 mの空洞を比較する。
    contribution: 幅約1 kmの空洞が安定に残る条件を示した。幅が増すほど大きな天井厚と引張強度が必要となる。
  inspection:
    level: abstract
    version_id: V1
    checked_by: ai
    checked_at: '2026-09-25'
    recheck: false
  evidence_by_item:
    question:
    - paper_id: P000295
      version_id: V1
