- paper_id: P000369
  group: removal
  role: EDS被覆の除去性能と耐久性
  summary:
    question: 機能性被覆は、EDSの微小放電、ダスト蓄積、耐久性をどう変えるか。
    method: CMrGO電極とHDPE基板の二相EDSにPSまたはTPFSを被覆し、高真空下の連続降塵試験で電圧、残留粒径、表面損傷を比較した。
    contribution: PSは放電を抑制し、TPFSは除去性能と耐久性の両面で良好な結果を示した。評価量は動的降塵下の蓄積抑制に基づき、事前堆積後の除去率との比較には試験方式をそろえる必要がある。
