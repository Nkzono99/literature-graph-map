topic_id: lunar-volcanism
title: 月の火山活動と年代
question: クレーター年代、玄武岩層厚、揮発性物質から火山活動の時間変化を調べる。
synopsis:
- 火山活動の時間変化は、クレーター年代と玄武岩の層厚から読まれる。年代尺度（[@P000187]）に基づく裏側の海の計数（[@P000171]）は若い活動期を示し、層厚と体積（[@P000182]）や地下反射層（[@P000181]）が噴出の量と休止期を補う。
- 噴火の駆動には水の脱ガス（[@P000246]）が関わり、地形と重力は地下の貫入岩体（[@P000289]、[@P000322]）を示す。試料の鉱物と同位体（[@P000371]、[@P000372]）は、マグマの分化段階を制約する。
- 露出表面の年代頻度を噴火率へ変換するには、保存と被覆の影響を考える必要がある。表面の堆積物、地下の火成岩体、試料の履歴は異なる観測で制約されるため、対象の時期と深さを対応させて比較する。
review:
- heading: クレーター数と層厚から、火山活動の時間と量を調べる
  paragraphs:
  - 表面に残るクレーターのサイズ別頻度を年代へ対応させる枠組みが[@P000187]である。
  - HaruyamaらのTCによるクレーター径頻度の解析では、多くの裏側海は3.0 Gaより古い一方、北部Moscovienseから南部Antoniadiまで2.44–2.58
    Gaの若いモデル年代が分布した。Apollo Nなどでは大小クレーターに異なる年代曲線を当てはめられ、古い玄武岩表面の部分的な再舗装を示唆する。著者は約2.5
    Gaの遅い活動期を考えるが、2.5–3.0 Gaの表面が若い溶岩に連続的に覆われた可能性も残した。露出表面の年代頻度を全月面の噴火率や一意の休止期間へ変換する際には、保存と被覆の影響を考える必要がある。[@P000171]
  - '[@P000182]はMoscovienseの年代に玄武岩の層厚・体積を加え、長期間の活動と薄い地殻との関係を論じた。[@P000181]の地下反射層は、表面の年代だけでは見えない噴出の休止期を検討する材料になる。'
- heading: 水の研究を、マグマの噴火過程へつなぐ
  paragraphs:
  - '[@P000246]は水と爆発的火山活動の関係を扱う。表面での水の生成・保持を扱う研究と併せると、月内部からの供給と、その後に表面で起きる移動を別々の過程として追える。'
- heading: 火山の地形と地下の貫入岩体を対応させる
  paragraphs:
  - 年代と噴出量の研究に対し、[@P000289]は直径約80 kmの二つの楯状火山候補を扱う。地形に加えて一方の重力異常を調べ、地下7〜32 kmの貫入岩体と浅部マグマ貯留域を提案した。噴火した時期に、マグマがどこに蓄えられたかという問いを加える。
- heading: 受動マイクロ波と磁場・重力から火成構造を見る
  paragraphs:
  - '[@P000337]はChang’e-2のマイクロ波輝度温度から、Aristarchusの火砕堆積物の熱的特徴と広がりを再評価した。[@P000322]はDewarの磁化した高密度体を埋没玄武岩として解釈する。表面の堆積物と地下の火成岩体を異なる観測から制約する系列として比較できる。[@P000329]・[@P000330]の統合データと基盤モデルは、火山地形の解析を他ミッションの観測へ接続する。'
- heading: 試料の鉱物と同位体からマグマの履歴を読む
  paragraphs:
  - 地形・重力に加え、[@P000378]と[@P000371]のChang’e-5鉱物分析は試料スケールで分化を調べる。前者は鉱物集団、後者は一つの玄武岩を対象とする。
  - Li同位体について、[@P000377]の高温結晶化の解釈に対し、[@P000372]は高Ti玄武岩のメルト・マントル相互作用を重視する。分化段階を比較する制約となる。
