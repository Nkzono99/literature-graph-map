- paper_id: P000036
  group: structure
  role: ARTEMISの電子・イオン観測とPICの比較
  summary:
    question: 地球磁気圏尾部の日照側月面上空で見られる電子ビームとロスコーンの時間変化を、非単調な光電子シースと入射電子・イオン温度から説明できるか。
    method: 2011年7月16日11:50–12:25 UTCのARTEMIS P1の電子・イオン・電磁場観測を、実測Te・Tiを与えた一次元PICシースモデルと比較。直線外挿で月面との磁気接続を判定し、探査機電位を加えてビームエネルギーを照合した。
    contribution: 実測イオン温度を加えて、非単調シースの極小への電位落差とビームの一時的消失を説明した。Te=500 eV・nps=10⁵ m⁻³の計算例ではTiの増加で落差が減り、観測時の温度比がモデル臨界値を超える区間にビーム消失が対応した。
  evidence_by_item:
    question:
    - paper_id: P000036
      version_id: V1
      url: https://doi.org/10.1029/2011gl050321
      locator: PDF pp.1–2, §§1–2, ¶3–7
      source_type: full_text
