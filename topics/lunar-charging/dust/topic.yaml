- paper_id: P000209
  group: mechanisms
  role: 月ダスト付着の技術報告
  summary:
    question: 月面環境で微細なダストが機器などの表面に付着するとき、どの力が支配的になり、その強さは粒径・帯電状態・表面条件によってどう変わるのか。
    method: 月ダストの物性と既存の付着研究を概説し、表面エネルギーに由来する力と帯電粒子が誘起する鏡像力の粒径依存性を比較した。測定法と除去法も検討した。
    contribution: 接触後の付着ではファンデルワールス力などと静電的な鏡像力が有力と整理した。両者の相対的重要性は電荷と粒径の関係に左右され、表面の粗さや真空下の表面エネルギーが予測の不確かさを増す。
