review:
- heading: 平均電流の釣り合いから、電荷のゆらぎへ進む
  paragraphs:
  - '[@P000233]の捕集理論を起点に、[@P000234]と[@P000235]は探針に届く粒子電流を扱う。小さな粒子を孤立球として近似するOMLと、有限寸法のシースを含む扱いを比較する際の基準となる。
    星間粒子の衝突帯電を扱う[@P000236]へ進むと、粒子を取り巻く環境に応じた捕集電流を考えられる。[@P000094]は電子放出のない静止球について改良OMLとPICを比較し、無衝突・無磁場・電子とイオンが等温の条件で、粒径による電荷と電流の誤差を評価した。'
  - 流入する電子・イオンは離散的なので、同じ環境でも粒子電荷は変動する。[@P000237]は個々の捕集による電荷ゆらぎをモデル化し、[@P000238]は電荷分布の平均と分散をプラズマの条件へ結び付けた。
    凝集体へ離散帯電を広げる[@P000241]、光電子シース中で帯電と軌道を連成する[@P000167]、月面上の微粒子加速を電荷ゆらぎから論じる[@P000270]は、平均電荷から運動を予測する際の条件を考える系列になる。
- heading: 非球形・凝集体では、粒子ごとの捕集経路が変わる
  paragraphs:
  - 凝集体では他の粒子に遮られた方向からの流入が減る。[@P000239]はこの見通しをOMLに組み込み、[@P000240]は凝集体の帯電と電子放出を扱う。[@P000242]の不規則形状粒子の実験は、電荷をどの大きさの球で近似できるかを検討している。
    Apollo試料とJSC-1Aの粒径・形状・内部空隙を三次元計測した[@P000218]は、球の近似や凝集体モデルへ与える形状の比較材料となる。
- heading: 材料の電子放出を、粉体と孤立粒子で比べる
  paragraphs:
  - 月試料の光電子放出を測る[@P000001]と二次電子放出を測る[@P000150]、両者を扱う[@P000243]は、帯電モデルへ入れる材料特性の基礎となる。[@P000021]と[@P000166]は月試料・模擬粒子の電子照射帯電を比較した。[@P000153]は粒子を個別に保持して粒径依存を測り、[@P000151]はApollo
    16土壌の総電子収率と粒子移動を扱う。単粒子と粉体層では、放出電子が隣の粒子へ戻る経路が異なる。
  - 真空中の単粒子光帯電[@P000265]と月ダスト単粒子の光電子放出[@P000005]に対し、[@P000007]は表面近くの光電子シースと飛翔中の粒子を計算した。放出の強い表面では、[@P000155]の空間電荷制限、[@P000156]の逆シース、[@P000089]の放出電子温度を含む運動論が電位分布の比較に役立つ。[@P000091]の確率モデルを使う際も、材料の放出特性と、実際に周囲へ逃げる電子量を対応させる必要がある。
- heading: 粒子層の局所帯電と、接触による電荷移動を追う
  paragraphs:
  - 表面上の粒子では、[@P000009]の電子再捕集、[@P000010]の差動帯電と導電損失、[@P000013]の粒子と基板の隙間が論点になる。[@P000037]は模擬レゴリス上の電荷を定量化し、VUV照射下の[@P000052]は正負両方の粒子を測った。光とプラズマを併用する[@P000014]、模擬物層の電子収率を測る[@P000053]を合わせると、平均電位と粒子ごとの電荷の関係を考えられる。
  - 接触でも電荷が移る。[@P000254]は模擬レゴリス粒子同士、[@P000255]は模擬粒子と異種材料の接触帯電を扱い、[@P000266]は光帯電と摩擦帯電を比較する。接触相手と照射条件をそろえることが、放出・再捕集で生じた電荷と接触履歴による電荷を整理する出発点になる。
  - 帯電を移動へ結び付ける[@P000314]は、シリカ粒子の初速・到達高度を微小空洞の帯電と粒子間反発から調べた。[@P000317]は斜長石粒子の速度と直径を測り、電荷共有モデルで説明しにくい関係を示した。電荷を測る実験と、運動から帯電モデルを制約する実験を対応させて読める。
- heading: 接触の履歴と、流れの中の粒子電荷
  paragraphs:
  - 接触帯電では、衝突回数に加えて粒子の姿勢と電荷分布も効く。[@P000308]は振動面上の単一球が帯電を止める姿勢へ移る過程を示した。二粒子を音響浮遊させた[@P000309]では、各衝突は確率的でも累積電荷は飽和則に従った。これらは月面固有の実験ではなく、接触帯電の履歴を理解する基礎となる。流れのあるプラズマでは、[@P000321]が遮蔽とウェイクによる粒子間力を整理し、[@P000318]がウェイク内の電荷変化を粒子運動から推定している。
- heading: 粒子の帯電条件を、電場による清掃へ利用する
  paragraphs:
  - '[@P000368]はEDSにイオナイザを組み込み、極性、照射タイミング、粒径、湿度などを変えて除去率と清掃速度を調べた。照射による電荷供給を調整することで、既存の表面接触や電子放出の研究に、帯電条件を能動的に選ぶ比較軸が加わる。これは気体中の清掃実験であり、月面の光電子・プラズマ環境への適用には電流源と環境条件の対応付けが必要になる。'
