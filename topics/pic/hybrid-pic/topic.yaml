schema_version: 1
topic_id: hybrid-pic
title: ハイブリッドPIC法・粒子と流体の結合
question: 粒子化する種・集団と電子の閉包、保存則、適応格子・MHDとの領域結合から、hybrid法の近似条件と宇宙への応用を比較する。
synopsis:
- ハイブリッドPIC法は、運動論を残す種・集団と流体で近似する部分を組み合わせる。イオン粒子・電子流体の準中性電磁モデル（[@P000412]）、電子慣性を残す構成（[@P000415]）、Boltzmann電子とPoisson方程式を使う静電モデル（[@P000101]）、大域MHDと局所PICの領域結合（[@P000418]）では、含む物理と解く方程式が異なる。
- 比較の軸は、電子の閉包、大域保存則（[@P000416]）、波の分散誤差（[@P000417]）、低密度域の処理（[@P000413]）にある。電子流体の近似は深いウェイクで密度と分布を変えるため（[@P000099]）、知りたい量に応じてモデルを選ぶ必要がある。
- 応用は月の大域ウェイク（[@P000420]）、ガニメデ磁気圏（[@P000419]）、極域クレーター（[@P000048]）に及ぶ。どの構成でも、閉包と境界条件を示し、格子幅・粒子数・時間刻みへの依存を確かめることが、結果を比較する条件になる。
review:
- heading: 何を粒子にし、何を流体にするか
  paragraphs:
  - hybrid PICは、運動論を残す部分と流体に近似する部分を組み合わせる計算法である。宇宙プラズマでよく使うのはイオンを計算粒子、電子を流体とする電磁モデルで、イオンの非Maxwell分布やジャイロ運動を残しながら、電子の速い運動を流体方程式へ置き換える。無質量電子を使うCAM-CL（[@P000412]）と、有限電子慣性を残すCHIEF（[@P000415]）では、含む物理と解く方程式が異なる。
  - 別の構成として、[@P000064]は高温電子を粒子、背景の熱電子とイオンを流体に分け、衝突を伴う輸送を扱う。静電hybridでは、イオン粒子とBoltzmann電子からPoisson方程式を解く構成もある（[@P000101]）。さらにMHD-EPICは、大域の流体領域と、イオン・電子を粒子で扱う局所領域を空間的に結ぶ（[@P000418]）。粒子化する種・集団と、結合する領域を最初に区別すると、同じhybridという名前でも比較しやすい。
  - 粒子と場の結合で離散収支をそろえる方法として、LapentaのECSIMは平均速度電流と電場補間に同じ重みを使い、質量行列を通じて非線形反復なしにエネルギー保存を実現する。実証は固定イオン背景中の電子PICであり、流体電子と粒子イオンを結ぶハイブリッドPICそのものの検証ではないが、結合項の仕事を両側で一致させる設計を比較する文献になる。[@P000066]
- heading: 準中性電磁モデルと電子の閉包
  paragraphs:
  - 準中性hybridでは、電子密度をイオンの電荷密度に合わせ、変位電流を省いたAmpère則から電流を求める。単一価イオンなら電子速度は、イオンの平均速度から電流/(電荷×密度)を引いた量になる。無質量電子の運動量式は、流れに伴う電場、Hall項、電子圧力勾配、抵抗を含む一般化Ohm則となり、Faraday則で磁場を進める。電子圧力を密度・温度や圧力の進化へどう結ぶかという閉包が必要である（[@P000416]）。
  - この構成はイオンスケールの波動や不安定性を調べる入口になる。一方、Debye長スケールの電荷分離や電子プラズマ振動を対象にする場合は、そのスケールを残すモデルを選ぶ。CHIEF（[@P000415]）は準中性のまま電子慣性を残し、電子流体方程式の慣性項を一部省く従来近似を改めた。本文の電子閉包は等温・スカラー圧力であり、電子慣性の導入によって電子分布関数やその異方性まで求まるわけではない。
  - "[@P000493]は、等温慣性電子流体とイオン PIC の CHIEF を用い、質量比25、βi=βe=0.5の準二次元乱流で電場計算の近似を調べた。非定常電子慣性項を落とす A1 は、ωci t=120 の電子スケール電流層の局所電流を変える。電場楕円方程式の grad(div E) を落とす A2 では、保持する laplacian E とその項がほぼ同じ大きさとなり、省略の根拠が支持されなかった。A1は項を外した再計算、A2は得られた電場の微分項の診断であり、散逸・加熱量への影響は本稿では定量化していない。"
- heading: 電流の半刻み更新・副刻み・低密度域
  paragraphs:
  - CAM-CL（[@P000412]）は、粒子速度より半刻み先に必要な電場を、イオン電流の更新から構成する。多イオン種でも粒子データの走査を減らせる点と、磁場を粒子より細かい副刻みで進める点が特徴である。無質量電子の電磁hybridでは、短波長のwhistler波が陽的な場更新を厳しくするため、粒子と磁場で必要な時間分解能を分けて考える。
  - 大規模な実装では、粒子の少ないセルも問題になる。Ohm則に密度の逆数が入るため、空乏域の電場評価と安定化処理を確認する必要がある。dHybrid（[@P000413]）は、陽的なBoris／Lax–Wendroff計算の安定条件から局所密度の下限を求め、電場評価時に適用する処理を最終手段として実装した。真空で別の場の方程式を解く方法は、本文では代案の議論に留まる。
  - dHybridの膨張雲の例では、セル当たりの粒子を8個から12個へ増やすと低密度域の問題が解消した。粒子統計の不足と物理的な真空を分けて確認する例になる。この稿では電子圧力・抵抗・電子質量を省いており、太陽風と雲の条件も実験から変更している。密度の下限や平滑化を使う場合は、空乏域の深さ・場・波動がその処理にどう依存するかを検証する（[@P000413]）。
- heading: 大域保存則と波の分散誤差を分けて検証する
  paragraphs:
  - '[@P000416]は、陰的中点法、イオン軌道の副刻みと平均、粒子から格子への割り付けを整合させ、大域の質量・運動量・エネルギー保存を導いた。電子圧力の進化には抵抗・粘性の加熱を含める。運動量やエネルギーの保存には境界からの流出・壁の力・熱流束などの条件があり、実際の保存誤差には非線形反復の収束許容値も効く。ここでいう大域の質量保存と、各セルの局所連続式を厳密に満たすことは区別する。'
  - 粒子数を増やしたり、高次の粒子形状と平滑化を使ったりすると統計ノイズを抑えられる。ただし[@P000417]は、冷たい一様背景を伝わる平行波の解析で、有限サイズのイオン粒子と電子格子の応答が完全には相殺せず、イオン慣性長dᵢより長い波でも分散誤差が残ることを示した。同論文が示す誤差の増大は、波長当たりのセル数を固定してΔx/dᵢを増やす系列である。長波長条件kdᵢ≪1だけでは足りず、格子幅Δx/dᵢと粒子形状・平滑化を併せて調べる。粒子数による統計ノイズ、保存量の誤差、波の位相速度の誤差を、それぞれ独立に確かめる必要がある。
  - "[@P000491]は陽子粒子と等温・質量なし電子流体をFLASHで結合し、Boris法、2次predictor-predictor-corrector、CTを備えたAHKASHを検証した。冷たい周期プラズマの円偏波はkdi=0.05–9で理論に約4%以内で一致した。亜音速ダイナモでは堆積後平滑化により補間法間の箱平均量の差が小さくなる一方、空間構造と必要粒子数は条件に依存する。磁場なしの128³・100粒子/セル試験では局所熱速度を再調整する冷却を0.1tcool（tcool=tth/M）ごとに適用し、目標Mach0.2と2を維持した。大配列を単精度、総和などを倍精度にする方式は、乱流の主要統計を保ちながら約10⁴コアまでの弱スケーリング試験で倍精度より約1.5倍速かった。"
  - "[@P000490]は、質量なしの電子流体とイオン粒子を結合するPegasusで、予測段階の粒子更新・再沈積を使う三段階二次積分と、面中心磁場のconstrained transportを組み合わせた。whistler安定性はh≤nΔx²/(2B)という時間刻み条件に従い、初期の離散div B=0を機械精度で保つ。冷たい電子・イオン、磁気拡散なしの波では1〜3次元の二次収束を示し、δfはLandau減衰の低振幅追跡を改善した。一方、急な衝撃波にはη=0.5（vA,0di,0単位）を用い、電子Γe=2.5の閉包を事前指定する。単粒子の保存量、格子の磁束、結合系の全エネルギーは分けて比較する必要がある。"
- heading: 適応格子とMHD–PICの領域結合
  paragraphs:
  - A.I.K.E.F.（[@P000414]）は、イオン粒子・電子流体という同じ物理モデルの中で格子を適応化し、粒子を分割・統合する。格子段階を横切る波と一様格子との比較から、細分化の継ぎ目を検証した。局所的な細分化は費用を減らす手段だが、粒子統計、場の補間、細分化境界の誤差も同じ物理条件で比較する。
  - "MHD-EPIC（[@P000418]）は、物理モデル自体を領域で切り替える。ガニメデへの三次元適用（[@P000419]）では、MHDの密度・運動量・圧力・磁場を使って局所PICを初期化し、以後は周囲の流体解から境界粒子を補充する。PICからは粒子モーメントと磁場を流体側へ戻す。局所領域では電子も粒子として扱うため、準中性イオンhybridとは電子の記述が異なる。"
  - "[@P000419]は、Hall MHDと電子・イオン双方のPICを双方向に結合し、ガニメデ磁気圏を計算した。基準格子1/32 RG・質量比100ではPICがGalileo G8に近い磁場変動とFTE様の信号を示したが、比較は軌道６％拡大と９分の出力反復を含む。高解像度Hall MHDも近いスペクトルを得る一方、密度・圧力と上流By領域にはモデル差が残り、運動論の有無と数値解像度を別々に点検する必要を示す。三次元で曲がるflux ropeはG8のFTE解釈を支えるが、観測イベントの一意再現を示すものではない。要点は採択原稿の報告に基づく。"
  - FLEKSのMHD-AEPIC結合は、局所では電子・イオンのPIC、大域では典型的にHall MHDと独立電子圧力方程式を使い、新規活性セルと境界を流体情報から作る領域分割の方式である。各方向N≥2セルのパッチを切り替えることで非箱形や離れた領域を扱う。著者が導入で説明する質量なし電子流体の従来型hybrid-PICとは電子の扱いが異なり、独立テスト粒子モードはMHDへの反作用を持たない。[@P000071]
- heading: 宇宙プラズマへの応用を、条件ごとに読む
  paragraphs:
  - 月の大域ウェイクでは、[@P000420]がWind観測からCMEの3期と比較用の上流条件を作り、それぞれを固定した三次元hybrid計算を行った。sheath期には空乏域が短くなり、後続の磁気雲・mid-CME期には長い空乏域が生じる。これは各期の条件に対する比較であり、CME通過全体を連続した時変境界で再現した結果としては読まない。電子流体と圧力勾配の扱いも、電子分布を解くウェイク研究と比較する条件となる。
  - ガニメデの[@P000419]は、Hall MHDとMHD-EPICをGalileo G8の磁場観測と比較し、基準格子ではPICを含む計算が変動のスペクトルやFTEの特徴へ近づくことを示した。比較には、観測軌道の座標を6%拡大し、9分間の計算出力を繰り返して観測時系列へ対応させる調整を伴う。イオン・電子質量比100は固定した近似条件である。高解像度のHall
    MHDでも観測に近い変動スペクトルが得られ、モデルの違いと格子解像度を併せて評価する必要がある。
  - '[@P000048]は、電子をBoltzmann関係で閉じた質量なし流体、イオンを粒子とする静電hybridをSPISで用い、陰的非線形Poisson解法で直径1.2
    kmのクレーターを計算した。境界で準中性を維持しつつ内部の電子雲の電荷分離を扱える点が特徴で、磁場を進化させる電磁hybridとは閉包・場の解法が異なる。電子の近い熱力学的平衡とクレーター径が電子旋回半径より小さいことを条件とし、粗い格子での安定性とシースの精度、短時間の準平衡と最終帯電は分けて評価する。'
  - "[@P000494]は、等温電子流体と粒子イオンを、面磁場・辺電場のconstrained transport、放物線再構成、TSC、時間中心Boris更新で連成する。多種イオンでも単位は同じ初期質量密度の純水素参照プラズマで定める。固定28000セル・100 ppc・周期境界の性能測定では1–224プロセスで良好なstrong scalingを示し、太陽風では下流系の上流MA=3.1、θ=10°、β=0.04、質量組成H90.4%・He8.1%・Oで代表した重元素約1.5%の壁反射衝撃波で下流スペクトルをAMPTE/IRMと定性的に整合させた。定量的な保存誤差・収束曲線は示されず、実装の機能、並列測定、特定条件の観測比較をそれぞれの根拠として読む。"
  - "[@P000492]は、質量なし電子流体と運動論イオンを陽的に結ぶHybrid-VPICの実装を記し、電流の線形外挿、場のsubcycling、固定真空外場を分離する開放境界を示した。1000di四方を512²セルで解く爆発例では、QS形状と10回の平滑化による非物理的な衝撃波分裂が現れ、雑音低減と粗格子分散を分けて判断する必要を示す。非磁化衝突版ではZeff依存の熱力・電子熱流束と粒子–流体衝突交換を組み合わせた。人工C質量数36・logΛ40で初期等温静水圧平衡を置いたD–C RT比較で全運動論VPICと密度断面を合わせ、約3桁の費用削減を報告する。通常C・1keV・logΛ5の長時間例や多モード例は別の設定であり、短波長成長の抑制と不完全混合層を扱う。"
- heading: 電子流体が再現できる範囲を確かめる
  paragraphs:
  - '[@P000099]の無衝突・非磁化プラズマにおける静電hybrid–full PIC比較では、イオンを粒子としてシースや軌道交差を含めても、等温Boltzmann電子の閉包が深いウェイクで電子密度と電場を変え、イオン密度にも差を生んだ。無バイアス導体平板、Mach数8、平板長140
    Debye長の例では、hybrid密度を分母にした約10%の密度差境界が正規化密度約0.15とVDFの非平衡指標Ψ≈0.02に対応する。これらは本計算の近似的な対応で、帯電物体や磁化プラズマへそのまま使える閾値ではない。'
  - イオンスラスタの[@P000101]では、Boltzmann電子密度を非線形Poisson方程式へ入れる静電hybridと、実際のXeイオン・電子質量比を使う完全PICを比較する。Poissonを解くこの構成では、イオン密度と電子密度を全域で同一に固定するわけではない。密度の大まかな形は似ていても外縁には大きな局所誤差が残り、電位にも差が出た。電子温度の異方性と中和電子の放出条件が影響した。電位差だけを単一のポリトロープ指数で直せるかは、別途検証する課題として残る。
  - 選択の出発点は、知りたい量と必要な物理である。イオンの非平衡と磁場の応答には準中性電磁hybrid、電子慣性が効く場合には慣性流体、電荷分離と表面電位にはPoissonを含む記述、局所の電子運動論には領域結合や完全PICを検討する。どの構成でも、閉包と境界条件を示し、代表的な波動、保存量、格子幅・粒子数・時間刻みへの依存を確かめる。
  - "[@P000495]は、電子慣性を電場の楕円型方程式へ導入し、密度ゼロでLaplace方程式へ移るhybridモデルを示した。残る速度除算の一粒子密度による正則化と、whistlerのCFL制約を満たす局所可変電子質量を併用し、1DのAlfvén波崩壊では初期密度の約10^-3まで低下するケースを継続した。初期真空への膨張と振幅0.2B0の波束反射も扱い、真空抵抗は担い手のない電流を減衰させる。可変質量は電子スケールを目的としないイオン過程を想定し、付録の冷たい一様プラズマ線形解析はmi/me≳(kmax c/ωpi)^4を保持波数の目安とする。極低密度界面では準中性が破れるため、数値安定性と境界の物理的正確さを分けて評価する。  電子電流と速度、抵抗加熱の更新符号には原稿上の未解決の確認点がある。"
