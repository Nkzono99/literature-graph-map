- paper_id: P000187
  group: chronology
  role: クレーター数に基づく年代尺度
  summary:
    question: 月のクレーター径と個数の分布から衝突天体の集団と衝突史をどう復元し、月の年代尺度を火星などの地球型惑星に展開できるかを検討した。
    method: 月のクレーターの大きさ別頻度から衝突天体のサイズ分布を推定し、小惑星の観測と比較した。放射年代の解釈とクレーター分布を改良して既存の月年代モデルを再検討した。
    contribution: 衝突天体のサイズ分布は主帯小惑星に近く、過去40億年間で比較的安定していたと推定した。月のクレーター年代モデルを統合し、他の地球型惑星の年代推定の基準を示した。
  evidence_by_item:
    question:
    - paper_id: P000187
      version_id: V1
      url: https://link.springer.com/article/10.1023/A:1011989004263
      source_type: abstract
      locator: Abstract、第1・3段落
      checked_at: '2026-10-06'
    method:
    - paper_id: P000187
      version_id: V1
