- paper_id: P000200
  group: contact
  role: JKRとDMTの遷移
  summary:
    question: 弾性球の付着接触で、接触域外の引力と表面変形を異なる仕方で扱うJKR理論とDMT理論を、ひとつのモデルで連続的につなげられるかを調べる。
    method: 接触縁の外側に一定の引張応力が働くDugdaleモデルを用い、応力特異性の相殺と、J積分で求めたエネルギー解放率が付着仕事に等しい平衡条件を組み合わせた。
    contribution: 単一のパラメータを変えるとDMT極限からJKR極限へ連続的に移ることを示した。接触半径・荷重・押込み量の平衡関係と、荷重一定・変位一定での離脱力を統一的に計算した。
  evidence_by_item:
