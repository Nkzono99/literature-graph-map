review:
- heading: 装置ごとの観測を、共通の月の姿へ結び付ける
  paragraphs:
  - かぐやは地形、重力、分光、レーダー、粒子・磁場を組み合わせて月を調べた。ミッションの全体像は[@P000168]、地下探査の装置と観測方法は[@P000276]を入口にできる。
  - LALTの全球地形[@P000169]は、地殻厚の推定[@P000180]へつながる。画像から得られる形と、重力から推定する内部構造を重ねる研究の流れである。
  - Namikiらは、リレー衛星を介した4ウェイドップラーと測距・既往追跡データから、軌道と次数・位数90のSGM90dを同時に推定した。地球から見えない裏側の追跡により盆地地形に対応する環状異常を捉えたが、2007年10月–2008年4月の被覆は未完了で、次数60超には事前拘束を要し、北側には観測空白が残る。重力・地形の比較は裏側盆地の支持状態や中心質量の解釈へつながった。[@P000170]
- heading: 保存データの再解析で、観測できる対象を広げる
  paragraphs:
  - LRSが捉えた海の地下層序[@P000181]に対し、[@P000176]は表面からの散乱を計算し、小規模な地下エコー候補を探している。分光データの比較では、放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]を分けて読むと、機器間の違いを追いやすい。
  - PACEでは月起源イオン[@P000185]が観測対象となった。地球起源酸素[@P000177]、月周辺のC・N・Oイオンの日変化[@P000179]へと対象が広がり、表面と周囲のプラズマを結ぶ研究に使われている。
  - Saito et al. (2008)は、月面側と反対側を向くPACEの半球視野を使い、昼側で月へ入る太陽風と月から戻る低エネルギーイオンを区別した。前日の類似事例におけるTOF測定は戻る成分がほぼ陽子であることを示す。著者は反射陽子フラックスを元の太陽風イオンフラックスの約0.1〜1％と報告し、連続2周回の最大約5 keV/qの成分を、反射後に太陽風対流電場で加速される過程と解釈した。[@P000184]
- heading: ミッションをまたいで観測をそろえる
  paragraphs:
  - '[@P000329]のSomBenchはKaguyaを含む4ミッションの観測を位置合わせし、クレーター・火山・極域を共通のデータで解析する入口を用意した。[@P000330]はそのデータから複数観測種と解像度を扱う共通表現を学習する。ミッション別の機器較正に加え、地理的な訓練・評価分割や観測幾何をそろえることが、再解析結果を比較する条件になる。両者は別論文のプレプリントとして扱う。'
- heading: 観測装置から代表研究をたどる
  paragraphs:
  - LALT（レーザー高度計）の地形観測は[@P000169]を入口にできる。地形と重力を統合した地殻厚推定が[@P000180]である。TC（地形カメラ）の画像は火山活動の年代・層厚[@P000182]を調べる。MI（多波長撮像装置）の反射スペクトルは純斜長岩の分布[@P000172]へつながる。
  - Haruyamaらは、かぐやTCの約10 m画像で月裏側の海のクレーターを計数し、Antoniadi、Apollo N・S、Nishina、Moscoviense東部に2.44–2.58 Gaの若いモデル年代を得た。Apollo Nでは700 m超のクレーターが3.51 Ga、500 m未満が2.49 Gaの曲線に沿い、著者は古い表面を薄い溶岩が部分的に覆ったと解釈した。TC画像による小クレーターの識別が、海の形成年代と再舗装の違いを検討する手掛かりになった。年代は生成関数・年代曲線に依存し、明瞭な二次クレーターと長い影は計数から除外している。[@P000171]
  - Haruyama et al. (2009)は、TCの斜め視点と太陽高度の高いMI画像を比較し、Marius Hillsの蛇行溝内に直径65 mの急峻な縦穴を確認した。壁照明のTC画像では約60 mの壁深さ、底を観測したと解釈するMI画像では80–88 mの深さを推定する。周囲の地形は溶岩チューブの屋根崩壊による開口という解釈を支えるが、地下の横方向の空洞は直接撮像されていない。[@P000183]
  - SP（スペクトルプロファイラ）では、盆地周辺のかんらん石から深部物質の露出を検討する[@P000173]をたどれる。日陰での水氷粒子候補を扱う[@P000280]も、同じ装置のスペクトルを使う研究である。
  - かぐやGRSの高いエネルギー分解能を生かし、U系列の1764.5 keV線とTh系列の2614.5 keV線を別々にフィットして、Uの全球分布図を作成した。月試料に規格化せず、γ線の放出・輸送と装置応答の計算で濃度を較正している。全球ではUとThがよく相関し、回帰の傾きは0.269±0.007だったが、裏側の二つの広域高地ではThが統計誤差内で一致するのに対してUの報告値は0.34±0.01と0.21±0.01 ppmだった。併記された±は全系統誤差を含む誤差予算としては示されず、−0.11 ppmのU補正案の適用も明記されない。Uの系統誤差の可能性を残しつつ、従来一様とみなされた高地の組成差を捉えた[@P000175]。
  - Yamamoto et al. (2025)は、SPの1 µm吸収中の小さな盛り上がりと1.8 µm付近までの反射率増加を併用し、51のイルメナイト富化スペクトル観測点を抽出した。MIを70 mセルで分類し、TC地形と合わせた局所解析では、多くの候補が高地を覆う暗い火砕堆積物に対応する。ただしMIには2 µm帯がなく、ガラスとオリビンの分類には重なりが残る。（PDF pp.3,5–7,16, §§2.1–2.2,3.1,3.2.6）[@P000174]
  - LRS（月レーダーサウンダー）は地下からの反射を測る。装置・観測方法[@P000276]から海の層序[@P000181]、GRAILの質量欠損と比較したMarius Hillsの空洞候補[@P000195]、表面散乱を考慮した保存データの再解析[@P000176]へ進める。PACEの粒子観測はIMAによる月起源イオン[@P000185]を捉える。ウェイク陽子のエネルギー変化は[@P000186]にもつながる。PACEとLMAG（月磁場観測装置）を組み合わせた研究は[@P000178]に収録している。
  - 低高度のPACE・LMAGを使う[@P000178]は磁気リコネクションの候補を調べており、磁場の分布から局所的な粒子加速へ論点を広げている。
  - かぐやの低高度LMAG観測は、Lunar Prospectorの観測と統合し、230領域のSVM逆解析から月面ベクトル場を求める基礎となった。平均月半径の球面上で最大全強度718 nTを推定し、Reiner Gammaの明るい模様と半径方向ゼロ付近・低～中傾斜の場との対応を示した。プラズマとの比較には、代表分解能が約1°であることと、静的な地殻場が太陽風で変形する条件を考慮する必要がある[@P000107]。
  - Saito et al. (2012)は、2009年4月23日の昼側・南極エイトケン盆地上空約25 kmで電子加速と陽子・アルファ粒子の減速を同時に捉え、電荷当たりの約150 eV/qの変化の対応から、かぐやより上の静的な月外向き電場を推定した。対向センサーによる粒子分布の比較により、同日の13事例でも電子加速と陽子減速が比例係数0.98、相関係数0.965で対応することを示した。[@P000111]
  - かぐやのPACE/IMAは、2008年9月24日、約100 km高度でSZA 168°付近から月ウェイク深部の陽子を検出した。深部では0.1–1 keVに広がり、本文では主要部分が上向きだったと報告される。陽子信号は深部から昼側まで続き、南極付近では約3 keVに達した。Nishino et al. は、負のByが優勢な観測条件を簡略化した軌道計算から、昼側赤道域の直下点から外れた場所で散乱した陽子の一部が、自己ピックアップとラーモア運動で夜側へ回り込み、月面近くで上向きになるType-II進入を示した。陽子が南側へ偏る領域と外向き電場による電子吸収は、この観測を説明する著者の提案である。[@P000103]
lineage:
- title: 地形・重力から地殻構造へ
  steps:
  - paper_id: P000169
    title: 全球の高さを測る
    significance: LALTから全球地形を整備し、盆地や極域の形を比較する基盤を作った。
  - paper_id: P000170
    title: 月裏側の重力を測る
    significance: 裏側の盆地縁に対応する環状重力異常を示し、地形補正後の中心異常からType I・IIを分けた。硬い地殻・リソスフェアによる支持、中心部の過剰補償や局所補償、表側でのより大きな変形を解釈したが、北側の観測空白と次数60超の事前拘束が残る予備モデルである。
    connection: 形状と重力という異なる観測量をそろえる
  - paper_id: P000180
    title: 地形と重力を統合する
    significance: 両者を用いて地殻厚を推定し、裏側盆地の構造差を調べた。
    connection: 二つの観測から内部構造を推定
- title: 観測を統合したデータから共通学習表現へ
  steps:
  - paper_id: P000329
    title: ミッションをまたぐ月データをそろえる
    significance: Kaguya等の観測を位置合わせし、共通ベンチマークを提供した。未査読。
  - paper_id: P000330
    title: 複数観測・解像度から表現を学習
    significance: 統合データから基盤モデルを学習し、複数の月科学課題で評価した。未査読。
    connection: SomBenchのデータ基盤から共通表現モデルへ
