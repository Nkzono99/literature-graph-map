- paper_id: P000403
  group: riemann
  role: 多次元Godunov法とCTの整合
  summary:
    question: セル平均を更新するGodunov流束と、面磁束を更新するCTの格子辺電場をどう整合させ、一次元への還元と二次元精度を保つか。
    method: PPM界面予測とCTU横方向補正にMHD源項を加え、面磁場を半時刻へCT更新する。角電場の勾配を接触モードで風上化し、磁場の有限体積流束を角電場の平均で補正する二次元・二次精度法を構成した。
    contribution: 面磁場とセル平均磁場の整合条件を導き、単純な角電場平均では格子に沿う流れの数値粘性が半分になると示した。整合的なCTU＋CT法は斜め線形波で二次以上に収束した一方、回転衝撃管にはセル単位の磁場振動が残った。
