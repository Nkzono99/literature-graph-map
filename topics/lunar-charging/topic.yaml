- paper_id: P000013
  group: grain-charging
  role: 単粒子と基板の隙間
  summary:
    question: 固体基板に直接載る一粒でも、放出電子の再吸収によって帯電が増し、移動できるか。
    method: Kapton膜上のSiO₂粒子を電子ビームまたは紫外線で照射し、画像から求めた移動度を粒子と基板の帯電計算と比較した。
    contribution: 粉体間の空隙を扱うPCMを粒子と基板の隙間へ広げ、再捕集と移動の関係を示した。画像から求めた移動度は、表面からの離脱率とは異なる。
