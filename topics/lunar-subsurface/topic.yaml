review:
- heading: 画像に写る縦孔を、地下構造の手掛かりにする
  paragraphs:
  - '[@P000183]はTCとMIの画像からMarius Hillsの深い穴を報告した。縦孔は観測される地形であり、溶岩チューブ天井の崩落口という解釈には、周囲の地質や壁の形が関わる。LROCの追観測[@P000192]と縦孔分布の整理[@P000193]を合わせると、個別の穴から形成機構の比較へ進める。'
- heading: レーダーと重力は、異なる地下の性質を測る
  paragraphs:
  - LRSの地下反射[@P000181]は海の層序を調べる手段となった。空洞候補を扱う[@P000195]は特徴的なエコーと、GRAILの質量欠損[@P000194]との対応を調べている。[@P000176]は表面散乱を計算して地下エコーを選別する。エコーの強さには空洞だけでなく、物質の誘電率や空隙率も関わる。
  - Mini-RFを用いた[@P000197]はMare Tranquillitatisの縦孔下の通路候補を扱う。Diviner観測と熱モデル[@P000196]は内部の温度環境を評価するが、地表の熱放射だけから奥の空洞の存在を判定する感度は限られる。
