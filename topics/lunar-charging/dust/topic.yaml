  summary:
    question: 固体表面上のダストに浅い角度で電子ビームを当てたとき、粒子はどちらへ移動するか。二次電子放出率と、ビームに面する側・陰になる側の帯電差との関係を調べた。
    method: 固体表面上のダストに電子ビームを浅い角度で照射し、二次電子放出率が1を上回る条件と下回る条件での移動を実験で比較した。結果を粒子セル法によるシミュレーションと照合した。
