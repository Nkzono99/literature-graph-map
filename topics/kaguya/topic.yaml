- paper_id: P000175
  group: geology
  role: GRSによるU・Thの独立測定と裏側高地の組成差
  summary:
    question: 月面のUをThとは別に測って全球分布を描き、全球的な共変動と裏側高地のU/Thの地域差が地殻組成に何を示すか。
    method: 2007年12月〜2008年12月のかぐやGRS観測2674時間を用い、U系列214Biの1764.5 keV線とTh系列208Tlの2614.5 keV線を干渉線からピークフィットで分離した。背景・デッドタイム・高度を補正し、放出率・輸送・幾何・検出効率の計算で濃度較正した。9°画素の分布図と広域高地の積算値を比較した。
    contribution: Uの独立した全球分布図を作成し、全球U–Th回帰の傾き0.269±0.007と裏側東西高地のUの差を示した。東西のThは0.36±0.02と0.33±0.02 ppmで統計誤差の範囲内、Uは0.34±0.01と0.21±0.01 ppmだった。著者は地殻の不均一形成を示唆するが、Uの系統誤差と形成後の元素移動を条件として残す。
  evidence_by_item:
