- paper_id: P000208
  group: mechanisms
  role: 月ダストの付着・凝集機構
  summary:
    question: 月面ダストの粒子間の凝集と異種材料への付着には、どの相互作用が働くか。粒径や帯電状態、ケイ酸塩主体の組成との関係を既刊研究から検討した。
    method: 米国と旧ソ連の既刊研究をレビューし、月土壌の物理特性と組成、Apolloでのダスト障害を比較整理した。ファンデルワールス力・静電力・Lewis酸塩基相互作用から付着と凝集を考察した。
    contribution: 月ダストではLewis酸塩基相互作用が重要と論じた。異種材料への付着は粒径で支配力が変わり、正帯電を想定する議論では、事前帯電すると粒径によらず静電力が優勢になると提案した。
  evidence_by_item:
