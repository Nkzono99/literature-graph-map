- paper_id: P000252
  group: plasma-environment
  role: Chang’E-6負イオンの太陽風依存性
  summary:
    question: Chang’E-6で観測されたH−のスペクトルは、太陽風のフラックス・エネルギーにどう応答するか。月面から放出されたH−が光脱離と電磁場の下でどこまで分布しうるかを調べた。
    method: 同じNILS観測系列の6区間を最尤解析し、200 eVから各区間の太陽風エネルギーまでの90%有意限界を超えた点から積分フラックスと平均エネルギーを計算してARTEMISと比較した。収率2.5%、昼側ENA角度分布、影で光脱離なし等の仮定を置いた5条件のMonte Carloテスト粒子計算を行った。
    contribution: 選択高エネルギーH−成分と太陽風に正相関があり、太陽風–表面相互作用と後方散乱起源の解釈を支持した。薄い昼側層と夜側の尾は計算予測で、角度・影・磁場・50 s終端時刻に依存する。月水やwake再充填への寄与は定量実証されていない。
