- paper_id: P000252
  group: plasma-environment
  role: Chang’E-6負イオンの太陽風依存性
  summary:
    question: 嫦娥6号が月面で観測した水素負イオン（H−）は、太陽風と月面の相互作用で生じるのか。その生成と月周辺での分布が、太陽風条件にどう依存するかを調べた。
    method: NILSのH−スペクトルから200 eV超のフラックスと平均エネルギーを求め、ARTEMISの太陽風観測と比較した。さらにテスト粒子のモンテカルロ計算で月周辺の分布を推定した。
    contribution: H−のフラックスと平均エネルギーが太陽風条件と正に相関し、太陽風と月面の相互作用による生成を支持した。計算では、昼側の薄いH−層と夜側に延びる尾を予測した。
