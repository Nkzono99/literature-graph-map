- paper_id: P000043
  group: grain-charging
  role: 空隙帯電による離脱とCME時の加速
  summary:
    question: 微小空隙で蓄えた負電荷による離脱と表面電場による飛行中の加速を組み合わせると、CME時の月の明暗境界で粒径ごとの到達高度と離脱頻度はどう変わるか。
    method: 3件のCME（1997年2月、1998年5月、2012年3月）のOMNI・Windプラズマデータを5分間隔へ揃え、平衡電流から表面電位・電場・Debye長を計算。単一空隙s=2aで接触力と重力を超える電荷と鉛直初速を求め、半径0.1、1、5 µmの電荷・鉛直運動を10⁻⁴ s刻みで追跡した。
    contribution: 単一空隙s=2aの計算では、3件のCMEの期間内最高高度は0.1 µmで最大約540 m、1 µmで18.22 m、5 µmで0.344 m。小粒子では電場とシース厚、大粒子では離脱時の帯電と初速が重要であり、高度増加と離脱頻度増加を分けて説明した。
