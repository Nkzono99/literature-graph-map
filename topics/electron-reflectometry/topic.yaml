- paper_id: P000006
  group: lunar-potential
  role: 太陽高エネルギー粒子イベント時の極端な帯電
  summary:
    question: 極端な粒子環境は月面の負帯電をどこまで強めるか。
    method: 1998年4〜5月のLunar Prospector電子観測を高エネルギー粒子の流入と比較し、全観測期間の大きな負帯電も検索。
    contribution: 月面–LP間の電位差が約−4.5 kVとなる事例を示した。LPも負に帯電すると見込まれるため、周囲プラズマに対する月面負電位の絶対値はこれ以上となる。大きな負帯電は磁気圏尾部通過とSEPイベントに集中した。
