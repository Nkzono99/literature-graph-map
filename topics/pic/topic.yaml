schema_version: 1
topic_id: pic
title: PIC法・プラズマ粒子シミュレーション
question: 粒子と場の結合、数値誤差、陰解法、境界処理から大規模計算まで、PICの手法と実装をたどる。
review:
- heading: 粒子と格子の往復で、分布関数と場をつなぐ
  paragraphs:
  - PIC（Particle-in-Cell）では、多数の実粒子を代表する計算粒子を動かし、その電荷や電流を格子に集めて場を求める。得られた場を粒子位置へ戻すことで、粒子の運動と集団としての応答が結び付く。[@P000059]はこの数値実験で分布関数、非線形現象、輸送を調べる考え方をまとめている。実装から学ぶなら、一次元の静電・電磁コードを出発点とする[@P000060]の教科書と、KEMPO1の教材[@P000061]が入口になる。静電場を解く部分は、Poissonソルバのテーマともつながる。
- heading: 保存則とノイズは、別々に確かめる
  paragraphs:
  - 粒子数を増やすと統計的な揺らぎは小さくなるが、場と粒子の離散化に由来する誤差も調べる必要がある。[@P000159]は粒子の移動から電流を構成し、離散的な連続の式を割り付けの段階で満たす方法を示した。
  - 格子に割り付けた電荷と電流が離散の連続の式を満たさない場合、Maxwell方程式を時間発展させるだけではGauss残差が蓄積しうる。Marder (1987)は、無次元表示の残差F=div E−ρの勾配をAmpèreの式に加え、境界でF=0となる条件のもとで誤差を局所的に拡散させる方法を示した。楕円型求解を加えず割り付け方法を固定しない一方、拡散係数は安定性と対象物理に合わせて選ぶ必要がある。2次元マグネトロン例では無次元係数d=0.001が残差を小さくほぼ一定に保ち、d=0.01は発振開始を遅らせたため、残差の大きさと物理への影響をともに確認する精度管理として位置づけられる[@P000062]。
  - 弱い不安定性では、初期粒子配置を静かにする方法と、平衡分布を解析的に扱って摂動だけを粒子で追う方法が重要になる。Sydora（1999）はモーメント補正とHammersley系列のquiet startを電磁δf法と比較した。δfマーカーは全非線形軌道を進み、重みの発展から摂動電荷・電流を求める。周期1D3Vの温度異方性whistler試験では線形成長と飽和が明瞭になり、異方性比2の例では同等のtotal-f結果にはほぼ3桁多い粒子が必要になると著者は見積もる。この比較は当該試験の粒子数を対象とする。[@P000063]
  - Kates-Harbeckら（2016）は、追跡点の間を接続した位相空間シートから電荷を格子へ投影するSICを、1Dの冷プラズマ振動、二流不安定性、Landau減衰でPICと比較した。滑らかな分布では少数追跡点でも粒子ノイズが少なく、区分線形密度は区分一定密度より速く収束した。ただし多数点では格子・有限流数が誤差を制限し、二流不安定性の非線形折り畳みでは再分割による点数増大が必要になる。水平／垂直シートの接続選択も、多ビーム不安定性と線分伸長のどちらが精度を制限するかを変える。[@P000072]
- heading: 時間スケールの差を、陰解法で扱う
  paragraphs:
  - 速い電子運動と遅い変化を同時に追うと、時間刻みが計算費用を左右する。[@P000064]は陰的モーメント法で粒子と流体を結び、衝突を伴う電子輸送を扱った。相対論的な完全陰解法（[@P000067]）も併せると、結合の解き方と保存性を比較できる。計算条件を選ぶ際には、安定性とともに対象現象の時間・空間分解能を考える。
  - Lapenta (2008)は、CELESTE3Dの陰的モーメント法で補間関数の展開から密度・電流の閉包を作り、新しい場を求めてから粒子を進める手順を整理した。これにより粒子・場結合の反復を避け、電子プラズマ振動やDebye長に固定された陽解法の安定性制約を緩和する。ただし、平均電子移動の精度条件 v_th,e Δt/Δx<1 と有限格子不安定性の条件 Δx/Δt<ςv_th,e が残り、格子幅と時間刻みは関心尺度に合わせて同時に選ぶ。時間精度はθ=1/2で2次、1/2<θ≤1で1次となる。磁気圏尾部の8桁の節約は代表的な刻み幅からの丸めた概算であり、1日対80万年を精確な速度比として一般化しない。[@P000065]
  - LapentaのECSIMは、半ステップずらした既知の粒子位置と平均速度による電流を使い、粒子の電場応答を質量行列で線形場方程式へ組み込む。θ＝1/2で粒子と場の仕事を一致させるため、完全陰解法の非線形連成反復を省きながらエネルギーを保存する。直接線形解法の1次元試験では誤差が丸め誤差水準となるが、反復線形解法では許容誤差に依存し、運動量・電荷の厳密保存や物理解の精度は別に確認する必要がある。[@P000066]
- heading: 粒子と流体の分け方を選ぶ
  paragraphs:
  - ハイブリッドPIC法では、イオンを粒子・電子を流体にする構成、静電場とBoltzmann電子を組み合わせる構成、大域MHDと局所PICを領域で結ぶ構成を区別する。電子慣性や圧力閉包、準中性近似とPoisson方程式の違いは、再現できるスケールを決める。子テーマの「ハイブリッドPIC法・粒子と流体の結合」で、数値更新・保存則・分散誤差と宇宙への応用を比較する。衝突性プラズマの集団分割（[@P000064]）も、この観点で読み直せる。
  - FLEKSでは一様な直交PIC格子の活性パッチを切り替え、時間刻みの配置を保った調整と、質量・運動量・運動エネルギーを保存する6→5の粒子統合で長時間計算の負荷を抑える。波・再結合試験では主要な非Maxwell分布を保持したが、粒子を減らした部分の雑音は増えた。空間AMRはこの刊行版では開発中である。[@P000071]
- heading: 物体形状と計算規模に合わせて構成を選ぶ
  paragraphs:
  - 月面地形や宇宙機の近傍では、表面形状に沿う格子や粒子の境界処理が効いてくる。[@P000074]は宇宙機帯電を題材に、複数のPIC手法を整理して並列実行へつなぐソフトウェア構成を示している。
  - 大規模化では、格子数と粒子数の両方が費用を決める。局所構造を細かく解く方向として、[@P000073]は疎格子のノイズ低減と適応的な格子細分化を組み合わせている。
  - Delzannoほか（2013）は、物体に沿う非一様構造格子を一様な論理格子へ写し、曲線格子の静電PICを構成した。粒子の位置を論理空間、速度を物理空間で持つhybrid moverにより、物理格子上のセル探索を省く。非直交格子の時間2次精度は、半ステップ予測と計量再補間を加えて維持する。場は保存的な空間2次離散化とBoxMGで解き、球殻の人工解で2次収束と格子数にほぼ比例するserial計算量を示した。平面壁と導体球の吸収境界では、帯電・遮蔽を解析解、OML近似、球対称PICと比較した。一様磁場の球では電子の赤道捕集が減り、負の浮遊電位が浅くなる例も示す。本論文の検証は対称性を使った2D3Vであり、複雑な宇宙機を扱う多block格子と3-D並列化は拡張計画として記述される。[@P000068]
  - 粒子の偏りと格子保持量を同時に扱う方法として、Nakashima et al. (2009) は等サイズの主領域を固定し、各プロセスが最大一つの副領域を援助するOhHelpを提案した。重い領域の粒子を複数の援助者に渡し、格子複製を一プロセス最大二領域に抑える。既存の援助関係で許容担当数を満たせる間は局所移送で維持し、満たせなくなった時に全体再割当てする。[@P000069]
  - T2K256コアの純PIC評価では、均一分布と局所集中分布の強スケーリング速度比が粒子分割参照コードの逐次に対して180.38倍・158.98倍だった。試験は、同数・等絶対値の正負電荷を持つ粒子を置いた電荷中性の系が、外部場なしでほぼ等速に動く周期境界・α=0.2の設定であり、導体を含むPoisson解法や衝突計算は拡張課題として残る。[@P000069]
  - Luuらは、同じセルの粒子を位置・運動量の広がりに応じて分割し、各集合を重み付き重心へ置き換えることで粒子数を減らした。二流不安定性では32万粒子を17.8万へ減らし、結合なしに対する最大エネルギー相対誤差は0.006、磁気シャワーの標準設定では計算時間を約6倍短縮した。総重みと運動量を保ちながら位相空間の異なる流れを混ぜる誤差を抑えるが、エネルギーは厳密保存せず、位置・運動量許容差を問題ごとに検証して選ぶ。[@P000070]
- heading: 粒子・格子の力計算にFMMを使う
  paragraphs:
  - '[@P000319]と[@P000320]は、RAMSESの粒子・格子計算でPoisson解法をFMMへ置き換える系列である。一様格子での精度・並列性の比較から、局所格子と時間刻みへの適応化へ進む。後者はプレプリントで、対象は重力場である。静電PICへの接続では、力の保存性に加えて電気的な物体境界を確認する。'
- heading: 計算出力と図の再現へ進む
  paragraphs:
  - 論文から計算条件を追うために、公開出力も参照できる。[@P000344]は空洞サイズ依存の図に対応するHDF5とNotebook、[@P000345]は流速・熱速度比の計算出力と半解析コード、[@P000346]は極域クレーターのhybrid PICのVTK・DAT出力を提供する。これらは関連論文とは別の公開データ記録であり、ここでは説明とファイル一覧を確認している。
  - Marderの補正は、境界でGauss残差F=0となる条件で、連続の式の数値誤差による発生と拡散による散逸を釣り合わせ、残差の蓄積を抑える。ECSIMはθ=1/2、整合した電場補間と平均速度電流、離散curlの積分関係を用いて粒子と場の仕事を相殺する設計で、付録の1次元周期境界ではPoynting流束の正味収支がゼロになる。保存精度は線形場方程式の求解精度にも依存する。ただし、この原稿のエネルギー証明には係数・符号の不整合が残る。Gauss残差と総エネルギー誤差は、別々の拘束・収支を点検する指標として扱う。 [@P000062][@P000066]
  - CPICは物理空間の曲線格子を論理空間へ写し、粒子の位置を論理座標、速度を物理座標で扱う。FLEKSの2023年刊行版は、一様Cartesian PIC格子のパッチを有効・無効化し、MHDと結合する運動論領域を動かす。曲線格子による形状への対応と、一様な格子幅を保ったまま計算対象領域を選ぶ方式を区別すると、境界の表現、空間分解能、計算負荷を比較しやすい。 [@P000068][@P000071]
lineage:
- title: 電荷と電場の整合性
  steps:
  - paper_id: P000062
    title: Gauss則のずれを局所的に補正
    significance: 楕円型求解を追加せず、電荷・電流の割り付けを固定しない局所拡散補正を提示した。2次元マグネトロン例では無次元係数d=0.001でGauss誤差が小さくほぼ一定になり、d=0.01では発振開始が遅れ、補正の強さが物理に影響することも示す。
  - paper_id: P000159
    title: 電荷を保存する電流を構成
    significance: 粒子の移動に伴う電荷変化と格子電流を整合させ、離散的な連続の式を満たした。
    connection: 誤差の補正から保存する割り付けへ
- title: 時間刻みとエネルギー保存
  steps:
  - paper_id: P000064
    title: 陰的モーメント法で粒子と流体を結ぶ
    significance: 衝突性が大きく異なる電子を同じ計算で扱い、輸送計算の時間スケールを広げた。
  - paper_id: P000066
    title: 半陰解法でエネルギーを保存
    significance: 周期境界・整合する補間とcurl演算子の下で保存機構を導き、直接線形解法の1D1V/1D3V試験で全エネルギー誤差約10⁻¹⁴–10⁻¹⁵を示す。無ドリフトMaxwell平衡ではDebye長を大幅に未解像にしても数値加熱を抑える。
    connection: 陰解法の保存性を高める
  - paper_id: P000067
    title: 相対論的な保存計算を構成
    significance: 完全陰的な粒子と場の更新で、相対論的運動を含む系のエネルギー保存を扱った。
    connection: 相対論的な完全陰解法と比較
