- paper_id: P000277
  group: calibration
  role: 観測機器間の放射輝度比較
  summary:
    question: 空間・分光分解能や観測時の照明条件が異なる、かぐやとチャンドラヤーン1号の光学機器は、月面の放射輝度をどこまで一致して測定するか。
    method: 2008～2009年の両衛星の放射輝度データを機器間で相互検証し、較正用に系統的に取得した地上望遠鏡の観測データとも比較した。
    contribution: 月物質の全体的なスペクトル特性は機器間で一致したが、小さな系統差が残った。着陸地点の遠隔観測輝度は持ち帰り土壌の室内測定からの推定値より低く、著者らは表層の微細構造の再現困難さを主因とした。
