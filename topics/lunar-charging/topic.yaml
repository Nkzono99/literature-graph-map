schema_version: 1
topic_id: lunar-charging
title: 月面帯電
question: 月面の電位、光電子シース、ダストの帯電と移動を、基礎・観測・地形・材料・探査技術から整理する。
review:
- heading: 月面電位から、表面の上に広がるシースへ
  paragraphs:
  - 月面にはプラズマの電子とイオンが流れ込み、紫外線や粒子の衝突で電子が放出される。その電流の釣り合いが表面電位を決める。月試料の光電子放出を測った[@P000001]と、電流収支を整理した[@P000002]が基礎になる。放出電子が表面近くにとどまると、電位が空間的に変わる層、シースが生じる。粒子と電場を追跡する[@P000007]のPIC計算、[@P000030]の室内計測、[@P000036]の観測との比較は、この構造をそれぞれ異なる方法で調べている。
- heading: 月面電位を変える宇宙環境
  paragraphs:
  - ApolloのCPLEEなどによる初期の粒子計測（[@P000018]）に続き、Lunar Prospectorは軌道上の電子から夜側の負帯電や、磁気圏尾部・太陽活動に伴う強い帯電を捉えた（[@P000003]、[@P000004]、[@P000006]）。[@P000025]は探査機電位の補正を含めて入射電流との対応を定量化し、[@P000027]はSEPイベントの観測と予測を比較した。ARTEMISでは昼側シースの遠隔計測（[@P000034]）や、微小隕石衝突による電流の寄与（[@P000045]）へと論点が広がる。かぐやによる地殻磁場と相対電位の研究（[@P000051]）、IM-1のROLSESによる電波・プラズマ波観測（[@P000056]）も、月面の電気的環境を知る手掛かりになる。
- heading: 極域と空洞では、地形が粒子の到達を変える
  paragraphs:
  - 永久影では光電子が出にくく、地形が太陽風も遮る。[@P000058]は電子とイオンの入り込み方の違いから、クレーター内の電気的環境を論じた。LOLA地形を使う[@P000031]、表面帯電とプラズマを解く[@P000008]、三次元のミニウェイクを扱う[@P000048]は、形状と流入条件を具体化している。深い空洞では、側壁で電子が失われると底へイオンが届きやすくなり、底部が正に帯電する場合がある（[@P000012]）。空洞寸法とシース厚の比による正電位の緩和は[@P000015]、流速と熱速度の比による底部電位の変化は[@P000016]へとつながる。南極の実地形を含む計算は[@P000017]が扱う。
- heading: ダストの離脱と輸送を、粒子の電荷から考える
  paragraphs:
  - Surveyorの地平線光（[@P000019]）を背景に、[@P000022]は電場で加速されたダストの上昇と落下を噴水モデルで表した。離脱そのものを理解するには、表面の平均電位に加えて粒子間の隙間や付着力が重要になる。電子照射下の移動実験（[@P000029]）、局所的な再吸収を扱うpatched
    charge model（[@P000009]）、VUV照射下で正負の粒子を測る[@P000052]が、その機構を調べる。電子収率（[@P000053]）や導電損失（[@P000010]）は電荷の蓄積を左右する。
  - 観測からは、LDEXが高度3–250 kmの測定範囲で浮遊ダスト密度に上限を与えた（[@P000039]）。一方、薄明クレーター付近の5つの増加イベントを局所的な噴水と解釈した研究もある（[@P000044]）。粒径・高度・地形・太陽風条件を対応させることが、実験での離脱と月上空での粒子分布を結び付ける鍵になる。
- heading: 探査機の帯電と、付着ダストへの対策
  paragraphs:
  - 機器への影響を考える際は、表面間の電位差や材料の違いが問題になる。[@P000024]はNASCAP-2Kによる機体の帯電解析、[@P000054]は月ミッションの帯電環境を整理した。除塵には電極が作る電場を用いるEDS（[@P000028]）があり、イオン中和（[@P000049]）やEDSとUVを組み合わせたブラシ（[@P000050]）の特許もある。これらは、自然のダスト移動で扱う電荷と力の関係を、機器側から制御する技術として参照できる。
lineage:
- title: 電流収支から空間構造へ
  steps:
  - paper_id: P000002
    title: 昼夜の電位を電流収支で捉える
    significance: 粒子の流入と電子放出をまとめ、日照やプラズマ環境による帯電の違いを説明した。
  - paper_id: P000007
    title: 光電子シースを粒子計算で解く
    significance: 電子分布と粒子の帯電を時間発展で追い、表面近傍の電位とダスト運動を結び付けた。
    connection: 表面電位から周囲の分布へ
  - paper_id: P000008
    title: 地形と太陽風侵入を結び付ける
    significance: クレーターへのプラズマ膨張と表面帯電が互いを変える過程を計算した。
    connection: 地形の陰に入るプラズマへ
- title: ダスト浮遊から粒子間の帯電へ
  steps:
  - paper_id: P000019
    title: 地平線光をダストと結び付ける
    significance: Surveyorの画像に見える光を低高度のダスト散乱として解釈し、浮遊研究の起点を作った。
  - paper_id: P000022
    title: 上昇・落下を噴水モデルにする
    significance: 電場による加速と弾道運動から、粒径や帯電条件に応じたダストの高さを予測した。
    connection: 光の解釈から粒子の運動へ
  - paper_id: P000009
    title: 空隙の電子再吸収で離脱を説明
    significance: 粉体面の微小な空隙に電子が集まるPCMを提案し、粒子を押し出す局所電荷に着目した。
    connection: 離脱を生む局所帯電へ
