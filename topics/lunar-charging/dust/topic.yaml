schema_version: 1
topic_id: lunar-charging-dust
title: 月ダストの帯電・付着・静電輸送
question: 電子放出と粒子電荷、微小な隙間での帯電、付着面からの離脱と上空への輸送。
review:
- heading: 月試料の力学と帯電を、輸送の全体像へつなぐ
  paragraphs:
  - '[@P000256]の総説はApollo試料の力学特性と帯電・輸送研究を結び付け、離脱時の電荷分布や微小粒子の実験不足を当時の課題として挙げた。[@P000249]はダストの生成、粒子の物性、移動経路、探査への影響まで整理する。以下では材料の電子放出、接触が破れる条件、飛翔中の電荷変化を順にたどる。'
- heading: 光電子と二次電子は、粒子ごとに出入りする
  paragraphs:
  - 月ダストの帯電を定量化するには、電子放出と粒子電荷を対応させる必要がある。[@P000021]は月試料などの帯電、[@P000037]は模擬レゴリス表面の電荷を扱う。[@P000005]は保持した月試料・JSC-1の単粒子へ3波長のUVを当て、電荷減少から光電子効率を求めた。中性極限への外挿と光吸収モデルを介する収率は、調べたサブミクロン域では小さい粒子ほど低く、大粒子で漸近する傾向を示し、材料によっても異なる。正電位の平衡例はポリスチレンで、月試料の平衡電位や離脱を直接測った結果とは区別する。
  - 真空実験の[@P000265]と[@P000266]では、導体は孤立したUV照射で正、面から出た光電子を集める層内では負に帯電した。絶縁体・模擬土には短い照射時間でも初期の接触電荷が残る。[@P000255]は接触材料と反復振動による電荷分布の変化を調べた。平均がゼロでも正負粒子が共存し、接触履歴や検出下限をそろえないと、粉体の平均を個々の粒子へ移せない。模擬粒子同士の[@P000254]も、接触相手を比較する文献となる。
  - 粉体表面の電荷を考える[@P000391]は、照射を止めた後に外部電圧で回収した粒子から、大きな負電荷を測った。UVや電子ビームによる電子再捕集と整合するが、回収・検出できる集団の正味電荷であり、照射中の局所パッチ電荷を直接測ってはいない。
  - 光電子・二次電子放出を整理した[@P000243]も、単粒子、接触中の粒子、粒子層で電子の出入りが異なることを考える基礎となる。
  - 粒径と乾燥処理をそろえた比較では、Apollo 17試料の電子衝撃帯電から推定する二次電子収率はMLS-1とJSC-1の中間でMLS-1に近かった。対象は半径29±3
    μm、20–90 eVビームと背景熱プラズマにさらす孤立粒子である。二峰性電荷分布と複数の平衡を示す一方、低エネルギー測定で収率のピークは一意に決まらず、細粒や接触粒子層、UV照射下への一般化には追加の検証が要る[@P000166]。
  - '[@P000052]の高真空VUV実験では、バイアス動員したJSC-1A粒子の電荷が約1 fCから数百fCに広がり、検出器の電圧を±2.5から±3.5 kVへ上げるとcountsが約23〜42倍増えた。電荷分布と、重力・凝集に打ち勝って入口に達する選択を併せて扱う必要がある。再落下粒子の衝突・摩擦帯電が生じ得るため、自然のVUV帯電分布や月面離脱しきい値への換算は残る課題である。'
  - Vegaほかは、月模擬レゴリスの固定粒子層を導電性テープへ保持し、電子照射と毎パルス間の中和によって収率曲線を得た。これは模擬物を使う帯電・付着・静電輸送の地上試験に必要な放出特性を補う。試料を中和せず照射すると全収率は約1へ低下し、帯電状態が放出応答を変えることも確認した。実月試料や多層・多孔質層への転用は未確定で、付着力・浮揚量・輸送距離を直接測定した研究ではない。[@P000053]
- heading: 付着した粒子が離れるまで
  paragraphs:
  - 離脱には、電気力が重力に加えて接触を支える凝集力を越える条件が必要になる。[@P000387]は球と平面の凝集と平均電荷配分を仮定し、小粒子側の凝集、大粒子側の重力により中間半径で必要電場が最小になると予測した。接触が解除される条件と、上向き加速度・初速を得る条件も区別する。[@P000388]では同じ形状のポリスチレン堆積をプラズマへさらし、試験した5種類で直径15
    µmが最も広がった。粒径選択性はモデルと整合する一方、凝集係数は逆算値で、離脱時の鉛直電場と粒子電荷の直接測定が残る。
  - '[@P000392]は電子ビームを当てたJSC-1の捕集粒子を比較し、小粒子側が相対的に多い分布を得た。捕集・対照を別々に規格化した分布比は、絶対的な離脱確率ではない。ポリスチレン、負バイアス、熱プラズマを使う[@P000388]とは材料・帯電・接触条件が異なるため、二つの粒径傾向は条件を対応させて比較する。'
  - 月ダストの付着・凝集機構[@P000208]と技術報告[@P000209]は、接触力の独立した評価へつなぐ資料になる。遠心法[@P000210]や真空・UV条件の付着試験[@P000211]と対応させて読む。Apollo試料とJSC-1Aの三次元形状[@P000218]は、粒径・空隙・接触の幾何を与える。
  - プラズマ中で起きる粉体の縁からの移動（[@P000026]）や電子照射による基板との帯電差（[@P000029]）は、局所電場の役割を示した。[@P000009]のpatched
    charge modelは粒子間の空隙に再吸収される電子を扱う。[@P000013]は粒子と基板の隙間へと展開する。UVと付着力を扱う[@P000040]、光とプラズマを同時照射する[@P000014]も離脱条件を調べる実験となる。電荷が残る時間には導電性（[@P000010]）が効き、内部への蓄積モデル（[@P000057]）へ論点が広がる。
  - 空隙帯電を組み込んだOrgerらの計算では、離脱に必要な電荷が初速を与え、その後のシース内運動が最高高度を変える。単一空隙s=2a、半径0.1・1・5 µmを3件のCME条件で比較すると、0.1
    µmはシース内で加速して最大約540 mに達する一方、5 µmはシース内で上昇を止め、高度は約0.3 mに留まる。小粒子ほど離脱までの帯電が遅く、0.1 µmでは分～時間を要するため、高い到達高度と多い離脱粒子数は直結しない。著者は5
    µmの高度をSurveyorの低高度horizon glowに近いと述べるが、粒子密度や輝度の一致までは示していない。[@P000043]
  - ダストの帯電では、粒子表面を越えた電子が隣接粒子に再吸収されると、両粒子を含む領域の正味電荷が変わらなくても局所的な正負電荷分離が生じる。[@P000057]は、この粒子間移動とバルク外への脱出を区別し、残った分布を地下の体積電荷源へ結ぶ枠組みを整理した。粒径・空隙・鉱物・既存電位が保持応答を変えるため、局所電場とダスト挙動を比較するにはそれらの条件も必要になる。地下帯電による浮上量や、付着力を超える粒子の離脱は今後の検証課題である。
  - 放出過程を除塵へ使う[@P000164]では、VUVと電子ビームを布上の模擬粒子へ同時照射した。移動開始の条件が下がる結果は、太陽に似た波長分布・月面より高い光強度の実験から得られている。
  - 外部電場を加える[@P000215]では、光電子の軌道と粒子離脱が電場の向きに応答した。[@P000216]は局所電荷のゆらぎから求めた力を付着モデルと比較するが、成否は電荷・配置・粗さ・清浄度の仮定に依存する。斜入射電子ビームの[@P000250]は、照射側と陰側の帯電差を移動方向へ結び付けた。
  - 機器への応用では、受動表面の比較[@P000257]、ZnO薄膜とテクスチャ[@P000258]、導電性ポリイミド[@P000259]が付着を変える手段となる。[@P000260]はUVを電場による除塵に併用する。粒子を保持する力と電場が与える力を、各実験の材料・照射条件で比較する。
  - '[@P000047]は、深い空洞の浅部が電子を捕集し、底部がイオンで正帯電する局所電荷分離を取り上げ、微小スケールの局所電位差がダスト運動に関わる可能性を論じた。これは既存PICの紹介に基づく研究展望であり、実際の微小空隙の電位やダスト放出量を測った報告ではない。電子放出後の再捕集、導電性、放電などによる電位差の緩和を検討しつつ、模擬月土壌の機械的な粒子運動とモデルの粒子帯電を突き合わせる方針を示している。'
- heading: 地平線光から、上空のダスト分布へ
  paragraphs:
  - '[@P000022]は電場で加速された粒子の噴泉モデルを提案した。別の2007年会議録[@P000389]は指数減衰する電位を取り入れ、シース内で折り返す低高度解を追加した。初期電位と孤立球容量を与える条件付きの高度予測であり、凝集離脱や供給率は求めていない。'
  - Surveyor 7の地平線光では、撮像系の広がりを考慮しても20 cm以上の鉛直厚さがあり、前方散乱モデルの下で半径5–6 µm、柱粒子数約50 grains
    cm⁻²が推定された。太陽の部分遮蔽で輝度減衰を補正すると柱粒子数は37–84 grains cm⁻²となるが、照明曲線は観測輝度へ合わせており、増加の解釈にはその仮定が入る。著者はHG発生域の局所攪拌量を約0.03
    g cm⁻² yr⁻¹と推定した一方、広い範囲での重要性と正味輸送の評価を残した。[@P000019]
  - '[@P000042]は、太陽風と光電子放出による平衡帯電をDynamic Fountain Modelへ接続し、離脱後の粒子の最大高度を比較した。式の半径定義に対応させて読んだTable11では、半径0.1
    μmの明暗境界高度は通常太陽風で約1.1–1.3 km、初期CMEで0.34 km、後期CMEで0.09 kmとなる。一方、直下点ではフレアを含む初期CMEが100.56
    mと最大である。約100 kmへ達する表の行は半径0.01 μmであり、凝集力を超える初期離脱の条件と地平光の再現は未検証である。初期CMEの直下点など、粒径間の高度比には式との不一致が残る。'
  - 日夜境界の[@P000221]は定常・準中性ウェイクを表面の電流収支へ組み込み、滑らかな月面の鉛直電場と、付着力を省いた試験粒子の加速を計算した。地形の陰に生じる夜側向き水平電場は定性的な説明にとどまる。
  - クレーターの地形による電場の弱まりは、穴内でダストに作用する電気力の条件を考える手掛かりとなる。Wangほかは光電子を生成しない熱アルゴンプラズマで、半径1
    cmの穴に対してシースが厚くなるほど内部の電位勾配が小さくなることを測った。ダストの離脱量やポンド形成を測った研究ではなく、太陽風の流れと紫外線による光電子生成を今後の実験に残している。[@P000263]
  - '[@P000267]は、導電板上の負のアルゴンプラズマシースでポリスチレン球・中空ガラス球・JSC-1の浮揚を観測した。粒径のそろった球でOMLと浮揚高さを照合し、JSC-1の約0.8〜2.0
    cmの高さには力釣り合いから推定した径2〜10 µmが対応する。直径10 µmのポリスチレン球への弱いUV照射では、板電位−40〜−80 Vの5条件で高さが0.11〜0.15
    cm低いが、各高さ±0.10 cmの不確かさがある。板のシース形状に有意変化がないことから、著者は粒子の光電子放出による負電荷の減少と解釈した。約−30 Vより負で撹拌なしの離脱も起きるが、付着力の値は接触電位を仮定した推定である。月への比較では、浮揚の維持と表面付着を越える離脱、負のプラズマシースと日照側の光電子シースを分けて読む必要がある。'
  - LDEXの個別衝突を解析した[@P000390]は、主に半径0.3 µm以上の粒子で明け方に偏る雲と流星群時の増加を捉え、流入隕石モデルとの比較から衝突噴出物と解釈した。同じ観測キャンペーンの[@P000039]は積分電流から半径0.1
    µmを仮定し、各境界通過時の機体速度を用いて、高度3–250 kmの日の出側で密度上限を求めた。太陽風中で約100 m⁻³、磁気圏尾部で約40 m⁻³という上限は、残る低エネルギーイオン信号までダストとして数えた値である。異なる検出方式の二つの解析であり、独立した観測の再現とは扱わない。
  - これらの上限は測定した粒径・高度に対する制約で、高度3 km未満の局所的な移動まで確定するものではない。到達高度のモデル、離脱する粒子の供給、検出可能な密度をつなぐことが、実験と観測の照合に必要になる。
  - '[@P000044]は太陽風擾乱・磁気異常・個別衝突増加を照合して、Copernicus近傍3例とPlinius近傍2例の反復する積分電流増加を残した。半径0.1
    μmを仮定した密度換算と、風下壁の強い負電位からの軌道計算は、クレーター下流側へ広がる局所ダスト噴水と整合する。ただし著者はEvent2の高度には半径0.05
    μm以下を、一部の上流側信号には0.1 μmより小さい粒子を求める。Events2・3の弱い上流側二次ピークは、現手法で太陽風由来の電流背景から分離できない。表面からの静電離脱を直接確認した観測としては扱わず、選別した電流の局所ダスト雲による解釈として位置づける。'
- heading: 飛翔中の電荷と、離脱前の履歴
  paragraphs:
  - 粒子への捕集電流は[@P000233]の理論にさかのぼれる。[@P000094]の読了したarXiv版は、非放出・静止球の修正OMLとPICを比較し、遮蔽を解いて求める電荷と捕集電流の精度が異なることを示した。電位が近くても、孤立球容量を使った電荷が正しいとは限らない。無衝突・無磁場・電子とイオンの温度が等しい条件と電子Debye長を確認して、月面近くの放出・流れを伴う粒子へ適用する範囲を考える。
  - 電子・イオンが一つずつ出入りする電荷ゆらぎ[@P000237]と、その確率分布[@P000238]は、連続量として電荷を使う条件を考える基礎となる。凝集体では見通しによる捕集[@P000239]、電子放出を含む帯電[@P000240]、離散的な帯電[@P000241]を組み合わせて読む。不規則形状の測定[@P000242]は、どの球形近似が粒子電荷を表せるかを検討する。
  - 月面から離れた不規則粒子の帯電を考える際、[@P000240]の孤立凝集体計算は形状の補正を比較する基礎となる。1 AUのモデル例では、構成粒子間で放出電子が再捕集されるため、光電子供給の条件によって球との電荷の大小や符号が変わった。月面上の粉体へつなぐには、接触、基板への電荷移動、付着力、光電子シースを追加して、離脱する条件と粒子の総電荷を対応させる必要がある。光電子の数値比較には、原稿内の式と供給率の不一致が残る。
  - 離散帯電[@P000241]の読了した2017年arXiv稿は、100 nm球が電子数個分の負電荷を持つPPD条件では、電荷の表面位置によって等電位面が非対称になる例を示した。成長計算では、ゆらぎを衝突前に抽出して固定するPPDと、衝突中も更新するLABの両方で、局所電荷を残すモデルが細長い凝集体を作る。月面の帯電と輸送へ比較する際には、一次捕集だけの孤立粒子モデルという条件を保ち、光電子・二次電子放出、電荷緩和、基板との接触を加えて確かめる必要がある。
  - 粒子が動く間にも電子とイオンは出入りする。[@P000167]は光電子シース中の軌道を連続・離散帯電で比べ、希薄プラズマでの静止浮遊や繰り返す跳躍の条件を調べた。着陸時の[@P000165]では、噴射中の衝突で得た摩擦電荷が、停止後にプラズマとの平衡へ緩和する過程を追う。どちらも、運動と同じ時間軸で電荷を扱う点が比較の軸になる。
  - 光電子シース中のダスト音波の非線形発展[@P000268]と、太陽系ダストプラズマの電荷変動・散逸[@P000269]は集団の応答を扱う。[@P000270]は電荷ゆらぎによる微粒子加速を論じる。単粒子の軌道から集団の波動へ対象を広げる際には、粒子密度と帯電時間を対応させる。
- heading: 浮遊条件から、離脱初速と方向へ
  paragraphs:
  - 光電子シースと粒子運動を計算した[@P000007]は、飛翔中の電荷変化と浮遊条件を考える前段となる。動的帯電を扱う[@P000167]との比較では、表面接触の破断を別の過程として扱う。真空実験の[@P000314]・[@P000315]は、局所帯電と粒子間反発を初速・到達高度へ結び付ける。[@P000316]は射出角と粒径の分布を追加し、斜長石を使う[@P000317]は速度と直径の関係から帯電モデルを制約した。飛翔中の帯電、離脱の条件、離脱直後の速度を合わせることで、輸送計算の入力を具体化できる。[@P000217]の日照域での打ち上げ速度の評価も、この初期条件を考える文献となる。
  - '[@P000317]は350 eV電子照射下の斜長石で、粒径信号の約79%が5 µm未満であることと、細粒ほど鉛直速度の上限が高い関係を測った。複数粒子のほぼ同時検出もあり、粒子間接触の変化による連鎖的離脱を提案する。速度から換算した高さは、正の表面と薄いシースを仮定すれば約70%が5
    cm未満となるが、月面30 cm未満という外挿には同じ電場・射出条件を置いている。表面電位の未測定と月の電子電流・シース長の差を保って比較する。'
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - 粒子が表面を離れる条件と、離れた後の運動は分けて評価する。[@P000042]は太陽風・紫外線から求めた月面電位を用い、離脱後の球粒子の最大高度を電位の二乗に比例、半径の二乗に反比例する式で計算した。凝集力を越える初期離脱は計算に含めない[@P000042]。[@P000267]は地上の負バイアス導電板上のアルゴンシースで、直径10.0±0.5
    μmの球の安定浮揚高を測り、測定電位の勾配と重力の釣り合いから電荷を推定した。板からの離脱も観測し、付着力は接触粒子が板と同電位になる仮定で見積もった。弱UV照射も、板の光電子放出がプラズマ収集電流より小さい負シース条件に限られる[@P000267]。両者は、初期離脱、安定浮揚、最大到達高度という段階と、帯電・重力・接触条件を対応させて比較する必要がある。
lineage:
- title: 飛翔中の帯電と輸送
  steps:
  - paper_id: P000022
    title: 電場による上昇と落下をモデル化
    significance: 粒径と帯電条件から、ダストが到達する高さを噴水モデルで予測した。
    connection: ''
  - paper_id: P000389
    title: シース内の低高度解を加える
    significance: 指数減衰電位で折り返し高度を求めた。初期電荷と凝集離脱・供給率は仮定に残る。
    connection: 2006年の先行モデルを参照し、シース内の運動へ改良
  - paper_id: P000167
    title: 電荷の時間変化と離散性を入れる
    significance: 光電子シース中で帯電と運動を連成し、電子の出入りが軌道を変える条件を調べた。
    connection: ほぼ一定な電荷の高度予測と、飛翔中の帯電・運動の連成を比較
  - paper_id: P000165
    title: 着陸時に得た電荷の履歴を追う
    significance: プルーム停止後も摩擦電荷が残り、微粒子の輸送予測を変える過程を計算した。
    connection: 動的帯電を自然シースとプルームで比較
- title: 粒子が離脱する電荷を探る
  steps:
  - paper_id: P000029
    title: 放出率の違いでダストを動かす
    significance: 電子照射下で基板と粒子の帯電差が電場を作り、移動や離脱を促すことを実験で示した。
    connection: ''
  - paper_id: P000009
    title: 粉体の空隙に電子を集める
    significance: 電子の再吸収で粒子の局所電荷を増やすPCMを提案し、跳躍の機構を説明した。
    connection: 基板との電位差から粒子間の帯電へ
  - paper_id: P000391
    title: 回収粒子の負電荷を測る
    significance: 照射停止後の外部抽出で測った正味負電荷を、電子再捕集の予測と比較した。
    connection: 再捕集モデルの電荷を、回収・検出条件を伴う測定で検討
  - paper_id: P000014
    title: 光とプラズマの同時照射へ広げる
    significance: 同時照射で粒子の飛び出しと推定負電荷が増え、charge pumpingで説明できることを示した。
    connection: 再捕集を検討する実験と、光・プラズマの同時照射を比較
- title: 局所帯電から離脱初速・角度へ
  steps:
  - paper_id: P000314
    title: 微小空洞の帯電と離脱高度を比較
    significance: シリカの真空実験を粒子間反発と表面電場の予測へ照合した。
    connection: ''
  - paper_id: P000315
    title: 初速の粒径・形状依存を測る
    significance: 離脱直後の速度分散と最大初速の粒径依存を示した。
    connection: 到達高度の評価から輸送の初期条件へ
  - paper_id: P000316
    title: 射出角と距離ごとの粒径を測る
    significance: 高速度撮影と捕集から粒径・角度・距離を結び付けた。
    connection: 初速に加え射出方向と運ばれる粒子を制約
  - paper_id: P000317
    title: 斜長石粒子で電荷モデルを比べる
    significance: 電子照射した斜長石の粒径と速度から、電荷共有・孤立球・局所帯電モデルの条件を制約した。電荷・電位・電場は直接測定していない。
    connection: シリカ等の実験から月面鉱物に近い試料へ
- title: 凝集と帯電条件による粒径選択性
  steps:
  - paper_id: P000387
    title: 凝集と重力から離脱閾値を求める
    significance: 球と平面の接触と平均電荷配分を仮定し、中間半径で必要電場が最小となると予測した。
    connection: ''
  - paper_id: P000388
    title: 中間粒径の堆積が広がる実験
    significance: 先行理論を参照し、5–25 µmのポリスチレンで中間粒径の優先的な拡がりを測った。電荷と鉛直電場は未確定である。
    connection: 凝集を含む閾値予測を、同じ形状の堆積実験と照合
  - paper_id: P000392
    title: 電子ビーム下の捕集粒径を比較
    significance: JSC-1では小粒子が捕集集団で相対的に多いと報告し、再捕集モデルと比較した。絶対的な離脱確率ではない。
    connection: 中間粒径の実験を参照し、異なる材料・帯電条件の粒径選択性と比較
