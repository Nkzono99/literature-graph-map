- paper_id: P000113
  group: kinetic-models
  role: 双極子の向きによる中心流入と環状遮蔽の違い
  summary:
    question: 表面法線方向の双極子は、電子とイオンの運動の分離、局所反射、中心カスプと周囲の表面遮蔽をどう変えるか。
    method: IMFを省いた三次元の全運動論的電磁PIC（iPic3D）で、表面下13 kmの単一法線方向双極子を計算する。上流はn=3 cm⁻³、Ti=Te=35 eV、v=(-350,0,0) km/s、縮約質量比mi/me=256。電磁場の開放境界と完全吸収する月面を用いる。
    contribution: 中心カスプには従来型の小磁気圏が形成されず、周囲に部分遮蔽の環ができる。最も強い局所遮蔽は電子71%、イオン28%。カスプ直上の限定された分布で反射イオン成分が約21%を占める。
