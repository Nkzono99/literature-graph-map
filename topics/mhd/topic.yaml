- paper_id: P000396
  group: solar-wind
  role: 太陽風の流体理論
  summary:
    question: 高温の太陽コロナから、持続的な外向き流れはどう生まれるか。
    method: コロナの流体方程式から外向きの膨張流を求め、運ばれる磁場の配置を考察。
    contribution: 太陽風を流体力学的に説明する基礎を示した。磁気力も含む回転風モデルへ進む前段となる。
  evidence_by_item:
