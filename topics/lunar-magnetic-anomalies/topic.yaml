- paper_id: P000108
  group: field-and-swirls
  role: スワールと宇宙風化
  summary:
    question: 月のスワールと地殻磁場異常はどこで対応し、周囲との分光的な差から太陽風遮蔽とダスト集積を区別できるか。
    method: Clementine UV-Visの200 m/画素・5波長反射率からFeO推定値とOMATを作り、15地点の画像・地質と、高度30 kmにそろえたLunar Prospector磁場マップ・軌道通過を比較。4代表地点のROI平均と950/750 nm比対750 nm反射率を解析した。
    contribution: 調査した11スワール地点は磁場異常と対応し、すべて明るい部分が光学的に未成熟だったが、4磁場異常では明確なスワールが未確認。低FeO推定には海と高地の差やGerasimovichの例外があり、異常風化による推定偏り、外来放出物、斜長石に富む微粒子の集積を検討して、両起源仮説の判別は保留した。
  evidence_by_item:
    question:
    - paper_id: P000108
      version_id: V1
