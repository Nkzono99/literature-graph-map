review:
- heading: 接触モデルと表面粗さが、離脱に必要な力を変える
  paragraphs:
  - 粒子を表面から離すには、電場中の力と付着力を同じ条件で比べる必要がある。球状粒子間のvan der Waals引力を扱う[@P000205]は、接触を支える分子間力の入口になる。[@P000198]のJKR、[@P000199]のDMT、両者の遷移を扱う[@P000200]は、弾性変形と表面エネルギーから接触を考える基礎である。
  - 実際の表面には凹凸がある。[@P000204]は突起の統計から接触を扱い、[@P000201]は粗さによって付着が大きく減ることを実験とモデルで調べた。ナノ粗面の理論[@P000202]と測定[@P000203]、Apollo粒子の三次元形状[@P000218]は、平滑な球の近似を使う条件を考える材料になる。 フラクタル粗面と微粒子付着を扱う[@P000212]、FJS-1の三次元形状を離散要素法へ入力する[@P000281]は、粗さと粒子形状を具体的に与える研究として参照できる。
  - 接触した粒子は、引き離される前に転がることもある。[@P000206]の付着接触の転がり抵抗と、[@P000207]のダスト凝集体の構造を合わせると、接触一つの力から粒子集団の変形へ論点を広げられる。
  - 付着した粒子が接触を保って動く場合には、引き離し力と転がり開始の力を分けて考える。Dominik（1995）は、滑りを抑えたJKRS接触で、粒子の回転に接触面が遅れると弾性の抵抗モーメントが生じ、原子径程度の臨界ずれを超えると不可逆な転がりへ移るモデルを示した。臨界ずれを0.2 nmと置けば半径100 nm球の鎖の最小弾性曲率半径は50 µmとなるが、このずれは測定値ではなく、三次元接触も近似解である。粗い非球形粒子や帯電した実ダストへの適用では、接触形状と荷重の条件を別途検証する。[@P000206]
- heading: 付着の測定を、帯電による離脱と結び付ける
  paragraphs:
  - 月ダスト付着を整理した[@P000208]と[@P000209]に対し、[@P000210]は遠心法、[@P000211]は模擬月環境の条件から付着を測る。遠心測定装置を扱う[@P000213]も、測定方法を選ぶための文献となる。環境、粒径、粗さ、接触履歴をそろえることが、異なる実験を比較する出発点となる。
  - 表面上の局所帯電[@P000009]と単粒子の移動[@P000013]は、付着していた粒子が動き始める過程を扱う。[@P000215]ではUVと外部電場を組み合わせ、電場の向きによる光電子の動きと粒子離脱の違いを調べた。
    光と低密度プラズマを同時に照射する[@P000014]では、単独照射より粒子の飛び出しと推定負電荷が増えた。固定粒子群の差動帯電を計算した[@P000010]と合わせて、電荷が生まれる過程と保持される過程を比較できる。
  - '[@P000214]は、Ti6Al4Vの表面をナノチューブ化し、粒子付きAFM探針の平均付着力を未処理面の12.98 nNから1.63 nNへ低減した。投入量5
    g・設置角60°の散布試験では、残留量も0.5420から0.1642 mg/cm²へ減った。局所接触の力と散布後の残留量を分けて評価した結果であり、月面への適用には真空・帯電などの環境条件の検証が残る。'
  - 付着を弱める表面の選択肢には、受動技術を比較する[@P000257]、ZnO薄膜と立体テクスチャを組み合わせる[@P000258]、導電性ポリイミドを扱う[@P000259]がある。接触面積を変える加工と、電荷を散逸させる材料を、同じ粒径・照射条件で評価することが比較の軸になる。
- heading: 電場の形成と、接触が破れる条件をつなぐ
  paragraphs:
  - '[@P000026]は負にバイアスした基板上の粉体が外縁から広がる様子を観察した。[@P000029]は浮遊基板へ電子ビームを加え、電子とイオンの電流が同程度になる条件で電場の増強と小粒子の移動を調べた。電位・電荷の測定と移動の撮影では粒径やプラズマ条件が異なり、個々の接触の付着力は直接測っていない。'
  - 凝集力と重力を入れる[@P000387]は、平均電荷を投影面積へ配分する仮定から、中間半径で離脱の必要電場が最小になると予測した。[@P000388]は直径約5–25 µmのポリスチレン堆積を同じ形状で比較し、15
    µmで最大の拡がりを観察した。モデルと整合する粒径選択性を示したが、凝集係数は逆算であり、離脱時の鉛直電場と個々の電荷は未測定である。
  - 電子ビーム下のJSC-1を使う[@P000392]では、小粒子が捕集集団で相対的に多くなった。各々を規格化した捕集・対照分布の比は絶対的な離脱確率ではなく、モデルで比較する接触距離もフィット値である。[@P000388]と材料・電流源・接触配置が異なるため、粒径選択性の違いを帯電・凝集条件に沿って比較する。
  - '[@P000216]はナノ領域の電荷ゆらぎから局所電場を計算し、仮定した粒子電荷に働く力を付着モデルと比べた。半径20 nmの粒子と半径10 nmの帯電領域に各+10eを与えた最隣接の例では約10 pNとなるが、成否は配置・粗さ・清浄度に依存する。[@P000256]の総説が整理した地盤のせん断強度、接触中の電荷、離脱後の浮遊条件も測る量を区別する必要がある。'
  - 粒子の運動は接触帯電の履歴も変える。振動面上の単一球[@P000308]は姿勢と電荷分布による帯電停止を示し、二粒子の反復衝突[@P000309]は確率的な電荷移動と累積電荷の飽和を調べた。月ダストの生成・物性・輸送をまとめた[@P000249]は、これらの接触過程を探査機周辺の問題へ位置づける入口になる。
- heading: 実粒子の形と氷の量から、集団の流れやすさを調べる
  paragraphs:
  - Apollo粒子の三次元形状[@P000218]に対し、[@P000293]はChang'e-6の多数の粒子を再構成して離散要素法へ入力した。得られた粘着力や摩擦角は、粒子集団の計算結果である。[@P000290]は鉱物ごとの摩擦と表面エネルギーも調べ、低重力で付着の寄与が大きくなる粒径域を比較する。
  - 永久影では氷の寄与も加わる。[@P000292]は低温の模擬物実験から、氷含有量と静的・動的安息角の関係を調べた。接触一つの引き離し力、粒子同士のかみ合い、氷による凝集を分けて評価すると、月面地盤の強度へつなげやすい。
  - ガラスで結ばれた粒子を作る[@P000373]は、凝集体内部の構造と地盤の強度を結び付ける。三軸試験の集団応答を、単一接触の引き離し力と分けて比較できる。
- heading: 離脱後の初速と、氷で結ばれた粒子の強度
  paragraphs:
  - 粒子が離れた後の移動範囲には、初速と射出方向が必要になる。[@P000217]は日照域で静電的に離脱した粒子の打ち上げ速度を評価する。斜入射電子ビームの実験[@P000250]は、二次電子収率が1を超える条件でビームと逆方向への移動を示し、粒子の照射側と陰側の帯電差から方向性を説明した。[@P000315]は最大初速の粒径依存と、形状・凝集力による速度分散を測定した。[@P000316]はシリカ粒子の射出角と距離ごとの粒径を調べている。氷を含む地盤については、[@P000332]が円錐貫入試験で、粒子間を結ぶ氷と分散した氷の強度・掘削性の違いを定量化した。単粒子の付着力と、粒子集団の強度は測る量が異なるため、接触状態や温度をそろえて比較する。
- heading: 材料選定から実月面の付着像・EDSの残留粒子へ
  paragraphs:
  - '[@P000367]はRACに向けた材料・レーザー加工面を地上で評価し、接触角、形状、模擬ダスト付着を比較する手順を示した。[@P000365]はこの研究を材料クーポン選定に参照し、PlanetVacの月面運用で付着像を得た。実環境の比較点が加わった一方、基準面を欠く画像からは付着量やレーザー加工の低減効果を定量できない。'
  - 除去時に残る粒子を調べる[@P000370]は、実験条件内で25 µm未満の付着と250 µm超の重力・誘電泳動力の影響を報告した。[@P000369]は高真空の連続降塵下でEDS被覆と残留粒径・損傷を比較した。表面の引き離し力、動的な蓄積抑制、清掃後の残留量を測定量ごとに整理すると、材料表面と電場の寄与を比較できる。
lineage:
- title: 弾性付着から粗面の付着へ
  steps:
  - paper_id: P000198
    title: 表面エネルギーを接触に加える
    significance: 弾性球の接触寸法と引き離し力を表面エネルギーから求めた。
  - paper_id: P000201
    title: 粗さの効果を調べる
    significance: 個々の突起の付着と圧縮を組み合わせ、粗面の付着低下を説明した。
    connection: 平滑面の接触を突起の集まりへ拡張
- title: 基板の電位から電子ビームによる差動帯電へ
  steps:
  - paper_id: P000026
    title: 負バイアス基板上の移動を測る
    significance: 粉体の外縁からの移動を、位置によって異なる電位構造と粒子電荷に結び付けた。
  - paper_id: P000029
    title: 電流の釣合いと表面特性を加える
    significance: 浮遊基板上で電子ビームとイオンの電流比を変え、粉体と基板の電位差・電場と輸送を調べた。
    connection: 先行実験を踏まえ、電子ビームと二次電子放出の差を取り入れる
- title: Apolloの形状計測から月裏側の粒子集団へ
  steps:
  - paper_id: P000218
    title: 実粒子の形状と空隙を測る
    significance: Apollo粒子の三次元形状を測り、模擬物との比較基盤を作った。
  - paper_id: P000293
    title: 月裏側の形状を強度計算へ入れる
    significance: Chang'e-6粒子を多数再構成し、かみ合いによる強度を評価した。
    connection: 形状計測を集団の力学応答へつなぐ
  - paper_id: P000290
    title: 摩擦と付着の寄与を比べる
    significance: 鉱物・粒径・重力に応じて安息角が変わる条件を検討した。
    connection: 形状に表面特性と重力の効果を加える
- title: 飛行前の材料評価から実月面の付着観察へ
  steps:
  - paper_id: P000367
    title: 材料とレーザー加工面を選ぶ
    significance: RAC用材料を地上で評価し、月面付着比較のための試料選定・加工手順を示した。
  - paper_id: P000365
    title: 月面で材料クーポンを観察する
    significance: 選定研究を参照したクーポンで実月面の付着像を取得し、画像による定量評価の課題を明らかにした。
    connection: 材料選定を参照し、地上試験を実月面の観察へつなぐ
- title: 凝集と帯電条件による粒径選択性
  steps:
  - paper_id: P000387
    title: 凝集と重力から離脱閾値を求める
    significance: 球と平面の接触と平均電荷配分を仮定し、中間半径で必要電場が最小となると予測した。
  - paper_id: P000388
    title: 中間粒径の堆積が広がる実験
    significance: 先行理論を参照し、5–25 µmのポリスチレンで中間粒径の優先的な拡がりを測った。電荷と鉛直電場は未確定である。
    connection: 凝集を含む閾値予測を、同じ形状の堆積実験と照合
  - paper_id: P000392
    title: 電子ビーム下の捕集粒径を比較
    significance: JSC-1では小粒子が捕集集団で相対的に多いと報告し、再捕集モデルと比較した。絶対的な離脱確率ではない。
    connection: 中間粒径の実験を参照し、異なる材料・帯電条件の粒径選択性と比較
