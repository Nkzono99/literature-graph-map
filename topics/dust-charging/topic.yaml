- paper_id: P000241
  group: stochastic
  role: 凝集体の確率的帯電
  summary:
    question: 微小粒子や希薄なプラズマでは、電子・イオンを一個ずつ受け取る際の電荷ゆらぎが、凝集体の電荷統計と成長後の形状にどう影響するかを調べる。
    method: 凝集体表面への電子・イオンの捕集を離散的な確率過程として扱う数値帯電モデルを構築し、粒子運動モデルと連成して凝集体の成長を計算する。
    contribution: 電荷の平均と標準偏差は等価半径の球と同じ傾向を示すが、予測値からのばらつきは凝集体で大きい。電荷ゆらぎの時間尺度が粒子の運動に影響する環境では、一定電荷の場合より細長い糸状の凝集体が形成されやすかった。
