- paper_id: P000310
  role: 永久影レゴリスの内部帯電と破壊風化の仮説
  summary:
    question: 低温の永久影レゴリスへGCR・SEPが電荷を沈着させると、内部電場はどこまで蓄積し、絶縁破壊に達し得るか。
    method: CRaTERのGCR粒子フラックスとACE/EPAMの限定された電子・陽子エネルギー帯を、SiO₂の停止距離から置いた平面電荷層へ入力する。比誘電率2と代表導電率10⁻¹⁷ S/m、表面流出なし、初期帯電ゼロの一次元時間依存モデルで、Ohm則による層間・深部への散逸を計算した。
    contribution: GCR入力で帯電域の上下に最大約700 V/m、3大規模SEPで非重複層間に8.8–16 MV/mを予測し、既存誘電体の閾値との比較からPSRでの絶縁破壊と累積的な破砕風化を候補機構として示した。電場と破壊はPSRでの直接観測ではない。
