- paper_id: P000026
  group: detachment
  role: プラズマ中のダスト移動実験
  summary:
    question: プラズマ中で、導体上の絶縁性ダストはどこから動き始めるか。
    method: 負にバイアスしたグラファイト上の25 µm未満の模擬粒子を撮影し、別条件の絶縁円板で電位と約100 µm粒子の電荷を測る。
    contribution: 外縁から輪状に広がる移動と6 mm以上の到達を観察し、電位構造・粒子電荷の位置依存性と対応付けた。付着力の閾値は定量化していない。
  evidence_by_item:
    question:
