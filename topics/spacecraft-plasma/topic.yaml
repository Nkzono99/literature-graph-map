- paper_id: P000124
  group: electric-field
  role: ダブルプローブ計測のPIC
  summary:
    question: 機体とブームが作る電位分布は、電場計測にどの信号を加えるか。
    method: 境界要素法を組み込んだPICで、Cluster周囲を3種類のプラズマ条件で計算。
