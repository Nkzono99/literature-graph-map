  group: lunar-materials
  role: 月試料の収率と放出エネルギー
  summary:
    question: 月の粉体試料からの二次電子放出は、材料の構成成分や試料の帯電とどう関わるか。
    method: Apollo 14試料14259.116に50–2000 eVの電子を照射し、収率とエネルギー分布を測定。
    contribution: 粉体から逃げる電子の収率と、試料の帯電による放出スペクトルの変化を測った。
