- paper_id: P000364
  group: photoelectron-sheath
  role: 光電子流束・検出確率の環境依存
  summary:
    question: 月面から放出された光電子の流束と、観測で光電子を識別できる割合は、太陽天頂角・太陽軟X線・降下電子・周辺プラズマ環境でどう変わるか。
    method: 2011年8月–2025年1月のARTEMIS burst電子・磁場・宇宙機電位を用い、昼側表面への直線磁力線接続と上向きピッチ角を選ぶ。酸素Augerピークの傾き/流束と高放出率モデルへの相対適合誤差<0.2で光電子を選別し、宇宙機・月面電位を補正した流束と識別確率をローブ/太陽風で比較する。傾き閾値の本文・図の不一致は未解決。
    contribution: 表面推定流束の余弦型SZA依存と軟X線との正相関を示し、識別割合がローブ51.2%、太陽風8.6%となる環境差、太陽風の夕側ピーク、降下電子による識別抑制を整理した。電位・光電流モデルへの観測制約を提供する。
