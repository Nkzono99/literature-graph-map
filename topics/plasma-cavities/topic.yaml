review:
- heading: 空間の陰が、電子とイオンの届き方を分ける
  paragraphs:
  - '[@P000219]の真空膨張と[@P000220]のウェイクPICは、希薄な領域へプラズマが入る過程を扱う。地形が流れを遮る場合には、空洞寸法、デバイ長、流速と熱速度の比が、流入する粒子と電位を比較する軸になる。'
  - '[@P000008]はクレーターへの流入と表面帯電の相互作用を扱い、[@P000222]は太陽嵐中へ広げた。深い空洞では[@P000012]、寸法の違いは[@P000015]、流速と熱速度の比は[@P000016]からたどれる。'
- heading: 実験と微細加工の研究から、形状の効果を比較する
  paragraphs:
  - '[@P000263]のクレーター実験は、デバイ長と地形寸法の比によって内部電場が変わることを示す。[@P000226]の管を使った実験は、入口と壁面による電子遮蔽に加え、イオン誘起二次電子が奥の正電位を抑える効果を調べた。'
  - 微細加工の[@P000230]は、斜めに入射する電子がパターンで遮られることで局所損傷が生じることを示した。[@P000227]は電子温度と溝底電流、[@P000228]は局所電位と側壁の削れを結び付ける。月面空洞との比較では、幾何形状と流入分布に加えて、衝突や材料の条件もそろえる。
lineage:
- title: 電子遮蔽から局所的な加工形状へ
  steps:
  - paper_id: P000230
    title: 入射方向の遮蔽を測る
    significance: 高アスペクト比のパターンによる電子遮蔽を損傷の実験から調べた。
  - paper_id: P000227
    title: 電子温度と流入量を結び付ける
    significance: 電子温度が溝壁電位と底部への電流を変える過程を計算した。
    connection: 遮蔽を速度分布と局所電位から説明
  - paper_id: P000228
    title: 電位から削れる場所を予測する
    significance: 粒子軌道と帯電の時間変化を加工形状の発展に結び付けた。
    connection: 流入の偏りから側壁の形状へ
