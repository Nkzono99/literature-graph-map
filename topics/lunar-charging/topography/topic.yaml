schema_version: 1
topic_id: lunar-charging-topography
title: 月の極域・クレーター・空洞の帯電
question: 永久影、クレーター、縦孔・地下空洞で、太陽風の遮蔽と帯電がどう結び付くか。
review:
- heading: 永久影へ入り込むプラズマ
  paragraphs:
  - 極域の低い太陽高度では、クレーターの壁が光と太陽風を遮る。電子とイオンは質量や速度分布が違うため、陰への到達もそろわない。[@P000058]はこの差から永久影の負帯電を考え、[@P000031]はLOLA地形を使って遮蔽を具体化した。[@P000008]は表面帯電が流入粒子へ及ぼす作用も計算する。[@P000048]の三次元ハイブリッドPICでは、クレーター近傍の負電位のプラズマ領域と、底や壁へ回り込むイオン流が描かれている。
  - 日夜境界・影の極域で準中性が破れる条件を扱う[@P000282]は、電子とイオンの到達差を読む入口になる。太陽嵐中の[@P000222]は運動論計算を物体の等価回路へつなぎ、低電流環境での帯電緩和を評価した。[@P000264]は膨張前線と表面の間の電子雲をPoisson方程式で求め、[@P000263]の実験はデバイ長と地形寸法の比による内部電場・二重層の変化を調べる。非中性領域の解析と、形状を変える実験を比較できる。
- heading: 深い空洞と実地形への拡張
  paragraphs:
  - 深い空洞では、入口から底へ至る間に電子が側壁へ失われる。上方から太陽風が入る条件を扱った[@P000012]は、その選別によって底部が正に帯電しうることを示した。[@P000015]は空洞寸法とシース厚の比に注目し、大きな空洞では電子供給が増えて正電位が緩和されることを示した。[@P000016]は流速と熱速度の比を変え、底部電位が負から正、さらにほぼゼロへ移る条件を調べる。南極の実地形を含む[@P000017]は、理想化した形状の計算から、候補地点ごとの環境を読むための研究へつながる。
  - 縦孔周囲の三次元の粒子計算[@P000225]は、深い地形への粒子供給を調べる比較対象となる。溶岩チューブをガラス管で模した[@P000226]は、入口電位と深さを変えて底部電位を測った。電子遮蔽による正帯電を、壁からのイオン誘起二次電子が抑えるという結果から、幾何形状と材料の放出特性を組にして考えられる。
- heading: 計算出力と図の再現へ進む
  paragraphs:
  - 論文から計算条件を追うために、公開出力も参照できる。[@P000344]は空洞サイズ依存の図に対応するHDF5とNotebook、[@P000345]は流速・熱速度比の計算出力と半解析コード、[@P000346]は極域クレーターのhybrid
    PICのVTK・DAT出力を提供する。これらは関連論文とは別の公開データ記録であり、ここでは説明とファイル一覧を確認している。
lineage:
- title: 実地形と太陽風の侵入
  steps:
  - paper_id: P000031
    title: 地形データから局所環境を予測
    significance: LOLAの地形を使い、極域でのプラズマの遮蔽と表面帯電を計算した。
  - paper_id: P000008
    title: 膨張と帯電を相互作用として解く
    significance: クレーターへの太陽風侵入と電位形成を同時に扱い、二次電子放出の効果も調べた。
    connection: 地形による遮蔽から場との相互作用へ
  - paper_id: P000017
    title: 南極の実地形と磁気圏条件を結ぶ
    significance: 南緯86–90度の地形を使い、環境ごとに電位と電場の分布を予測した。
    connection: 局所形状の理解を南極の分布へ
- title: 深い空洞の正帯電と条件依存
  steps:
  - paper_id: P000012
    title: 光電子がなくても底部が正帯電
    significance: 側壁での電子損失が底部への流入を変え、深い空洞に正電位を作ることを示した。
  - paper_id: P000015
    title: 空洞寸法とシース厚を結び付ける
    significance: 幅と深さを変え、シースに対して大きな空洞では電子供給が増え正電位が弱まることを示した。
    connection: 深さの効果から絶対的な寸法へ
  - paper_id: P000016
    title: 流速と熱速度で電位の符号を整理
    significance: Debye長より狭い空洞で、流速の増加に伴う負・正・ほぼゼロの電位を自由落下モデルと結んだ。
    connection: 寸法に加えて流入条件を整理
