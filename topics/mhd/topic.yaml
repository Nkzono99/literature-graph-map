schema_version: 1
topic_id: mhd
title: 磁気流体力学（MHD）
question: 流体と磁場の基礎理論、保存則と数値解法から、太陽風・磁気圏・磁気リコネクションへの応用をたどる。
synopsis:
- 磁気流体力学は、密度・流速・圧力で表す流体と磁場の相互作用を扱う。波動の理論（[@P000393]）と方程式の近似条件（[@P000394]）が基礎であり、Alfvén波と磁気音波の特性が数値解法の流束と時間刻みを決める。
- 数値解法では、MHD固有の波構造を扱う近似Riemann解法（[@P000398]、[@P000404]）と、磁場の発散制約を離散的に保つ方法（[@P000399]）が節目になった。発散誤差の扱いの比較（[@P000401]）から多次元の実装（[@P000405]）、適応格子（[@P000407]）へ進む過程で、解法の次数、保存性、境界の整合が別々に評価されるようになった。
- 応用では、太陽風の膨張と角運動量輸送（[@P000396]、[@P000397]）、磁気圏の領域結合（[@P000408]）、磁気リコネクションにおけるモデル間比較（[@P000410]）が主題となる。局所の運動論と大域の流体を結ぶ計算（[@P000071]）は、どの物理をどこで必要とするかを選ぶ研究でもある。
review:
- heading: MHDは流体の運動と磁場を同時に解く
  paragraphs:
  - 磁気流体力学（MHD）は、密度・流速・圧力で表す流体と磁場の相互作用を扱う。流体の運動が電流や磁場を変え、その磁場が流体へ力を返す。[@P000393]が示した波動は、この相互作用の基本例である。方程式の導出、波動、安定性を学ぶ入口には、実験室と天体プラズマを共通の理論で扱う[@P000394]がある。
  - "基本となる理想MHDでは、質量・運動量・エネルギーの保存則と磁場の誘導方程式を解き、状態方程式で系を閉じる。磁場には∇·B=0という制約がある。完全導電の近似では磁束が流体とともに運ばれ、抵抗を含めると拡散による配置の変化を扱える。[@P000394]の近似と適用条件の整理を、保存形の方程式を掲げる[@P000402]と併せて読むと、物理モデルと数値的な制約をつなげられる。"
  - "[@P000402]は磁気誘導式に補助変数を結合し、流速から独立した2本の波による発散誤差の輸送と指数減衰を組み合わせた。保存形GLMではMHDの保存則を保つ一方、追加源項を持つEGLMやGalilean不変への修正では非保存項が入る。DW/MHD–HLLEMを使った2次元非構造三角格子の理想MHD試験では、混合GLMが細格子での安定性を改善し、2D RiemannのDW計算では発散指標を無補正・Powell型源項法より少なくとも50%小さくした。局所適応格子の過剰細分化も抑えたが、減衰パラメータの比0.18は本稿の経験的選択で、CT・投影法との直接比較は行っていない。"
- heading: 波動の特性が、流束と時間刻みを決める
  paragraphs:
  - 磁場の張力を復元力とするAlfvén波に加え、圧縮性MHDには速い・遅い磁気音波が現れる。どの波が情報を運ぶかは、境界条件や陽解法の時間刻みに関わる（[@P000393]、[@P000394]）。衝撃波や接触不連続を含む計算では、格子面の両側の状態から波の伝播を考え、流束を求める。
  - '[@P000398]はRoe型の解法を構成し、MHDの非凸性と複合波を共平面の衝撃波管問題で示した。流体の音波だけを想定した解法から、MHD固有の波構造を扱う段階への節目となる。[@P000404]のHLLDは、複数の中間状態で接触不連続やAlfvén波を取り込む。比較では波の解像度と計算量を見たうえで、強い不連続や磁場の向きなど対象に合う試験問題を選ぶ。'
  - "[@P000501]は、冷電子・電子慣性なしのHall MHDに等方圧力と磁場軸対称の異方圧力を組み込み、陽的2次Runge–Kutta、制限付き流束、flux-CTで1〜3次元を解いた。大振幅孤立波を高精度ODEで構成して基準初期条件とし、η=0のCGL波を363 di周期箱で速度1 VAで伝播させると、Nx=128〜4096の帰還近傍極小誤差はNx^-2に従った。2次元斜交伝播と3次元の密度blob相互作用も試験し、線形whistler検証を非線形波形の減衰・位相ずれの検出へ広げる。GEM再結合とfirehoseは実装挙動の確認を補うが、非ジャイロトロピックな拡散領域や運動論的斜交しきい値の再現は検証範囲に含まれない。"
- heading: 磁場の発散制約は、保存則と合わせて評価する
  paragraphs:
  - "[@P000399]は面磁束を共有辺の起電力で更新し、閉セルの磁束変化を逆符号で相殺するCTを示した。保存されるのはstaggered格子で定義した離散発散で、初期場と流入・流出境界が制約に適合している必要がある。二次元の移流校正では、ポテンシャルから二回差分して得る電流の余分な符号振動を、磁場直接更新と一回差分で抑えた。一方、ポテンシャル法が磁場の端をより鋭く保つ例もあり、制約保存と解像度は別に評価する。磁場更新のみを倍精度にした報告試験の全格子正規化発散診断は約10^-15–10^-14に保たれたが、初期の発散誤差をCTが取り除くわけではない。"
  - "[@P000400]の上流型・適応格子法で用いる八波形式は、発散に比例する項を加え、誤差を流れとともに運ぶ。[@P000401]はCT、射影法、八波形式などを比較し、発散誤差の大きさと保存性、衝撃波の正しさを別々に確かめる必要を示した。[@P000402]のGLM法では補助変数を加え、誤差を伝播させ、混合型では減衰させる。採用する方式に応じて、保存量の収支、磁場の発散、境界での誤差の振る舞いを確認する。"
  - "[@P000401]は同じVAC実装で七つの発散処理法を比べ、CTが保持する角中心発散とCD・射影が使う中心差分発散を区別した。二次元Cartesian・理想MHDの特定の63.4°回転衝撃波管では、非保存型八波法の本来一定の平行磁場が衝撃波間で3–7%ずれ、解像度を上げても解消しなかった。一方、別の2.5D衝撃波管では八波法も良好で、方式の評価には初期状態と基礎スキームが関わる。射影、field-CD、flux-CTはこの試験集合で精度と頑健性が高かったが、発散を一つの定義でゼロに保つだけでは物理変数の精度は決まらない。射影の精度議論は一様Cartesian格子の反対称演算子と適合した比較解を用いる局所整合性の評価で、一般の非線形安定性や収束を保証しない。"
  - "[@P000496]は、移動Voronoiメッシュのセル中心でベクトルポテンシャルを更新し、Delaunay四面体の閉曲面磁束を機械精度でゼロに保つCT法を示した。円偏光Alfvén波ではPowell法とともに二次収束を示す一方、64³、音速Mach数約10・Alfvén Mach数約3の駆動乱流では、Powell法の長時間平均磁場と最大スケールのパワーが増大した。CTの移動メッシュでの体積平均磁場は本文で概ね1%とされるが、図3の2渦回転時間ではz成分が初期1から0.97へ低下しており、全時刻の上限ではない。この近似保存は、離散発散の機械精度保持とは精度の対象が異なる。孤立円盤の計算ではCTの磁場飽和は著者の乱流運動エネルギー量ρv_turb²に概ね釣り合い、Powell磁気圧は熱圧の約5倍となった。フィードバックを含む宇宙論箱では磁場強度統計は類似したため、発散処理の影響は流れの条件と観察量を合わせて評価する必要がある。"
  - "[@P000498]は、磁場発散を抑えるCTに、密度・圧力を保つWENO flux limiterを組み合わせた。SSP-RK3、CFL0.5の数値例では2D smooth vortexで概ね4次収束を維持し、低圧の1D–3D試験を安定に進めた。磁場補正後の圧力を保つOption 2は全エネルギーを修正するため、256²格子の2D blastでは本文が報告する発散L1誤差約10^-12に対して相対全エネルギー誤差約10^-3という交換条件が現れる。通常の陽性制限は最終RK段に限り、多次元一次LF法の陽性の厳密証明も残るため、発散抑制・陽性・エネルギー保存をそれぞれ確認する必要がある。  発散誤差の概数は本文報告であり、図5.7(a)の曲線は10^-12と10^-10の間にある。"
  - "[@P000497]は磁場と磁気ポテンシャルを同じ格子点に置き、5次有限差分WENOのMHD予測をポテンシャルの4次中心差分curlで修正する拘束輸送を構成した。同じ可換差分で定義する磁場発散はゼロとなり、10段4次SSP-RKを組み合わせた滑らかなAlfvén波試験で約4次収束を得る。3Dでは微分の振動を抑える人工抵抗を追加する。全エネルギーを保持したCFL=3、192×192のOrszag–Tang渦はt=30まで負圧なしで進んだが、正値性の一般保証やAMR、物理抵抗・Hall項への拡張は課題として残る。 Alfvén波の詳細初期条件は引用原典[20]に委ねられる（PDF pp.21,23）。"
  - "[@P000500]は、面磁場を一次データとするCTを再構成と運動量・エネルギー流束まで徹底し、辺電場を交差するRiemann波の四状態から上流化するUCTを示した。二次有限体積実装では初期にゼロの面磁場の離散発散を機械精度で保存し、63.4°のST-3衝撃波管（256×2格子、1024点一次元参照）ではRoe型POSITIVEの平均L1誤差がセル中心BS版の0.0365から0.0165へ下がった。セル中心へ補間した磁場の中心差分発散は大きく残りうるため、実際に流束へ入る磁場と同じ離散微分で制約を評価する必要がある。三次CENO実装では陰的に復元する流束用磁場の発散精度が反転精度に依存し、二次CTの機械ゼロとは区別される。"
- heading: 多次元更新と格子細分化を、実装へつなぐ
  paragraphs:
  - 二次元・二次精度の方法を示したGardinerら（[@P000403]）は、セル平均磁場を隣接面磁場の平均として更新し、Godunov法の磁場流束を角電場の平均へ補正する整合条件を導いた。単純な角電場平均では一次元流れの数値粘性が半分になるため、PPM・CTUの多次元磁場源項と接触モードで風上化したCTを組み合わせる。斜め線形波は二次以上に収束する一方、回転衝撃管のセル中心磁場には約10%の振動が残り、保存的な2×1セル平均で初めて丸め誤差になる。CTの発散保存とセル尺度での無振動性を区別する結果である。
  - Athenaを記述したStone et al.（[@P000405]）は、質量・運動量・エネルギーの有限体積流束と、面磁場を更新するCT電場を整合させ、多次元の実装と検証問題にまとめた。標準3D
    CTU＋CTは6回のRiemann計算とCFL数0.5以下を用い、三次のPPM再構成を選んでも方法全体は二次精度である。斜めの線形MHD波で二次収束を確かめ、磁場ループでは格子に沿う軸方向磁場の保存と、軸も斜めの場合の打切り誤差を区別する。発散を測る離散演算子、数値拡散、強い衝撃波の頑健性を同じ条件でそろえることが、後続コードとの比較の軸になる。
  - PLUTO（[@P000406]）は、古典流体・MHD・特殊相対論流体・RMHDを、再構成、Riemann解法、時間更新から分けて選ぶ構成を示した。回転MHD衝撃波管では、基本変数での線形再構成と非分割RK2を固定した比較で、HLLDがRoeに近い誤差を保ち、同じ誤差に対する計算時間を減らした。著者は再構成の変更で時間順位が変わり得ると留保しており、解法の順位は対象と組み合わせに結び付けて読む。
  - CTと八波形式、曲線座標、閉包を同じコードで試せる点もPLUTO（[@P000406]）の特徴である。高速回転体では発散制約処理による分布が近い一方、極座標の内側セルが時間刻みを制限した。相対論的衝撃波管では閉包と薄い密度殻の解像が結果を変える。2007年稿の多次元AMRは開発中で、この版の検証と後年の実装を区別する。
  - Athena++（[@P000407]）は、AthenaのGodunov法とCTを、ブロック型AMR、曲線座標、通信と計算を重ねるtask listへ移した。粗細境界では保存量の面積積分流束と磁場更新の線積分EMFを細レベルへ合わせる。標準CTの全体空間精度は二次で、高次再構成と時間積分は誤差を減らす。解法の次数と、AMR境界の保存・発散制約の整合を合わせて確認する段階へ進んだ。
  - AMRによる高速化は、細分化条件とブロックの大きさに依存する。[@P000407]の相対論KH試験では、AMRは一様格子より速い一方、多くの短波長構造が粗細境界に由来すると著者は判断した。524,288
    threadsで84%というMHD効率は、一様格子の弱スケーリングを8ノード基準で測った結果である。構造の再現と計算速度を比較する際は、最細解像度、格子配置、誤差指標と測定条件を対応させる。
  - "[@P000499]は、抵抗MHDの近似Schur前処理をHall MHDへ拡張し、電子の高速分散波と四階散逸をベクトルポテンシャル・電流密度の連立ブロックへ隔離した。Jacobi対角のcurl curlだけを負のLaplacianへ近似し、残差には元の演算子を保つ。2次元GEMの弱スケーリング試験では固定Δt=0.01と格子依存の電子粘性を用い、4096²格子・16384 MPIタスクでもGMRES約3回/ステップ、陽解法に対する速度比75を報告した。これは高速電子波を越えて遅い力学を追う解法の例で、解析は均一周期2次元・電子流と慣性なし、性能実測も2次元GEMに限られる。"
- heading: 太陽風では、膨張流・磁気トルク・波動をつなぐ
  paragraphs:
  - "[@P000396]は、熱伝導で温度が下がる高温コロナの静水圧解が遠方に有限圧力を残し、低い外圧とはつながらないことから定常膨張を考えた。球対称で磁気力を無視し、a=10¹¹ cm、基底密度3×10⁷ cm⁻³、温度3×10⁶ Kを5aまで維持する例では、臨界点を通る流れが500 km/sと約10¹⁴ g/sの質量損失を与える。太陽に結びつく磁場を一定速度の流れが運ぶ構成から、回転によるらせん状磁場も示した。温度分布は外から与え、磁気応力が速度へ返す作用は解かないため、加熱や回転と磁場を結合した風モデルへ進む前段に位置づく。式27の緯度表記とp.675の印刷単位には疑義が残る。"
  - "[@P000397]は、定常・軸対称・完全導電の赤道面モデルに磁気応力と回転を加え、遅い磁気音波点、動径Alfvén点、速い磁気音波点を通る太陽風を求めた。単位質量損失あたりの総角運動量は物質項と磁気項の和L＝Ωra²となる。この有効半径は剛体共回転の範囲を意味せず、例示解では11.5太陽半径で角速度が太陽表面の約0.16倍に落ちる。1 auで400 km/s、動径磁場5 nT、陽子密度7 cm⁻³、温度2×10⁵ Kを与えた解のraは24.3太陽半径である。ただし一定ポリトロープ指数γ＝1.221では太陽と地球の条件を同時に再現できず、加熱の扱いが数値解の限界となる。pE/ρEの補助数値とエネルギー流束比の単位表記には未解決の対応があり、上記の数値は式33と§VIの報告値に限定する。"
  - Belcher・Davisは、Mariner 5の1967年6～11月の太陽風観測で、磁場と速度の三成分の対応に加え、密度・磁場強度の変動の小ささと磁場極性に応じた相関符号を用いて、非正弦的で大振幅のAlfvén波が太陽風静止系で外向きに伝わることを識別した。純粋な例は高速流本体と後縁に多いが、振幅が最も大きい先端の圧縮域には内向き波や非Alfvén的構造も混ざり得る。区間ごとに平均磁場を取り直した磁場変動全体の分散解析では、168.75秒・22.5分区間の分散比を全観測期間で平均すると、平均磁場と半径方向の両方に垂直な成分が強い概略5:4:1の異方性が得られた。太陽近傍から運ばれた波と圧縮域で増幅・生成された波を区別する著者のモデルは、理想MHDの波と太陽風の流れ構造を結びつける。ここで参照するのは1970年報告書版である。[@P000411]
- heading: 磁気圏の大域計算では、領域間の結合が効く
  paragraphs:
  - "[@P000408]は、太陽コロナ・内部太陽圏・全球磁気圏のMHDを、内部磁気圏の粒子モデル、電離圏電位、上層大気へ結ぶSWMFを示した。各領域の格子と時間積分を個別に選び、成分の並行実行と磁力線写像を組み合わせる。指定した分解能の全成分10分試験は256CPUのSGI Altixで実時間のほぼ2倍の速度に達したが、実演は特定の観測イベントを再現するものではない。模擬CMEの地球到来時には、IHの1/4太陽半径格子で衝撃波が約160地球半径・40分に広がり、結合先だけでなく供給側の分解能が入力の鋭さを制約する。2005年実装では電離圏流出を含めず、IMから電離圏への電流写像にも簡略化がある。"
  - OpenGGCM（[@P000409]）は外側磁気圏の抵抗性MHDを沿磁力線電流・電位・電子降下で電離圏・熱圏へ結合し、THEMISの2007年3月23日サブストームと比較した。磁場・流れの大まかな変化とサージへの磁力線写像は再現したが、開始は観測より早く、密度・温度の一致は弱かった。CTIMコンダクタンスを使う場合と一様値・夜側電子降下を切る場合で応答が変わるとの報告は、MHD本体と電離圏境界を併せて検証する必要を示す。
- heading: 再結合では、抵抗性MHDからHall・運動論へ進む
  paragraphs:
  - '[@P000395]は反平行な磁場を押し合わせ、流入・流出と拡散を伴う再結合を調べた。磁場配置とエネルギーの変化を流体で考える基礎になる。無衝突の電流層へ進むと、電子とイオンの運動の違いをどこまでモデルへ含めるかが問題になる。'
  - GEMの比較（[@P000410]）は、共通のHarris電流層と初期摂動でPICから抵抗性MHDまでを試験し、Hall効果を含むモデルがこの条件下で近い再結合率を示すことを報告した。この結果を適用する際は、初期条件と採用したOhm則を対応させる。
  - イオン粒子・電子流体のhybridと、MHD–PICの領域結合では、電子の記述と境界で交換する量が異なる。関連テーマの「ハイブリッドPIC法・粒子と流体の結合」で、電子慣性と圧力閉包、保存性・波動精度、月ウェイクやガニメデ磁気圏への適用を比較する。
  - ChenほかのFLEKSは、電子・イオンをともに粒子として解くPICを大域MHDへ動的に埋め込む基盤である。本稿で説明する典型的なMHD側はHall項と独立電子圧力方程式を使う。新規活性セルと境界はMHD情報で初期化し、磁気圏界面やcuspの形に合わせてPICの範囲を近似する。MHD/PIC変換の詳細は原著が引用する結合モデルの説明に委ねられ、粒子再サンプリングの保存則と結合計算全体の保存性は区別する必要がある。[@P000071]
  - "[@P000410]は、共通の2次元Harris電流層に電流層幅に匹敵する初期磁気島（正規化磁束振幅ψ0=0.1）を与え、MHD、Hall MHD、hybrid、full particleの非線形再結合を比較した。x-lineの狭い層をぼかさない小さい、または局在した抵抗散逸の下ではHallを含むモデルの率が概ね一致し、再結合電場Eyのピークは0.24 B0vA/cと報告された。通常MHDの率は抵抗率に依存し、Fig.1のη=0.005の例は遅い。一方、等しい率でも電子電流層やイオンjet幅には差があり、著者は格子尺度を抑えつつ長い尺度を過剰に拡散させないp≥4の高階散逸を議論する。この比較は線形発生を飛ばした2次元条件に関するもので、3次元不安定性や全球磁気圏に対するtwo-fluidモデルの十分性は未確定である。"
