review:
- heading: 高さと重力の組合せから、地殻の厚さを推定する
  paragraphs:
  - レーザー高度計による[@P000169]は全球の地形を与える。[@P000170]は、地球から直接追跡しにくい裏側の重力をリレー衛星経由で測り、表裏の盆地が異なる重力構造を持つことを示した。
  - '[@P000180]は、この地形と重力から地殻厚を計算した。地殻厚は密度や補償の仮定を介した推定量なので、観測された高度・重力とモデルの条件を合わせて参照する。'
- heading: 重力の空間分解能が、探せる地下構造を変える
  paragraphs:
  - GRAIL重力を使った[@P000194]は、長く細い質量欠損を空洞の候補として抽出する。衛星軌道と検出法によって感度の高い方向・寸法が異なるため、縦孔の画像やLRSの地下反射との対応が解釈を補う。
- heading: 密度構造から、衝突破砕とマグマの貫入を探る
  paragraphs:
  - '[@P000301]はGRAILとLOLAを二層モデルで解釈し、月裏側の多孔質な上層と密な下層を推定した。[@P000307]はOrientaleの地下構造を衝突後の流動と断層形成で説明する。[@P000289]では大型火山候補に伴う重力異常を貫入岩体と解釈しており、同じ重力でも地質条件に応じた密度モデルが必要になる。'
- heading: 月震波形で震源と浅部構造を調べる
  paragraphs:
  - '[@P000304]は反復する浅発月震を見いだし、すべり方向と潮汐位相の関係を調べた。[@P000300]はP波の偏波とS波・P波の時刻差から、単一観測点で震源を求める。前者は断層の起動、後者は定位手法に焦点を置く。'
  - 浅部探査を扱う[@P000302]は、空洞の検出に使う常時微動の周波数と寸法感度を比較した。試料の熱履歴を使う[@P000299]は、Apollo 17コアから地中の温度勾配を求める。地震波と熱の記録を合わせることで、重力だけでは決まらない浅部の性質を補える。
- heading: 若い試料の磁化から全球磁場の停止を制約する
  paragraphs:
  - '[@P000288]は月裏側起源と推定される隕石の古地磁気を測り、若いApollo試料と比較した。約7億年前の弱い磁場の記録は、過去約10億年間に全球的なダイナモ磁場がなかった可能性を支持する。試料の起源と記録年代を踏まえて内部活動の時間史を読む。'
- heading: 低温の熱伝導と、火成岩体の制約
  paragraphs:
  - Divinerの全球熱物性を求めた[@P000334]に対し、[@P000335]は100 K未満まで固体熱伝導を拡張し、[@P000339]は赤道から永久影まで一貫して扱うモデルを作った。[@P000338]は氷含有模擬物の実験で、氷量と粒子間の氷構造がともに熱伝導へ効くことを示す。火成起源の制約には、重力・磁場を共同解析したDewarの[@P000322]と、マイクロ波温度からAristarchusを調べた[@P000337]を比較できる。
  - 熱伝導率は温度だけでなく粒子構造にも応答する。[@P000331]は粒子の形と充填を熱抵抗ネットワークへつなぎ、レゴリス成熟度の補完指標を提案した。全球の熱物性推定と比較する際に、試料の粒子構造が測定量へどう反映されるかを調べる研究となる。
- heading: 高度と重力の観測を選ぶ
  paragraphs:
  - LALTのレーザー高度観測[@P000169]とRSATのドップラー追跡による重力観測[@P000170]は、かぐやによる地形・内部構造研究の入口である。LOLAもレーザー高度を測り、GRAILは衛星間の追跡から重力場を求める。LOLA地形とGRAIL重力を組み合わせた密度構造の解析は[@P000301]、GRAILの重力勾配から空洞候補を探す研究は[@P000194]を参照できる。高度、重力、推定された密度・空洞形状を順に対応させると、観測量と逆解析の結果を区別して読める。
- heading: 軌道・試料からの推定に、ロボットの深度測定を加える
  paragraphs:
  - Divinerに基づく熱物性推定[@P000334]やApollo 17コアの熱履歴[@P000299]に対し、[@P000366]はBlue Ghost
    Mission 1のLISTERで窒素ガス掘削を実施し、0.288〜0.971 mの8深度で温度・熱伝導率を測った。測定場所と深さが分かる現地データを加える装置実証である。設計深度3
    mへの到達と熱データの詳細解析は残るため、低温モデル[@P000339]との定量照合は解析結果を待って行う。
- heading: 試料のLi同位体で内部組成を補う
  paragraphs:
  - 重力が捉える密度構造に、[@P000375]と[@P000376]のLi同位体比較を加えると、月内部の組成を別の観点から検討できる。[@P000372]は月隕石から地球に近いマントル値を支持した。
lineage:
- title: 月裏側の重力から地殻厚へ
  steps:
  - paper_id: P000170
    title: 裏側の盆地構造を制約
    significance: リレー衛星による追跡から裏側重力場の精度を改善した。
  - paper_id: P000180
    title: 地形を加えて地殻厚を求める
    significance: 重力場と全球地形を組み合わせ、盆地の構造差を解釈した。
    connection: 重力と地形の統合
  - paper_id: P000301
    title: 浅部の密度と空隙を推定する
    significance: 高分解能重力と地形を二層モデルへ当てはめ、多孔質な上層を推定した。
    connection: 地殻厚に加えて浅部の密度構造を調べる
- title: 反復月震の識別と単一観測点での定位
  steps:
  - paper_id: P000304
    title: 浅発月震の繰り返しを捉える
    significance: 同一震源と考えられるイベントから断層すべりと潮汐の関係を検討した。
  - paper_id: P000300
    title: 一台の地震計で位置を求める
    significance: 偏波解析と到着時刻差を使い、月震と衝突の位置を推定した。
    connection: 震源物理の解析に定位手法を補う
- title: 全球熱物性から極低温・氷構造へ
  steps:
  - paper_id: P000334
    title: 全球の熱物性を温度観測から求める
    significance: Divinerから密度・熱伝導率の深さ方向分布を推定した。
  - paper_id: P000335
    title: 極低温の固体熱伝導を加える
    significance: 20〜400 Kの熱物性を組成・密度・固体物理からモデル化した。
    connection: 全球推定の低温側を理論から補う
  - paper_id: P000339
    title: 低緯度と永久影を同じモデルで扱う
    significance: Divinerに整合する全球低温熱伝導モデルを示した。
    connection: 低温物理を全球の温度計算へ統合
  - paper_id: P000338
    title: 氷の形態を実験で変える
    significance: 粒子間を結ぶ氷と分散した氷の熱伝導の違いを測った。
    connection: 乾燥レゴリスのモデルに対し、氷含有物性を別条件で補う
- title: 試料の熱履歴と現地での深度測定
  steps:
  - paper_id: P000299
    title: コアに残る浅部の熱履歴を読む
    significance: Apollo 17コアから地中の温度勾配を推定し、深さ方向の温度構造を制約した。
  - paper_id: P000366
    title: ガス掘削で温度センサーを配置する
    significance: 約1 mまで到達して8深度で測定し、現地の温度・熱伝導率データを得る手段を実証した。
    connection: 試料履歴による推定と、その場の深度測定を比較する
