    method: 地球磁気圏尾部のLunar Prospector電子観測で、上向き電子ビームを強い負帯電の指標として統計化。
    contribution: 500 eV超の上向き電子ビームで選んだ強い月面–LP間の負電位差は、日照・日陰の双方で主にプラズマシートに現れた。周囲プラズマ基準の月面電位にはLPの帯電補正が要る。
