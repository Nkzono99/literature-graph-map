- paper_id: P000274
  group: particles-and-potentials
  role: 観測視野と太陽風条件を考慮した複数磁気異常のENA遮蔽比較
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-11'
    recheck: false
  summary:
    question: CENAが観測した月の10磁気異常では、150–600 eVの中性水素フラックスの減少が常に現れるか。また、その減少率は地殻磁場・太陽風動圧・惑星間磁場とどう関係するか。
    method: Chandrayaan-1/CENAの昼側・緯度±60°の87軌道を解析し、ENAフラックスを時間補正したWINDの太陽風陽子フラックスで規格化する。振幅を適合させた角度散乱関数からの減少率を求め、Lunar Prospectorの高度30 km磁場地図と比較する。異常より広い視野を持つセクター1・5を除いた2–4で磁場との相関を調べる。
    contribution: Gerasimovichでは、視野の広い外側セクターを除くと磁場が強いほどENA減少率が高く、同程度の磁場では低動圧群の減少率が高かった。外側セクターのみの1領域を除いた9領域中4領域で磁場との相関が見られ、2領域は有効観測が各1件、3領域には相関が見えなかった。表面反射効率との交絡と、小規模磁場構造の解釈の限界を示した。
