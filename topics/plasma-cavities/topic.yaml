- paper_id: P000232
  group: expansion
  role: ARTEMISの静電衝撃波観測
  summary:
    question: 月の両側からウェイク中心へ流入する超音速イオンビームにより、予測された静電衝撃波が生じ、電子加熱とイオン減速を引き起こすかを観測で調べる。
    method: ARTEMISの2機がウェイク内と背景太陽風を同時に観測した事例を選び、電場・磁場、電子とイオンの速度分布、密度を解析し、磁力線沿いの流入モデルと照合した。
    contribution: ウェイク中心付近で、下流へ向かう電位上昇、電子の磁力線方向の加熱、イオン減速と密度増加を伴う静電衝撃波の観測証拠を得た。別事例は衝撃波の散逸が進んだ段階と整合した。
  evidence_by_item:
