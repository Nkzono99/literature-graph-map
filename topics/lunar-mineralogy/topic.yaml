- paper_id: P000174
  group: composition
  role: SPアーカイブによるイルメナイト分布
  summary:
    question: 月面のイルメナイト富化を示すスペクトル候補はどこに分布し、火砕堆積物・高地・高Ti海玄武岩との層序関係をどう説明できるか。
    method: かぐやSP Level 2Cで1 µm吸収内の1003.6 nmの小さな盛り上がりと1797.6/752.8 nm反射率比 >2.4を併用し、51観測点を抽出。MI Map 3.0を70 mセルに平均して局所スペクトルを分類し、TC DTMとLROC NAC像で地質・被覆層を読む。
    contribution: 候補の大部分は表側の盆地周縁にあり、暗い火砕堆積物が高地物質を覆う地質と対応する。既存高Ti海の主要分布域は同じ分光特徴を示さず、その原因は鉱物混合・粒径・成熟度・Tiの相配分等の複数の説明が残る。候補分布を資源探査に使う提案だが、含有率や採掘可能質量の実測ではない。
  evidence_by_item:
