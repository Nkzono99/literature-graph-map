schema_version: 1
topic_id: lunar-charging
title: 月面帯電：光電子シース・宇宙環境・地形・ダスト
question: 月面の電位は何で決まり、日照・宇宙環境・地形・粒子の配置によってどう変わるか。
review:
- heading: 月面の電位は、入る電荷と出る電荷の釣り合いで決まる
  paragraphs:
  - 月面には太陽風などの電子・イオンが流れ込み、紫外線や粒子の衝突によって電子が放出される。その収支が表面の電位を決める。光電子を失う日照面は正に、電子の流入が優勢な日陰は負に帯電しやすい。月面帯電を読む出発点は、この電流の釣り合いを整理した[@P000002]にある。日照だけでなく、周囲のプラズマの温度や密度も釣り合いを変えるため、月面電位は場所と時間によって変わる。
  - 放出された電子は表面近くにとどまり、電位が空間的に変化する層、シースを作る。月試料から出る光電子の分布を測った[@P000001]は、その計算に使う材料特性を与えた。この分布を取り入れた[@P000007]は、粒子と電場を追跡するPIC計算でシースとダストの浮遊条件を調べている。[@P000011]は太陽風電子の流れを含む半解析解をPICと比較した。表面の電位を求める電流収支から、表面の上に広がる電場や粒子の運動へと、問いが具体化していく。
- heading: 宇宙環境が変わると、日照面でも強い負帯電が起こる
  paragraphs:
  - 軌道観測は、電流収支で予想される帯電を実際の宇宙環境に結び付ける。[@P000003]はLunar Prospectorの電子観測から、夜側の月面が探査機より平均約35 V低い電位にあると推定した。同じ観測の系列を追うと、地球の磁気圏尾部では日照域でも500 V以上の負電位差が現れ（[@P000004]）、太陽高エネルギー粒子イベントでは約−4.5 kVに達する（[@P000006]）。静かな夜側から磁気圏尾部、太陽活動に伴うイベントへと比較を広げることで、入射粒子の環境が帯電の強さを大きく変えることが見えてくる。これらの電位差は探査機を基準としている。
- heading: 地形は粒子の届き方を変え、空洞の底を正にも帯電させる
  paragraphs:
  - 平坦面で考えた電流収支に、地形による遮蔽が加わるとどうなるか。極域の影の段差を扱った[@P000008]では、太陽風の侵入と表面帯電が互いに影響し、二次電子の放出も陽子の流入を変えた。深い空洞へ上方から太陽風が入る[@P000012]では、側壁で電子が失われ、底へ届くイオンと電子の比が変わる。その結果、光電子放出がなくても底部が正に帯電しうる。側壁から供給される光電子は、むしろこの正電位を緩和する。
  - この空洞モデルを出発点に、[@P000015]は空洞寸法とシース厚の比、[@P000016]は太陽風の流速と粒子の熱速度の比を調べた。前者は空洞が大きくなると底への電子供給が増えることを、後者は流速に応じて底部電位が負・正・ほぼゼロへ変わる条件を示す。地形の議論では、深さや幅だけでなく、シースや粒子運動の尺度と比べることが手掛かりになる。
- heading: ダストの離脱を考えるには、粒子の隙間まで見る必要がある
  paragraphs:
  - 表面全体の電位から一粒のダストへ視点を移すと、材料の電子放出特性に加えて粒子の配置が効いてくる。[@P000005]は単粒子の光電子放出を測り、粒径や粒子電位への依存とバルク試料との差を報告した。さらに粉体では、放出された電子が粒子間の隙間へ再び捕らえられる。[@P000009]のpatched charge model（PCM）は、この再吸収による局所的な負帯電と反発力で、照射実験で見られた粒子の跳躍を説明する。シース中の浮遊を扱う[@P000007]と併せて読むと、付着した粒子が離脱する過程と、離脱後に電場中を動く過程をつなげて考えられる。
  - 微小な配置や照射条件を変える研究も進んでいる。PCMの考え方は粒子と基板の隙間へ拡張され（[@P000013]）、光と低密度プラズマを同時に照射する実験では、単独照射より粉体の帯電と飛び出しが増えた（[@P000014]）。一方、[@P000010]は導電性による電荷の逃げ方が、粒子間の電場の上限を左右することを示す。ダストの動きまで見通すには、電子の放出・再吸収・導電損失を、粒子の形や接触状態と組み合わせて追う必要がある。
public: true
scope:
  include:
  - 月面の電流収支と光電子シース
  - 月面電位の軌道観測と宇宙環境
  - クレーター・空洞の局所帯電
  - 粒子の帯電機構と移動実験
  exclude:
  - 帯電対策装置の設計
  - 摩擦帯電の詳細
  - ダストの長距離輸送量の推定
