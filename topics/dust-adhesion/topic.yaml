- paper_id: P000205
  group: contact
  role: 球状粒子間のvan der Waals力
  summary:
    question: 微小粒子の付着に関わるロンドン・ファンデルワールス力は、球状粒子の直径と粒子間隔によってどの程度変わり、液中ではどう変化するか。
    method: 二つの球状粒子間の相互作用を直径と間隔の関数として計算し、数値表と近距離で使える近似式を導いた。さらに両粒子を液体に浸した場合の修正を検討した。
    contribution: 球状粒子間の引力を見積もる式・数値表と、粒子間隔が小さい場合の近似を提示した。液中でもロンドン・ファンデルワールス力は一般に引力を生むと結論した。
