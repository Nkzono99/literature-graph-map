- paper_id: P000204
  group: roughness
  role: 突起の統計による多点接触
  summary:
    question: 見かけ上平らな金属面が接触するとき、実接触面積や弾性・塑性の変形様式は、表面の突起形状にどう左右されるか。
    method: 表面の凹凸を組み込んだ弾性接触理論を構築した。新しい形状測定装置で、標準的な加工を施した複数の面について、突起の高さ分布と曲率半径を調べた。
    contribution: 弾性接触と塑性接触を区別する基準を示した。表面形状の測定データから、塑性接触が多い一方、工業で使う表面で弾性接触も珍しくないとした。
