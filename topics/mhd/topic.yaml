lineage:
- title: 波動の理論から太陽風の観測へ
  steps:
  - paper_id: P000393
    title: 導電性流体と磁場の波を提示
    significance: 流体運動と誘導電流の力を結び付け、MHD波動の基本を示した。
    connection: ''
  - paper_id: P000411
    title: 太陽風の変動からAlfvén波を読む
    significance: 1970年報告書版では、Mariner 5の1967年の磁場・プラズマ同時観測を対応させ、太陽風静止系での大振幅の外向きAlfvén波を整理した。先端圧縮域には内向き波や非Alfvén成分も混ざり得る。
    connection: 波の理論を宇宙での同時観測へつなぐ
- title: 太陽風の膨張から角運動量輸送へ
  steps:
  - paper_id: P000396
    title: 高温コロナからの外向き流れ
    significance: "外圧と整合しない静水圧状態から膨張流を求め、運ばれるらせん磁場を構成した。磁気力の反作用を無視する近似と温度設定を伴う。"
    connection: ''
  - paper_id: P000397
    title: 回転と磁気トルクを含める
    significance: "回転する定常磁化風の角運動量をAlfvén有効半径へ結び付けた。剛体共回転を意味せず、一定γモデルの観測適合には限界がある。"
    connection: 膨張流から回転する磁化風へ物理を広げる
- title: 磁束の保存から多次元コードへ
  steps:
  - paper_id: P000399
    title: 格子上で磁場の発散制約を維持
    significance: "共有辺EMFの相殺で適合する初期磁束和を保つCTを構成した。初期・境界発散誤差を除去する手法とは区別する。"
    connection: ''
  - paper_id: P000403
    title: Godunov流束とCTを整合
    significance: 二次元・二次精度のCTU/CTで、Godunov面流束と格子辺の電場を整合させた。
    connection: 磁束の更新を有限体積法の多次元流束へ組み込む
  - paper_id: P000405
    title: 検証問題を持つAthenaへ実装
    significance: 保存的な流体流束とCTを一次元から三次元へ実装し、線形波・衝撃波・磁場ループの条件別試験にまとめた。
    connection: 整合的な更新を天体MHDの計算基盤へつなぐ
  - paper_id: P000407
    title: 適応格子と並列実行を拡張
    significance: ブロックAMRと曲線座標へ広げ、粗細境界の流束・EMFを整合させた。性能評価では一様格子とAMRを区別する。
    connection: 数値解法を引き継ぎ、計算の構成と規模を広げる
- title: 発散誤差の移流・比較・クリーニング
  steps:
  - paper_id: P000400
    title: 上流法と適応格子を組み合わせる
    significance: 八波形式を用いるMHD解法を太陽風・磁気圏の計算へ適用した。
    connection: ''
  - paper_id: P000401
    title: 発散制約の方式と保存性を比較
    significance: "発散の離散定義と解精度を分けてCT・射影・八波形式を比較した。射影の精度証明には格子・基礎法の条件があり、一般非線形収束の保証ではない。"
    connection: 方式の実装から、保存性と不連続の比較へ進む
  - paper_id: P000402
    title: 誤差を伝播させ減衰させるGLM
    significance: "補助変数で発散誤差の伝播と減衰を組み合わせた。保存形GLMと非保存の拡張、定係数telegraph解析と観測時間を伴う減衰設定を区別する。"
    connection: 制約処理の別の選択肢として、伝播と減衰を組み合わせる
- title: 流体の再結合からモデル間の比較へ
  steps:
  - paper_id: P000395
    title: 流入・流出と拡散で再結合を考える
    significance: 高い電気伝導度を持つ流体で反平行磁場の再結合を評価した。
    connection: ''
  - paper_id: P000410
    title: 共通条件でHall・PICと比較
    significance: 再結合率の差から、無衝突電流層に必要な物理を検討した。
    connection: 抵抗性モデルの基礎から、共通初期条件でのモデル比較へ進む
- title: 発散制約を流束・高次精度・陽性へつなぐ
  steps:
  - paper_id: P000500
    title: CTを再構成と流束まで一貫させる
    significance: 面磁場と辺電場を基礎に、法線磁場の連続性と四状態の上流化を再構成・運動量・エネルギー流束へ組み込むUCTを示した。発散の精度は流束と同じ離散微分で評価する。
    connection: ''
  - paper_id: P000497
    title: 同一格子の高次差分とcurlを組み合わせる
    significance: 同一格子の磁気ポテンシャルを4次中心差分curlで磁場へ戻し、滑らかな波で約4次収束を得るCT-WENOを構成した。
    connection: 面配置のUCTと、同一格子のポテンシャルcurlで保持する離散発散の定義を比較する。
  - paper_id: P000498
    title: 低圧状態を保つ制限と交換条件を加える
    significance: 高次WENOとCTに陽性flux limiterを加え、低圧試験を安定に進めた。磁場修正後の圧力を保つ全エネルギー補正は、エネルギー保存との交換条件を生む。
    connection: 高次精度と発散制約に加え、密度・圧力の陽性を条件付きで確保する。
