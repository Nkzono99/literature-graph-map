- level: 全体
  items:
    - name: 対照実験で機構を絞る
      use: 二つの説明が異なる結果を予測し、その違いを捉える対照があるとき。
      text: |-
        ## 序論
        〈問いと予測〉

        ## 方法
        〈対照の設計〉

        ## 結果
        〈比較の結果〉

        ## 考察
        〈説明の吟味〉

        ## 結論
        〈問いへの答え〉
    - name: 計算をつないで予測する
      use: 一段目の計算結果を次の計算に渡し、最終的な予測量がどう変わるかを問うとき。
      text: |-
        ## 問いと対象
        ［対象］について、［上流の条件］が［最終的な予測量］に与える影響を調べる。

        ## モデル
        〈計算間の受け渡し〉

        ## 結果
        〈比較の結果〉

        ## 適用範囲
        〈説明の吟味〉

        ## 結論
        〈問いへの答え〉
    - name: 測定から上限を求める
      use: 対象と背景が同じ信号に寄与し、対象に割り当てうる量を制約できるとき。
      text: |-
        ## 探す対象
        ［対象集団と範囲］に［仮説で想定する量］があれば、［観測可能な信号］が生じる。

        ## 測定と換算
        〈測定量と推定量〉

        ## 結果
        〈上限の根拠〉

        ## 結論
        〈問いへの答え〉
    - name: 新しい手法の精度を検証する
      use: 参照値が得られ、評価量ごとに手法を使える条件を決めたいとき。
      text: |-
        ## 手法が必要な理由
        ［用途］には［評価量］を［許容誤差］の範囲で求める必要がある。そこで［手法］を検証する。

        ## 検証方法
        〈基準と評価指標〉

        ## 結果
        〈精度の検証〉

        ## 結論
        〈問いへの答え〉
    - name: 観測された傾向から未知量を絞る
      use: 未知量に応じて変わる順位や分布が予測でき、測定値と照合できるとき。
      text: |-
        ## 問いと予測
        〈問いと予測〉

        ## 推定方法
        〈測定量と推定量〉

        ## 照合と推定
        〈推定の範囲〉

        ## 結論
        〈問いへの答え〉
    - name: 複数の研究を論点別に比較する
      use: 総説で、各研究の証拠がどの説明を区別できるかを整理するとき。
      text: |-
        ## 対象と範囲
        ［問い］を扱う［対象・選定範囲］を取り上げる。比較の軸は［量・条件］とする。

        ## ［第一の論点］
        〈文献間の比較〉

        ## ［第二の論点］
        〈文献間の比較〉

        ## 結論
        各研究に共通するのは［根拠を共有できる知見と範囲］である。［残る説明］を区別するには［必要な証拠］が要る。

- level: 章
  items:
    - name: 問いと予測
      use: 序論で、背景から今回確かめる問いへ絞る。
      text: |-
        〈既知のことと問い〉

        ［説明］が成り立つなら［条件］で［観測可能な違い］が現れる。これを［方法］で調べる。
    - name: 対照の設計
      use: 方法の章で、比較の対象と手順を固定する。
      text: |-
        〈比較条件〉

        ［対象の選び方・反復単位］について［測定手順］を用い、［指標・単位］を求めた。
    - name: 比較の結果
      use: 結果の章で、問いに答える比較を先に示す。独立した比較があれば段落を追加する。
      text: |-
        〈差を報告する〉
    - name: 説明の吟味
      use: 考察で、結果を説明できる理由と、その説明を区別できる範囲を示す。
      text: |-
        〈競合する説明〉

        〈適用範囲を限定する〉
    - name: 計算間の受け渡し
      use: モデルの章で、計算して得た入力と別途仮定した入力を読者が追えるようにする。
      text: |-
        ［入力・境界条件］から［方法］で［中間量］を計算した。［照合した参照値・保存則など］で［確認できた範囲］を確かめた。

        〈次段の入力を定める〉
    - name: 測定量と推定量
      use: 方法の章で、信号から目的量を求める過程に仮定が入るとき。
      text: |-
        ［装置・手順］で［直接測った量と単位］を得た。［対象以外の寄与］を［方法］で評価した。

        〈推定の前提を示す〉
    - name: 上限の根拠
      use: 信号の割り当てや統計モデルから、上限を決めた理由を示す。
      text: |-
        ［補正後の信号・測定範囲］から、［上限を定める仮定・規則とその根拠］に基づき、［対象範囲］の［量］の上限を［値・単位］と求めた。

        〔統計的上限の場合〕この上限は［計算法］による［信頼水準または信用水準］の上限である。

        〔比較できる予測がある場合〕〈予測と照合する〉
    - name: 基準と評価指標
      use: 手法検証の方法欄に使う。許容誤差が用途から決まる場合は、その由来を添える。
      text: |-
        ［評価量］の参照値を［取得方法］で用意した。［共通の入力と評価範囲］で［候補手法］を実行した。

        〈指標を定義する〉
    - name: 精度の検証
      use: 条件ごとの誤差が得られたとき。評価量が複数なら、量ごとにこの章の段落を使う。
      text: |-
        〈差を報告する〉

        誤差を［判定基準とその由来］に照らすと、［利用できる条件・境界または未確定の範囲］となる。
    - name: 推定の範囲
      use: 変数を直接測れず、モデルを通じて候補を絞るとき。
      text: |-
        〈予測と照合する〉

        ［観測と両立する候補・区間］が残った。［測定分解能・交絡・固定した仮定］が、ここで区別できる範囲を決める。
    - name: 文献間の比較
      use: 総説の一章を一つの問いに対応させる。量や条件が異なるときは、比較できる範囲を先に置く。
      text: |-
        ［論点］について［資料群と出典］が共有する観察は［知見］である。［比較する量の定義・試料・条件］をそろえると［一致点または違い］が残る。

        〈競合する説明〉
    - name: 問いへの答え
      use: 結論で、今回の証拠によって答えられた部分を一段落で示す。
      text: |-
        〈結論を限定して述べる〉
    - name: 要旨
      use: 本文を書いた後、問い・手段・主結果・範囲を一続きに圧縮する。
      text: |-
        ［未解決の問い］を調べるため、［対象］に［方法］を適用した。［条件］で［主要な比較結果と必要な値］を得た。この結果は［適用範囲内で言えること］を示す。

- level: 段落
  items:
    - name: 既知のことと問い
      use: 先行研究の紹介を、今回の判断に効く箇所に絞る。
      text: |-
        ［先行研究・出典］では［条件］で［既知の知見］を得ている。［残る条件や説明］については［未決の理由］がある。そこで［今回の問い］を調べた。
    - name: 比較条件
      use: 結果の読み方を変える操作・対照・残る条件差を書く。
      text: |-
        〈対照を定める文〉［そろえた条件］を共通とし、［評価量］で比較した。
    - name: 差を報告する
      use: 結果がどう違ったかを読者に渡す。差を判定しきれない場合も、その精度を記す。
      text: |-
        〈結果を述べる文〉［判断に必要なばらつき、または測定精度］を踏まえると、［差について言えること］である。
    - name: 競合する説明
      use: 同じ観測を説明する候補が複数あるとき。順位を付ける材料が乏しければ、判別条件を結びにする。
      text: |-
        ［観測された特徴］は［説明A］でも［説明B］でも生じうる。両者は［条件］で［予測の違い］を生じる。［現時点の証拠から区別できる範囲、または必要な測定］。
    - name: 次段の入力を定める
      use: 段階を分けた解析で、中間結果をどう使うかを説明する。
      text: |-
        ［中間量］を［補間・変換・受け渡し方法］により次段の［入力量］とした。［別途設定した初期条件］のもとで［最終評価量］を求めた。
    - name: 推定の前提を示す
      use: 測定値、仮定、推定値の関係を明らかにする。
      text: |-
        〈換算する文〉［仮定の根拠］から、この換算を［適用条件］で用いた。
    - name: 指標を定義する
      use: 差、比、頻度の分母や集計単位によって結論が変わるとき。
      text: |-
        ［対象単位］ごとに［指標の算出式・差の符号または比の分母］を定めた。［集計範囲・重み］により［報告する統計量］を求めた。
    - name: 予測と照合する
      use: 観測と理論を共通の量で照合できるとき。
      text: |-
        ［仮定］のもとで予測される［量・単位］は［値または範囲］である。［同じ条件で得た観測量］との［一致点またはずれ］により、［支持される条件・残る候補］を得た。
    - name: 適用範囲を限定する
      use: 特定の誤差や未検証条件が解釈を変えるとき。その影響が生じる箇所に差し込む。
      text: |-
        ［誤差要因または対象外の条件］は［推定量］に［影響の向き・大きさ、または不明な理由］をもたらす。このため［今回判断できる範囲］までを扱う。
    - name: 結論を限定して述べる
      use: 問いへの短い答えに、一般化の範囲を添える。
      text: |-
        ［対象と条件］では、［主な根拠］から［問いへの答え］と判断した。
    - name: 図の読み取りを案内する
      use: 重なった曲線や分布を読者に比較してほしいとき。各点の説明は図に任せる。
      text: |-
        〈図の見所を示す文〉［該当する条件］の［差・傾向］が［解釈］を支える。

- level: 文
  items:
    - name: 対照を定める文
      use: 何を変えた比較かを特定する。
      text: '［操作した条件］と［対照条件］を設けた。'
    - name: 結果を述べる文
      use: 対象、単位、比較相手を伴う結果を示す。
      text: '［条件A］の［評価量］は［値・単位］、［条件B］では［値・単位］だった（［図表・根拠の所在］）。'
    - name: 換算する文
      use: 実測した量から別の量を導く。
      text: '［測定量］を［仮定・換算関係］に基づき［推定量・単位］に換算した。'
    - name: 図の見所を示す文
      use: どの系列のどの部分を比べるかを指定する。
      text: '［図・パネル］では［横軸の範囲］で［系列A］と［系列B］の［比較した特徴］が読み取れる。'
    - name: 基準をまたぐ文
      use: 不確かさを考慮すると基準の前後を判別できない場合に使う。
      text: '［推定値の範囲・算出法］は［判断の基準］をまたぐため、［今回の精度で残る二つの可能性］がある。'
    - name: 図注で系列を区別する文
      use: 実測・推定・計算を同じ図に載せるとき。凡例からデータの由来を読めるようにする。
      text: '［記号］は［実測値と単位］、［線］は［仮定］のもとでの［計算値］を示す。［誤差棒または帯］は［定義］を表す。'
    - name: 表注で条件をそろえる文
      use: 数値の意味を決める分母、単位、欠測の扱いを表に添える。
      text: '［列名］は［単位・分母・集計範囲］で示した。［記号］は［欠測・対象外などの意味］を表す。'
