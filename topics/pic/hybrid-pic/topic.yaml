schema_version: 1
topic_id: hybrid-pic
title: ハイブリッドPIC法・粒子と流体の結合
question: 粒子化する種・集団と電子の閉包、保存則、適応格子・MHDとの領域結合から、hybrid法の近似条件と宇宙への応用を比較する。
review:
- heading: 何を粒子にし、何を流体にするか
  paragraphs:
  - hybrid PICは、運動論を残す部分と流体に近似する部分を組み合わせる計算法である。宇宙プラズマでよく使うのはイオンを計算粒子、電子を流体とする電磁モデルで、イオンの非Maxwell分布やジャイロ運動を残しながら、電子の速い運動を流体方程式へ置き換える。無質量電子を使うCAM-CL（[@P000412]）と、有限電子慣性を残すCHIEF（[@P000415]）では、含む物理と解く方程式が異なる。
  - 別の構成として、[@P000064]は高温電子を粒子、背景の熱電子とイオンを流体に分け、衝突を伴う輸送を扱う。静電hybridでは、イオン粒子とBoltzmann電子からPoisson方程式を解く構成もある（[@P000101]）。さらにMHD-EPICは、大域の流体領域と、イオン・電子を粒子で扱う局所領域を空間的に結ぶ（[@P000418]）。粒子化する種・集団と、結合する領域を最初に区別すると、同じhybridという名前でも比較しやすい。
  - 粒子と場の結合で離散収支をそろえる方法として、LapentaのECSIMは平均速度電流と電場補間に同じ重みを使い、質量行列を通じて非線形反復なしにエネルギー保存を実現する。実証は固定イオン背景中の電子PICであり、流体電子と粒子イオンを結ぶハイブリッドPICそのものの検証ではないが、結合項の仕事を両側で一致させる設計を比較する文献になる。[@P000066]
- heading: 準中性電磁モデルと電子の閉包
  paragraphs:
  - 準中性hybridでは、電子密度をイオンの電荷密度に合わせ、変位電流を省いたAmpère則から電流を求める。単一価イオンなら電子速度は、イオンの平均速度から電流/(電荷×密度)を引いた量になる。無質量電子の運動量式は、流れに伴う電場、Hall項、電子圧力勾配、抵抗を含む一般化Ohm則となり、Faraday則で磁場を進める。電子圧力を密度・温度や圧力の進化へどう結ぶかという閉包が必要である（[@P000416]）。
  - この構成はイオンスケールの波動や不安定性を調べる入口になる。一方、Debye長スケールの電荷分離や電子プラズマ振動を対象にする場合は、そのスケールを残すモデルを選ぶ。CHIEF（[@P000415]）は準中性のまま電子慣性を残し、電子流体方程式の慣性項を一部省く従来近似を改めた。本文の電子閉包は等温・スカラー圧力であり、電子慣性の導入によって電子分布関数やその異方性まで求まるわけではない。
- heading: 電流の半刻み更新・副刻み・低密度域
  paragraphs:
  - CAM-CL（[@P000412]）は、粒子速度より半刻み先に必要な電場を、イオン電流の更新から構成する。多イオン種でも粒子データの走査を減らせる点と、磁場を粒子より細かい副刻みで進める点が特徴である。無質量電子の電磁hybridでは、短波長のwhistler波が陽的な場更新を厳しくするため、粒子と磁場で必要な時間分解能を分けて考える。
  - 大規模な実装では、粒子の少ないセルも問題になる。Ohm則に密度の逆数が入るため、空乏域の電場評価と安定化処理を確認する必要がある。dHybrid（[@P000413]）は、陽的なBoris／Lax–Wendroff計算の安定条件から局所密度の下限を求め、電場評価時に適用する処理を最終手段として実装した。真空で別の場の方程式を解く方法は、本文では代案の議論に留まる。
  - dHybridの膨張雲の例では、セル当たりの粒子を8個から12個へ増やすと低密度域の問題が解消した。粒子統計の不足と物理的な真空を分けて確認する例になる。この稿では電子圧力・抵抗・電子質量を省いており、太陽風と雲の条件も実験から変更している。密度の下限や平滑化を使う場合は、空乏域の深さ・場・波動がその処理にどう依存するかを検証する（[@P000413]）。
- heading: 大域保存則と波の分散誤差を分けて検証する
  paragraphs:
  - '[@P000416]は、陰的中点法、イオン軌道の副刻みと平均、粒子から格子への割り付けを整合させ、大域の質量・運動量・エネルギー保存を導いた。電子圧力の進化には抵抗・粘性の加熱を含める。運動量やエネルギーの保存には境界からの流出・壁の力・熱流束などの条件があり、実際の保存誤差には非線形反復の収束許容値も効く。ここでいう大域の質量保存と、各セルの局所連続式を厳密に満たすことは区別する。'
  - 粒子数を増やしたり、高次の粒子形状と平滑化を使ったりすると統計ノイズを抑えられる。ただし[@P000417]は、冷たい一様背景を伝わる平行波の解析で、有限サイズのイオン粒子と電子格子の応答が完全には相殺せず、イオン慣性長dᵢより長い波でも分散誤差が残ることを示した。同論文が示す誤差の増大は、波長当たりのセル数を固定してΔx/dᵢを増やす系列である。長波長条件kdᵢ≪1だけでは足りず、格子幅Δx/dᵢと粒子形状・平滑化を併せて調べる。粒子数による統計ノイズ、保存量の誤差、波の位相速度の誤差を、それぞれ独立に確かめる必要がある。
- heading: 適応格子とMHD–PICの領域結合
  paragraphs:
  - A.I.K.E.F.（[@P000414]）は、イオン粒子・電子流体という同じ物理モデルの中で格子を適応化し、粒子を分割・統合する。格子段階を横切る波と一様格子との比較から、細分化の継ぎ目を検証した。局所的な細分化は費用を減らす手段だが、粒子統計、場の補間、細分化境界の誤差も同じ物理条件で比較する。
  - MHD-EPIC（[@P000418]）は、物理モデル自体を領域で切り替える。ガニメデへの三次元適用（[@P000419]）では、MHDの密度・運動量・圧力・磁場を使って局所PICを初期化し、以後は周囲の流体解から境界粒子を補充する。PICからは粒子モーメントと磁場を流体側へ戻す。局所領域では電子も粒子として扱うため、準中性イオンhybridとは電子の記述が異なる。
  - FLEKSのMHD-AEPIC結合は、局所では電子・イオンのPIC、大域では典型的にHall MHDと独立電子圧力方程式を使い、新規活性セルと境界を流体情報から作る領域分割の方式である。各方向N≥2セルのパッチを切り替えることで非箱形や離れた領域を扱う。著者が導入で説明する質量なし電子流体の従来型hybrid-PICとは電子の扱いが異なり、独立テスト粒子モードはMHDへの反作用を持たない。[@P000071]
- heading: 宇宙プラズマへの応用を、条件ごとに読む
  paragraphs:
  - 月の大域ウェイクでは、[@P000420]がWind観測からCMEの3期と比較用の上流条件を作り、それぞれを固定した三次元hybrid計算を行った。sheath期には空乏域が短くなり、後続の磁気雲・mid-CME期には長い空乏域が生じる。これは各期の条件に対する比較であり、CME通過全体を連続した時変境界で再現した結果としては読まない。電子流体と圧力勾配の扱いも、電子分布を解くウェイク研究と比較する条件となる。
  - ガニメデの[@P000419]は、Hall MHDとMHD-EPICをGalileo G8の磁場観測と比較し、基準格子ではPICを含む計算が変動のスペクトルやFTEの特徴へ近づくことを示した。比較には、観測軌道の座標を6%拡大し、9分間の計算出力を繰り返して観測時系列へ対応させる調整を伴う。イオン・電子質量比100は固定した近似条件である。高解像度のHall MHDでも観測に近い変動スペクトルが得られ、モデルの違いと格子解像度を併せて評価する必要がある。
  - Xie et al. (2024)は、電子をBoltzmann関係で閉じた質量なし流体、イオンを粒子とする静電hybridをSPISで用い、陰的非線形Poisson解法で直径1.2 kmのクレーターを計算した。境界で準中性を維持しつつ内部の電子雲の電荷分離を扱える点が特徴で、磁場を進化させる電磁hybridとは閉包・場の解法が異なる。電子の近い熱力学的平衡とクレーター径が電子旋回半径より小さいことを条件とし、粗い格子での安定性とシースの精度、短時間の準平衡と最終帯電は分けて評価する。[@P000048]
- heading: 電子流体が再現できる範囲を確かめる
  paragraphs:
  - Wang and Hu（2018）の無衝突・非磁化プラズマにおける静電hybrid–full PIC比較では、イオンを粒子としてシースや軌道交差を含めても、等温Boltzmann電子の閉包が深いウェイクで電子密度と電場を変え、イオン密度にも差を生んだ。無バイアス導体平板、Mach数8、平板長140 Debye長の例では、hybrid密度を分母にした約10%の密度差境界が正規化密度約0.15とVDFの非平衡指標Ψ≈0.02に対応する。これらは本計算の近似的な対応で、帯電物体や磁化プラズマへそのまま使える閾値ではない。[@P000099]
  - イオンスラスタの[@P000101]では、Boltzmann電子密度を非線形Poisson方程式へ入れる静電hybridと、実際のXeイオン・電子質量比を使う完全PICを比較する。Poissonを解くこの構成では、イオン密度と電子密度を全域で同一に固定するわけではない。密度の大まかな形は似ていても外縁には大きな局所誤差が残り、電位にも差が出た。電子温度の異方性と中和電子の放出条件が影響した。電位差だけを単一のポリトロープ指数で直せるかは、別途検証する課題として残る。
  - 選択の出発点は、知りたい量と必要な物理である。イオンの非平衡と磁場の応答には準中性電磁hybrid、電子慣性が効く場合には慣性流体、電荷分離と表面電位にはPoissonを含む記述、局所の電子運動論には領域結合や完全PICを検討する。どの構成でも、閉包と境界条件を示し、代表的な波動、保存量、格子幅・粒子数・時間刻みへの依存を確かめる。
lineage:
- title: 電流更新から陰的保存則と分散誤差へ
  steps:
  - paper_id: P000412
    title: CAM-CLで電流と磁場を進める
    significance: 多イオン種の粒子走査と、粒子・磁場の時間刻みを整理した。
  - paper_id: P000416
    title: 大域保存則に整合する陰的結合
    significance: 粒子・電子圧力・場の離散化を組み合わせ、境界条件付きの保存則を導いた。
    connection: 同じ準中性モデルを、保存性を重視する別の離散化で解く
  - paper_id: P000417
    title: 長波長にも残る相殺誤差を解析
    significance: 有限粒子形状と電子流体の違いから、格子幅と分散精度の条件を示した。
    connection: 保存性に加え、粒子と流体を混ぜる離散化の波動精度を問う
- title: 固定領域のMHD–PIC結合から三次元・動的領域へ
  steps:
  - paper_id: P000418
    title: 二次元の二方向結合を検証
    significance: Hall MHDと局所の陰的PICを同じ計算に組み込んだ。
  - paper_id: P000419
    title: ガニメデ磁気圏を観測と比較
    significance: 三次元の埋め込み領域とGalileoの磁場を対応させた。
    connection: 結合モデルの検証を、具体的な天体と観測へ広げる
  - paper_id: P000071
    title: PIC領域と粒子数を動的に調整
    significance: 動的PIC領域をMHD-AEPICへ埋め込む実装を提供し、波・非対称再結合・Frontera並列試験で動作と性能を検証した。統合の総量保存を保ちながらppc偏りを減らせるが、統計雑音は増え、計算全体の厳密保存とは区別する。
    connection: 局所PICの領域と計算量を動的に変える構成へ進む
public: true
scope:
  include:
  - 準中性のイオンPIC・電子流体モデル
  - 有限電子慣性と圧力閉包
  - 静電hybrid・Poissonと電子近似
  - 衝突性の粒子・流体集団の分割
  - 時間更新・保存則・分散誤差
  - 適応格子・MHD–PIC領域結合
  - 月ウェイク・惑星磁気圏・推進機プルーム
  exclude:
  - hybridという名称を持つ全分野の網羅
  - 速度空間格子で解くhybrid-Vlasov法の詳説
