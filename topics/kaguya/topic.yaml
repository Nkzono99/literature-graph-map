- paper_id: P000170
  group: geodesy
  role: RSAT｜リレー衛星による月裏側重力
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-13'
    recheck: false
  summary:
    question: 地球から見えない月裏側の重力場をリレー追跡でどう拘束でき、盆地の地形支持と中心質量の構造は表側とどう違うか。
    method: 2007年10月31日–2008年4月1日のSELENEの4ウェイドップラーと2ウェイ追跡・測距、既往データを用い、Main・Rstarの軌道と次数・位数90のSGM90dを同時推定する。地形モデルSTM-359_grid-02と地殻密度2800 kg/m³でブーゲー異常を求め、中心異常と環状構造を比較する。
    contribution: 裏側の盆地縁に対応する環状重力異常を示し、地形補正後の中心異常からType I・IIを分けた。硬い地殻・リソスフェアによる支持、中心部の過剰補償や局所補償、表側でのより大きな変形を解釈したが、北側の観測空白と次数60超の事前拘束が残る予備モデルである。
