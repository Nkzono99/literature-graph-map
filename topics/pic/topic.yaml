schema_version: 1
topic_id: pic
title: PIC法・プラズマ粒子シミュレーション
question: 粒子と場の結合、数値誤差、陰解法、境界処理から大規模計算まで、PICの手法と実装をたどる。
synopsis:
- PIC法は、計算粒子の運動と格子上の場を往復させ、分布関数と集団の応答を結び付ける（[@P000059]）。教科書と教材（[@P000060]、[@P000061]）が実装の入口であり、静電場の求解はPoisson解法のテーマとつながる。
- 手法の発展は、電荷保存を割り付けの段階で満たす方法（[@P000159]）やGauss則残差の補正（[@P000062]）、陰解法による時間刻みの緩和（[@P000064]、[@P000065]）、エネルギー保存を設計に組み込む陰解法（[@P000066]）に沿って進んだ。統計ノイズ、保存量の誤差、分散誤差は別々に評価される。
- 実装では、曲線格子で形状に合わせる方式（[@P000068]）、一様格子のパッチで運動論領域を選ぶ方式（[@P000071]）、並列化と粒子統合（[@P000069]、[@P000070]）が、境界の表現と計算負荷を分けて比較する材料になる。
review:
- heading: 粒子と格子の往復で、分布関数と場をつなぐ
  paragraphs:
  - "PIC（Particle-in-Cell）では、多数の実粒子を代表する計算粒子を動かし、その電荷や電流を格子に集めて場を求める。得られた場を粒子位置へ戻すことで、粒子の運動と集団としての応答が結び付く。[@P000059]はこの数値実験で分布関数、非線形現象、輸送を調べる考え方をまとめている。実装から学ぶなら、一次元の静電・電磁コードを出発点とする[@P000060]の教科書と、KEMPO1の教材[@P000061]が入口になる。静電場を解く部分は、Poissonソルバのテーマともつながる。"
  - "[@P000061]は、一次元電磁PICのKEMPO1を用い、FDTD格子と粒子の接続、離散電荷保存、自己力を抑える補間、相対論的な粒子更新を説明する。一次元の簡略熱揺らぎモデルでは、同じDebye長と格子幅に対する相対静電雑音は粒子/セル数の逆数に従う。固定背景イオンと二電子群の演習では、各群256粒子の長時間計算で捕捉構造が散逸する一方、4096粒子では電子ホールが持続すると説明し、粒子数が非線形構造の見え方に影響する点を示す。縦電場を除く設定は共鳴を乱す雑音を抑えるが、その電場との相互作用も除くモデル制限である。収束・解像度を学ぶ教材として位置づけ、式表記や一部の推奨入力に残る確認事項を伴う。式表記、図と本文推奨入力の対応、p.20の時間刻みと同章CFL条件の不整合には未解決の留保がある。"
  - "[@P000059]は、有限サイズ粒子による近接衝突と短波長応答の調整、格子への電荷割当・場の解法・力の補間、静電・電磁・低周波Darwinモデルの選択を整理する。quiet startと分布・試験粒子・波の相関診断を組み合わせ、一次元シートの試験粒子の熱化と全分布の緩和、二次元熱的磁場横断輸送の固定点と粒子軌道上の相関を区別する。電子リングの静電例では冷温電子の非線形cyclotron共鳴、相対論電磁の自由電子レーザー例では静電波への捕獲を飽和と結び付け、場や空間次元を変える対照計算で機構を検証する考え方を示す。これらの低次元モデルや縮小質量比の結果を実系へ移す際には、捨てた自由度と揺動の尺度を確認する必要がある。 リング例の密度割合は本文とFig.46、FEL例のスペクトル時刻は本文とFig.55で表記が異なるため、その値は統一せず扱う。"
  - "非構造格子に同じWhitney形式を使っても、場と粒子のモデルは異なる。[@P000480]はMaxwellのcurl方程式と離散連続式を結び、初期Gauss制約を保つ電磁PICを構成する。[@P000481]は運動論的イオンと断熱電子の準中性閉包を空間の変分原理から離散化し、時間更新にはBoris法を使う。空間の変分構造と時間積分の性質を分ける必要があり、[@P000488]の磁場回転で得る位相空間体積保存も、粒子・場全体のエネルギー保存とは別の条件として評価できる。"
- heading: 保存則とノイズは、別々に確かめる
  paragraphs:
  - "[@P000159]は、粒子移動前後の形状関数の差を方向別に分解し、離散連続の式を満たす電流を構成した。各一次元因子が規格化された積形状関数なら必要な方向別総和条件を満たし、二次スプラインへの拡張と2次元空間での面外電流の構成を示す。Gauss則の維持には初期場の制約と差分Maxwell更新との整合が必要で、例示アルゴリズムは各方向の移動を1格子幅以下とする。保存則への整合を高次形状に広げる研究として位置づけられる。原稿の時刻・差分添字・2D面外電流符号は実装時の照合を要する。"
  - 格子に割り付けた電荷と電流が離散の連続の式を満たさない場合、Maxwell方程式を時間発展させるだけではGauss残差が蓄積しうる。[@P000062]は、無次元表示の残差F=div
    E−ρの勾配をAmpèreの式に加え、境界でF=0となる条件のもとで誤差を局所的に拡散させる方法を示した。楕円型求解を加えず割り付け方法を固定しない一方、拡散係数は安定性と対象物理に合わせて選ぶ必要がある。2次元マグネトロン例では無次元係数d=0.001が残差を小さくほぼ一定に保ち、d=0.01は発振開始を遅らせたため、残差の大きさと物理への影響をともに確認する精度管理として位置づけられる。
  - 弱い不安定性では、初期粒子配置を静かにする方法と、平衡分布を解析的に扱って摂動だけを粒子で追う方法が重要になる。[@P000063]はモーメント補正とHammersley系列のquiet
    startを電磁δf法と比較した。δfマーカーは全非線形軌道を進み、重みの発展から摂動電荷・電流を求める。周期1D3Vの温度異方性whistler試験では線形成長と飽和が明瞭になり、異方性比2の例では同等のtotal-f結果にはほぼ3桁多い粒子が必要になると著者は見積もる。この比較は当該試験の粒子数を対象とする。
  - '[@P000072]は、追跡点の間を接続した位相空間シートから電荷を格子へ投影するSICを、1Dの冷プラズマ振動、二流不安定性、Landau減衰でPICと比較した。滑らかな分布では少数追跡点でも粒子ノイズが少なく、区分線形密度は区分一定密度より速く収束した。ただし多数点では格子・有限流数が誤差を制限し、二流不安定性の非線形折り畳みでは再分割による点数増大が必要になる。水平／垂直シートの接続選択も、多ビーム不安定性と線分伸長のどちらが精度を制限するかを変える。'
  - "[@P000475]は、Maxwell場にYeeのleap-frog、粒子に時間中心CNを使い、電場補間と電流付与の形状関数を一致させ、セル横断軌道をセル内区間へ分けることで、相対論的PICの離散エネルギー・電荷保存を組み合わせた。光波分散は標準の陽的場更新を保ち、CFL制約も残す。単精度の1D周期Weibel試験（64格子、200粒子/セル、Δt=0.99Δx/c、質量比1836、5反復）では10^7ステップまで通常の整数時刻磁気エネルギーを用いた総エネルギー相対誤差が約10^−4、正規化Gauss残差RMSが約10^−5に留まった。保存定理の磁気エネルギーは半時刻場の内積であり、高波数支配では正性を保証しない。この区別は、厳密保存量と実用的なエネルギー診断を比較する際に必要になる。"
  - "エネルギー保存と局所電荷保存は、離散化の別の条件から生じる。一次元静電系の[@P000472]は時間中心化による仕事の一致に、セル境界での粒子移動と軌道平均電流を加えて両者を保つ。電磁系の[@P000474]は中点則でエネルギーを保つ一方、局所電荷は保存せずGauss則の監視を要する。[@P000475]はセル内軌道を分割して電荷保存を加えつつ、陽的場の光波分散とCFL制約を残す。保存される量に加え、場の刻み制約、非線形収束、粒子軌道の精度を分けることで、陰解法の利点と適用範囲を比較できる。"
  - "[@P000473]は、エネルギー保存型semi-implicit PICの更新後に粒子位置を移して電荷密度を補正するGL-ECSIMを示した。位置補正ステップは速度と場を変更しないためエネルギーを保つが、実用設定ではθ=0.51と発散の拡張ステンシル混合で振動を減衰させる。周期二重電流シート試験（mi/me=25、Δx=.05、Δt=.1、t=400）ではaccurate補正のGauss残差は正味電荷より約5桁、近似補正では約1桁小さくなり、拡張差分を用いるGL-ECSIM-2は全エネルギーが約3%減少した。global近似はaccurate補正より計算費用が小さい一方、電子pressure tensorと細かな電荷構造では必要な格子幅が異なる。"
  - "[@P000480]は、頂点電荷にWhitney0-form、辺電流に粒子の要素内直線軌道に沿うWhitney1-formの閉形式積分を用い、非構造三角格子で離散連続式を解析的に満たす。非対角Galerkin Hodge行列でDelaunay格子への限定を避け、一次Maxwell curl式と初期Gauss条件から制約を保存する。要素を横切る軌道は区間分割し、leap-frogの時間刻みにはCourant型の制限がある。2Dのサイクロトロンと膨張プラズマ球で数値検証するが、掲載表は本文の一律の有効桁数を裏づけきらず、代数的保存と浮動小数点の残差評価を分けて読む必要がある。"
  - "[@P000477]は、5 mTorrアルゴンの2D容量結合放電でDI-PICと陽的EC-PICを高解像MC-PICと比較し、初期Debye長を超える格子による計算時間の短縮を示した。下部給電電極の両端と接地側壁の間には、各2.25 mmの横方向真空gapがある。陰極イオン電流の平均偏差は約7.7%だった一方、中心電子温度の平均偏差は32.1%で、目的の物理量に応じた精度判断が要る。DIの数値加熱・冷却は刻みと格子の比で抑えられる条件があるが、100 Vの電極系では大きい刻みに線形近似を拡張できない。ECの格子制約緩和と、DIの時間刻み拡大を区別する。 Eq.12・周期系fit・Fig.14(b)の表記には未解決点が残る。"
  - "[@P000478]は一次元静電・周期境界でCIC、LEWIS、CELESTEを比較し、粒子への総力と離散Gauss則の電荷密度が同じ格子位置・補間で対応することを運動量保存の条件として整理した。CICの電場平均は運動量を保存する一方、時間刻み縮小だけでは消えないエネルギー誤差を導く。CELESTEでは冷ビームのB=U0/(ωpΔx)>0.2でT=10000まで運動量損失が観測されないが、温かいドリフトの運動量減衰時間はNDに比例し、CICの温系加熱は概ね1/NDで減る。保存性の比較には、不安定性、粒子統計、粒子の一歩の移動量を併せて検証する必要があり、CICの安定性予測と計算の不一致は未解決として残る。 ND=NpλD/LはDebye長当たりのシミュレーション粒子数で、セル当たりの粒子数ではない。ΔT=ωpeΔtから時間座標T=ωpe tを整合的に推定する。冷ビームCICで著者が静電場エネルギーの成長から測ったγ/ωpe≈0.2は、電場振幅の成長率へ変換せず引用する。"
  - "[@P000482]は静電・微小時間刻みの分散解析とCCB実験から、冷たいドリフトビームではエネルギー保存PICにも有限格子不安定性が残る一方、ドリフトMaxwell分布には電子Mach数M#=U/vTが約1以下でセル幅によらない安定窓があることを示した。m=1,2の補間と二項平滑化有無でこの窓は共通し、運動量保存PICでは格子幅対Debye長の制約が残る。高次補間と平滑化は冷たい成長率を低減し、m=2・平滑化有では任意ドリフトに対する安定条件をΔ≲8λDへ緩める。mi/me=1846の両極性スラブ膨張も局所λD/Δ<0.1で安定側を進展するが、密度・熱速度を限定した診断であり、全時刻のMach数上限や大時間刻みの安定性へ一般化はできない。 温かい分散式の係数と冷たい極限の対応も印字上未解決（PDF p.5 Eqs.14–18、p.4 Eq.10）。"
  - "[@P000488]は電場加速の前後半歩の間に磁場の解析的回転を置くBoris-Cを提案し、相対論的な(x,u)位相空間の体積保存と全更新の2次精度を示す。m=q=c=1、u0=(1,0,0)、Bz=1・Ex=0.1、Δt=π/6の一様場試験では、従来Boris-Bより相対運動量誤差を約2桁減らした。純磁場の位相遅れも除かれるが、電場と磁場の分割誤差は残る。速度更新単体の費用は24–26%増えた一方、著者のリコネクションPIC全体ではXC50/FX100で1.2%/3.3%増に収まり、局所pusherの費用とコード全体の性能を分けて評価する必要を示す。"
  - "[@P000487]は、0.3 m・30 mTorrのヘリウムRF放電（13.56 MHz、1000 V）で明示的EC-PICを比較し、一様格子のΔxを32Δxrefまで粗くしても安定性を保つ一方、8Δxref（約1 mm）を超えるとシース勾配の分解不足で精度が落ちることを示した。各電極から5 cmを細分化した非一様格子では、最粗の[Δxmin,Δxmax]=[4,32]Δxrefで2048セルを218セルへ減らし、イオン密度1-norm誤差4.3%、電子温度のx成分の1-norm誤差5.1%を得た。保存性による格子加熱抑制と局所的な物理分解能は別の役割をもつ。総初期粒子数を一定にした比較なので、粒子再配分を前提とする多次元高速化予測は実測値と区別される。"
  - "[@P000489]は磁場回転だけをn個のBoris要素に分け、Chebyshev多項式の一回式へまとめた。小刻みでの相対位相誤差主項は−(ωcΔt)²/(12n²)で、二次精度のまま係数を減らす。磁場優勢の一様場試験ではn=4がn=1より最大相対u誤差を10.9～16.5倍小さくしたが、電場優勢条件では改善が小さい。位置更新はΔtのままなので、E=0の半径誤差約1%にはωcΔt≲0.5√[n²/(n²+2)]が残る。非一様場のΔt=π/10試験ではt≈2×10⁵まで総エネルギー相対誤差が10⁻⁴程度だった。体積保存とこの試験の長時間エネルギー挙動は区別し、実行速度は測定CPUと実装の条件に合わせて比較する。"
- heading: 時間スケールの差を、陰解法で扱う
  paragraphs:
  - "速い電子運動と遅い変化を同時に追うと、時間刻みが計算費用を左右する。[@P000064]は陰的モーメント法で粒子と流体を結び、衝突を伴う電子輸送を扱った。相対論的な完全陰解法（[@P000067]）も併せると、結合の解き方と保存性を比較できる。計算条件を選ぶ際には、安定性とともに対象現象の時間・空間分解能を考える。"
  - "[@P000067]は、相対論的なエネルギー保存PICを場と粒子の縮約問題へ組み替え、場を線形に解くFHと粒子応答の非線形性を保持するKEを比較した。1次元対向流と2次元二重Harris電流シートの電子・陽電子対プラズマで保存性と線形成長を検証し、粗い対向流条件ではKEが頑健だった。ただしfilamentationの成長精度には相対論的表皮長を解像する必要があり、Gauss則・電荷保存の強制は残された。特定の2次元FH試験の2000ステップは陰的29200 s、陽的7900 sで、格子・時間刻みの緩和による利点と一ステップ当たりの反復費用を併せて評価する必要がある。式33の密度符号、図3と本文の終了時刻、two-stream全ケース未解像の記述、σと電流の正規化規約は未解決。"
  - '[@P000065]は、CELESTE3Dの陰的モーメント法で補間関数の展開から密度・電流の閉包を作り、新しい場を求めてから粒子を進める手順を整理した。これにより粒子・場結合の反復を避け、電子プラズマ振動やDebye長に固定された陽解法の安定性制約を緩和する。ただし、平均電子移動の精度条件
    v_th,e Δt/Δx<1 と有限格子不安定性の条件 Δx/Δt<ςv_th,e が残り、格子幅と時間刻みは関心尺度に合わせて同時に選ぶ。時間精度はθ=1/2で2次、1/2<θ≤1で1次となる。磁気圏尾部の8桁の節約は代表的な刻み幅からの丸めた概算であり、1日対80万年を精確な速度比として一般化しない。'
  - LapentaのECSIMは、半ステップずらした既知の粒子位置と平均速度による電流を使い、粒子の電場応答を質量行列で線形場方程式へ組み込む。θ＝1/2で粒子と場の仕事を一致させるため、完全陰解法の非線形連成反復を省きながらエネルギーを保存する。直接線形解法の1次元試験では誤差が丸め誤差水準となるが、反復線形解法では許容誤差に依存し、運動量・電荷の厳密保存や物理解の精度は別に確認する必要がある。[@P000066]
  - "[@P000472]は周期境界の一次元静電系で、CN時間中心化、軌道平均電流、セル境界停止を伴う適応粒子サブステップを組み合わせた完全陰的PICを構成した。全エネルギーの保存には非線形収束、局所電荷の保存には適合した配分と一セル内の移動（付録の証明は電荷形状次数m≤2）が必要で、運動量は厳密保存しない。IAW試験（Te/Ti=10^4、mi/me=200、L=10λD）では、エネルギーを保つ固定刻みCNにも長時間誤差が残り、適応・電荷保存CNの場Δt=4ωpe⁻¹が陽的Δt=0.005とよく一致した。この800倍は場刻み比である。別の安定性基準による一次元効率試験ではkλD=0.02でCPU比15.4を得たが、等精度性能比較と多次元実測は残る。"
  - "[@P000474]は粒子運動とMaxwell方程式を陰的中点則で同時に解き、同じ補間重みで電流の仕事と粒子のエネルギー変化を一致させた。孤立系の離散エネルギー保存に対し、実計算の精度は非線形ソルバーの許容誤差に依存する。粗格子Maxwellian試験で数値加熱を抑え、two-streamとWeibelの線形成長を再現した一方、電荷と運動量は保存せず、特徴速度に対するvc Δt/Δx<1.5の経験的条件とGauss則誤差の監視が必要だった。kinetic enslavementは粒子を内側で解き、静電試験の外側未知量を1064から64へ減らした。"
  - "[@P000476]は、周期一様格子の2D-3V Vlasov–Darwin系で、局所電荷、Darwin全エネルギー、無視座標方向の粒子正準運動量を同時に保存する完全陰的PICを示した。粒子をセル境界ごとに副刻みし、軌道平均電流と場の補間を整合させ、非線形反復を収束させることが保存則を支える。流体前処理は低周波・大領域の計算を効率化するが、x方向の力学的運動量は厳密保存されず、強磁化や電子Bernsteinモードで反復効率が低下し得る。"
  - "[@P000479]は、一様で時間不変の外部磁場を受ける無衝突・静電プラズマで、CN法の直線サブステップが複数セルを横切ることを許し、セル内区間平均を電場取込と電流付与に共用した。軌道を解き直す刻みと保存用の区間処理を分離し、周期境界または電位ゼロ完全導体・完全反射壁で局所電荷と全エネルギーを保つ。磁化電子・非磁化イオンのMTSIでは、mi/me＝10000、Δt＝0.127ωpi⁻¹（ωceΔt＝180）で、Δt＝0.2ωce⁻¹を基準とする同一最終時刻の推定加速率430倍を得た。電子旋回を解像しなくても、電場の勾配長と不安定性の成長時間の解像は必要であり、非一様磁場・自己無撞着な電磁場・有限Larmor半径効果への拡張は今後の課題に残る。"
  - "[@P000483]は、保存的な完全陰的1D静電PICで粒子を電場残差に非線形消去し、電子の連続式・運動量式から作る流体近似をNewton–Krylovの前処理に用いた。温度応答と対流項を省く近似は反復の加速に使われ、収束した運動論的な解を流体解へ置き換えない。無磁場・無衝突のイオン音波試験では、質量比100から10000へ増やした一様格子のGMRES反復が、前処理なし8から50.1回に対し、あり7から13.5回に抑えられた（L=100λD,Nx=512,粒子/セル1000,Δt=0.1ωpi⁻¹、20刻み平均）。ただし粒子軌道のサブステップにより、場の刻みを伸ばすだけの速度効果は飽和する。長波長の約3桁の陽解法に対するCPU速度比は、陰解法Nx=32固定と陽解法Δx≈0.3λD固定を比べた準中性条件の結果であり、前処理による追加効果は約2倍だった。"
  - "[@P000484]は、変分PICに粒子subcyclingを導入し、電荷保存と粗い場刻みの精度を分けて検討した。磁場を軌道平均し電場を同期時に一度だけ加える陽的場方式は、周期0.1・粒子刻み0.005の磁化1D–2V試験で、場刻みが周期に近づくと人工振動を生む。電場と磁場の双方を作用内で平均する全球陰的方式は、静電試験の場刻み0.40、電磁試験の0.16まで巨視的挙動を保ったが、三次splineの場合のMaxwell安定条件Δt<sqrt(17/14)Δxは残る。電場平均を非変分的に追加すると短時間曲線は改善しても1000時間単位の試験でエネルギーが増大し、軌道平均と構造保存を一緒に設計する必要を示した。"
- heading: 粒子と流体の分け方を選ぶ
  paragraphs:
  - ハイブリッドPIC法では、イオンを粒子・電子を流体にする構成、静電場とBoltzmann電子を組み合わせる構成、大域MHDと局所PICを領域で結ぶ構成を区別する。電子慣性や圧力閉包、準中性近似とPoisson方程式の違いは、再現できるスケールを決める。子テーマの「ハイブリッドPIC法・粒子と流体の結合」で、数値更新・保存則・分散誤差と宇宙への応用を比較する。衝突性プラズマの集団分割（[@P000064]）も、この観点で読み直せる。
  - FLEKSでは一様な直交PIC格子の活性パッチを切り替え、時間刻みの配置を保った調整と、質量・運動量・運動エネルギーを保存する6→5の粒子統合で長時間計算の負荷を抑える。波・再結合試験では主要な非Maxwell分布を保持したが、粒子を減らした部分の雑音は増えた。空間AMRはこの刊行版では開発中である。[@P000071]
- heading: 物体形状と計算規模に合わせて構成を選ぶ
  paragraphs:
  - '[@P000074]は、Boris法とPoisson解法を共通エンジンへまとめた並列ES-PICを用い、磁場中の正電位探針で電子流出と吸収を補う境界処理を示した。電子が磁化されイオンはほぼ非磁化の例では負電位の後流、両種が磁化された例では電子捕捉とイオンに富む翼を得る。流れのある二例の電流は全領域換算で約3.4
    mAと約3 mAで、著者が引く既報の2.1 mA、4 mAとは差がある。粒子槽、反射、電子電流帰還を問題に応じて使い分け、周期境界が探針列を表す条件も明示している。'
  - '[@P000073]は、疎格子で切り落とされた階層B-spline基底を、粒子密度のGalerkin係数に応じて局所的に戻すHSG-PICを提案した。密度surplusをセル体積で正規化して選別し、候補階層をSchur補元で探索するため、大きな一般化空間を丸ごと解く費用を避ける。2次元diocotronの初期密度では線形基底の2次収束を回復し、粒子を含む総誤差試験でも疎格子のノイズ低減を保った。製造解の単一CPU比較（線形基底、h=2⁻⁶、σ=0、ε=0.0005）では、同程度の密度L²誤差をSTDより約17.7分の1の粒子と45分の1の節点で得た。Poisson求解を省いた1反復当たりの計算時間は4.74分の1だった。これらは周期2次元の検証であり、3次元化と非矩形形状は今後の課題である。'
  - '[@P000068]は、物体に沿う非一様構造格子を一様な論理格子へ写し、曲線格子の静電PICを構成した。粒子の位置を論理空間、速度を物理空間で持つhybrid
    moverにより、物理格子上のセル探索を省く。非直交格子の時間2次精度は、半ステップ予測と計量再補間を加えて維持する。場は保存的な空間2次離散化とBoxMGで解き、球殻の人工解で2次収束と格子数にほぼ比例するserial計算量を示した。平面壁と導体球の吸収境界では、帯電・遮蔽を解析解、OML近似、球対称PICと比較した。一様磁場の球では電子の赤道捕集が減り、負の浮遊電位が浅くなる例も示す。本論文の検証は対称性を使った2D3Vであり、複雑な宇宙機を扱う多block格子と3-D並列化は拡張計画として記述される。'
  - 粒子の偏りと格子保持量を同時に扱う方法として、[@P000069]は等サイズの主領域を固定し、各プロセスが最大一つの副領域を援助するOhHelpを提案した。重い領域の粒子を複数の援助者に渡し、格子複製を一プロセス最大二領域に抑える。既存の援助関係で許容担当数を満たせる間は局所移送で維持し、満たせなくなった時に全体再割当てする。
  - T2K256コアの純PIC評価では、均一分布と局所集中分布の強スケーリング速度比が粒子分割参照コードの逐次に対して180.38倍・158.98倍だった。試験は、同数・等絶対値の正負電荷を持つ粒子を置いた電荷中性の系が、外部場なしでほぼ等速に動く周期境界・α=0.2の設定であり、導体を含むPoisson解法や衝突計算は拡張課題として残る。[@P000069]
  - Luuらは、同じセルの粒子を位置・運動量の広がりに応じて分割し、各集合を重み付き重心へ置き換えることで粒子数を減らした。二流不安定性では32万粒子を17.8万へ減らし、結合なしに対する最大エネルギー相対誤差は0.006、磁気シャワーの標準設定では計算時間を約6倍短縮した。総重みと運動量を保ちながら位相空間の異なる流れを混ぜる誤差を抑えるが、エネルギーは厳密保存せず、位置・運動量許容差を問題ごとに検証して選ぶ。[@P000070]
  - "[@P000481]は、運動論的イオンと断熱電子の準中性モデルを2D非構造三角形格子へ離散化し、電荷をWhitney 0-formで頂点へ付与し、辺の電場を離散外微分で求め、Whitney 1-formで粒子へ補間する設計を変分原理から導いた。周期矩形のIBW分散を理論と照合し、固定電位・粒子反射境界の円形領域では方位・径方向の固有構造も求めた。同じ周期格子での比較（2111頂点、4000三角形、1.28×10⁶粒子、Δt=0.02/Ωi、2400/Ωi）では、電荷付与と電場補間に同じ重心座標を使う方法のエネルギー誤差成長率が本手法の6倍と報告した。時間積分にはBoris法を使い、シンプレクティック積分器の実装は今後の課題としている。"
  - "[@P000485]は、電荷を配る格子点集合が変わるときだけ軌道を中継点で二分し、各区間を元の時間幅Δt全体で評価してEsirkepov法を適用するEZを示した。中継点の電荷分布が相殺されるため離散連続の式が保たれ、支持域外の形状関数評価や不要な電流成分を省ける。単粒子および192³周期セル・25粒子/セルの相対論的温プラズマ試験では、CIC・TSC・PQSでEsirkepovと同程度の規格化Gauss残差を得た。全ステップ速度比はCIC・TSCで1.031〜1.137だったが、PQSはV100で1.113、MI100で0.992、EPYCで0.925となり、次数だけで性能改善を保証できない。保存則の成立、電流値の違い、装置・コンパイラ依存の計算効率を分けて評価する研究である。"
- heading: 粒子・格子の力計算にFMMを使う
  paragraphs:
  - "[@P000319]と[@P000320]は、RAMSESの粒子・格子計算でPoisson解法をFMMへ置き換える系列である。一様格子での精度・並列性の比較から、局所格子と時間刻みへの適応化へ進む。後者はプレプリントで、対象は重力場である。静電PICへの接続では、力の保存性に加えて電気的な物体境界を確認する。"
  - "[@P000320]は粒子質量をAMRセルへ配置するadaptive PMにFMMを組み込み、活動fine levelだけを更新するsub-cyclingをレベル別木で支える。nearest fieldを細セルとの直接相互作用で扱い粗密界面の局所対称性を保ち、固定刻み二体試験では参照MGに対して深いAMRで軌道安定性を改善した。対象は孤立境界の自己重力で、静電PICの電荷保存・導体境界・周期電場を検証した結果ではない。solver移植にはdeposit/gatherとの整合と非活動格子の時間同期誤差を別に検討する必要がある。Fig.9の疎な(7,13)ATSの図示と本文の速度優位一般化、Fig.8のcolumn density表記と体積密度単位、印刷Jeans条件Δx_min≤8λ_Jの定義は未解決。"
  - "[@P000319]は、孤立真空境界の一様格子に沈着した質量をFMM階層で解き、MGと比較した。256³格子の二均一球の断面ではポテンシャル誤差P90がFMM 0.208%、MG 0.998%だが、点源ではFMM1.25%、MG 0.0210%と逆転する。差分で求めた力の大きさの誤差も表示断面全域と物質のある領域で異なり、二球の非零密度域P90はFMM 0.894%、MG 0.523%である。FMM-1は同程度に最適化したMGより良好にスケールし、弱スケーリング効率では完全最適化MGも上回るが、絶対時間は最適化と計算機構成に依存する。AMR・適応時間刻み・GPUは将来拡張であり、導体・誘電体境界を持つ静電PICへの適用は別途検証を要する。"
- heading: 計算出力と図の再現へ進む
  paragraphs:
  - 論文から計算条件を追うために、公開出力も参照できる。[@P000344]は空洞サイズ依存の図に対応するHDF5とNotebook、[@P000345]は流速・熱速度比の計算出力と半解析コード、[@P000346]は極域クレーターのhybrid
    PICのVTK・DAT出力を提供する。これらは関連論文とは別の公開データ記録であり、ここでは説明とファイル一覧を確認している。
  - Marderの補正は、境界でGauss残差F=0となる条件で、連続の式の数値誤差による発生と拡散による散逸を釣り合わせ、残差の蓄積を抑える。ECSIMはθ=1/2、整合した電場補間と平均速度電流、離散curlの積分関係を用いて粒子と場の仕事を相殺する設計で、付録の1次元周期境界ではPoynting流束の正味収支がゼロになる。保存精度は線形場方程式の求解精度にも依存する。ただし、この原稿のエネルギー証明には係数・符号の不整合が残る。Gauss残差と総エネルギー誤差は、別々の拘束・収支を点検する指標として扱う。[@P000062][@P000066]
  - CPICは物理空間の曲線格子を論理空間へ写し、粒子の位置を論理座標、速度を物理座標で扱う。FLEKSの2023年刊行版は、一様Cartesian PIC格子のパッチを有効・無効化し、MHDと結合する運動論領域を動かす。曲線格子による形状への対応と、一様な格子幅を保ったまま計算対象領域を選ぶ方式を区別すると、境界の表現、空間分解能、計算負荷を比較しやすい。[@P000068][@P000071]
- heading: 平滑化の幅を、ノイズと物理応答で選ぶ
  paragraphs:
  - "[@P000450]は電荷密度のカーネル推定を系統誤差とノイズに分け、粒子幅を交差検証で選ぶ。[@P000451]はDebye長を粗く解像する静電PICで平滑化による不安定性抑制を調べるが、実効分解能の低下も示した。[@P000448]は密度誤差に線形モードの応答制約を加える。同じ初期空間密度でも速度分布で成長率への影響が変わるため、平滑化の選択には平衡・関心波数と、保存則・成長率・非線形応答の検証を組み合わせる。"
  - "[@P000448]は、密度誤差の最小化に、平衡速度分布と割当・平滑化・gatherの往復伝達から決まる保護モードの率制約を加えた。同じ初期密度と固定Gaussianを使う二流の四つの解像平衡でも、成長率低下は0.72%から9.11%へ変わる。5%のモデル上の運用制約で85候補から選んだ幅は、独立seedのPPC32スナップショット再構成で密度・格子電場MSEを7.40%・3.70%減らし、別のPPC512線形射影δf計算で個別成長率平均の比0.9556、paired95%区間[0.9453,0.9640]が10%の受容基準内に入った。誤差評価と率検証は異なる実験である。弱Landauではone-cell幅が密度と格子電場の誤差を改善しcoherent減衰率比も許容内に入るが、基準と候補の継続長が2 e-foldings未満で、完全な確認には条件が残る。以上はarXiv v1原稿の報告で、production実装と歴史的初期化の再構成を保証した結果ではない。"
  - "[@P000451]は周期境界の1D静電MC-PICで、電荷平滑化が格子不安定性と有限粒子ノイズの加熱を抑える条件を調べた。使用したフィルタでは平滑化半径/格子幅が格子幅/Debye長に比例し、α=5ではCauchy-squared分散の残留成長率が計算誤差10^-6ωp以内となる。Maxwell分布の計算ではDebye長/格子幅=1/2000、1粒子/セルでも10⁴プラズマ周期の継続加熱を抑えたが、初期熱エネルギーの約20%を失う冷却が残った。格子不安定性は大粒子数で粒子数非依存の指数成長、ノイズ加熱はほぼ時間線形・粒子数の逆数であり、両者の判別が必要になる。平滑化半径が実効分解能を決めるため、粗格子化の利点はDebyeスケールの物理が不要な条件で評価する。境界sheathの局所細分化は将来案である。要点はarXiv:2503.05123v1原稿に基づく。本文と付録の表記差は保留する。"
  - "[@P000450]は、一次元周期PICの密度推定をカーネル密度推定として捉え、バイアス二乗と分散を合わせたMISEをleave-one-out交差検証で代理評価し、粒子幅を選ぶ。冷たいLangmuir波では密度MISEが0.1260から0.0023へ約98%減った一方、電場改善は約10%だった。MISE<2.000×10⁻³の計時比較では一次形状の幅最適化が135から81.3 msへ短縮し、von Mises版は845 msを要した。共通初期集合を用いる30集合のLandau減衰試験では平均減衰率誤差が0.0113から0.0038へ減った。これらは周期静電波の試験結果で、非周期境界や保存則への改善は未検証である。要点はarXiv:1804.11174v2原稿に基づく。Landau減衰率のlog定義とstandard deviation/t統計量の定義には確認余地がある。"
  - "[@P000486]は、PIC出力の速度モーメントを多項式再現条件を持つSIAC核で空間的に後処理した。周期whistler例ではΔx=0.1 λ_D、H=64Δxでk≈0.1 λ_D⁻¹の物理波を残して高波数雑音を抑え、非周期の壁近傍では一般化スプラインと境界で狭まる適応幅によって密度・熱流束の境界層を保つ。全体スペクトルだけでは境界処理の差が見えにくく、熱流束勾配を使うBohm速度には小さな残差も影響する。長時間平均を基準に変数別幅を選んだ例では、2,600 snapshotの処理後平均が200,000 snapshotのBohm速度曲線を定性的に追った。1.3%は平均標本数の比で、未知条件での自動幅選択や総実行時間の保証には至っていない。"
- heading: 界面条件と性能を、再現できる試験で比べる
  paragraphs:
  - "[@P000446]のPIFE-PICはCartesian格子の複雑な界面条件を有限要素で扱い、場と粒子の三次元領域分割を示す。[@P000447]は半解析シースとの照合と弱スケーリングを行い、場の反復数が収束と総時間を同時に変えることを示した。格子・粒子数の増加と物理検証を別々に評価する必要がある。"
  - "[@P000446]のarXiv:2011.10214v1は、電位連続と表面帯電による法線電束ジャンプを扱うIFE-PICを、場と粒子の三次元領域分割へ拡張した。各方向2セルの重なり領域で電位を交換し、粒子を移動先のMPIプロセスへ転送する。等温・無衝突の静止水素プラズマ中の誘電体球ではOML電位分布と良い一致を示し、並列性能はDDM反復上限を含む設定に依存した。要点はarXiv:2011.10214v1原稿に基づく。"
  - "[@P000449]は1D3V静電PIC-MCCを約100の文書付き例題とまとめ、文献結果・解析解を入力条件と分布診断からたどる環境を紹介する。無衝突周期箱のLangmuir波は2%と30%の摂動で減衰から捕捉渦へ移り、Ne 1 Torrの周期正柱では平均電場6 V/cm、人工的な対除去損失の下で進行縞が生じる。これらは著者の配布計算における比較結果である。ECDIの飽和が箱長に依存する例も含め、再現条件と数値・モデル限界を調べる教材として位置づけられる。ECDIの磁場掃引は電場との同時変更条件が不明で、波長スケーリングの解釈を保留する。"
