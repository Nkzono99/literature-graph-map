- paper_id: P000287
  group: renewal
  role: 衝突蒸気からの二次鉱物形成
  summary:
    question: 衝突による蒸発と堆積は月レゴリス中の元素をどう再分配するか。
    method: Chang'e-5の宇宙風化したかんらん石片に付着するクロム鉄鉱ナノ粒子の形態と組織を調べる。
    contribution: 粒子の特徴を気相からの凝縮で説明し、衝突時のCr・Fe・Oの局所的な蒸発と、その後の再堆積を示す鉱物学的証拠とした。
