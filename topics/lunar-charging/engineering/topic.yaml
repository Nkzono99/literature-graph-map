- paper_id: P000261
  group: removal
  role: 柔軟な電気力学的ダストシールド
  summary:
    question: 月面で曲面や折り曲げ可能な機器を守るため、柔軟な電気力学的ダストシールドは、電極材料・形状と表面の湾曲に応じてどの程度除塵できるか。
    method: 誘電体被覆を備えた銅・ポリイミド製と、化学修飾した還元酸化グラフェン電極を用いた柔軟シールドを比較した。高真空・紫外線照射下で二相・三相の電極配置を試験し、数値計算で湾曲の影響を調べた。
    contribution: 最適化した銅製は3 kV超で90％超の除塵率を達成した。無被覆のグラフェン系は微小放電で制約されたが、堆積塵より連続落塵の除去で高性能を示した。試験範囲の適度な湾曲による性能への影響は小さかった。
