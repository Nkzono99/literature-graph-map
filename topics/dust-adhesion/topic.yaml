      version_id: V1
      url: https://ntrs.nasa.gov/api/citations/19980018487/downloads/19980018487.pdf
      locator: PDF p.2 / printed p.784, §2のJKRS条件; p.4 / printed p.786, no-sliding assumption; p.6–8 / printed p.788–790, §3.1, Eq.(12)–(25)
      source_type: full_text
      checked_at: '2026-10-11'
    contribution:
