- paper_id: P000020
  group: balance
  role: 電位観測と遮蔽長からシース電場を見積もる
  summary:
    question: 太陽風・磁気圏尾部中の月面電位は、SIDE観測と先行理論からどこまで定まり、近地表シースの電場へどう結び付くか。
    method: SIDEの電圧走査共鳴と終端の低エネルギーイオンから電位を推定し、先行研究を比較。電場は電位と仮定した遮蔽長から概算。
    contribution: 昼側の正電位と終端の負電位をSIDE観測から推定し、電位と遮蔽長から昼側外向き・終端内向きの電場を概算。夜側と有効遮蔽長の未確定性を残した。
