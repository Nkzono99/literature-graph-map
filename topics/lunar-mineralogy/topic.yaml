  group: samples
  role: 単一玄武岩の鉱物・衝撃記録
  summary:
    question: Chang’e-5玄武岩の鉱物は、マグマの形成と衝撃履歴をどう記録するか。
    method: 一つの玄武岩試料を走査電子顕微鏡と顕微ラマン分光で非破壊分析した。
    contribution: 低Ti組成を確認し、衝撃圧力の下限を5.2 GPa、上限を20～25 GPaと推定した。混合マントル源と浅部での分別結晶化を提案した。
- paper_id: P000372
  group: isotopes
  role: 月隕石によるLi同位体の再評価
  summary:
    question: 月のLi同位体比を、内部の分化と衝突改変からどう分けて読むか。
    method: 玄武岩・Mg-suite・斜長岩を含む12個の月隕石を測定し、分化モデルと比較した。
    contribution: 月マントルのδ⁷Liを3.8±1.3‰と推定した。高Ti玄武岩にはメルトとマントルの相互作用、斜長岩の散らばりには衝突再分配を提案した。
- paper_id: P000373
  group: samples
  role: アグルチネート構造と集団強度
  summary:
    question: ガラス質アグルチネートの構造は、模擬レゴリスの強度をどう変えるか。
    method: 高温真空焼結で粒子を作り、単粒子圧縮、安息角、小型三軸試験で評価した。
    contribution: 密度をそろえると、溶融・ガラス含有の多い粒子ほどせん断強度の増加とひずみ軟化が顕著になった。
