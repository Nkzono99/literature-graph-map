schema_version: 1
topic_id: secondary-electron-emission
title: 二次電子放出
question: 材料からの電子放出と再捕集が、シース・表面電位・粒子の帯電をどう変えるか。
review:
- heading: 収率と放出電子の分布をモデルに入れる
  paragraphs:
  - 電子が表面に衝突すると、材料内で励起された電子が外へ出てくる。これが二次電子放出である。帯電の電流収支には、入射電子が反射して戻る成分も加わるため、文献を比べるときは二次電子の収率と、反射を含む総電子収率を区別する。銅表面を調べた[@P000154]は、低エネルギー域の反射や電子照射履歴が収率を変えることを整理した。
  - 粒子計算では、衝突のたびに何個の電子を、どのエネルギーで放出するかを決める必要がある。[@P000091]は銅とステンレス鋼の測定に合わせた確率モデルを示した。PICへ放出過程を組み込む際の出発点になり、材料の収率と放出電子の分布を一緒に扱える。
- heading: 月試料を粉体・孤立粒子・軌道観測で比べる
  paragraphs:
  - 月試料の初期測定として、[@P000150]はApollo 14の粉体を用い、放出収率とエネルギー分布を調べた。Apollo 16土壌を扱う[@P000151]は、40–2000
    eVでの総電子収率と、10 keV照射下での粒子移動を測定している。一方、[@P000153]は0.2–13 µmの粒子を個別に保持して帯電を測った。孤立粒子と粉体層では電子が周囲の粒子へ戻る経路が異なるため、粒径と試料の置き方が比較の手掛かりになる。
  - 観測へ進むと、[@P000152]は月が地球磁気圏内にある夜側のデータから、月面を出入りする電子電流を比較した。推定した実効収率は、比較対象の実験室試料の約3分の1だった。模擬レゴリス層を測る[@P000053]と併せると、材料組成や微細構造から、表面を脱出する電子の量へ議論をつなげられる。
- heading: 強い放出がシースの電位構造を変える
  paragraphs:
  - 電子放出が増えると、浮遊表面の電流収支と周囲の空間電荷が変わる。[@P000155]の空間電荷制限シースでは、放出電子の一部が表面へ戻り、正味の放出電流が制限される。さらに[@P000156]は、強い二次電子放出を伴う壁に囲まれたプラズマのPIC計算で、壁が正となる逆シースを示した。どの状態になるかは、入射・放出電子の分布や粒子供給の条件にも依存する。
  - この理論と測定をつなぐ文献として、[@P000089]は放出電子の温度を含む運動論を熱電子放出実験と比較し、[@P000090]は窒化ホウ素からの二次電子放出を伴うシースを測定した。[@P000093]では古典シース、電位の極小を持つシース、逆シースが観測されている。材料の放出率を設定する段階から、実際に逃げる電子量を電位分布とともに求める段階へ進む研究群である。
- heading: 再捕集が粒子間の帯電差を生む
  paragraphs:
  - 粉体では、放出電子が隣の粒子や空隙の内壁に吸収される。この電子の移動に着目した[@P000009]は、光電子・二次電子の再吸収で局所的な負帯電を作るpatched
    charge model（PCM）を提案し、粒子の跳躍を説明した。[@P000010]は固定粒子群の差動帯電と導電性を扱い、粒子間電場の強さを検討している。月面全体の電位を考えるシースの研究と、粒子表面の一部に電荷が偏る研究をつなぐ位置にある。
- heading: 放電・加工では入射粒子と装置条件が効く
  paragraphs:
  - イオン衝撃による放出を計算する[@P000157]は、イオンの運動エネルギーが材料内の電子へ移る過程と、その電子が外へ逃げる過程を追跡した。Ar・Kr・XeとW・Feの組合せを扱い、電気推進の材料・試験設備へつながる。磁気異常を模擬した[@P000116]では、二次電子の流入が正の表面電位の上昇を抑えるという説明が示されている。
  - 放電開始を扱う[@P000158]は、放出のエネルギー依存と微小ギャップの効果をPIC/MCCに入れ、絶縁破壊電圧を実験と比較した。加工形状まで含む[@P000137]は、PMMAの表面粗さに対するイオン反射・帯電・二次電子放出の寄与を分けている。この計算条件では二次電子の影響は小さく、放出の有無だけでなく、入射粒子の条件と評価する量を対応させて読むと使いやすい。
