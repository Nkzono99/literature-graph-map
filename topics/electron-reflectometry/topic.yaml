schema_version: 1
topic_id: electron-reflectometry
title: 電子反射法による天体の磁場・電位・大気推定
question: 月の磁気ミラー・電位による電子反射を起点に、火星の磁場・熱圏密度とガニメデへの応用、装置・推定条件を整理する。
synopsis:
- 電子反射法は、天体へ向かう電子と戻る電子の分布を比べ、磁力線の先にある磁場や電位を推定する。[@P000347]で整備された方法は、Lunar Prospectorの全球磁場マップ（[@P000351]）へ発展し、軌道上の磁力計では届かない表面近くの磁場を補った。
- 推定が成り立つ条件は、磁気ミラーと静電反射の分離、電子の旋回半径と磁場構造の尺度、探査機電位の補正にある。[@P000352]は全軌道追跡から感度の空間尺度を再検討し、[@P000025]は探査機電位を補正して月面の負電位と入射電流を結び付けた。非単調なシースでは経路上の電位極小を捉える（[@P000033]、[@P000034]）。
- 同じ方法は、大気を持つ火星へ電子輸送を組み込んで拡張された（[@P000353]、[@P000354]）。既知の磁場を使えば熱圏密度の信号にもなり（[@P000381]）、ガニメデでは表面帯電の補正が課題となる（[@P000359]）。磁場・電位・大気密度のどれを独立に制約できるかが、各天体に共通する問いである。
review:
- heading: 戻ってくる電子から、磁場と電位を読む
  paragraphs:
  - "電子反射法（electron reflectometry）は、天体へ向かう電子と戻ってくる電子のエネルギー・方向分布を比べ、磁力線の先にある磁場や電位を推定する方法である。Apolloの月周回機で方法が整備され（[@P000347]、[@P000348]）、Lunar Prospectorで月の全球磁場マップへ発展した（[@P000351]）。観測点より下の領域を調べられるため、軌道上の磁力計を補う。"
  - "[@P000351]は、220・340・520 eVの電子反射に静電補正を加え、約15万点の地殻磁場強度推定を5×5度区画へ平均した。固有分解能は約5 kmだが、全球図はこの区画平均であり、ERは極性を与えず、地殻場の強度差を下限近似として扱う。Imbrium・Orientaleの盆地内では約0.2 nT以下の弱磁場が広がり、若い大盆地の対蹠域に強い場が集中する。7対蹠リングの上位5平均強度を観測値以上にする非重複ランダム配置は約0.0014%で、衝突との空間的対応を裏づける。Imbriumの漏洩磁場から導く約0.1 Oeの古磁場上限には、数千万年の冷却中に場が定常であることと、溶融物の磁化保持能に関する仮定が付く。この7盆地はNectarisを含むTable2に従い、本文の選択記述との食い違いが残る。"
  - ここでいう反射には、強い磁場へ進む電子が磁気ミラーで引き返す場合と、負の電位に阻まれて引き返す場合がある。電子の進行方向と磁場のなす角をピッチ角という。表面まで達して吸収される電子は戻らず、戻りの分布に欠けた角度領域、ロスコーンを作る。入射側と戻り側を、同じ磁力線につながる観測として比較することが出発点になる。[@P000347]、[@P000025]
  - '[@P000025]は探査機電位を推定して電子エネルギーを補正し、ロスコーンと二次電子ビームを同じ分布の中で当てはめた。これにより月面の負電位と入射電子温度を対応づけたが、約20
    V未満と正電位は一般に決められず、非単調シースがあれば上空の電位極小を捉え得る。SEP事例の約−4 kVは探査機電位未補正で、局所プラズマ基準と解釈するには探査機電位が小さいという仮定が加わる。'
- heading: 磁気ミラーの原理と、推定が成立する条件
  paragraphs:
  - 電位差を無視でき、電子の磁気モーメントが保存される理想的な場合、ロスコーンの境界角αcは sin²αc = B観測点 / B最大 に従う。ここでは天体へ向かう磁力線方向から測った0〜90°のピッチ角を考える。B最大は観測点から吸収境界までの磁力線上で最も強い磁場で、表面で最大なら表面磁場の強さを求められる。境界より大きいピッチ角の電子は磁気ミラーで戻り、小さい角度の電子は表面へ到達する。電位差があると境界にエネルギー依存が現れ、磁場と電位を同時に考える必要がある。[@P000025]、[@P000359]
  - 電子の旋回半径が磁場の変化尺度に比べて小さいことも必要になる。[@P000352]は粒子の全軌道を追跡して月の推定を再検討し、用いたモデルでは約10 kmより大きい波長の磁場を捉えやすく、細かな磁化に対して感度が低下すると示した。この値は一律の地図解像度を表すものではなく、電子のエネルギーと磁場構造に依存する適用条件として読む。
- heading: 装置は電子分布と磁場を同時に測る
  paragraphs:
  - "自然のプラズマを使う電子反射法では、電子分析器がエネルギー・方向を測り、磁力計がピッチ角へ変換する基準を与える。[@P000380]は、MGS電子反射計の視野・角度較正・機体光電子の影響を整理し、電子スペクトルと磁場から火星の電離圏境界や地殻磁力線の接続を調べた。高度約400kmの夜側では、強い地殻磁場上で計数が最大3桁低下する領域を認め、太陽風と日照半球の電離圏から隔離された閉磁力線と解釈した。日照下の対応構造では大気光電子を観測し、囲まれた中性大気での生成と磁場内保持を考えた。この研究は、後続の反射測定に必要な電子集団と接続条件の識別を具体化している。かぐやの[@P000386]は、反対向きの半球視野を持つESA-S1/S2で3次元電子分布を取得する構成を示す。エネルギー範囲や視野を確認することは、電子の反射境界をどこまで識別できるかの判断につながる。"
  - "[@P000386]は、月面側と反対側に置いたESA-S1/S2によって電子分布を測り、約100、200、300、400 eVの専用掃引を電子反射法に用いた。昼側では高角度分布を機上で32ピッチ角へ仕分けて最短1秒、夜側では未仕分けの角度分布を2秒で送る。S1は6 eV–9 keV、S2は9 eV–16 keVを測るが、S2の半球視野は9 keV未満で、支持部・アンテナによる視野欠損と方向依存感度もある。反射分布を磁気異常や帯電へ結びつける際には、運用モードと実効視野を合わせて扱う必要がある。"
- heading: 月では局所の異常から全球の磁場へ
  paragraphs:
  - "[@P000348]はApollo 15・16の電子反射観測を地質と照合した。Lunar Prospectorでは磁力計と電子反射計を併用し、磁気異常と太陽風の相互作用が調べられた（[@P000349]）。[@P000350]は表側の地殻磁場を地質単位と対応付けた。[@P000351]の全球マップでは、大きな衝突盆地の内部で弱く、その対蹠域で強い磁場が集中する分布が示された。"
  - "[@P000349]は、Lunar Prospectorの220 eV電子反射係数を、地磁気尾部の安定した環境で約200 km角へ平均した。強い磁場はImbrium・Serenitatis盆地の対蹠域の大半に広がるが、Imbriumでは約5°北へずれ、Serenitatisでは約205°E以東に例外がある。この分布を盆地形成時の磁化仮説の追加根拠とした。"
  - "同じ研究では太陽風中の別の観測を用い、5軌道中4軌道の磁場増幅を、時間移動した上流WIND磁場と比較した。増幅の前方位置と29°Sでの電子スペクトル変化を根拠に、小型磁気圏と弓形衝撃波の解釈を提示した。単一双極子の模式図は仮定であり、波形は地殻磁場に加えて動圧・上流磁場の向き・通過軌道にも依存する。[@P000349]"
  - '[@P000350]は月表側の520 eV未補正電子反射係数を地質へ対応付け、Cayleyと周辺高地で高く、海・Fra Mauro・若いクレーターで低い分布を示した。定量統計の0.5°ビンと地理比較の1.5°平滑化は用途が異なる。磁化した衝突放出物の関与を支持するが、表面地質と埋没した磁化源の対応には不確かさが残る。[@P000350]
    Table 1の一部平均欄は原スキャンで小数点が不鮮明なため、数値には明示的な小数読みが含まれる。'
  - この地図では電位補正を省いて被覆を約2～3倍確保しており、弱磁場域の反射には静電反射が混じる。海の平均係数0.242を名目上の約1 nTへ換算しても、著者は実際には0.数nTかそれ以下の可能性を認める。単一エネルギーの反射係数地図と、磁場・電位を分離した推定を区別する必要がある。[@P000350]
  - Tsunakawa et al.は、かぐやとLunar Prospectorの高度10–45 kmの磁場観測を逆解析し、平均月半径球面上の3成分と全強度を復元した。電子反射法の近表面全強度とは、双方を5°×5°区画へ平均した比較で相関係数0.671を得ている。方向を与える磁力計モデルとの比較に有用だが、0.2°は格子間隔で、代表的空間分解能は約1°の波長である[@P000107]。
- heading: 電位の推定では基準と電子の起源を確かめる
  paragraphs:
  - '[@P000003]はエネルギーに依存するロスコーンと二次電子ビームから、日陰の月面がLunar Prospectorより平均約35 V低い電位にあると推定した。探査機も帯電するため、周囲のプラズマを基準にするには補正が要る。[@P000025]は探査機電位を補正し、月面電位と入射電流を対応付けた。'
  - "[@P000379]は、磁場が面法線から傾くほど電子の旋回中心が月面に近づけず、電子反射で回収した負電位差の大きさが小さくなることを粒子追跡で示した。指数電位と単純な収束磁場を仮定した計算をLunar Prospectorの角度依存と比較し、磁気尾部と太陽風ウェイクの平均電位尺度を約1–2 kmと推定する。これは有限旋回半径による推定の偏りを構造の制約に使う方法であり、磁場形状や入射分布、SZAと角度の共変動を含む条件の下での桁の推定である。"
  - "強い負帯電を扱う枝では、[@P000004]が日照・日陰の大負電位を電子ビームから抽出し、[@P000006]が太陽高エネルギー粒子イベントの極端な事例を示した。探査機電位の補正を用いた[@P000027]では、11イベント中8件を電流収支モデルが再現した一方、3件には説明が残った。平均的な帯電とイベント時の予測性能を分けて評価する必要がある。"
  - "[@P000027]は、1998年の太陽風中の強い帯電を11解析期間に分け、上向き二次電子ビームのエネルギーで測る月面–探査機電位差へ、熱的・高エネルギー粒子と二次電子の電流収支から計算した探査機電位を加えた。夜側の最大値は約−4.5 kVだが、ERの実効エネルギー分解能は約50%で、探査機補正も直接電位測定ではない。高エネルギー粒子を含む月面モデルは8期間の大筋を説明し、6・7・11の3期間は再現できなかった。補正と月面モデルに共通する仮定が残り、良好な期間も全軌道位置で一致するわけではない。"
  - 日照面でも、地球のプラズマシート中では大きな負電位の指標が現れる。[@P000033]は電子反射観測とPIC計算を比べ、表面上に電位の極小がある非単調なシースで説明した。ロスコーンだけから得た反射障壁の電位を表面電位へ対応付けるには、経路上の電位構造を考える必要がある。[@P000034]は月につながる磁力線上のARTEMISで、表面から加速されてくる放出電子も使い、日照域の負帯電と非単調シースの解釈を検討した。
  - '[@P000034]は、2010年3月28日のARTEMIS-P2フライバイで、月面から8,000 km以上離れた位置の損失円錐と外向き放出ビームを同時に合わせた。測定探査機電位で後加速を補正し、ローブで−30〜−60
    V、プラズマシートで−180〜−450 Vを推定した。ただし表面電位を経路上の最低電位に等しいと置く近似があり、非単調シースの形状を独立に復元したものではない。プラズマシート後半の接続先には曲率による不確かさが残る。'
  - 放出電子の観測は、反射電子とは別の情報を与える。[@P000041]は光電子スペクトルと電流収支から昼側の帯電条件を調べた。[@P000161]はARTEMISの光電子を放出モデルと比較して昼側電位を推定する。ロスコーン、放出電子ビーム、光電子スペクトルが、それぞれどの電位差を捉えるかを区別して使う。
  - Katoらは、かぐやの上向き光電子の60–150 eVスペクトルを固定した放出効率のK23モデルと比較し、磁気圏ローブ様条件で相対エネルギーずれを推定した。43,670点のうち、Lunar
    Prospectorの電子反射法による5°×5°表面磁場図と比較できる42,197点では、強い地殻磁場ほど光電子が減速する傾向を示した。この研究は電子反射法の磁場図を比較軸として用い、光電子の連続スペクトルから相対電位を補う位置にある。放出効率とエネルギーずれの縮退、未補正の探査機電位が推定の限界になる。[@P000051]
  - '[@P000041]は、探査機電位で機体由来の光電子を除き、20–300 eVの月面光電子スペクトルを求めた。同じ事例ではイオンの静電反射境界から表面電位を+15～25
    Vに制約し、電子のエネルギー補正へ用いている。粒子種と反射機構を区別することで、電子の磁気ミラーに依存する推定を補う例になる。'
  - "[@P000033]は、地球プラズマシート中の昼側電子分布を一次元PICと比較し、非単調電位による周囲電子の反射と脱出光電子の加速で主要特徴を説明した。光電子電流4.5×10⁻⁶ A m⁻²、温度2.2 eV、周囲密度10⁵ m⁻³、電子と等しいイオンパラメータを仮定した100–500 eVの計算では、表面電荷密度は約+3.9×10⁻¹¹ C m⁻²となる。電子反射が示す負の電位障壁と表面電荷の符号を分けて解釈する必要がある。この比較は一事例と上記のモデル条件に基づく。"
- heading: 火星では大気中の電子輸送を組み込む
  paragraphs:
  - "火星には大気があるため、月の表面吸収の扱いに、電子と中性粒子の衝突・エネルギー損失を加える。[@P000353]の磁場推定から、[@P000382]の高度170 kmの全球マップ、[@P000354]の電子輸送モデルと[@P000355]の高度185 kmの改良マップへ発展した。170 kmと185 kmは各解析の参照高度であり、地表磁場や観測機の高度とは異なる。観測分解能と磁化・古ダイナモの解釈を比べる背景には、選択的総説の[@P000361]がある。[@P000382]は、約400 kmの夜側軌道で得た約200万の191 eV電子分布を大気吸収モデルに適合し、高度170 kmの地殻磁場振幅を150 km分解能で地図化した。北部低地の弱い磁気源とUtopia周囲の不完全な磁気環を示した一方、対象はIMFに接続する開磁力線に限られ、閉磁力線域の欠測を弱磁場と区別する必要がある。表示閾値10 nTと数nTの検出限界も異なる。Utopiaの磁化残存・再磁化やTharsisの熱消磁は、磁気分布と地形の対応に基づく条件付き解釈である。Eq.(1)の印刷形と本文の確率定義の対応は未解決である。"
  - 火星の大気は電子を吸収するだけでなく、一部を後方散乱で観測軌道へ戻す。[@P000353]はMGSの191 eV帯について、この散乱成分をMonte Carlo計算の対応表で差し引き、衝突せずに磁気反射する電子の分布を適合した。固定した大気と磁場の高度分布の下で、高度170
    kmの地殻磁場を求める方法であり、著者は月で用いられた反射法を大気のある火星へ拡張したものと位置づける。
  - '[@P000353]の初期地図は午前2時の観測から火星表面の約20%を覆い、Tempe Terraに二つの新しい磁場源を示した。B170の典型的な誤差は約35%で、約5
    nT未満の磁場は背景変動で見えにくい。閉じた磁力線では電子が大気中を繰り返し通過して両側ロスコーンを作るため、この強度推定法は適用できない。地図の黒い領域と弱い磁場を区別することが、後の全球マップを読む際にも必要になる。'
  - 電子反射で推定した火星の低高度磁場を他手法と比べるときは、観測高度と未解像の磁化を区別する必要がある。Mittelholz・Johnsonの総説では、MAVENを含む当時の軌道磁力計モデルが約150
    kmの磁場構造を解像する一方、InSightの局所地表磁場約2,000 nTは衛星モデルの予測を約1桁上回ると整理される。約150 kmは磁力計モデルの空間尺度で、電子反射法で採用する磁場の参照高度とは意味が異なる。[@P000361]
  - 磁場の強弱を地質年代や古ダイナモへ結ぶ際も、磁化源の深さ・厚さと磁性鉱物を考える。盆地上空の弱い場には未解像の磁化や磁化可能な物質の除去という説明があり、火山表面の年代と地下の磁化年代も一致するとは限らない。本総説は、電子反射法の地図を他の磁場モデルと照合するときの地質的な背景になる。磁力線の接続と外部変動についての議論も参考になるが、静電ポテンシャルの効果や電子反射法の精度は各原著で別に確認する。[@P000361]
  - "[@P000356]は、火星の散乱する大気を対象に、約90–400 eVの3帯域のロスコーンを後方散乱補正して磁場と電位差を同時推定した。MGSの高度370–430 km・地方時2時/14時の約360万件を、185 kmまで一定電場・直線磁力線として換算すると、強い地殻磁場の開放領域では急傾斜の中心が正、浅い縁が主に夜側と明暗境界で負となる。正は電子を下向きに加速する上向き電場である。単一推定の大きな誤差と、強い正電位でロスコーンが消える選択を伴うため、結果は補正後の統計的な構造として読む。初頁Key Pointsの極性は本文と逆のため、要点は本文とFigs.6–8の向き規約に従う。"
  - 反射解析が使える場所は磁場の接続にも左右される。[@P000383]は片側・両側ロスコーンや電子の欠乏域などを分類し、開いた磁力線と閉じた磁力線の分布・変動を調べた。磁気的に閉じた領域で入射電子が得られないことと、磁場が弱いことを区別して地図を読む。
  - "[@P000383]はMGSの約400 km・地方時2時／14時の115 eV電子PADを分類し、夜側の空隙と周辺の両側loss coneから閉磁場の内部と捕捉電子を含む外層を推定した。片側の戻りloss coneは大気吸収を示すが、地殻に接続するopenと大気に交差するdraped磁場が混在するため、PADだけでは両者を分けられない。昼側の等方分布による閉型推定にも光電子スペクトルと地殻磁場の配置・向きを用いる。反射解析の対象選別では、狭い観測角による見かけの等方性と、弱磁場で角度写像が不確かな欠測を区別する必要がある。"
  - "[@P000354]は、火星夜側で地殻とIMFをつなぐopen磁力線上の90–400 eV電子について、らせん軌道の柱密度、平行電位、種別衝突、後方散乱を含むロスコーン形成モデルを整えた。Monte Carlo参照表で後方散乱を差し引き、三エネルギー帯の依存性から平均平行電場を区別する。ただし磁場と中性密度の鉛直分布は形状に非直交に作用するため、一方の事前知識が必要となる。散乱深度D=1で感度が最大となる高度は磁場・大気条件で変わり、既知の強地殻磁場で大気を較正して広域磁場を解く手順へつながった。"
  - "[@P000355]は90–400 eVの3エネルギーチャンネルの損失円錐を運動論モデルへ適合し、磁場減衰指数p=2.5の仮定と平行電位補正、夜側の選別、外部場によるmasking補正を組み合わせた。直径200 km内の最頻値（通常はWeibull適合、約30件未満や適合不良時は経験的な累積分布補間）を用い、areoid上185 kmの地殻磁場を約200 kmの分解能、全球4 nTの検出閾値で地図化した。閉じた磁力線などで測定不足となる8.9%は未測定として扱う。この共通高度の地図により、Syrtis MajorとTyrrhena Pateraの消磁の差を、初期磁性担体・地殻特性が同じとの仮定のもとで貫入／噴出比の差へ結びつけた。Ladonの衝撃消磁後再磁化とHellasの弱磁場という解釈を、クレーターの最小絶対モデル年代>4.15±0.05 Gaと>4.07±0.05 Gaに重ね、ダイナモの停止または大幅な弱化を推論した。磁化逆問題の非一意性、熱水系による化学消磁、年代較正の系統誤差が解釈を制約する。 Hellasが強い全球磁場なしに形成したという解釈には異論があり、これは著者の条件付き年代推論である（PDF p.10、Section9.1）。"
- heading: 同じ反射電子から、火星の熱圏密度を調べる
  paragraphs:
  - "[@P000381]は、磁場形状を既知とできる強い地殻磁場領域で、電子反射法を火星夜側の中性質量密度推定へ転用した。116・191・313 eVのロスコーンを後方散乱込みの輸送モデルと二種等温大気に当てはめ、地方時2時、南半球160–200°Eの約160–230 kmを推定した。160 kmの平均密度は0.027 kg/km³で、季節変動は50–55°Sで3–4倍、0–30°Sで1.7–2.8倍となる。ただし組成・温度には縮退があり、単一推定の大きな誤差を2か月平均で抑えても、磁場の季節変化による40–70%の密度バイアスなどが残る。[@P000384]は南半球の限られた領域で主感度高度180 km・地方時午前2時の変動を4火星年にわたって追跡し、[@P000385]は高度185 kmの系列を大循環モデルと比較した。参照高度・地方時・観測可能な地域が異なるため、これらを全火星の瞬時密度としては扱わない。"
  - "この系列には多エネルギー・誤差評価の先例がある。[@P000381]は3エネルギーを用い、装置の角度ビンへモデルを畳み込んでχ²の誤差楕円体から密度の幅を評価した。組成・温度は強く縮退し、種別数密度は個別には定まらない。単一推定の誤差は通常3–20倍で、数百測定を2か月平均した結果にも磁場モデルの系統誤差が残る。後の[@P000385]でも個々の推定の不確かさにより数週以上の平均化が必要であり、測定器の時間分解能と物理量を安定して推定できる時間尺度を分ける。"
  - "[@P000384]は、既知の強い地殻磁場を先に与え、電子反射法を大気密度の逆算へ転用した。MGSの116・191・313 eVロスコーンをCO2・Oの2成分等温大気へ合わせるが、22.5°の角度分解能では種別密度と温度が縮退するため、主に質量密度を比較する。最終地理範囲は本文で惑星表面の約1.6%、主に160°～200°Eである。1999年4月～2006年10月の4火星年、午前2時・高度180 kmの84日移動平均は南緯0°～60°を連続に覆い、季節振幅は中緯度1.6～4.0倍、赤道域1.5～2.5倍となった。2001年嵐では40°～60°S・160°～200°Eの14日平均密度が主嵐の約40日前に急増し、嵐中に低下した。局所的下降流は著者の候補説明であり、全球の一様な応答や風の直接測定へは広げられない。磁場起因の最悪系統誤差約35%と極域の季節的試料不足も、この長期系列の解釈を制約する。"
- heading: ガニメデへの応用と、天体間の比較
  paragraphs:
  - "固有磁場を持つガニメデでは、[@P000357]がGalileoの高エネルギー粒子のロスコーンから表面磁場を制約した。低エネルギー側の環境を知る資料として、JunoのJADEによるフライバイ観測（[@P000358]）もある。[@P000359]は、ガニメデの表面電位を局所電流収支とSPISの選択地点計算から評価し、電子反射法で必要な電位補正の大きさを検討した。LatHyS入力では主に−20〜−60 V、MHD-EPIC入力では主に0〜−100 Vとなり、両者で閉磁力線領域ほど負になるが、密度主導か温度主導かは入力によって変わる。MHD-EPICの一部セルは約−250 Vに達し、絶対値は表面への外挿と未確定の電離圏条件に敏感である。Junoで低エネルギーの上向き損失円錐が埋まることは電場反射と整合する一方、放出二次電子でも説明できるため、表面電位の直接測定や一意の検証としては扱えない（PDF pp.14,17–18,21–22）。SPIS比較では収率の相違から二次電子を無効化しており、放出設定の完全一致には不明点が残る（PDF pp.16–17,20）。"
  - "[@P000358]はJuno/JADEの2021年6月7日観測から、ガニメデ近傍の木星円盤型高速イオンと低速水由来候補イオンの共存、0.5 keV超陽子の降下と上向き欠損、約10 keV未満電子の上向きロスコーン欠損を合わせて、片端が衛星・他端が木星につながる開磁力線を推定した。10 keV以上の両方向欠損には著者による木星への往復と磁束管対流の時間差の定性的説明があり、閉磁力線通過の明瞭な根拠は得られていない。約0.1–1 keV電子の増大は外側のウェイクと境界層で、内側では円盤に比べ強度が低下する。電子の方向分布を供給・損失履歴と合わせて読む比較例であり、表面反射係数や表面電位の推定は扱わない。"
  - 磁気ミラーによる表面吸収の境界を使う考え方は、水星の陽子にも広げられた。[@P000360]はMESSENGERの1年間の陽子ピッチ角分布を北カスプと南半球低緯度夜側で合成し、散乱を含む適合から表面磁場をそれぞれ412±98
    nT、113（+87/−61）nTと推定した。プラズマの反磁性を補正した北／南比は北偏位双極子と整合する。これは領域平均の長波長磁場を調べる例であり、月の局所地殻磁場の電子反射地図と比較する際には、粒子種、観測高度、平均化、散乱と圧力補正の条件をそろえる必要がある。南側夜面の降下を観測した範囲と、南半球の大半に降下が及ぶという著者の解釈も分けて読む。
- heading: 比較：表面で散乱された電子と、光電子を識別する
  paragraphs:
  - "[@P000362]は約500 eVの酸素Augerピークと昼側磁力線接続から外向き光電子を識別し、探査機・月面電位を補正して収率を逆算した。選定4日の解析では、月面電位をローブ15–25 V、太陽風0–10 Vと置き、放出電子の確率関数の未知性が217 eVの推定収率にほぼ4桁の幅を与えた。方向別スペクトルの起源同定と、収率逆算のモデル依存性を分ける例である。本文の4日集計に基づく推定である。"
  - "[@P000363]は太陽風中の昼側・弱地殻磁場域に絞り、約420 eVの酸素Auger特徴とロスコーンを使って、磁気反射電子・光電子からBSEを分ける。828測定にPHE補正と散乱エネルギー分布を仮定した逆推定を施し、50–600 eVで磁場と表面法線の角度10–20°ではη≈0.25–0.35、50–60°では≈0.10–0.20を得た。上向き流束は表面からの放出だけでなく再衝突による脱出率も含むため、反射計測の解釈には両者の区別が必要になる。high-PHE-yield補正・Dapor由来PFでの数値は本文の概略値であり、各エネルギービンの上下限ではない。PF比較は本文のFig.10に基づく。数値はFigshare DOI 10.6084/m9.figshare.24223444.v1のデータに基づく。要旨の減少表現と本文の明瞭でないという表現の差、およびfig8_orb四分位列の意味は保留。"
  - '[@P000364]は、昼側月面に磁気的に接続するARTEMIS観測について、酸素Augerピークの傾き・流束と光電子モデルへの適合で上向き月面光電子を選別し、反射・二次電子との競合を統計的に調べた。著者が報告した識別割合はローブ51.2%、太陽風8.6%で、降下電子が多いほど光電子を識別しにくい。太陽風の夕側で識別確率が高い非対称性は、strahlとhaloのアクセスの違いによる後方散乱電子の背景差として著者が解釈する。傾きの選別閾値は本文と図2で一致せず、実際の設定は未確定である。'
- heading: 残る課題：何を独立に制約できるか
  paragraphs:
  - 今後の比較軸は、磁場・電位・大気密度を変えたときの電子分布の違いが、装置応答と観測誤差を含めても区別できるかである。月では有限旋回半径とシース構造（[@P000379]、[@P000352]）、火星では既知磁場に依存する密度と電位の推定（[@P000381]、[@P000356]）、ガニメデでは帯電補正（[@P000359]）が具体的な検証対象になる。これらを共通の模擬観測で比較し、推定量の相関と適用範囲を報告することは研究方向の一つである。
  - 研究のつながりとしては、Lin・Mitchell・Halekasらの月での磁場・帯電解析から、Lillis・Brainらの火星輸送・接続診断へ進む流れがある（[@P000347]、[@P000380]、[@P000383]）。熱圏への展開ではBougherらの大気モデルとの比較（[@P000385]）、かぐやではSaitoらの粒子計測（[@P000386]）が加わる。系譜では手法の継承と相補的な計測を区別し、年代順だけで直接の引用関係を仮定しない。
