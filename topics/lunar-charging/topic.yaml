- paper_id: P000003
  group: environment
  role: 夜側の負帯電
  summary:
    question: 日陰の月面はどの程度負に帯電し、その電位差を軌道上の電子観測から捉えられるか。
    method: Lunar Prospectorの電子分布から、電子の欠損領域（ロスコーン）のエネルギー依存性と上向き二次電子ビームを解析した。
    contribution: 夜側月面が探査機より平均約35 V低い電位にあると推定し、日陰での負帯電を観測で裏付けた。
  evidence_by_item:
