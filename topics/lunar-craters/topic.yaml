- paper_id: P000188
  group: catalogs
  role: LOLAによる大型クレーター全球分布
  summary:
    question: 月全体の大型クレーターの分布と大きさの統計から、地表の再形成履歴や衝突天体集団の変化をどこまで区別できるかを調べる。
    method: 高分解能の月面高度観測を用い、直径20 km以上の衝突クレーターを全球でカタログ化した。分布と集団特性を解析し、高地・海・主要盆地を比較した。
    contribution: 最もクレーターが密集する高地の飽和と、盆地形成による周囲の既存クレーター集団の変化を示した。海形成前後の集団差は、二つの衝突天体集団の交代がオリエンターレ盆地形成期付近に起きたという仮説を支持する。
  evidence_by_item:
    question:
    - paper_id: P000188
      version_id: V1
      url: https://pubmed.ncbi.nlm.nih.gov/20847265/
      source_type: abstract
      locator: Abstract, sentences 1, 3–5
      checked_at: '2026-10-06'
    method:
