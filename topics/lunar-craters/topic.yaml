review:
- heading: クレーター台帳が、表面の履歴を比較する基盤になる
  paragraphs:
  - '[@P000187]はクレーターのサイズ別頻度を月の年代尺度へ結び付ける。LOLAによる大型クレーターの全球分布[@P000188]に対し、[@P000191]は1〜2
    km以上を網羅する台帳を作り、小径側の地域差も比較できるようにした。'
- heading: 新しい衝突と二次クレーターを見分ける
  paragraphs:
  - '[@P000189]は同じ場所の時系列画像から新しい衝突と表層の変化を調べる。一方、[@P000190]は一次衝突から飛び出した岩塊が作る二次クレーターを対象とし、岩塊の大きさと放出速度の関係を評価した。年代推定に使う個数には、地形の更新と二次衝突の両方が影響する。'
lineage:
- title: 全球の個数を大型から小径へ広げる
  steps:
  - paper_id: P000188
    title: 大型クレーターを全球で数える
    significance: LOLA地形から大型クレーターの分布を調べた。
  - paper_id: P000191
    title: 台帳をkm級へ拡張する
    significance: より小さなクレーターを含む全球台帳を作り、地域ごとの個数を比較した。
    connection: 共通の全球比較を小径側へ広げる
