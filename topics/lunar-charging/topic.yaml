- paper_id: P000004
  group: environment
  role: 日照域の強い負帯電
  summary:
    question: 月が地球磁気圏尾部を通過するとき、日陰と日照域で大きな負帯電は起こるか。
    method: Lunar Prospectorの上向き電子ビームを探し、推定電位差の大きさが500 Vを超える事例と入射電子スペクトルを比較した。
    contribution: 500 V以上の負電位差を示す稀な事例が主にプラズマシートで生じ、日照域にも存在することを示した。
  evidence_by_item:
    question: []
