- paper_id: P000300
  group: seismology
  role: 単一観測点からの月震定位
  summary:
    question: 強い散乱を受ける月震波形から、単一観測点で震源を求められるか。
    method: Apolloの3成分波形からP波の周波数依存偏波を解析し、S波とP波の到着時刻差を組み合わせる。
    contribution: 信号対雑音比が2を超える人工衝突と自然イベントで定位手法を検証した。P波の入射角は震源深度や観測点下の浅部構造にも感度を持つ。
