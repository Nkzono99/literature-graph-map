entries:
- paper_id: P000168
  group: mission
  role: かぐやのミッション・観測装置
  summary:
    question: 月の起源・進化と月面環境を調べるため、かぐやはどのような観測構成を採用し、ミッション終了時点で何を明らかにしたか。
    method: 主衛星と2機の子衛星で月全体を観測し、15の実験・観測から元素・鉱物・地形・地下構造・重力・磁場・プラズマの情報を組み合わせた。
    contribution: 観測装置と研究目的を対応づけ、純粋斜長岩、地下反射面、裏側重力場、全球地形の確認、地殻厚と火山活動年代の再推定、太陽風相互作用などの初期成果を整理した。
  evidence_by_item:
    question:
    - paper_id: P000168
      version_id: V1
      url: https://doi.org/10.1007/s11214-010-9678-3
      source_type: full_text
      locator: PDF pp.9、12–13；§§3.1、4–5
      checked_at: '2026-10-06'
    method:
    - paper_id: P000168
      version_id: V1
      url: https://doi.org/10.1007/s11214-010-9678-3
      source_type: full_text
      locator: PDF pp.3–9；§§2.1–2.2、3.1；Tables 1–2, Figures 3–4
      checked_at: '2026-10-06'
