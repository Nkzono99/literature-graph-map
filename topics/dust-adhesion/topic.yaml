- paper_id: P000211
  group: measurements
  role: 真空・UV条件を含む付着試験
  summary:
    question: 月面で使う材料への模擬月ダストの付着は、真空中の紫外線照射でどう変わるか。回転による粒子の離脱から、材料ごとの付着の強さを半定量的に評価する試験法を検証した。
    method: 45 µm未満のJSC-1/1Aを、未処理・陽極酸化・Z93P塗装のアルミニウムとOrtho布に付着させた。真空中でUV照射の有無を変え、回転加速度を段階的に上げながら画像からダスト被覆率の変化を調べた。
    contribution: 高い回転加速度では、未処理・陽極酸化アルミニウムの付着はUV照射時に弱まった。一方、Z93P塗装アルミニウムとOrtho布ではUV照射時に残留ダストが増え、照射の影響が材料によって逆になると示した。
