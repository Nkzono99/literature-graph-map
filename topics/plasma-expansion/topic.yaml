- paper_id: P000223
  group: lunar-wake
  role: WIND観測による磁場方向の月ウェイク充填
  summary:
    question: 月後方のプラズマ空洞を太陽風がどのように埋めるか、密度減少、二つの陽子流、磁場方向、密度低下境界を通じて調べた。
    method: 1994年12月27日、月中心から下流6.5月半径を横断したWINDのSWEによる粒子分布・密度・温度・速度とMFIの磁場を調べ、磁場に沿う一次元真空膨張解と比較した。
    contribution: 密度の最小値は流入直前の太陽風の約1/20となり、二つの低温陽子流が同時に現れた。流入側の密度減少と速度勾配は単純な膨張解と概ね合い、斜めの磁場による非対称な充填と解釈された。約2×10⁻⁴ V/mの電場は速度変化から得た粗い推定で、流出側の密度回復は指数関数への適合が弱かった。
