- paper_id: P000086
  group: foundations
  role: 電流収支・捕集条件・異なる面の電位障壁
  summary:
    question: 宇宙の物体の表面電位を電流収支で求めるとき、シース・流れ・磁場・放出電子・表面材料は何を変え、異なる面の帯電や電位障壁は観測をどう歪めるか。
    method: 1981年までの捕集電流理論、光・二次電子放出の材料実験、宇宙機の電位推定と制御実験を総説。球・円柱の軌道制限、自己無撞着シース、移動物体・後流・磁場の近似、異なる絶縁面が結合する電位場を比較し、月面・星間微粒子へ応用する。
    contribution: 正味電流ゼロの条件を、粒子軌道と放出電子の脱出条件を含む枠組みとして整理した。単純な捕集式が成立する形状・分布・単調性の条件、シース制限、多重平衡と帯電時間、絶縁面が作る非単調障壁による測定・制御の変化を総説として結び付けた。
