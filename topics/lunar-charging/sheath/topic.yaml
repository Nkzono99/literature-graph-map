- paper_id: P000092
  group: structure
  role: 金属面の光電子シース実験・PIC比較
  summary:
    question: UV照射面がつくる光電子層で、他面からの電子と戻り電子を分けながら、密度・有効温度・浮遊電位をどう測るか。
    method: 約10⁻⁶ TorrでZr平面を172 nm VUV照射し、負のNiグリッドと正のcollectorで壁電子を抑制。阻止電位解析と円筒Langmuir探針を、二面のMaxwellian放出を含む1D PICと比較する。
    contribution: バイアスによる密度分布の変化を、表面へ戻る電子とグリッド由来電子を含むPICで概ね再現した。浮遊電位は負グリッドに対して約+1.5 Vで、シース電位極小の直接測定は未達だった。
