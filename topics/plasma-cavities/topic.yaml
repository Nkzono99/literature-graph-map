- paper_id: P000223
  group: expansion
  role: Windによる月ウェイク観測
  summary:
    question: 太陽風を遮る月の後方では、プラズマ密度がどのように低下し、周囲の太陽風がどのような流れでウェイク内の空洞を埋め直すのかを調べる。
    method: 1994年12月27日、月の後方6.5月半径でウェイクを横断したWINDのSWE観測を用い、プラズマ密度とイオン流の変化を調べ、単純な膨張理論と比較した。
    contribution: 空洞を満たす二つの低温イオン流を観測し、磁場方向の電場による加速と解釈した。密度は中心へ指数関数的に低下し、密度低下域は光学的な影を越え、希薄波の伝播と整合した。
  evidence_by_item:
