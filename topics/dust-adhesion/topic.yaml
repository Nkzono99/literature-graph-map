- paper_id: P000029
  group: detachment
  role: 電子ビームとダスト離脱
  summary:
    question: 電子ビームとイオンの電流比は、ダスト層と基板の電位差・輸送をどう変えるか。
    method: 浮遊グラファイト上のJSC-Mars-1に電子ビームを入射し、75–90 µm粒子層の電位と、別条件で25 µm未満の粒子の移動を測る。
    contribution: 両電流が同程度でビームエネルギーが十分な条件では電場が増強し、小粒子の広がりと絶縁ブロック上面への堆積を観察した。無照射時に対する約1桁の増加は垂直電場の値である。
