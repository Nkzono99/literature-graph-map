- paper_id: P000317
  role: 粉体の実効電子収率と輸送モデルの比較
  summary:
    question: 350 eV電子照射で斜長石粉体から動く粒子の粒径・速度関係を、共有電荷・孤立球・局所帯電モデルはどの条件で説明できるか。
