- paper_id: P000239
  group: aggregates
  role: 凝集体の見通しを考慮した帯電
  summary:
    question: プラズマ中で成長するミクロンサイズのフラクタルダスト凝集体について、形状に応じた電荷分布が同符号の粒子どうしの凝集にどう影響するかを調べた。
    method: 粒子軌道を直線とみなし、凝集体内の粒子に遮られる電子・イオンの入射を除外するOML–LOSモデルで、総電荷と双極子モーメントを計算した。
    contribution: 凝集体の電位が下がり、同符号粒子でも凝集が進みうることをモデル計算で示した。総電荷と双極子モーメントは、衝突時の電荷保存を仮定する計算より一般に小さかった。
