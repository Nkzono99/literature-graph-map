- paper_id: P000291
  group: mechanics
  role: 層状天井と弱層を含む空洞安定性
  summary:
    question: 溶岩チューブ天井の層構造は破壊の広がりをどう変えるか。
    method: CASRockを用い、玄武岩を弾性・脆性、弱層を弾塑性材料として、空洞幅と天井厚を変えて計算する。
    contribution: 弱層が荷重を分散し、鉛直方向の亀裂進展を抑える条件を示した。空洞幅と岩石の構成則によって安定性評価が大きく変わる。
  inspection:
