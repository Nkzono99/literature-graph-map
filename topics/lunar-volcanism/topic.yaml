- paper_id: P000246
  group: volatiles
  role: 水と爆発的火山活動
  summary:
    question: 月の爆発的噴火を駆動する水・一酸化炭素・水素の役割は何か。気泡の成長や地殻内でのマグマの一時滞留は、噴火の爆発性にどう影響するか。
    method: 気泡成長とマグマ上昇を連成したモデルで、炭素・水素を含む揮発性成分の影響を計算した。破砕時の水含有量を月の火山ガラスや火砕堆積物からの推定値と比較した。
    contribution: 計算では水が主な駆動源となり、水約500 ppm以上・CO約20 ppm以下で浅部の脱ガスと気泡成長が破砕を起こした。深さ約17 km以内での一時滞留も爆発性に有利と示唆された。
  evidence_by_item:
    question:
    - paper_id: P000246
      version_id: V1
      url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025JE009318
      source_type: abstract
      locator: Abstract、第3–4文（水と気泡の役割）、第8文（地殻内の一時滞留）
      checked_at: '2026-10-06'
    method:
    - paper_id: P000246
      version_id: V1
      url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025JE009318
      source_type: abstract
      locator: Abstract、第5–6文（連成モデルと水含有量の整合）；Plain Language Summary、第3文（C・Hを含む揮発性成分の評価）
      checked_at: '2026-10-06'
    contribution:
    - paper_id: P000246
      version_id: V1
      url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025JE009318
      source_type: abstract
      locator: Abstract、第5文（水が主な駆動源）、第7文（水≳500 ppm・CO≲20 ppm、数百mの浅部での脱ガス・気泡成長と破砕）、第8文（深さ≲17 kmでの一時滞留）
