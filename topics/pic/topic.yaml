schema_version: 1
topic_id: pic
title: PIC法・プラズマ粒子シミュレーション
question: 粒子と場の結合、数値誤差、陰解法、境界処理から大規模計算まで、PICの手法と実装をたどる。
review:
- heading: 粒子と格子の往復で、分布関数と場をつなぐ
  paragraphs:
  - PIC（Particle-in-Cell）では、多数の実粒子を代表する計算粒子を動かし、その電荷や電流を格子に集めて場を求める。得られた場を粒子位置へ戻すことで、粒子の運動と集団としての応答が結び付く。[@P000059]はこの数値実験で分布関数、非線形現象、輸送を調べる考え方をまとめている。実装から学ぶなら、一次元の静電・電磁コードを出発点とする[@P000060]の教科書と、KEMPO1の教材[@P000061]が入口になる。静電場を解く部分は、Poissonソルバのテーマともつながる。
- heading: 保存則とノイズは、別々に確かめる
  paragraphs:
  - 粒子数を増やすと統計的な揺らぎは小さくなるが、場と粒子の離散化に由来する誤差も調べる必要がある。[@P000062]は電磁PICで生じるGauss則のずれを拡散的な補正で抑えた。小さな不安定性を追いたいときには、初期配置の揺らぎを減らす方法や、分布関数の摂動だけを粒子で表すδf法が役立つ。[@P000063]はその構成と電磁不安定性の試験を扱う。さらに[@P000072]のSICは、位相空間の分布をつながったシートで表す。一次元の標準問題におけるPICとの比較から、追跡点の数とノイズの関係を読み取れる。
- heading: 時間スケールの差を、陰解法で扱う
  paragraphs:
  - 速い電子運動と遅い変化を同時に追うと、時間刻みが計算費用を左右する。[@P000064]は陰的モーメント法で粒子と流体を結び、衝突を伴う電子輸送を扱った。電磁・運動論的な実装の基本は[@P000065]にまとまっている。そこからエネルギー保存に重点を移したのがECSIM（[@P000066]）で、非線形反復を使わずに粒子と場のエネルギー交換を釣り合わせる。相対論的な完全陰解法（[@P000067]）も併せると、結合の解き方と保存性を比較できる。計算条件を選ぶ際には、安定性とともに対象現象の時間・空間分解能を考える。
- heading: 物体形状と計算規模に合わせて構成を選ぶ
  paragraphs:
  - 月面地形や宇宙機の近傍では、表面形状に沿う格子や粒子の境界処理が効いてくる。CPIC（[@P000068]）は曲線格子とマルチグリッドを組み合わせ、複雑な物体とプラズマの相互作用に対応した。[@P000074]は宇宙機帯電を題材に、複数のPIC手法を整理して並列実行へつなぐソフトウェア構成を示している。
  - 大規模化では、格子数と粒子数の両方が費用を決める。OhHelp（[@P000069]）は粒子が集中する領域の仕事を他ノードへ分担し、[@P000070]は位相空間で近い粒子を統合する。FLEKS（[@P000071]）では、MHD計算に埋め込むPIC領域を動的に変え、必要な場所へ計算を集中させる。局所構造を細かく解く別の方向として、[@P000073]は疎格子のノイズ低減と適応的な格子細分化を組み合わせている。
public: true
