    method: イオン電流を半刻み進めるCAMと、磁場を副刻みで更新するcyclic leapfrogを組み合わせる。
    contribution: 電場の時間外挿を避けて多種イオンを1回の粒子走査で進め、波動・ビーム不安定性で検証した。
