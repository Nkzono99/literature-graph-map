- paper_id: P000234
  group: collection
  role: 球状探針へのイオン捕集
  summary:
    question: 低圧プラズマに置いた球状探針が集める正イオン電流は何で決まり、探針周囲の電位分布や電流と電圧の関係をどう記述できるか。
    method: 低圧プラズマでの正イオン捕集理論を整理・拡張し、球状探針の周囲の電位分布と正イオン電流の電流–電圧特性を計算した。
    contribution: 低圧プラズマでは、シースの外縁を越えてプラズマ中へ及ぶ電場が、探針の集めるイオン電流を主に決めることを示した。
