  group: photoelectron-sheath
  role: 月試料の光電子放出
  summary:
    question: 月試料の光電子放出は、月面上にどのような電子層を作るか。
    method: 月試料の放出収率と電子エネルギー分布を測り、太陽光下の光電子シースを近似計算した。
    contribution: 月試料に基づく放出条件を与え、電子分布をMaxwell分布で近似する際の高エネルギー側のずれを示した。
