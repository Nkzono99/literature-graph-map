- paper_id: P000253
  group: plasma-environment
  role: Chang’E-6/NILSによる月面H−の局所検出と負イオン層の推定
  summary:
    question: 月面に入射する太陽風は負イオンを伴って戻るか。水素と酸素負イオンを電子背景から分離し、局所フラックスから全反射率・近傍密度・高度をどこまで推定できるか。
    method: 月裏側ApolloクレーターのNILSデータ302分を、電子/H−/O−/偶発の校正TOF応答で最尤分離した。下向き5°を超える方向と時間を積算し、ARTEMIS-P2の太陽風に対して角応答補正を行う。全放出量には角分布とエネルギー・角度の独立を仮定し、昼側光脱離寿命から鉛直分布を推定した。
    contribution: 50–400 eVのH−を局所検出した。反射陽子角分布を用いると、反射率2.5（−0.8、＋1.2）%、表面直上体積密度0.18（−0.03、＋0.04）cm⁻³（90%区間）、昼側等価高度約10kmを推定する。O−は非検出で、収率<19.7%・密度≲2.3cm⁻³の上限に留まる。
