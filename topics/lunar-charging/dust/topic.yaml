- paper_id: P000317
  role: 斜長石細粒の速度分布と条件付きの月面高さ
  summary:
    question: 350 eV電子照射で斜長石粉体から動く粒子の粒径・速度関係を、共有電荷・孤立球・局所帯電モデルはどの条件で説明できるか。
    method: 斜長石を体積比90%超含む粉体を、背景プラズマのない約10⁻⁶ Paで350 eV・500 µAの電子ビームに照射し、PDPA/LDVで表面上6 mmの粒径と鉛直速度を同時測定。10回の実験の分布・検出率と、電流収支・運動モデルを比較する。
    contribution: 粒径信号の79.11%は5 µm未満で、高速側の粒径・速度包絡線は共有電荷モデルでは電場作用距離の仮定と両立しない。孤立球モデルは負の表面電位約−350–−119 Vで包絡線を覆い、局所帯電モデルも従来より大きい経験係数を要する。表面電位・粒子電荷・電場は未測定で、機構の特定は残る。
