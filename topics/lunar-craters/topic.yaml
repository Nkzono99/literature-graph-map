- paper_id: P000284
  group: renewal
  role: 新規衝突による遠方の熱物性変化
  summary:
    question: 衝突の影響はクレーター外の浅部レゴリスへどこまで及ぶか。
    method: McGetchinクレーター周囲のDiviner夜間温度を測り、他の新規クレーターとも比較する。
