- paper_id: P000131
  group: reactor-models
  role: RFシースと装置モデルの結合・制御の連成
  summary:
    question: 数十µm程度のRFシースを装置格子で解像せず、装置全体の電位・電子加熱・基板流束へ自己無撞着に結びつけるにはどうするか。
    method: 壁の各点でシース電荷の収支を時間積分し、Boltzmann電子と衝突なしの多イオン種・緩和電位を用いる局所一次元モデルから電圧降下を求め、二次元HPEMのPoisson境界と電子Monte Carloの反射加熱へ戻す。
    contribution: 10 mTorrのAr・Ar/Cl₂計算で、薄いシースの表現が密度・電位・自己バイアスを変えることを示し、流束の大きさは主としてICP電力、均一性はバイアスと固定する制御量にも依存することを整理した。実験比較はRFバイアスなしのDC特性に限る。
