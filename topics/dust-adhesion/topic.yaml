- paper_id: P000206
  group: roughness
  role: 付着接触の弾性曲げと不可逆な転がり抵抗
  summary:
    question: 付着した二つの弾性球が互いに転がろうとすると、接触面の遅れと非対称な圧力分布はどのような抵抗を生み、粒子鎖の変形・安定性をどう変えるか。
    method: 接触域内だけに引力を認めるJKRS理論と、原子間距離程度で接触が更新される仮定を組み合わせた。滑りを抑え、ずれた接触領域を二つの半円に近似して小変位の抵抗モーメントを求め、粒子鎖の曲率、重力下の支持数、振動と衝突後の転がりを計算した。
    contribution: 小変位では抵抗モーメントが引き離し力と接触のずれに比例し、仮定した臨界ずれを超えると接触更新でエネルギーを失うモデルを示した。同一球・外力ゼロの近似では転がり開始の接線力は6πγξ_yieldとなる。臨界ずれ0.2 nmは測定値ではなく、三次元接触の解も近似である。
  evidence_by_item:
    question:
    - paper_id: P000206
      version_id: V1
      url: https://ntrs.nasa.gov/api/citations/19980018487/downloads/19980018487.pdf
      locator: PDF p.2 / printed p.784, §1末尾–§2; p.4–6 / printed p.786–788, §3 and Fig.2
      source_type: full_text
      checked_at: '2026-10-11'
    method:
