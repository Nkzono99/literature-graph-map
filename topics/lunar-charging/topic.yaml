- paper_id: P000051
  group: environment
  role: ローブ中の地殻磁場と相対電位
  summary:
    question: 地球磁気圏ローブ中の月の日照面で、地殻磁場の強さは光電子の減速と相対表面電位の空間分布にどう対応するか。
    method: 2008年1月–2009年6月のかぐやLMAG・PACE/ESA-S1から336軌道・43,670点のローブ様日照面観測を選ぶ。α=0.420に固定したK23放出モデルを10 eV幅で平滑化し装置応答と畳み込んで、上向き電子の60–150 eVをχ²フィットする。直線磁力線外挿足点をLP電子反射法の5°×5°表面磁場図と照合し、欠測を除いた42,197点で磁場強度とΔEを比較する。
    contribution: 強い地殻磁場から来る光電子ほど負側の相対エネルギーずれを持つ統計的傾向を示し、静電減速を仮定すると磁化表面が相対的に正側となる解釈を支持した。地域間電位差はおおむねΔU≲10 Vの規模と推定され、Fe組成で二分しても磁場依存が残る。固定放出効率とエネルギーずれの縮退、未測定の探査機電位は明示的な限界である。
