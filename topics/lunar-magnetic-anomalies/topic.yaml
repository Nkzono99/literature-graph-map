schema_version: 1
topic_id: lunar-magnetic-anomalies
title: 月の磁気異常と太陽風相互作用
question: 地殻磁場が太陽風の粒子軌道・電位・表面照射をどう変えるかを、観測・PIC・実験から整理する。
review:
- heading: 局所的な磁場が、太陽風の届き方を変える
  paragraphs:
  - 月の地殻には、場所によって強さや向きの異なる磁場が残っている。その近くでは太陽風の粒子軌道が曲がり、表面に届く粒子の量とエネルギーが変わる。計算や観測を比較する出発点になるのが、かぐやとLunar
    Prospectorから表面磁場を復元した[@P000107]である。磁場の強さに加えて、表面に対する向きや空間的な広がりを参照できる。
  - Chandrayaan-1が測った月面からの水素中性原子は、太陽風の到達を画像として見る手段になった。[@P000109]は磁気異常の上に粒子フラックスが減る領域と、その周囲の増加域を捉えた。[@P000110]は中性原子のエネルギー分布へ着目し、入射陽子が減速する分から正の電位を推定している。
- heading: 電子とイオンの運動の違いが、電場と境界電流を作る
  paragraphs:
  - 小さな磁気異常では、電子は磁場の影響を強く受ける一方、イオンの旋回半径は異常の寸法より大きくなる。この応答の違いから電荷が分かれ、電場が生じる。かぐやによる[@P000111]では電子の加速と陽子・アルファ粒子の減速が同時に観測され、電場の存在を粒子エネルギーから調べている。
  - 三次元PICの[@P000112]は、電子の偏向、反射イオン、周囲の密度増加を一つの計算で追跡した。[@P000114]は境界層に焦点を絞り、電子のドリフトと旋回運動から電流の構造を説明する。双極子を垂直に向けた[@P000113]では、カスプへの流入と周囲の電場によって反射や表面照射の形が変わる。磁場の形状は、遮蔽の強さと同じくらい重要な比較軸になる。
- heading: 実際の磁場配置と表面帯電へ広げる
  paragraphs:
  - Reiner Gammaの観測に基づく磁場を使った[@P000115]は、太陽風の入射角や磁気シース通過を含む8条件を比較した。高度によっても粒子分布が大きく変わるため、周回機と着陸機の観測を結び付ける際に参照できる。
  - 表面電位は、流入する粒子と放出電子の両方に応答する。[@P000116]の室内実験では、電子が磁場で遮られる領域の正電位が、イオン衝突で生じた二次電子によって抑えられる可能性が示された。地球の磁気圏ローブ中を扱う[@P000051]は、光電子スペクトルから地殻磁場と日照面の相対電位の対応を調べている。外部プラズマの条件をそろえることで、これらの結果を比較しやすくなる。
- heading: 局所の遮蔽から、広域の照射とスワールへ
  paragraphs:
  - 磁気異常に反射・偏向された陽子は周囲にも運ばれる。[@P000117]は、異常内部でのフラックス減少と、1,000 kmを超える周辺領域での増加を中性原子・陽子のマップから示した。小さな孤立異常とSouth
    Pole–Aitkenの磁気群では、太陽風動圧への応答も異なる。
  - 長い時間にわたる照射の違いは、表面の明るいスワール模様や宇宙風化へとつながる。[@P000108]は磁場と反射スペクトルを比較し、太陽風遮蔽と微細ダスト集積の両方から模様の成因を論じた。粒子・電場を扱う研究と表面の分光観測を合わせて読むことで、瞬間的なプラズマ環境から表面変化へのつながりを追える。
