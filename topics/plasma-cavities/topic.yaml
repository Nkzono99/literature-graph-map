- paper_id: P000016
  group: lunar
  role: 流速と熱速度の比
  summary:
    question: 太陽風の流速と熱速度の比は、空洞底部の電位をどう決めるか。
    method: Debye長より幅が小さい空洞を、三次元PICと自由落下モデルで比較。
    contribution: 流速がイオン・電子の熱速度を順に超すと、底部電位は負→正→ほぼゼロ。
