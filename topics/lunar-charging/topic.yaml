- paper_id: P000016
  group: topography
  role: 流速と熱速度の比
  summary:
    question: 太陽風の流速と電子・イオンの熱速度の関係は、深い空洞の底部電位をどう決めるか。
    method: Debye長より幅の小さな空洞を三次元PICで計算し、流速と縦横比への依存性を自由落下型の半解析モデルと比較する。
    contribution: 流速がイオンの熱速度より小さいと底部は負、イオンと電子の熱速度の間で正、電子の熱速度を超えるとほぼゼロになる三つの領域を示した。
