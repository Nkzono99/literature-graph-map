  summary:
    question: Chang’e-5月壌は母岩と衝撃の履歴をどう残すか。
    method: 月壌・角礫岩のラマン点計数1259点と顕微像を分析した。
    contribution: 鉱物・ガラス組成から外来物質の混合と再加工を示唆し、石英・マスケリナイトで衝撃を制約した。
