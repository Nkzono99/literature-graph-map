- paper_id: P000233
  group: properties
  role: 軌道運動制限による捕集理論の起点
  summary:
    question: 電離した低圧気体中の球形・円筒形電極が捕集する電流は、粒子の速度分布と電極電位にどう依存するか。電流と電圧の関係から速度分布を求められるかを調べる。
    method: シース内での荷電粒子と気体分子の衝突を無視し、軌道運動から捕集電流の一般式を導いた。等速で平行に進む流れ、等速で方向がランダムな分布、マクスウェル分布とそのドリフト付き分布について計算した。
    contribution: シース半径が電極半径より十分大きいと、電流はシース半径にほぼ依存しないと示した。小さな球形・円筒形電極の電流と電圧の関係から、粒子の速度分布を求める式を与えた。
