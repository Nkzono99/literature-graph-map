schema_version: 1
topic_id: lunar-charging
title: 月面帯電
question: 月面の電位、光電子シース、ダストの帯電と移動を、基礎・観測・地形・材料・探査技術から整理する。
synopsis:
- 月面の帯電は、流入する電子・イオンと放出される電子の電流収支で表面電位が決まり、その上に光電子シースが広がるという枠組みで理解される（[@P000002]、[@P000007]）。電位はプラズマ環境、太陽照射、地形、材料で変わり、Lunar
  Prospector以降の観測は夜側や磁気圏尾部での強い負帯電を示した（[@P000003]、[@P000025]）。
- 研究は、平坦面の電流収支から、地形による粒子の選別（[@P000008]、[@P000012]）、粒子ごとの帯電と空隙での電子再捕集（[@P000009]）、レゴリス内部の帯電（[@P000057]）へと対象を広げてきた。ダストの離脱と輸送については、噴泉モデル（[@P000022]）と上空の観測（[@P000390]）の間に、供給率と離脱条件という未確定の段階が残る。
- 探査機の差動帯電と付着ダストへの対策（[@P000024]、[@P000028]）は、同じ電荷と力の関係を機器側から扱う。子テーマでは、シース、観測、地形、ダスト、工学の順に、条件を対応させながら文献を比較できる。
review:
- heading: 月面電位から、表面の上に広がるシースへ
  paragraphs:
  - 月面にはプラズマの電子とイオンが流れ込み、紫外線や粒子の衝突で電子が放出される。その電流の釣り合いが表面電位を決める。月試料の光電子放出を測った[@P000001]と、電流収支を整理した[@P000002]が基礎になる。[@P000020]はApolloのSIDEが測る月面電位を、電子密度と遮蔽長から見積もるシース・電場へつないだ。放出電子が表面近くにとどまると、電位が空間的に変わる層、シースが生じる。粒子と電場を追跡する[@P000007]のPIC計算、[@P000030]の室内計測、[@P000036]の観測との比較は、この構造をそれぞれ異なる方法で調べている。
  - Freemanら[@P000020]は、SIDEイオンデータから太陽風中の昼側約+10 Vと終端付近の負電位を整理し、光電子放出に依存する理論予測を観測像へ結びつけた。Apollo
    15地点では午後に約+18 Vとなる特徴も報告する。電場の大きさは仮定した遮蔽長からの概算で、遠夜側の約−100 Vと約1 V/mは条件付きの推測として扱う。
  - 磁気圏尾部では、日照側でも非単調なシースが問題になる。[@P000036]はARTEMIS P1の35分間の電子・イオン観測を一次元PICと比較し、実測イオン温度を加えることで、光電子ビームのエネルギー変化と一時的な消失を説明した。比較量は無限遠から電位極小までの落差に対応するビームエネルギーで、探査機電位を加えて観測と照合している。ダスト浮揚への含意は示すが、粒子の離脱や輸送を直接測った研究ではない。
  - 太陽風電子の流れを含む[@P000011]は半解析解を一次元PICと比較し、電子分布による違いも調べた。日照面上空でも、磁気圏プラズマシート中の[@P000033]のように非単調な電位構造が問題になる。
  - イオン温度の影響は、表面へ速く流入する太陽風では小さく、太陽天頂角が大きく法線速度がBohm速度に近づく領域で大きくなる。[@P000055]は温かいイオンを含む定常計算で、θ=89°の負電位シースが薄くなり、θ=85°の非単調シースでは負の電位極小と光電子を戻す障壁が弱まることを示した。表面電場と極小高度の変化には非単調な応答があり、ダストへの影響はシースの密度・電場構造の変化からの示唆である。
- heading: 月面電位を変える宇宙環境
  paragraphs:
  - ApolloのCPLEEなどによる初期の粒子計測（[@P000018]）に続き、Lunar Prospectorは軌道上の電子から夜側の負帯電や、磁気圏尾部・太陽活動に伴う強い帯電を捉えた（[@P000003]、[@P000004]、[@P000006]）。[@P000025]は探査機電位の補正を含めて入射電流との対応を定量化し、[@P000027]はSEPイベントの観測と予測を比較した。ARTEMISでは昼側シースの遠隔計測（[@P000034]）へと論点が広がる。IM-1のROLSESによる電波・プラズマ波観測（[@P000056]）も、月面の電気的環境を知る手掛かりになる。
  - '[@P000045]は磁気圏尾部ローブの55事例を調べ、月夜側の負電位の絶対値が、周囲プラズマ収集と二次電子放出を含む予測より夜明け側で小さく、低密度ほど差が大きいことを示した。既往実験と微小隕石分布から全球平均約10^-10
    A/m^2、上下に各1桁の不確かさを見込む衝突電流を推算し、負の月面から衝突電子が逃げる電流と夜明け側に偏る衝突分布が観測を説明しうると提案した。'
  - 地球磁気圏尾部のローブ様条件で、日照面の相対電位が地殻磁場に応じて不均一になることを光電子解析が示唆した。Katoらはかぐやの光電子とK23モデルを比較し、336軌道の統計で磁場の強い地域ほど負側のエネルギーずれを得た。静電減速を仮定すると、その地域は相対的に正側へ帯電し、地域間の電位差はおおむねΔU≲10
    Vの規模と推定される。上向き電場はこの減速からの解釈であり、絶対表面電位を独立に決めるには未測定の探査機電位と放出効率の縮退が残る。[@P000051]
  - '[@P000034]は、ARTEMIS-P2の電子分布と探査機電位から、磁気圏尾部ローブで−30〜−60 V、プラズマシートの短い接続区間で−180〜−450
    Vの月面電位を推定した。入射熱電子電流が予想光電子電流よりローブで2桁以上、プラズマシートで約2桁小さい条件での負電位は、表面上の電位極小が光電子を閉じ込める非単調シースの解釈を支持する。シースの高度分布は直接測っておらず、プラズマシート後半には夜側接続も排除できない。'
  - '[@P000025]の選択観測では、夜側の負電位は尾部ローブで約−100 V、プラズマシートで数百V～約−1 kVとなる一方、通常ウェイクでは中央より境界付近の負電位が大きい。日照下の負帯電は光電子放出の低下と非単調シースの両方を候補として残し、夜側の温度依存は条件付きで最大二次電子収率δM約1.1～1.2と整合する。'
  - 月面で局所プラズマとダストを測る装置設計へ進んだのが[@P000056]のROLSESである。狭帯域のプラズマ振動から電子密度を、帯電粒子とアンテナの接触パルスからダストを識別する構想を示す。IM-1では転倒と短い運用時間で月面データが36分に限られ、本稿の初期結果は主に輸送中の地球送信電波と機器雑音を扱う。シース密度・ダスト検出は測定結果として提示されていない。
  - 昼側の正電位も、環境に応じて変わる。[@P000162]は太陽活動による光電子放出の変動を調べ、[@P000161]は別の光電子モデルとARTEMIS観測から日照・プラズマ条件への依存を推定した。太陽風の流入側では、[@P000163]が磁気異常の反射陽子による広域の擾乱を論じている。
  - '[@P000023]はLunar Prospectorから全球の帯電環境を整理する。[@P000041]はローブ中の光電子と昼側電位を推定し、[@P000046]はARTEMIS・OMNIの観測条件を帯電モデルへ渡した。この流れを現地の計測へつなぐ資料として、月面での電磁場観測を計画する[@P000032]がある。'
  - '[@P000041]は、ローブ中の弱地殻磁場の日照面から得た829の電子スペクトルと太陽光子流束から、高エネルギー光電子の経験式を作った。光電子と流入電子の電流釣り合いは一事例で+22～41
    Vを予測し、イオン反射の+15～25 Vよりやや高かった。流入電子を固定し1–5 nmの光子流束を10倍にした+70～98 Vという予測は、強いフレアへの感度を表す。高エネルギー放出成分をダスト帯電モデルへ渡す資料になる。'
  - '[@P000038]は、通常太陽風の昼側では光電子放出と電子入射、影側の明暗境界付近では電子・イオン入射が主に釣り合うことを、六つの入力を変えた定常モデルで整理した。昼側では光放出量と光電子温度、境界では電子温度の影響が大きい。ただし極端に冷たい電子や高速流ではイオン電流も昼側の収支に効き、二電流近似から外れる。電場はDebye長からの近似で、地形のwakeや二次電子、非単調シースを含む条件には追加の検討が必要になる。'
- heading: 極域と空洞では、地形が粒子の到達を変える
  paragraphs:
  - 永久影では光電子が出にくく、地形が太陽風も遮る。LOLA地形を使う[@P000031]と、表面帯電とプラズマを解く[@P000008]は、形状と流入条件を具体化している。深い空洞では、電子が側壁に失われて底部へのイオン電流が電子電流を上回ると、底部が正に帯電する場合がある（[@P000012]）。空洞寸法とシース厚の比による正電位の緩和は[@P000015]、流速と熱速度の比による底部電位の変化は[@P000016]へとつながる。南極の実地形を含む計算は[@P000017]が扱う。
  - '[@P000048]は、直径1.2 kmの極域クレーターをBoltzmann電子とイオン粒子で三次元計算し、上流のシースから始まる擾乱と、イオンが届きにくい壁の近傍の電子雲を示した。標準条件の約−60
    Vは、光電子・二次電子放出を省いた20秒計算の準平衡値で、影領域の電流平衡は閉じていない。帯電とプラズマ侵入の結合を示す研究として、最終表面電位の予測とは条件を分けて位置付ける。'
  - 極域では地形が太陽風を遮って局所後流を作り、膨張で生じる両極性電位に、表面の電流収支で決まるシース電位が重なる。Farrell et al. は南極のレーダー地形に解析モデルを適用し、通常太陽風のShoemaker断面で風下壁近傍の合計電位を約−90
    Vとした。イオンが斜面へ入射しない電子雲地点では追加電流が必要で、負帯電ダストの放出を一候補としたが、放出の実証や自己整合なダスト電流計算は行っていない。[@P000058]
- heading: ダストの離脱と輸送を、粒子の電荷から考える
  paragraphs:
  - '[@P000022]は電場で加速されたダストの上昇・落下を噴泉モデルで表した。2007年会議録[@P000389]は指数減衰する電位でシース内の低高度解を追加したが、初期電荷と凝集離脱、粒子供給は仮定に残る。[@P000387]は凝集・重力・平均電荷配分から、中間半径で離脱閾値が最小になると予測した。[@P000388]のポリスチレン実験は中間粒径の堆積が最も広がる傾向を示し、電子ビーム下のJSC-1を使う[@P000392]は小粒子が捕集集団で相対的に多いと報告した。材料・帯電条件と、拡がり・相対分布という測定量をそろえて比較する。'
  - Rennilson and Criswellは、Surveyor 7の校正済み・非飽和画像を解析し、日没後の地平線光を岩上に鉛直20–30 cm程度に広がる粒子雲の前方散乱として解釈した。回折モデルから代表半径5–6
    µmを推定し、雲を供給する機構として、低導電率の岩・土壌が明暗境界の電荷差を保つ静電浮遊モデルを論じた。半径6 µmに必要とされる約660 V cm⁻¹はモデルの要求値で、現地電場の測定結果ではない。後期のより高い雲には追加の帯電過程を要する可能性を残した。[@P000019]
  - 粉体外縁の移動を撮影した[@P000026]と電子照射下の[@P000029]は、局所電場による移動を調べた。電子再吸収を扱うpatched charge
    model（[@P000009]）に対し、[@P000391]は照射停止後に外部電圧で回収した粒子の負電荷を測った。回収選別と正味電荷を確認し、局所電荷や自然離脱の測定と対応させる。導電損失（[@P000010]）も電荷の蓄積を左右する。
  - LDEXの個別衝突を解析した[@P000390]は、明け方に偏る持続的なダスト雲と流星群時の増加を捉え、衝突噴出物と解釈した。同じ観測キャンペーンの[@P000039]は、積分電流の残差にイオンが混じることを踏まえ、半径0.1
    µmを仮定し、各境界通過時の機体速度を用いて密度上限を求めた。日の出側で太陽風中約100 m⁻³、磁気圏尾部約40 m⁻³という制約は高度3–250 kmに対するもので、地表近傍の全輸送を確定しない。
  - 地形と太陽風条件を合わせて局所帯電を考える例として、[@P000044]はCopernicus・Pliniusの薄明域で繰り返すLDEX積分電流の5増加を選び、下流側の粒子増加を局所ダスト噴水で解釈した。地形・ARTEMIS条件からのEvent3計算では平坦面約−50
    Vに対して風下壁付近は最小約−500 Vとなり、地形が水平電場も作る。これは表面電位の現地測定ではなく、電流選別と帯電モデルを結びつけた結果であり、凝集力に抗する離脱条件は残る。
  - 材料による帯電の違いは月試料と模擬粒子の[@P000021]へさかのぼれる。[@P000005]は保持した負の単粒子の電荷変化から光電子効率を求め、吸収モデルと外挿を介する収率も推定した。模擬レゴリス上の電荷を測る[@P000037]とは測定量と配置が異なる。飛翔後の電荷も変わり、[@P000167]は光電子シース中の連続・離散帯電、[@P000165]はプルームの摩擦電荷が停止後に残る輸送を計算した。
  - Apollo 17の実月試料でも、電子ビームとアルゴン熱プラズマ中の単粒子電荷に二峰性が現れ、Horányiらは二つの安定平衡として解析した。月の地球プラズマ尾通過時にも複数状態があり得ると解釈しているが、実験は半径29±3
    μmの落下粒子の測定であり、月面での現地観測や浮遊・輸送の実測には相当しない。昼側のUV光電子帯電は将来の実験計画に残る[@P000166]。
  - 粒子と基板の隙間へ再捕集モデルを広げる[@P000013]と、光・低密度プラズマの同時照射[@P000014]は、表面上の電荷分布を具体化する。UVと付着を扱う[@P000040]は離脱条件の比較対象となる。
  - Orgerらは、3件のCMEの上流プラズマデータから明暗境界の表面帯電を計算し、粒子間の単一空隙で蓄えた負電荷が接触力と重力を超える条件を求めた。離脱後の帯電と鉛直運動まで追うと、半径0.1
    µmの最高高度は最大約540 m、1 µmは18.22 m、5 µmは0.344 mとなった。密度増加は電場を強める一方でシースを薄くするため、強い電場だけでは高度増加を説明できない。これらは空隙サイズを粒子直径s=2aとした模型の結果であり、二次電子放出から推定した離脱頻度は最高高度とは別に評価する必要がある。[@P000043]
  - '[@P000042]は、通常太陽風とCMEを想定した5条件で平衡電流収支を計算し、太陽直下点と明暗境界では環境変化への応答が異なることを示した。フレアを含む初期CMEでは直下点の正電位と電場が最大となり、ゼロ電位の位置は太陽天頂角89.7111°まで明暗境界に近づく。衝撃波通過後と後期CMEではゼロ電位の位置は約67.6°となる。磁場なし・単調シース・二次電子放出無視などの仮定に基づく条件比較である。'
  - 粗い月面では、入射電子とイオンが同じ場所に到達するとは限らない。[@P000047]は、電子が浅い側壁で捕集され、方向性の強い太陽風イオンが空洞の奥へ届くイオン駆動帯電を例に、全球平均・地形・微小スケールの電位をつなぐ階層像を論じた。紹介されたPIC結果では深さ/幅比2以上で底部電位が急増し、最大約+800
    Vとなるが、微小空隙へのサイズ外挿と月面での検証は今後の課題である。電子の再捕集や有限導電性などの緩和を含め、モデル・観測・地上試験を比較する必要がある。
  - VUV照射下の正の層電位は、層を構成する粒子の一律正帯電を意味しない。[@P000052]は、照射後のJSC-1A表面電位+3〜+5 Vを測り、その後の逆極性バイアスの別測定で動員粒子の正負両電荷を検出した。正56%・負44%は検出器極性を切り替えた別測定の合算値で、月面の全粒子数比の測定ではない。
  - 月面の電子電流収支に使う材料特性として、Vegaほかは固定した月模擬レゴリス層の全電子・二次電子・後方散乱電子収率を測った。パルス間中和を伴う測定は試料帯電による収率1への偏りを抑える。Table
    Iに示す二次電子収率フィットの第1交差は約93〜120 eV、第2交差は約1.8〜2.5 keVで、入射スペクトルに対する放出電流計算の条件付き入力になる。実月試料への代用は試料構造や組成によって変わり、月面の平衡電位そのものを測った結果ではない。[@P000053]
- heading: 探査機の帯電と、付着ダストへの対策
  paragraphs:
  - 機器への影響を考える際は、表面間の電位差や材料の違いが問題になる。[@P000054]は月ミッションの帯電環境を整理した。除塵には電極が作る電場を用いるEDS（[@P000028]）があり、イオン中和と再帯電による捕集（[@P000049]）の特許もある。これらは、自然のダスト移動で扱う電荷と力の関係を、機器側から制御する技術として参照できる。媒質と作用する力を対応させて各方式の条件を比較する。
  - Rizzoらは、UV照射による電子放出と近傍粒子への電子移動を、ブラシ内の電場駆動と組み合わせる構成を公開特許として提案した。宇宙服などからダストを毛へ移した後に、EDSとUVでブラシ自体を清掃する。帯電状態や除去率の測定値は掲載されていないため、帯電を道具の清掃へ利用する構成例として位置づけられる。[@P000050]
  - '[@P000035]は、誘電体を隔てた電極で生むDBDプラズマが周囲気体に運動量を与え、表面に沿う流れで粉体を動かす太陽電池清掃法を特許として示した。アルミナ基板・銅テープ電極とCarbondale赤色粘土の試験では、正弦波電圧で電極に平行な約7
    mm幅の清浄帯を報告し、大気圧の別試験写真でも粉体の再配置を示す。透明電極・誘電体カバー、順次駆動、任意の振動補助は実装案で、火星CO₂・低圧環境での試験は未実施である。約300
    V運転と省電力は期待値として述べられており、月面の真空に対しては周囲気体という条件を区別して位置づける。'
  - '[@P000028]は、粒子の帯電・分極を除塵に使う電気力学的ダストシールド（EDS）を透明電極で実装した。約10⁻⁶ kPaで50–75 µmのJSC-1Aを散布した太陽電池では、作動後に電圧が基準の91.6–99.4%へ戻った。媒質より誘電率が高い中性粒子には、分極で電極へ引かれ、接触によって帯電してから離脱する経路を考えるが、本稿で粒子電荷や力の分担は測っていない。自然環境の帯電研究と比較する際には、初期電荷に加え、電極が作る電場と表面接触を条件として揃える必要がある。'
  - 宇宙服の除塵を提案する[@P000049]は、正負のイオンでダストを中和した後、回収器へ取り込み、負に帯電させ直して正の板へ捕集する構成を示す。床下フィルタによる回収も併設し、居住区への持ち込みを防ぐことを狙う。エアロック内の案は気体充填と送風を含み、外部梯子型の真空動作や定量的な除去性能は検証されていない。
  - 電子ビームを使う[@P000164]では、VUVを併用すると布上の模擬ダストが動き出しやすくなった。太陽に似た波長分布を用い、照射強度は月面より高い条件で調べている。
  - 月面の負電位を宇宙機の帯電へ結び付けるには、機体材料と電子分布の違いを考慮する必要がある。ParkerらはLunar Prospectorを模した機体を高度100
    kmの深い月ウェイク5環境で計算し、低速太陽風では約−236 Vまたは−154 Vになる一方、境界層・磁気シース・高速太陽風では小さな正電位、プラズマシートでは正負にまたがる電位が得られた。著者は主に正となる結果を太陽電池の二次電子放出に結び付けた。Maxwell分布を用いた計算の限界を挙げ、非熱的な電子・イオン分布を扱う月専用モデルを提案している。[@P000024]
- heading: 高エネルギー粒子は、表面の下にも電荷を残す
  paragraphs:
  - 極域の低温レゴリスでは電荷の散逸が遅い。[@P000057]は入射粒子の侵入深さ、電荷保持、伝導を電荷連続式とPoisson方程式で結び、表面収支へ内部帯電を加える枠組みを提案した。[@P000311]と[@P000312]は、絶縁破壊が細粒化・溶融・蒸発を通じて表層を変える可能性を評価している。水への接続を分子過程から調べた[@P000313]は、破壊で露出した酸素と太陽風由来水素の反応を計算した。いずれも、モデルが予測する作用と現地で確認された作用を区別して読む。
  - 永久影では低い導電率のため、表面の電流平衡に加えて粒子がレゴリス内部へ沈着させる電荷を考える必要がある。Jordanらは代表導電率10⁻¹⁷ S/mの一次元モデルへGCR・SEP観測を入力し、GCRで帯電域の上下に最大約700
    V/m、大規模SEPで非重複層間に8.8–16 MV/mを予測した。電子・陽子層の重なりと未検出の低エネルギー粒子に結果が依存し、絶縁破壊は他材料の閾値との比較から示した可能性である。内部電場を月面上空の場やダスト浮上へ結びつけるには、表面帯電との連成と低温土壌の実験検証が残る[@P000310]。
  - '[@P000057]は、永久影領域の地下帯電を扱う既存モデルに対し、入射粒子1個・単位深さ当たりの平均符号付き保持電荷を、粒子種とエネルギー別に求める必要を整理した。停止・反射・透過した一次粒子と、再結合・再吸収・捕獲・脱出した電子を合わせて数えるため、エネルギー付与分布だけでは電荷源が決まらない。この応答を入射フラックスへ結び、伝導・誘電緩和・Poisson方程式へ渡す接続を提案するが、平均化スケール、線形重ね合わせ、時間尺度の分離と、月レゴリスでの応答値は未確定である。'
- heading: 観測から光電子と散乱電子の寄与を分ける
  paragraphs:
  - 表面を出入りする電子の起源も、帯電を考える手掛かりになる。[@P000362]は酸素Auger電子を指標に光電子を選び、放出収率を制約した。[@P000363]は後方散乱電子が再び表面へ戻る磁場の効果を調べた。これらの観測は、光電子シースや昼側電位のモデルへ入れる電子電流の基礎量を補う。
  - '[@P000364]は、昼側月面に磁気的に接続するARTEMIS観測から光電子を選び、宇宙機電位と月面電位を補正した約500 eV・100 eV流束を比較した。流束はおおむねcosine-power型の太陽天頂角依存と太陽軟X線との正相関を示す。一方、光電子の識別割合は環境と降下電子に左右され、著者の報告ではローブ51.2%、太陽風8.6%だった。月面電位の補正法は同伴論文に依存する。傾きの選別閾値は本文と図2で一致せず、実際の設定は未確定である。'
