schema_version: 1
topic_id: lunar-charging-observations
title: 月面帯電の観測・宇宙環境
question: ApolloからLunar Prospector、ARTEMIS、かぐや、IM-1へ。観測から読む月面の電気的環境。
review:
- heading: 電子観測から月面電位を推定する
  paragraphs:
  - 月面の粒子環境はApollo 14のCPLEE（[@P000018]）などで測られ、その後は軌道からの電子観測が蓄積された。Lunar Prospectorでは電子のロスコーンやビームが夜側電位の手掛かりになる（[@P000003]）。[@P000025]は探査機自身の電位を補正し、周囲のプラズマに対する月面電位と入射電流の関係を求めた。[@P000023]はその環境の違いを全球的に整理している。
  - Halekas (2008) は探査機電位を補正したLP電子分布から月面負電位と入射電子電流を対応づけ、日照プラズマシートでも数百Vの負電位を報告した。通常ウェイクの境界付近約−200 V、中央部の絶対値100 V未満は局所ウェイクプラズマを基準とする。1998年5月6日のSEPでは約−4 kVに達したが、この期間には探査機電位補正を適用できておらず、局所プラズマ基準と解釈するには探査機電位が小さいという仮定が加わる。[@P000025]
  - 電子スペクトルのエネルギーずれを使う電位診断に対し、[@P000262]は左右で異なる分布を独立に最適化し、中央の衝撃波では捕捉電子の平坦な分布幅を使う。ARTEMIS P1の2016年7月29日と2011年10月23日の横断で、太陽風から中央への電位降下を約800 Vと約200 Vと推定した。安定した磁場と上流の定常性が適用条件となり、地球フォアショックとの接続が疑われる区間や、中央の分布端が曖昧な境界には手法間の差が残る。これらはウェイク内プラズマの電位差であり、表面帯電へつなぐには別の電流収支とシースの検討が必要となる。
- heading: 磁気圏・太陽活動・衝突で変わる電流
  paragraphs:
  - 磁気圏尾部では日照域も強く負に帯電しうる（[@P000004]）。太陽高エネルギー粒子イベントを扱う[@P000006]、[@P000027]はkV級の負帯電を観測と電流収支で比較する。ARTEMISでは遠隔のシース推定（[@P000034]）、太陽放射と光電子の対応（[@P000041]）が調べられた。[@P000046]はARTEMISとOMNIの条件を帯電予測へ組み込む。
  - Poppe et al. (2021)は、上向き電子ビームから月面との電位差を遠隔推定する方法を55回のローブ内夜側接続に適用した。途中の非単調電位を考慮しない仮定と直線磁力線追跡の下で、10度幅の経度別中央値を比較すると、夕方から真夜中の観測／理論比は約0.8で、真夜中から夜明けに向けて比が下がり、とくに低密度群で小さくなった。この経度・密度依存を衝突プラズマによる追加電流のモデルと結び付けた[@P000045]。
  - Lunar Prospectorの帯電観測で残った探査機電位の未知のずれに対し、[@P000034]はEFIで測ったARTEMIS-P2の電位を補正に使った。2010年3月28日に月面から8,000 km以上離れた位置から、ローブの−30〜−60 Vとプラズマシートの−180〜−450 Vを推定し、ローブの日照面負帯電に初めて定量的な証拠を与えた。低エネルギー分解能と磁力線曲率は依然として制限となり、後者の区間後半は夜側接続を排除できない。
  - '[@P000041]は、2011年7月～2016年9月のARTEMISから、ローブ・低高度・ほぼ太陽直下の弱磁場域に限った829スペクトルを選んだ。観測80–300 eVの上向き電子とFISMの1–5 nm光子の相関は0.77で、平均流束比は5.0×10⁻³だった。表面電位を各区間で得られるとは限らないため、この統計は観測エネルギーで比較する。2012年12月29日の+15～25 Vは、冷たいイオンの反射が測れた一事例の制約である。'
  - 太陽活動が高まると、光電子電流も増える。[@P000162]はARTEMISの長期観測をモデルと照合し、フレア時の磁気圏ローブで+100 Vを超える正電位を予測した。[@P000161]は別の放出モデルで光電子のエネルギーずれを読み、昼側電位の日照・プラズマ依存を統計化している。
- heading: 場所の違いと、新しい月面計測
  paragraphs:
  - 観測計画の資料としては月面電磁場計測を検討する[@P000032]がある。IM-1のROLSES（[@P000056]）は月面の電波・プラズマ波を測る装置であり、装置論文には設計と初期観測がまとまっている。
  - Katoらは、かぐやの上向き光電子の60–150 eVを用い、放出効率α=0.420に固定したK23モデルを装置応答と畳み込んで相対エネルギーずれを求めた。2009年5月7日の事例では非磁化領域で+2.9 eV、磁化領域で−7.5 eV、選択した43,670点のうち磁場図と比較できる42,197点の統計でも強い地殻磁場ほど減速する傾向を得た。静電変化を仮定した地域間電位差はおおむねΔU≲10 Vの規模である。ただし、推定に使う連続スペクトルでは放出効率とエネルギーずれが縮退し、探査機電位も未補正のため、相対電位として扱う必要がある。[@P000051]
  - アンテナの電場信号から局所密度とダストを調べるROLSESの設計・運用を[@P000056]が報告した。4本のモノポールでスペクトルと生波形を返したが、全区間10 dBの低利得、DSP平均化エラー、機体雑音が測定を制限した。輸送中の16–22 MHzの電波線は地上AJ4COとの周波数対応から地球送信電波と解釈された。月面36分のデータからシース密度や帯電ダストを測った結果は本稿に含まれない。
  - Chandrayaan-1の[@P000163]は、夕方側57周回の観測で、SPA磁気群上空の高度約100 kmに太陽風の偏向・加熱・減速が繰り返し現れることを示した。著者らは反射陽子との相互作用によるproto-magnetosheathと解釈しており、上流で測った太陽風と月面近くの入射条件を結ぶ際に参照できる。
  - 近傍ウェイクでの陽子エネルギー変化[@P000186]は、表面との相互作用を周囲の粒子分布へ結び付ける。磁気異常で散乱された陽子がウェイクへ届く経路は[@P000273]が観測と逆向き軌道追跡で調べた。低高度のPACE・LMAGによる[@P000178]は磁気リコネクションの候補を扱い、局所磁場による粒子加速を検討する。
  - Saito et al. (2008)は、かぐやのPACEで昼側月面方向から戻るイオンを捉え、前日の類似事例の質量測定と広い角度分布から太陽風陽子の月面反射・散乱を支持した。著者が報告する約0.1〜1％は、元の太陽風イオンフラックスに対する反射陽子フラックスの比である。30％のエネルギー低下を表面相互作用での損失と解釈する一方、高エネルギー成分は太陽風の対流電場による反射後の加速で説明する。月面電位の数値を直接求めた観測ではない。[@P000184]
  - Chandrayaan-2の電波観測[@P000247]は、太陽風中と磁気圏尾部での密度ゆらぎを比較する。粒子のエネルギーや電位を測る研究に対し、電波の伝播からプラズマの変動を調べる観測として位置づけられる。
- heading: 月起源イオンの供給から地球方向への輸送へ
  paragraphs:
  - 月起源イオンを直接捉えたかぐやIMAの[@P000185]に加え、[@P000177]は地球起源酸素の月への輸送、[@P000179]は月周辺のC・N・Oイオンの日変化を調べた。
  - Wieser et al.（2025）はChang’E-6のNILSで、月裏側の着陸点から1–20 mの月面に由来する50–400 eVのH−を検出した。電子・H−・O−・偶発計数の校正TOF応答を最尤分離し、O−には有意検出に届かない上限を与えた。反射陽子と同じ放出角分布、エネルギーと角度の独立、ARTEMIS-P2の入射太陽風を仮定すると、H−反射率は2.5（−0.8、＋1.2）%、表面直上の体積数密度は0.18（−0.03、＋0.04）cm⁻³（90%区間）となる。既報の昼側寿命70 msを採用した等価スケールハイト約10 kmは、スペクトルと放出角分布を使うモデル推定である。負イオンのダスト帯電や波動への影響は今後の課題に位置づけた。[@P000253]
  - Zhong et al.はWieser et al.の初検出と同じChang’E-6/NILS観測系列を用い、6区間の高エネルギーH−成分とARTEMIS太陽風条件の正相関を調べた。月面から出る負イオンを背景電磁場で追跡すると、光脱離による昼側の薄層と、影に延びる夜側の尾が予測される。昼側のH−角度分布はENAから借用し、夜側は一様角度を仮定する。尾は50 sで計算を止めた分布である。H−によるwakeやシースの再構成は、負イオンの反作用を含む計算で確かめる課題として残る。[@P000252]
  - '[@P000342]はTHEMIS-ARTEMISの長期観測から月近傍金属イオンの源を評価し、太陽活動より月位置への依存が強いことを示した。[@P000341]はMHD場と粒子追跡を組み合わせ、理想化した北向きIMFで月から地球の内側磁気圏へ戻る経路を計算した。局所の供給・存在量と大域輸送を分けて扱うことで、月起源の重イオンが地球環境へ及ぼす寄与を考えられる。'
- heading: 表面から戻る電子を起源ごとに選び分ける
  paragraphs:
  - '[@P000362]は酸素Auger電子の特徴を使って月面由来の光電子を識別し、光電子放出収率を制約した。[@P000363]はその識別法で後方散乱電子が優勢な事例を選び、表面から宇宙へ戻る割合を調べた。放出収率、散乱係数、観測される流束を結び付けることで、電位推定の入力となる電子電流を比較できる。'
  - Xuほか（2026）は、2011年8月–2025年1月のARTEMIS burstデータのうち昼側月面に磁気的に接続する上向き電子を、酸素Augerピークの傾き・流束とモデル相対差20%未満で選別した。ローブの光電子検出確率は太陽直下付近の約0.8からターミネータ付近の約0.2へ下がり、太陽風では夕側SZA 30–60°で約0.15に達する。これらは、反射・二次電子の背景下で光電子を識別できたと著者が報告する観測割合である。傾きの閾値は本文−0.25と図2の約−2.5が一致せず、実際の設定は未確定である。[@P000364]
- heading: 衝突噴出物の雲と、微小ダスト密度の上限
  paragraphs:
  - LDEXの個別衝突を解析した[@P000390]は、主に半径0.3 µm以上の粒子で明け方に偏る持続的な雲と流星群時の増加を捉えた。流入隕石モデルとの比較から衝突噴出物と解釈しており、衝突時に生じる電離電荷を、飛行中の粒子の正味電荷と混同しない。
  - '[@P000039]は同じLDEX観測の積分電流を使い、背景を差し引いた残差をダストと低エネルギーイオンに分けて考えた。半径0.1 µmを仮定し、各境界通過時の機体速度で換算した。残差をすべてダストとした上限は、日の出側で太陽風中約100
    m⁻³、磁気圏尾部約40 m⁻³となった。二つの解析は検出方式と粒径条件が異なり、独立観測の再現ではない。高度3–250 kmの制約を地表近傍の局所移動へ拡張するには、観測範囲を埋める測定が必要になる。'
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - Wieser et al.（2025）はChang’E-6のNILSで、着陸点近傍の月面に由来する50–400 eVの水素負イオンH−を検出した。反射陽子と同じ放出角分布を仮定した反射率2.5（−0.8、＋1.2）%、表面直上の体積数密度0.18（−0.03、＋0.04）cm⁻³（90%区間）と、昼側寿命70 msを使う等価スケールハイト約10 kmは、局所スペクトルからの推定である。[@P000253] Zhong et al.（2026）は同じ観測系列と解析コードを用い、6区間で200 eVから各区間の太陽風エネルギーまでの90%有意限界を超えるH−成分を比較し、フラックスと平均エネルギーが太陽風条件に正に相関することを示した。初報の2.5%収率を入力とする輸送計算では、昼側はENAの放出角分布、夜側は一様角度、月の影では光脱離なしと仮定し、薄い昼側層と50 sで計算を止めた夜側の尾を予測した。H−がwakeやシースを変える作用と水生成への寄与量は、負イオンの反作用と表面反応を含む別の検証を要する。[@P000252]
lineage:
- title: 粒子計測から表面電位を推定する
  steps:
  - paper_id: P000018
    title: 月面で荷電粒子を測る
    significance: Apollo 14のCPLEE装置と計測成果をまとめ、月面近傍のプラズマを読む基盤を作った。
  - paper_id: P000003
    title: 軌道上から日陰の負帯電を捉える
    significance: Lunar Prospectorの電子分布から、夜側月面が探査機より低い電位にあることを示した。
    connection: 現地の粒子計測から軌道上の推定へ
  - paper_id: P000025
    title: 入射電流と月面電位を対応付ける
    significance: 通常区間では探査機電位を補正して電流収支と照合した。SEP区間の約−4 kVは探査機電位未補正である。
    connection: 電位の基準を補正し電流収支と照合
- title: 光電子から昼側電位の変動を読む
  steps:
  - paper_id: P000051
    title: 地殻磁場と相対電位を対応付ける
    significance: 強い地殻磁場から来る光電子ほど負側の相対エネルギーずれを持つ統計的傾向を示し、静電減速を仮定すると磁化表面が相対的に正側となる解釈を支持した。地域間電位差はおおむねΔU≲10 Vの規模と推定され、Fe組成で二分しても磁場依存が残る。固定放出効率とエネルギーずれの縮退、未測定の探査機電位は明示的な限界である。
  - paper_id: P000162
    title: 太陽活動による正電位の変動を予測
    significance: ARTEMISと光電子モデルを照合し、フレア時の電流収支から正電位を予測した。
    connection: 場所の違いから太陽活動への応答へ
  - paper_id: P000161
    title: 日照とプラズマの依存を分ける
    significance: 別の放出モデルから昼側電位を推定し、天頂角・局所密度・温度への依存を調べた。観測範囲で地殻磁場への明瞭な依存は得られなかった。
    connection: 別モデルで環境依存を比較
- title: 月起源金属イオンの源から地球方向輸送へ
  steps:
  - paper_id: P000342
    title: 月近傍のイオン源を長期観測で評価
    significance: 月位置と太陽活動に対する生成・電離・流束の依存を調べた。
  - paper_id: P000341
    title: 地球磁気圏へ戻る経路を計算
    significance: MHD場での粒子追跡から北向きIMF条件の輸送経路を示した。
    connection: 局所の供給・環境依存から大域輸送のモデルへ
- title: 光電子の識別から、散乱電子と光電子の統計へ
  steps:
  - paper_id: P000362
    title: 酸素Auger電子で光電子を識別
    significance: 月面由来の光電子を選び、放出収率の下限とモデル依存の幅を求めた。
  - paper_id: P000363
    title: 表面での後方散乱と再衝突を分ける
    significance: 光電子の識別法を使って後方散乱電子が優勢な事例を選び、磁場の向きと表面脱出の関係を示した。
    connection: 光電子の特徴を、散乱電子との選別にも使う
  - paper_id: P000364
    title: 光電子の環境依存を統計化
    significance: 光電子が優勢な観測を集め、ローブ中と太陽風中の流束・検出確率を比べた。
    connection: 表面から戻る電子の選別を光電子集団の統計へ広げる
