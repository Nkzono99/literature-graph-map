- paper_id: P000225
  group: lunar
  role: 縦孔周囲の三次元粒子計算
  summary:
    question: 月の日照側にある深い縦孔では、鉛直壁が太陽風電子や光電子の流れを変えることで、孔底の電流収支と表面電位が孔外とどう異なるかを調べた。
    method: 太陽風プラズマ、光電子、帯電した月面の相互作用を三次元の粒子シミュレーション（PIC法）で計算し、数十メートル規模の縦孔内外の帯電を比較した。
    contribution: 壁への損失で太陽風電子の孔底への流入が減り、孔底と壁を結ぶ光電子電流が電流収支を変えると示した。日向と影の強い帯電差に加え、孔内外の日向同士にも電位差が生じた。
  evidence_by_item:
