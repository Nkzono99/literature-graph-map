- paper_id: P000413
  group: integrators
  role: dHybrid・陽解法と低密度域
  summary:
    question: 無質量電子hybridの陽解法を、低密度セルと大規模並列計算でどう安定させるか。
    method: イオンのBoris更新と磁場の二段Lax–Wendroff法を結ぶ三次元陽解法。線形安定条件から局所密度の下限を決め、電場評価時の安定化に用いる。
    contribution: 並列性能と太陽風中の膨張雲を示した。密度下限は最終手段で、粒子統計の不足、電子圧力の省略、実験との条件差を併せて検証する。
