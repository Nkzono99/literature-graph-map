- paper_id: P000197
  group: voids
  role: Mini-RFによる横方向の空洞候補
  summary:
    question: 静かの海にある縦孔が、地表の開口部とつながる地下通路を持つかを検討した。縦孔のレーダー反射に、地下空洞を示す証拠が含まれるかを問う。
    method: Lunar Reconnaissance Orbiter搭載のMini-RFが2010年に得た静かの海の縦孔のレーダー画像を解析し、反射が地下通路から生じる可能性を調べた。
    contribution: 縦孔からの反射の一部は、長さが数十メートルの地下通路で説明できるとした。縦孔が地下空洞への入口であることを示すレーダー証拠を提示した。
