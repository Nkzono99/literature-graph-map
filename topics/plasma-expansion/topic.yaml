  role: 極域クレーターのミニウェイク
  summary:
    question: 極域クレーターによる膨張は、上流のシースと底面での吸収によって自己相似ウェイクからどう変わるか。
    method: SPISの三次元静電hybrid PICで、イオンを粒子、電子をBoltzmann関係で閉じた質量なし流体として扱い、陰的な非線形Poisson方程式を解く。直径1.2
      km、光電子・二次電子放出を省いた6条件を20 s計算する。
    contribution: 標準条件で余剰電子を伴うイオン空乏域と約−60 Vの準平衡電位、底から100 mの下降フラックス約4%、壁法線フラックス約18%を示した。上流のシース擾乱と約±40
      km s−1の横方向流れを三次元で捉えた。
