- paper_id: P000028
  group: removal
  role: 透明EDSによる真空中の太陽電池電圧回復
  summary:
    question: 高真空中で模擬月ダストの付着により低下した太陽電池電圧を、透明な電気力学的ダストシールド（EDS）で回復させられるか。
    method: 透明ITOのらせん電極をガラス上に設け、三相矩形波で駆動する。約10⁻⁶ kPaで50–75 µmのJSC-1Aを約20 mgずつ散布し、電極のない領域を覆った市販セルの電圧を無散布の基準と比較した。
    contribution: 4種類の電極間隔で、散布後に基準の11.0–22.5%まで低下した電圧がEDS作動後91.6–99.4%へ回復した。透明電極による真空中の除塵を太陽電池の電圧回復で示した。
