review:
- heading: クレーター台帳が、表面の履歴を比較する基盤になる
  paragraphs:
  - '[@P000187]はクレーターのサイズ別頻度を月の年代尺度へ結び付ける。LOLAによる大型クレーターの全球分布[@P000188]に対し、[@P000191]は1〜2 km以上を網羅する台帳を作り、小径側の地域差も比較できるようにした。'
- heading: 新しい衝突と二次クレーターを見分ける
  paragraphs:
  - '[@P000189]は同じ場所の時系列画像から新しい衝突と表層の変化を調べる。一方、[@P000190]は一次衝突から飛び出した岩塊が作る二次クレーターを対象とし、岩塊の大きさと放出速度の関係を評価した。年代推定に使う個数には、地形の更新と二次衝突の両方が影響する。'
- heading: 形成直後の衝突を、地形と熱の両方で追う
  paragraphs:
  - 時系列観測[@P000189]を個別の衝突へ絞った[@P000283]は、2024年春に形成された直径222 mのMcGetchinクレーターを捉えた。同じ場所を熱赤外で調べた[@P000284]は、幅約7
    kmの低温域から浅部レゴリスの締まりが緩んだ可能性を示す。地形の変化と熱物性の変化を重ねることで、衝突点から離れた表層更新も追える。
  - 長い時間にわたる衝突は、物質の組成と地下の空隙も変える。Chang'e-6のNi同位体[@P000286]とChang'e-5の二次鉱物[@P000287]は蒸発・再凝縮を調べ、GRAILの密度推定[@P000301]は破砕と堆積が残す多孔質な浅部地殻を扱う。
- heading: 中央丘と環の形成を、崩壊モデルで説明する
  paragraphs:
  - '[@P000306]は盆地内部の環状の峰、ピークリングについて、壁の内向きの崩壊と中央隆起が相互作用する仮説を観測と比べた。[@P000298]は音響流動化の条件を変え、中央丘から環へ移る直径と最終的な深さを調べる。遷移径を再現できても峰や環の直径には過大評価が残り、複数の形状指標を同時に比べる必要がある。'
  - より大きなOrientaleを扱う[@P000307]では、深部の流動と正断層が外側の環を作る。ピークリングの形成と多重リングの形成を区別して読むと、衝突規模や月内部の温度が地形へ与える影響を整理できる。
