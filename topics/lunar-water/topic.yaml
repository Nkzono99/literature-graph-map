- paper_id: P000142
  group: formation-storage
  role: 注入水素の保持と衝突加熱による水放出
  summary:
    question: 太陽風由来の水素を保持する無水ケイ酸塩から、水は注入だけで放出されるのか、微小衝突を模した短時間加熱を要するのか。
    method: San Carlosかんらん石へ10 Kで5 keVのD₂⁺を注入し、300 Kまでの昇温脱離と、基底10/300 Kから約1,400 Kに達するCO₂レーザー熱パルスを比較する。気相をEI-QMS、処理後の穴とリムをSEM/TEM・VEELSで調べ、注入なし対照を置く。
    contribution: 注入と300 Kまでの昇温だけでは気相D₂Oを検出せず、熱パルス時には注入由来D₂Oが放出される経路を支持した。300 Kまで残る水または前駆体と、穴を伴う非晶質リムを示し、水素保持と衝突加熱による放出を結び付けた。
