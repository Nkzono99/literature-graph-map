- paper_id: P000236
  group: collection
  role: 星間粒子の衝突帯電
  summary:
    question: 電子・イオンの接近で生じる静電分極を考慮すると、小さな星間ダストの衝突帯電速度と電荷分布はどう変わり、暗黒雲のイオン再結合にどう寄与するか。
    method: 分極を含む球状粒子の捕獲断面積を導き、熱速度分布で平均して衝突率を計算した。紫外線による光電子放出を省いて電荷分布を求め、MRN粒径分布で再結合率を評価した。
    contribution: 粒子の電荷が小さいと分極が帯電速度を大きく変えることを示した。微小粒子まで延ばしたMRN粒径分布では、暗黒雲の低電離条件で粒子表面の金属イオン再結合が放射再結合を上回りうる。
  evidence_by_item:
    question:
    - paper_id: P000236
      version_id: V1
