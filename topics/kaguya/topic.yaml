- paper_id: P000173
  group: geology
  role: SPによるかんらん石と深部物質の候補
  summary:
    question: 月面のかんらん石露出はどこに分布し、その一部が衝突盆地が形成された際に掘り出されたマントル物質である可能性はあるか。全球分布と起源を調べた。
    method: かぐや搭載のスペクトルプロファイラで月面を全球調査し、反射スペクトルからかんらん石の露出を探した。放射伝達モデルで盆地周辺の露出物の起源を検討した。
    contribution: 地殻の薄い南極エイトケン、雨の海、モスクワの海の各盆地周辺に多くの露出を見いだした。一部は上部マントル起源と示唆されるが、マグネシウムに富む下部地殻の深成岩起源も候補に残る。
  evidence_by_item:
    question:
    - paper_id: P000173
      version_id: V1
      url: https://www.nature.com/articles/ngeo897
      source_type: abstract
      locator: Abstract 第1文（月マントル組成・構造・進化の制約不足）、第4–7文（全球調査と起源）
      checked_at: '2026-10-06'
    method:
    - paper_id: P000173
      version_id: V1
      url: https://www.nature.com/articles/ngeo897
      source_type: abstract
      locator: Abstract 第4文（Spectral Profiler による月面全球調査）、第7文（radiative transfer modelling）
      checked_at: '2026-10-06'
    contribution:
    - paper_id: P000173
      version_id: V1
      url: https://www.nature.com/articles/ngeo897
      source_type: abstract
      locator: Abstract 第5–7文（South Pole-Aitken、Imbrium、Moscoviense 盆地周辺の露出、二つの起源候補、一部の上部マントル起源）
      checked_at: '2026-10-06'
  inspection:
    level: abstract
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-06'
    recheck: false
- paper_id: P000174
  group: geology
  role: SPアーカイブによるイルメナイト分布
  summary:
    question: 月面でイルメナイトに富むスペクトルを示す領域はどこに分布し、どのような地質や火砕堆積物と結びつくのかを調べた。
    method: かぐやのスペクトルプロファイラ（SP）データから、1・2 µm帯のイルメナイト特有の反射特徴を持つ地点を抽出した。多波長画像と地形モデルで各地点の地質を調べた。
    contribution: 該当領域は月表側の衝突盆地周縁に集中し、多くが高地を覆う火砕堆積物にあった。長石質高地や南極エイトケン盆地では検出されず、TiO₂に富む海の玄武岩の分布とも一致しなかった。
  evidence_by_item:
