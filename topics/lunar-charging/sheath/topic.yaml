schema_version: 1
topic_id: lunar-charging-sheath
title: 月面の電流収支・光電子シース
question: 月面の電位と、その上に広がる光電子シースを決める電流・材料特性・プラズマ条件。
review:
- heading: 電流の釣り合いと電子放出
  paragraphs:
  - '[@P000002]の電流収支は、プラズマの電子・イオンが運ぶ電荷と、光電子・二次電子として出ていく電荷を釣り合わせる。放出特性を測る[@P000001]と、月面電場やシースを整理する[@P000020]を併せて読むと、材料特性から表面電位へ進む筋道が分かる。'
  - '[@P000020]は、観測で推定した地表電位を遮蔽長で割ってシース電場の規模を整理した。昼側の+10 Vと有効遮蔽長1 mは約10 V/mと整合し、終端では約10 mを仮定して内向き約1～10 V/mを見積もる。終端イオンシースの模式図にはλD≫10 mと記され、遠夜側の約100 mと約1 V/mは推測に残る。この整理から、後続のシース研究では電位分布と有効遮蔽長をどの粒子集団が決めるかが課題になる。'
  - 磁気圏ローブ中の昼側について、[@P000162]は太陽活動に応じた放出電流から電位を予測し、[@P000161]は観測光電子のエネルギーずれから電位を推定する。放出モデルと観測を往復して電流収支を調べる研究として読める。
  - 電流収支を入力条件ごとに調べたStubbs et al. (2014) では、光放出電流JP0の増加が光電子密度を増やしてDebye長を短くし、表面電場を電位以上に強める。JP0を固定した光電子温度Tpの変化では電位とDebye長がともに増え、ゼロ電位角は変わらないが、光電子密度np0を固定すれば放出電流も変わり、この不変性は成り立たない。さらに非単調PICとの著者比較では、単調モデルの電位は周囲プラズマ基準の表面電位より電位障壁差に近かった。[@P000038]
- heading: 単一の表面電位から、空間構造へ
  paragraphs:
  - 表面から出た電子の一部は電場で引き戻され、シースに電位の極小が生じる場合がある。[@P000007]はPICで光電子とダストの運動を追い、[@P000030]はUVで作るシースを実験的に調べた。磁気圏尾部では、Lunar Prospectorを使う[@P000033]とARTEMISを使う[@P000036]が非単調な電位構造を論じている。太陽風電子の流れを含む半解析モデルは[@P000011]に進める。
  - Lunar Prospectorによる非単調シースの議論に続き、[@P000036]はARTEMIS P1の電子だけでなくイオン温度も用いて、磁気圏尾部の日照側シースを一次元PICと照合した。イオン温度を上げると電位極小への落差が浅くなり、電子温度が低下してTi/Teが臨界比を超える時間帯には冷たいビームが消える。残る低エネルギーの上向きフラックス、探査機電位による汚染範囲、初期時間帯の予測との差も比較条件に含める。
  - シース内を動く粒子には、場所ごとの電場と電子・イオン電流が同時に効く。[@P000167]は帯電と軌道を連成し、希薄な条件では電子1個ずつの出入りが運動を変えることを示した。
  - シース内の力をダスト輸送へ結び付ける際には、表面から離れるまでの接触も条件になる。[@P000256]の総説はレゴリスの力学と帯電・運動を横断し、離脱時の電荷分布と微小粒子の実験を課題として整理した。シースが与える電場と、粒子を保持する力を対応させるための入口となる。
  - 電子・光電子の速度分布に加え、イオンの熱圧力と境界から入る速度も電流収支・遮蔽を変える。Sana（2026）はMaxwell分布の電子と一次元定常イオン流を連立し、法線入射速度がBohm速度を十分上回るθ=40°・60°では温度効果が小さく、θ=80°では低温側に電位の初期低下、θ=85°では負の電位極小と光電子障壁の弱化が生じることを示した。さらに、シース端のBohm条件を満たしても正電位層に実数のイオン解がない場合を指摘し、通過条件に合わせた境界速度の修正を提案した。[@P000055]
- heading: 実験の光電子シースを計算と照合する
  paragraphs:
  - '[@P000030]は2010年の会議要旨として参照する。真空中の金属面で作るモデル実験と月面の粒子・材料条件の違いを踏まえ、月面シース計算の比較対象を選ぶ。'
  - Dove et al. (2012)の真空・金属面実験は、放出電子の返還と別の放出面から来る電子が、光電子層の密度を変えることを示した。負のグリッドに対する浮遊面の電位は約+1.5 Vへ近づき、二面からの電子を含む1D PICが密度分布を概ね再現する。外部の太陽風プラズマやレゴリスを含む月面条件への値の移行には条件差があり、この論文では電位極小やダスト浮上を直接測っていない。[@P000092]
- heading: 電流収支へ入れる放出・散乱特性を観測で制約する
  paragraphs:
  - 光電子電流を計算するには、入射光子1個から何個の電子が出るかを知る必要がある。[@P000362]はARTEMISと太陽放射モデルから収率の下限を求めたが、放出電子のエネルギー分布の仮定による幅も示した。[@P000363]は後方散乱電子の表面への再衝突を扱った。表面で生成された量と、シースや磁場を通って観測点へ届く量の対応が、電流収支の比較条件になる。
  - Xuほか（2026）の光電子統計は、電位補正した表面流束が太陽照射に従い、識別可能性が降下電子によって抑えられることを示す。約500 eV Auger電子と100 eV電子の流束を用いる際は、EFIの宇宙機電位と同伴論文からの月面電位補正を区別する必要がある。数密度やシース厚を直接与える結果ではなく、昼側電流収支・電位モデルへつながる観測制約として利用する。傾きの選別閾値は本文と図2で一致せず、実際の設定は未確定である。 [@P000364]
lineage:
- title: 放出測定から電位分布へ
  steps:
  - paper_id: P000001
    title: 月試料の光電子放出を測る
    significance: 放出収率とエネルギー分布を測り、材料の特性から月面上の光電子シースを考えた。
  - paper_id: P000002
    title: 放出と流入を電流収支にまとめる
    significance: 光電子・二次電子と周囲のプラズマを組み合わせ、昼夜の電位を同じ枠組みで扱った。
    connection: 材料の特性から環境ごとの帯電へ
  - paper_id: P000007
    title: 電子分布と粒子運動を直接追う
    significance: PICで光電子シースを解き、時間変化する帯電がダストの運動に与える影響を調べた。
    connection: 表面の収支から空間・時間の分布へ
- title: 実験・観測と計算を対応させる
  steps:
  - paper_id: P000030
    title: 光電子シースを実験室で測る
    significance: UVで電子を放出させ、面の近傍の電気的構造を調べる実験系を示した。
  - paper_id: P000092
    title: 金属面の実験をPICと比較する
    significance: バイアスによる密度分布の変化を、表面へ戻る電子とグリッド由来電子を含むPICで概ね再現した。浮遊電位は負グリッドに対して約+1.5 Vで、シース電位極小の直接測定は未達だった。
    connection: 会議要旨に対し、実験・PIC比較の雑誌論文を加える
  - paper_id: P000036
    title: 月周回の電子分布をPICと比べる
    significance: ARTEMISとPICから非単調な電位構造を調べ、イオン温度の影響も示した。
    connection: 室内の測定から月周回観測へ
  - paper_id: P000011
    title: 太陽風の流れを半解析解へ
    significance: 太陽風電子の流れを含むシースを半解析モデルで記述し、電子分布を変えたPIC計算との対応を示した。
    connection: 観測・PICで扱う構造をモデル化
- title: 光電子の識別から、散乱電子と光電子の統計へ
  steps:
  - paper_id: P000362
    title: 酸素Auger電子で光電子を識別
    significance: 月面由来の光電子を選び、放出収率の下限とモデル依存の幅を求めた。
  - paper_id: P000363
    title: 表面での後方散乱と再衝突を分ける
    significance: 光電子の識別法を使って後方散乱電子が優勢な事例を選び、磁場の向きと表面脱出の関係を示した。
    connection: 光電子の特徴を、散乱電子との選別にも使う
  - paper_id: P000364
    title: 光電子の環境依存を統計化
    significance: 光電子が優勢な観測を集め、ローブ中と太陽風中の流束・検出確率を比べた。
    connection: 表面から戻る電子の選別を光電子集団の統計へ広げる
