  limitations:
  - 新しい一覧の各文献は要旨確認。本文全体・全図表は未精読。
  - 原理と解釈はHalekas (2008)とTsai (2026)の公開本文の該当節も参照。
  - 網羅性は保証しない。測定値・モデル結果・将来計画は区別して記載。
  - Paperpile登録結果と検索ログはリポジトリ外で保管。同期の確認とは区別する。
  - 'Issue #23の追加文献は要旨・Plain Language Summaryで確認。本文全体と全図表は未精読。'
  - P000363は§4のエネルギー範囲と光電子補正・散乱モデルの条件のみ本文で追加確認。inspectionは要旨確認のままとし、本文全体・全図表の精読は未実施。
  - 2026-10-07の差分調査は先行調査の候補を一次資料へ戻して確認したもの。Scopus・Web of Science等の全件検索や、2026年までの網羅的な引用追跡は未実施。
  - 材料・ナノ構造計測の同名手法は対象外。会議予稿は今回選んだ査読版で代表させ、教科書・全装置論文の網羅的追加は行っていない。
  - 未解決課題は確認した論文の適用条件と不確かさから整理した研究方向。「多エネルギー解析・不確かさ評価・統一逆解析の先行研究が存在しない」とは判定しない。
  - 追加項目は原則要旨確認。P000379・P000381・P000384の方法と関係は公開本文の該当箇所も確認。P000385の要旨はCrossrefの出版社登録内容を使用。
  changes: '電子反射法を中心とする新テーマを作成。新規15文献と既存8文献を整理し、関連テーマへ接続。 Issue #23の電子放出・後方散乱研究を追加し、概説と必要な系譜を補足。
    Issue #26の差分として新規8文献・既存3文献を追加。装置、夜側電位尺度、極端な帯電、火星熱圏密度・磁場接続、系譜と出典付き関係を拡張。'
  publication_status: draft
