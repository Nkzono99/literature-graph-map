- paper_id: P000298
  group: formation
  role: 中央丘からピークリングへの遷移計算
  summary:
    question: 複雑クレーターの中央丘はどの条件で環状の峰へ移るか。
    method: SALEc-2Dで音響流動化モデルのパラメータを変え、350ケースの衝突・崩壊を計算する。
