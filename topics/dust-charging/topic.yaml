- id: emission-yield
  title: 月試料・模擬土の電子放出を測る条件
  note: 粉体層の試料電流から求める収率と、孤立粒子の電荷変化から逆算する収率は定義が異なる。放出成分の定義、粒子電位による再捕捉、入射電子数の推定条件を比較する。
  axes:
