- paper_id: P000041
  group: environment
  role: 光電子と太陽光子の対応、および一事例の正電位制約
  summary:
    question: ローブ中の近い太陽直下・弱地殻磁場域で、観測した高エネルギー光電子の強度は太陽光子流束とどう対応するか。
    method: 2011年7月～2016年9月の2機のARTEMISから8条件で829スペクトルを選び、観測80–300 eV上向き電子と60秒分解能FISMの1–5
      nm光子を比較。一事例はイオン反射でUMを独立制約した。
    contribution: 相関係数0.77、平均電子／光子流束比5.0×10⁻³（2標準偏差1.6×10⁻³）を得た。毎回のUMが得られない統計と、一事例の+15～25
      Vの観測制約を分けて示す。
