- paper_id: P000269
  group: transport
  role: 太陽系ダストプラズマの電荷変動と散逸
  summary:
    question: 月・水星・彗星などの周辺で、ダストの電荷変動が運動の減衰や加速をどう生み、粒子の集合がどの条件で結晶状に秩序化するかを整理する。
    method: 既往の理論研究をレビューし、粒子の運動と帯電を結ぶモデル、暗所での電荷揺らぎの運動論、粒子間相互作用と熱運動の比や相図から、各環境を比較する。
    contribution: 帯電に伴う振動の減衰と、暗所の十分小さな月ダストが電荷揺らぎで脱出し得ることを、理論研究から整理した。彗星核近傍の結晶形成も条件上可能とするが、実験と理論の検証が必要としている。
