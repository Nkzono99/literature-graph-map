- paper_id: P000302
  group: in-situ
  role: 空洞を調べる常時微動探査の比較
  summary:
    question: 月の常時微動から溶岩チューブの存在と寸法を推定できるか。
    method: Marius Hillsを含む二次元浅部モデルで、地震波干渉法、水平・鉛直スペクトル比、分布型音響計測、回転計測を比較する。
    contribution: 空洞と天井厚への感度を示したが、底部深度の制約は難しかった。深さ10 mを超える構造には、通常の熱月震より低い1 Hz未満の振動源が必要となる。
