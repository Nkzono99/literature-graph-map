- paper_id: P000126
  group: electric-field
  role: 対称な二電極の電位差測定とバイアス設計の基礎
  summary:
    question: 同じ二点の電位差から弱い磁気圏電場を推定するために、電極の非対称性、負荷、運動電場補正、プラズマ不均一性をどこまで抑える必要があるか。
    method: Maxwellプラズマ中の球形プローブの電流収支を近似し、二電極の負荷・立体角遮蔽・熱雑音からR・r・dの最小寸法を計算。中央電極でV≈0へ保つ三電極系と比較し、回転、有限シース、密度・温度・高エネルギー粒子束の不均一性を検討した。
    contribution: 同一電極の共通浮遊電位を差電位で相殺する設計原則を定量化し、バイアスは測定球の寸法と速度感度を下げても装置全体を大きくし、プラズマ勾配と表面パッチの誤差が残ることを示した。刊行版の計算は理想化した桁の見積もりである。
