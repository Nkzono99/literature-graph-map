schema_version: 1
topic_id: lunar-exosphere
title: 月の外圏・表面からの粒子放出
question: 表面散乱・スパッタと人工排気は、月の希薄な外圏の種別・空間・時間変化をどう作るか。
synopsis:
- 月の外圏は、表面から放出された粒子の飛行、再吸着、散逸によって作られる。スパッタの寄与は元素と高度で異なり、地表近くの全密度への寄与が小さくても、難揮発性種や高高度では重要になり得る（[@P000445]）。
- 放出源を決める研究は、イオン種・電荷状態ごとの照射実験から、実月試料の粗さ・空隙（[@P000441]）、負イオン観測による散乱・スパッタの逆推定（[@P000440]）へ広がる。地殻磁場による太陽風の再配分と、CMEの組成変化は、外圏に場所と時間の変化を加える（[@P000442]・[@P000443]）。
- 探査機の排気も揮発性物質の供給源で、全球移動と永久影への堆積が計算されている（[@P000468]）。観測を解釈するには、自然・人工の供給源を分け、実験収率の条件と吸着・脱離のモデルを同じ輸送の問題へ対応させる必要がある。
review:
- heading: 表面からの放出を、種と高度で分ける
  paragraphs:
  - 月の外圏は粒子同士の衝突が少なく、表面から放出された粒子の軌道と再吸着・損失が分布を決める。[@P000445]は表面組成からスパッタ起源の中性外圏を計算し、観測上限と比較した。地表付近の全外圏への寄与が小さくても、難揮発性の種や高高度では相対的に重要になり得る。全外圏の密度と、特定種を供給する過程は異なる問いとして扱う。
  - "[@P000445]は四種類の月土壌と陽子95%・α粒子5%の太陽風から元素別スパッタ収率を求め、空隙率50%で中性外圏の高度分布を計算した。太陽直下点の450–670 km/sの三ケースでは、計算元素の合計表面密度は約10^7 m−3と昼側全種の引用値約10^12 m−3より小さい。多くの元素は観測上限内だが、Caは5σ上限1 cm−3程度または超過し、とくに高地土壌で空間積分観測との条件差が残る。400 Kの熱放出とKreep土壌の比較では数千km以上でスパッタ成分の相対的重要性が増すが、H・H2・Heと豊富なCH4・OHは例外となり、OHには観測上限を入力している。 Fig.4のスパッタ条件は670 km/s・fp=2.85×10^12 m−2 s−1で、本文の第三ケースとはフラックス値が異なる。"
  - "[@P000513]は、外気圏Na/Kの光電離と、月面PSD・太陽風スパッタリングから生じるイオンを試験粒子として追跡した。太陽風400 km/s・IMF 5 nTを直交させた定常場では、高度100 kmのx–z面軌道のほぼ四分の一周でNa+約10^4 cm⁻² s⁻¹が見込まれ、天頂角30°の点では狭い表面源ピークと低エネルギー側に広がる外気圏源を区別できる。ただし表面PSDとスパッタリングのスペクトルは同じで、アルカリの組成逆算にはPSD寄与の見積もりが必要になる。1分積算の地表分解能は約100 kmで、強い磁場揺動による方向・エネルギーの混合と二次イオン収率のmatrix effect校正が定量化を制約する。 本文の加速度・飛行時間・計数には未解消の数値差や表記の曖昧さが残る（PDF pp.4,6–7）。"
  - "[@P000514]は、外気圏中性粒子が光電離して月面へ戻り、新しい中性粒子を放出する自己スパッタを粒子追跡で推定した。太陽風B=10 nT・対流速度450 km/sでは昼側平均8×10^9 m−2 s−1、プラズマシート50 km/s・表面電位−500 Vでは2.5×10^9 m−2 s−1となる。北向き対流電場の例では局所最大がそれぞれ1.8×10^11、1.2×10^11 m−2 s−1に達し、等方微隕石生成5×10^10 m−2 s−1を上回る。集中する地域は磁場方向・旋回半径・表面電位に依存する。中性密度・温度とNi標的収率を仮定したモデルであり、影クレーターやCME後の持続は今後の検証課題として示す。 Sの入力行と平均規約に未解決事項が残る。"
- heading: 収率を、入射イオンと表面構造へ対応させる
  paragraphs:
  - "[@P000444]は陽子と単価・多価Arによる模擬物の予備測定を行い、重イオンの相対効率を調べた。[@P000441]は実月試料と三次元侵食計算を組み合わせ、粗さ・空隙による収率抑制を示す。さらに[@P000460]は微小衝突後の部位別結合エネルギーから選択的スパッタを計算し、鉄保持とナノ鉄形成を論じた。組成、電荷状態、表面幾何、衝突履歴をそろえることが、実験収率を外圏モデルへ移す条件となる。"
  - "[@P000441]はApollo 16土由来の薄膜・圧粉体実験で補正した3次元計算から、1 keV/amuのH・Heに対する空隙率約0.8のレゴリスの角度範囲平均収率を、それぞれ7.3×10⁻³、7.6×10⁻² atoms/ionと推定した。緩い粉体の直接測定ではないが、平坦面の材料収率の補正と粗さ・空隙による角度依存の平坦化を分けて外圏供給率を制約する。Hの45°ではSRIM平坦面値がこの多孔質推定の8.2倍となる。Methodsの68051と他箇所の68501の試料番号相違は未解決。"
  - "[@P000440]は約300 km/sの太陽風下のChang’e-6/NILS負水素イオンに、散乱・スパッタ・負イオン化を分けた半解析モデルを適用した。全電荷状態の散乱収率のMAPは22.2%、陽子による水素スパッタは8.13%だが、比の68% HDIは0.369–3.00と広い。11 eV以上の中性水素アルベドを事前制約に使い、低エネルギー成分と未観測の後方角度を補って全角収率を推定するため、閾値つきENAアルベドと全放出収率を区別して比較する必要がある。要点はarXiv:2602.16567v1原稿に基づく。"
  - "[@P000460]はFe2SiO4への12 km/s・45°衝突で求めた部位別結合エネルギーをTRIMへ与え、1 keV H+による総収率が床0.01590、噴出物0.04820 atoms/ionとなることを示した。放出Fe比は全四部位で初期Fe原子分率2/7を下回り、元素分別を通じたFeの相対濃集を示唆する。衝突後の地表状態を放出源の条件として扱う研究であり、外圏密度や脱出率自体は計算していない。"
- heading: 地殻磁場と太陽風変動が、放出源の分布を変える
  paragraphs:
  - '[@P000442]はかぐやの太陽風反射と磁場地図から放出源の空間分布を作り、中性外圏の非等方性を計算した。[@P000443]はCMEで重イオン組成が変わる場合を扱い、対象元素の外圏量が急増する応答を示した。前者は場所による入射の再配分、後者は時間とイオン種の変化を加える。収率の材料依存と、月面へ届く流束の環境依存を結び付けて比較する。'
  - "[@P000442]は反射率・地表磁場から太陽風の到達エネルギーを推定し、種別スパッタ源を弾道外圏モデルへつないだ。新月・250 km/s・alpha含有1%では異常域の合計源が1桁超低下し、Figure 4の新月・250 km/s・alpha/p=0.01では低高度のスパッタ中性酸素密度もほぼ1桁低下する。高度100 kmの極軌道にも南北差が残り、高高度では局所構造がなめらかになる。450 km/s・alpha 5%ではalphaの減速が収率を上げる領域があるが、南半球の合計源は50%超低下する。いずれも条件付きのモデル予測で、加熱や多価重イオンは含めない。"
- heading: 着陸機も、人工的な揮発性物質の放出源になる
  paragraphs:
  - "[@P000467]は球形月・中心重力・無衝突の中性粒子モデルを用い、Maxwell速度分布と等方放出角から水分子の初回ホップを計算した。380 Kでは脱出割合4.14×10⁻⁵%、初回沈着の50%と98%が大円角距離2.3°と18.7°以内となる。Apollo 17の降下経路に沿う直接沈着図も示すが、再放出の温度と表面滞在時間は別途必要で、局所大気の減衰待機時間は確定していない。Table 3の百分率の分母は本文に明記されていない。1800 Kでは7.66%が脱出するため、98%沈着を全放出量の98%が月面に戻るという意味には取れない。非脱出分への正規化などの可能性は未解決として残す。要点は会議稿に基づく。CFD元データとコードの詳細は本文からは確定できない。"
  - "[@P000468]は、南緯70度・月地方時7時の嫦娥3号級仮想着陸で、155秒間に約43 kgの水を放出する移動源DSMCを計算した。脱離エネルギー0.5/0.7 eVによって初期の気相密度と堆積が変わり、2月日後にも約10–30%が主に一時吸着として残る。弱い吸着条件では約7%が脱出し、強い吸着では脱出がほぼ抑えられる。吸着水の光破壊を除外し、水以外の排気種を省く条件での結果であり、近傍の衝突効果は過小評価される。要点はNASA Public Access著者原稿に基づく。"
lineage:
