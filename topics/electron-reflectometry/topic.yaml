- paper_id: P000381
  group: mars
  role: 電子反射を熱圏中性密度の推定へ拡張
  summary:
    question: 電子の大気吸収から火星夜側の中性密度を推定できるか。
    method: 既知の強い地殻磁場を用い、116・191・313 eVのロスコーンを、装置の角度ビンに畳み込んだ輸送モデルで当てはめる。
    contribution: 南半球の限られた領域で高度約160〜230 kmの密度と季節変動を求めた。χ²の誤差楕円体で密度の上下限を評価し、組成・温度の個別推定には縮退が残るとした。
