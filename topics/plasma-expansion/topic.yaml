- paper_id: P000097
  group: grain-wakes
  role: 低速流中の粒子間力
  summary:
    question: 音速より十分遅いイオン流で、単粒子ウェイクの振動・正電位ピークと、二粒子の横方向整列力はどこで失われるか。電位勾配による力の推定は衝突・非線形条件でも成り立つか。
    method: 電子Boltzmann応答・イオンPICの三次元COPTICで、温度比Te/Ti=100、Q̄=-0.02/-0.2、非衝突および荷電交換τ=1.3λDe/csを比較。等電荷二粒子を原点と(0.5,0,1)λDeに置き、球面の全運動量流束から横力を求め、単粒子ウェイクの電位勾配と比較。
    contribution: M≈0.3以下で正電位ピークと整列力が概ね弱まることを示し、近線形では単粒子電位勾配による力の推定を支持した。非線形・衝突ありではM=0.1にも音速時の約1割の引力が残り、電位勾配だけの推定と符号まで食い違う。
