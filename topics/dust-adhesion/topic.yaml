  role: 凝集・重力・震動を含む離脱閾値
  summary:
    question: 重力、粒子間の凝集、地表の震動を含めると、静電的な接触解除と打ち上げの条件はどう変わるか。
    method: 球と平面の接触にvan der Waals凝集と重力を与え、接触中の平均電荷をQ＝ε₀Eπr²と近似して、月・Eros・Itokawaで必要電場と初期加速度・速度を計算した。
    contribution: 小粒子側の凝集と大粒子側の重力が閾値を上げ、中間半径で必要電場が最小になる。震動による接触解除と上向き加速度を伴う打ち上げは異なる。閾値は電荷配分・接触・清浄度の仮定に依存し、月面粒子の電荷や離脱を測った値ではない。
