schema_version: 1
topic_id: plasma-sheaths
title: シース・表面帯電の基礎
question: 表面への粒子捕集と電子放出が、電位・電流・周囲のシースをどう決めるか。
review:
- heading: 電位と流入電流を一緒に考える
  paragraphs:
  - プラズマ中の表面には電子とイオンが流れ込み、光や粒子衝突を受けた表面からは電子が出ていく。その差で表面電位が変わり、電位が変わると次に到達できる粒子も変わる。[@P000086]は、この電流収支を宇宙機からダストまで共通する帯電の枠組みとして整理した。周囲に生じる電荷の偏った層がシースであり、[@P000085]では電位分布、粒子密度、表面電流を求める流体・運動論モデルをたどれる。
  - シースの外側では、より緩やかな密度・電位変化が粒子を加速する。このプレシースとシースの接続を扱うのがBohm条件である。[@P000087]は速度分布を含めた条件を比較し、電子の分布がイオンの流入速度にも効くことを示した。正にバイアスした小さな電極を扱う[@P000088]へ進むと、電子を加速する圧力勾配と、電子シースを取り巻く広いプレシースが問題になる。
- heading: 電子放出が電位分布を組み替える
  paragraphs:
  - 電子放出は、表面に流入する電子電流を相殺するとともに、周囲の電子密度を増やす。放出が強くなると、放出電子を表面へ戻す電位の極小が現れ、さらに条件が変わると表面が周囲より正になる逆シースへ移る。[@P000093]はこれらの電位構造を実験で測定した。どの状態になるかを比べる際は、放出率に加え、周囲と放出電子の温度をそろえて読むとよい。
  - '[@P000089]は放出電子の温度を含む運動論をPICと熱電子放出実験で検証し、両者の電子温度が近づくとシース電位差が小さくなることを示した。材料側の条件を見るには、窒化ホウ素壁の電位分布を調べた[@P000090]が参考になる。二次電子を計算の境界条件として与える際は、放出率とエネルギー分布を確率的に扱う[@P000091]が出発点になる。'
- heading: 光電子シースを実験から月面へつなぐ
  paragraphs:
  - 日照面ではUVによる光電子放出が加わる。[@P000092]は真空中の金属面を照らして光電子層を作り、電子密度の分布を一次元PICと比較した。月面の平坦な日照面を扱う[@P000007]では、光電子シースとその中のダスト運動を計算している。[@P000011]は太陽風電子の流れを半解析モデルに含め、PICとの比較や電子分布を変えた計算へ進む。実験の照射・材料条件と、月面のプラズマ・放出条件を対応させると、同じシースの議論を両者で参照しやすい。
- heading: 平面から小さな粒子へ
  paragraphs:
  - 球状ダストでは、電位によって曲がる粒子軌道が捕集電流を決める。[@P000094]は、電子を放出しない静止球について、軌道運動制限（OML）理論とPICを比較した。粒径とDebye長の比を変え、電荷、捕集電流、エネルギー流束を別々に評価している。表面電位から電荷を求めたい場合と、材料への粒子流入を求めたい場合では、参照する量を分けて読むと使いやすい。
  - 月面の光電子シース中を動く粒子へ進むと、[@P000167]は位置と電荷を連成して追跡する。非Maxwell型の電子分布を含め、電荷を連続量で扱う場合と電子1個ずつの出入りで扱う場合を比較し、希薄な条件で軌道や浮遊の成立が変わることを示した。
lineage:
- title: 放出電子とシース電位
  steps:
  - paper_id: P000089
    title: 放出電子の温度を理論に入れる
    significance: 放出電子と周囲の電子の温度比が、シース電位差を小さくする条件を示した。
  - paper_id: P000090
    title: 材料の二次電子放出と照合
    significance: 窒化ホウ素壁の電位分布を測り、高エネルギー電子を含む条件で運動論モデルを調べた。
    connection: 熱電子放出から二次電子放出へ
  - paper_id: P000093
    title: 逆シースまでの電位構造を測る
    significance: 電子放出を増やしたときの電位分布の変化を実験で捉え、複数のシース状態を対応付けた。
    connection: 放出量に伴う状態変化へ
- title: 月面の光電子シース
  steps:
  - paper_id: P000007
    title: 光電子の分布をPICで追う
    significance: 平坦な日照面の電子分布を解き、電位構造と帯電粒子の運動を結び付けた。
  - paper_id: P000092
    title: UV照射実験と粒子計算を結ぶ
    significance: 金属面から放出した光電子の密度分布を測り、一次元PICと比較できる実験系を作った。
    connection: 粒子計算を実験室で調べる
  - paper_id: P000011
    title: 粒子計算から半解析モデルへ
    significance: 太陽風電子の流れを含むシースを半解析的に記述し、Maxwell・κ分布のPIC計算と比較した。
    connection: 電位構造を簡潔なモデルへ
public: true
