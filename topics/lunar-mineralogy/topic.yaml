- paper_id: P000290
  group: samples
  role: 鉱物・形状・付着からの安息角推定
  summary:
    question: 月裏側レゴリスの鉱物組成と粒子表面は安息角をどう変えるか。
    method: Chang'e-6の5種・30粒子の形状、表面エネルギー、摩擦を調べ、粒子集団の安息角を実験とモデルで評価する。
    contribution: 月重力では摩擦・形状が支配する領域と付着が支配する領域の境界が、地球の約100 μmから約200 μmへ移ると推定した。
