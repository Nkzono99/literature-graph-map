- paper_id: P000133
  group: feature-charging
  role: アスペクト比と電子の遮蔽
  summary:
    question: 絶縁レジスト／導電性ポリシリコン／厚いSiO₂からなる端部溝で、アスペクト比は面別電流と電位差を通じてノッチをどう変えるか。
    method: 塩素高密度プラズマ（1×10¹² cm⁻³、Te=4 eV、Ti=0.5 eV、p<10 mTorr）からの無衝突粒子輸送、電荷再配分・Laplace場、セル除去による形状変化を結合。線幅・溝幅0.5 µm、ポリシリコン厚0.3 µm、レジスト高さでAR=1–4を比較。
    contribution: AR=1→4で底面電子・イオン電流は約60%減るが端部内側壁イオン束はほぼ一定。底面・隣接線の電位上昇が端部線へ向かう電場と側壁入射エネルギーを増し、100%オーバーエッチのノッチを深く広くする。
