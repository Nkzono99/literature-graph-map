schema_version: 1
topic_id: dust-charging
title: ダスト帯電の理論と粒子実験
question: 孤立球の電流収支から、離散電荷、凝集体、表面上の不均一帯電へ進む。
synopsis:
- プラズマ中の粒子電荷は、電子・イオンの捕集と電子放出の電流収支で決まる。[@P000233]に始まる捕集理論は、遮蔽を解いた修正OMLとPICの比較（[@P000094]）で適用範囲が確かめられ、浮遊電位が合っても電荷や電流が合うとは限らないことが分かっている。
- 研究は三つの方向へ広がった。流入が離散的であることによる電荷ゆらぎ（[@P000237]、[@P000241]）、凝集体や不規則形状での見通し遮蔽と放出電子の再捕集（[@P000239]、[@P000240]）、そして月試料や模擬土の電子放出特性の測定（[@P000166]、[@P000151]）である。粉体層の収率と孤立粒子から逆算した収率は定義が異なるため、比較には放出成分と再捕捉の条件をそろえる必要がある。
- 表面上の粒子では、空隙への電子再捕集（[@P000009]）や接触帯電（[@P000255]）が局所の電荷分布を作る。回収粒子の電荷や運動から帯電モデルを制約する実験（[@P000391]、[@P000317]）が増えているが、局所パッチ電荷と表面電位を直接測る方法は未確立である。
review:
- heading: 平均電流の釣り合いから、電荷のゆらぎへ進む
  paragraphs:
  - "[@P000233]の捕集理論を起点に、[@P000234]と[@P000235]は探針に届く粒子電流を扱う。小粒子を孤立球として近似するOMLと有限寸法のシースを比較する基準となり、星間粒子の衝突帯電[@P000236]へ進むと環境に応じた捕集を考えられる。[@P000094]の読了したarXiv版では、電子・イオン温度が等しい無衝突・無磁場の水素プラズマ中の非放出静止球について、修正OMLが遮蔽を解いて電荷を求めた。電子Debye長に対する半径比5まで電荷差は約8%以下、比10で約20%だが、電流・加熱には表から換算して約37%の差もある。浮遊電位、電荷、捕集電流の一致をそれぞれ評価する必要がある。"
  - "[@P000236]は、接近する電子・イオンが球状粒子を分極させる引力を捕獲断面積へ加え、Maxwell分布で熱平均した。中性球の換算捕獲率も1＋√[π/(2τ)]となり、τ＝akT/e²が小さいほど幾何断面積から増加する。光電子放出を省いた一価イオン・電子の定常分布はτと、電子付着係数・電子／イオン密度比を含む有効原子量μで決まり、μ＝1、25の例ではτ≲0.2で主に中性と−1状態を取る。最小半径3 Åまで延長したMRN分布による低温の例では粒子再結合が放射再結合を上回りうるが、暗黒雲の超微粒子量と極小粒子の電子付着は未確定である。再結合係数は著者が引用する値として扱う。"
  - 流入する電子・イオンは離散的なので、同じ環境でも粒子電荷は変動する。[@P000237]は個々の捕集によるゆらぎをモデル化し、[@P000238]は電荷分布の平均と分散をプラズマ条件へ結び付けた。凝集体の離散帯電[@P000241]と光電子シース中の帯電・軌道連成[@P000167]は、平均電荷から運動を予測する条件を考える基礎となる。[@P000270]は電荷ゆらぎによる月面上の微粒子加速を論じている。
  - 凝集体の離散帯電[@P000241]は、見通しで補正した捕集率から次の電子・イオンと表面位置を選び、全電荷に加えて局所分布を残す。読了した2017年arXiv稿では、LAB・PPD条件の凝集体のゆらぎ時間は等価球よりおおむね約3倍短かった。単一モノマーを25個まで加える成長計算では、衝突中に電荷を更新するLABと、事前に抽出した電荷を固定するPPDの双方で、パッチ分布を保持した凝集体が最も細長くなった。全電荷の変動、表面の非対称性、運動に対する時間比を分けることで、平均電荷から形状を予測する条件が具体化する。
  - "[@P000237]は、定常一様プラズマの孤立球についてOML電流を電子・イオンの吸収率に変え、ランダムな到着を追跡した。電子放出を含めないH⁺・Ar⁺、Ti/Te=0.05・1の4条件では、平均電荷数の絶対値が1を超える範囲で相対rmsが約0.5/√|〈N〉|となる。電位に依存する吸収率のため電荷分布は単純なPoisson分布とは異なり、小さい粒子ほど平均電荷だけでは記述しにくい。 式1と式6でイオン温度分母が異なり、Table IのAr⁺係数換算にも差が残るため、温度依存や表の係数の再利用には留保がある。"
  - "[@P000233]は、境界の速度分布を入力として無衝突軌道から球・円筒の捕集電流を求めた。Maxwell分布の小球では減速側が指数、加速側が一次となるが、加速側には途中の軌道が遮られない電位条件と捕集体より十分広いシースが要る。ダストの捕集電流へ使う際には、この条件と表面での吸収・放出を別に扱う必要がある。"
  - "[@P000507]は、熱的捕集・流れ・光電子捕集と放出から平均電荷を更新し、帯電の擬似時間を粒子運動の刻みで制限する方法を示した。帯電時間が長い場合も、平衡に達する前の運動を追える。簡略Ar RFシースでは重力ゼロの両モデルの分布は似るが、地球重力下では動的帯電が層構造を変え、電荷勾配と重力に伴う循環を生む。平坦月面PIC背景では、相互作用を切った半径0.05–0.5 μmの20粒子を1 ms刻みで4000 s追い、高度振動と粒径・入射角への依存を示す。同じ粒径では法線から60°の入射の浮遊高度が0°より低い。背景を固定し平均電荷を連続値とする希薄系の計算であり、確率的帯電や表面付着からの離脱は含めていない。 印刷式・実験室の総時間・月面の厳密な浮遊限界には未解決点が残る。"
- heading: 非球形・凝集体では、粒子ごとの捕集経路が変わる
  paragraphs:
  - "凝集体では他の粒子に遮られた方向からの流入が減る。[@P000239]はこの見通しをOMLに組み込み、[@P000240]は凝集体の帯電と電子放出を扱う。[@P000242]の不規則形状粒子の実験は、電荷をどの大きさの球で近似できるかを検討している。 Apollo試料とJSC-1Aの粒径・形状・内部空隙を三次元計測した[@P000218]は、球の近似や凝集体モデルへ与える形状の比較材料となる。"
  - "[@P000239]は誘電性凝集体への電子・イオン入射を直線で近似し、遮蔽された方向を除外するOML–LOSを示した。Maxwell分布、電子・イオン温度4637 K、密度5×10⁸ m⁻³、半径0.5–10 µmのa^-1.8分布では、電荷保存モデルに対する総電荷比を1.02 N^-0.56で適合し、経験則を使う凝集計算ではより大きく疎な凝集体が成長した。双極子の比には構造による大きな散らばりがあり、湾曲イオン軌道の検証が課題として残る。要点はarXiv:0707.3816v1原稿に基づく。"
  - 凝集体の見通し遮蔽に電子放出を組み込んだ[@P000240]は、ヘリオシース条件で構成粒子数・疎密と正電荷のべき則を示し、5–10 nmの構成粒子の二次電子放出の粒径効果も残るとした。一方、1
    AUの光電子放出の例では、光電子供給を変えると同質量球より電荷が大きくも小さくもなり、帯電履歴中の符号も異なる。形状による放出電子の再捕集と、外へ逃げる量を対応させて読む必要がある。光電子の数値比較には、原稿内の式と供給率の不一致が残る。
- heading: 材料の電子放出を、粉体と孤立粒子で比べる
  paragraphs:
  - 月試料の光電子放出[@P000001]、二次電子放出[@P000150]、両者を扱う[@P000243]は、帯電モデルへ入れる材料特性の基礎となる。[@P000021]は月試料・模擬粒子の電子照射帯電を比較した。
  - Horányiらは、乾燥して半径29±3 μmにそろえたApollo 17・MLS-1・JSC-1粒子を、背景熱プラズマと20–90 eV電子ビームにさらし、各設定で50回の電荷を測定した。二峰性の分布を二つの安定平衡として扱い、電流釣合いへの適合からApollo試料の有効二次電子収率は両模擬土の中間でMLS-1に近いと推定した。ただし低エネルギー測定だけでは最大収率とピークエネルギーを別々に決められない[@P000166]。
  - '[@P000265]は真空中の導体粒子が孤立照射で正、光電子放出面の近くで負になる符号差を測った。[@P000005]は月ダストの負に帯電した単粒子へUVを当て、電荷減少から効率を求めた。吸収光子当たりの収率には中性極限への外挿と光吸収モデルが入るため、直接測る電荷・効率と区別する。月試料の平衡電位や付着面からの離脱をこの実験だけで確定することはできない。'
  - "[@P000007]は表面近くの光電子シースと飛翔中の粒子を計算した。強い放出では、[@P000155]の空間電荷制限と[@P000156]の逆シースが電位分布の比較に役立つ。"
  - "[@P000156]は、強い二次電子放出を伴う電流釣合いの参考として、BN平面壁の正電位障壁が冷たい二次電子を戻す逆シースを示した。低衝突E×B系でビーム放出係数γb=1.22でも正味係数γnet≈1となり、イオンを引き込む古典シースを必要としない。球形ダストの曲率や軌道捕集は計算しておらず、粒子の正帯電閾値への適用には別の検討が必要になる。本文・表の10 msとFig.2のns軸の対応は未解決である。"
  - Sheehanらは、壁へ失う電子と放出電子の有限温度を含む平面SCLシース運動論を構築した。温度比5では規格化電位が0.51となり、著者が比較に用いる冷放出流体基準1.02の約半分になる。同温度極限ではシース電位がゼロへ向かうため、放出電子を常に冷たいと置く近似は低温環境で大きな差を生みうる。解析は浮遊平面・無衝突・半Maxwell放出を仮定し、球形ダストの曲率や収集軌道への適用には別途検討が必要である。[@P000089]
  - ダスト帯電を衝突ごとの電子数まで追う場合、[@P000091]の条件付き確率モデルは、平均二次電子収率に加えて電子数の揺らぎと放出エネルギーを記述する候補になる。反射・再拡散と真の二次電子の割合が変わると、総収率が近くても生成電子数分布は異なる。ただし本論文は加速器金属壁の較正であり、絶縁ダストの有限サイズや月レゴリスへの適用には材料・表面状態に応じた再較正が必要となる。
  - Dukes and BaragiolaはApollo 16高地土壌61241の粉体層で総電子収率を測り、本文最大値1.13、第一交差80 eV、第二交差>2
    keVを報告した。低nAパルスで得た層の収率とは別に、10 keV・3 nAの走査照射下では25分差の画像に多数の粒子移動と粒子間の帯電差が現れた。電荷緩和時間が不明なため帯電像は定性的であり、負に帯電した粒子の反発が付着力を超え、衝突で法線方向の運動量を得て放出するという連鎖は著者の機構解釈として位置づけられる。固定・清浄化した一試料から月面の浮遊頻度を直接与えることはできない。[@P000151]
  - Abbasらは、Apollo11・17の孤立した正・負帯電粒子を電気力学的天秤に保持し、10–200eV電子による電荷変化を追った。多くの正帯電サブミクロン粒子が10–25eVでさらに正に帯電し、100eVでは放電する一方、大きな正粒子と掲載された負粒子は電荷の大きさを減らした。球形シリカにも似た傾向があり、粒径・初期電位・電子エネルギーを含む条件が帯電の方向を変えることを示す。ただし、小粒子の正方向増加は捕捉限界で測定が終わる場合があり、終電荷を平衡値とは扱えない。SEE収率は付着効率1と調整した入射流束を用いる逆算値である[@P000153]。
  - "[@P000150]は、乾燥窒素中で扱った未ベークの月粉体14259.116へ50–2000 eVの電子を照射し、約350 eVで最大収率1.4を測った。収率が1を超える条件では正帯電により低エネルギー電子の脱出が抑えられ、1750 eVの収率1・正味試料電流ゼロの条件では二次電子の大部分が4–5 eV未満に分布した。この材料測定をもとに、著者は磁気圏電子のエネルギー分布が夜側・明暗境界の帯電に影響しうると論じた。"
- heading: 粒子層の局所帯電と、接触による電荷移動を追う
  paragraphs:
  - 表面上の粒子では、[@P000009]の電子再捕集、[@P000010]の差動帯電と導電損失、[@P000013]の粒子と基板の隙間が論点になる。[@P000037]は模擬レゴリス上の電荷、[@P000391]は照射停止後に外部電圧で回収できた粒子の負電荷を測り、再捕集モデルと比較した。抽出・輸送・検出の選別を伴う正味電荷なので、局所パッチ電荷や粉体全体の平均へはそのまま移せない。光とプラズマを併用する[@P000014]も、測定量をそろえて比較する。
  - 接触でも電荷が移る。[@P000254]は模擬レゴリス粒子同士、[@P000255]は模擬粒子と異種材料の接触を扱う。後者では反復振動で電荷量が増えるが、接触回数や飽和を直接確定していない。仕事関数との回帰にも材料ごとの例外がある。[@P000266]では絶縁体・模擬土に70
    msのUV照射でも初期電荷が残った。これは接触履歴を含む電荷分布であり、照射後の平衡電荷を一般に与える値ではない。
  - "帯電を移動へ結び付ける[@P000314]は、シリカの初速・到達高度を微小空洞の帯電と粒子間反発から調べた。[@P000317]は斜長石の速度と直径を測り、電荷共有モデルで説明しにくい関係を示した。電荷を測る実験と運動から帯電モデルを制約する実験を、試料と場の条件に沿って対応させて読める。"
  - "[@P000314]は、半径 <6–45 µm のシリカ粉体を450 eV電子線下で撮影し、単一空洞の反発、接触力、鉛直電場を含む離脱・運動推定と比較した。未圧縮・追加水平電場なしの鉛直初速は平均0.1698 m/s、中央値0.1323 m/sで、多くが推定範囲内に入る一方、高速度側の例外も残った。3780 Paの事前圧縮では平均0.2707 m/s、中央値0.2300 m/sへ上がり、離脱観測は少なかった。著者は接触強化と微小空洞減少による離脱条件の変化と解釈する。電荷・接触力は粒子ごとの直接測定ではなくモデル化されており、帯電と接触構造を合わせて評価する実験として位置づく。"
  - '[@P000317]は350 eV電子照射下の斜長石で、表面上6 mmの粒径と速度を同時に測った。高速側の上限は、共有電荷モデルでは仮定した電場作用距離と両立せず、孤立球モデルは負の表面電位約−350–−119
    V、局所帯電モデルも従来より大きい帯電係数を必要とする。粒子電荷・粉体表面電位・電場は未測定であり、運動からモデルの必要条件を絞る研究として、電荷を直接測る実験と対応させられる。'
  - '[@P000052]は、VUV照射後のJSC-1A層が+3〜+5 Vの巨視的電位でも、強電場で取り出した個粒子には正負両方の電荷があることを示した。±3.5
    kVで検出した正498・負396 countsの各符号で半数以上が|Q|<10 fCだった。これはパッチ帯電・微小空隙のモデルと比較できる粒子測定であるが、光照射後の動員・捕集に加え、誘起導電と再落下時の摩擦帯電が観測分布へ混ざり得る。'
  - Vegaほかは、3種類の月模擬レゴリスから調製し、導電性基板へ固定した4試料を低照射量の電子パルスで測り、各パルスの間に中和を行った。Table Iの二次電子収率フィットでは、ピークは約1.4〜2.0、ピーク入射エネルギーは約430〜670
    eVとなった。中和なしの400 eV反復照射では全収率が1へ近づき、粒子層の収率測定自体が生む帯電を管理する重要性を示す。組成・粒径・固定方法が同時に異なるため、個々の粒子形状の効果は独立に決まっていない。[@P000053]
- heading: 接触の履歴と、流れの中の粒子電荷
  paragraphs:
  - "接触帯電では、衝突回数に加えて粒子の姿勢と電荷分布も効く。[@P000308]は振動面上の単一球が帯電を止める姿勢へ移る過程を示した。二粒子を音響浮遊させた[@P000309]では、各衝突は確率的でも累積電荷は飽和則に従った。これらは月面固有の実験ではなく、接触帯電の履歴を理解する基礎となる。流れのあるプラズマでは、[@P000321]が遮蔽とウェイクによる粒子間力を整理し、[@P000318]がウェイク内の電荷変化を粒子運動から推定している。"
  - "[@P000309]は、直径約2 mmのPS二粒子を室温23.2±0.5 ℃、相対湿度44±5%の記録条件で音響浮遊させ、約55回の接触・分離を追った。累積電荷はコンデンサーモデルの飽和曲線に適合した（R²=0.996/0.993）が、衝突ごとの電荷移動はばらつき、偏正規分布の歪みはゼロと統計的に区別できなかった。導電性被覆PSでは蓄積が小さくなる一方、遠方粒子の誘導干渉や被覆状態が解釈の条件となる。要点は4著者のarXiv:2608.05083v1原稿に基づく。"
  - "[@P000308]は、空気中で半径5 mmのPP球をガラス面上で40 Hz、Γ≈2.5で振動させ、5分後の電荷1.5–3.5 nCと平均約2.5 nCの飽和を示した。球は跳ね続けても姿勢が約30秒で固定され、局在電荷と誘電像の復元トルクが未帯電面の接触を妨げると説明する。128パッチの結合モデルは初期条件の微小差から電荷分布を再現し、結合を除くと電荷分布が均一化する。最終電荷には空気破壊の上限だけでなく回転履歴が効き、約1 Hzの水平振動で姿勢拘束を弱めると電荷が増える。 スプレー処理による摩擦変化を独立に定量化した記述は主本文にない。"
- heading: 粒子の帯電条件を、電場による清掃へ利用する
  paragraphs:
  - '[@P000368]はEDSにイオナイザを組み込み、極性、照射タイミング、粒径、湿度などを変えて除去率と清掃速度を調べた。照射による電荷供給を調整することで、既存の表面接触や電子放出の研究に、帯電条件を能動的に選ぶ比較軸が加わる。これは気体中の清掃実験であり、月面の光電子・プラズマ環境への適用には電流源と環境条件の対応付けが必要になる。'
  - Dukes・Baragiolaは粉体層の総電子収率σ（二次電子δと後方散乱・再拡散電子ηの和）を、帯電を抑えた短時間・低電流照射で試料電流と収集電流から求めた。AbbasらはEDBに保持した孤立粒子の電荷変化率を電流モデルへ当てはめ、付着効率ηst=1を仮定し、電荷収支に合わせてビーム幅を調整して二次電子収率を逆算した。両者を比較するには、放出成分の定義、粒子電位による再捕捉、粒子位置での入射電子数の推定条件をそろえる必要がある。[@P000151][@P000153]
