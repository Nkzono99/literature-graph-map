- paper_id: P000111
  group: plasma
  role: 電子・陽子・アルファ粒子の同時計測
  summary:
    question: 月の昼側磁気異常上空で電子加速と陽子・アルファ粒子の減速は同じ電位差で説明でき、反射イオンの加熱はどこで生じるか。
    method: かぐやMAP-PACEの対向電子・イオンセンサーとLMAGで、南極エイトケン盆地上空約25 kmの電子ピッチ角・粒子スペクトル・密度/速度/温度を比較。2009年4月23日の13事例で電子加速と陽子減速、最大磁場Bと太陽風密度nを用いたB²/nの相関を調べた。
    contribution: 電子の約+150 eV/qの加速と陽子・アルファ粒子の約−150 eV/qの減速の対応から、かぐやより上の静的な月外向き電場を推定した。13事例の陽子減速と電子加速は比例係数0.98・相関0.965で対応し、B²/nとの相関0.798はHall電場の解釈と整合した。反射イオンの高温・低速・広い分布から、約25 kmより下の非断熱散乱と加熱を論じた。
