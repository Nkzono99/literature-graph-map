lineage:
- title: 放出シースの電位構造
  steps:
  - paper_id: P000155
    title: 放出電子を含むシースの基準を作る
    significance: 電子放出が壁への熱流と電位差を変える過程を整理し、空間電荷制限シースの基礎を示した。
    connection: ''
  - paper_id: P000156
    title: 強い放出で逆シースへ移る
    significance: 高い放出率の条件で、壁がプラズマより正になり放出電子を戻す電位構造を示した。
    connection: 空間電荷制限から逆シースへ
  - paper_id: P000093
    title: シースの移り変わりを測る
    significance: 古典からSCLへの遷移を観測し、Γc＝0.977と評価。Γ約2でもSCLが続き、さらに希薄な背景で表面が周囲より約1.1 V正となる逆シースを観測。
    connection: 電位構造を実験で調べる
- title: 放出特性から電子の行き先へ
  steps:
  - paper_id: P000154
    title: 銅の放出率と照射履歴を測る
    significance: 低エネルギー電子の反射と放出率を測り、電子照射による収率の低下を電子雲対策へ結び付けた。
    connection: ''
  - paper_id: P000091
    title: 放出電子を確率モデルで生成
    significance: 平均収率、単電子スペクトル、その積分、個別・合計放出エネルギー上限が一致する現象論的粒子境界モデルを提示。旧較正のjet spectrum取り違えを修正し、Cu・鋼の表面状態別パラメータと電子数分布の差を示す。
    connection: 測定データを粒子生成モデルへ
  - paper_id: P000009
    title: 粒子間の再捕集に着目
    significance: 粉体の空隙で電子が再吸収される局所帯電モデルを提案し、ダストの離脱を説明した。
    connection: 放出後の局所的な再捕集へ
