review:
- heading: 装置ごとの観測を、共通の月の姿へ結び付ける
  paragraphs:
  - かぐやは地形、重力、分光、レーダー、粒子・磁場を組み合わせて月を調べた。ミッションの全体像は[@P000168]、地下探査の装置と観測方法は[@P000276]を入口にできる。
  - LALTの全球地形[@P000169]と、リレー衛星を使った裏側重力場[@P000170]は、地殻厚の推定[@P000180]へつながる。画像から得られる形と、重力から推定する内部構造を重ねる研究の流れである。
- heading: 保存データの再解析で、観測できる対象を広げる
  paragraphs:
  - LRSが捉えた海の地下層序[@P000181]に対し、[@P000176]は表面からの散乱を計算し、小規模な地下エコー候補を探している。分光データの比較では、放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]を分けて読むと、機器間の違いを追いやすい。
  - PACEでは太陽風陽子の反射[@P000184]と月起源イオン[@P000185]が観測対象となった。地球起源酸素[@P000177]、月周辺のC・N・Oイオンの日変化[@P000179]へと対象が広がり、表面と周囲のプラズマを結ぶ研究に使われている。
- heading: ミッションをまたいで観測をそろえる
  paragraphs:
  - '[@P000329]のSomBenchはKaguyaを含む4ミッションの観測を位置合わせし、クレーター・火山・極域を共通のデータで解析する入口を用意した。[@P000330]はそのデータから複数観測種と解像度を扱う共通表現を学習する。ミッション別の機器較正に加え、地理的な訓練・評価分割や観測幾何をそろえることが、再解析結果を比較する条件になる。両者は別論文のプレプリントとして扱う。'
- heading: 観測装置から代表研究をたどる
  paragraphs:
  - LALT（レーザー高度計）の地形観測は[@P000169]、RSATの4ウェイドップラーによる裏側重力観測は[@P000170]を入口にできる。両者を統合した地殻厚推定が[@P000180]である。TC（地形カメラ）の画像は裏側火山活動の継続期間[@P000171]、火山活動の年代・層厚[@P000182]と縦孔の形態[@P000183]を調べる。MI（多波長撮像装置）の反射スペクトルは純斜長岩の分布[@P000172]へつながる。
  - SP（スペクトルプロファイラ）では、盆地周辺のかんらん石から深部物質の露出を検討する[@P000173]と、イルメナイトに富む場所を保存データから調べる[@P000174]をたどれる。日陰での水氷粒子候補を扱う[@P000280]も、同じ装置のスペクトルを使う研究である。GRS（ガンマ線分光計）のウラン分布とU/Th比[@P000175]は、鉱物の吸収帯とは別の観測量から地域差を調べる。
  - LRS（月レーダーサウンダー）は地下からの反射を測る。装置・観測方法[@P000276]から海の層序[@P000181]、GRAILの質量欠損と比較したMarius
    Hillsの空洞候補[@P000195]、表面散乱を考慮した保存データの再解析[@P000176]へ進める。PACEの粒子観測は陽子反射[@P000184]と、IMAによる月起源イオン[@P000185]を捉える。ウェイクへ届く陽子[@P000103]とそのエネルギー変化[@P000186]にもつながる。PACEとLMAG（月磁場観測装置）を組み合わせた研究は[@P000178]に収録している。
  - 磁場と粒子を組み合わせる研究では、Lunar Prospectorと統合した表面磁場の復元[@P000107]が計算の基礎となり、電子加速とイオン減速を同時に測った[@P000111]は磁気異常上空の電場を制約する。低高度のPACE・LMAGを使う[@P000178]は磁気リコネクションの候補を調べており、磁場の分布から局所的な粒子加速へ論点を広げている。
lineage:
- title: 地形・重力から地殻構造へ
  steps:
  - paper_id: P000169
    title: 全球の高さを測る
    significance: LALTから全球地形を整備し、盆地や極域の形を比較する基盤を作った。
  - paper_id: P000170
    title: 月裏側の重力を測る
    significance: リレー衛星を介した追跡で裏側重力場を制約した。
    connection: 形状と重力という異なる観測量をそろえる
  - paper_id: P000180
    title: 地形と重力を統合する
    significance: 両者を用いて地殻厚を推定し、裏側盆地の構造差を調べた。
    connection: 二つの観測から内部構造を推定
- title: 観測を統合したデータから共通学習表現へ
  steps:
  - paper_id: P000329
    title: ミッションをまたぐ月データをそろえる
    significance: Kaguya等の観測を位置合わせし、共通ベンチマークを提供した。未査読。
  - paper_id: P000330
    title: 複数観測・解像度から表現を学習
    significance: 統合データから基盤モデルを学習し、複数の月科学課題で評価した。未査読。
    connection: SomBenchのデータ基盤から共通表現モデルへ
