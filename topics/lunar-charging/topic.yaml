- paper_id: P000020
  group: photoelectron-sheath
  role: 月面電位の観測を電場の初期像へ結ぶ
  summary:
    question: 太陽風・磁気圏尾部中の月面電位は、SIDE観測と先行理論からどこまで定まり、近地表シースの電場へどう結び付くか。
    method: SIDEの電圧走査共鳴と終端の低エネルギーイオンから電位を推定し、先行研究を比較。電場は電位と仮定した遮蔽長から概算。
    contribution: 太陽風中の昼側約+10 VとApollo 15午後の約+18 V、終端の負電位を整理し、昼側外向き・終端内向きの電場像を示した。遠夜側は条件付き推測。
