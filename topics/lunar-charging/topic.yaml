  summary:
    question: 太陽風の密度・温度・流速と紫外線による光電子放出は、月面電位・電場と、離脱後のダスト上昇高をどう変えるか。
    method: 通常太陽風と1998年5月CMEを想定した5条件で平衡電流収支を解き、表面電位をDynamic Fountain Modelの半径別最大高度計算へ接続した。
    contribution: 通常太陽風とCMEの条件で、直下点・明暗境界の電位と電場、ゼロ電位の位置が変わることを計算した。粒子高度は離脱後のfountainモデルへの接続結果である。
