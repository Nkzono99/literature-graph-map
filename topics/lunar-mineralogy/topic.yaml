- paper_id: P000297
  group: materials
  role: 熱処理によるFe再分配と磁性相形成
  summary:
    question: 模擬レゴリス中のFeは加熱でどのような磁性相へ変わるか。
    method: 低酸素分圧で玄武岩質模擬物を加熱し、磁化測定、Mössbauer分光、X線回折、透過電子顕微鏡で調べる。
    contribution: 800°Cの加熱後に金属Feと磁鉄鉱に似た相が形成され、20 kOeでの質量磁化が約27.5%増えた。さらに高温では磁性相の保持と磁化が低下した。
  inspection:
    level: abstract
    version_id: V1
    checked_by: ai
    checked_at: '2026-09-25'
    recheck: false
