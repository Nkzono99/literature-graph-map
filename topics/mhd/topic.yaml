    method: 半保存形の抵抗性MHDとCTを用い、沿磁力線電流・電位・電子降下でCTIMへ結合。WindのMINVAR入力と2007年3月23日の仮想衛星・磁力線写像を比較。
    contribution: 単一事例で磁場・流れの大まかな変化とTHEMISからサージへの磁力線写像を再現したが、開始は観測より早く、密度・温度の一致は弱かった。
