- paper_id: P000248
  group: reactor-models
  role: エネルギー依存SEEとRF放電密度
  summary:
    question: 容量結合型アルゴン放電で、入射粒子のエネルギーに依存する二次電子放出は、電子加熱と密度増幅をどう変えるか。とくに二周波駆動での増幅機構を調べた。
    method: 二次電子の放出係数を入射イオン・電子のエネルギーに応じて変える二次元PIC計算を行い、駆動位相ごとのエネルギー分布と電流密度から電子の生成・輸送を解析した。
    contribution: 一方の電極でイオン衝撃により生じた高エネルギー電子が、対向電極で電子衝撃による二次電子放出を誘発する。二周波駆動ではこの帰還が電離を強め、電子密度を非線形に増幅することを計算で示した。
