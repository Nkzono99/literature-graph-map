  role: 非対称な電子分布と捕捉幅からの電位反転
  summary:
    question: ストラールによる左右非対称と中央の捕捉電子・衝撃波を含む月ウェイクで、電子位相空間密度から磁力線沿いの電位を復元できるか。
    method: 磁場強度が安定し電子が準静的平衡にあると仮定して左右の分布を独立に最適化し、中央は平坦な分布の端の速度から電位差を求めて接続する。質量比100の一次元PICの2時点で既知電位と比べ、ARTEMIS
      P1の2横断へ適用した。
    contribution: 初期・後期PICで非対称な電位と衝撃波に伴う上昇をおおむね復元し、ARTEMISでは太陽風から中央への電位降下を約800 Vと約200
      Vと推定した。衝撃波境界の分布端と、非定常な観測区間には手法間の差が残る。
