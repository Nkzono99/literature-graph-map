- paper_id: P000055
  group: structure
  role: イオン温度と光電子シース
  summary:
    question: 有限のイオン温度は、法線入射速度と太陽天頂角によって月面光電子シースをどう変えるか。
    method: 熱圧力を含む一次元定常イオン流とMaxwell分布の電子・光電子をPoisson方程式に結び、準中性・電流収支・非単調電位の極小条件を連立する。θ、Ti/Te=0–10、圧力係数ψ=1・3を比較し、正電位層での実数イオン解の存在条件に応じた境界速度の修正も導入する。
    contribution: 温度効果が高い太陽天頂角で大きくなり、θ=89°の負電位シースが薄くなる一方、θ=85°の非単調シースでは負の電位極小と光電子障壁が弱まることを示した。表面電場・極小高度には非単調な応答があり、シース端のBohm条件だけでは正電位層を通過できない場合も示す。
