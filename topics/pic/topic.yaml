- paper_id: P000072
  group: accuracy
  role: SICとの比較
  summary:
    question: 位相空間の分布を接続したシートで表すと、PICの粒子ノイズと収束はどう変わり、折り畳み・有限温度の条件で何が精度と費用を制限するか。
    method: 固定電荷を持つ1D線分を追跡点間に置き、区分一定／区分線形密度をセルへの重なりから投影するSICを実装。電荷投影以外を共通にしたPICと、周期境界の冷プラズマ振動、二流不安定性、20冷シートで表す温プラズマのLandau減衰を比較し、線分長基準の再分割と接続方向も調べる。
    contribution: SICは滑らかな1D分布の試験で少数点から低ノイズ・小誤差となり、区分線形密度は点間隔誤差の収束を速めた。高点数ではPICと共通の格子誤差下限へ近づく。二流の非線形折り畳みでは再分割が必要で点数はほぼ指数的に増え、Landau減衰では流数とシート接続も精度を制限した。
