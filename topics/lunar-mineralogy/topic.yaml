- paper_id: P000286
  group: samples
  role: Ni同位体から読む衝突物質の供給
  summary:
    question: 月裏側の微小隕石供給と衝突蒸発はNi同位体にどう記録されるか。
    method: Chang'e-6のレゴリスと岩片のNi同位体組成を測定する。
    contribution: 重い同位体への偏りと一部岩片の軽い組成を、累積的な蒸発と再凝縮で解釈した。同位体異常から、長期平均の供給物質は主に内太陽系起源と推定した。
