  role: 磁気異常の広域への影響
  summary:
    question: 月磁気異常は表面への陽子降下をどこまで再分配し、その広がりと遮蔽は太陽風動圧にどう応答するか。
    method: Chandrayaan-1/SARAのCENA水素ENAとSWIM反射陽子を、装置応答・上流太陽風・軌道ごとの無擾乱フィットを用いて1°格子へ集積。ENA観測/予測比を降下量の代理指標とし、0.7 nPaを境にしたマップと20動圧ビンでOA・Gerasimovich・SPAを比較した。
