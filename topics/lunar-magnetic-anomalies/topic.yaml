  role: 電子遮蔽領域の正電位を制限する表面電子の実験
  summary:
    question: 電子が磁化されイオンが非磁化の双極子ローブでは、100–800 eVの流れが作る正電位がどこまで上がり、高エネルギー側の電子流入を何が担うか。
    method: 窒素プラズマ（100–800 eV、1–100 mA）を垂直双極子の上の絶縁板へ照射し、放出探針で電位、Langmuir探針で電子電流を測定。測定場を用いる試験粒子計算で上空電子とイオン誘起二次電子の侵入を比較した。
    contribution: ローブの正電位は100–200 eVではイオンエネルギーに近づくが、400–800 eVでは下回り、電子電流も増した。測定場を与える試験粒子計算では上空電子を電場だけで引き込む説明は不十分で、近傍のイオン誘起二次電子の輸送が電位を下げる説明を支持した。
