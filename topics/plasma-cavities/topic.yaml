schema_version: 1
topic_id: plasma-cavities
title: 空洞・微細構造へのプラズマ流入
question: 形状と速度分布による粒子の届き方の違いが、空洞内の電位をどう決めるか。
synopsis:
- 空洞や微細構造へのプラズマ流入では、電子とイオンの到達の違いが内部の電位を決める。真空への膨張（[@P000219]）とウェイクのPIC（[@P000220]）を基礎に、地形が流れを遮る場合には、空洞寸法とデバイ長の比、流速と熱速度の比が比較軸になる。
- 月では、大域ウェイクの観測（[@P000223]、[@P000231]）、クレーターへの流入と表面帯電（[@P000008]、[@P000048]）、深い空洞の正帯電（[@P000012]）が、同じ粒子供給の差として読める。室内実験（[@P000263]、[@P000226]）は、シース厚と穴の半径の比や、壁面からの二次電子供給の役割を加えた。
- 微細加工の溝では、電子の遮蔽による局所帯電が損傷と形状変化を生む（[@P000230]、[@P000228]）。幾何が似ていても、流入粒子、衝突、材料の条件が異なるため、月面空洞との比較はそれらを保って行う。
review:
- heading: 空間の陰が、電子とイオンの届き方を分ける
  paragraphs:
  - '[@P000219]の真空膨張と[@P000220]のウェイクPICは、希薄な領域へプラズマが入る過程を扱う。地形が流れを遮る場合には、空洞寸法、デバイ長、流速と熱速度の比が、流入する粒子と電位を比較する軸になる。'
  - "[@P000008]はクレーターへの流入と表面帯電の相互作用を扱い、[@P000222]は太陽嵐中へ広げた。深い空洞では[@P000012]、寸法の違いは[@P000015]、流速と熱速度の比は[@P000016]からたどれる。"
  - "[@P000222]は段差状の永久影クレーターを2D電子・陽子PICで計算し、上流の電子雲から下流のイオン流入域へ変わる空洞内構造を整理した。CMEの4段階は独立に計算し、磁場と月規模の反射陽子侵入は含めない。高温shockは負電位と粒子流束を増す一方、低温late cloudでは弱い二次放出と短いDebye長が深い非中性領域の規格化電位差を大きくする。深いlate-cloudの電位は未飽和であり、物理的上限値は確定していない。"
  - "月全体のウェイクでは、Wind[@P000223]、ARTEMISの三次元再構成[@P000231]が観測から空隙の構造を調べる。静電衝撃波の観測[@P000232]と、電子分布から電位を復元するプレプリント[@P000262]は、再充填に伴う局所構造へ論点を広げる。日夜境界の電場とダスト[@P000221]、日夜境界・極域での準中性破れ[@P000282]を合わせると、大域ウェイクと地形による陰を粒子供給の差から読み比べられる。[@P000221]の計算は定常・準中性ウェイクと滑らかな月面の鉛直電場を扱う。地形の陰による水平電場は定性的な提案で、局所電場の数値解やダストとの自己無撞着な連成計算は行っていない。"
  - "[@P000232]は、安定したBy優勢の月ウェイク観測から、再充填の中央に静電衝撃波に整合する局所構造が生じることを示した。後縁の約1.4秒の孤立電場と密度約0.005→0.01 cm⁻³、正の平行速度部分の平均運動エネルギー約50→100 eVを測り、横断係数α=1/4・圧縮比2などの仮定から電位約50 V、厚さ約86 km（約56 Debye長）を推定した。別事例の約1000 kmの密度増加領域と強い静電波は形成後の散逸・拡大に整合するが、形成時刻はモデル依存の推定である。要点はarXiv:2507.16084v1と同原稿内補足S1–S3に基づく。直近上流イオンの低カウントと欠測Ezが電位・減速推定を制約する。"
  - "[@P000282]は、月ウェイクへ電子がイオンより先に入り、膨張先端の電子過剰域とその後ろのイオン過剰域に定常両極性電場が生じることを一次元PICで示した。電場のピークは障害物後方約0.2 Rₒで約400 mV/mとなる。準中性がよく保たれる密度本体と、電子先端でその近似が崩れる部分を分けると、空隙の再充填を比較しやすい。"
  - HalekasらはLunar Prospectorの3813軌道をWindの太陽風観測と照合し、高度85–115 kmで中央ウェイクの磁場増大と周囲の減少、高度20–45
    kmで地殻磁場の強い寄与を示した。月向き電子のKappaフィットから導く密度は2桁以上減り、温度は最大約1桁上昇するが、約40 eV以下の外挿に依存する。分布のエネルギーシフトから導く電位には衛星帯電が含まれる。電子圧力からの反磁性電流モデルは空洞の基本形を再現する一方、中央磁場の形と磁場方向への応答には未解決の差が残る。[@P000224]
  - この月ウェイク通過では、著者は周囲のプラズマが磁場に沿って両側から入り込み、太陽風に斜めの磁場によって非対称に充填されると解釈した。OgilvieらのWIND観測は下流6.5月半径で二つの低温陽子流を捉え、速度差と磁場の整列を示した。密度低下域は光学的な影より広く、希薄波が周囲へ伝わる解釈と概ね整合した。約2×10⁻⁴
    V/mの電場は速度変化からの粗い推定であり、この通過の上流太陽風にも時間変化があった[@P000223]。
  - 月全体の陰を満たす対向流では、局所的な衝撃波と捕捉電子が電位構造を変える。[@P000262]は左右の電子分布を別々に最適化し、中央では平坦な分布の幅から電位を求めて、初期と後期のPICおよびARTEMISの2横断を比較した。空洞への粒子供給を考える際には、安定した磁場、電子の準平衡、分布端の検出という診断条件を参照できる。ウェイク内のプラズマ電位を壁面の帯電電位へつなぐには、表面の電流収支と局所シースを別途扱う必要がある。
  - '[@P000264]は膨張前線と表面の間の電子雲を解析した。'
  - '[@P000225]は直径50 m・深さ45 mの縦孔を、固定太陽風条件・無磁場の三次元静電PICで計算した。正に帯電した壁への電子吸収で孔底に届く太陽風電子電流が減り、壁から孔底へ届く光電子が孔底の正味光電子電流を負に変える。日向の孔底は、天頂角5°超でその位置が日向にある範囲で、孔外平坦面より8〜10
    V高くなった。影深部では電流収支が計算中に完全には成立しておらず、最終負電位は未確定である。'
  - クレーターへの流入を三次元化した[@P000048]は、直径1.2 kmの穴で下降流に加えて約±40 km s−1の横方向バルク速度を得た。標準条件では底から100
    mの面の下降フラックスが上流の約4%、イオンを受ける壁の法線フラックスが約18%となる。局所成分別の流束であり、穴全体の積分捕獲率とは区別する。モデルは電子旋回半径より小さいクレーターと、放出電流を省いた短時間の準平衡を扱う。
  - kmスケールの永久影クレーターでは、熱電子が先行して作る両極性電場が太陽風イオンを底面へ曲げるため、幾何学的な遮蔽だけでは流入量を決められない。Farrell
    et al. は膨張則に局所斜面への入射角を加え、イオン流入がある面と電子雲内の非入射面で表面電流収支を分けた。垂直方向の解析近似で、山の側方からの回り込みは含まない。この適用条件を、微小空隙の寸法とDebye長の関係に合わせて吟味する必要がある。[@P000058]
  - 真空側へ先行する電子雲と追随するイオンの違いを示す基礎モデルとして、[@P000096]は冷イオン・一定温度のBoltzmann電子の一次元自由膨張を扱う。長時間には、イオン先端の電場が内部自己相似電場の約2倍となり、先端密度もZnᵢ≈2nₑで準中性が破れる。先端速度から有限時刻のエネルギー端を定めるが、その端は固定電子温度のもとで増え続ける。空洞への流入を考える際は、この先端機構に壁・曲率・対向流・電子の供給や冷却の条件を加える必要がある。
  - "[@P000220]は、月ウェイク横断面を一次元静電PICで扱い、空隙縁の両極性電場によるイオン加速と、中央の対向ビーム不安定性による制動・蓄積を結びつけた。質量比20、周期境界、定常対流換算の条件では、密度空隙は約16模擬障害物半径まで明瞭で、約20半径下流から中央の高密度域と両側の低密度streamersが生じる。磁場は横断方向に置くため、一般のIMF方向や上流の電磁波まで説明するモデルではない。"
  - "[@P000264]は、水平な太陽風が遮られる壁直後で、準中性のイオン膨張前線より下に残る電子雲を解析的に扱う。Maxwell電子流体と有限の絶縁底面を接続し、未擾乱Debye長約10 mを超える負空間電荷領域を得る。深さ500 m、電子温度11 eV、電子密度5×10⁶ m⁻³、水平400 km/sの例の結果であり、磁場や高エネルギー電子の捕集は含まない。 刊行式の電位基準・Debye長・x規格化には未解決点が残る。"
- heading: 実験と微細加工の研究から、形状の効果を比較する
  paragraphs:
  - Wangほかは半径1 cm、深さ1 cmの半球形クレーターを熱アルゴンプラズマに置き、形状を固定して周囲の密度を変えた。シース厚さSが0.65、1.2、3
    cmへ増えると、電位輪郭のくぼみが弱まり、穴内の電位が平坦になった。比較尺度はS/Rで、実測したデバイ長0.1–0.5 cmはいずれも半径より小さい。電子がたまり密度がイオン密度を超えるという説明は、極限条件へ外挿した著者の機構予想である。[@P000263]
  - 溶岩チューブ内では、入口での電子遮蔽に加え、壁面が供給する電子も底面の電流平衡を左右する。Gopalakrishnanらの2024年9月25日草稿は、窒素ガス由来の100–800
    eVの準中性流を直径6 mmのガラス管へ入射させ、入口に−5/−40/−70 Vを印加した。底面LPは正電位を示すが、強い電子遮蔽条件でもイオンエネルギー相当の電位へは達せず、著者はI–V曲線の追加電子成分を側壁へのイオン衝突による二次電子と解釈している。側壁電位分布や月の材料への相似性は未検証である。[@P000226]
  - 微細加工の[@P000230]は、斜めに入射する電子がパターンで遮られることで局所損傷が生じることを示した。[@P000227]は電子温度と溝底電流、[@P000228]は局所電位と側壁の削れを結び付ける。月面空洞との比較では、幾何形状と流入分布に加えて、衝突や材料の条件もそろえる。
    一様なプラズマ中でも生じるノッチの計算[@P000229]を加えると、上流の一様性と局所の電流収支を区別して比較できる。
  - Hwang and Giapisは、絶縁レジストで覆った導電性ポリシリコン線と厚いSiO₂底面からなる微細溝を計算した。AR=1から4へ増すと底面電子・イオン電流は約60%減り、底面中央電位は約8から33
    Vへ上がる。開放領域から電子を受け取る端部線と隣接線の電位差がイオンを端部線内側へ加速し、その側壁のイオン束がほぼ一定でもノッチが深く広くなる。この結果は、溝の深さだけでなく材料の導電性と開放側の電子供給を含めて局所帯電を考える必要を示す。漏れ電流・表面電流・二次電子放出を省いた条件の結果である[@P000133]。
  - 微細溝の帯電では、絶縁面に届く粒子だけでなく、導体へ捕集された電荷の移動先も局所場を変える。[@P000228]は、最外配線へ入った電子を等電位条件に従って再分配し、内側底部の強い電位勾配とノッチ成長を計算した。全体電流の均衡後も溝底電位は変わり、開口幅によるノッチ深さは基準条件のW≳5
    µmで飽和する。接続配線では局所場がほぼ対称になり、両側にノッチができる。この例は、見通しと電荷移動を同時に扱う必要を示す。ノッチ底の更新は電子流を省いた近似であり、空隙形状の帯電値へ使う際は放出・漏れ電流と材料の接続条件を改めて与える。
  - "加工中の溝では、流入粒子が形状そのものを変える。[@P000129]の照射と表面反応の実験、[@P000132]の輸送・反応・場のハイブリッド計算は、溝へ与える入射条件を考える前段になる。形状を固定する月面空洞の計算と比較する際には、表面更新の時間スケールも条件に含める。"
  - "[@P000132]は、場・非局所電子輸送・シース到達分布・表面反応をモジュールの入出力で結ぶHPEMの総説である。本文の計算例は2次元ICPとCCP基板バイアスで、空洞内部の特定結果を扱うものではない。空洞形状のモデルを考える際には、メッシュで未解像のシースを電位跳躍として扱う選択や、表面への入射エネルギー分布を境界条件へ返す構造を参照できる。実過渡では情報交換間隔に応じた時間分解能の確認が必要となる。要点は出版社版の報告に基づく。"
  - '[@P000131]は、壁近傍の薄いRFシースを局所一次元モデルへ縮約し、電荷収支から求めた電圧降下を二次元装置のPoisson境界と電子反射加熱へ戻した。10
    mTorr Arの計算では、シースの表現によってバルク電位と密度・基板流束の分布が変わる。空洞形状による局在を直接検証した研究ではないが、壁近傍の境界モデルが装置全体の分布へ及ぼす影響を比較する事例となる。適用には薄い局所一次元シース、衝突なしのイオン、負イオン空間電荷の無視という条件がある。'
  - 凹凸を固定した帯電計算から形状変化へ進む例として、MemosらはAr⁺でPMMAの周期1 µmの正弦波状表面を削る過程を計算した。谷の正電位がイオンを側壁へ偏向させ、谷へのイオンを減速することで突起の消失が早まる。平滑化が電子遮蔽を弱めると電位も低下し、形状と局所粒子束の循環が生じる。帯電による粗さ低下の差は収率の角度依存を入れると弱まり、イオン反射など粗さを増す過程はこの計算に含まれない。[@P000136]
- heading: 計算出力と図の再現へ進む
  paragraphs:
  - 論文から計算条件を追うために、公開出力も参照できる。[@P000344]は空洞サイズ依存の図に対応するHDF5とNotebook、[@P000345]は流速・熱速度比の計算出力と半解析コード、[@P000346]は極域クレーターのhybrid
    PICのVTK・DAT出力を提供する。これらは関連論文とは別の公開データ記録であり、ここでは説明とファイル一覧を確認している。
