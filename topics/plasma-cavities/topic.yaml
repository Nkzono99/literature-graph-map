- paper_id: P000221
  group: expansion
  role: 日夜境界の鉛直電場と地形ウェイクの仮説
  summary:
    question: 月の日夜境界でプラズマ供給の偏りが作る電場は、ダスト加速や夜側への輸送を説明しうるか。
    method: 定常・準中性ウェイクの密度と電子温度を表面の電流収支へ組み込み、滑らかな月面の電位と鉛直電場を計算した。完全帯電した孤立球を仮定し、付着力を省いた試験粒子を追跡した。Apollo 17周辺の地形の陰も模式的に検討した。
    contribution: モデルは日夜境界の夜側で強まる鉛直電場と、小粒子の加速を予測した。地形の陰で夜側向きの水平電場が生じる説明は定性的な仮説で、局所電場・軌道の数値計算やLEAMの再解析はない。本文と図の速度・単位表記の不整合が残るため、具体的な速度値は確定結果として使わない。
  evidence_by_item:
