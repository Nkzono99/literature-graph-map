- paper_id: P000214
  group: measurements
  role: ナノチューブ表面による付着低減
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-09-22'
    recheck: true
  summary:
    question: Ti6Al4V上のナノチューブ配列は、模擬月塵の局所付着力と表面残留量をどう変えるか。
    method: 陽極酸化電圧を変えた表面を、粒子付きAFM探針と粉体散布試験で比較する。
    contribution: 未処理Ti-0と比べ、Ti-40の平均付着力は12.98から1.63 nNへ低下。投入量5 g・設置角60°の残留量は0.5420から0.1642 mg/cm²へ減った。ナノ構造の半径・直径表記は原文内で一致しない。
  evidence_by_item:
    question:
    - paper_id: P000214
      version_id: V1
      url: https://doi.org/10.7527/S1000-6893.2024.31803
