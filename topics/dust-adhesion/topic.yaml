  summary:
    question: 月レゴリス模擬物の粒径に応じて、EDSで除去しにくくなる原因は何か。
    method: 模擬物を粒径群に分級して清掃実験と高速度撮影を行い、粒径依存の簡略化した力の釣り合い計算と比較した。
