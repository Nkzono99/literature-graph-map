- paper_id: P000038
  group: balance
  role: 三電流収支と光電子条件の感度
  summary:
    question: 太陽風の密度・電子温度・イオン温度・流速と光電子放出の強さ・温度は、昼側と明暗境界の平衡電位・遮蔽距離・鉛直電場をどう変えるか。
    method: 定常・局所平面・単調シースを仮定し、流れるMaxwellian電子・プロトンと光電子の三電流収支を数値探索。六つの入力を一つずつ変え、二電流解析近似と比較し、Debye長から電場を近似する。
    contribution: 昼側の光放出量・光電子温度と境界の電子温度が主要因となること、冷たい電子や高速流ではイオンを省く二電流近似が外れることを示した。非単調シースでは予測電位が障壁差に近くなり、電場評価にも制約が残る。
