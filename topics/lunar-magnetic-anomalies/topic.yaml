schema_version: 1
topic_id: lunar-magnetic-anomalies
title: 月の磁気異常と太陽風相互作用
question: 地殻磁場が太陽風の粒子軌道・電位・表面照射をどう変えるかを、観測・PIC・実験から整理する。
review:
- heading: 局所的な磁場が、太陽風の届き方を変える
  paragraphs:
  - 全球SVMモデルは強度に加えて方向を復元し、Reiner Gammaなどのスワールが半径方向成分ゼロ付近や低～中傾斜の領域に多いことを示した。ただし、局所的な水平場の強い面積と高アルベド域は一致せず、遮蔽や静電ダスト輸送の機構を確定した結果ではない。孤立中心異常の双極子近似からは3.3–3.5 Gaより前の極移動を推定するが、磁源の形状と磁化が海玄武岩より古いという形成順序の仮定に依存する[@P000107]。
  - Chandrayaan-1が測った月面からの水素中性原子は、太陽風の到達を画像として見る手段になった。[@P000109]は磁気異常の上に粒子フラックスが減る領域と、その周囲の増加域を捉えた。[@P000110]は中性原子のエネルギー分布へ着目し、入射陽子が減速する分から正の電位を推定している。
- heading: 電子とイオンの運動の違いが、電場と境界電流を作る
  paragraphs:
  - Saito et al. (2012)の約25 km高度の同時計測は、粒子のエネルギー変化から磁気異常上空の静的な月外向き電場を推定した。電子加速とB²/nの相関0.798は、イオン慣性長程度の規模で電子とイオンの運動が分離するHall電場の説明と整合する。一方、反射イオンは磁場増強域より広く、入射太陽風より高温・低速であり、著者はかぐやより下の非断熱散乱と加熱領域を考えた。この上方の減速・加速と下方の反射・加熱の区別が、磁気異常周辺のプラズマ構造を読む手掛かりになる。[@P000111]
  - Deca et al. (2015)は、月面下の水平双極子と太陽風を質量比256の三次元・全運動論的電磁PICで計算し、磁化された電子と非磁化イオンの侵入差が作る法線電場、電子のE×Bドリフト、イオンの偏向・逆流を結び付けた。密度3 cm⁻³、Ti=Te=35 eV、350 km/sの基準条件では、高度約13 kmに密度約1.6倍のハローが生じる。ただし表面へのイオン到達は最良遮蔽域で約8%、中心で最大約60%と位置に依存する。低速風ではハローと逆流イオンが消えても局所的な入射抑制が残り、IMFを倍にすると反射割合が下がっても表面遮蔽は強まる。反射率と表面遮蔽を分ける必要がある。月面は電荷を蓄積しない完全吸収境界で、光電子・二次電子・帯電ダストを含まないため、表面帯電やダスト輸送への接続には追加の境界物理が要る。[@P000112]
  - Usuiら（2017）は、Reiner Gamma南西側を模した水平単一双極子と正面入射太陽風を三次元全粒子PICで計算し、電子が担う境界電流が赤道と高緯度で向きを変える構造を示した。外側の平均電子速度はE×Bドリフトでおおむね説明できるが、内縁では電荷分離電場で加速されたリング分布の旋回位相が偏り、約8倍の上流流速を持つ粒子の負方向流が強くなる。局所電子旋回半径約0.08Lは内縁幅約0.1Lと近かった。これは質量比100、固定IMF、光電子放出なしという縮約条件の結果であり、表面帯電と電流閉路の定量解析は課題として残る。[@P000114]
  - Decaら（2016）は、表面法線方向の単一双極子を三次元の全運動論的電磁PICで計算し、中心カスプへ太陽風が流れ込み、その周囲に部分遮蔽の環ができることを示した。IMFを省き、上流密度3 cm⁻³、電子・イオン温度35 eV、太陽風速度350 km/s、縮約質量比mi/me=256を用いた事例である。最も強い環状遮蔽部では電子71%、イオン28%が表面到達を阻まれる一方、中心には高密度のhaloに囲まれた密度空洞が表面を守る従来型小磁気圏は形成されない。カスプ直上の局所分布では反射イオン成分が約21%を占め、著者は既報の水平双極子の約4倍と比較する。この値は限定された集計体積から得た割合であり、異常域全体の積分反射率ではない。環状の風化模様との関連は、この粒子照射・遮蔽の分布から示唆される。[@P000113]
  - ミニ磁気圏の実験とスワール形成を結ぶ[@P000275]は、局所磁場による遮蔽を室内でも調べる研究として参照できる。かぐや低高度観測の[@P000178]は電子のみが関わる磁気リコネクションの候補を検討する。表面への粒子到達に加え、磁場近傍でのエネルギー変換も比較の対象となる。
  - Bamford（2012）[@P000275]は、磁化された電子と十分に磁化されないイオンの応答差が作る電位障壁を、既報の衛星観測とプラズマ風洞の空洞形成につないだ。太陽風イオンが減速・偏向されることで、局所磁場の勾配に応じた照射と風化の差がスワールの明暗を作りうると論じる。ただし読んだarXiv v1では、実験電位と電子慣性長の数値を印刷値から再現できず、定量的一致と表面形成の実証は区別して扱う必要がある。
- heading: 実際の磁場配置と表面帯電へ広げる
  paragraphs:
  - Reiner Gammaの観測に基づく磁場を使った[@P000115]は、太陽風の入射角や磁気シース通過を含む8条件を比較した。高度によっても粒子分布が大きく変わるため、周回機と着陸機の観測を結び付ける際に参照できる。
  - Yeoら（2022）は、電子が磁化されイオンが非磁化となる垂直双極子と絶縁板に100–800 eVの窒素プラズマを照射した。ローブの正電位は100–200 eVではイオン停止の期待値に近づくが、400–800 eVでは下回り、ローブ内の電子電流も増えた。測定場の試験粒子計算では上空電子を電場だけで引き込む説明は不十分で、近傍で生まれたイオン誘起二次電子の輸送が有力な機構となる。ただし自己無撞着な電位再現は未了で、月面への適用には磁場形状、イオン種・表面材質、光電子環境を考慮する必要がある。[@P000116]
  - Katoらは、ローブ様プラズマ中のかぐや光電子を表面磁場強度図と比較し、強い地殻磁場ほど光電子が減速する統計的傾向を示した。Reiner Gammaのswirlを横切る事例でも、電子フラックスの低下と負側のエネルギーずれが局所的に対応した。Fe重量比で高地・海側を分けても磁場強度への依存が残るが、磁場方向や空間的広がりは解析していない。磁化表面が相対的に正側となる解釈を支持する一方、電場の機構や全プラズマ環境への一般化には既報との比較とモデル仮定が伴う。[@P000051]
- heading: 局所の遮蔽から、広域の照射とスワールへ
  paragraphs:
  - Maynadié et al.（2025）はChandrayaan-1/SARAのENAと反射陽子を集積し、主要磁気異常の欠乏域の周囲に1,000 kmを超えるENA増強域を示した。ENA観測/予測比を陽子降下量の指標とするには、表面の後方散乱比と経験的散乱モデルの仮定がある。動圧が高いほどGerasimovich・Orientale Antipodeの遮蔽は弱まる一方、広いSPA磁気群では欠乏と周辺増強が強まる。著者は反射陽子の再入射と、反射陽子群による太陽風の偏向を説明機構として提案した。SWIMの領域平均反射比は視野・空間分解能に影響され、高緯度のENA定量解釈にも制約がある。[@P000117]
  - Blewettほか（2011）はClementineの多波長画像と高度30 kmにそろえたLunar Prospector磁場を15地点で比較した。調査したスワールはすべて磁化地殻と対応し、明るい部分は光学的に未成熟だったが、Abelなど4磁場異常では明確なスワールを認めなかった。海ではFeO推定値が周囲より約1–4 wt.%低い一方、高地では差が小さく、Gerasimovichでは周囲とほぼ同じ値になる。FeOは絶対精度約±1–2 wt.%の分光推定であり、著者は低FeOの外来放出物や斜長石に富む微粒子の集積に加え、遮蔽下の異常風化が見かけのFeOを下げる可能性を示した。この解析では太陽風遮蔽と静電ダスト集積を明確には区別できない。[@P000108]
  - 続く[@P000163]は、Chandrayaan-1の夕方側57周回の観測から、高度約100 kmのSPA磁気群上空で太陽風の偏向・加熱・減速が繰り返し現れることを調べた。反射陽子との相互作用で生じる広域のproto-magnetosheathという解釈により、フラックスの再分配を上空の流れの変化へ結び付けている。
- heading: 遮蔽を比べ、散乱粒子の行き先を追う
  paragraphs:
  - '[@P000274]は複数の磁気異常を比較し、単純な磁場構造で見られる遮蔽の傾向が、複雑な構造では一様に成り立たないことを示した。[@P000272]はARTEMISの統計から高高度・下流の圧縮構造を調べ、[@P000273]は磁気異常で散乱された陽子が月ウェイクへ届く経路を観測と軌道追跡から検討している。'
  - '[@P000274]はCENAの複数磁気異常を比較し、Gerasimovichでは、異常より広い地表視野を持つ外側セクターを除くと、磁場が強いほど中性水素の減少率が高く、同程度の磁場では太陽風動圧が低い群の減少率が高いことを示した。外側セクターのみの1領域を除いた9領域中4領域で磁場との相関が見られたが、他の領域には相関が見えない例や観測不足があった。ENA減少には表面の反射効率の違いも重なるため、地域間の比較には磁場構造、観測視野、太陽風条件を合わせる必要がある。'
- heading: 磁化が記録した磁場と、磁化を担う物質を分けて調べる
  paragraphs:
  - 現在の磁気異常の背景には、過去の磁場と磁性鉱物の履歴がある。[@P000288]は裏側起源と推定される月隕石から約7億年前の弱い磁場を読み、全球ダイナモの停止時期を制約する。一方、[@P000297]は模擬物の加熱によるFeの再分配と磁性相の生成を追う。試料の磁化を解釈する際には、磁場の強さと、物質が磁化を保持する条件の両方を参照できる。
- heading: 磁場源の地質と、磁化を担うナノ粒子
  paragraphs:
  - '[@P000322]はDewar領域の重力と磁場を共同逆解析し、埋没火成岩体と古いダイナモを結び付けた。[@P000323]はChang’e-6衝突ガラスのγ鉄と磁気ボルテックスを調べた。前者は磁場源の形状・年代のモデル制約、後者は磁化を担う相と衝撃記録の試料制約であり、両者を組み合わせて月の磁気履歴を考える。'
lineage:
- title: 遮蔽の観測から電荷分離へ
  steps:
  - paper_id: P000109
    title: 中性原子で太陽風の遮蔽を撮る
    significance: 磁気異常上のフラックス減少と周囲の増加を画像化し、小規模な磁気圏を観測した。
  - paper_id: P000110
    title: 磁気異常上の電位を遠隔推定
    significance: 戻ってくる中性水素のエネルギーから入射陽子の減速を読み、正電位の分布を求めた。
    connection: 遮蔽の分布から電位へ
  - paper_id: P000112
    title: 電子とイオンの運動を三次元で解く
    significance: 基準Run Aでは電子とイオンの侵入差が作る法線電場によりイオンが減速・偏向し、電子のE×Bドリフトが非対称なハローを生む。低速風でハロー・逆流イオンが消えても局所的な表面入射抑制が残り、IMF倍増で反射割合が下がっても表面遮蔽が改善するため、構造・反射・表面到達を分けて評価する必要を示す。
    connection: 電荷分離を粒子運動で説明
- title: 局所環境から広域の太陽風擾乱へ
  steps:
  - paper_id: P000115
    title: Reiner Gammaの環境を計算
    significance: 観測に基づく磁場で、太陽風の入射や磁気シース通過に伴う局所プラズマの変化を調べた。
  - paper_id: P000117
    title: 粒子の再分配を全球へ広げる
    significance: 主要磁気異常のENA欠乏と周囲1,000 km超の増強を示し、小異常では高動圧で遮蔽が弱まる一方、SPAでは強まる統計的応答を得た。反射陽子の再入射と太陽風偏向を、その広域差を説明する機構として提案した。
    connection: 局所環境から広域の観測へ
  - paper_id: P000163
    title: 反射陽子が作る広域構造を考える
    significance: 夕方側のSPA上空で頻発する流れの擾乱から、proto-magnetosheathという相互作用領域を提案した。
    connection: フラックスの再分配から流れの変化へ
- title: 月裏側の古地磁気からダイナモ史へ
  steps:
  - paper_id: P000288
    title: 若い裏側試料の磁場を制約する
    significance: 隕石の古地磁気をApollo試料と比較し、全球磁場の停止時期を検討した。
