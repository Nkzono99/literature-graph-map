<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Literature Map</title>
  <link rel="stylesheet" href="{{ asset_url }}/site.css">
  <script defer src="{{ asset_url }}/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="{{ home_url }}"><span class="brand-mark" aria-hidden="true"></span>Literature Map</a>
    <span>論文から、研究のつながりへ。</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <a class="back-link" href="{{ home_url }}">テーマ一覧</a>
      {% block navigation %}{% endblock %}
    </aside>
    <main id="main">
      {% block content %}{% endblock %}
      <footer class="site-footer">
        <p>{{ disclaimer }}</p>
        <a href="{{ copyright_url }}">著作権について</a>
      </footer>
    </main>
  </div>
</body>
</html>
