  summary:
    question: 高密度Cl₂プラズマのポリシリコン・オーバーエッチで、最外配線の内側底部にできるノッチの場所とくさび形状を説明できるか。
    method: 非線形シースから得たエネルギー・角度分布、表面帯電と導体等電位化、閾値付き反応、露出SiO₂での前方偏向・非弾性散乱を二次元Monte Carloで計算し、固定200%オーバーエッチ時間で既報輪郭と比較する。
    contribution: 初期場だけの直接衝突に加え、電子流を省いた近似で露出酸化膜の帯電による前方偏向が深いノッチ形状に効き、散乱が先端を補うことを示した。基準Cl₂条件での開口幅依存の飽和と4本の配線接続によるほぼ対称なノッチを再現し、反応閾値を上げる低減案を提案した。
