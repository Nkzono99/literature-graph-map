- paper_id: P000267
  group: collection
  role: シース中の粒子浮遊実験
  summary:
    question: 負にバイアスした導電面上のアルゴンプラズマシースで、既知粒径の粒子の浮揚高さを、測定した局所電位とOML帯電・力釣り合いで説明できるか。弱UV照射と表面からの離脱も調べた。
    method: 直径10.0 ± 0.5 µmのポリスチレン球、中空ガラス球、JSC-1を地上の低圧アルゴンで浮揚させた。プローブでシース電位を測定し、観測高さから電荷・電位を力釣り合いで逆算した値と、OML計算および安定平衡の高さを比較した。
    contribution: ポリスチレン球の浮揚高さは板電位−40〜−80 Vで1.46〜2.20 cmへ増加し、計算と誤差範囲で一致したが、計算は一貫して高めだった。弱UVでは高さが0.11〜0.15 cm低下した（各高さ±0.10 cm）。著者は粒子の光電子放出による負電荷減少と解釈した。約−30 Vより負では撹拌なしの離脱も観測した。
