    method: 安定した磁場と上流定常性を条件としてARTEMIS P1の時系列を空間列へ読み替える。左右では電子の準平衡を使って分布を最適化し、中央では捕捉電子分布の幅を電位差へ換算する。既知電位との精度比較は別の一次元PICで行う。
