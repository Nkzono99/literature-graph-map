schema_version: 1
topic_id: lunar-subsurface
title: 月の縦孔・地下構造・空洞
question: 画像・レーダー・重力・地震波と試料から、浅部の層序、空洞の寸法・安定性、温度構造をどう調べるか。
synopsis:
- 月の地下は、縦孔の画像、レーダー、重力、地震波、試料から別々の性質として調べられる。縦孔の発見（[@P000183]）と分布の整理（[@P000193]）が入口であり、地下レーダーの層序（[@P000181]）、空洞候補のエコー（[@P000195]）、GRAILの質量欠損（[@P000194]）は、それぞれ異なる物性に感度を持つ。
- 空洞が残る条件は力学モデルで評価され、均質な天井（[@P000296]）から弱層を含む構造（[@P000291]）へ比較が広がった。常時微動（[@P000302]）や着陸探査の構想（[@P000285]）は、現地で浅部を絞る方法である。
- 温度構造には、縦孔の熱環境（[@P000196]）、コア試料の熱履歴（[@P000299]）、ガス掘削による深度測定（[@P000366]）がある。位置の対応と各モデルの仮定をそろえることが、観測間の比較の条件になる。
review:
- heading: 画像に写る縦孔を、地下構造の手掛かりにする
  paragraphs:
  - "[@P000192]はLROCの斜視画像で、TranquillitatisとMarius Hillsの縦孔の床が天井下へそれぞれ約20 m、約12 m続くことを確認した。入口近傍の高さは約60 m、約17 mと推定するが、空洞全体の延長や、溶岩チューブと浅いマグマだまりの崩壊との判別はできない。3縦孔の数m〜十数mの層とクレーター壁の薄い層から、海の玄武岩が薄い流れまたはローブを重ねて形成されたと解釈した。"
  - "[@P000193]は高い太陽位置のLROC画像を半自動探索し、海8孔、29クレーターの衝突溶融物221孔、高地2孔を整理した。内孔と外側の漏斗を区別し、衝突溶融物の孔の多くが海の大型孔より小さいことを示す。探索可能な南北緯約50°の範囲のうち入射角50°未満で撮像された面積は53%で、小型孔には見逃しもあるため、確認数は当時の画像による分布として読む。"
  - "[@P000193]で新たに見えた横方向の空洞は、南西Mare Fecunditatisで7 m以上、Mare Ingeniiの西壁下で20 m以上であり、奥の壁を撮像できていないため全長にはならない。著者は孔の小ささ・保存状態と母体の年代を比べ、多くの開口が母体や空洞の形成後の崩落で生じたと解釈する。画像は入口と近傍の形を制約し、全長・連結性・安定性は地下観測や力学評価へ残る。"
  - '[@P000183]は、Marius Hillsの直径65 mの縦穴について、MI画像の底の影から深さ80–88 mを推定し、蛇行溝内の位置と噴出物・ピット列の不検出から溶岩チューブの開口を最も妥当と解釈した。約370
    mという地下幅は、TCの約60 mの壁深さを天井と上載溶岩の合計厚とみなし、引張強度6.9 MPaなどを採用した梁モデルの値である。縦穴の観測形状と、横方向の空洞の存在・寸法に関する推定を区別する必要がある。'
- heading: レーダーと重力は、異なる地下の性質を測る
  paragraphs:
  - "LRSの装置・観測方法[@P000276]を起点に、地下反射[@P000181]は海の層序を調べる手段となった。空洞候補を扱う[@P000195]は特徴的なエコーと、GRAILの質量欠損[@P000194]との対応を調べている。[@P000176]は表面散乱を計算して地下エコーを選別する。エコーの強さには空洞だけでなく、物質の誘電率や空隙率も関わる。"
  - "[@P000176]が抽出した候補の見かけ深さ350–800mは、母岩比誘電率7.2を仮定すると実深さ約130–300mに相当する。母岩の減衰0.032dB/mなどを採用するレーダー方程式では、進行方向幅概ね50–600mと比誘電率1–4の組合せが反射強度を説明し、空洞または同じ固体密度で約35–70%空隙率の物質と整合する。幅・誘電率を独立に決めた結果ではない。標高下降方向に並ぶ候補は溶岩チューブ、地溝A延長で等高線と平行な候補は貫入マグマ先端のガス空洞と解釈されるが、局所破砕帯も残り、表面散乱と重なる構造は見逃し得る。母岩減衰の表示式からの再現とFig.13の距離D不記載に確認点が残る。"
  - "[@P000194]はGRAIL重力の二手法でSchröterリル延長、MariusHills天窓近傍、RimaMairan西方などに大規模溶岩管候補を示した。MariusHillsでは地表溝より大きい質量欠損が天窓西方約60 kmまで延び、洞自体は約30 km長と推定される。RimaMairan西方の異常は接続している可能性のある約180 kmの系で、幅3.5 km・高さ550 mは前方計算からの値である。検出対象は幅数km・高さ数百m・長さ数十km級に偏り、異常の広がりを一本の連続した空洞の実測長と同一視できない。モデル探索範囲・深さ依存性・寸法のトレードオフと動画による持続性判定は本文の著者報告として扱う。"
  - "[@P000276]のLRSは4–6 MHzのチャープで地下反射を測り、距離分解能は媒質の比誘電率εrに応じて75/√εr mとなる。初期解析の20波形の移動平均は水平な反射面を強める一方、約1度を超える斜面や点状の地下反射も弱める。裏側高地・極域では粗い地表からの横方向の反射が複雑で、地形モデルによる散乱計算とSAR処理が課題となった。海の層序や空洞候補の比較には、検出されたエコーと、この処理が拾いにくい構造を分けて読む必要がある。"
  - Mini-RFを用いた[@P000197]はMare Tranquillitatisの縦孔下の通路候補を扱う。Diviner観測と熱モデル[@P000196]は内部の温度環境を評価するが、地表の熱放射だけから奥の空洞の存在を判定する感度は限られる。
- heading: 空洞の存在と、安定に残る条件をつなぐ
  paragraphs:
  - '[@P000296]は有限要素法で空洞幅、天井厚、初期応力を変え、km級の空洞が安定となる条件を調べた。[@P000295]は形成時の溶岩流や崩落口の形も考慮する。安定に残り得る幅は、岩石強度と天井の形状に応じた推定値である。'
  - '[@P000294]は、空洞全体が崩壊しなくても床や天井に破壊が生じることを示し、地表の亀裂から幅を推定する手掛かりを与えた。[@P000291]は弱層を挟む天井を扱い、荷重の分散と亀裂の進展を計算する。均質な岩石を仮定するモデルから、層構造を含むモデルへ比較を広げられる。'
  - "[@P000296]は、幅高さ比3:1のアーチ空洞を月重力下の弾塑性有限要素モデルで調べ、近静岩圧の初期応力と静穏な地域ひずみ、密度3100 kg m⁻³・一軸圧縮強度100 MPaなどの材料条件下では、屋根厚500 mで幅約5 km、厚約2 mで幅約1 kmの空洞が屋根の塑性破壊無しに維持され得るとした。Poisson初期応力では最大fully stable幅が3.5 km（厚50–100 m）となり、厚い屋根のたわみで下面が引張になるため、厚さと安定幅の関係は単調ではない。屋根厚の50%未満の破壊を許すquasi-stableを含めると上限は変わる。これは重力・画像からの候補を力学的に位置づける計算であり、個別亀裂や形成・熱履歴を解いた実在確認ではない。 Fig.5–6のC/Eは図ごとの寸法で区別する。"
- heading: 現地の物理探査と試料で、浅部の性質を絞る
  paragraphs:
  - "[@P000302]は観測DTMに仮定したMarius Hillsの空洞を組み込む二次元実験で、空洞上面に対する常時微動探査の感度を示した。pit近くでは反射がH/Vや相関を乱し、離れた位置でチューブを横切る配置の方が解釈しやすい。四層一次元逆解析ではH/Vが空洞を高速度域にし、H/Vと並進・回転データの併合が空洞域を悪化させる例もある。底面深度や横幅の過大推定が残るため、空洞の存在を示す異常と幾何形状の確定を分け、他の地球物理探査と照合する必要がある。SI Tables S1–S4は未入手で、全計算組合せと各曲線の固定条件の対応は未確認である。[@P000285]のLunarLeaper構想は、重力計と地中レーダーに壁面の撮像・分光を組み合わせ、空洞形状と火山層序を現地で調べる。"
  - "[@P000285]は、Marius Hills Pit周辺を歩く約30 kgの脚式機体に重力計・GPR・撮像・赤外分光を組み合わせ、洞内へ降りる前に地下空洞と壁の層序を調べる構想を検討した。幅60 m・高さ30 mの理想化した2次元GPR計算では、速度0.1 m/ns一定の処理で約60 m深の床が約40 mに描かれ、空洞高さが圧縮されるため、重力等の補助制約を要する。重力の非一意性、標高補正、2次元計算の振幅過大評価を明示し、軌道観測の候補を局所的に検証する前段階の観測設計として位置づけられる。 要点はarXiv:2609.11453v1原稿に基づく。著者の本文では、幅500 m・高さ20 m・天井深度50 m・密度差−1500 kg/m³の空洞の重力応答を約1 mGal、同深度の幅50 m例を約0.4 mGalと記す。Fig.5aの幅50 m曲線の最小値は目視で約−0.4 mGal、幅100 mは約−0.7 mGalである。図の既定密度1800 kg/m³は本文例の1500 kg/m³と異なり、同条件の独立数値再現とは扱わない。"
  - 温度構造には試料からの制約もある。[@P000299]はApollo 17コアの熱ルミネッセンスから、深さ約1.3〜2.9 mの温度勾配を推定した。空洞の熱環境を扱う[@P000196]と対象を分けて参照すると、露出した縦孔と地中のレゴリスの熱構造を比較できる。
- heading: 観測装置と測る量から文献を選ぶ
  paragraphs:
  - LROCの高解像度画像による壁・張り出しの追観測[@P000192]から、縦孔の分布と形成機構の比較[@P000193]へ進める。画像で見える開口と壁を起点に、地下へ続く構造を検討する。
  - LRSは地下の反射エコーを測り、海の層序[@P000181]からMarius Hillsの空洞候補[@P000195]へつながる。GRAILは重力場を測り、質量欠損から空洞を推定する[@P000194]。Mini-RFはレーダー散乱を測り、縦孔下の横方向の通路候補を検討する[@P000197]。反射・散乱と重力は地下の異なる性質に感度を持つため、位置の対応と各モデルの仮定を合わせて読む。
  - Divinerは熱放射を測る。[@P000196]は観測と熱モデルから縦孔・空洞の温度環境を調べており、地形や地下構造の候補を、照明と温度の条件へ結び付ける入口になる。
- heading: 窒素ガス掘削で浅部へセンサーを届ける
  paragraphs:
  - '[@P000366]のLISTERはBlue Ghost Mission 1でガス掘削し、約1 mまでプローブを送った。噴流を止めて未掘削の土へセンサーを挿入し、8深度で温度と熱伝導率を測定した。Apollo
    17コアから温度履歴を推定した[@P000299]と比較すると、試料の記録と現地の深度測定という異なる制約が得られる。本報告は掘削・運用を中心に扱い、停止原因と熱データの詳細な解釈は未確定である。'
- heading: 浅い層序を、観測法と速度モデルから比較する
  paragraphs:
  - "[@P000457]はChang’e-6の掘削前レーダー観測を深さ依存速度で画像化し、上部3.5 mを二層のレゴリスと二層の玄武岩質物質に分けた。約1.9 mで比誘電率が約2.72から4.5へ増え、塊状散乱も強くなることから、レゴリス厚を約1.9 mと解釈する。ただし2.6 m以深の速度は安定した反射から得られず、比誘電率約4.5超は低下傾向の外挿である。破砕玄武岩の衝突起源と火山性角礫は一意に区別できず、約1.66 Gyr前の再被覆は地域のクレーター年代と形成速度を用いた条件付きモデルとして位置づける。"
  - "[@P000458]はChang’e-6の1–3 GHz固定MIMOレーダーで上部約3 mを画像化し、比誘電率2.22±0.72、損失正接0.010±0.002を推定した。約1.7 mまでの弱散乱層を比較的均質な成熟細粒土、1.7–3 mの強散乱域を粗粒土または未風化噴出物と解釈する。C1クレーターのモデル掘削深約3.9 mと後続の再加工を形成仮説に結びつけるが、下層の供給源・全厚と基盤深度は確定しない。4地点の年代と損失の相関は成熟度との関係候補であり、固定地点の局所測定や異なる組成・周波数・探査深度を踏まえて読む必要がある。密度正規化式の指数表記と図・Methods間の損失値の違いも未解決のまま残る。"
  - '[@P000454]はクレーターの掘削から海・高地のレゴリス厚さを統計的に求めた。局所レーダーの層境界と広域の掘削尺度の厚さは、空間範囲と物質の定義が異なる。[@P000470]の熱伝導測定では氷の接続と昇華が熱輸送を変えるため、熱観測から氷量・浅部構造を読む際にも物性と相変化の条件が加わる。'
  - "[@P000470]は、約100–450 Kの熱真空槽実験で、乾燥模擬材の接触伝導とT³放射成分を分け、同程度の低氷量でも分散微粒氷と液体水から凍結した連結氷では有効熱伝導率が異なることを示した。約3 wt%の微粒氷は低温で乾燥材に近いが、2.90 wt%のWet Mixは低温側で高かった。充填率・加熱履歴も異なるため、氷量だけから地下熱物性を指定できない。210 K超の昇華ピークは潜熱輸送を含む動的応答として定性的に解釈され、100 K未満は未測定である。"
