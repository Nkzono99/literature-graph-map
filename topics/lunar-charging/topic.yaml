- paper_id: P000011
  group: photoelectron-sheath
  role: 半解析解とPIC
  summary:
    question: 太陽風電子の流れを含む光電子シースを、半解析解で再現できるか。
    method: 電子ドリフトを含む一次元の半解析解を導き、運動論的PIC計算と速度分布の違いを比較した。
    contribution: 同じ一次元条件で半解析解とPICの整合を示し、平均的な太陽風ではMaxwell分布とκ分布の結果が近いと報告した。
