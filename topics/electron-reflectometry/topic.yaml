schema_version: 1
topic_id: electron-reflectometry
title: 電子反射法による天体の磁場・電位・大気推定
question: 月の磁気ミラー・電位による電子反射を起点に、火星の磁場・熱圏密度とガニメデへの応用、装置・推定条件を整理する。
review:
- heading: 戻ってくる電子から、磁場と電位を読む
  paragraphs:
  - 電子反射法（electron reflectometry）は、天体へ向かう電子と戻ってくる電子のエネルギー・方向分布を比べ、磁力線の先にある磁場や電位を推定する方法である。Apolloの月周回機で方法が整備され（[@P000347]、[@P000348]）、Lunar
    Prospectorで月の全球磁場マップへ発展した（[@P000351]）。観測点より下の領域を調べられるため、軌道上の磁力計を補う。
  - ここでいう反射には、強い磁場へ進む電子が磁気ミラーで引き返す場合と、負の電位に阻まれて引き返す場合がある。電子の進行方向と磁場のなす角をピッチ角という。表面まで達して吸収される電子は戻らず、戻りの分布に欠けた角度領域、ロスコーンを作る。入射側と戻り側を、同じ磁力線につながる観測として比較することが出発点になる。[@P000347]、[@P000025]
- heading: 磁気ミラーの原理と、推定が成立する条件
  paragraphs:
  - 電位差を無視でき、電子の磁気モーメントが保存される理想的な場合、ロスコーンの境界角αcは sin²αc = B観測点 / B最大 に従う。ここでは天体へ向かう磁力線方向から測った0〜90°のピッチ角を考える。B最大は観測点から吸収境界までの磁力線上で最も強い磁場で、表面で最大なら表面磁場の強さを求められる。境界より大きいピッチ角の電子は磁気ミラーで戻り、小さい角度の電子は表面へ到達する。電位差があると境界にエネルギー依存が現れ、磁場と電位を同時に考える必要がある。[@P000025]、[@P000359]
  - 電子の旋回半径が磁場の変化尺度に比べて小さいことも必要になる。[@P000352]は粒子の全軌道を追跡して月の推定を再検討し、用いたモデルでは約10 kmより大きい波長の磁場を捉えやすく、細かな磁化に対して感度が低下すると示した。この値は一律の地図解像度を表すものではなく、電子のエネルギーと磁場構造に依存する適用条件として読む。
- heading: 装置は電子分布と磁場を同時に測る
  paragraphs:
  - 自然のプラズマを使う電子反射法では、電子分析器がエネルギー・方向を測り、磁力計がピッチ角へ変換する基準を与える。MGSの[@P000380]はこの組合せで電離圏と閉磁力線領域を調べた。かぐやの[@P000386]は、反対向きの半球視野を持つESA-S1/S2で3次元電子分布を取得する構成を示す。エネルギー範囲や視野を確認することは、電子の反射境界をどこまで識別できるかの判断につながる。
- heading: 月では局所の異常から全球の磁場へ
  paragraphs:
  - '[@P000348]はApollo 15・16の電子反射観測を地質と照合した。Lunar Prospectorでは磁力計と電子反射計を併用し、磁気異常と太陽風の相互作用が調べられた（[@P000349]）。[@P000350]は表側の地殻磁場を地質単位と対応付けた。[@P000351]の全球マップでは、大きな衝突盆地の内部で弱く、その対蹠域で強い磁場が集中する分布が示された。'
  - 比較には、磁力計データから表面の磁場ベクトルを復元した[@P000107]も役立つ。電子反射法はロスコーンを通じた磁場の強さの制約、磁力計の逆解析は観測高度のベクトルから表面へ外挿するモデルである。推定高度、磁力線の接続位置、細かな磁場への感度をそろえて読むと、同じ異常に対する両手法の違いが分かる。
- heading: 電位の推定では基準と電子の起源を確かめる
  paragraphs:
  - '[@P000003]はエネルギーに依存するロスコーンと二次電子ビームから、日陰の月面がLunar Prospectorより平均約35 V低い電位にあると推定した。探査機も帯電するため、周囲のプラズマを基準にするには補正が要る。[@P000025]は探査機電位を補正し、月面電位と入射電流を対応付けた。'
  - '[@P000379]は、推定電位と磁場の傾きの関係を有限旋回半径の効果として調べ、粒子追跡と比べて夜側の電位構造の平均尺度を約1〜2 kmと制約した。磁場形状と電位分布を仮定した推定であり、電子反射の適用誤差そのものを空間構造の診断に使う例である。'
  - 強い負帯電を扱う枝では、[@P000004]が日照・日陰の大負電位を電子ビームから抽出し、[@P000006]が太陽高エネルギー粒子イベントの極端な事例を示した。探査機電位の補正を用いた[@P000027]では、11イベント中8件を電流収支モデルが再現した一方、3件には説明が残った。平均的な帯電とイベント時の予測性能を分けて評価する必要がある。
  - 日照面でも、地球のプラズマシート中では大きな負電位の指標が現れる。[@P000033]は電子反射観測とPIC計算を比べ、表面上に電位の極小がある非単調なシースで説明した。ロスコーンだけから得た反射障壁の電位を表面電位へ対応付けるには、経路上の電位構造を考える必要がある。[@P000034]は月につながる磁力線上のARTEMISで、表面から加速されてくる放出電子も使い、日照域の負帯電と非単調シースの解釈を検討した。
  - 放出電子の観測は、反射電子とは別の情報を与える。[@P000041]は光電子スペクトルと電流収支から昼側の帯電条件を調べ、[@P000051]はかぐやの光電子のエネルギーずれから場所ごとの相対電位を求めた。[@P000161]はARTEMISの光電子を放出モデルと比較して昼側電位を推定する。ロスコーン、放出電子ビーム、光電子スペクトルが、それぞれどの電位差を捉えるかを区別して使う。
- heading: 火星では大気中の電子輸送を組み込む
  paragraphs:
  - 火星には大気があるため、月の表面吸収の扱いに、電子と中性粒子の衝突・エネルギー損失を加える。[@P000353]の磁場推定から、[@P000382]の高度170 kmの全球マップ、[@P000354]の電子輸送モデルと[@P000355]の高度185
    kmの改良マップへ発展した。170 kmと185 kmは各解析の参照高度であり、地表磁場や観測機の高度とは異なる。地殻磁場の研究全体は総説の[@P000361]で参照できる。
  - '[@P000356]は電子のエネルギー・ピッチ角分布から、約185–400 kmの間にある磁力線方向の電位差を推定した。対象は外気圏下部から探査機までの領域であり、月面の帯電電位とは基準高度が異なる。磁場の接続状態、大気の密度、電位差を電子輸送の中で扱うことが、火星への応用の要点になる。'
  - 反射解析が使える場所は磁場の接続にも左右される。[@P000383]は片側・両側ロスコーンや電子の欠乏域などを分類し、開いた磁力線と閉じた磁力線の分布・変動を調べた。磁気的に閉じた領域で入射電子が得られないことと、磁場が弱いことを区別して地図を読む。
- heading: 同じ反射電子から、火星の熱圏密度を調べる
  paragraphs:
  - 大気吸収は磁場推定の入力条件である一方、磁場を独立に与えれば中性密度を調べる信号にもなる。[@P000381]は強い地殻磁場の既知の形状を使って約160〜230 kmの密度を推定した。[@P000384]は南半球の限られた領域で主感度高度180
    km・地方時午前2時の変動を4火星年にわたって追跡し、[@P000385]は高度185 kmの系列を大循環モデルと比較した。参照高度・地方時・観測可能な地域が異なるため、これらを全火星の瞬時密度としては扱わない。
  - この系列には多エネルギー・誤差評価の先例がある。[@P000381]は3エネルギーを用い、装置の角度ビンへモデルを畳み込んでχ²の誤差楕円体から密度の幅を評価した。同時に組成と温度には強い縮退が残る。後の[@P000385]でも個々の推定の不確かさにより数週以上の平均化が必要であり、測定器の時間分解能と物理量を安定して推定できる時間尺度を分ける。
- heading: ガニメデへの応用と、天体間の比較
  paragraphs:
  - 固有磁場を持つガニメデでは、[@P000357]がGalileoの高エネルギー粒子のロスコーンから表面磁場を制約した。低エネルギー側の環境を知る資料として、JunoのJADEによるフライバイ観測（[@P000358]）もある。[@P000359]は表面帯電をモデル化し、将来のJUICEによる電子反射法では電位の影響を補正する必要を論じた。ここで示された負電位は計算結果であり、電子反射法による実測の電位マップではない。
  - 水星の[@P000360]は、同じロスコーンの考え方をMESSENGERの陽子へ適用した関連手法である。天体間で比較する際には、粒子種とエネルギー、磁場の変化尺度、吸収される高度、大気の有無、探査機電位の補正を確認する。これらの条件が、磁場の推定と電位の推定をどこまで分離できるかを決める。
- heading: 比較：表面で散乱された電子と、光電子を識別する
  paragraphs:
  - '[@P000363]が扱う後方散乱電子は、表面へ衝突してから宇宙へ戻る入射電子である。表面に達する前に磁気ミラーや電位で引き返す電子と、生成される場所が異なる。[@P000362]の酸素Auger電子による光電子の識別は、この成分を選び分ける手掛かりになった。[@P000364]は光電子の流束・検出確率を環境別に整理している。反射境界から磁場・電位を推定する際にも、電子の起源と表面への再衝突を併せて考える必要がある。'
- heading: 残る課題：何を独立に制約できるか
  paragraphs:
  - 今後の比較軸は、磁場・電位・大気密度を変えたときの電子分布の違いが、装置応答と観測誤差を含めても区別できるかである。月では有限旋回半径とシース構造（[@P000379]、[@P000352]）、火星では既知磁場に依存する密度と電位の推定（[@P000381]、[@P000356]）、ガニメデでは帯電補正（[@P000359]）が具体的な検証対象になる。これらを共通の模擬観測で比較し、推定量の相関と適用範囲を報告することは研究方向の一つである。
  - 研究のつながりとしては、Lin・Mitchell・Halekasらの月での磁場・帯電解析から、Lillis・Brainらの火星輸送・接続診断へ進む流れがある（[@P000347]、[@P000380]、[@P000383]）。熱圏への展開ではBougherらの大気モデルとの比較（[@P000385]）、かぐやではSaitoらの粒子計測（[@P000386]）が加わる。系譜では手法の継承と相補的な計測を区別し、年代順だけで直接の引用関係を仮定しない。
lineage:
- title: 月の磁場を局所から全球へ、適用条件を再検討
  steps:
  - paper_id: P000347
    title: 電子反射法の基礎を整理
    significance: Apolloの観測と軌道計算から、反射の分布を磁場・電位へ結ぶ方法を示した。
  - paper_id: P000351
    title: 全球の地殻磁場を地図化
    significance: Lunar Prospectorで盆地内部と対蹠域の磁場分布を比較した。
    connection: 局所の観測から全球の磁場分布へ
  - paper_id: P000352
    title: 細かな磁場への感度を評価
    significance: 全軌道計算で磁場の空間尺度と電子反射法の感度を対応付けた。
    connection: 全球マップの解釈に適用条件を加える
- title: 月面の負帯電から、電位の基準とシース構造へ
  steps:
  - paper_id: P000003
    title: ロスコーンと二次電子で負帯電を捉える
    significance: 探査機に対する日陰の月面電位を電子分布から推定した。
  - paper_id: P000379
    title: 電位構造の厚さを制約
    significance: 有限旋回半径による推定電位の角度依存を、夜側の空間尺度の診断に使った。
    connection: ロスコーンの電位推定から、断熱近似の限界を利用した構造推定へ
  - paper_id: P000025
    title: 探査機電位を補正
    significance: 周囲のプラズマ基準で月面電位と入射電流を比較した。
    connection: 探査機との電位差から周囲のプラズマ基準へ
  - paper_id: P000034
    title: ARTEMISで日照面からの放出電子を測る
    significance: 遠方で測った加速電子から負電位を推定し、非単調シースの解釈を検討した。
    connection: 基準を補正した電位推定を日照面のシース構造へ
- title: 火星の大気中の反射から、上層の電位差へ
  steps:
  - paper_id: P000354
    title: 電子の大気中輸送をモデル化
    significance: 磁気ミラー・電位・衝突を含めて火星の電子分布を解析する枠組みを整理した。
  - paper_id: P000356
    title: 外気圏上の電位差を統計化
    significance: MGSの電子反射から約185–400 km間の磁力線方向電位差を求めた。
    connection: 電子輸送の解析を電位差の空間・時間変動へ
- title: 火星の磁場推定を全球地図へ
  steps:
  - paper_id: P000353
    title: 大気を持つ火星へ適用
    significance: 電子の大気吸収を組み込んで地殻磁場を推定した。
  - paper_id: P000382
    title: 高度170 kmの全球分布を整理
    significance: 北部低地の弱い磁場源と盆地の磁気的特徴を地図化した。
    connection: 初期の手法実証から全球の地質比較へ
  - paper_id: P000355
    title: 輸送モデルと処理を改良
    significance: 高度185 kmの改良マップを火山活動と古ダイナモの議論へ用いた。
    connection: 大気輸送・補正の改善を全球磁場の解釈へ
- title: 反射電子の吸収を熱圏の密度観測へ
  steps:
  - paper_id: P000381
    title: 既知磁場から中性密度を推定
    significance: 磁気反射の大気減衰を逆に利用し、夜側密度の季節変動を求めた。
  - paper_id: P000384
    title: 南半球で4火星年を追跡
    significance: 手法を改善して密度変動の長期系列を得た。
    connection: 初期の密度推定から観測期間と解析法を拡張
  - paper_id: P000385
    title: 大循環モデルを検証
    significance: 夜側の季節・年々変動をモデルと比較し、冷却・循環の再現性を検討した。
    connection: 長期ER密度を大気モデルの制約へ
- title: ガニメデの粒子観測から、将来解析の帯電補正へ
  steps:
  - paper_id: P000357
    title: 高エネルギー粒子から固有磁場を制約
    significance: Galileoのロスコーンでガニメデの表面磁場を制約した。
  - paper_id: P000359
    title: JUICEに向けて表面帯電を計算
    significance: 将来の低エネルギー電子反射解析で必要になる電位補正をモデルで検討した。
    connection: 磁気ミラーの観測から低エネルギー側の電位影響へ
public: true
scope:
  include:
  - 磁気ミラーとロスコーンによる磁場推定
  - 電子反射・放出電子を使う電位推定
  - 月・火星・ガニメデの解析条件と関連する陽子反射法
  - 電子の大気吸収を用いた火星熱圏の中性密度推定
  - 反射解析に用いる電子分析器と磁場接続の診断
  exclude:
  - 物質の表面分析に用いる電子反射・回折
  - 電子観測を使わない磁場推定の網羅的な一覧
  - 材料・半導体の寸法計測で同名を用いるelectron reflectometry、LEER・LEEM・RSAES
