- paper_id: P000010
  group: grain-charging
  role: 粒子間電場と導電性
  summary:
    question: 粒子間の局所電場はどこまで強くなり、何がその上限を決めるか。
    method: 光電子放出と太陽風による差動帯電を、導電性を含む一次元モデルと固定粒子群の三次元計算で調べた。
    contribution: 粒子間の強い電場と小さな正味電荷が両立し、導電性が局所電場の上限を左右すると示した。粒子の離脱は計算していない。
