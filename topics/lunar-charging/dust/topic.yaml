schema_version: 1
topic_id: lunar-charging-dust
title: 月ダストの帯電・付着・静電輸送
question: 電子放出と粒子電荷、微小な隙間での帯電、付着面からの離脱と上空への輸送。
review:
- heading: 月試料の力学と帯電を、輸送の全体像へつなぐ
  paragraphs:
  - '[@P000256]の総説はApollo試料の力学特性と帯電・輸送研究を結び付け、離脱時の電荷分布や微小粒子の実験不足を当時の課題として挙げた。[@P000249]はダストの生成、粒子の物性、移動経路、探査への影響まで整理する。以下では材料の電子放出、接触が破れる条件、飛翔中の電荷変化を順にたどる。'
- heading: 光電子と二次電子は、粒子ごとに出入りする
  paragraphs:
  - 月ダストの帯電を定量化するには、電子放出と粒子電荷を測る必要がある。[@P000021]は月試料などの帯電、[@P000005]は単粒子の光電子放出、[@P000037]は模擬レゴリス表面の粒子電荷を扱う。VUV照射下で正負両方の粒子を測った[@P000052]は、粉体の平均電位だけでは個々の電荷を代表できないことを示す。材料の電子収率は[@P000053]から参照できる。
  - 電子衝撃に対しては、[@P000166]がApollo 17の単粒子と2種類の模擬粒子を20–90 eVで比較した。電荷から推定する二次電子収率は材料によって異なり、模擬試料の選択を考える基準になる。
    光電子・二次電子放出をまとめた[@P000243]と、真空中の単粒子光帯電[@P000265]、光帯電と摩擦帯電の比較[@P000266]を合わせると、放出と接触の双方から粒子電荷を考えられる。模擬粒子同士の[@P000254]と異種材料との[@P000255]は、接触相手の違いを調べる入口になる。
- heading: 付着した粒子が離れるまで
  paragraphs:
  - 離脱に必要な力を見積もるには、月ダストの付着・凝集機構[@P000208]と技術報告[@P000209]を、遠心法の測定[@P000210]や真空・UV条件の付着試験[@P000211]へ対応させる。Apollo試料とJSC-1Aの三次元形状[@P000218]は、粒径・空隙・接触の幾何を与える資料になる。
  - プラズマ中の粉体の縁で起こる移動（[@P000026]）や、電子照射による基板との帯電差（[@P000029]）は、局所電場の役割を示した。[@P000009]のpatched
    charge modelは粒子間の空隙に再吸収される電子を扱い、[@P000043]はその帯電を浮遊モデルへ、[@P000013]は粒子と基板の隙間へと展開する。UV照射と付着力を扱う[@P000040]、光とプラズマの同時照射を扱う[@P000014]も、離脱条件を調べる実験として並べられる。電荷が残る時間には導電性（[@P000010]）も効き、粗い表面の研究方針（[@P000047]）や内部への蓄積モデル（[@P000057]）へ論点が広がる。
  - この放出過程を除塵へ使う[@P000164]では、VUVと電子ビームを布上の模擬粒子へ同時に照射した。VUVで移動開始の条件が下がるという結果は、太陽に似た波長分布・月面より高い光強度の実験から得られている。
  - 外部電場を加える[@P000215]では、光電子の軌道と粒子離脱が電場の向きに応答した。[@P000216]は局所電荷のゆらぎから求めた力を付着モデルと比較するが、離脱の成否は仮定した電荷・配置・粗さ・清浄度に依存する。斜入射電子ビームの[@P000250]は、照射側と陰側の帯電差を粒子の移動方向へ結び付けた。
  - 機器への応用では、受動表面の比較[@P000257]、ZnO薄膜とテクスチャ[@P000258]、導電性ポリイミド[@P000259]で付着を変える方向と、UVを電場による除塵に併用する[@P000260]がある。粒子を保持する力と電場が与える力を、各実験の材料・照射条件で比較する。
- heading: 地平線光から、上空のダスト分布へ
  paragraphs:
  - Surveyorの地平線光（[@P000019]）は、低高度のダストを考える出発点になった。[@P000022]は電場で加速された粒子の噴水モデル、[@P000042]は環境条件と浮遊の関係を扱う。LDEXでは、高度3–250
    kmの測定範囲で浮遊ダストに上限を置く[@P000039]と、薄明クレーター付近の局所的な増加を論じる[@P000044]がある。それぞれの粒径・高度・地形を対応付けることで、離脱機構と輸送先を比較しやすくなる。
    日夜境界の電場を扱う[@P000221]と、クレーター寸法によるシース変化を測る[@P000263]は、飛び出した粒子が通る場を具体化する。シース中の粒子浮遊実験[@P000267]も、位置と電場の対応を読む比較対象になる。
- heading: 飛翔中の電荷と、離脱前の履歴
  paragraphs:
  - 粒子への捕集電流は[@P000233]の理論にさかのぼれる。電子・イオンが一つずつ出入りする電荷ゆらぎを扱う[@P000237]と、その確率分布を求める[@P000238]は、連続量としての電荷を使う条件を考える基礎となる。凝集体では、見通しによる捕集[@P000239]、電子放出を含む帯電[@P000240]、離散的な帯電[@P000241]を組み合わせて読む。不規則形状の測定[@P000242]は、どの球形近似が粒子電荷を表せるかを検討する。
  - 粒子が動く間にも電子とイオンは出入りする。[@P000167]は光電子シース中の軌道を連続・離散帯電で比べ、希薄プラズマでの静止浮遊や繰り返す跳躍の成立条件を調べた。着陸時の[@P000165]では、噴射中の衝突で得た摩擦電荷が、停止後にプラズマとの平衡へ緩和する過程を追う。どちらも、運動と同じ時間軸で電荷を扱う点が比較の軸になる。
  - 集団の応答を考える文献には、光電子シース中のダスト音波の非線形発展[@P000268]、太陽系ダストプラズマの電荷変動と散逸[@P000269]、電荷ゆらぎによる微粒子加速[@P000270]がある。単粒子の軌道から集団の波動へ対象を広げる際には、粒子密度と帯電時間を対応させる。
- heading: 浮遊条件から、離脱初速と方向へ
  paragraphs:
  - 光電子シースと粒子運動を計算した[@P000007]は、飛翔中の電荷変化と浮遊条件を考える前段となる。動的帯電を扱う[@P000167]との比較では、表面接触の破断を別の過程として扱う。真空実験の[@P000314]・[@P000315]は、局所帯電と粒子間反発を初速・到達高度へ結び付ける。[@P000316]は射出角と粒径の分布を追加し、斜長石を使う[@P000317]は速度と直径の関係から帯電モデルを制約した。飛翔中の帯電、離脱の条件、離脱直後の速度を合わせることで、輸送計算の入力を具体化できる。[@P000217]の日照域での打ち上げ速度の評価も、この初期条件を考える文献となる。
lineage:
- title: 飛翔中の帯電と輸送
  steps:
  - paper_id: P000022
    title: 電場による上昇と落下をモデル化
    significance: 粒径と帯電条件から、ダストが到達する高さを噴水モデルで予測した。
  - paper_id: P000167
    title: 電荷の時間変化と離散性を入れる
    significance: 光電子シース中で帯電と運動を連成し、電子の出入りが軌道を変える条件を調べた。
    connection: 固定した電荷から飛翔中の変化へ
  - paper_id: P000165
    title: 着陸時に得た電荷の履歴を追う
    significance: プルーム停止後も摩擦電荷が残り、微粒子の輸送予測を変える過程を計算した。
    connection: 動的帯電を自然シースとプルームで比較
- title: 粒子が離脱する電荷を探る
  steps:
  - paper_id: P000029
    title: 放出率の違いでダストを動かす
    significance: 電子照射下で基板と粒子の帯電差が電場を作り、移動や離脱を促すことを実験で示した。
  - paper_id: P000009
    title: 粉体の空隙に電子を集める
    significance: 電子の再吸収で粒子の局所電荷を増やすPCMを提案し、跳躍の機構を説明した。
    connection: 基板との電位差から粒子間の帯電へ
  - paper_id: P000014
    title: 光とプラズマの同時照射へ広げる
    significance: 同時照射で粒子の飛び出しと推定負電荷が増え、charge pumpingで説明できることを示した。
    connection: 単独照射から複合的な環境へ
- title: 局所帯電から離脱初速・角度へ
  steps:
  - paper_id: P000314
    title: 微小空洞の帯電と離脱高度を比較
    significance: シリカの真空実験を粒子間反発と表面電場の予測へ照合した。
  - paper_id: P000315
    title: 初速の粒径・形状依存を測る
    significance: 離脱直後の速度分散と最大初速の粒径依存を示した。
    connection: 到達高度の評価から輸送の初期条件へ
  - paper_id: P000316
    title: 射出角と距離ごとの粒径を測る
    significance: 高速度撮影と捕集から粒径・角度・距離を結び付けた。
    connection: 初速に加え射出方向と運ばれる粒子を制約
  - paper_id: P000317
    title: 斜長石粒子で電荷モデルを比べる
    significance: 速度と直径の関係から局所帯電・表面微細構造の寄与を絞った。
    connection: シリカ等の実験から月面鉱物に近い試料へ
