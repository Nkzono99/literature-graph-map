- paper_id: P000207
  group: roughness
  role: 粒子接触と凝集体の構造
  summary:
    question: 星間空間や原始惑星系円盤で、接触部に働く接線方向の力はダスト凝集体の成長や衝突後の構造をどう変え、構造を変えずに付着する近似はいつ妥当か。
    method: 接触部の接線力に関する既存理論を整理し、凝集過程と凝集体の衝突を詳細に数値計算した。構造の組み替えに要する臨界エネルギーで衝突結果を説明した。
    contribution: 単粒子の付加による成長では通常大きな再構成が起きず、そのまま付着する近似が概ね妥当だった。凝集体同士や大粒子との衝突は、大きな圧密を起こし得た。
  evidence_by_item:
