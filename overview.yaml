review:
  - heading: 地形・組成・地下構造から、月の履歴を読む
    paragraphs:
      - 月の形成史と現在の表面環境を調べるには、異なる観測が捉える空間と時間を重ねる必要がある（[@topic:lunar-environment]）。地形・地質・内部構造の研究では、表面に残る形、物質の分布、地下の層序を手掛かりに、月がどう変化してきたかを読む（[@topic:lunar-geology]）。地形と重力の組合せは地殻構造を、分光と返還試料は鉱物・元素組成を制約する（[@topic:lunar-geodesy-interior]、[@topic:lunar-mineralogy]）。
      - クレーターの分布は表面年代の推定に使われ、溶岩の層厚や試料の記録と合わせて火山活動の時期と量を考える材料になる（[@topic:lunar-craters]、[@topic:lunar-volcanism]）。縦孔の画像や地下レーダーは、浅部の層や空洞の存在・形状を調べる入口となる（[@topic:lunar-subsurface]）。かぐやは地形・重力・分光・レーダー・粒子・磁場の観測をそろえ、これらの研究を共通の月の姿へ結び付けた（[@topic:kaguya]）。
  - heading: 太陽風と光が、月面電位と物質の移動を変える
    paragraphs:
      - 月面に流入する電子・イオンと、表面から放出される電子の電流収支が、表面電位を決める。周囲には電位が空間的に変わるシースが生じ、次に表面へ届く粒子も変わる（[@topic:lunar-charging]、[@topic:lunar-charging-sheath]）。月面や軌道からの粒子・電場観測は、その電位とプラズマ環境を確かめる手掛かりになる（[@topic:lunar-charging-observations]）。
      - 地形による光・太陽風の遮蔽と、地殻磁場による粒子軌道の変化は、場所ごとの照射や帯電を考える条件になる（[@topic:lunar-charging-topography]、[@topic:lunar-magnetic-anomalies]）。水・揮発性物質の研究では、表面の水和、粒子に保持された分子水、極域の氷を分け、供給・保持・喪失を調べる。ここでも日照、温度、粒子照射が観測の解釈に関わる（[@topic:lunar-water]）。
      - "ダストの静電輸送では、帯電、接触の破断、飛行中の電荷変化を同じ条件でつなぐ必要がある（[@topic:lunar-charging-dust]）。実験で得る堆積の拡がり、回収粒子の電荷、規格化した粒径分布は、離脱率や総輸送量とは測る量が異なる。上空ではLDEXが衝突噴出物と解釈される雲を捉え、別の検出方式で微小ダスト密度に上限を置いた。粒径・速度・高度・地方時を対応させることが、モデルと観測を比較する条件となる（[@topic:lunar-charging-observations]）。機体表面の電位差、静電放電、機器・宇宙服への付着対策は、これらの過程を探査へ結び付ける（[@topic:lunar-charging-engineering]）。"
  - heading: 帯電と粒子輸送を、共通の基礎過程から考える
    paragraphs:
      - 月面で起こる現象は、表面への粒子流入、電子放出、希薄な領域への膨張というプラズマの基礎過程ともつながる（[@topic:plasma-processes]）。シースの理論は電位と流入電流の関係を、二次電子放出の研究は材料・入射条件に応じた放出と再捕集を扱う（[@topic:plasma-sheaths]、[@topic:secondary-electron-emission]）。
      - 真空や物体の背後へプラズマが入ると、電子とイオンの運動の違いから電荷分離と電場が生じる（[@topic:plasma-expansion]）。空洞や微細構造では、形状によって届く粒子が変わる。寸法とデバイ長、流速と熱速度の比を比べると、月の地形と加工用の溝に共通する問題を整理できる（[@topic:plasma-cavities]）。
      - "ダストの基礎では、電荷の獲得と表面との接触を合わせて考える（[@topic:dust-physics]）。捕集電流から粒子電荷を求める理論は、離散電荷、凝集体、不均一な帯電へ広がる。遮蔽を含む理論とPICの比較は、浮遊電位の一致が電荷や電流の一致を保証しないことを示す。接触・照射の履歴も、個々の粒子の電荷分布を変える（[@topic:dust-charging]）。付着・接触の研究は、表面エネルギー、粗さ、粒子形状から離脱に必要な力を調べる。凝集と重力が競合するモデルの粒径選択性を実験と照合する際も、電荷・電場・接触条件を対応させる。モデルから逆算した値と、独立した測定値を区別する必要がある（[@topic:dust-adhesion]）。"
  - heading: 数値計算では、粒子と場の結合・境界条件を確かめる
    paragraphs:
      - 観測や実験で直接追いにくい粒子分布と電場の変化を、数値計算で調べる（[@topic:numerical-methods]）。PIC法は、計算粒子の運動と格子上の場を結び付ける。シース、ウェイク、磁気異常、ダスト帯電の計算でも、保存則、数値誤差、粒子と場の更新方法が結果を比較する条件になる（[@topic:pic]）。
      - 静電計算では、電荷密度からPoisson方程式を解いて電位・電場を求める。自由空間、周期境界、電位を指定した壁では解く問題が異なるため、対象の形状と外部環境に合う解法を選ぶ必要がある（[@topic:poisson-solvers]）。
  - heading: 基礎過程を、計測・機体設計・微細加工へつなぐ
    paragraphs:
      - プラズマと物体の相互作用は、宇宙機の設計と天体の計測にも関わる（[@topic:applications]）。機体の帯電・シース・ウェイクは、探針や電場センサの観測を変えるため、機体と周囲のプラズマを合わせて扱う（[@topic:spacecraft-plasma]）。電子反射法は、戻ってくる電子のエネルギー・方向分布から、天体の磁場や電位を推定する。月での観測から火星・ガニメデへの応用をたどれる（[@topic:electron-reflectometry]）。
      - 微細加工では、溝や穴への粒子流入と局所的な帯電が、表面反応や加工形状に結び付く。粒子の種類・エネルギー・入射角度と材料の反応を対応させることで、宇宙の表面環境とも共通する過程を、異なる条件で比較できる（[@topic:plasma-processing]）。
