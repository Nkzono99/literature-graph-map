- paper_id: P000276
  group: mission
  role: LRSの装置・観測方法
  summary:
    question: 月の地下層構造や太陽風と月の相互作用を調べるため、かぐや搭載LRSでどのようなレーダー探査と自然波観測を行うか。
    method: 4～6 MHzのレーダーによる地下探査と、自然電波・プラズマ波の受動観測を行い、LRSの装置設計・運用と初期成果を整理した。
    contribution: 月の表側の海で深さ数百mの反射面を検出し、玄武岩に覆われた埋没レゴリス層と解釈した。地球・木星の電波も捉え、月の後流境界を含む電子密度分布を推定した。
