- paper_id: P000171
  group: geology
  role: TCの小クレーター計数による裏側海のモデル年代と再舗装
  inspection:
    level: full_text
    version_id: V2
    checked_by: ai
    checked_at: '2026-10-13'
    recheck: false
  summary:
    question: 月裏側の露出した海の年代はどこまで若く、クレーター径頻度は古い表面の再舗装を示すか。
    method: かぐやTCの約10 m画像でSPA盆地・Moscovienseの海のクレーターを手作業計数し、長い影・明瞭な二次クレーターを除外する。Neukumの生成関数と年代曲線に径範囲ごとに当てはめて表面のモデル年代を推定する。
    contribution: 5領域に2.44–2.58 Gaの若いモデル年代を見いだし、Apollo Nなどの大小クレーターで異なる年代曲線から部分的な再舗装を示唆した。多くの海の3.0 Ga以前の形成と若い活動の継続を分け、約2.5 Gaの活動集中には継続的な被覆という代替解釈も残す。
  evidence_by_item:
