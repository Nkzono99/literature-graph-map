- paper_id: P000008
  group: topography
  role: 極域への太陽風侵入
  summary:
    question: 永久影の月極域クレーターへ太陽風が侵入する際、表面帯電とプラズマ膨張はどう影響し合うか。
    method: 段差状の影領域を二次元の粒子運動論シミュレーションで表し、表面電荷の蓄積と二次電子放出を自己無撞着に計算する。
    contribution: 表面帯電と両極性膨張の負のフィードバックが準定常な後流を作り、その構造と底面への陽子流入を二次電子放出が調整すると示した。
  evidence_by_item:
