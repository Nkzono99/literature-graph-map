lineage:
- title: 機体の帯電を空間分布で解く
  steps:
  - paper_id: P000120
    title: 複雑な機体と周囲の場を計算
    significance: 表面物性と回路結合を含む形状モデルから、表面帯電・空間電位・イオン軌道を計算するモジュール構成を整理した。指定した静止軌道例の300
      s後に面ごとの電位（約−7～−10 kV）、イオン軌道とbarometric電子によるウェイク電位、既知プルーム密度と指定境界電位からの空間電位を示す。PICは利用可能な機能として紹介されるが、本版の例に動的PIC検証は含まれない。
    connection: ''
  - paper_id: P000122
    title: 強い光電子放出下の負帯電を説明
    significance: 放出電子を戻す電位障壁とイオンウェイクが、太陽近傍の負帯電を維持する条件を示した。
    connection: 太陽近傍の放出シースへ
  - paper_id: P000121
    title: 同じ機体条件で予測を比較
    significance: Solar Probe Plusの簡略モデルを5つの計算で解き、物理過程の扱いと予測差を照合した。
    connection: 複数コードで帯電予測を比べる
- title: 電場計測と機体の影響
  steps:
  - paper_id: P000126
    title: 電位差から電場を測る原理を整理
    significance: 同一電極の共通浮遊電位を差電位で相殺する設計原則を定量化し、バイアスは測定球の寸法と速度感度を下げても装置全体を大きくし、プラズマ勾配と表面パッチの誤差が残ることを示した。刊行版の計算は理想化した桁の見積もりである。
    connection: ''
  - paper_id: P000124
    title: 機体とブームが作る信号を再現
    significance: Cluster周囲のPICで、ウェイクの見かけの電場と光電子分布による短絡効果を示した。
    connection: 測定原理から実際の機体形状へ
  - paper_id: P000125
    title: センサ応答をプラズマ波と結ぶ
    significance: "完全導体棒の三次元電磁PICで、抵抗ピークをセンサ全長の半波長に対応する波数と波動分枝の交点に結び付けた。垂直配置のUHR/ECHと平行配置のLangmuir、角度に依存する高調波構造を示す。実機の機体・ブームは今後の課題。"
    connection: 静的な電位差から周波数応答へ
