review:
- heading: 高さと重力の組合せから、地殻の厚さを推定する
  paragraphs:
  - レーザー高度計による[@P000169]は全球の地形を与える。[@P000170]は、地球から直接追跡しにくい裏側の重力をリレー衛星経由で測り、表裏の盆地が異なる重力構造を持つことを示した。
  - '[@P000180]は、この地形と重力から地殻厚を計算した。地殻厚は密度や補償の仮定を介した推定量なので、観測された高度・重力とモデルの条件を合わせて参照する。'
- heading: 重力の空間分解能が、探せる地下構造を変える
  paragraphs:
  - GRAIL重力を使った[@P000194]は、長く細い質量欠損を空洞の候補として抽出する。衛星軌道と検出法によって感度の高い方向・寸法が異なるため、縦孔の画像やLRSの地下反射との対応が解釈を補う。
- heading: 密度構造から、衝突破砕とマグマの貫入を探る
  paragraphs:
  - '[@P000301]はGRAILとLOLAを二層モデルで解釈し、月裏側の多孔質な上層と密な下層を推定した。[@P000307]はOrientaleの地下構造を衝突後の流動と断層形成で説明する。[@P000289]では大型火山候補に伴う重力異常を貫入岩体と解釈しており、同じ重力でも地質条件に応じた密度モデルが必要になる。'
- heading: 月震波形で震源と浅部構造を調べる
  paragraphs:
  - '[@P000304]は反復する浅発月震を見いだし、すべり方向と潮汐位相の関係を調べた。[@P000300]はP波の偏波とS波・P波の時刻差から、単一観測点で震源を求める。前者は断層の起動、後者は定位手法に焦点を置く。'
  - 浅部探査を扱う[@P000302]は、空洞の検出に使う常時微動の周波数と寸法感度を比較した。試料の熱履歴を使う[@P000299]は、Apollo 17コアから地中の温度勾配を求める。地震波と熱の記録を合わせることで、重力だけでは決まらない浅部の性質を補える。
- heading: 若い試料の磁化から全球磁場の停止を制約する
  paragraphs:
  - '[@P000288]は月裏側起源と推定される隕石の古地磁気を測り、若いApollo試料と比較した。約7億年前の弱い磁場の記録は、過去約10億年間に全球的なダイナモ磁場がなかった可能性を支持する。試料の起源と記録年代を踏まえて内部活動の時間史を読む。'
lineage:
