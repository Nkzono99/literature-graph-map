entries:
- paper_id: P000085
  group: foundations
  role: シース理論の見取り図
  summary:
    question: 壁・吸収探針/粒子・放出面で、粒子の供給と境界条件をどう指定すれば、電位・密度・表面電流と非単調シースを自己無撞着に求められるか。
    method: 定常Poisson方程式を、生成・運動量損失を含む流体モデル、生成地点と吸収軌道を積分する運動論モデル、放出粒子の反射/通過を分ける密度モデルへ組み合わせる。流体/運動論の数値例と既往の実験・PICを区別して比較する。
    contribution: 同じシースでも供給源、形状、放出、衝突で電流・遮蔽・入口条件が変わることを整理する。Bohm速度だけでは入口電場を定めず、OMLの軌道障壁とChild–Langmuir則の初速・電場条件を明示し、月面の非単調電位を表面電流と上流準中性の両収支につなぐ。
