- paper_id: P000039
  group: environment
  locked_fields: []
  role: LDEX積分電流による浮上ダスト密度の上限
  summary:
    question: LADEEのLDEXが測る積分電流から、月上空の微小ダスト密度にどのような上限を置けるか。
    method: 高度3–250 kmのLDEX観測から背景電流を差し引き、ダスト衝突と低エネルギーイオンが残る信号を解析した。粒子半径0.1 µmを仮定し、各境界通過時の機体速度を用いて、残差信号をすべてダストとした密度上限へ換算した。
    contribution: 日の出側の測定で、太陽風中では約100 m⁻³、磁気圏尾部では約40 m⁻³の密度上限を得た。この粒径・速度・高度の条件ではApollo期の高密度雲を支持せず、高度3 km未満の局所輸送は観測範囲の外に残る。
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-08'
