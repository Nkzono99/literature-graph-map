- paper_id: P000015
  group: topography
  role: 空洞寸法とシース厚
  summary:
    question: 空洞の大きさが表面シースの厚さをまたぐと、底部の正帯電はどう変わるか。
    method: PIC計算で空洞の入口幅5・30・100 mと深さ対幅比を変え、表面電荷と内部の空間電荷の寄与を比較する。
    contribution: シースより小さな空洞では強い正帯電が生じ、大きな空洞では側壁付近のシースが電子の底部への供給を助けて正電位を緩和すると示した。
