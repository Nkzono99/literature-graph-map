schema_version: 1
topic_id: lunar-water
title: 月面の水・揮発性物質
question: 月面のOH・分子水・氷は、どこで生まれ、何に保持され、どの環境で失われるか。
synopsis:
- 月面の水には、鉱物に結び付いたOH、分子水、極域の氷という姿がある。広域の水和（[@P000138]）、分子水の識別（[@P000141]）、永久影の露出氷（[@P000140]）とLCROSSの掘削物質（[@P000139]）は、観測波長と捉える深さが異なるため、分布と量を分けて読む。
- 供給は太陽風の水素注入と火山由来の水に分かれ、注入後の保持と加熱による放出（[@P000148]、[@P000142]）が経路を結ぶ。損失は温度に敏感で、固相の保持理論（[@P000324]）、微小コールドトラップ（[@P000147]）、粗さと熱脱離（[@P000143]）が残りやすい場所を与える。
- 地形と磁場は水素の供給と氷の損失を同じ場所で変えるため（[@P000144]、[@P000146]）、正味の氷量は供給・温度・損失を合わせないと決まらない。氷の量は地盤の強さ（[@P000292]）や着陸機の排気（[@P000303]）とも関わる。
review:
- heading: 吸収帯から、月面の水の姿を分けて読む
  paragraphs:
  - 月面の「水」には、鉱物に結び付いたOH、分子水H2O、極域にある氷などの姿がある。[@P000138]はChandrayaan-1のM3で2.8–3.0 μm付近の吸収を捉え、OH/H2Oに対応する水和が広く分布することを示した。分子水に固有な6
    μm帯を使ったSOFIAの[@P000141]は、日照のある高緯度の観測域でH2Oを識別した。観測波長と、どの深さを捉える観測かを確認すると、表面の水和、粒子に保持された水、氷の分布を整理できる。
  - "[@P000141]はSOFIAの6 μm帯でClavius付近の日照域の分子水H₂Oを識別し、レゴリス当たり約100–400 μg/gと推定した。海の参照域にも水があれば差し引かれるため、この値は下限である。観測した狭い緯度範囲の分布はTycho放出物など局所地質の影響を受け、全球的な緯度傾向とは分けて読む。ガラス内部や遮蔽された粒子間空隙への保持は、温度と既報の吸着水モデルを踏まえた推論であり、観測だけでは両者を区別できない。較正・処理・個別量を補う別Supplementary Informationは未取得・未読であり、量と誤差は本文・Methodsに記された推定として読む。"
- heading: 極域の氷を、分光と衝突噴出物から捉える
  paragraphs:
  - "永久影の内部には周囲からの散乱光がわずかに届く。[@P000140]はその光の近赤外スペクトルから氷の吸収を抽出し、両極の光学的表層に露出した氷の分布を示した。一方、LCROSSの[@P000139]はCabeusクレーターへ衝突体を落とし、掘り出された物質の水蒸気・氷・OHを観測した。前者は露出氷の空間分布、後者は一地点の掘削された物質に含まれる水と揮発性成分を知る手掛かりになる。氷の存在とその場所の物質量を考える際に、二つの観測の違いが役立つ。 かぐやSPの[@P000280]は、異なる地方時・緯度の日陰で水氷粒子候補を検討した。永久影の長期保存と、一時的な日陰での分光解釈を、温度と照明の条件から読み比べられる。"
  - "[@P000280]は、極域の永久影に限らない昼間の地形影に水氷候補を見いだした。1.5 µm帯の吸収深さは朝夕とも明暗境界へ向かって増すが、ノイズで割った指標の夕方の傾向は緯度帯で異なる。吸収は表面の霜層と浮遊粒子の両方で一部説明され、照明・散乱モデルを仮定した粒径と柱質量の推定が与えられる。両モデルで1.25 µm帯を再現できず、粒径と量にも縮退があるため、吸収の朝夕対称性から水量の一致や輸送経路を決めることはできない。永久影の長期貯蔵と一時的な影の保持をつなぐ観測候補として読む。"
  - LCROSSの[@P000139]はCabeusの永久影へ衝突体を落とし、噴出物の1.5・2.0 μm帯から氷、1.87 μm帯から水蒸気を識別した。視野内の水蒸気と氷は最大155±12
    kgで、推定した日照噴出ダスト量に対する平均水量は5.6±2.9%だった。露出氷の分布を調べる観測に対し、一地点の掘削された物質の化学形態と水量を与える。
  - この水量は、粒径・密度・照明と視野充填率を仮定したダスト質量に依存する。衝突で温まった地面からの蒸気も加わり、噴出氷粒子の昇華と分けにくい。中性子観測と比べる場合は、掘削深さと10
    km以上の観測範囲の違いも含めて読む。氷の存在の分光的識別と、濃度・極域貯蔵量の推定を分けると、保持や輸送の研究へつなぎやすい。[@P000139]
  - "[@P000328]の偏波レーダーは散乱特性から氷候補を探る。高CPRには岩塊・粗さも寄与するため、[@P000327]の永久影岩塊検出と照合する。[@P000329]・[@P000330]は観測統合と機械学習へ進む方法であり、氷有望度の推定と氷の直接同定を区別する。"
  - "[@P000329]は、両極10°以内の240 m/pixelで、熱・地形・永久影・永久影からの距離など8モダリティから0–1の氷存在見込み指数を回帰した。ImageNet済SwinV2-Bのtest RMSEは0.0377±0.0004、R²は0.9808±0.0004（5 seed平均±標準偏差）。targetは上部約1 mの氷を想定関係と調整可能な重みから推定したモデル産物なので、成績は指数再現性を示し、独立した氷量測定の精度は別途確認を要する。本文と氷データカードが記す総数162と108/24/25 splitの合計157には未解決の差がある。"
  - "[@P000330]は、両極の240 m/pixelの8入力から、物理条件のファジー重ね合わせで作った0–1の氷有望度マップを回帰した。25枚のtestに対しRMSEは0.0293±0.0013で、SwinV2の0.0377±0.0004より低かった（5乱数種）。方位・傾斜・氷安定深度の3入力でもRMSE0.0434±0.0006となり、8入力ConvNeXtの0.0437±0.0002と近かった（別の3乱数種実験）。これは既存の計算有望度の再現性能を評価した結果で、氷濃度の実測精度を示すものではない。要点は未査読のarXiv:2609.13283v1原稿に基づく。"
  - "[@P000328]はHermite-AとPearyの内部で高CPRと体積散乱の優勢を報告し、氷を含みうるレゴリスと整合する候補に位置づけた。Hermite-Aの約74%という体積成分は散乱パワー比であり、氷含有量ではない。粗さ、岩片の多重散乱、地下不均質、斜面の観測幾何でも同様の応答が生じるため、偏波分解とCPRを合わせても氷の確証には至らない。熱・照明・中性子観測とのROI単位の統合は今後の課題である。"
  - "[@P000140]は、間接照明を受ける陰影のM³スペクトルに1.3・1.5・2.0 μmの吸収がそろうことから、両極の光学的表層（数mm未満）に露出した水氷を識別した。cold trapの吸収検出割合は約3.5%で、年最高温度110 K未満でも検出されない場所がある。LOLAとDiviner、南極のみLAMPとの整合は分光解釈を補う。約30 wt%の氷量は粒子密混合を仮定したモデル解釈であり、偏在の原因として極移動・供給の遅さ・衝突攪拌を提案するが、年代や供給速度を直接測った結果ではない。"
- heading: 太陽風の水素が入り、ガラスや鉱物に残る
  paragraphs:
  - "[@P000148]はChang’e-5土壌から選別した衝突ガラスを分析し、縁ほど水量が多く水素同位体比が太陽風に近い分布を示した。分析点のH₂O換算量は約0–1,909 μg g⁻¹に及び、5粒子6測線の分布は形成後の内向き拡散に整合する。シリカガラスの既報拡散係数、360 K、一定の縁濃度を採用した計算は0.5–15年の時間範囲を与え、ガラスを水の補給・貯蔵媒体に位置づける根拠となった。縁の局所的な水量低下は取り込み後の放出を加えるモデルで説明されるが、日々の外圏への供給量や回収効率は測定されていない。極低D計数の同位体比には補足表の割当・背景処理が含まれるため、中心や縁の全点を同じ精度の測定値として扱わない。"
  - 水素の供給と水の放出を結び付けるには、注入後の鉱物が何を保持し、どの加熱で放出するかを分けて考える必要がある。Zhuらは無水に近いかんらん石へ10 Kで5
    keVのD₂⁺を注入し、300 Kまでの緩やかな昇温とCO₂レーザーの短時間加熱を比較した。注入と昇温だけでは気相D₂Oが背景より上に出ず、基底10 Kおよび昇温後300
    Kから約1,400 Kへ達する熱パルス中にD₂Oが放出された。処理後の穴と非晶質リム内の空隙は、保持種から生じた水蒸気が空隙を成長・破裂させる機構を支持する。ただし、固体の約8.6
    eV帯はD₂OとODを区別しないため、注入時にできた水の解放と、保持された水酸基などから加熱時に生じた水の放出は分離されていない。この実験は太陽風由来水素の保持と衝突加熱を結ぶ経路を示し、月の総水量への寄与率は今後の条件別の収率評価に残る。[@P000142]
  - "[@P000336]は鉱物表面の吸着を第一原理計算で調べ、被覆率が増えると金属サイトへの配位に水素結合ネットワークによる追加安定化が加わることを示した。別の水形成経路として、[@P000313]は絶縁破壊で露出する酸素と注入水素の反応を分子動力学で計算している。"
  - "[@P000313]は太陽風を水素源、SEP深部帯電に伴う電場を反応の契機とするモデルを調べた。直径4 nmのSiO₂、約454個のH、初期40 Kの計算で5×10⁶ V/mを与えると、粒子の破砕・加熱によって水が形成され、外場除去と40 Kへの冷却後には水の付着と氷に見られる水素結合構造が残った。初期酸素の約15%が付着H₂Oに入る値はこの特定計算に限られ、破壊時の水損失や他の生成機構との相対寄与、長期保持量は未評価である。冷却率の単位欠落と本文の2A/2B表記の不一致が残る。"
  - 太陽風水素の月面での収支には、植え込みとともに負電荷を帯びて戻る経路も含まれる。[@P000253]はChang’E-6のNILSで局所H−を検出し、反射陽子の角分布と軌道の太陽風フラックスを用いて、入射陽子に対するH−反射率を2.5（−0.8、＋1.2）%と推定した（90%区間）。観測スペクトルの対数正規近似による平均は239
    eVで、約466 eVの上流陽子を基準にすると約49%の損失に相当する。近傍磁気異常と表面電位による局所入射条件への依存があり、水・OHの生成率と結びつけるには別の表面反応・組成の資料を要する。
  - Zhong et al.はWieser et al.のChang’E-6/NILS初検出データを6区間に分け、200 eVから各区間の太陽風エネルギーまでの有意なH−成分が太陽風の法線方向フラックスとエネルギーに応答することを示した。選別した高エネルギー成分の平均250–300
    eVは、太陽風水素の月面後方散乱による生成の解釈を支える。H−と中性粒子の会合脱離によるH2・OH生成は著者が提案した経路で、月水への寄与量は求めていない。[@P000252]
  - "[@P000336]では四種の理想結晶鉱物面で、利用可能金属サイト数に対する約10%被覆率では金属への分子水固定が中心となり、50–100%では水分子間と表面酸素への水素結合が追加安定化に加わると解釈された。MgFeSi2O6(110)の100%平均吸着は−1.16 eV/H2Oとなり、初期の−0.87 eV/H2Oより強い。これは静的DFT総エネルギーと最適化配置から導く機構で、被覆率の月面での実現性、温度依存の滞在時間や水量を直接定める結果ではない。単分子値とのセル・分子数対応、差分値の区間規格化、ICOHPの図表差には未解決点が残る。"
- heading: 内部の水を、火山噴火の条件から制約する
  paragraphs:
  - 表面への太陽風供給に加え、火山由来の水も研究されている。[@P000246]は気泡成長とマグマ上昇を連成し、水の脱ガスが月の爆発的噴火を駆動する条件を求めた。火山ガラスや火砕堆積物の測定とモデルを比較することで、内部の含水量を噴火・表面への供給へ結び付ける。
  - "[@P000463]は火山ガラスの揮発性分析と拡散脱ガスモデルから噴火前の含水量を推定し、[@P000464]はかんらん石中のメルト包有物から脱ガスを受けにくい水を調べた。包有物と噴火後ガラスは異なる保存経路を持ち、相補的に内部の水を制約する。各マグマの推定値を全月の平均含水量へ置き換えないことが、起源論とつなぐ条件となる。"
  - "[@P000464]の高Ti月マグマ包有物は実測水615–1410 ppmを含む。最大含水包有物の結晶化補正後組成を使い、5–30%バッチ部分溶融と地球マントル由来融液に似た分配を仮定すると、その源領域の水は79–409 ppmと推定される。これは一部の月内部の含水量への制約で、月全体の平均や均質性を示すものではない。極域氷への火山起源水の寄与は可能性として提案され、寄与率は定量化されていない。図3の点と本文実測範囲の対応は未確定である。"
  - "[@P000463]は月火山ガラスにH₂O 4–46 ppmを測定し、極低Ti粒子の中心約30 ppmから縁近く約14 ppmへの減少を、内在水が噴火時に脱ガスした証拠と解釈した。単一粒子の冷却・脱ガス逆算による初期水は最適745 ppm、95%信頼水準の下限260 ppmであり、全月の平均含水量ではない。水の衝突後残存と後の集積はこの研究では判別できない。この逆算は破砕前の気泡形成・成長による水の損失を含まない。"
  - '[@P000465]は火砕粒子の飛行・脱水・反射を結び、軌道分光から親マグマの破砕時溶存水を逆推定する。[@P000466]はH₂・H₂O・COを分けて上昇を計算し、採用した範囲ではH₂とCOが強く作用することを示した。水の量と、噴火を駆動する揮発性成分全体を分けると、試料分析と火砕堆積物をつなぎやすい。'
  - "[@P000465]はBirt E・GrimaldiのM³水吸収分布に粒径と輸送中の脱水を組み込むことで、親マグマの破砕時溶存水約400–800 ppmを有力とした。これは三測線の解が重なる範囲で、蒸発・冷却・ガス雲条件を変えた全最適値は246±16–1317±244 ppmに広がる。粒径を解くと固定60–80 µm換算より堆積後の残存水量は平均的に低くなる。破砕前の脱ガスを含めず、源領域の部分溶融にも依存するため、推定値を月マントル全体の含水量へ直接置き換えられない。"
  - "[@P000466]の二種比較では、H₂O–COとH₂–COでガスの主成分と出口条件の感度が変わった。基本条件は最後の10 km、入口41.31 MPa・1700 K・結晶1 vol%で、COの大部分は入口ですでに離溶し、H₂Oは主に浅部、H₂は10–2 kmで徐々に離溶する。H₂OとCO各5–1500 ppmの感度解析ではCOが火口速度・圧力を支配し、H₂2–90 ppmのケースではH₂とCOの効果が近い。ただし実際のH₂/H₂O分配や同じ元素H量への換算は未確定で、測定された水量だけから噴火の駆動力を決めるには、酸素フガシティ・圧力・炭素種の離溶条件を合わせて考える必要がある。"
- heading: 粗さと温度が、残りやすい場所を作る
  paragraphs:
  - "水分子の脱離や氷の昇華は、表面温度に敏感である。極域では[@P000147]がcm規模までの小さな影を評価し、微小コールドトラップも氷の安定領域に寄与すると見積もった。保持の条件は分子によって変わる。Divinerの長期温度データを使った[@P000149]は、さらに低温を要するCO2の安定域を計算している。温度の最大値だけでなく、時間平均した損失を扱う点も参照したい。"
  - "[@P000147]は、LROCの瞬間影を地形・熱モデルで永久影と水氷の保持適地へ変換し、最高温度110 K未満の面積を全月約40,000 km²と推定した。100 m未満の影は約2,500 km²、1 m未満は約700 km²（全体の約2%）を占める。小型トラップは多数だが、大型トラップが面積と幾何学的体積を支配する。極付近では横方向伝導により約1 cmより小さい影の保持能力が失われるという推定で、季節変化を無視し、Gaussian粗面の伝導にクレーターと同じサイズ依存を仮定する。これは氷の検出や資源量の測定ではなく、熱的な保持条件の評価である。要点はarXiv v1原稿と同原稿内Methods A–E・Figs. S1–S10に基づく。"
  - '[@P000143]は、800個の面からなる粗い月面について、影・相互照射・法線方向の熱伝導を計算し、単分子層以下の水の一次熱脱離と結合した。粗さは太陽を向く面の早朝の脱離を促す一方、低温の斜面に一部を残す。残存率は夜明けの水量に対する面積加重平均である。赤道では平坦面が日の出後約5時間でほぼ乾くのに対し、粗面には24時間後にも約20%が残り、粗い地形では5日後まで少量が脱離する。45°Nのξ≳0.2では正午を越えて数%が残り、70°Nのξ≥0.21では約10%が正午まで残った。これらは脱離活性化エネルギーを8×10⁻²⁰
    Jとした既存吸着水の熱脱離計算であり、光や粒子による損失、再吸着を含む実際の水量は別途評価する必要がある。'
  - 低温の保存を考える基礎には、[@P000324]の固相保持理論、[@P000325]のクレーター熱モデル、[@P000326]のDiviner観測がある。[@P000334]・[@P000335]・[@P000339]は熱物性を全球から極低温へつなぎ、[@P000338]は氷の形態によって熱伝導率が変わることを実験で示した。
  - 氷の保存温度を計算する基準として、[@P000334]は乾燥レゴリスの密度・接触伝導率・比熱の深さ/温度依存を整理した。上部4–7 cmの273 K換算熱慣性は平均約55
    J m⁻² K⁻¹ s⁻¹ᐟ²だが、傾斜補正が良好なのは約±60°までで、30 K未満の比熱には追加実験が必要とする。永久影や氷を含む粒子間構造を扱う研究へつなぐ際は、この基準モデルの低温物性と地形条件を改めて検証する。
  - 低温域へ集まった氷の保持を考える基礎に、[@P000324]の固相・気相の収支モデルがある。希薄大気での弾道移動と再凝結を組み合わせ、cold trapの氷損失に蒸発流束による上限を与えた。120
    K・永久影面積0.5%の代表計算では損失が全月面平均で約4 g cm⁻²／10億年となり、100 Kでは約4桁減る。後続のクレーター熱モデルや温度観測へは、cold
    trap温度と面積を場所ごとの分布へ置き換える問題としてつながる。
  - "氷が失われる過程は、起源推定に使う同位体比も変える。[@P000244]は、純粋な六方晶氷と平面表面、蒸気を除去し続ける乾燥条件を仮定し、O・Hの分別係数とRayleigh式から残存氷の組成を計算した。120 K・初期δD＝−800～＋800‰では初期氷の10%損失で9.5～85.7‰の増加を予測し、初期δ¹⁸O＝＋5.64‰・δ¹⁷O＝＋2.94‰の酸素には、0.5%損失でもそれぞれ約0.6／0.3‰の変化を見積もった。温度と損失割合に加え、採取中の昇華を起源解釈へ含める研究である。ただし、既存HDO実験の分別量を再現しておらず、固体氷の十分な混合を仮定する補正量には追加検証が要る。"
  - "[@P000326]は、夏至付近のDiviner観測と地形を考慮した熱モデルを組み合わせ、永久影の表面コールドトラップの周囲にも浅い地下の水氷保存域が広がると示した。昇華損失を10億年当たり1 kg m−2未満とする条件では、南極の表面安定域13,087 km²に対し、深さ1 m以内の安定域は119,507 km²となる。LCROSS地点周囲の昼夜の表面輝度温度は46.7/38.7 Kで、深さ2 cmの年間平均はモデルで約38 Kだった。保存条件を満たす面積が大きくても水が一様に蓄積するとは限らず、著者は中性子観測の南極平均とLCROSS地点の水含有量を比較して局所的な濃集を論じる。極低温レゴリスの熱物性が未確定なため、深い地下の保存体積には大きな不確実性が残る。"
- heading: 地形と磁場が、水素供給と氷の損失を変える
  paragraphs:
  - '[@P000145]はLP・Kaguyaの磁力計観測を高度と分解能をそろえて地図化し、南極Shoemaker・Sverdrup上空に高度20 kmで約4
    nTの磁気異常があり、既報の露出氷推定分布とおおむね重なることを示した。低角度で入射する太陽風を異常が偏向し、既存氷のスパッタ損失を減らす可能性を提案する。ただし地図の水平分解能は約60
    kmで、極域のイオン束低下率や氷寿命の延長は計算していない。太陽風水素の供給を抑える作用と、氷の損失を抑える作用の競合も残る。'
  - 南極クレーターでは、地形によるプラズマの遮蔽が水素の供給と氷の損失を同じ場所で変える。[@P000144]はLOLA地形と解析的な陽子膨張モデルから、壁面に比べ床面の流束が小さく、Shackleton中央約3
    km半径にはほぼ陽子が届かないと予測した。広いクレーターの床面や二次峡谷にも地形に応じた差が残る。著者が500 nm純氷層に面密度10²¹分子 m⁻²と収率0.75分子/陽子を仮定したスパッタリングの例では壁面の除去時間は最短約100年、深い床や峡谷では1万年を超えるが、低流束は水素注入後の水生成も弱めるため、氷の正味の増減を確定するには生成・温度・微小隕石による損失を合わせる必要がある。
  - '[@P000146]は、LOLAの20 m地形製品を1,369 m計算格子へ写像し、軌道磁力計から推定した地殻磁場を完全運動論的PICへ組み込んで、クレーター底への部分的な遮蔽と側壁への粒子集中を示した[@P000146]。名目太陽風を四方向から入れた平均では、磁場あり−なしの差の大きさは上流の種別流束に対して陽子約3%、電子最大10%で、一律な遮蔽より再配分として現れる。生成上限と1質量%氷レゴリスの損失収率を使う縮約収支では、低温PSRが保持に有利な領域となる。表面電荷を追跡せず帯電シースを解かない計算であり、収支の大きさ・符号は採用収率に依存し、惑星間磁場・磁気尾通過と未計算の供給・侵食過程の影響も未評価である。'
  - 低温域では高エネルギー粒子による内部帯電も考慮する。[@P000311]は絶縁破壊による粒子構造の改変を論じた。表面への平均流束を扱う系列に、レゴリス内部の長い電荷散逸時間を加える比較対象となる。
  - 永久影の低温はレゴリスの電荷散逸を遅くする条件でもある。Jordanらの粒子観測を入力した帯電計算は、大規模SEP時の内部電場が既存誘電体の破壊閾値に達し得ることを示し、鉱物境界に沿う破砕が長期に累積する可能性を論じた。氷含有量による物性変化や水の保持・輸送を計算していないため、水循環の定量結果としては使えないが、低温レゴリスの構造変化を考える候補機構となる[@P000310]。
- heading: 氷の量と温度が、地盤への寄与を変える
  paragraphs:
  - 水の存在量を地盤の強さへつなぐには、氷が粒子を結び付ける条件を調べる必要がある。[@P000292]の模擬物実験では、約90 Kで静的安息角が増えるのは氷含有量30重量%を超える条件だった。数重量%の氷があるだけで強い凝集を仮定できるとは限らず、温度と混合状態をそろえて比較する。
  - "[@P000332]は円錐貫入試験で氷の形態を比較し、粒子を結ぶ氷と分散した氷では強度・掘削性が異なることを示した。[@P000338]の熱伝導測定と合わせると、同じ氷量でも力学応答と熱応答が変わる理由を粒子間構造から考えられる。"
  - "[@P000332]は低温のLHS-1を四つの氷構造で比較し、目標1 wt.%の最大円錐指数が未焼結58.45、圧力焼結430.35、氷結合2077.64 kPaになることを示した。圧力焼結では1→30 wt.%の端点で推定水量当たりの円錐仕事が0.35→0.11 J/gへ下がり、氷結合では上昇した。氷量と形成履歴を併せて資源地盤を評価する必要がある。蒸着は1体の試験で、走行性は貫入抵抗からの推定である。"
- heading: 着陸機の排気も、局所の水と極域の化学組成に影響する
  paragraphs:
  - '[@P000303]はChang''e-5/6の観測から、排気由来の水が粒子へ入り、徐々に放出される過程をモデル化した。[@P000305]はメタンの全球輸送を計算し、南極着陸に由来する分子が北極の永久影にも捕捉される可能性を示す。着陸地点の観測では局所的な残留を、極域の氷の解釈では遠方からの人工物質の供給も考慮する必要がある。'
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - '[@P000253]はChang’E-6のNILSで、着陸点近傍の月面に由来する50–400 eVの水素負イオンH−を検出した。反射陽子と同じ放出角分布を仮定した反射率2.5（−0.8、＋1.2）%、表面直上の体積数密度0.18（−0.03、＋0.04）cm⁻³（90%区間）と、昼側寿命70
    msを使う等価スケールハイト約10 kmは、局所スペクトルからの推定である。[@P000253] [@P000252]は同じ観測系列と解析コードを用い、6区間で200
    eVから各区間の太陽風エネルギーまでの90%有意限界を超えるH−成分を比較し、フラックスと平均エネルギーが太陽風条件に正に相関することを示した。初報の2.5%収率を入力とする輸送計算では、昼側はENAの放出角分布、夜側は一様角度、月の影では光脱離なしと仮定し、薄い昼側層と50
    sで計算を止めた夜側の尾を予測した。H−がwakeやシースを変える作用と水生成への寄与量は、負イオンの反作用と表面反応を含む別の検証を要する。'
  - 日照域で吸着水が残る条件は、局所平均温度だけでは決まらない。[@P000143]は各800三角面からなる4種類の合成粗面で影・相互照射・法線方向の熱伝導を計算し、単分子層以下の既存水の一次熱脱離へ結び付けた。粗面は日の出直後の脱離を早める一方、低温斜面に水を残し、赤道では24時間後にも初期量の約20%が残った。この割合は脱離活性化エネルギー8×10⁻²⁰
    Jを置いた熱脱離だけの結果で、生成・粒子による損失・再吸着を含む水収支へ進む際の一要素になる。
  - 南極のクレーターでは、陽子が届く量と氷が残る量をつなぐために、供給と損失を合わせて扱う必要がある。[@P000144]はLOLA地形と解析的なプラズマ膨張モデルから、壁面より床面への陽子流束が小さく、Shackleton中央にはほぼ陽子が届かない領域が残ると予測した。低流束は既存氷のスパッタ損失と水素供給をともに弱めるため、正味の氷量は未確定である。[@P000144]
    [@P000146]は地形と推定地殻磁場を1,369 m格子の運動論的PICへ組み込み、粒子到達の再配分を計算した。表面電荷を追跡せず、帯電シースは解いていない。500
    nm純氷層・10²¹ H₂O m⁻²・0.75 H₂O/陽子を置く先行研究の侵食式を引き継ぐ一方、1質量%氷レゴリスの生成・陽子損失・電子損失・熱昇華を合わせた収支も示した。低温の永久影領域で得る正の収支は生成収率0.01
    H₂O/陽子という上限などに依存し、収率を変えると符号も変わり得る。四流向平均は磁気尾通過を省き、再凝結・地下拡散・微隕石・光脱離も収支から省いているため、保持に有利な場所を示す条件付きの推定として読む。
- heading: 氷の量に、形態・温度・分光の条件を加える
  paragraphs:
  - "[@P000469]のmicro-CT比較は、同じ含氷量でも、乾式の圧力・熱焼結と液水混合後の凍結で孔の寸法と氷の接続が変わることを示す。孔の形態差と全空隙率の大小は別の評価量で、報告された空隙率の絶対値には式と表の不整合が残る。[@P000470]の熱測定では、低氷量の低温伝導率は乾燥物と近いが、昇華・潜熱輸送・セメンテーションが温度上昇時の応答を変えた。氷量だけでなく、作製・熱履歴を観測と実験の比較条件にする必要がある。"
  - "[@P000471]は氷の粒径・形状、位相角、混合量を変えて可視・近赤外反射を測った。純氷の粗粒化で1.5・2.0 µm帯が深くなり、約100 µm以上では飽和に近づく。試験した混合物の700 nm反射は0–50 wt%でほぼ線形に増えた一方、近赤外帯は低氷量でも敏感に応答した。高位相角の可視増光、粗い球形試料の凝集、液体窒素冷却・非真空という試験条件を含めて、極域での検出と量の推定へ校正をつなぐ。"
  - "[@P000470]は微粒氷LHS-1を数日かけて加熱し、約230–240 Kの有効熱伝導率ピークと、再冷却後の曲線変化・セメント化塊を観察した。S2は210 Kまでの加熱で氷量が2.94±0.11から1.56±0.10 wt%へ減った。著者は中央THS熱源周辺の再凝結と、真空への拡散距離が短いホルダー縁での乾燥を関連づける。潜熱輸送モデルはピークを説明しうるが、昇華中の温度推定誤差が大きく、各輸送成分や採掘効率の定量評価は残る。月面の焼結外層への適用には昇華と水蒸気の孔内捕捉が必要となる。"
- heading: 着陸排気を、人工的な水の供給として扱う
  paragraphs:
  - "[@P000467]は着陸排気の直接沈着を降下経路から計算し、等方的な点源から再放出されたH₂Oの初回98%沈着角が120 Kで4.6°、380 Kで18.7°、1200 Kで139°へ広がることを示した。これは特定の極域クレーターの捕集率ではなく、表面温度による輸送範囲の違いである。40 K面の捕集効率100%を仮定して汚染問題を設定するが、具体的な捕集量や安全離隔距離は本文で算定していない。Table 3の百分率の分母は本文に明記されていない。1800 Kでは7.66%が脱出するため、98%沈着を全放出量の98%が月面に戻るという意味には取れない。非脱出分への正規化などの可能性は未解決として残す。要点は会議稿に基づく。CFD元データとコードの詳細は本文からは確定できない。"
  - "[@P000468]の南緯70度・月地方時7時への仮想着陸では、155秒間に放出した約43 kgの水の約13%が2月日以内に極永久影へ捕獲される。大部分は南極へ届くが北極にも到達し、北極捕獲量は脱離エネルギー0.5 eVで0.7 eVの2倍超となる。最終捕獲約20%は既往長期計算の捕獲比を用いた外挿である。永久影の捕獲と長期安定性、極全体の面積平均と局所被覆を区別する必要がある。要点はNASA Public Access著者原稿に基づく。"
