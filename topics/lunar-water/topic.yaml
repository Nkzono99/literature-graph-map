- paper_id: P000143
  group: thermal-retention
  role: 粗さによる吸着水の保持
  summary:
    question: 日照域の粗さが作る面別温度履歴は、夜明けに存在する吸着水の熱脱離をいつ促し、どの程度の水を日中まで残すか。
    method: 800面のGaussian地形で直達日光・影・可視/赤外相互照射・再放射と法線方向伝導を計算し、ν=10¹³ s⁻¹、ΔEdes=8×10⁻²⁰ Jの一次Polanyi–Wigner脱離へ結合。0°・45°N・70°Nで4粗さ、85°Nでξ≈0.2を比較。
    contribution: 粗さは早朝の脱離を早める一方、赤道で24 h後にも約20%を残し、十分粗い45°N以上では正午まで一部を保持することを示した。保持量は採用脱離エネルギーと熱脱離だけを扱う条件に依存する。
  evidence_by_item:
