- paper_id: P000112
  group: kinetic-models
  role: 電子の電荷分離電場と三次元の遮蔽構造
  summary:
    question: イオン旋回半径より小さな月磁気異常で、電子とイオンの応答差は密度空洞・ハロー・表面遮蔽をどう作り、IMFと太陽風速度・方向で何が変わるか。
    method: iPic3Dによる三次元・全運動論的電磁PIC。月面下13 kmの水平単一双極子、完全吸収月面、電子/イオン質量比1/256、低減光速を用い、漂移Maxwellianの太陽風についてIMF方向/振幅と風速/45°入射を一因子ずつ比較する。
    contribution: 基準Run Aでは電子とイオンの侵入差が作る法線電場によりイオンが減速・偏向し、電子のE×Bドリフトが非対称なハローを生む。低速風でハロー・逆流イオンが消えても局所的な表面入射抑制が残り、IMF倍増で反射割合が下がっても表面遮蔽が改善するため、構造・反射・表面到達を分けて評価する必要を示す。
