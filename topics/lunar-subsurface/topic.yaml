- paper_id: P000193
  group: pits
  role: 縦孔の分布・形成機構
  summary:
    question: 月面の海・衝突溶融物・高地に分布する縦孔は、どの過程で形成され、地下空洞について何を示すのか。分布と形態を整理し、探査上の意義を検討した。
    method: LROC狭角カメラ画像の影をPitScanで抽出し、候補を目視確認した。縦孔の形態・分布・深さを調べ、周囲の地質やクレーター径から形成時期を検討した。
    contribution: 海に8個、衝突溶融物に221個、高地に2個の縦孔を確認した。地下空洞の証拠と位置づけ、孔の小ささと母体の年代から多くは後から形成されたと推定したが、空洞の広がりは未確定である。
