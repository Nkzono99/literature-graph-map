schema_version: 1
topic_id: lunar-charging
title: 月面帯電
question: 月面の電位、光電子シース、ダストの帯電と移動を、基礎・観測・地形・材料・探査技術から整理する。
review:
- heading: 月面電位から、表面の上に広がるシースへ
  paragraphs:
  - 月面にはプラズマの電子とイオンが流れ込み、紫外線や粒子の衝突で電子が放出される。その電流の釣り合いが表面電位を決める。月試料の光電子放出を測った[@P000001]と、電流収支を整理した[@P000002]が基礎になる。初期の月面電場・シースを整理した[@P000020]は、電位と周辺プラズマを結ぶ理論の入口になる。放出電子が表面近くにとどまると、電位が空間的に変わる層、シースが生じる。粒子と電場を追跡する[@P000007]のPIC計算、[@P000030]の室内計測、[@P000036]の観測との比較は、この構造をそれぞれ異なる方法で調べている。
  - 太陽風電子の流れを含む[@P000011]は半解析解を一次元PICと比較し、電子分布による違いも調べた。有限のイオン温度を組み込む[@P000055]は、シース厚と電位分布、光電子の捕捉を検討する。日照面上空でも、磁気圏プラズマシート中の[@P000033]のように非単調な電位構造が問題になる。
- heading: 月面電位を変える宇宙環境
  paragraphs:
  - ApolloのCPLEEなどによる初期の粒子計測（[@P000018]）に続き、Lunar Prospectorは軌道上の電子から夜側の負帯電や、磁気圏尾部・太陽活動に伴う強い帯電を捉えた（[@P000003]、[@P000004]、[@P000006]）。[@P000025]は探査機電位の補正を含めて入射電流との対応を定量化し、[@P000027]はSEPイベントの観測と予測を比較した。ARTEMISでは昼側シースの遠隔計測（[@P000034]）や、微小隕石衝突による電流の寄与（[@P000045]）へと論点が広がる。かぐやによる地殻磁場と相対電位の研究（[@P000051]）、IM-1のROLSESによる電波・プラズマ波観測（[@P000056]）も、月面の電気的環境を知る手掛かりになる。
  - 昼側の正電位も、環境に応じて変わる。[@P000162]は太陽活動による光電子放出の変動を調べ、[@P000161]は別の光電子モデルとARTEMIS観測から日照・プラズマ条件への依存を推定した。太陽風の流入側では、[@P000163]が磁気異常の反射陽子による広域の擾乱を論じている。
  - 環境への依存を整理する[@P000038]は、太陽風と照射条件を変えて電流収支を計算した。[@P000023]はLunar Prospectorから全球の帯電環境を整理する。[@P000041]はローブ中の光電子と昼側電位を推定し、[@P000046]はARTEMIS・OMNIの観測条件を帯電モデルへ渡した。この流れを現地の計測へつなぐ資料として、月面での電磁場観測を計画する[@P000032]がある。
- heading: 極域と空洞では、地形が粒子の到達を変える
  paragraphs:
  - 永久影では光電子が出にくく、地形が太陽風も遮る。[@P000058]は電子とイオンの入り込み方の違いから、クレーター内の電気的環境を論じた。LOLA地形を使う[@P000031]、表面帯電とプラズマを解く[@P000008]、三次元のミニウェイクを扱う[@P000048]は、形状と流入条件を具体化している。深い空洞では、側壁で電子が失われると底へイオンが届きやすくなり、底部が正に帯電する場合がある（[@P000012]）。空洞寸法とシース厚の比による正電位の緩和は[@P000015]、流速と熱速度の比による底部電位の変化は[@P000016]へとつながる。南極の実地形を含む計算は[@P000017]が扱う。
- heading: ダストの離脱と輸送を、粒子の電荷から考える
  paragraphs:
  - Surveyorの地平線光（[@P000019]）を背景に、[@P000022]は電場で加速されたダストの上昇・落下を噴泉モデルで表した。2007年会議録[@P000389]は指数減衰する電位でシース内の低高度解を追加したが、初期電荷と凝集離脱、粒子供給は仮定に残る。[@P000387]は凝集・重力・平均電荷配分から、中間半径で離脱閾値が最小になると予測した。[@P000388]のポリスチレン実験は中間粒径の堆積が最も広がる傾向を示し、電子ビーム下のJSC-1を使う[@P000392]は小粒子が捕集集団で相対的に多いと報告した。材料・帯電条件と、拡がり・相対分布という測定量をそろえて比較する。
  - 粉体外縁の移動を撮影した[@P000026]と電子照射下の[@P000029]は、局所電場による移動を調べた。電子再吸収を扱うpatched charge model（[@P000009]）に対し、[@P000391]は照射停止後に外部電圧で回収した粒子の負電荷を測った。VUV下で正負粒子を測る[@P000052]も電荷分布を制約する。回収選別と正味電荷を確認し、局所電荷や自然離脱の測定と対応させる。電子収率（[@P000053]）や導電損失（[@P000010]）も電荷の蓄積を左右する。
  - LDEXの個別衝突を解析した[@P000390]は、明け方に偏る持続的なダスト雲と流星群時の増加を捉え、衝突噴出物と解釈した。同じ観測キャンペーンの[@P000039]は、積分電流の残差にイオンが混じることを踏まえ、半径0.1
    µmを仮定し、各境界通過時の機体速度を用いて密度上限を求めた。日の出側で太陽風中約100 m⁻³、磁気圏尾部約40 m⁻³という制約は高度3–250 kmに対するもので、地表近傍の全輸送を確定しない。薄明クレーター付近の5増加イベントを局所噴泉と解釈した[@P000044]も、粒径・高度・地方時・地形を合わせて比較する。
  - 材料による帯電の違いは月試料と模擬粒子の[@P000021]、Apollo 17単粒子の[@P000166]へさかのぼれる。[@P000005]は保持した負の単粒子の電荷変化から光電子効率を求め、吸収モデルと外挿を介する収率も推定した。模擬レゴリス上の電荷を測る[@P000037]とは測定量と配置が異なる。飛翔後の電荷も変わり、[@P000167]は光電子シース中の連続・離散帯電、[@P000165]はプルームの摩擦電荷が停止後に残る輸送を計算した。
  - 粒子と基板の隙間へ再捕集モデルを広げる[@P000013]と、光・低密度プラズマの同時照射[@P000014]は、表面上の電荷分布を具体化する。UVと付着を扱う[@P000040]、太陽風・UVを変える[@P000042]、微小空洞の帯電を加える[@P000043]は離脱条件の比較対象となる。粗い表面の局所電場を整理する[@P000047]へ進むと、粒子スケールで必要な計測を考えられる。
- heading: 探査機の帯電と、付着ダストへの対策
  paragraphs:
  - 機器への影響を考える際は、表面間の電位差や材料の違いが問題になる。[@P000024]はNASCAP-2Kによる機体の帯電解析、[@P000054]は月ミッションの帯電環境を整理した。除塵には電極が作る電場を用いるEDS（[@P000028]）があり、イオン中和（[@P000049]）やEDSとUVを組み合わせたブラシ（[@P000050]）の特許もある。これらは、自然のダスト移動で扱う電荷と力の関係を、機器側から制御する技術として参照できる。
    気体中の誘電体バリア放電で流れを作る[@P000035]は、太陽電池除塵の周辺技術として収録している。媒質と作用する力を対応させて各方式の条件を比較する。
  - 電子ビームを使う[@P000164]では、VUVを併用すると布上の模擬ダストが動き出しやすくなった。太陽に似た波長分布を用い、照射強度は月面より高い条件で調べている。
- heading: 高エネルギー粒子は、表面の下にも電荷を残す
  paragraphs:
  - 極域の低温レゴリスでは電荷の散逸が遅い。[@P000057]は入射粒子の侵入深さ、電荷保持、伝導を電荷連続式とPoisson方程式で結び、表面収支へ内部帯電を加える枠組みを提案した。[@P000310]はGCRとSEPの観測を使い、内部電場を時間依存で予測した。[@P000311]と[@P000312]は、絶縁破壊が細粒化・溶融・蒸発を通じて表層を変える可能性を評価している。水への接続を分子過程から調べた[@P000313]は、破壊で露出した酸素と太陽風由来水素の反応を計算した。いずれも、モデルが予測する作用と現地で確認された作用を区別して読む。
- heading: 観測から光電子と散乱電子の寄与を分ける
  paragraphs:
  - 表面を出入りする電子の起源も、帯電を考える手掛かりになる。[@P000362]は酸素Auger電子を指標に光電子を選び、放出収率を制約した。[@P000363]は後方散乱電子が再び表面へ戻る磁場の効果を調べ、[@P000364]は光電子の統計をローブ中と太陽風中で比較した。これらの観測は、光電子シースや昼側電位のモデルへ入れる電子電流の基礎量を補う。
lineage:
- title: 電流収支から空間構造へ
  steps:
  - paper_id: P000002
    title: 昼夜の電位を電流収支で捉える
    significance: 粒子の流入と電子放出をまとめ、日照やプラズマ環境による帯電の違いを説明した。
  - paper_id: P000007
    title: 光電子シースを粒子計算で解く
    significance: 電子分布と粒子の帯電を時間発展で追い、表面近傍の電位とダスト運動を結び付けた。
    connection: 表面電位から周囲の分布へ
  - paper_id: P000008
    title: 地形と太陽風侵入を結び付ける
    significance: クレーターへのプラズマ膨張と表面帯電が互いを変える過程を計算した。
    connection: 地形の陰に入るプラズマへ
- title: ダスト浮遊から粒子間の帯電へ
  steps:
  - paper_id: P000019
    title: 地平線光をダストと結び付ける
    significance: Surveyorの画像に見える光を低高度のダスト散乱として解釈し、浮遊研究の起点を作った。
  - paper_id: P000022
    title: 上昇・落下を噴水モデルにする
    significance: 電場による加速と弾道運動から、粒径や帯電条件に応じたダストの高さを予測した。
    connection: 光の解釈から粒子の運動へ
  - paper_id: P000009
    title: 空隙の電子再吸収で離脱を説明
    significance: 粉体面の微小な空隙に電子が集まるPCMを提案し、粒子を押し出す局所電荷に着目した。
    connection: 離脱を生む局所帯電へ
- title: 内部帯電から風化・水形成へ
  steps:
  - paper_id: P000310
    title: 低温レゴリス内部の電場を予測
    significance: GCR・SEP観測と電荷散逸を合わせ、永久影での内部帯電をモデル化した。
  - paper_id: P000311
    title: 絶縁破壊を表層改変へつなぐ
    significance: 粒子の細粒化や空隙構造への影響を、SEPイベントの履歴から評価した。
    connection: 内部電場の予測から物質の改変へ
  - paper_id: P000312
    title: 溶融・蒸発の速度を比較
    significance: 絶縁破壊と微隕石衝突の累積作用を比較した。
    connection: 発生可能性から風化の収支へ
  - paper_id: P000313
    title: 水形成を分子過程で計算
    significance: 破壊で露出する酸素と水素の反応・低温保持を調べた。
    connection: 粒子改変の系列に化学反応のモデルを加える
