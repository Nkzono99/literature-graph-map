- paper_id: P000152
  group: lunar-materials
  role: 軌道観測による実効収率
  summary:
    question: 実際の月夜側から脱出する二次電子の積分収率はどの程度で、実験室測定を用いた収率モデルおよび負の月面電位と整合するか。
    method: 1999年の地球磁気圏内で、LP ERの最低ビン中心約7 eVの夜側観測を使用。強い地殻磁場のない場所の明瞭な二次電子ビームを積分してJ_SECを測定し、宇宙機電位を補正した下降電子のκ分布フィットと月面電位で月面入射電流J_Eを逆推定。J_SEC/J_Eを等方入射・平均κ=4.5のSternglass/Katzモデルおよび単純電流平衡モデルと比較。
    contribution: 積分収率の分布は中央値0.48、半値全幅0.64、中心約0.45。モデルでは垂直入射ピークδ_M≈0.5／有効ピークδ_M^eff≈1.0に対応し、著者が報告する実験室ピーク値の約3分の1。観測が負電位を保つ傾向も低い収率と整合するが、帯電モデルは定量一致に至らない。
