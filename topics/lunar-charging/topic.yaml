- paper_id: P000005
  group: grain-charging
  role: 単粒子の光電子放出
  summary:
    question: 月ダスト一粒の光電子放出効率は、粒径や粒子電位によってどう変わるか。
    method: Apollo 17・Luna 24の帰還試料とJSC-1模擬物の単粒子を電気力で保持し、120・140・160 nmの紫外線による帯電変化を測った。
    contribution: 単粒子の光電子放出効率と推定収率の粒径依存性を報告し、既報のバルク試料の値との差を示した。
