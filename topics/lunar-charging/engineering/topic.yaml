- paper_id: P000370
  group: removal
  role: 粒径別EDS性能と力の競合
  summary:
    question: 月レゴリス模擬物の粒径に応じて、EDSで除去しにくくなる原因は何か。
    method: 模擬物を粒径群に分級して清掃実験と高速度撮影を行い、粒径依存の簡略化した力の釣り合い計算と比較した。
    contribution: 当該条件では25 µm未満で付着力、250 µm超で誘電泳動力と重力が除去性能を低下させた。大粒子の鎖状化と基板への捕捉も観察し、粒径によって支配的な力が変わることを示した。
