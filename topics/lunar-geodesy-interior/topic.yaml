- paper_id: P000301
  group: interior
  role: 月裏側浅部の密度・空隙構造
  summary:
    question: 衝突を重ねた月裏側の浅部地殻は、どの密度構造を持つか。
    method: GRAIL重力とLOLA地形に有効密度スペクトル法を適用し、二層モデルの密度と境界深度を推定する。
    contribution: 平均厚4.7 km、密度約2,111 kg/m³の上層と、約2,739 kg/m³の下層を推定した。上層を衝突破砕と噴出物に由来する多孔質層と解釈した。
  inspection:
    level: abstract
