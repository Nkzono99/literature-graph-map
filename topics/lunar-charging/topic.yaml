- paper_id: P000012
  group: topography
  role: 深い空洞の正帯電
  summary:
    question: 光電子放出がなくても、太陽風に開いた深い空洞の底は正に帯電するか。
    method: 絶縁性の直方体空洞を三次元PICで計算し、深さと幅の比、入射条件、光電子放出による違いを調べる。
    contribution: 側壁で電子が失われて底部にイオン電流が優勢になる正帯電機構と、側壁由来の光電子がその正電位を緩和する働きを示した。
