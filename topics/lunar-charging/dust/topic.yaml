- paper_id: P000255
  group: properties
  role: 模擬粒子と異種材料の接触帯電
  summary:
    question: 月・火星のレゴリス模擬粒子は、異なる材料の表面との接触でどの程度帯電するか。接触面の仕事関数、粒径、円板の振動回数が電荷に与える影響を調べる。
    method: 真空中で月模擬土JSC-1と火星模擬土JSC-Mars-1を金属・シリカガラスの円板に接触させ、円板の振動で穴から落下させた粒子の電荷をファラデーカップで測定した。
    contribution: 電荷の大きさは粒径と円板の反復振動で増え、平均電荷は接触面の仕事関数に線形に依存したが、酸化金属では依存性が見られなかった。外挿した有効仕事関数は月模擬土で5.8 eV、火星模擬土で5.6 eVだった。
