[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "literature-graph-map"
version = "0.1.0"
description = "Literature maps as an HTML site for GitHub Pages"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "jinja2>=3.1.6,<4",
]

[project.scripts]
lgm = "literature_graph_map.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/literature_graph_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
