- paper_id: P000280
  group: calibration
  role: SPによる日陰の水氷粒子候補
  summary:
    question: 月の水の捕獲・拡散過程を理解するため、極域の永久影に限らず、さまざまな緯度・地方時の影で水氷が存在するか、その分布にどんな変化があるかを調べた。
    method: かぐやのSPが取得した可視〜近赤外スペクトルを60領域の影で解析し、1.25・1.5 μmの吸収を評価した。氷粒子の大きさと量はスペクトルシミュレーションで推定した。
    contribution: 多様な緯度の影で水氷を示す吸収を検出し、明暗境界に近づくほど1.5 μm吸収が強まった。氷は表面の霜層か浮遊粒子と解釈され、緯度方向の粒径・量の傾向はノイズのため未確定だった。
