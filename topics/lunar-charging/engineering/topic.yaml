  role: イオン照射によるEDSの帯電制御
  summary:
    question: イオン照射で粒子の帯電条件を変えると、EDSの除去率と清掃速度はどう変わるか。
    method: EDSにイオナイザを組み込み、極性、粒径、照射タイミング、距離、相対湿度を変えて清掃性能を比較した。
    contribution: 事前照射と動作中照射で除去率が改善し、動作中照射では清掃速度も上がった。気体中の帯電制御を性能変数として評価した結果で、月面真空下への適用は別途検証を要する。
