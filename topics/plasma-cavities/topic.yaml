- paper_id: P000012
  group: lunar
  role: 深い空洞の正帯電
  summary:
    question: 深い空洞の底は、光電子放出がなくても正に帯電するか。
    method: 直方体空洞の深さ・幅・入射条件を変え、三次元PICで計算。
    contribution: 側壁での電子損失が底部を正帯電させ、側壁の光電子が正電位を緩和。
