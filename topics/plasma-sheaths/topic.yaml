schema_version: 1
topic_id: plasma-sheaths
title: シース・表面帯電の基礎
question: 表面への粒子捕集と電子放出が、電位・電流・周囲のシースをどう決めるか。
synopsis:
- 表面に接するプラズマでは、粒子捕集と電子放出の電流収支が表面電位を決め、周囲に電位が変わるシースが生じる。Bohm条件（[@P000087]）、壁・物体・放出面のシースの総説（[@P000085]）、宇宙機の帯電の整理（[@P000086]）が基礎である。
- 電子放出が強いと、空間電荷制限シース（[@P000155]）や逆シース（[@P000156]）が現れる。放出電子の温度を含む運動論（[@P000089]）と実験（[@P000090]、[@P000093]）は、放出量と実際に逃げる量を区別する必要を示した。光電子だけのシースの実験（[@P000092]）は、月面のPIC計算（[@P000007]）と対応させて読める。
- 小さな粒子では軌道が捕集電流を決め（[@P000233]、[@P000094]）、地形や宇宙機では形状が電位障壁を変える（[@P000263]、[@P000251]）。放出の原因、イオンの有無、電位の基準を保つことが、実験と計算を比較する条件である。
review:
- heading: 電位と流入電流を一緒に考える
  paragraphs:
  - "[@P000087]は、弱衝突でDebye長がプレシース長より十分小さい領域について、シース端の同定と速度条件の導出を分けた。従来の運動論式はゼロ速度付近のイオンに強く依存するが、有限温度イオン源の計算では局所Ti/Te≈0.02に対する流体モーメント条件が約1.01csとなり、音速条件の頑健さを示す。一方、プラズマ電位に近い電極で電子尾部が失われる2DヘリウムPIC計算では、端速度が壁の0.54 cm/µsに対して電極側0.47 cm/µsとなった。一般化には分布モデルによる閉包と端位置の同定精度を考慮する必要がある。p.6の端位置表記とp.8の壁・電極の呼称、切断比、百分率には原文の留保が残る。"
  - '[@P000085]は、壁・吸収物体・放出面のシースを、粒子の供給と境界条件の違いから比較できる総説である。壁では体積電離と損失を結ぶPoisson–流体/運動論モデルを用い、静止して加わるイオンの運動量項を残す。入口のBohm速度だけでは電場を定めず、全体系のサイズで入口電場と厚さが変わる。挿入物体では無限遠分布から吸収で欠ける軌道を除き、角運動量を含む有効ポテンシャル障壁がOMLの適用を制限する。'
  - 電子放出による極小では、反射復路を含む面側と、障壁を越えた粒子だけの外側で密度式を切り替える。Child–Langmuir則は初速・入口電場ゼロの極限で、背景プラズマや有限放出温度を加えると収支を組み直す必要がある。太陽風中の月面の紹介では、表面電流ゼロと上流準中性を同時に満たす光電子シースを扱い、放出分布の尾部で表面電位と極小が変わる。引用PICの結果、平面近似、太陽風と磁気圏尾部の違いを残して使う。[@P000085]
  - '[@P000086]は、表面電位を粒子捕集と光・二次電子放出の正味電流収支から整理した。球の軌道制限電流は静止・等方・無衝突プラズマと到達軌道の接続条件に依存し、シースが捕集を制限する場合は電位場と粒子軌道を結合して求める必要がある。移動体ではイオン流と後流、磁場による捕集領域、誘導電場がこの条件を変える。代表的な電位の値は、環境・材料・日照・形状に条件を付けて用いる。'
  - 放出電子が周囲の障壁で戻ると、表面の収率をそのまま脱出電流にできない。Whippleが紹介するATS-6のモデルでは、−80 Vの本体と−300 Vの影の絶縁面が−138
    Vの鞍点を作り、58 eV未満の放出電子を閉じ込めた。面ごとの独立した浮遊電位を貼り合わせるだけでは、面間を結ぶ電位場と電子軌道を扱えない。これは粒子測定の低エネルギー境界や電子放出による中和の解釈にも関わる。[@P000086]
  - 平衡電位が一意とは限らず、非Maxwellプラズマ中の二次電子電流は複数の根を作りうる。微粒子や大きな容量を持つ絶縁面では帯電が環境変化に追いつかず、時間依存の電位を扱う必要もある。同総説の月面ダスト輸送の例は、衝突カウントや光学観測からの著者の解釈を含む。帯電の直接測定や表面からの離脱機構の実証とは分けて読む。[@P000086]
  - 正にバイアスした小電極では、電子シースの外側に圧力勾配で電子流を作るプレシースが生じる。Scheinerらは、流れをもつ電子速度分布に沿った等温の一次元理論と二次元粒子計算を比較し、Te≫Tiの条件で電子流が電子Bohm速度√((Te+Ti)/me)の程度へ達すると示した。薄いシース内では電場が加速を担う。一方、小電極の周囲を回り込むイオン流れは単純なBoltzmann密度から外れ、電子とイオンの相対流に伴うイオン音波がシース端変動と対応した。境界位置と流入速度には、時間平均と境界定義による幅が残る。[@P000088]
- heading: 電子放出が電位分布を組み替える
  paragraphs:
  - Sheehanらは、表面で吸収される電子による分布の欠損と有限温度の放出電子密度を、浮遊電流釣り合い・SCL境界・一般化Bohm条件に結びつけた。理論の同温度極限ではシース電位がゼロになる。PICとの比較は超音速イオン流に合わせ、シース端から仮想陰極の最小電位までを用いた。一方、残光実験の電位差はプレシースを含み、中間温度比には理論とのずれが残る。[@P000089]
  - '[@P000090]は、熱い・冷たいMaxwell群と高エネルギー一次電子を含むアルゴンプラズマで、浮遊BN壁の電位分布を測った。一次電子エネルギーを上げると壁との電位差は増した後、20
    V以内のフィラメント電圧幅で熱い電子温度程度へ下がった。等方的一次電子を組み込む運動論モデルは遷移域外の4条件を±1 V内に再現したが、−110/−130
    Vでは多重解により直接比較が成立しなかった。放出電子温度比と試料収率は実測しておらず、電子分布・放出条件に依存した検証例である。'
  - 表面衝突後の電子を粒子計算で生成する方法として、[@P000091]は反射と真の二次電子を分け、平均収率だけでなく電子数分布と放出エネルギーの整合を保つモデルを示した。自己無撞着なシース解を求めた論文ではないが、表面の収率・スペクトルから境界条件を構成する際の参考になる。較正はCuと304鋼の特定試料で、入射角係数にはアルミニウム系データからの移転を含む。
  - '[@P000093]は、二次電子を放出する浮遊ステンレス平板上で古典・SCL・逆シースの電位分布を測った。Ar圧0.1 mTorrでは一次電子エネルギーの増加に伴い古典からSCLへ移り、遷移時の放出／収集比は収率モデルと測定電子分布からΓc＝0.977と評価された。圧力を下げる走査ではΓ約2でも電位極小が残った。さらに希薄な背景で表面が周囲より約1.1
    V正となる逆シースを観測し、放出比に加え背景と放出電子の密度・温度を比較する必要があることを示す。'
- heading: 光電子シースを実験から月面へつなぐ
  paragraphs:
  - 日照面ではUVによる光電子放出が加わる。月面の平坦な日照面を扱う[@P000007]では、光電子シースとその中のダスト運動を計算している。[@P000011]は太陽風電子の流れを半解析モデルに含め、PICとの比較や電子分布を変えた計算へ進む。実験の照射・材料条件と、月面のプラズマ・放出条件を対応させると、同じシースの議論を両者で参照しやすい。
  - '[@P000092]は、172 nm VUVを照射したZr面と負のNiグリッドの間に光電子だけの層を作り、阻止電位解析と円筒Langmuir探針で有効温度と密度を求めた。1D
    PICは放出後に表面へ戻る電子とグリッド放出を含め、バイアスで変わる4高度の密度分布と概ね対応した。診断間の温度・密度は因子2以内の対応で、微分最大を局所電位とみなす解釈には独立測定が残る。'
- heading: 平面から小さな粒子へ
  paragraphs:
  - 球状ダストでは、電位によって曲がる粒子軌道が捕集電流を決める。[@P000233]の理論、球状探針の[@P000234]、有限寸法の球・円筒探針の[@P000235]が形状とシースを含む電流の基礎になる。[@P000094]の読了したarXiv版では、非放出・静止球の修正OMLが遮蔽を解いて電荷を求め、電子・イオン温度が等しい無衝突・無磁場の水素プラズマでPICと比較した。電子Debye長に対する半径比5まで電荷差は約8%以下、比10で約20%だが、電流・加熱には約37%の差もある。浮遊電位、表面電場からの電荷、捕集電流を分けて評価する必要がある。
  - "[@P000235]は、球・円筒の電位分布と粒子軌道を自己無撞着に解き、途中の有効ポテンシャル障壁が捕集を減らす条件を示した。等温円筒のRp/λDe＝2では引力側電位の大きさ約2.9kTe/eでOML電流に合流する一方、球は小半径極限へ近づく。斥力種温度が零のときは電位と電場が零となるシース端を未知数として求め、大半径で平面シースへつなぐ。捕捉軌道を空とする仮定と、引力種が冷たくなる際の球・円筒の異なる極限を保つことで、同じ表面電位でも捕集電流が変わる理由を比較できる。"
  - 月面の光電子シース中を動く粒子へ進むと、[@P000167]は位置と電荷を連成して追跡する。非Maxwell型の電子分布を含め、電荷を連続量で扱う場合と電子1個ずつの出入りで扱う場合を比較し、希薄な条件で軌道や浮遊の成立が変わることを示した。
  - '[@P000265]の真空実験では、導体の孤立UV照射と光電子放出面の近傍で帯電符号が逆になった。電位は測定電荷からの球形換算で、検出下限と初期接触履歴が電荷分布に効く。日照月面のダスト音波[@P000268]は、単粒子の軌道から集団の非線形な波動へ対象を広げる。'
  - '[@P000267]は、負にバイアスした導電板上のアルゴンプラズマで、測定したシース電位から導く電場とOML帯電計算を組み合わせた。直径10 µmのポリスチレン球は板電位−40〜−80
    Vで1.46〜2.20 cmに浮揚し、力釣り合いの安定な交点から求めた高さと誤差範囲で一致した。ただし計算は一貫して高く、板面へのイオン電流を一定とする仮定などに課題を残す。電荷・電位の実験値も高さからの力釣り合い推定であり、測定電位・OML帯電・粒子の安定性をつなぐ検証として位置づけられる。'
  - "[@P000233]は捕集の軌道問題と、Poisson方程式によるシース寸法の問題を分けた。球・円筒の減速側電流はシース寸法に依存せず、加速側でも十分大きいシースでは極限捕集則を得るが、途中の半径方向運動を遮らない電位分布を要する。一般の有限シースの自己無撞着解を与えたわけではなく、境界分布と軌道到達条件が捕集理論の入力となる。"
- heading: 放出シースの基礎と、逆シースへの移行
  paragraphs:
  - "[@P000155]は電子放出を含むLangmuirシースと熱流の基礎理論に対応する。強い二次電子放出を扱う[@P000156]は、通常のDebyeシースが成立しない条件を示した。熱電子探針の[@P000343]は、電離・衝突を含め、壁向きイオン流が止まっても仮想陰極を残す中間状態から単調な逆シースへ移る条件を調べている。放出の種類、流入電子の分布、プレシースの粒子生成・衝突条件を区別すると、各モデルの電位構造を比較しやすい。"
  - "[@P000156]の低衝突BN平面壁計算では、対向壁から飛来する二次電子のγbが0.94から1.22になる条件で約21 Vの古典シースが消失し、正の壁に約1 Vの逆シースが現れた。2 eVの放出電子の一部を戻してγnet≈1を保つため、壁が負でイオンを引き込むSCLとは電流調節の向きが異なる。比較ではEzと乱流散乱頻度を同時に増加させ、粒子流束は約17倍になった。本文・表の10 msとFig.2のns軸の対応は未解決である。"
  - 強い二次電子放出を扱う[@P000271]は、収率の入射エネルギー依存とシース内の電子温度変化から、不安定性を理論的に説明した。定常電位の比較に加え、放出特性が電位構造の安定性へどう効くかを調べる位置づけとなる。
  - "[@P000343]は、電離・イオン–中性衝突・円筒幾何を含む冷たいイオンの定常流体モデルで、SCLから逆シースへの間に、仮想陰極を残して壁向きイオン流が止まるICを位置づけた。壁電位が正になることだけで谷の消失は判定できず、仮想陰極の最低電位がプラズマ電位に届く極限で、平坦なプレシースと単調な逆シースへ移る。ICの壁側は準中性回復点でイオンを打ち切る近似であり、捕捉イオンの運動論的構造は解かない。半径0.5 mm、圧力10 mTorr、電子温度4 eV、プラズマ電子密度2×10^15 m−3の浮遊条件では、約2300 KからICの電位が上昇し、2300–2700 Kの線形フィット傾斜は1.52 mV K−1となる。 印刷境界式と図の領域ラベルには再現上の未解決点がある。"
- heading: 地形と宇宙機では、形状が電位障壁を変える
  paragraphs:
  - クレーター内の[@P000264]は、膨張前線と帯電表面の間の電子雲をPoisson方程式で解く。物体のサイズ、粒子供給、非中性領域を対応させて、平面モデルとの違いを考えられる。
  - 半球形クレーターでは、地形に沿うシースから開口をまたぐ電位分布への変化を、クレーター半径に対するシース厚さの比で整理できる。Wangほかの熱アルゴンプラズマ実験ではR=1
    cmに対してS/R≈0.65、1.2、3を比較し、電位の微分から得た入口から底近傍への電場低下を著者報告値で42%、65%、83%とした。二重層に対応する密度の交差は直接測定した分布ではなく、今後の運動論的検証を要する著者の予想である。[@P000263]
  - 宇宙機を扱う[@P000251]は、非単調なシースとイオンウェイクが、隣の機体から放出された電子の到達を妨げる条件を調べた。機体寸法・電位・位置関係を電位計測の信号へ結び付ける研究であり、シースの構造を計測器の応答まで含めて読む比較対象となる。
  - DoveらはVUV照射したZr箔とNiグリッドの間に、電子のみから成る光電子層を作り、浮遊電位をグリッド基準で評価した。WangらはArプラズマ中の浮遊ステンレス鋼平板で電子衝撃による二次電子放出を調べ、総放出電流J0seと障壁を越える電流Jseを区別して、SCL・逆シースの電位分布を測った。両実験を比較するには、放出の原因、イオンの有無と到達条件、グリッドと背景プラズマという電位基準、放出量と脱出量の違いを保つ。[@P000092][@P000093]
  - "[@P000251]は太陽風中の立方体宇宙機をSPISのPICで計算し、光電子・二次電子の非単調シースとイオンwakeの障壁をram側・wake側に分けた。温度2 eVのMaxwell分布放出、陽子イオンの条件では、幅/環境電子Debye長が概ね.5以上になると2 eV相当を超える障壁が重要になった。これは障壁初出の普遍的な閾値ではなく、浮遊機ではより小さい幅比でも電位極小が現れる。固定電位ではram側障壁が負電位まで、wake側の極小が正電位まで残る。日照と食で放出パラメータも変えているため、両者の差を環境プラズマだけに帰さない。 障壁定義の符号とスペクトルの定量的な識別余裕には未解決点が残る。"
  - "[@P000264]の電子雲は、未擾乱Debye長程度の薄い界面シースより大きな負空間電荷領域である。各鉛直列の電場圧力とMaxwell電子圧力を等しくする流体条件で負底面電位を閉じる。深さ500 m、11 eV、5×10⁶ m⁻³のx=0列では約−77 Vを予測するが、高エネルギー電子の捕集電流による追加帯電は未解決である。 刊行式の電位基準・Debye長・x規格化には未解決点が残る。"
- heading: 境界分布から帰還電子とシースを構成する
  paragraphs:
  - "[@P000527]は、表面の放出分布と無限遠の環境電子分布を与え、エネルギー保存に沿って帰還・脱出・反射する集団の密度を構成した。一次元・定常・無衝突でイオン密度を一定とし、Poisson問題を無限遠の準中性・零電場と総電流ゼロで閉じる。一般の境界分布に対する定式化を先に示し、その後に特定分布を代入して電位極小を求めている。任意の入力での解の存在や、複数定常解の動的な選択までは保証しない。"
  - "平均エネルギーだけで放出電子を代表させると、密度やシース端条件の違いを失う場合がある。[@P000528]は、冷たいAr+イオンと運動論的電子を用いる一次元・定常・無衝突モデルで、同じ法線方向平均エネルギーを持つ4種の放出分布を比較した。分布形により古典解と臨界SCL解の存在域が変わり、臨界SCL解がなくても古典解が残る条件を示す。放出係数・平均エネルギーに分布形を加えて整理する理論であり、動的な遷移先や安定性の検証は残る。"
comparisons: []
lineage:
- title: 放出電子とシース電位
  steps:
  - paper_id: P000089
    title: 放出電子の温度を理論に入れる
    significance: 壁損失と有限放出温度を含むSCLシース理論では、温度比5で規格化電位0.51、同温度極限で0を得た。超音速流に合わせたPIC比較は一致し、残光実験は同温度極限の傾向を支持したが、中間温度比で差が残った。
    connection: ''
  - paper_id: P000090
    title: 材料の二次電子放出と照合
    significance: 電位差は一次電子エネルギーとともに増大した後、20 V以内のフィラメント電圧幅で電子温度程度へ低下。遷移域外の4条件で±1 V内に一致したが、多重解域・収率の直接測定・臨界超過・ヒステリシスの確認は残る。
    connection: 熱電子放出から二次電子放出へ
  - paper_id: P000093
    title: 逆シースまでの電位構造を測る
    significance: 古典からSCLへの遷移を観測し、Γc＝0.977と評価。Γ約2でもSCLが続き、さらに希薄な背景で表面が周囲より約1.1 V正となる逆シースを観測。
    connection: 放出量に伴う状態変化へ
- title: 月面の光電子シース
  steps:
  - paper_id: P000007
    title: 光電子の分布をPICで追う
    significance: 平坦な日照面の電子分布を解き、電位構造と帯電粒子の運動を結び付けた。
    connection: ''
  - paper_id: P000092
    title: UV照射実験と粒子計算を結ぶ
    significance: バイアスによる密度分布の変化を、表面へ戻る電子とグリッド由来電子を含むPICで概ね再現した。浮遊電位は負グリッドに対して約+1.5
      Vで、シース電位極小の直接測定は未達だった。
    connection: 粒子計算を実験室で調べる
  - paper_id: P000011
    title: 粒子計算から半解析モデルへ
    significance: 太陽風電子の流れを含むシースを半解析的に記述し、Maxwell・κ分布のPIC計算と比較した。
    connection: 電位構造を簡潔なモデルへ
