  summary:
    question: LPの軌道観測から、局所プラズマを基準とする月面負電位をどこまで定量化できるか。
    method: 1999年4月29日の磁気圏、1998年3月23日の太陽風・ウェイク、1998年5月6日のSEPを電子分布フィットと電流平衡で比較。
    contribution: 環境ごとの負電位と入射電子の対応を示した。通常期間の探査機電位補正、約20 Vの検出閾値、SEPの未補正、ウェイクの局所基準を区別して解釈できる。
