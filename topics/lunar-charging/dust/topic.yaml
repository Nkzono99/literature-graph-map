schema_version: 1
topic_id: lunar-charging-dust
title: 月ダストの帯電・付着・静電輸送
question: 電子放出と粒子電荷、微小な隙間での帯電、付着面からの離脱と上空への輸送。
review:
- heading: 光電子と二次電子は、粒子ごとに出入りする
  paragraphs:
  - 月ダストの帯電を定量化するには、電子放出と粒子電荷を測る必要がある。[@P000021]は月試料などの帯電、[@P000005]は単粒子の光電子放出、[@P000037]は模擬レゴリス表面の粒子電荷を扱う。VUV照射下で正負両方の粒子を測った[@P000052]は、粉体の平均電位だけでは個々の電荷を代表できないことを示す。材料の電子収率は[@P000053]から参照できる。
  - 電子衝撃に対しては、[@P000166]がApollo 17の単粒子と2種類の模擬粒子を20–90 eVで比較した。電荷から推定する二次電子収率は材料によって異なり、模擬試料の選択を考える基準になる。
- heading: 付着した粒子が離れるまで
  paragraphs:
  - プラズマ中の粉体の縁で起こる移動（[@P000026]）や、電子照射による基板との帯電差（[@P000029]）は、局所電場の役割を示した。[@P000009]のpatched
    charge modelは粒子間の空隙に再吸収される電子を扱い、[@P000043]はその帯電を浮遊モデルへ、[@P000013]は粒子と基板の隙間へと展開する。UV照射と付着力を扱う[@P000040]、光とプラズマの同時照射を扱う[@P000014]も、離脱条件を調べる実験として並べられる。電荷が残る時間には導電性（[@P000010]）も効き、粗い表面の研究方針（[@P000047]）や内部への蓄積モデル（[@P000057]）へ論点が広がる。
  - この放出過程を除塵へ使う[@P000164]では、VUVと電子ビームを布上の模擬粒子へ同時に照射した。VUVで移動開始の条件が下がるという結果は、太陽に似た波長分布・月面より高い光強度の実験から得られている。
- heading: 地平線光から、上空のダスト分布へ
  paragraphs:
  - Surveyorの地平線光（[@P000019]）は、低高度のダストを考える出発点になった。[@P000022]は電場で加速された粒子の噴水モデル、[@P000042]は環境条件と浮遊の関係を扱う。LDEXでは、高度3–250
    kmの測定範囲で浮遊ダストに上限を置く[@P000039]と、薄明クレーター付近の局所的な増加を論じる[@P000044]がある。それぞれの粒径・高度・地形を対応付けることで、離脱機構と輸送先を比較しやすくなる。
- heading: 飛翔中の電荷と、離脱前の履歴
  paragraphs:
  - 粒子が動く間にも電子とイオンは出入りする。[@P000167]は光電子シース中の軌道を連続・離散帯電で比べ、希薄プラズマでの静止浮遊や繰り返す跳躍の成立条件を調べた。着陸時の[@P000165]では、噴射中の衝突で得た摩擦電荷が、停止後にプラズマとの平衡へ緩和する過程を追う。どちらも、運動と同じ時間軸で電荷を扱う点が比較の軸になる。
lineage:
- title: 飛翔中の帯電と輸送
  steps:
  - paper_id: P000022
    title: 電場による上昇と落下をモデル化
    significance: 粒径と帯電条件から、ダストが到達する高さを噴水モデルで予測した。
  - paper_id: P000167
    title: 電荷の時間変化と離散性を入れる
    significance: 光電子シース中で帯電と運動を連成し、電子の出入りが軌道を変える条件を調べた。
    connection: 固定した電荷から飛翔中の変化へ
  - paper_id: P000165
    title: 着陸時に得た電荷の履歴を追う
    significance: プルーム停止後も摩擦電荷が残り、微粒子の輸送予測を変える過程を計算した。
    connection: 動的帯電を自然シースとプルームで比較
- title: 粒子が離脱する電荷を探る
  steps:
  - paper_id: P000029
    title: 放出率の違いでダストを動かす
    significance: 電子照射下で基板と粒子の帯電差が電場を作り、移動や離脱を促すことを実験で示した。
  - paper_id: P000009
    title: 粉体の空隙に電子を集める
    significance: 電子の再吸収で粒子の局所電荷を増やすPCMを提案し、跳躍の機構を説明した。
    connection: 基板との電位差から粒子間の帯電へ
  - paper_id: P000014
    title: 光とプラズマの同時照射へ広げる
    significance: 同時照射で粒子の飛び出しと推定負電荷が増え、charge pumpingで説明できることを示した。
    connection: 単独照射から複合的な環境へ
public: true
