- paper_id: P000241
  group: properties
  role: 少数電荷の局所非対称性と運動時間の比較
  summary:
    question: 電子・イオンの個別捕集が、凝集体の電荷統計・ゆらぎ時間と、局所電荷から受ける力・トルクを通じた成長形状をどう変えるか。
    method: 一次電子・一価イオン捕集をOMLとモノマーによる見通し遮蔽で計算し、表面パッチへ一個ずつ付着させるMarkov/Gillespie型モデルを構築した。Ar実験室プラズマと電子欠乏Hプラズマで球・凝集体を検証し、単一モノマーの追加成長を25個まで計算。PPDでは抽出した電荷を衝突中固定し、LABでは衝突中も更新した。
    contribution: LAB・PPDの成長計算では、表面パッチの局所電荷を保持したモデルが最も細長い凝集体を作った。少数電荷の非対称性と電荷・運動の時間比を考える数値的な基礎となる。月面の光電子・二次電子放出、基板接触や付着力は扱わず、月面離脱・浮遊の直接検証は行っていない。
