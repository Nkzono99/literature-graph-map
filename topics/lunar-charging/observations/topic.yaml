- paper_id: P000179
  group: environment
  role: PACEによるC・N・Oイオンの日変化
  summary:
    question: 月外気圏の炭素・窒素・酸素イオンの組成と日変化はどのようで、供給源と生成機構をどこまで特定できるかを調べた。
    method: かぐやのイオン質量分析器の観測でC+・N+・O+を分離し、C+/O+比とN+/O+比の時間変化や昼夜差を解析した。
    contribution: イオン比の日変化から、窒素に富む供給源と窒素を含まないCO・CO2成分を示唆した。日中の主な生成過程を太陽風が窒素に富む月面物質を叩き出す作用と解釈し、流星雨直後のC+/O+比変化も報告した。
