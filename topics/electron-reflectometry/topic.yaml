    title: 電位構造の厚さを制約
    significance: 有限旋回半径による推定電位の角度依存を、夜側の空間尺度の診断に使った。
    connection: ロスコーンの電位推定から、断熱近似の限界を利用した構造推定へ
  - paper_id: P000025
    title: 探査機電位を補正
    significance: 通常区間では探査機電位を補正して月面電位と入射電流を比較した。SEPのkV値は未補正で、周囲基準への解釈には条件が残る。
    connection: 探査機との電位差から周囲のプラズマ基準へ
  - paper_id: P000034
    title: ARTEMISで日照面からの放出電子を測る
    significance: 遠方で測った加速電子から負電位を推定し、非単調シースの解釈を検討した。
    connection: 基準を補正した電位推定を日照面のシース構造へ
- title: 火星の大気中の反射から、上層の電位差へ
  steps:
  - paper_id: P000354
    title: 電子の大気中輸送をモデル化
    significance: 磁気ミラー・電位・衝突を含めて火星の電子分布を解析する枠組みを整理した。
    connection: ''
  - paper_id: P000356
    title: 外気圏上の電位差を統計化
    significance: MGSの電子反射から約185–400 km間の磁力線方向電位差を求めた。
    connection: 電子輸送の解析を電位差の空間・時間変動へ
- title: 火星の磁場推定を全球地図へ
  steps:
  - paper_id: P000353
    title: 大気を持つ火星へ適用
    significance: 電子の大気吸収を組み込んで地殻磁場を推定した。
    connection: ''
  - paper_id: P000382
    title: 高度170 kmの全球分布を整理
    significance: 北部低地の弱い磁場源と盆地の磁気的特徴を地図化した。
    connection: 初期の手法実証から全球の地質比較へ
  - paper_id: P000355
    title: 輸送モデルと処理を改良
    significance: 高度185 kmの改良マップを火山活動と古ダイナモの議論へ用いた。
    connection: 大気輸送・補正の改善を全球磁場の解釈へ
- title: 反射電子の吸収を熱圏の密度観測へ
  steps:
  - paper_id: P000381
    title: 既知磁場から中性密度を推定
    significance: 磁気反射の大気減衰を逆に利用し、夜側密度の季節変動を求めた。
    connection: ''
  - paper_id: P000384
    title: 南半球で4火星年を追跡
    significance: 手法を改善して密度変動の長期系列を得た。
    connection: 初期の密度推定から観測期間と解析法を拡張
  - paper_id: P000385
    title: 大循環モデルを検証
    significance: 夜側の季節・年々変動をモデルと比較し、冷却・循環の再現性を検討した。
    connection: 長期ER密度を大気モデルの制約へ
- title: ガニメデの粒子観測から、将来解析の帯電補正へ
  steps:
  - paper_id: P000357
    title: 高エネルギー粒子から固有磁場を制約
    significance: Galileoのロスコーンでガニメデの表面磁場を制約した。
    connection: ''
  - paper_id: P000359
    title: JUICEに向けて表面帯電を計算
    significance: 将来の低エネルギー電子反射解析で必要になる電位補正をモデルで検討した。
    connection: 磁気ミラーの観測から低エネルギー側の電位影響へ
public: true
scope:
