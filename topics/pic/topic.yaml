- paper_id: P000062
  group: accuracy
  role: Gauss則の誤差補正
  summary:
    question: 電磁PICの格子上で連続の式を厳密に満たさない粒子割り付けから生じるGauss残差の蓄積を、楕円型方程式の求解を加えずどう抑えるか。
    method: 論文の無次元表示で残差F=div E−ρを定義し、Ampèreの式に+d grad Fを加える。Fは連続の式の残差を発生源とする拡散方程式に従うため、境界F=0と安定性を満たす範囲でdを選び、誤差の発生と散逸を釣り合わせる。
    contribution: 楕円型求解を追加せず、電荷・電流の割り付けを固定しない局所拡散補正を提示した。2次元マグネトロン例では無次元係数d=0.001でGauss誤差が小さくほぼ一定になり、d=0.01では発振開始が遅れ、補正の強さが物理に影響することも示す。
