- paper_id: P000094
  group: collection
  role: 遮蔽を解く修正OMLとPICの比較
  summary:
    question: 電子放出のない静止球について、浮遊電位、電荷、捕集電流、加熱をOMLでどこまで予測できるか。
    method: "無衝突・無磁場で電子・イオン温度が等しい（Te/Ti＝1）水素プラズマに球形導体を置き、修正OMLと球対称PICを比較した。読解対象はarXiv:1611.08658v1で、半径と電子Debye長の比を0.25–10で変えた。"
    contribution: 遮蔽電位を解いて求めた電荷は、PICを基準とする誤差が半径比5まで約8%以下、比10で約20%だった。浮遊電位の一致だけでは電荷・電流の一致を保証しない。電流・加熱誤差には本文の概括と表からの換算に差があり、最大半径比の一部では約37%となる。
  evidence_by_item:
    question:
    - paper_id: P000094
      version_id: V2
      url: https://arxiv.org/pdf/1611.08658v1
      source_type: full_text
      locator: arXiv:1611.08658v1、PDF pp.1–3、§I
      checked_at: '2026-10-08'
    method:
    - paper_id: P000094
      version_id: V2
      url: https://arxiv.org/pdf/1611.08658v1
      source_type: full_text
      locator: 同版PDF pp.4–7、§II–III、式(6)–(16)、PIC条件
      checked_at: '2026-10-08'
    contribution:
    - paper_id: P000094
      version_id: V2
      url: https://arxiv.org/pdf/1611.08658v1
      source_type: full_text
      locator: 同版PDF pp.5–11、§III、Table I–III、式(16)のPIC基準誤差
      checked_at: '2026-10-08'
  inspection:
