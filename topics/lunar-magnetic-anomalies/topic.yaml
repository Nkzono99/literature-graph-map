entries:
- paper_id: P000107
  group: field-and-swirls
  role: 表面ベクトル磁場と磁源・スワール形態の比較
  summary:
    question: かぐやとLunar Prospectorの低高度磁場観測から月面の磁場ベクトルを全球で復元し、スワールと磁源の形態・方向を比較できるか。
    method: 高度10–45 kmの約500万件の磁場観測を選別・平均・外部場除去し、軌道に沿う一階微分を入力して230領域のSVM境界値逆解析を行った。平均半径1737.4 kmの球面上の半径方向成分をABICで正則化し、水平2成分を勾配補正付き境界積分から求めた。0.2°は格子間隔で、代表分解能は約1°の波長。
    contribution: 平均月半径球面上の3成分と全強度の暫定全球モデルを提供し、最大718 nT、電子反射法との5°×5°平均全強度相関0.671を得た。スワールの明るい部分と低～中傾斜・半径方向ゼロ等値線の対応を示し、中心異常の磁極と伸長異常の方向から、条件付きで極移動年代と磁源候補を議論した。
