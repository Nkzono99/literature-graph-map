- paper_id: P000175
  group: geology
  role: GRSによるウランとU/Th比
  summary:
    question: 月面のウランは全球でどのように分布し、トリウムとの量比（U/Th比）は地域によって変わるのか。月の裏側の高地が組成的に均一かを調べた。
    method: かぐやのガンマ線分光計でウラン由来の線を識別し、その強度から月面のウラン分布図を作成した。トリウムの分布と比較して、U/Th比の地域差を調べた。
    contribution: 月全体のウラン分布図を初めて作成した。裏側ではU/Th比に有意な地域差が見られ、高地の組成が従来考えられたほど均一ではないことを示唆した。
  evidence_by_item:
