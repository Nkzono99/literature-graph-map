- paper_id: P000267
  group: transport
  role: シース中の粒子浮遊実験
  summary:
    question: 導電面上の低密度プラズマシースで、粒子の浮遊高さを帯電理論と力の釣り合いから説明できるか。紫外線照射が浮遊高さに及ぼす影響も調べた。
    method: アルゴンプラズマ中で、ポリスチレン球・中空ガラス球・月模擬土JSC-1を浮遊させた。プローブでシース電位を測り、観測した高さをOML帯電理論と電気力・重力の釣り合いによる計算と比較した。
