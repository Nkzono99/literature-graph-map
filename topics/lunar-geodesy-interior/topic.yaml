- paper_id: P000304
  group: seismology
  role: 反復する浅発月震と断層すべり
  summary:
    question: 浅発月震は繰り返し起こり、その起動は潮汐に支配されるか。
    method: 更新されたApollo月震データから反復イベントを同定し、波形の相対位相と震源特性を比較する。
    contribution: 反対の潮汐位相でもすべり方向が一致する一組の浅発月震を見いだした。潮汐応力が主な起動要因ではない可能性と、地震に似た断層物理を示唆した。
