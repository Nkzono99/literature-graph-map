review:
- heading: 平均電流の釣り合いから、電荷のゆらぎへ進む
  paragraphs:
  - '[@P000233]の捕集理論を起点に、[@P000234]と[@P000235]は探針に届く粒子電流を扱う。小粒子を孤立球として近似するOMLと有限寸法のシースを比較する基準となり、星間粒子の衝突帯電[@P000236]へ進むと環境に応じた捕集を考えられる。[@P000094]の読了したarXiv版では、電子・イオン温度が等しい無衝突・無磁場の水素プラズマ中の非放出静止球について、修正OMLが遮蔽を解いて電荷を求めた。電子Debye長に対する半径比5まで電荷差は約8%以下、比10で約20%だが、電流・加熱には表から換算して約37%の差もある。浮遊電位、電荷、捕集電流の一致をそれぞれ評価する必要がある。'
  - 流入する電子・イオンは離散的なので、同じ環境でも粒子電荷は変動する。[@P000237]は個々の捕集によるゆらぎをモデル化し、[@P000238]は電荷分布の平均と分散をプラズマ条件へ結び付けた。凝集体の離散帯電[@P000241]と光電子シース中の帯電・軌道連成[@P000167]は、平均電荷から運動を予測する条件を考える基礎となる。[@P000270]は電荷ゆらぎによる月面上の微粒子加速を論じている。
  - 凝集体の離散帯電[@P000241]は、見通しで補正した捕集率から次の電子・イオンと表面位置を選び、全電荷に加えて局所分布を残す。読了した2017年arXiv稿では、LAB・PPD条件の凝集体のゆらぎ時間は等価球よりおおむね約3倍短かった。単一モノマーを25個まで加える成長計算では、衝突中に電荷を更新するLABと、事前に抽出した電荷を固定するPPDの双方で、パッチ分布を保持した凝集体が最も細長くなった。全電荷の変動、表面の非対称性、運動に対する時間比を分けることで、平均電荷から形状を予測する条件が具体化する。
- heading: 非球形・凝集体では、粒子ごとの捕集経路が変わる
  paragraphs:
  - 凝集体では他の粒子に遮られた方向からの流入が減る。[@P000239]はこの見通しをOMLに組み込み、[@P000240]は凝集体の帯電と電子放出を扱う。[@P000242]の不規則形状粒子の実験は、電荷をどの大きさの球で近似できるかを検討している。 Apollo試料とJSC-1Aの粒径・形状・内部空隙を三次元計測した[@P000218]は、球の近似や凝集体モデルへ与える形状の比較材料となる。
  - 凝集体の見通し遮蔽に電子放出を組み込んだMa et al. (2013)は、ヘリオシース条件で構成粒子数・疎密と正電荷のべき則を示し、5–10 nmの構成粒子の二次電子放出の粒径効果も残るとした。一方、1 AUの光電子放出の例では、光電子供給を変えると同質量球より電荷が大きくも小さくもなり、帯電履歴中の符号も異なる。形状による放出電子の再捕集と、外へ逃げる量を対応させて読む必要がある。光電子の数値比較には、原稿内の式と供給率の不一致が残る。[@P000240]
- heading: 材料の電子放出を、粉体と孤立粒子で比べる
  paragraphs:
  - 月試料の光電子放出[@P000001]、二次電子放出[@P000150]、両者を扱う[@P000243]は、帯電モデルへ入れる材料特性の基礎となる。[@P000021]は月試料・模擬粒子の電子照射帯電を比較した。
  - Horányiらは、乾燥して半径29±3 μmにそろえたApollo 17・MLS-1・JSC-1粒子を、背景熱プラズマと20–90 eV電子ビームにさらし、各設定で50回の電荷を測定した。二峰性の分布を二つの安定平衡として扱い、電流釣合いへの適合からApollo試料の有効二次電子収率は両模擬土の中間でMLS-1に近いと推定した。ただし低エネルギー測定だけでは最大収率とピークエネルギーを別々に決められない[@P000166]。
  - '[@P000265]は真空中の導体粒子が孤立照射で正、光電子放出面の近くで負になる符号差を測った。[@P000005]は月ダストの負に帯電した単粒子へUVを当て、電荷減少から効率を求めた。吸収光子当たりの収率には中性極限への外挿と光吸収モデルが入るため、直接測る電荷・効率と区別する。月試料の平衡電位や付着面からの離脱をこの実験だけで確定することはできない。'
  - '[@P000007]は表面近くの光電子シースと飛翔中の粒子を計算した。強い放出では、[@P000155]の空間電荷制限と[@P000156]の逆シースが電位分布の比較に役立つ。'
  - Sheehanらは、壁へ失う電子と放出電子の有限温度を含む平面SCLシース運動論を構築した。温度比5では規格化電位が0.51となり、著者が比較に用いる冷放出流体基準1.02の約半分になる。同温度極限ではシース電位がゼロへ向かうため、放出電子を常に冷たいと置く近似は低温環境で大きな差を生みうる。解析は浮遊平面・無衝突・半Maxwell放出を仮定し、球形ダストの曲率や収集軌道への適用には別途検討が必要である。[@P000089]
  - ダスト帯電を衝突ごとの電子数まで追う場合、Furman・Pivi（2002）の条件付き確率モデルは、平均二次電子収率に加えて電子数の揺らぎと放出エネルギーを記述する候補になる。反射・再拡散と真の二次電子の割合が変わると、総収率が近くても生成電子数分布は異なる。ただし本論文は加速器金属壁の較正であり、絶縁ダストの有限サイズや月レゴリスへの適用には材料・表面状態に応じた再較正が必要となる。[@P000091]
  - Dukes and BaragiolaはApollo 16高地土壌61241の粉体層で総電子収率を測り、本文最大値1.13、第一交差80 eV、第二交差>2 keVを報告した。低nAパルスで得た層の収率とは別に、10 keV・3 nAの走査照射下では25分差の画像に多数の粒子移動と粒子間の帯電差が現れた。電荷緩和時間が不明なため帯電像は定性的であり、負に帯電した粒子の反発が付着力を超え、衝突で法線方向の運動量を得て放出するという連鎖は著者の機構解釈として位置づけられる。固定・清浄化した一試料から月面の浮遊頻度を直接与えることはできない。[@P000151]
  - Abbasらは、Apollo11・17の孤立した正・負帯電粒子を電気力学的天秤に保持し、10–200eV電子による電荷変化を追った。多くの正帯電サブミクロン粒子が10–25eVでさらに正に帯電し、100eVでは放電する一方、大きな正粒子と掲載された負粒子は電荷の大きさを減らした。球形シリカにも似た傾向があり、粒径・初期電位・電子エネルギーを含む条件が帯電の方向を変えることを示す。ただし、小粒子の正方向増加は捕捉限界で測定が終わる場合があり、終電荷を平衡値とは扱えない。SEE収率は付着効率1と調整した入射流束を用いる逆算値である[@P000153]。
- heading: 粒子層の局所帯電と、接触による電荷移動を追う
  paragraphs:
  - 表面上の粒子では、[@P000009]の電子再捕集、[@P000010]の差動帯電と導電損失、[@P000013]の粒子と基板の隙間が論点になる。[@P000037]は模擬レゴリス上の電荷、[@P000391]は照射停止後に外部電圧で回収できた粒子の負電荷を測り、再捕集モデルと比較した。抽出・輸送・検出の選別を伴う正味電荷なので、局所パッチ電荷や粉体全体の平均へはそのまま移せない。光とプラズマを併用する[@P000014]も、測定量をそろえて比較する。
  - 接触でも電荷が移る。[@P000254]は模擬レゴリス粒子同士、[@P000255]は模擬粒子と異種材料の接触を扱う。後者では反復振動で電荷量が増えるが、接触回数や飽和を直接確定していない。仕事関数との回帰にも材料ごとの例外がある。[@P000266]では絶縁体・模擬土に70 msのUV照射でも初期電荷が残った。これは接触履歴を含む電荷分布であり、照射後の平衡電荷を一般に与える値ではない。
  - 帯電を移動へ結び付ける[@P000314]は、シリカの初速・到達高度を微小空洞の帯電と粒子間反発から調べた。[@P000317]は斜長石の速度と直径を測り、電荷共有モデルで説明しにくい関係を示した。電荷を測る実験と運動から帯電モデルを制約する実験を、試料と場の条件に沿って対応させて読める。
  - '[@P000317]は350 eV電子照射下の斜長石で、表面上6 mmの粒径と速度を同時に測った。高速側の上限は、共有電荷モデルでは仮定した電場作用距離と両立せず、孤立球モデルは負の表面電位約−350–−119 V、局所帯電モデルも従来より大きい帯電係数を必要とする。粒子電荷・粉体表面電位・電場は未測定であり、運動からモデルの必要条件を絞る研究として、電荷を直接測る実験と対応させられる。'
  - Pacaudら（2025）は、VUV照射後のJSC-1A層が+3〜+5 Vの巨視的電位でも、強電場で取り出した個粒子には正負両方の電荷があることを示した。±3.5 kVで検出した正498・負396 countsの各符号で半数以上が|Q|<10 fCだった。これはパッチ帯電・微小空隙のモデルと比較できる粒子測定であるが、光照射後の動員・捕集に加え、誘起導電と再落下時の摩擦帯電が観測分布へ混ざり得る。 [@P000052]
  - Vegaほかは、3種類の月模擬レゴリスから調製し、導電性基板へ固定した4試料を低照射量の電子パルスで測り、各パルスの間に中和を行った。Table Iの二次電子収率フィットでは、ピークは約1.4〜2.0、ピーク入射エネルギーは約430〜670 eVとなった。中和なしの400 eV反復照射では全収率が1へ近づき、粒子層の収率測定自体が生む帯電を管理する重要性を示す。組成・粒径・固定方法が同時に異なるため、個々の粒子形状の効果は独立に決まっていない。[@P000053]
- heading: 接触の履歴と、流れの中の粒子電荷
  paragraphs:
  - 接触帯電では、衝突回数に加えて粒子の姿勢と電荷分布も効く。[@P000308]は振動面上の単一球が帯電を止める姿勢へ移る過程を示した。二粒子を音響浮遊させた[@P000309]では、各衝突は確率的でも累積電荷は飽和則に従った。これらは月面固有の実験ではなく、接触帯電の履歴を理解する基礎となる。流れのあるプラズマでは、[@P000321]が遮蔽とウェイクによる粒子間力を整理し、[@P000318]がウェイク内の電荷変化を粒子運動から推定している。
- heading: 粒子の帯電条件を、電場による清掃へ利用する
  paragraphs:
  - '[@P000368]はEDSにイオナイザを組み込み、極性、照射タイミング、粒径、湿度などを変えて除去率と清掃速度を調べた。照射による電荷供給を調整することで、既存の表面接触や電子放出の研究に、帯電条件を能動的に選ぶ比較軸が加わる。これは気体中の清掃実験であり、月面の光電子・プラズマ環境への適用には電流源と環境条件の対応付けが必要になる。'
  - Dukes・Baragiolaは粉体層の総電子収率σ（二次電子δと後方散乱・再拡散電子ηの和）を、帯電を抑えた短時間・低電流照射で試料電流と収集電流から求めた。AbbasらはEDBに保持した孤立粒子の電荷変化率を電流モデルへ当てはめ、付着効率ηst=1を仮定し、電荷収支に合わせてビーム幅を調整して二次電子収率を逆算した。両者を比較するには、放出成分の定義、粒子電位による再捕捉、粒子位置での入射電子数の推定条件をそろえる必要がある。 [@P000151][@P000153]
