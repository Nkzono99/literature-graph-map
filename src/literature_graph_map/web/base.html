<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Literature Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ asset_url }}/site.css">
  <script defer src="{{ asset_url }}/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="{{ home_url }}">Literature Graph Map</a>
    <span class="site-tagline">テーマ別文献ライブラリ</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <a class="back-link" href="{{ home_url }}">テーマ一覧</a>
        {% include "sidebar.html" %}
      </div>
    </aside>
    <main id="main">
      {% block content %}{% endblock %}
      <footer class="site-footer">
        <p>{{ disclaimer }}</p>
        <a href="{{ copyright_url }}">著作権について</a>
      </footer>
    </main>
  </div>
</body>
</html>
