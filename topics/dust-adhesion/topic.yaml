- paper_id: P000216
  group: detachment
  role: 電荷ゆらぎと静電離脱
  inspection:
    level: full_text
    version_id: V1
    checked_by: ai
    checked_at: '2026-09-22'
    recheck: true
  summary:
    question: 光電子放出・電子捕獲の局所的なゆらぎは、粒子の付着を超える静電力を作るか。
    method: ナノ領域の電荷生成・消滅をMonte Carlo法で模擬し、帯電領域の配置から求めた電場と仮定した粒子電荷を、粗さ・清浄度を含む付着モデルと比較する。
    contribution: 半径20 nmの粒子と半径10 nmの帯電領域に各+10eを仮定し、最隣接させた例で約10 pNを得た。離脱条件の成否は電荷・配置・粗さ・清浄度に依存し、有効面積の記載にも不整合が残る。
  evidence_by_item:
