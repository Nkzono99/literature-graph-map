- paper_id: P000044
  group: grain-charging
  role: 薄明クレーター付近のダスト増加
  summary:
    question: 明暗境界近傍のLDEX積分電流に、太陽風・磁気異常・微小隕石衝突だけでは説明しにくいクレーター近傍の反復増加があるか。また、地形に伴う負帯電と静電輸送で、その位置・高度を説明できるか。
    method: 太陽天頂角80°〜100°の太陽風中のLDEX電流ピークを近傍谷の1.9倍超で抽出し、ARTEMISの太陽風条件、月地殻磁場、LDEX個別衝突イベントと照合して反復する5例を選別。SLDEM2015地形と表面帯電・dynamic fountainモデルで表面電位と粒子輸送距離を計算し、Apollo観測幾何も対応づけた。
    contribution: Copernicusの3例とPliniusの2例で、粒径を仮定した密度が下流側と高い電子温度に偏ることを報告し、風下壁の強い負電位による局所ダスト噴水を提案した。0.1 μmの仮定だけでは一部イベントや上流側信号を説明できず、より小さい粒子と未分離の電流背景を残す。
