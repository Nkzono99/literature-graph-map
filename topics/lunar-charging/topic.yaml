- paper_id: P000006
  group: environment
  role: SEP時の極端な帯電
  summary:
    question: 太陽高エネルギー粒子（SEP）イベントは、月面の負帯電をどこまで強めるか。
    method: 1998年4–5月の電子ビームから電位差を推定し、ACE・SOHOの粒子観測との比較とLunar Prospector全期間の事例検索を行った。
    contribution: SEPイベント時に月面と探査機の電位差が約−4.5 kVに達し、大きな負帯電がSEPと磁気圏尾部の通過に集中することを示した。
