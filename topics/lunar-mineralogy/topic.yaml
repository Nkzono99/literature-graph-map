- paper_id: P000293
  group: samples
  role: 月裏側粒子の三次元形状と集団強度
  summary:
    question: 月裏側粒子の不規則な形状はレゴリスの強度へどう寄与するか。
    method: Chang'e-6試料のX線CTと半教師あり学習で349,740粒子を再構成し、実形状を使う離散要素法で力学応答を計算する。
    contribution: 拘束圧5〜15 kPaの計算で内部摩擦角47.96°、粘着力1.08 kPaを得た。強度増加を主に粒子のかみ合いで説明した。
