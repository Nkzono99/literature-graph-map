    checked_at: '2026-10-13'
    recheck: false
  summary:
    question: Marius Hillsの縦穴はどのような形状・深さを持ち、溶岩チューブの屋根が崩れた開口という解釈は何に支えられるか。
    method: SELENE TCの斜め視点とMIのほぼ直下視点を、入射角48.0–73.3°と15.1–21.4°で比較する。鉛直孔の陰影・視線から壁と底の深さを分け、クレーター径頻度分布と単純梁モデルで再被覆履歴と屋根の許容幅を推定する。
    contribution: 303.3°E、14.2°Nの蛇行溝内に直径65 mのほぼ円形の縦穴を確認し、MIの底の影から深さ80–88 mを推定した。周囲の形態から溶岩チューブの開口を最も妥当と解釈する。梁モデルによる屋根の許容幅約370 mと溶岩シート厚20–25 mは条件付きモデル推定である。
