- paper_id: P000241
  group: stochastic
  role: 凝集体表面の離散確率帯電と形状変化
  summary:
    question: 電子・イオンの個別捕集が、凝集体の電荷統計・ゆらぎ時間と、局所電荷から受ける力・トルクを通じた成長形状をどう変えるか。
    method: 一次電子・一価イオン捕集をOMLとモノマーによる見通し遮蔽で計算し、表面パッチへ一個ずつ付着させるMarkov/Gillespie型モデルを構築した。Ar実験室プラズマと電子欠乏Hプラズマで球・凝集体を検証し、単一モノマーの追加成長を25個まで計算。PPDでは抽出した電荷を衝突中固定し、LABでは衝突中も更新した。
    contribution: PPDの凝集体電荷は平均・分散とも等価半径の球と似た傾向だが、負電荷の大きさは最大約20%増えた。LAB・PPDでゆらぎ時間は等価球よりおおむね約3倍短い。成長では表面分布を保持するPatchが両条件で最も細長くなり、SphereとPatchの充填度は区別できなかった。
  evidence_by_item:
    question:
