schema_version: 1
topic_id: plasma-expansion
title: プラズマ膨張・ウェイク
question: 希薄な領域への流入が、電位・粒子分布・イオン加速をどう生むか。
review:
- heading: 電子とイオンの速さの差が膨張を駆動する
  paragraphs:
  - プラズマが真空や低密度領域に接すると、動きの速い電子が先行し、電荷分離によって生じる電場がイオンを加速する。[@P000095]は、希薄化波が元のプラズマへ広がる過程と、イオン先端が空隙へ進む過程を整理し、宇宙物体背後のウェイクへ結び付けた。膨張する密度や速度をまず見通したいときの入口になる。
  - 無衝突膨張を扱う[@P000219]はイオン先端の加速を調べ、[@P000096]は電荷分離を詳しく扱って、先端構造とエネルギースペクトル、最大エネルギーを求めた。月の後方が埋まる過程や、推進機からプルームが広がる過程にも同じ膨張の発想が使える。物体による粒子の吸収、表面電位、磁場を順に加えることで、それぞれの対象に近づけていく。
- heading: 電子の分布から計算モデルを選ぶ
  paragraphs:
  - 電子を流体に置き換えるハイブリッドPICは、大きな空間を計算する際によく用いられる。[@P000099]は平板背後のウェイクについて、解析解・ハイブリッドPIC・完全運動論PICを比較した。電子が平衡に近い領域では結果が近く、速度分布が強く歪む領域では電子の扱いが電位や流入量の差につながる。
  - プルームを扱う[@P000100]では、電子が冷却する領域と等温に近い領域が現れ、電位井戸との相互作用が電子分布を変える。[@P000101]はXe推進機の条件でモデルを比較し、密度分布の近さに比べて電位の差が大きいことを示した。必要な出力が密度・電位・電子分布のどれかによって、モデル比較で見るべき量も変わる。
- heading: 月ウェイクは流入経路と再充填の段階で読む
  paragraphs:
  - 月ウェイクの観測は、Windの横断観測[@P000223]、Lunar Prospectorの電子・磁場観測[@P000224]、ARTEMISの三次元再構成[@P000231]をたどれる。[@P000220]は空隙断面の一次元静電PICをWind観測と比べ、境界電場で加速される対向イオン流を再現した。観測位置と膨張の段階を対応させると、理想化した空隙モデルが説明する構造を見分けられる。
  - 月の背後では、両側から入るプラズマと夜側表面の帯電が相互に作用する。[@P000102]の二次元PICは、近傍の電荷分離とイオン加速を調べ、下流で両側のイオン流が重なるまでを追った。観測では、[@P000103]が昼側で散乱した陽子の回り込みを示している。どの粒子群がどこから来たかを区別すると、局所的な膨張と表面を介した輸送を整理しやすい。
  - '[@P000104]はARTEMISの電子分布から電位を推定し、太陽風の電子温度・流速と、磁場の傾きに応じた非対称性を調べた。さらに[@P000105]は、対向イオン流が出会う中央で静電衝撃波と波動が生じる過程を計算した。プレプリントの[@P000106]は、大域的な膨張電位と局所的な衝撃波の電位を通じたエネルギー変換をまとめ、観測される粒子分布へつないでいる。
    ARTEMISで静電衝撃波を捉えた[@P000232]、電子分布から電位を復元するプレプリント[@P000262]は、計算が予測する局所的な電位構造を観測へ結び付ける。'
  - 流入する陽子には表面で反射・散乱された成分もある。かぐやPACEの反射陽子[@P000184]と近傍ウェイクのエネルギー変化[@P000186]、磁気異常からウェイクへの輸送経路[@P000273]を、ARTEMISの広域圧縮構造[@P000272]と読み比べる。Chandrayaan-2の電波観測[@P000247]は、太陽風中と磁気圏尾部の密度ゆらぎを調べる。大域的な流入・偏向と局所的な膨張を組にして扱う研究群である。
- heading: ダストとクレーターでは、物体の尺度が効く
  paragraphs:
  - Debye長より小さな負帯電粒子の背後では、イオンの集束が周囲の電位や粒子間力を変える。[@P000097]は低速流中の2粒子を計算し、流速・衝突と整列力の関係を調べた。[@P000098]は動的遮蔽を求める理論と自己無撞着PICを比較しており、粒子の帯電と非線形性をどこまで扱うかを考える際に使える。
  - 地形の陰への膨張は、クレーターへの太陽風供給に直結する。[@P000008]は表面帯電と膨張のフィードバックを扱い、[@P000048]は三次元の地形で底面・壁面へ回り込むイオン流を計算した。月全体のウェイク、局所地形の陰、粒子周囲では、物体サイズとDebye長、流速、磁場をそろえて比較するとつながりが見える。
    日夜境界の電場とダスト運動[@P000221]、日夜境界・極域での準中性破れ[@P000282]も、同じ粒子供給の違いを表面近くへつなぐ文献となる。 [@P000221]の計算は定常・準中性ウェイクと滑らかな月面の鉛直電場を扱う。地形の陰による水平電場は定性的な提案で、局所電場の数値解やダストとの自己無撞着な連成計算は行っていない。
  - 太陽嵐中のクレーターと物体帯電を扱う[@P000222]は、運動論計算を等価回路へ接続した。縦孔周囲の三次元の粒子計算[@P000225]と、ガラス管で溶岩チューブを模した実験[@P000226]は、奥へ届く粒子と壁からの電子放出を比較する。膨張前線の下の電子雲を解く[@P000264]は、クレーター内の非中性領域を解析的に扱う。地形・材料と流入条件を対応させることで、膨張理論を具体的な空洞へ適用する筋道を追える。
- heading: ウェイクによる力と電荷変化を実験へつなぐ
  paragraphs:
  - '[@P000321]は流れの中のダストについて、遮蔽、ウェイク電位、イオンの運動量移行を分けて考える基礎文献である。[@P000318]は異なる粒径の粒子対を三次元追跡し、下流粒子の電荷変化とウェイク引力を推定した。粒子周囲の電位だけでなく、相手粒子の電荷も変わることが、相互作用モデルを比較する際の軸になる。'
lineage:
- title: 膨張の電荷分離と電子分布
  steps:
  - paper_id: P000096
    title: イオン先端の加速を解く
    significance: 真空膨張の電荷分離を解析し、イオン先端の構造と到達エネルギーを求めた。
  - paper_id: P000099
    title: 電子流体近似が崩れる領域を示す
    significance: 物体背後の解析解とPICを比べ、非平衡な電子分布がウェイクの予測を変えることを示した。
    connection: 膨張モデルの電子分布を問い直す
  - paper_id: P000105
    title: ウェイクの再充填と不安定性を追う
    significance: 対向イオン流が衝突するまでを追跡し、衝撃波による減速・加熱と電磁波の励起を示した。
    connection: 初期膨張から対向流の衝突へ
- title: 月ウェイクへの粒子流入
  steps:
  - paper_id: P000103
    title: 昼側から回り込む陽子を捉える
    significance: かぐや観測と軌道計算から、昼側で散乱した陽子が深いウェイクへ入る経路を示した。
  - paper_id: P000102
    title: 表面帯電とイオン流入を同時に解く
    significance: 二次元PICで物体近傍の電荷分離と流入を扱い、物体サイズや流速の影響を調べた。
    connection: 膨張と帯電による別の流入機構へ
  - paper_id: P000104
    title: ウェイクの電位を観測から描く
    significance: ARTEMISの電子分布から電位を推定し、温度・流速・磁場方向に応じた非対称性を整理した。
    connection: 膨張モデルを電位分布と照合
