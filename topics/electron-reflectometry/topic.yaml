entries:
- paper_id: P000347
  group: fundamentals
  role: 電子反射法の基礎
  summary:
    question: 軌道上の電子から月や惑星の弱い磁場を測れるか。
    method: Apollo 15・16の観測と粒子軌道計算で、反射率と磁場・電位の関係を整理。
    contribution: 月での方法を提示し、磁場の尺度や電場・探査機電位が推定に与える影響を論じた。
