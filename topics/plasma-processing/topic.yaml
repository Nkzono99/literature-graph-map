- paper_id: P000136
  group: roughness-evolution
  role: 帯電による平滑化と平均除去速度の分離
  summary:
    question: Ar⁺でPMMAのミクロンスケールの凹凸を削るとき、局所帯電と表面形状はどう影響し合い、収率の角度依存と膜厚によってその影響はどう変わるか。
    method: 正弦波状の初期表面に対し、粒子軌道・表面電荷・Laplace電位を帯電定常まで解き、局所エッチング速度とlevel set形状更新を反復する数値計算。平均イオン90 eV、電子4 eVのPMMA/Ar⁺系で、エネルギーのみ／角度・エネルギー依存収率と帯電あり／なしを比較し、膜厚0.1–10 µmと無限厚で過渡時間も調べる。
    contribution: 帯電による側壁へのイオン偏向と谷での減速が突起の消失を早め、粗さ低下が電子遮蔽と電位を弱める循環を示した。平均除去速度は帯電で低くなるが、角度依存収率の700 sでは帯電あり・なしでほぼ一致する。角度依存収率では帯電なしでも突起が消えるため粗さの差は小さく、膜厚による帯電時間の違いは本条件の遅い形状変化に影響しない。
  evidence_by_item:
