schema_version: 1
topic_id: poisson-solvers
title: Poisson方程式・場の解法
question: 自由空間、部分周期、複雑形状の境界条件に応じて、電位と電場の数値解法を比較する。
synopsis:
- 静電計算では、電荷密度からPoisson方程式を解いて電位と電場を求める。自由空間、周期、電位を指定した壁では解く問題が異なるため、境界条件に応じて解法を選ぶ（[@P000075]、[@P000084]）。
- 自由空間では、Green関数を切り詰めたFFT（[@P000160]、[@P000083]）と、多重極展開に基づくFMM（[@P000076]、[@P000077]）が主な方法である。部分的な周期性では、周期方向数と遠方条件、正味電荷の中性化をあわせて指定する必要がある（[@P000081]、[@P000082]、[@P000080]）。
- 直交格子内で物体境界を切り取る埋め込み境界法（[@P000078]）や格子上FMMの適応化（[@P000319]）は、局所解像度と計算費用を調整する。電位だけでなく電場の精度、零モードと電位の基準の扱いが、解法を比較する軸になる。
review:
- heading: 境界条件から解法を選ぶ
  paragraphs:
  - 日本語訳の[@P000075]は、有限に支持された源を倍長格子へ零埋めし、必要な変位範囲に打ち切ったGreen関数を用いることで、FFTの循環畳込みが物理領域の離散和と一致する仕組みを説明した。三次元POT5Aでは面ごとに変換と逆変換を進め、不要領域を捨てて主データの記憶を2N³へ、変換の演算見積りを素朴な倍長実装の約7/12へ減らす。2標本のインターレース法には源の支持領域条件があり、主・副格子法では長距離成分の粗格子近似と局在する短距離補正を組み合わせる。離散和の厳密性、連続源を格子で表す精度、古い計算機上の実測時間は条件を分けて読む必要がある。[@P000075]
  - '[@P000084]はSailFFishとして、矩形等間隔格子の周期・Dirichlet・Neumann問題と完全自由空間問題をCPUのFFTWおよびGPUのcuFFTで解く実装をまとめた。非同次Dirichlet/NeumannにはFD2固有値を用い、自由空間ではHockney–Eastwoodの領域倍増とHejlesenのスペクトル核を使い、2D・3Dでは2・4・6・8・10次Gaussian核も選べる。滑らかな解析解ではPSと核に応じた収束を確認し、2次元GRAD・3次元CURLも同じ収束傾向を示す。一方、この版の混合境界は未実装で、3次元自由空間検証の格子はメモリ制約から最大512³である。GPUの1～2桁の短縮は特定装置の単精度3次元周期問題でFFT・畳み込み・逆FFTを測った結果として位置づけられる。'
- heading: 自由空間のFFTと、多重極展開
  paragraphs:
  - "[@P000160]は、単位箱内の最大source–target距離より大きいL>√dでGreen関数を切り詰め、領域内の畳み込みを保ちながらFourier変換を滑らかにする。滑らかで局在した源を一様格子で十分に解像すると、標準FFTと台形則で超代数的収束を得る。各方向4N点で高精度Nyström重みを前計算した後は2N点FFTで適用できる。変数誘電率のλ=0例ではN=200でN=250参照解に対するL²相対誤差7.92×10⁻¹²を報告する一方、非滑らかなレンズの収束は2次に近く、散乱問題では波長で測る領域拡大に伴って反復費用も増える。"
  - HE法の比較対象実装では、核の特異点の置換と台形則が電位と電場の精度を制限する。Zou et al.は滑らかなGaussian密度の2D・3D例でHE法とVGF法を比較し、VGFの急速な収束を示した[@P000083]。VGFは領域内の最大点間距離より大きな半径でGreen核を切断し、正則なFourier核から数値畳み込み核を作る。固定格子では各方向4Nの事前計算を一度行い、各方向2Nの反復solveに再利用できる。高次収束は密度の滑らかさに依存し、非平滑で強く不均一な分布に小さな誤差を求める場合、著者は適応的手法を推奨している。
  - '[@P000076]は、粒子群が作る二次元の対数ポテンシャルを多重極展開でまとめ、受け側の局所展開へ変換して子箱へ伝えるFMMを構成した。近傍は直接評価し、場は展開の解析的微分から得る。全木の箱数をO(N)に選び、展開次数と最細分箱の粒子数上限を固定できる配置では計算時間はO(N)、保存領域はO(Np)となる。VAX-8600・20項・単精度の周期モデルでは1,600粒子を6.6秒で評価し、直接法272秒と比較した。12,800粒子の60.9秒に対する約300倍の比較は、直接法の推定時間と100粒子での誤差照合に基づく。本文の導出と測定は二次元版で、三次元版は後報予定とする。'
  - '[@P000077]は、2次元の対数核に対する高速多重極法を、粒子数が閾値を超える箱だけ四分割する適応木へ拡張した。近接粒子は直接和、遠方箱は多重極・局所展開で評価し、大小の箱の相互作用を別の一覧で処理する。最小粒子間距離を機械精度より大きく保つ条件の下で、著者は固定精度なら計算量を粒子数Nに比例させると評価した。VAX-8600での強い集中分布（25,600粒子、p=17、子なし箱の上限s=30）では90.05秒で場を計算し、同論文の非適応法は2317.93秒だった。これは粒子配置への適応を示す2次元の結果で、3次元版は後の報告に委ねられている。'
- heading: 部分的な周期性と、正味電荷の扱い
  paragraphs:
  - 面内だけを周期反復する粒子電荷系では、開いた法線方向の境界条件とFourier積分を同時に扱う必要がある。Lindbo・TornbergのSE2Pは、中性電荷系の2P
    Ewald和を混合Fourier表示から導き、Gaussian分配と積分を使う粒子・格子法へつなぐ。著者が採用する遠方条件では、面内零波数は法線方向の双極子モーメントに対応する遠方電位を担い、Chebyshev補間で別に高速評価する。[@P000081]
  - SE2PではEwald和の打切りから格子数Mを、Gaussian近似から支持点数Pを選ぶ。自由方向の逆Fourier積分には過剰標本化が必要で、N=50の中性ランダム系では法線格子Mz=6MでEq40の著者報告誤差が倍精度水準まで収束した。大系のO(N
    log N)は実空間の近傍数を一定にする設計条件を伴い、速度図は逆空間項の測定である。3方向周期へ拡張するslab補正法と比較する際は、遠方条件の保持と積分誤差の制御を分けて見ると研究の違いが明確になる。[@P000081]
  - Yan・Shelleyは、カーネル独立FMMの近傍計算へ、周期Green関数から近傍像を差し引いた遠方場のM2L補正を加え、一重・二重・三重周期を扱った。演算子は源・標的配置に依存せず、近傍で得た上向き等価密度を再利用する。電荷中性や平均流指定などの整合条件を所要の周期Green関数に含め、固定精度ではO(N)の評価を保つ。LaplaceとStokes速度核の試験で基盤KIFMMに近い収束を示した。[@P000082]
  - 正味電荷を持つ二方向周期slabでは、境界条件とともに中性化の配置を定める必要がある。Balleneggerらは発散する格子和から正味電荷の項を引き、slab上下の2枚の補償壁が内部の背景力を打ち消す処方へ対応づけた。3D
    Ewaldを用いるEW3DCには一様背景の放物線電位を除く補正を加え、力とエネルギーの原点依存を取り除く。[@P000080]
  - この補正と周期像の収束は別に確認する必要がある。EW3DCの空隙誤差は面内周期長に対する空隙幅で制御され、slab厚とセル高さの比だけでは決まらない。水表面のNa⁺平均力でも、非周期の像電荷模型と二方向周期化した模型は異なるため、計算と比較模型の周期条件をそろえることが重要になる。[@P000080]
- heading: 形状と局所解像度を、格子に反映する
  paragraphs:
  - "[@P000078]の1997年技術報告版は、直交格子のセルを物理境界で切り、セル中心の未知量から有限体積法の流束を作る。境界法線勾配には切断セル自身の値を使わず、他セルから二次補間した値とDirichlet値を使う。小体積率による条件付けの悪化を抑え、点緩和によるマルチグリッドへつなげた。滑らかな係数をもつ二次元Dirichlet問題の試験で解の二次精度を支持し、一次元では体積率によらない誤差評価を示す。"
  - "[@P000078]では、境界セルの体積率を掛けた打切り誤差は一次でも、その解誤差への寄与はほぼ三次で減り、内部由来の二次誤差と分けて説明できる。境界付近だけのAMRは有効だが、内部誤差が広く分布する例では改善が頭打ちになる。行列は非対称で離散最大原理を保証せず、細い構造や不連続な内部界面、三次元への適用は別に検証が必要である。"
  - "[@P000079]は、任意の異なる内部点と立方体の境界点で指数関数展開を拘束し、最小二乗CGNRの行列積をNFFTで速める方法を示した。比較対象は、非等間隔の直積格子に適応粗化を施す有限差分マルチグリッドである。中心を細かくしたsinh格子のGaussian型解析解試験では、マルチグリッドの計算時間が17〜34倍短かった。ただし、次数と反復数が異なり、本文の精度条件と表の誤差にも食い違いがある。散在点を受け入れる方法の構成と、この直積格子での時間差を分けて読む必要がある。"
- heading: 格子上FMMを、空間・時間の適応化へ進める
  paragraphs:
  - "[@P000319]はRAMSESの一様格子にFMMを実装し、孤立境界での精度とマルチグリッドに対する並列性を比較した。[@P000320]は別のプレプリントであり、AMR・適応時間刻みへ拡張する。粗密境界をまたぐ力の対称性と運動量保存が追加の課題となる。重力場を対象とするため、静電PICへ使う場合には導体・誘電体境界への対応を別に検討する。"
  - "[@P000320]は孤立境界のRAMSES adaptive PMでAMRレベルごとの疎な木を保持し、fine treeの集約とnearest-fieldの直接相互作用で粗密界面を扱う。固定4レベルNFW haloのMGとの差は平均0.51%、最大1.55%で、固定刻み二体試験は深いAMRで参照MGより安定だった。nearest-field対称化は全相互作用の厳密な運動量保存を保証せず、非活動粗格子の多重極をdriftしないATSには同期誤差が残る。並列優位はlevelごとのセル数と時間刻みに依存し、疎な(7,13)のATSでは図示timeがMGより長い。Fig.9の疎な(7,13)ATSの図示と本文の速度優位一般化、Fig.8のcolumn density表記と体積密度単位、印刷Jeans条件Δx_min≤8λ_Jの定義は未解決。"
  - "[@P000319]は、孤立真空境界の一様格子に沈着した質量をFMM階層で解き、MGと比較した。256³格子の二均一球の断面ではポテンシャル誤差P90がFMM 0.208%、MG 0.998%だが、点源ではFMM1.25%、MG 0.0210%と逆転する。差分で求めた力の大きさの誤差も表示断面全域と物質のある領域で異なり、二球の非零密度域P90はFMM 0.894%、MG 0.523%である。FMM-1は同程度に最適化したMGより良好にスケールし、弱スケーリング効率では完全最適化MGも上回るが、絶対時間は最適化と計算機構成に依存する。AMR・適応時間刻み・GPUは将来拡張であり、導体・誘電体境界を持つ静電PICへの適用は別途検証を要する。"
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - 粒子群の場を展開係数へまとめるFMMでは、計算木の作り方が密集分布への対応を変える。[@P000076]の一様細分版は二次元対数核の遠方場を局所展開へ渡し、近傍を直接和で評価した。固定精度でNに線形という評価には、全木の箱数をO(N)に選び、最細分箱の粒子数を抑える条件がある。[@P000077]は同じ核と展開の受け渡しを保ち、粒子数がsを超える箱だけを細分して、大小の箱間の相互作用を扱った。こちらの線形評価も、最小粒子間距離と機械精度による木の深さ上限を伴う。VAX-8600の集中分布試験では、25,600粒子、p=17、s=30で適応法90.05秒、同論文内の非適応法2317.93秒だった。
  - 周期像を含む静電ポテンシャルでは、周期方向数と遠方条件を一緒に指定する。LindboのSE2Pは三次元の1/r核を面内だけ反復し、電荷中性の下で法線方向の双極子モーメントに対応する遠方電位を選ぶ。この条件を担う面内零波数項は別に保持する。同稿が説明する三方向周期の中性系では、平均電位を零に定めて全零波数を除く。Yanの一方向周期Laplace試験も1/r核の電荷中性を課し、部分周期一般には開いた方向の条件が必要とする。格子上のSailFFishも周期解の平均を零に固定するが、表示された零モード式からは源の平均も零である必要がある。周期像の数だけでなく、どの遠方条件と電位の基準を選ぶかが、これらの解法を比べる軸になる。[@P000081][@P000082][@P000084]
  - Stokes流では、比較する量が電荷・電位から力・速度・圧力へ変わる。静電場のスカラー1/r核に対し、Stokes速度核は点力を速度へ写す行列の核である。Yanの二重周期試験は、開いた方向の速度を有限にするため総力を零にする。三重周期では非零の総力を圧力勾配と釣り合わせられ、平均速度零を零波数の除外で指定する。核ごとの条件を含む周期Green関数から近傍像を差し引き、遠方場を局所表現へ変換するM2L演算子を事前に作って、自由空間KIFMMの近傍計算へ加えるのがYanらの構成である。零モードを除く操作を比べる際も、平均電位と平均流のどちらを選んでいるかを区別する。[@P000081][@P000082]
  - 自由空間FFTの精度は、領域倍増と核の作り方を分けて比べる。[@P000083]が紹介・検証するVGFは、領域内の最大点間距離より外側でGreen核を切り、零波数で正則なFourier核を作る。固定格子・核なら各方向4Nで一度準備し、反復求解を各方向2Nで行う。SailFFishはHEの領域倍増へGaussian正則化核やHejlesenのスペクトル核を組み込んでいるため、Zouの比較対象である単純な特異点置換のHEとは核が異なる。Gaussian例と滑らかなbump例は試験源・誤差尺度が違い、両稿の図から直接の速度・精度順位は決められない。SailFFishのGPUによる時間短縮は、単精度の3D周期問題でFFT・畳み込み・逆FFTを測った結果である。自由空間VGFとの比較には、共通の源・精度・測定範囲が要る。[@P000084]
- heading: 誘電体界面の条件を、粒子と場の並列計算へ結ぶ
  paragraphs:
  - "[@P000446]のarXiv:2011.10214v1は、区分一定誘電率と非一様な法線電束ジャンプをIFEで表現し、隣接領域の内点電位をDirichlet境界として更新する重なりDDMで場を並列求解する。PIC格子は全体一様、IFE格子は局所一様で領域間の解像度差を許す。局所PCG残差、DDMの新旧電位の相対変化、PICの時間発展は別の収束指標である。固定100万PICセル・約5400万粒子の216プロセス計算では、DDM上限10と6で効率62.04%と82.48%を報告した。要点はarXiv:2011.10214v1原稿に基づく。"
