- paper_id: P000265
  group: photoemission
  role: 孤立粒子と光電子層で変わる帯電符号
  summary:
    question: 自ら光電子を放出する粒子と、近くの面から光電子を集める粒子では、帯電の符号がどう変わるか。
    method: 真空中の直径90–106 µmの亜鉛・銅・黒鉛・ガラス粒子をUV照射し、ジルコニウム面からの光電子層を通る場合も比較した。落下後のファラデーカップで正味電荷の分布を測り、検出下限は約±2×10⁴電子相当だった。
    contribution: "導体粒子は孤立照射で正、光電子を出す面の近くで負に帯電した。ガラスでは接触帯電に由来する幅広い初期電荷が残り、照射中に一様な平衡へ達しなかった。電位は測定電荷からの球形近似であり、検出下限以下を含む全粒子の平均や電荷は確定していない。"
