- paper_id: P000184
  group: lunar-wake
  role: 昼側で戻る太陽風陽子とその拾い上げ加速
  summary:
    question: 月面へ入射した太陽風陽子の一部はイオンとして月面から戻るのか。その組成とエネルギー・方向分布、さらに太陽風より高エネルギーになる過程を調べる。
    method: 高度約100 kmのかぐやで、反対向きの半球視野を持つMAP-PACEのIEAとIMAにより、2008年2月27日の昼側太陽風と月面側イオンを同時観測した。前日2月26日の類似事例のTOF質量測定で組成を補い、2月27日のMAP-LMAG磁場と合わせて、低エネルギー成分と連続2周回の加速成分を比較した。
    contribution: 月面側から来る広い角度分布の陽子成分を、太陽風の月面反射・散乱と解釈し、反射陽子フラックスを元の太陽風イオンフラックスの約0.1〜1％と報告した。連続2周回では太陽風約0.75 keV/qに対し最大約5 keV/qの成分を捉え、磁場に基づく対流電場方向との対応からself-pick-up加速で説明した。
