- paper_id: P000389
  group: grain-charging
  locked_fields: []
  role: 指数減衰電位を含むダスト噴泉モデル
  summary:
    question: 月面のシース電位を指数減衰で表すと、電場で加速されたダストの折り返し高度はどう変わるか。
    method: 表面電位と等しい初期粒子電位、孤立球容量、飛行中のほぼ一定な電荷を仮定し、電位が高度とともに減衰する場合の最大高度を求めた。ESA SP-643の2007年会議録で、2006年のASR論文とは別文献である。
    contribution: シースを越える小粒子の高高度予測は先行モデルに近い一方、シース内で折り返す大粒子の低高度解を追加した。凝集離脱、初期電荷の獲得、供給率は未解決で、到達高度の計算から観測数密度は決まらない。遅い大粒子には飛行中の電荷変化も効きうる。
  inspection:
