- paper_id: P000203
  group: roughness
  role: ナノ粗面の付着測定（第2報）
  summary:
    question: ナノメートル規模の表面粗さは粒子と平板の付着力をどう変え、突起の高さと幅を考慮したモデルは実測をどこまで説明できるかを調べた。
    method: 表面のRMS粗さ0.17～10.5 nmの粒子と平板の付着力を原子間力顕微鏡で測定し、突起より大きい粒子と小さい粒子を比較した。突起の高さと幅を反映したモデルの予測を実測と照合した。
    contribution: 付着力は粗さが2 nm未満の範囲で粗さの増加とともに急減し、その後は緩やかに減った。突起の高さと幅を反映したモデルは、付着力を過小評価する既存モデルよりも、この実験系で実測をよく説明した。
