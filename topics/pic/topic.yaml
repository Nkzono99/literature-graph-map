lineage:
- title: 電荷と電場の整合性
  steps:
  - paper_id: P000062
    title: Gauss則のずれを局所的に補正
    significance: 楕円型求解を追加せず、電荷・電流の割り付けを固定しない局所拡散補正を提示した。2次元マグネトロン例では無次元係数d=0.001でGauss誤差が小さくほぼ一定になり、d=0.01では発振開始が遅れ、補正の強さが物理に影響することも示す。
    connection: ''
  - paper_id: P000159
    title: 電荷を保存する電流を構成
    significance: "初期Gauss則と適合する差分更新の下で、粒子移動に伴う密度差を格子電流へ分解し、二次スプライン等でも離散連続式を満たす。"
    connection: 誤差の補正から保存する割り付けへ
- title: 時間刻みとエネルギー保存
  steps:
  - paper_id: P000064
    title: 陰的モーメント法で粒子と流体を結ぶ
    significance: 衝突性が大きく異なる電子を同じ計算で扱い、輸送計算の時間スケールを広げた。
    connection: ''
  - paper_id: P000066
    title: 半陰解法でエネルギーを保存
    significance: 周期境界・整合する補間とcurl演算子の下で保存機構を導き、直接線形解法の1D1V/1D3V試験で全エネルギー誤差約10⁻¹⁴–10⁻¹⁵を示す。無ドリフトMaxwell平衡ではDebye長を大幅に未解像にしても数値加熱を抑える。
    connection: 陰解法の保存性を高める
  - paper_id: P000067
    title: 相対論的な保存計算を構成
    significance: "中点離散化の相対論的陰解法で総エネルギーを保存した。電荷保存とGauss則の強制は別の未実装課題として残る。"
    connection: 相対論的な完全陰解法と比較
- title: 軌道平均で保存則と大きい場刻みを結ぶ
  steps:
  - paper_id: P000472
    title: 静電系の仕事と局所電荷をそろえる
    significance: 周期一次元静電系で、CN時間中心化とセル内軌道平均を組み合わせ、非線形収束と粒子移動の条件からエネルギー・局所電荷保存を両立した。
    connection: ''
  - paper_id: P000476
    title: 非放射電磁系の保存と前処理へ広げる
    significance: 周期2D-3V Darwin系で、電荷・全エネルギー・無視座標方向の正準運動量を保つ設計と流体前処理を結んだ。強磁化での前処理効率は別の制約となる。
    connection: セル内軌道平均という共通の設計を、静電系とDarwin系の保存量の違いから比較する。
  - paper_id: P000479
    title: 旋回を解く刻みと保存用区間を分ける
    significance: 一様で定常な外部磁場の静電系で、粒子軌道の解法と多セル移動の保存用区間処理を分離し、電子旋回より大きい刻みを低周波の物理条件から選べるようにした。
    connection: 保存のためのセル分割を軌道方程式の副刻みから分け、旋回解像費用を減らす。
