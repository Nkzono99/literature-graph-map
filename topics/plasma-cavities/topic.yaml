- paper_id: P000262
  group: expansion
  role: 月ウェイク内の電子分布によるプラズマ電位推定
  inspection:
    level: preprint
    version_id: V1
    checked_by: ai
    checked_at: '2026-10-11'
    recheck: false
  summary:
    question: 月の陰へ再充填するプラズマで、左右の非対称性と中央衝撃波を含む電位構造を電子分布から推定できるか。
    method: 磁場強度が安定し電子が準静的平衡にあると仮定して左右の分布を独立に最適化し、中央は平坦な分布の端の速度から電位差を求めて接続する。質量比100の一次元PICの2時点で既知電位と比べ、ARTEMIS P1の2横断へ適用した。
    contribution: 電子分布の左右別最適化と中央の捕捉幅を組み合わせ、PICで局所電位を検証し、月ウェイクの2横断で約800 V・約200 Vの電位降下を推定した。対象は磁力線沿いのウェイク内プラズマで、空洞壁面の帯電計算ではない。
  evidence_by_item:
