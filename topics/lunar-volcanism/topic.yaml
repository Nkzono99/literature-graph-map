schema_version: 1
topic_id: lunar-volcanism
title: 月の火山活動と年代
question: クレーター年代、玄武岩層厚、揮発性物質から火山活動の時間変化を調べる。
synopsis:
- 火山活動の時間変化は、クレーター年代と玄武岩の層厚から読まれる。年代尺度（[@P000187]）に基づく裏側の海の計数（[@P000171]）は若い活動期を示し、層厚と体積（[@P000182]）や地下反射層（[@P000181]）が噴出の量と休止期を補う。
- 噴火の駆動には水の脱ガス（[@P000246]）が関わり、地形と重力は地下の貫入岩体（[@P000289]、[@P000322]）を示す。試料の鉱物と同位体（[@P000371]、[@P000372]）は、マグマの分化段階を制約する。
- 露出表面の年代頻度を噴火率へ変換するには、保存と被覆の影響を考える必要がある。表面の堆積物、地下の火成岩体、試料の履歴は異なる観測で制約されるため、対象の時期と深さを対応させて比較する。
review:
- heading: クレーター数と層厚から、火山活動の時間と量を調べる
  paragraphs:
  - 表面に残るクレーターのサイズ別頻度を年代へ対応させる枠組みが[@P000187]である。
  - HaruyamaらのTCによるクレーター径頻度の解析では、多くの裏側海は3.0 Gaより古い一方、北部Moscovienseから南部Antoniadiまで2.44–2.58
    Gaの若いモデル年代が分布した。Apollo Nなどでは大小クレーターに異なる年代曲線を当てはめられ、古い玄武岩表面の部分的な再舗装を示唆する。著者は約2.5
    Gaの遅い活動期を考えるが、2.5–3.0 Gaの表面が若い溶岩に連続的に覆われた可能性も残した。露出表面の年代頻度を全月面の噴火率や一意の休止期間へ変換する際には、保存と被覆の影響を考える必要がある。[@P000171]
  - '[@P000182]はMoscovienseの年代に玄武岩の層厚・体積を加え、長期間の活動と薄い地殻との関係を論じた。[@P000181]の地下反射層は、表面の年代だけでは見えない噴出の休止期を検討する材料になる。'
- heading: 水の研究を、マグマの噴火過程へつなぐ
  paragraphs:
  - '[@P000246]は水と爆発的火山活動の関係を扱う。表面での水の生成・保持を扱う研究と併せると、月内部からの供給と、その後に表面で起きる移動を別々の過程として追える。'
- heading: 火山の地形と地下の貫入岩体を対応させる
  paragraphs:
  - 年代と噴出量の研究に対し、[@P000289]は直径約80 kmの二つの楯状火山候補を扱う。地形に加えて一方の重力異常を調べ、地下7〜32 kmの貫入岩体と浅部マグマ貯留域を提案した。噴火した時期に、マグマがどこに蓄えられたかという問いを加える。
- heading: 受動マイクロ波と磁場・重力から火成構造を見る
  paragraphs:
  - "[@P000337]はChang’e-2のマイクロ波輝度温度から、Aristarchusの火砕堆積物の熱的特徴と広がりを再評価した。[@P000322]はDewarの磁化した高密度体を埋没玄武岩として解釈する。表面の堆積物と地下の火成岩体を異なる観測から制約する系列として比較できる。[@P000329]・[@P000330]の統合データと基盤モデルは、火山地形の解析を他ミッションの観測へ接続する。"
  - "[@P000329]は、1 m/pixelのNAC256×256画素130枚にIMP二値マスクを付け、100/20/10枚の訓練・検証・testで境界抽出を比較した。ImageNet済SwinV2-BとU-Net decoderのtest陽性IoUは0.5555±0.0159（5 seed平均±標準偏差）で、地形地図の自動化を比較する基準になる。これは10枚のtest上の形態分割成績であり、火山年代や形成機構の検証へは別の観測制約が必要になる。IMPデータカードは数十mの注釈ずれと256 mを超える約100特徴の除外を説明する。"
  - "[@P000330]はNACの不規則な海の地形を100/20/10枚の学習/検証/testで二値分割した。固定encoderのforeground IoU0.5709±0.0114はConvNeXtV2の0.5687±0.0181と近く、5乱数種のばらつきを考えると上位群は同程度である。指向ずれに伴う一部注釈の手修正と大きい地形の除外があり、火山年代の推定とは別の境界抽出支援として位置づけられる。要点は未査読のarXiv:2609.13283v1原稿に基づく。"
  - "[@P000337]は、Aristarchusから東・北へ連続する低い昼夜TB差をLPD候補とみなし、既存の地質境界と合わせてIm1期の広域的な火砕活動、Im2期の北部への縮小、Im3期の大幅な衰退と局所的残存を提案した。Krieger北のIm3では37 GHzで低TBD、低周波で高TBDとなる差から薄い火砕被覆を推定するが、厚さと新たな絶対年代は求めていない。LPD識別には別の熱物性要因が残り、活動の衰退原因や周辺堆積物の噴火源・輸送経路も未確定である。"
  - "[@P000322]はDewarの浅い高密度・磁化体、FeO・TiO₂に富むcryptomare、噴出物と背景傾向の除去後に残る盛り上がり、地域の薄い地殻を組み合わせ、埋没玄武岩の貫入体や火山を提案した。地下組成の直接測定やMohoからの供給路の復元には至らない。SPA形成後、Freundlich–Sharanov噴出物の堆積前という層序と盆地モデル年代から4.22 ±0.08 Gaへ位置づけ、埋没火成活動を初期の磁化記録へつないだ。"
- heading: 試料の鉱物と同位体からマグマの履歴を読む
  paragraphs:
  - 地形・重力に加え、[@P000378]と[@P000371]のChang’e-5鉱物分析は試料スケールで分化を調べる。前者は鉱物集団、後者は一つの玄武岩を対象とする。
  - Li同位体について、[@P000377]の高温結晶化の解釈に対し、[@P000372]は高Ti玄武岩のメルト・マントル相互作用を重視する。分化段階を比較する制約となる。
- heading: ガラス・包有物・堆積物を、揮発性成分の輸送で結ぶ
  paragraphs:
  - "[@P000463]はガラス中の水を拡散脱ガスモデルで噴火前へ戻し、[@P000464]は脱ガスを受けにくい包有物で制約した。[@P000465]は火砕粒子の軌道、水損失、反射スペクトルを結合して堆積物を逆解析する。各手法が保存・観測する噴火段階と粒径が異なるため、得られる含水量の範囲を条件付きで比較する。"
  - "[@P000464]はApollo 17高Tiオレンジガラス試料74220のかんらん石メルト包有物で水615–1410 ppmを測定し、外側のガラスの6–30 ppmと区別した。包有物にはF、S、Clも多く、捕獲後結晶化の補正では揮発性濃度が実測より平均21%低下する。結晶中の捕獲と急冷により噴火後の損失を抑えた試料として位置づけられるが、急冷・閉鎖性の解釈と補正法の詳細は別添方法に依存する。図3の点と本文実測範囲の対応は未確定である。"
  - "[@P000463]は極低Tiガラス1粒子の半径方向濃度を拡散・表面蒸発モデルで調べ、2–3 K/s、約2–5分の冷却条件でH₂Oを約98%失ったと推定した。初期水は最適745 ppm、95%信頼水準の下限260 ppmだが、破砕前の気泡形成・成長による損失は計算に含まれず、噴火前マグマの全履歴を復元した値ではない。"
  - '[@P000466]の上昇計算はH₂・H₂O・COを分け、採用範囲でCOとH₂の強い駆動作用を示した。水だけを噴火の動力源とみなす前に、揮発性成分の化学種、圧力、火道形状を試料とモデルで対応させる必要がある。'
  - "[@P000465]はBirt EとGrimaldiの水吸収強度の三測線を、噴火による粒子輸送・球内拡散・粒径依存分光換算のMCMCモデルへ結びつけた。Grimaldi二測線の共通解は低蒸発1.4×10⁻⁶ m/s、冷却6.4°C/sを支持し、破砕時溶存水約400–800 ppmを有力とする。選別した解の破砕圧力は約1–3 MPa、全分離ガスは約4500–12000 ppmであり、水量とは異なる。Grimaldi IとBirt Eの中心異常点を除き、緑色ガラスの拡散校正とオレンジガラスの破砕制約を移植するため、噴火条件の推定はこれらの前提に依存する。"
  - "[@P000466]は月ピクライトの最後の10 kmを1次元多相定常火道で計算し、入口41.31 MPa・1700 K・結晶1 vol%の基本条件と、半径10–100 mなどを変えた感度解析を比較した。H₂OとCO各5–1500 ppmではCOが火口速度・圧力を強く支配し、H₂2–90 ppmとCOのケースでは両種がほぼ同程度に寄与する。質量流量は半径が主に支配する。基本計算ではDeborah数が破砕基準0.01を下回り、火口後の真空膨張による破砕・粒子加速が別の課題として残る。密度は組成間で共通とし、水素種の量の換算も同じ元素H量を保証していないため、この順位をすべての月噴火へ外挿するには追加条件が要る。"
