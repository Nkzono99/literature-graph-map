schema_version: 1
topic_id: kaguya
title: かぐや（SELENE）の観測と研究
question: 観測装置ごとの成果と、保存データの再解析・他ミッションとの比較をたどる。
synopsis:
- かぐやは地形、重力、分光、レーダー、粒子・磁場の観測を組み合わせ、月を一つの姿として調べた（[@P000168]）。地形と重力の統合は地殻厚の推定（[@P000169]、[@P000180]）へ、カメラ画像は裏側の火山活動年代（[@P000171]）や縦孔の発見（[@P000183]）へつながった。
- 保存データの再解析によって、観測できる対象は今も広がっている。地下レーダーの表面散乱を計算し直して小規模なエコー候補を探す研究（[@P000176]）、月面で反射した太陽風陽子や月起源イオンを粒子観測から読む研究（[@P000184]、[@P000185]）、磁場観測をLunar
  Prospectorと統合した全球ベクトル場（[@P000107]）がその例である。
- 装置ごとの較正と観測幾何をそろえることが、再解析や他ミッションとの比較の条件になる。複数ミッションを位置合わせしたデータ基盤（[@P000329]）は、その比較を共通の土台で行う入口である。
review:
- heading: 装置ごとの観測を、共通の月の姿へ結び付ける
  paragraphs:
  - "かぐやは地形、重力、分光、レーダー、粒子・磁場を組み合わせて月を調べた。ミッションの全体像は[@P000168]、地下探査の装置と観測方法は[@P000276]を入口にできる。"
  - "[@P000276]のLRSは、4–6 MHzの地下レーダーと自然電波・プラズマ波の受動観測を同じ直交アンテナで行った。レーダー2363時間を取得し、低頻度の波形を含めるとほぼ全球を覆うが、50 msごとの波形には観測空白が残る。2008年9月の故障後、低高度期に再開したのはWFCの波動観測だった。保存データを比較する際は、地域だけでなく観測モードと取得時期をそろえる必要がある。"
  - "自然波の観測は地下探査と周囲のプラズマを結ぶ。[@P000276]は局所電子プラズマ周波数を追い、2007年12月13日の事例で本文が代表値として記す太陽風中の2〜3 cm⁻³から後流境界の0.5 cm⁻³への密度低下を示した。後流内部は波が弱く欠測であり、粒子・磁場との組合せは、その欠測と波の生成条件を理解する課題として残る。"
  - LALTの全球地形[@P000169]は、地殻厚の推定[@P000180]へつながる。画像から得られる形と、重力から推定する内部構造を重ねる研究の流れである。
  - Namikiらは、リレー衛星を介した4ウェイドップラーと測距・既往追跡データから、軌道と次数・位数90のSGM90dを同時に推定した。地球から見えない裏側の追跡により盆地地形に対応する環状異常を捉えたが、2007年10月–2008年4月の被覆は未完了で、次数60超には事前拘束を要し、北側には観測空白が残る。重力・地形の比較は裏側盆地の支持状態や中心質量の解釈へつながった。[@P000170]
  - "[@P000515]はLMAGの磁場を読むため、20°C・3姿勢の地上較正で感度と軸方向を求め、センサー軸間角度89.61°、89.73°、89.89°を補正の基準とした。range-0の平均オフセットは(0.0,−0.5,−1.7) nTで、本文の−35〜33°C試験では系統的な温度依存を見いださなかった。range-0の感度試験では−45〜32°C、14.7°C基準で成分最大差約1.7%、全強度変化0.34%未満となり、著者は小さな機械的変位の可能性を挙げる。SAM-Cの2つの磁場による姿勢推定は、y位置変化を除く5変数へ縮約して安定させ、予定電流2.6 A・有効288測定を仮定して角度誤差(α,β,γ)=(0.069°,0.18°,0.10°)と見積もった。補正後の約0.1 nT精度を見込む機器較正研究であり、月磁気異常や内部の解釈に先立つ測定条件を与える。 Table 6の感度誤差、Fig. 8の不適合、Eq. 9の全強度は本文との対応に未解決点がある。"
- heading: 保存データの再解析で、観測できる対象を広げる
  paragraphs:
  - "LRSが捉えた海の地下層序[@P000181]に対し、[@P000176]は表面からの散乱を計算し、小規模な地下エコー候補を探している。分光データの比較では、放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]を分けて読むと、機器間の違いを追いやすい。"
  - "[@P000176]は、静かの海Cauchy地域のLRS15軌道を、GANで改良したDEMと未解像粗さを用いた表面散乱計算と比較した。600m×100mに平均した観測と計算の差から、ランダム位相を変えた10計算すべてで閾値を超える反射候補を抽出し、地溝A延長や地溝と無関係の複数軌道上に候補群を示した。地表散乱が強い場所の地下反射は判定できず、粗さも1軌道への適合値を全15軌道へ用いているため、別地域への適用には再推定を要する。式(8)の絶対値と負の差ヒストグラム、本文・表・補足の閾値、A/C延長の記述には未解決の違いがある。"
  - "PACEでは月起源イオン[@P000185]が観測対象となった。地球起源酸素[@P000177]、月周辺のC・N・Oイオンの日変化[@P000179]へと対象が広がり、表面と周囲のプラズマを結ぶ研究に使われている。"
  - "[@P000179]は2025年プレプリントで、2008年9–11月に高度約100 kmで測った7–300 eVのC⁺・N⁺・O⁺を昼夜・月相別に比較した。磁気圏外昼側C⁺強度の太陽風陽子密度との正の傾向と満月期昼側の低強度から、太陽風スパッタリングの重要性を示唆する。イオン比の変化は窒素に富む成分と低窒素成分の混合、流星群時の短期変化と解釈されるが、月面貯蔵物質の直接同定には至らない。要点は2025年Research Square v1の報告に基づく。"
  - '[@P000184]は、月面側と反対側を向くPACEの半球視野を使い、昼側で月へ入る太陽風と月から戻る低エネルギーイオンを区別した。前日の類似事例におけるTOF測定は戻る成分がほぼ陽子であることを示す。著者は反射陽子フラックスを元の太陽風イオンフラックスの約0.1〜1％と報告し、連続2周回の最大約5
    keV/qの成分を、反射後に太陽風対流電場で加速される過程と解釈した。'
- heading: ミッションをまたいで観測をそろえる
  paragraphs:
  - "[@P000329]のSomBenchはKaguyaを含む4ミッションの観測を位置合わせし、クレーター・火山・極域を共通のデータで解析する入口を用意した。[@P000330]はそのデータから複数観測種と解像度を扱う共通表現を学習する。ミッション別の機器較正に加え、地理的な訓練・評価分割や観測幾何をそろえることが、再解析結果を比較する条件になる。両者は別論文のプレプリントとして扱う。"
  - "[@P000329]は、かぐやMIの反射率・鉱物派生層（主に±55°、60 m/pixel）、極域SP鉱物層（80–90°、1 km/pixel）、TC–LOLA併合地形をLRO等と共通境界へ合わせ、月観測を多解像度の学習・評価データへ変換した。WAC基準は51.2 km四方、NAC基準は512 m四方で、粗い層を単一値として持つ場合もある。元観測の空間分解能と補間後画素幅を区別し、鉱物反転そのものの新しい検証とは分けて読む。粗視層の最小画素数の扱いは記述だけでは明確でない。"
  - "[@P000330]は、LOLA–Kaguya統合SLDEM2015を画像的標高入力に、Kaguya MI/SPの組成・成熟度をタイル平均の文脈に用い、約1 mと100 m/pixelの月観測を同じ重みで事前学習した。位置合わせした物理量を統合する方法の例で、取得幾何token化と混合解像度それぞれの寄与を分ける検証は今後の課題である。要点は未査読のarXiv:2609.13283v1原稿に基づく。"
- heading: 観測装置から代表研究をたどる
  paragraphs:
  - "LALT（レーザー高度計）の地形観測は[@P000169]を入口にできる。地形と重力を統合した地殻厚推定が[@P000180]である。TC（地形カメラ）の画像は火山活動の年代・層厚[@P000182]を調べる。[@P000172]はMIで月の表裏に分布する新鮮露頭の1250 nm吸収を識別し、鉱物混合モデルから斜長石約98 vol%の純斜長岩（PAN）を認めた。近赤外の実分解能は62 m/画素で、Orientaleでは10 km相当へ平均すると吸収が弱まり、露頭を分離する空間分解能の重要性が示された。SIの分類Aは>98±3% plであり、成熟レゴリスの混合では推定量が下限となる。"
  - Haruyamaらは、かぐやTCの約10 m画像で月裏側の海のクレーターを計数し、Antoniadi、Apollo N・S、Nishina、Moscoviense東部に2.44–2.58
    Gaの若いモデル年代を得た。Apollo Nでは700 m超のクレーターが3.51 Ga、500 m未満が2.49 Gaの曲線に沿い、著者は古い表面を薄い溶岩が部分的に覆ったと解釈した。TC画像による小クレーターの識別が、海の形成年代と再舗装の違いを検討する手掛かりになった。年代は生成関数・年代曲線に依存し、明瞭な二次クレーターと長い影は計数から除外している。[@P000171]
  - '[@P000183]は、TCの斜め視点と太陽高度の高いMI画像を比較し、Marius Hillsの蛇行溝内に直径65 mの急峻な縦穴を確認した。壁照明のTC画像では約60
    mの壁深さ、底を観測したと解釈するMI画像では80–88 mの深さを推定する。周囲の地形は溶岩チューブの屋根崩壊による開口という解釈を支えるが、地下の横方向の空洞は直接撮像されていない。'
  - "SP（スペクトルプロファイラ）では、盆地周辺のかんらん石から深部物質の露出を検討する[@P000173]をたどれる。日陰での水氷粒子候補を扱う[@P000280]も、同じ装置のスペクトルを使う研究である。"
  - "[@P000280]は、SPの保存データを昼間の影へ広げ、60領域の低雑音スペクトルから1.25・1.5 µm帯の吸収候補を抽出した。影を照らす日照面からの反射光を仮定し、NIR2の2.0 µm帯を除く解析である。霜層と浮遊氷の両モデルが一部の形状を説明するが、1.25 µm帯の再現と氷の状態の識別は残る。暗い対象の再解析では、照明補正と雑音による選択が観測の意味を左右する。"
  - かぐやGRSの高いエネルギー分解能を生かし、U系列の1764.5 keV線とTh系列の2614.5 keV線を別々にフィットして、Uの全球分布図を作成した。月試料に規格化せず、γ線の放出・輸送と装置応答の計算で濃度を較正している。全球ではUとThがよく相関し、回帰の傾きは0.269±0.007だったが、裏側の二つの広域高地ではThが統計誤差内で一致するのに対してUの報告値は0.34±0.01と0.21±0.01
    ppmだった。併記された±は全系統誤差を含む誤差予算としては示されず、−0.11 ppmのU補正案の適用も明記されない。Uの系統誤差の可能性を残しつつ、従来一様とみなされた高地の組成差を捉えた[@P000175]。
  - '[@P000174]は、SPの1 µm吸収中の小さな盛り上がりと1.8 µm付近までの反射率増加を併用し、51のイルメナイト富化スペクトル観測点を抽出した。MIを70
    mセルで分類し、TC地形と合わせた局所解析では、多くの候補が高地を覆う暗い火砕堆積物に対応する。ただしMIには2 µm帯がなく、ガラスとオリビンの分類には重なりが残る。（PDF
    pp.3,5–7,16, §§2.1–2.2,3.1,3.2.6）'
  - LRS（月レーダーサウンダー）は地下からの反射を測る。装置・観測方法[@P000276]から海の層序[@P000181]、GRAILの質量欠損と比較したMarius
    Hillsの空洞候補[@P000195]、表面散乱を考慮した保存データの再解析[@P000176]へ進める。PACEの粒子観測はIMAによる月起源イオン[@P000185]を捉える。ウェイク陽子のエネルギー変化は[@P000186]にもつながる。PACEとLMAG（月磁場観測装置）を組み合わせた研究は[@P000178]に収録している。
  - 低高度のPACE・LMAGを使う[@P000178]は磁気リコネクションの候補を調べており、磁場の分布から局所的な粒子加速へ論点を広げている。
  - かぐやの低高度LMAG観測は、Lunar Prospectorの観測と統合し、230領域のSVM逆解析から月面ベクトル場を求める基礎となった。平均月半径の球面上で最大全強度718
    nTを推定し、Reiner Gammaの明るい模様と半径方向ゼロ付近・低～中傾斜の場との対応を示した。プラズマとの比較には、代表分解能が約1°であることと、静的な地殻場が太陽風で変形する条件を考慮する必要がある[@P000107]。
  - '[@P000111]は、2009年4月23日の昼側・南極エイトケン盆地上空約25 kmで電子加速と陽子・アルファ粒子の減速を同時に捉え、電荷当たりの約150
    eV/qの変化の対応から、かぐやより上の静的な月外向き電場を推定した。対向センサーによる粒子分布の比較により、同日の13事例でも電子加速と陽子減速が比例係数0.98、相関係数0.965で対応することを示した。'
  - かぐやのPACE/IMAは、2008年9月24日、約100 km高度でSZA 168°付近から月ウェイク深部の陽子を検出した。深部では0.1–1 keVに広がり、本文では主要部分が上向きだったと報告される。陽子信号は深部から昼側まで続き、南極付近では約3
    keVに達した。Nishino et al. は、負のByが優勢な観測条件を簡略化した軌道計算から、昼側赤道域の直下点から外れた場所で散乱した陽子の一部が、自己ピックアップとラーモア運動で夜側へ回り込み、月面近くで上向きになるType-II進入を示した。陽子が南側へ偏る領域と外向き電場による電子吸収は、この観測を説明する著者の提案である。[@P000103]
  - "[@P000173]はSPの連続スペクトルを1.6 µm未満で解析し、245観測点を34地点に整理した。露出の多くは地殻厚約30–50 kmの盆地周辺で、新鮮なクレーター壁や放出物にある。一部の代表スペクトルが約0.7 µmで絶対反射率0.23未満という暗さはduniteに富むモデルと整合するが、下部地殻のMg-rich plutonや衝撃で斜長石の帯が消えた可能性も残り、上部マントル起源は示唆にとどまる。赤道での観測面積は約20%で、非検出の解釈には観測範囲と新鮮露出への偏りを考慮する。"
- heading: 月起源イオンを、表面電位と運動電場へ結ぶ
  paragraphs:
  - '[@P000432]はかぐやで捉えた磁気尾ローブ内の月起源イオンの帯状分布を、テスト粒子計算と比べた。光電子シースでの反復反射と、その後の運動電場による加速を組み合わせることで、冷たい初期イオンから観測エネルギーへ至る経路を示した。粒子の観測高度・角度・エネルギーを、表面側の放出と場のモデルに対応させる研究である。'
comparisons: []
lineage:
- title: 地形・重力から地殻構造へ
  steps:
  - paper_id: P000169
    title: 全球の高さを測る
    significance: LALTから全球地形を整備し、盆地や極域の形を比較する基盤を作った。
    connection: ''
  - paper_id: P000170
    title: 月裏側の重力を測る
    significance: 裏側の盆地縁に対応する環状重力異常を示し、地形補正後の中心異常からType I・IIを分けた。硬い地殻・リソスフェアによる支持、中心部の過剰補償や局所補償、表側でのより大きな変形を解釈したが、北側の観測空白と次数60超の事前拘束が残る予備モデルである。
    connection: 形状と重力という異なる観測量をそろえる
  - paper_id: P000180
    title: 地形と重力を統合する
    significance: 両者を用いて地殻厚を推定し、裏側盆地の構造差を調べた。
    connection: 二つの観測から内部構造を推定
- title: 観測を統合したデータから共通学習表現へ
  steps:
  - paper_id: P000329
    title: ミッションをまたぐ月データをそろえる
    significance: "位置合わせした多ミッションデータと課題別評価を提供した。氷課題は計算指数、衝突溶融池は形態分割であり、実水量や年代の精度ではない。未査読。"
    connection: ''
  - paper_id: P000330
    title: 複数観測・解像度から表現を学習
    significance: "多観測・多解像度から表現を学び、ラベル量を変えた分類と計算氷有望度の回帰を比較した。課題別の種間ばらつきと未分離の構成要素を伴う。未査読。"
    connection: SomBenchのデータ基盤から共通表現モデルへ
