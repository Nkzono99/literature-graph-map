schema_version: 1
topic_id: lunar-water
title: 月面の水・揮発性物質
question: 月面のOH・分子水・氷は、どこで生まれ、何に保持され、どの環境で失われるか。
review:
- heading: 吸収帯から、月面の水の姿を分けて読む
  paragraphs:
  - 月面の「水」には、鉱物に結び付いたOH、分子水H2O、極域にある氷などの姿がある。[@P000138]はChandrayaan-1のM3で2.8–3.0 μm付近の吸収を捉え、OH/H2Oに対応する水和が広く分布することを示した。分子水に固有な6
    μm帯を使ったSOFIAの[@P000141]は、日照のある高緯度の観測域でH2Oを識別した。観測波長と、どの深さを捉える観測かを確認すると、表面の水和、粒子に保持された水、氷の分布を整理できる。
- heading: 極域の氷を、分光と衝突噴出物から捉える
  paragraphs:
  - 永久影の内部には周囲からの散乱光がわずかに届く。[@P000140]はその光の近赤外スペクトルから氷の吸収を抽出し、両極の光学的表層に露出した氷の分布を示した。一方、LCROSSの[@P000139]はCabeusクレーターへ衝突体を落とし、掘り出された物質の水蒸気・氷・OHを観測した。前者は露出氷の空間分布、後者は一地点の掘削された物質に含まれる水と揮発性成分を知る手掛かりになる。氷の存在とその場所の物質量を考える際に、二つの観測の違いが役立つ。 かぐやSPの[@P000280]は、異なる地方時・緯度の日陰で水氷粒子候補を検討した。永久影の長期保存と、一時的な日陰での分光解釈を、温度と照明の条件から読み比べられる。
  - LCROSSの[@P000139]はCabeusの永久影へ衝突体を落とし、噴出物の1.5・2.0 μm帯から氷、1.87 μm帯から水蒸気を識別した。視野内の水蒸気と氷は最大155±12 kgで、推定した日照噴出ダスト量に対する平均水量は5.6±2.9%だった。露出氷の分布を調べる観測に対し、一地点の掘削された物質の化学形態と水量を与える。
  - この水量は、粒径・密度・照明と視野充填率を仮定したダスト質量に依存する。衝突で温まった地面からの蒸気も加わり、噴出氷粒子の昇華と分けにくい。中性子観測と比べる場合は、掘削深さと10 km以上の観測範囲の違いも含めて読む。氷の存在の分光的識別と、濃度・極域貯蔵量の推定を分けると、保持や輸送の研究へつなぎやすい。[@P000139]
  - '[@P000328]の偏波レーダーは散乱特性から氷候補を探る。高CPRには岩塊・粗さも寄与するため、[@P000327]の永久影岩塊検出と照合する。[@P000329]・[@P000330]は観測統合と機械学習へ進む方法であり、氷有望度の推定と氷の直接同定を区別する。'
- heading: 太陽風の水素が入り、ガラスや鉱物に残る
  paragraphs:
  - 太陽風は月面へ水素を供給する。[@P000142]は陽子を注入したケイ酸塩へ微小隕石衝突を模した熱衝撃を加え、水が生成・放出される過程を実験で示した。粒子へ入った水素がどこに蓄えられるかについては、Chang’e-5の衝突ガラスを調べた[@P000148]が、水量・同位体比・内部濃度分布から太陽風由来水の保持と拡散を論じている。生成実験と試料分析を合わせると、入射した水素が表面反応を経て粒子内部に保持され、再び放出されるまでの経路を考えられる。
  - '[@P000336]は鉱物表面の吸着を第一原理計算で調べ、被覆率が増えると金属サイトへの配位から水素結合ネットワークへ安定化の主因が移ることを示した。別の水形成経路として、[@P000313]は絶縁破壊で露出する酸素と注入水素の反応を分子動力学で計算している。'
  - 表面を介した水素の戻り方にはイオン観測からの制約もある。Chang’e-6の負イオン初観測[@P000253]とH−成分の太陽風依存性[@P000252]は、入射した水素と表面から戻る粒子を結び付ける研究である。水・OHの吸収を測る分光観測とは測定量が異なるため、供給・反応・脱出の各段階へ対応させて読む。
- heading: 内部の水を、火山噴火の条件から制約する
  paragraphs:
  - 表面への太陽風供給に加え、火山由来の水も研究されている。[@P000246]は気泡成長とマグマ上昇を連成し、水の脱ガスが月の爆発的噴火を駆動する条件を求めた。火山ガラスや火砕堆積物の測定とモデルを比較することで、内部の含水量を噴火・表面への供給へ結び付ける。
- heading: 粗さと温度が、残りやすい場所を作る
  paragraphs:
  - 水分子の脱離や氷の昇華は、表面温度に敏感である。[@P000143]は日照域でも凹凸が低温部分を作り、平坦面モデルより吸着水を保持しやすくすると示した。極域では[@P000147]がcm規模までの小さな影を評価し、微小コールドトラップも氷の安定領域に寄与すると見積もった。保持の条件は分子によって変わる。Divinerの長期温度データを使った[@P000149]は、さらに低温を要するCO2の安定域を計算している。温度の最大値だけでなく、時間平均した損失を扱う点も参照したい。
  - 低温の保存を考える基礎には、[@P000324]の固相保持理論、[@P000325]のクレーター熱モデル、[@P000326]のDiviner観測がある。[@P000334]・[@P000335]・[@P000339]は熱物性を全球から極低温へつなぎ、[@P000338]は氷の形態によって熱伝導率が変わることを実験で示した。
  - 氷の保存温度を計算する基準として、[@P000334]は乾燥レゴリスの密度・接触伝導率・比熱の深さ/温度依存を整理した。上部4–7 cmの273 K換算熱慣性は平均約55 J m⁻² K⁻¹ s⁻¹ᐟ²だが、傾斜補正が良好なのは約±60°までで、30 K未満の比熱には追加実験が必要とする。永久影や氷を含む粒子間構造を扱う研究へつなぐ際は、この基準モデルの低温物性と地形条件を改めて検証する。
  - 低温域へ集まった氷の保持を考える基礎に、[@P000324]の固相・気相の収支モデルがある。希薄大気での弾道移動と再凝結を組み合わせ、cold trapの氷損失に蒸発流束による上限を与えた。120 K・永久影面積0.5%の代表計算では損失が全月面平均で約4 g cm⁻²／10億年となり、100 Kでは約4桁減る。後続のクレーター熱モデルや温度観測へは、cold trap温度と面積を場所ごとの分布へ置き換える問題としてつながる。
  - 氷が失われる過程は、起源推定にも影響する。[@P000244]は純粋な六方晶氷と平面の比表面積を仮定し、昇華によるO・H同位体の分別をモデル化した。残った氷の同位体比を供給源へ結び付ける際には、温度と失われた割合に加え、採取中の昇華も考慮する必要がある。
- heading: 地形と磁場が、水素供給と氷の損失を変える
  paragraphs:
  - 太陽風は水素の供給源であると同時に、表面氷をスパッタで失わせる要因でもある。[@P000144]は南極の実地形から水素の流束とエネルギーを地図化した。[@P000145]は極域磁場と露出氷の分布の対応を調べ、磁気異常がイオン流入と損失を弱める可能性を論じている。地形と磁場を同時に入れた[@P000146]の電磁PICでは、地形による流束変化が大きく、磁場はその分布をさらに調整する。平均太陽風と実験由来の収率を用いた氷の収支は、月面帯電の計算を揮発性物質の進化へつなぐ具体例になる。
  - 低温域では高エネルギー粒子による内部帯電も考慮する。[@P000310]は電荷蓄積と内部電場を予測し、[@P000311]は絶縁破壊による粒子構造の改変を論じた。表面への平均流束を扱う系列に、レゴリス内部の長い電荷散逸時間を加える比較対象となる。
- heading: 氷の量と温度が、地盤への寄与を変える
  paragraphs:
  - 水の存在量を地盤の強さへつなぐには、氷が粒子を結び付ける条件を調べる必要がある。[@P000292]の模擬物実験では、約90 Kで静的安息角が増えるのは氷含有量30重量%を超える条件だった。数重量%の氷があるだけで強い凝集を仮定できるとは限らず、温度と混合状態をそろえて比較する。
  - '[@P000332]は円錐貫入試験で氷の形態を比較し、粒子を結ぶ氷と分散した氷では強度・掘削性が異なることを示した。[@P000338]の熱伝導測定と合わせると、同じ氷量でも力学応答と熱応答が変わる理由を粒子間構造から考えられる。'
- heading: 着陸機の排気も、局所の水と極域の化学組成に影響する
  paragraphs:
  - '[@P000303]はChang''e-5/6の観測から、排気由来の水が粒子へ入り、徐々に放出される過程をモデル化した。[@P000305]はメタンの全球輸送を計算し、南極着陸に由来する分子が北極の永久影にも捕捉される可能性を示す。着陸地点の観測では局所的な残留を、極域の氷の解釈では遠方からの人工物質の供給も考慮する必要がある。'
lineage:
- title: 日照域の水と供給源
  steps:
  - paper_id: P000138
    title: 月面の水和信号を広く捉える
    significance: M3の反射スペクトルにOH/H2Oの吸収を見いだし、高緯度や新鮮なクレーターの分布を示した。
  - paper_id: P000141
    title: 日照域で分子水を識別
    significance: SOFIAの6 μm帯でH2Oの振動信号を捉え、OHと区別できる観測を加えた。
    connection: 水和信号から分子水の識別へ
  - paper_id: P000148
    title: 衝突ガラス中の水を調べる
    significance: 嫦娥5号試料のガラス粒子を分析し、太陽風起源の水を蓄える媒体として位置付けた。
    connection: 分光観測から試料中の貯蔵へ
- title: 極域の氷と保持場所
  steps:
  - paper_id: P000139
    title: 永久影の物質を衝突で取り出す
    significance: LCROSSの噴出物から水蒸気・氷・OHを捉え、掘削域に含まれる水の量を推定した。
  - paper_id: P000140
    title: 表面に露出した氷の分布を示す
    significance: 永久影に入る間接光を使い、両極周辺の表層に氷の吸収を見いだした。
    connection: 一地点の掘削から極域の分布へ
  - paper_id: P000147
    title: 小さな永久影まで保持面積を数える
    significance: 微小地形が作る低温の影を評価し、氷を保持できる領域を細かなスケールへ広げた。
    connection: 氷が残る場所を微小地形まで探る
- title: 排気の全球輸送と着陸地点の残留
  steps:
  - paper_id: P000305
    title: 人工揮発性物質の行き先を計算する
    significance: 排気メタンの弾道輸送と両極の永久影への捕捉を評価した。
  - paper_id: P000303
    title: 表面への水の注入と放出を調べる
    significance: 着陸画像・分光と拡散計算から、排気の水が表面に残る過程を示した。
    connection: 全球輸送に対し、別の分子種の局所的な出入りを補う
- title: 固相の保持理論から極域温度の観測へ
  steps:
  - paper_id: P000324
    title: 低温地点での固相保持を考える
    significance: 揮発性物質の損失を固体の蒸発速度から扱う枠組みを示した。
  - paper_id: P000325
    title: クレーター形状と熱物性を組み込む
    significance: 露出氷と地下氷の温度・保存条件をモデル化した。
    connection: 保持の速度論から場所ごとの熱条件へ
  - paper_id: P000326
    title: Divinerで保存可能な温度を測る
    significance: 表面・浅部の低温域を観測から制約した。
    connection: 温度モデルを軌道観測による制約へ接続
