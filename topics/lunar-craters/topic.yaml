- paper_id: P000284
  group: renewal
  role: 新規衝突による遠方の熱物性変化
  summary:
    question: 衝突の影響はクレーター外の浅部レゴリスへどこまで及ぶか。
    method: McGetchinクレーター周囲のDiviner夜間温度を測り、他の新規クレーターとも比較する。
    contribution: 幅約7 km、周囲より8〜9 K低温の領域を確認した。浅部の締まりが緩む解釈と整合し、遠方の表層更新が衝突による掘り返しに匹敵する可能性を示した。
