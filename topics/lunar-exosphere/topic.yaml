    significance: 種・高度によってスパッタの相対寄与が異なると示した。
    connection: ''
  - paper_id: P000444
    title: イオン種と電荷状態を比べる
    significance: 模擬物で陽子と単価・多価重イオンの予備測定を行った。
    connection: モデルへ与える収率を、イオン照射で評価する
  - paper_id: P000441
    title: 実月試料の幾何を測る
    significance: "実月材料の収率補正と、入射角によって増減する粗さの効果を実験で調べ、多孔質表面の角度範囲平均を三次元計算で推定した。"
    connection: 照射条件に、実材料の形状による放出の差を加える
- title: 着陸排気を局所から全球の問題へ広げる
