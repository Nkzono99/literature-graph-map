- paper_id: P000007
  group: photoelectron-sheath
  role: シースと浮遊条件
  summary:
    question: 光電子の分布と時間依存の粒子帯電は、シース内の浮遊条件をどう変えるか。
    method: 正午の平坦面を一次元PICで計算し、月試料由来の電子分布とMaxwell分布、粒子の帯電・軌道を比較した。
    contribution: 非単調な電位分布を示し、浮遊の平衡点が存在しても粒子がそこへ到達するとは限らないと整理した。表面からの剥離は扱わない。
  evidence_by_item:
