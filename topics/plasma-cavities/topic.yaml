review:
- heading: 空間の陰が、電子とイオンの届き方を分ける
  paragraphs:
  - '[@P000219]の真空膨張と[@P000220]のウェイクPICは、希薄な領域へプラズマが入る過程を扱う。[@P000096]のイオン先端とエネルギーの理論も、電荷分離による加速を考える基礎となる。地形が流れを遮る場合には、空洞寸法、デバイ長、流速と熱速度の比が、流入する粒子と電位を比較する軸になる。'
  - '[@P000008]はクレーターへの流入と表面帯電の相互作用を扱い、[@P000222]は太陽嵐中へ広げた。深い空洞では[@P000012]、寸法の違いは[@P000015]、流速と熱速度の比は[@P000016]からたどれる。'
  - 月全体のウェイクでは、Wind[@P000223]、Lunar Prospector[@P000224]、ARTEMISの三次元再構成[@P000231]が観測から空隙の構造を調べる。静電衝撃波の観測[@P000232]と、電子分布から電位を復元するプレプリント[@P000262]は、再充填に伴う局所構造へ論点を広げる。日夜境界の電場とダスト[@P000221]、日夜境界・極域での準中性破れ[@P000282]を合わせると、大域ウェイクと地形による陰を粒子供給の差から読み比べられる。
  - 永久影クレーターへの供給を見積もる[@P000058]に対し、[@P000048]は三次元の底面・壁面へのイオン流を計算する。縦孔周辺の[@P000225]は深い地形へ対象を広げ、[@P000264]は膨張前線と表面の間の電子雲を解析した。形状の違いと非中性領域の扱いをそろえることが、負のクレーター電位と正になりうる深い空洞の電位を比較する条件になる。
- heading: 実験と微細加工の研究から、形状の効果を比較する
  paragraphs:
  - '[@P000263]のクレーター実験は、デバイ長と地形寸法の比によって内部電場が変わることを示す。[@P000226]の管を使った実験は、入口と壁面による電子遮蔽に加え、イオン誘起二次電子が奥の正電位を抑える効果を調べた。'
  - 微細加工の[@P000230]は、斜めに入射する電子がパターンで遮られることで局所損傷が生じることを示した。[@P000227]は電子温度と溝底電流、[@P000228]は局所電位と側壁の削れを結び付ける。月面空洞との比較では、幾何形状と流入分布に加えて、衝突や材料の条件もそろえる。
    アスペクト比による底面帯電[@P000133]と、一様なプラズマ中でも生じるノッチの計算[@P000229]を加えると、上流の一様性と局所の電流収支を区別して比較できる。
  - 加工中の溝では、流入粒子が形状そのものを変える。[@P000129]の照射と表面反応の実験、[@P000131]のRFシースと装置計算の接続、[@P000132]の輸送・反応・場のハイブリッド計算は、溝へ与える入射条件を考える前段になる。[@P000136]は帯電とエッチング、粗さの更新を結合した。形状を固定する月面空洞の計算と比較する際には、表面更新の時間スケールも条件に含める。
- heading: 計算出力と図の再現へ進む
  paragraphs:
  - 論文から計算条件を追うために、公開出力も参照できる。[@P000344]は空洞サイズ依存の図に対応するHDF5とNotebook、[@P000345]は流速・熱速度比の計算出力と半解析コード、[@P000346]は極域クレーターのhybrid
    PICのVTK・DAT出力を提供する。これらは関連論文とは別の公開データ記録であり、ここでは説明とファイル一覧を確認している。
lineage:
- title: 電子遮蔽から局所的な加工形状へ
  steps:
  - paper_id: P000230
    title: 入射方向の遮蔽を測る
    significance: 高アスペクト比のパターンによる電子遮蔽を損傷の実験から調べた。
  - paper_id: P000227
    title: 電子温度と流入量を結び付ける
    significance: 電子温度が溝壁電位と底部への電流を変える過程を計算した。
    connection: 遮蔽を速度分布と局所電位から説明
  - paper_id: P000228
    title: 電位から削れる場所を予測する
    significance: 粒子軌道と帯電の時間変化を加工形状の発展に結び付けた。
    connection: 流入の偏りから側壁の形状へ
