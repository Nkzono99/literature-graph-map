lineage:
- title: 遮蔽の観測から電荷分離へ
  steps:
  - paper_id: P000109
    title: 中性原子で太陽風の遮蔽を撮る
    significance: "高エネルギー中性水素の減少域と周囲の増強環を画像化し、太陽風が局所的に遮蔽される解釈を示した。低エネルギーの起源と三次元構造は未確定。"
    connection: ''
  - paper_id: P000110
    title: 磁気異常上の電位を遠隔推定
    significance: "通常昼側の経験的な中性水素エネルギー関係を用い、磁気異常上の陽子減速から正電位を遠隔推定した。"
    connection: 遮蔽の分布から電位へ
  - paper_id: P000112
    title: 電子とイオンの運動を三次元で解く
    significance: 基準Run Aでは電子とイオンの侵入差が作る法線電場によりイオンが減速・偏向し、電子のE×Bドリフトが非対称なハローを生む。低速風でハロー・逆流イオンが消えても局所的な表面入射抑制が残り、IMF倍増で反射割合が下がっても表面遮蔽が改善するため、構造・反射・表面到達を分けて評価する必要を示す。
    connection: 電荷分離を粒子運動で説明
- title: 局所環境から広域の太陽風擾乱へ
  steps:
  - paper_id: P000115
    title: Reiner Gammaの環境を計算
    significance: 観測に基づく磁場で、太陽風の入射や磁気シース通過に伴う局所プラズマの変化を調べた。
    connection: ''
  - paper_id: P000117
    title: 粒子の再分配を全球へ広げる
    significance: 主要磁気異常のENA欠乏と周囲1,000 km超の増強を示し、小異常では高動圧で遮蔽が弱まる一方、SPAでは強まる統計的応答を得た。反射陽子の再入射と太陽風偏向を、その広域差を説明する機構として提案した。
    connection: 局所環境から広域の観測へ
  - paper_id: P000163
    title: 反射陽子が作る広域構造を考える
    significance: 夕方側のSPA上空で頻発する流れの擾乱から、proto-magnetosheathという相互作用領域を提案した。
    connection: フラックスの再分配から流れの変化へ
- title: 月裏側の古地磁気からダイナモ史へ
  steps:
  - paper_id: P000288
    title: 若い裏側試料の磁場を制約する
    significance: 隕石の古地磁気をApollo試料と比較し、全球磁場の停止時期を検討した。
    connection: ''
- title: 外来磁性物質の堆積条件を調べる
  steps:
  - paper_id: P000437
    title: 盆地形成天体による物質供給
    significance: 外来物質の分布と磁性で異常を説明する仮説を示した。
    connection: ''
  - paper_id: P000438
    title: 対蹠点堆積と冷却磁化
    significance: "斜め衝突による天体物質の対蹠点堆積と着地後の冷却磁化をモデル化した。古磁場推定は層の幾何・組成・磁化特性に依存する。"
    connection: 物質供給の仮説を対蹠点の堆積・熱条件で評価する
  - paper_id: P000439
    title: 衝突条件の範囲を探索
    significance: 多様な速度・角度・天体径で対蹠点と近傍の堆積を比べた。
    connection: 一例の成立条件を広いパラメータ範囲へ広げる
  - paper_id: P000436
    title: 月自転による輸送差を加える
    significance: 現在の自転周期で方向・角度に応じた堆積差を示した。
    connection: 衝突条件に自転と衝突位置の感度を加える
