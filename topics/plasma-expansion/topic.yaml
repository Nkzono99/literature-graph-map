- paper_id: P000224
  group: lunar-wake
  role: 近月ウェイクの観測によるKappa膨張解の検証範囲
  summary:
    question: 月の近傍ウェイクで電子と磁場の構造は高度・太陽風条件にどう依存し、Kappa電子を用いた空洞への膨張解でどこまで説明できるか。
    method: 地球周辺の影響と時間移動後のWind磁場との不対応を除いたLunar Prospectorの3813軌道を解析した。月向き電子のKappaフィットから密度・温度を近似し、500–2000 eVの分布シフトから衛星帯電を含む電位差を導出した。高度・太陽風条件別の統計、1次元準中性Kappa膨張解、電子圧力からの反磁性電流と磁場計算を比較した。
    contribution: 85–115 kmでは中央磁場増大と膨張域の減少、20–45 kmでは地殻磁場の強い寄与を示した。電子密度は2桁以上低下し温度は最大約1桁上昇した。Kappa解は等温Maxwell解より電子量の基本形に合うが、高Zの密度、約75 km/sの再圧縮速度、中央磁場の形と方向依存には差が残り、LP位置では音速膨張と小異方性の磁気音速膨張を識別できない。
