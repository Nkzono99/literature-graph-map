- paper_id: P000189
  group: renewal
  role: LROC時系列画像による衝突と表層更新
  summary:
    question: 現在の月面でクレーターはどの頻度で形成され、衝突直後の噴流や遠方まで飛ぶ放出物は表層のレゴリスをどのように更新するか。
    method: 月探査機LROの狭角カメラLROC NACが撮影した衝突前後の画像対を比較し、新しいクレーターと周囲の反射率変化、二次衝突の痕跡を調べた。
    contribution: 直径10 m以上の新生クレーターは標準モデルの予測より多かった。周囲の反射率変化を地表に沿う噴流の痕跡と解釈し、二次衝突が表層2 cmを従来モデルより速く攪拌すると推定した。
  evidence_by_item:
    question:
    - paper_id: P000189
      version_id: V1
