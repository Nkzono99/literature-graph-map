- paper_id: P000289
  group: reservoirs
  role: 大型楯状火山と浅部マグマ貯留域
  summary:
    question: 月に大型楯状火山と、それを供給した浅部マグマ貯留域が存在したか。
    method: Prinz-HarbingerとTheophilusの地形を調べ、重力異常から地下の貫入岩体を推定する。
    contribution: 直径約80 kmの二つの楯状火山候補を示した。一方の重力異常を深さ7〜32 kmの貫入岩体で説明し、浅部貯留域からの噴火を提案した。
