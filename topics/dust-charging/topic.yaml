- paper_id: P000235
  group: collection
  role: 有限寸法の球・円筒探針理論
  summary:
    question: 静止した無衝突のマクスウェル分布プラズマ中で、球・円筒形の導電性探針が集める電流は、探針の半径と電位、イオンと電子の温度比によってどう変わるかを調べた。
    method: 電子とイオンをともにマクスウェル速度分布とし、電荷密度を与える非線形積分方程式を反復計算で解いた。シースと準中性領域をあらかじめ分割せず、探針の電流―電位特性を求めた。
    contribution: 球・円筒探針について、高温側粒子のデバイ長の100倍までの半径で電流―電位特性を求めた。探針に引かれる粒子を単一エネルギーとする近似が、マクスウェル分布の結果を十分に再現しない場合を示した。
  evidence_by_item:
