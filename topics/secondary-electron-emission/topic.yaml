    question: 測定した放出収率と個々の電子のエネルギースペクトルから、一次電子1個の衝突で生じる電子数・同時エネルギー・放出方向を、確率の正規化とエネルギー上限を保ってどう生成するか。
    method: 弾性反射・再拡散・真の二次電子を分け、侵入電子に条件付けたPoisson／二項分布と合計エネルギーを制限したガンマ型同時分布を構築。逆累積によるMonte Carlo生成法を示し、化学処理済みCuと304鋼の特定データへ較正し解析式と生成結果を比較。
    contribution: 平均収率、単電子スペクトル、その積分、個別・合計放出エネルギー上限が一致する現象論的粒子境界モデルを提示。旧較正のjet spectrum取り違えを修正し、Cu・鋼の表面状態別パラメータと電子数分布の差を示す。
