- paper_id: P000231
  group: expansion
  role: ARTEMISによるウェイクの三次元再構成
  summary:
    question: 月の背後にできるプラズマ希薄領域では、密度・温度・圧力・磁場・流れが三次元的にどう分布し、その構造が太陽風と惑星間磁場の条件にどう応答するかを調べる。
    method: ARTEMISの2機で近傍太陽風とウェイクのプラズマ・磁場を同時測定した。約600回の通過で得た両者の差を座標系に合わせて集約し、ウェイクの三次元構造を再構成した。
    contribution: 希薄化の波が高速MHD波の速度で外へ広がり、内向きのプラズマ流入が磁場を圧縮することを示した。磁場変動の大きさは下流距離、太陽風イオンβ、太陽風と惑星間磁場のなす角に依存した。
