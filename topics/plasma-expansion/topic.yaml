- paper_id: P000096
  group: expansion
  role: 有限時刻のイオン先端とエネルギー端
  summary:
    question: 鋭い境界を持つプラズマが真空へ膨張するとき、準中性が破れるイオン先端の電場・密度構造と、有限時刻の最大イオンエネルギーはどう決まるか。
    method: 一次元・無衝突・静電場で、初期静止の冷イオンと一定温度のBoltzmann電子を仮定。Poisson方程式とイオン流体方程式をLagrange型コードで解き、先端電場の補間式と長時間漸近式を比較した。
    contribution: 先端電場が長時間には内部自己相似電場の約2倍になることを示し、先端速度・位置と有限時刻のエネルギー端を近似式で求めた。長時間の先端ではZnᵢ/nₑ≈2となり、本紙の鋭い初期境界ではイオン密度の盛り上がりがない。
