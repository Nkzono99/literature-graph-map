    method: かぐやが観測した酸素イオンのエネルギーと、月が地球のプラズマシート内にある条件を比較した。金属への侵入深さと地球上層大気の酸素同位体の特徴も合わせて検討した。
    contribution: 月がプラズマシート内にあるときだけ、1〜10 keVの酸素イオンを多数検出した。地球起源の酸素が月の表土の浅部へ注入され、酸素16に乏しい成分の供給源になると解釈した。
