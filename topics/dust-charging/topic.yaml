- paper_id: P000270
  group: stochastic
  role: 電荷ゆらぎによる微粒子の加速
  summary:
    question: 太陽光の影響が小さい月の夜間などに、粒子電荷のゆらぎが微粒子を加速し、月周囲のダスト系から離脱させる可能性を調べる。
    method: 電子・イオンの微視的電流と粒子電荷のゆらぎを扱い、帯電過程を含む物質・エネルギーの交換が、粒子の平均エネルギー増加と加速につながる仕組みを検討する。
    contribution: 電荷ゆらぎにより、ナノ粒子やサブミクロン粒子の速度が大きく増す可能性を示した。十分小さなナノ粒子は月の脱出速度を超えうる一方、静電相互作用で形成される系の大粒子の従来の見積もりは有効とした。
