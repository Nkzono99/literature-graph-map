- paper_id: P000299
  group: thermal
  role: Apolloコアの熱ルミネッセンス温度推定
  summary:
    question: 返還試料から浅部レゴリスの温度と熱波の到達深度を復元できるか。
    method: Apollo 17コアの深さ95〜291 cmの自然熱ルミネッセンスをピーク分離し、平衡温度を推定する。
