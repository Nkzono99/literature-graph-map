  group: photoemission
  role: 光電子シース中のダスト音波の非線形発展
  summary:
    question: 日照側の月面光電子シースで、正帯電ダストを含むプラズマの大振幅ダスト音波は、電子の高エネルギー成分と温度比に応じてどのように急峻化し、波形が崩れる砕波に至るか。
    method: 正帯電ダストとκ分布電子を扱う流体モデルを用い、月の光電子シースではイオン密度を無視した。平衡電荷中性と行列の対角化から非粘性Burgers方程式を導き、波形の時間発展を数値解析した。
    contribution: 計算では局在した対称パルスが時間とともに急峻化した。κが小さいほど振幅が大きくなり、砕波が早まった。ダスト対電子の温度比の増加も振幅を大きくし、最終的に砕波を生じさせた。
