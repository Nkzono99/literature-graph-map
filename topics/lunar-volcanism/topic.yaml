lineage:
- title: 裏側の火山活動を年代と体積で読む
  steps:
  - paper_id: P000171
    title: 海の年代を広域で求める
    significance: 5領域に2.44–2.58 Gaの若いモデル年代を見いだし、Apollo Nなどの大小クレーターで異なる年代曲線から部分的な再舗装を示唆した。多くの海の3.0
      Ga以前の形成と若い活動の継続を分け、約2.5 Gaの活動集中には継続的な被覆という代替解釈も残す。
    connection: ''
  - paper_id: P000182
    title: Moscovienseの層厚と体積を加える
    significance: 活動期間と噴出量を地殻厚の違いへ結び付けた。
    connection: 広域の年代から地域の噴出史へ
- title: 火山地形から浅部の供給源へ
  steps:
  - paper_id: P000289
    title: 大型楯状火山の貯留域を推定する
    significance: 火山形態と重力異常を組み合わせ、浅部貯留域からの噴火を検討した。
    connection: ''
