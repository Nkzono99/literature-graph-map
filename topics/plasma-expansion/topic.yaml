- paper_id: P000102
  group: lunar-wake
  role: 表面帯電による前加速と有限幅wakeの二流
  summary:
    question: 非磁化の絶縁障害物の表面帯電はwakeへのイオン流入をどう変え、有限サイズと対流時間は自己相似解との差にどう現れるか。
    method: 電子とイオンを粒子で扱う二次元電磁full-particle計算で粒子吸収と衝突位置の帯電を入れ、Debye長/障害物半径を1/8と1/16で比較。斜め磁場下の密度・速度・圧力・温度・速度分布を有限イオン温度の自己相似解と照合。
    contribution: 夜側の負帯電に伴う電子・イオン密度差と希薄波先端前のイオン加速を示し、下流では両側からの低温流入が重なって全体温度・圧力が上がる機構を区別した。大きい障害物に相当する尺度比と遅い流速は近傍の加速時間を増す。
