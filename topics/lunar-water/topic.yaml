schema_version: 1
topic_id: lunar-water
title: 月面の水・揮発性物質
question: 月面のOH・分子水・氷は、どこで生まれ、何に保持され、どの環境で失われるか。
synopsis:
- 月面の水には、鉱物に結び付いたOH、分子水、極域の氷という姿がある。広域の水和（[@P000138]）、分子水の識別（[@P000141]）、永久影の露出氷（[@P000140]）とLCROSSの掘削物質（[@P000139]）は、観測波長と捉える深さが異なるため、分布と量を分けて読む。
- 供給は太陽風の水素注入と火山由来の水に分かれ、注入後の保持と加熱による放出（[@P000148]、[@P000142]）が経路を結ぶ。損失は温度に敏感で、固相の保持理論（[@P000324]）、微小コールドトラップ（[@P000147]）、粗さと熱脱離（[@P000143]）が残りやすい場所を与える。
- 地形と磁場は水素の供給と氷の損失を同じ場所で変えるため（[@P000144]、[@P000146]）、正味の氷量は供給・温度・損失を合わせないと決まらない。氷の量は地盤の強さ（[@P000292]）や着陸機の排気（[@P000303]）とも関わる。
review:
- heading: 吸収帯から、月面の水の姿を分けて読む
  paragraphs:
  - 月面の「水」には、鉱物に結び付いたOH、分子水H2O、極域にある氷などの姿がある。[@P000138]はChandrayaan-1のM3で2.8–3.0 μm付近の吸収を捉え、OH/H2Oに対応する水和が広く分布することを示した。分子水に固有な6
    μm帯を使ったSOFIAの[@P000141]は、日照のある高緯度の観測域でH2Oを識別した。観測波長と、どの深さを捉える観測かを確認すると、表面の水和、粒子に保持された水、氷の分布を整理できる。
- heading: 極域の氷を、分光と衝突噴出物から捉える
  paragraphs:
  - 永久影の内部には周囲からの散乱光がわずかに届く。[@P000140]はその光の近赤外スペクトルから氷の吸収を抽出し、両極の光学的表層に露出した氷の分布を示した。一方、LCROSSの[@P000139]はCabeusクレーターへ衝突体を落とし、掘り出された物質の水蒸気・氷・OHを観測した。前者は露出氷の空間分布、後者は一地点の掘削された物質に含まれる水と揮発性成分を知る手掛かりになる。氷の存在とその場所の物質量を考える際に、二つの観測の違いが役立つ。
    かぐやSPの[@P000280]は、異なる地方時・緯度の日陰で水氷粒子候補を検討した。永久影の長期保存と、一時的な日陰での分光解釈を、温度と照明の条件から読み比べられる。
  - LCROSSの[@P000139]はCabeusの永久影へ衝突体を落とし、噴出物の1.5・2.0 μm帯から氷、1.87 μm帯から水蒸気を識別した。視野内の水蒸気と氷は最大155±12
    kgで、推定した日照噴出ダスト量に対する平均水量は5.6±2.9%だった。露出氷の分布を調べる観測に対し、一地点の掘削された物質の化学形態と水量を与える。
  - この水量は、粒径・密度・照明と視野充填率を仮定したダスト質量に依存する。衝突で温まった地面からの蒸気も加わり、噴出氷粒子の昇華と分けにくい。中性子観測と比べる場合は、掘削深さと10
    km以上の観測範囲の違いも含めて読む。氷の存在の分光的識別と、濃度・極域貯蔵量の推定を分けると、保持や輸送の研究へつなぎやすい。[@P000139]
  - '[@P000328]の偏波レーダーは散乱特性から氷候補を探る。高CPRには岩塊・粗さも寄与するため、[@P000327]の永久影岩塊検出と照合する。[@P000329]・[@P000330]は観測統合と機械学習へ進む方法であり、氷有望度の推定と氷の直接同定を区別する。'
- heading: 太陽風の水素が入り、ガラスや鉱物に残る
  paragraphs:
  - 太陽風は月面へ水素を供給する。粒子へ入った水素がどこに蓄えられるかについては、Chang’e-5の衝突ガラスを調べた[@P000148]が、水量・同位体比・内部濃度分布から太陽風由来水の保持と拡散を論じている。
  - 水素の供給と水の放出を結び付けるには、注入後の鉱物が何を保持し、どの加熱で放出するかを分けて考える必要がある。Zhuらは無水に近いかんらん石へ10 Kで5
    keVのD₂⁺を注入し、300 Kまでの緩やかな昇温とCO₂レーザーの短時間加熱を比較した。注入と昇温だけでは気相D₂Oが背景より上に出ず、基底10 Kおよび昇温後300
    Kから約1,400 Kへ達する熱パルス中にD₂Oが放出された。処理後の穴と非晶質リム内の空隙は、保持種から生じた水蒸気が空隙を成長・破裂させる機構を支持する。ただし、固体の約8.6
    eV帯はD₂OとODを区別しないため、注入時にできた水の解放と、保持された水酸基などから加熱時に生じた水の放出は分離されていない。この実験は太陽風由来水素の保持と衝突加熱を結ぶ経路を示し、月の総水量への寄与率は今後の条件別の収率評価に残る。[@P000142]
  - '[@P000336]は鉱物表面の吸着を第一原理計算で調べ、被覆率が増えると金属サイトへの配位から水素結合ネットワークへ安定化の主因が移ることを示した。別の水形成経路として、[@P000313]は絶縁破壊で露出する酸素と注入水素の反応を分子動力学で計算している。'
  - 太陽風水素の月面での収支には、植え込みとともに負電荷を帯びて戻る経路も含まれる。[@P000253]はChang’E-6のNILSで局所H−を検出し、反射陽子の角分布と軌道の太陽風フラックスを用いて、入射陽子に対するH−反射率を2.5（−0.8、＋1.2）%と推定した（90%区間）。観測スペクトルの対数正規近似による平均は239
    eVで、約466 eVの上流陽子を基準にすると約49%の損失に相当する。近傍磁気異常と表面電位による局所入射条件への依存があり、水・OHの生成率と結びつけるには別の表面反応・組成の資料を要する。
  - Zhong et al.はWieser et al.のChang’E-6/NILS初検出データを6区間に分け、200 eVから各区間の太陽風エネルギーまでの有意なH−成分が太陽風の法線方向フラックスとエネルギーに応答することを示した。選別した高エネルギー成分の平均250–300
    eVは、太陽風水素の月面後方散乱による生成の解釈を支える。H−と中性粒子の会合脱離によるH2・OH生成は著者が提案した経路で、月水への寄与量は求めていない。[@P000252]
- heading: 内部の水を、火山噴火の条件から制約する
  paragraphs:
  - 表面への太陽風供給に加え、火山由来の水も研究されている。[@P000246]は気泡成長とマグマ上昇を連成し、水の脱ガスが月の爆発的噴火を駆動する条件を求めた。火山ガラスや火砕堆積物の測定とモデルを比較することで、内部の含水量を噴火・表面への供給へ結び付ける。
- heading: 粗さと温度が、残りやすい場所を作る
  paragraphs:
  - 水分子の脱離や氷の昇華は、表面温度に敏感である。極域では[@P000147]がcm規模までの小さな影を評価し、微小コールドトラップも氷の安定領域に寄与すると見積もった。保持の条件は分子によって変わる。Divinerの長期温度データを使った[@P000149]は、さらに低温を要するCO2の安定域を計算している。温度の最大値だけでなく、時間平均した損失を扱う点も参照したい。
  - '[@P000143]は、800個の面からなる粗い月面について、影・相互照射・法線方向の熱伝導を計算し、単分子層以下の水の一次熱脱離と結合した。粗さは太陽を向く面の早朝の脱離を促す一方、低温の斜面に一部を残す。残存率は夜明けの水量に対する面積加重平均である。赤道では平坦面が日の出後約5時間でほぼ乾くのに対し、粗面には24時間後にも約20%が残り、粗い地形では5日後まで少量が脱離する。45°Nのξ≳0.2では正午を越えて数%が残り、70°Nのξ≥0.21では約10%が正午まで残った。これらは脱離活性化エネルギーを8×10⁻²⁰
    Jとした既存吸着水の熱脱離計算であり、光や粒子による損失、再吸着を含む実際の水量は別途評価する必要がある。'
  - 低温の保存を考える基礎には、[@P000324]の固相保持理論、[@P000325]のクレーター熱モデル、[@P000326]のDiviner観測がある。[@P000334]・[@P000335]・[@P000339]は熱物性を全球から極低温へつなぎ、[@P000338]は氷の形態によって熱伝導率が変わることを実験で示した。
  - 氷の保存温度を計算する基準として、[@P000334]は乾燥レゴリスの密度・接触伝導率・比熱の深さ/温度依存を整理した。上部4–7 cmの273 K換算熱慣性は平均約55
    J m⁻² K⁻¹ s⁻¹ᐟ²だが、傾斜補正が良好なのは約±60°までで、30 K未満の比熱には追加実験が必要とする。永久影や氷を含む粒子間構造を扱う研究へつなぐ際は、この基準モデルの低温物性と地形条件を改めて検証する。
  - 低温域へ集まった氷の保持を考える基礎に、[@P000324]の固相・気相の収支モデルがある。希薄大気での弾道移動と再凝結を組み合わせ、cold trapの氷損失に蒸発流束による上限を与えた。120
    K・永久影面積0.5%の代表計算では損失が全月面平均で約4 g cm⁻²／10億年となり、100 Kでは約4桁減る。後続のクレーター熱モデルや温度観測へは、cold
    trap温度と面積を場所ごとの分布へ置き換える問題としてつながる。
  - 氷が失われる過程は、起源推定にも影響する。[@P000244]は純粋な六方晶氷と平面の比表面積を仮定し、昇華によるO・H同位体の分別をモデル化した。残った氷の同位体比を供給源へ結び付ける際には、温度と失われた割合に加え、採取中の昇華も考慮する必要がある。
- heading: 地形と磁場が、水素供給と氷の損失を変える
  paragraphs:
  - '[@P000145]はLP・Kaguyaの磁力計観測を高度と分解能をそろえて地図化し、南極Shoemaker・Sverdrup上空に高度20 kmで約4
    nTの磁気異常があり、既報の露出氷推定分布とおおむね重なることを示した。低角度で入射する太陽風を異常が偏向し、既存氷のスパッタ損失を減らす可能性を提案する。ただし地図の水平分解能は約60
    kmで、極域のイオン束低下率や氷寿命の延長は計算していない。太陽風水素の供給を抑える作用と、氷の損失を抑える作用の競合も残る。'
  - 南極クレーターでは、地形によるプラズマの遮蔽が水素の供給と氷の損失を同じ場所で変える。[@P000144]はLOLA地形と解析的な陽子膨張モデルから、壁面に比べ床面の流束が小さく、Shackleton中央約3
    km半径にはほぼ陽子が届かないと予測した。広いクレーターの床面や二次峡谷にも地形に応じた差が残る。著者が500 nm純氷層に面密度10²¹分子 m⁻²と収率0.75分子/陽子を仮定したスパッタリングの例では壁面の除去時間は最短約100年、深い床や峡谷では1万年を超えるが、低流束は水素注入後の水生成も弱めるため、氷の正味の増減を確定するには生成・温度・微小隕石による損失を合わせる必要がある。
  - '[@P000146]は、LOLAの20 m地形製品を1,369 m計算格子へ写像し、軌道磁力計から推定した地殻磁場を完全運動論的PICへ組み込んで、クレーター底への部分的な遮蔽と側壁への粒子集中を示した[@P000146]。名目太陽風を四方向から入れた平均では、磁場あり−なしの差の大きさは上流の種別流束に対して陽子約3%、電子最大10%で、一律な遮蔽より再配分として現れる。生成上限と1質量%氷レゴリスの損失収率を使う縮約収支では、低温PSRが保持に有利な領域となる。表面電荷を追跡せず帯電シースを解かない計算であり、収支の大きさ・符号は採用収率に依存し、惑星間磁場・磁気尾通過と未計算の供給・侵食過程の影響も未評価である。'
  - 低温域では高エネルギー粒子による内部帯電も考慮する。[@P000311]は絶縁破壊による粒子構造の改変を論じた。表面への平均流束を扱う系列に、レゴリス内部の長い電荷散逸時間を加える比較対象となる。
  - 永久影の低温はレゴリスの電荷散逸を遅くする条件でもある。Jordanらの粒子観測を入力した帯電計算は、大規模SEP時の内部電場が既存誘電体の破壊閾値に達し得ることを示し、鉱物境界に沿う破砕が長期に累積する可能性を論じた。氷含有量による物性変化や水の保持・輸送を計算していないため、水循環の定量結果としては使えないが、低温レゴリスの構造変化を考える候補機構となる[@P000310]。
- heading: 氷の量と温度が、地盤への寄与を変える
  paragraphs:
  - 水の存在量を地盤の強さへつなぐには、氷が粒子を結び付ける条件を調べる必要がある。[@P000292]の模擬物実験では、約90 Kで静的安息角が増えるのは氷含有量30重量%を超える条件だった。数重量%の氷があるだけで強い凝集を仮定できるとは限らず、温度と混合状態をそろえて比較する。
  - '[@P000332]は円錐貫入試験で氷の形態を比較し、粒子を結ぶ氷と分散した氷では強度・掘削性が異なることを示した。[@P000338]の熱伝導測定と合わせると、同じ氷量でも力学応答と熱応答が変わる理由を粒子間構造から考えられる。'
- heading: 着陸機の排気も、局所の水と極域の化学組成に影響する
  paragraphs:
  - '[@P000303]はChang''e-5/6の観測から、排気由来の水が粒子へ入り、徐々に放出される過程をモデル化した。[@P000305]はメタンの全球輸送を計算し、南極着陸に由来する分子が北極の永久影にも捕捉される可能性を示す。着陸地点の観測では局所的な残留を、極域の氷の解釈では遠方からの人工物質の供給も考慮する必要がある。'
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - '[@P000253]はChang’E-6のNILSで、着陸点近傍の月面に由来する50–400 eVの水素負イオンH−を検出した。反射陽子と同じ放出角分布を仮定した反射率2.5（−0.8、＋1.2）%、表面直上の体積数密度0.18（−0.03、＋0.04）cm⁻³（90%区間）と、昼側寿命70
    msを使う等価スケールハイト約10 kmは、局所スペクトルからの推定である。[@P000253] [@P000252]は同じ観測系列と解析コードを用い、6区間で200
    eVから各区間の太陽風エネルギーまでの90%有意限界を超えるH−成分を比較し、フラックスと平均エネルギーが太陽風条件に正に相関することを示した。初報の2.5%収率を入力とする輸送計算では、昼側はENAの放出角分布、夜側は一様角度、月の影では光脱離なしと仮定し、薄い昼側層と50
    sで計算を止めた夜側の尾を予測した。H−がwakeやシースを変える作用と水生成への寄与量は、負イオンの反作用と表面反応を含む別の検証を要する。'
  - 日照域で吸着水が残る条件は、局所平均温度だけでは決まらない。[@P000143]は各800三角面からなる4種類の合成粗面で影・相互照射・法線方向の熱伝導を計算し、単分子層以下の既存水の一次熱脱離へ結び付けた。粗面は日の出直後の脱離を早める一方、低温斜面に水を残し、赤道では24時間後にも初期量の約20%が残った。この割合は脱離活性化エネルギー8×10⁻²⁰
    Jを置いた熱脱離だけの結果で、生成・粒子による損失・再吸着を含む水収支へ進む際の一要素になる。
  - 南極のクレーターでは、陽子が届く量と氷が残る量をつなぐために、供給と損失を合わせて扱う必要がある。[@P000144]はLOLA地形と解析的なプラズマ膨張モデルから、壁面より床面への陽子流束が小さく、Shackleton中央にはほぼ陽子が届かない領域が残ると予測した。低流束は既存氷のスパッタ損失と水素供給をともに弱めるため、正味の氷量は未確定である。[@P000144]
    [@P000146]は地形と推定地殻磁場を1,369 m格子の運動論的PICへ組み込み、粒子到達の再配分を計算した。表面電荷を追跡せず、帯電シースは解いていない。500
    nm純氷層・10²¹ H₂O m⁻²・0.75 H₂O/陽子を置く先行研究の侵食式を引き継ぐ一方、1質量%氷レゴリスの生成・陽子損失・電子損失・熱昇華を合わせた収支も示した。低温の永久影領域で得る正の収支は生成収率0.01
    H₂O/陽子という上限などに依存し、収率を変えると符号も変わり得る。四流向平均は磁気尾通過を省き、再凝結・地下拡散・微隕石・光脱離も収支から省いているため、保持に有利な場所を示す条件付きの推定として読む。
