- paper_id: P000025
  group: environment
  role: 入射電流と月面電位
  summary:
    question: 月面の電位は日照とプラズマ環境、二次電子・光電子放出にどう応答するか。
    method: LPの選択観測期間を再解析し、通常の磁気圏・ウェイク期間では探査機帯電を補正して電流平衡モデルと比較。SEP期間は探査機電位未補正で比較した。
    contribution: 夜側の数百V規模の負電位、日照プラズマシートの負帯電、ウェイク中央での負電位低下を示し、実効電子放出収率と非単調シースに条件付きの制約を与えた。
- paper_id: P000027
  group: environment
  role: SEP時の帯電予測
- paper_id: P000032
  group: environment
  role: 月面電磁場観測の計画
- paper_id: P000034
  group: environment
  role: 日照面負電位と非単調シースの条件付き遠隔観測
  summary:
    question: 探査機電位を補正した電子反射と放出ビームから、月面から8,000 km以上離れた位置でも日照面の帯電を定量化できるか。
    method: 2010年3月28日の磁気圏尾部フライバイでARTEMIS-P2のESA電子分布、FGM磁場、EFI探査機電位を使用。入射成分で規格化した上下方向分布に、探査機電位で補正した損失円錐と放出ビームを最小二乗で同時に合わせ、表面電位と磁場比を推定した。表面電位と経路上最低電位を等しいと仮定した。
    contribution: ローブで−30〜−60 V、プラズマシートの約07:27 UTの短い接続区間で−180〜−450 Vを推定した。入射電子電流が予想光電子電流よりローブで2桁以上、プラズマシートで約2桁小さいのに負電位が現れ、日照面上の非単調シースの解釈を支持した。プラズマシート後半は磁力線曲率により夜側接続を排除できない。
- paper_id: P000041
  group: environment
  role: ローブ中の高エネルギー光電子と正電位の経験モデル
  summary:
    question: 磁気圏尾部ローブの弱い地殻磁場を持つ日照月面で、高エネルギー光電子の放出は太陽放射とどう対応し、流入電子との釣り合いが正電位をどう決めるか。
    method: ARTEMISの粒子・磁場・探査機電位を用い、一事例のイオン静電反射から表面電位を制約して光電子の表面エネルギーを補正。2011年7月～2016年9月の2機の829スペクトルをFISMの1–5
      nm光子流束と比較し、既報Apolloスペクトルとの比較も含む経験式を電流釣り合いへ組み込んだ。
    contribution: 観測80–300 eV電子と1–5 nm光子の相関0.77、平均フラックス比5.0×10⁻³（2標準偏差1.6×10⁻³）を示した。一事例のUMはイオン反射で+15～25
      V、経験モデルで+22～41 Vとなり、流入電子を固定した光子流束10倍の例では+70～98 Vを予測した。
