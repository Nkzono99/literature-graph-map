review:
- heading: 平均電流の釣り合いから、電荷のゆらぎへ進む
  paragraphs:
  - '[@P000233]の捕集理論を起点に、[@P000234]と[@P000235]は探針に届く粒子電流を扱う。小さな粒子を孤立球として近似するOMLと、有限寸法のシースを含む扱いを比較する際の基準となる。'
  - 流入する電子・イオンは離散的なので、同じ環境でも粒子電荷は変動する。[@P000237]は個々の捕集による電荷ゆらぎをモデル化し、[@P000238]は電荷分布の平均と分散をプラズマの条件へ結び付けた。
- heading: 形状と放出電子を加えると、粒子ごとの電流が変わる
  paragraphs:
  - 凝集体では他の粒子に遮られた方向からの流入が減る。[@P000239]はこの見通しをOMLに組み込み、[@P000240]は凝集体の帯電と電子放出を扱う。[@P000242]の不規則形状粒子の実験は、電荷をどの大きさの球で近似できるかを検討している。
  - 表面上では、放出電子の再捕集や接触帯電も加わる。[@P000009]、[@P000010]、[@P000013]を粒子実験[@P000005]や材料の放出特性[@P000243]と合わせて読むと、孤立粒子と粒子層で何を変える必要があるかを追える。
lineage:
- title: 球の捕集から凝集体の形状へ
  steps:
  - paper_id: P000233
    title: 捕集電流を粒子軌道から求める
    significance: 電位に応じた粒子捕集を考える理論の基礎を与えた。
  - paper_id: P000239
    title: 粒子同士の遮蔽を入れる
    significance: 凝集体内で見通しのある方向からの電流を計算する方法を示した。
    connection: 孤立球の捕集を凝集体へ広げる
  - paper_id: P000240
    title: 電子放出を含む環境へ広げる
    significance: 凝集体の形状と周囲の環境を帯電計算へ取り込んだ。
    connection: 見通しと放出過程を併せて扱う
