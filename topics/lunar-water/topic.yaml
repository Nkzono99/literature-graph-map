- paper_id: P000334
  role: 乾燥レゴリスの熱モデルの基準と極低温の限界
  summary:
    question: 氷の保存を計算する基礎として、月の乾燥レゴリスの浅部熱物性をどこまで温度観測で拘束できるか。
    method: Divinerの128 ppd分離済み夜間レゴリス温度を1次元熱モデルへ合わせた。表面/深部の密度と接触伝導率を固定し、指数分布の尺度Hを推定して、上部4–7 cmの273 K換算熱慣性を地図化する。
    contribution: 浅部の熱物性と温度依存を基準化した。ただし傾斜補正は約±60°まで良好で、30 K未満の比熱には追加実験が必要とするため、永久影の氷保存モデルには低温物性の再検証を要する。
