- paper_id: P000068
  group: boundaries
  role: 曲線格子と物体表面
  summary:
    question: 物体寸法とプラズマの長さが大きく異なる静電PICで、物体に沿う非一様構造格子、粒子のセル探索、Poisson解法の計算量をどう両立するか。
    method: 物理格子を一様な論理格子へ写し、計量を含む保存形Poisson方程式を空間2次で離散化してBoxMGで解く。粒子の速度は物理空間、位置は論理空間に置き、予測修正付きhybrid moverで更新する。平面導体壁と球を2D3Vで検証する。
    contribution: 物体形状に沿う静電PICの構成を、格子収束・粒子更新時間・帯電遮蔽のベンチマークで示した。人工解では十分細かい格子で2次収束とほぼ一定のPoisson反復数を得た。半径が電子Debye長に等しい無磁場球の浮遊電位は、電子温度で規格化すると約−2.54で、OML近似の−2.50に近い。磁場は電子の赤道捕集を減らして負電位を浅くした。
