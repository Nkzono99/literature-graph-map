- paper_id: P000278
  group: calibration
  role: 観測幾何と測光補正
  summary:
    question: かぐやとチャンドラヤーン1号の月面反射スペクトルに見られる違いは、観測時の照明条件を補正する測光モデルの違いによって、どこまで説明できるか。
    method: M³とSPで使う測光モデルの位相関数を比較し、かぐやのMI・TCと地上のROLOも含む反射スペクトルの相違を調べた。
    contribution: 位相角20〜75度では補正はよく一致し、小位相角の差には観測角度や地形の扱いが関わる可能性を示した。SPの急なスペクトル勾配とM³の低い反射率は補正の違いでは説明できず、解釈時の注意点となる。
