schema_version: 1
topic_id: lunar-charging-sheath
title: 月面の電流収支・光電子シース
question: 月面の電位と、その上に広がる光電子シースを決める電流・材料特性・プラズマ条件。
review:
- heading: 電流の釣り合いと電子放出
  paragraphs:
  - '[@P000002]の電流収支は、プラズマの電子・イオンが運ぶ電荷と、光電子・二次電子として出ていく電荷を釣り合わせる。放出特性を測る[@P000001]と、月面電場やシースを整理する[@P000020]を併せて読むと、材料特性から表面電位へ進む筋道が分かる。[@P000038]は太陽風と太陽放射を変え、環境条件への応答を調べた。'
  - 磁気圏ローブ中の昼側について、[@P000162]は太陽活動に応じた放出電流から電位を予測し、[@P000161]は観測光電子のエネルギーずれから電位を推定する。放出モデルと観測を往復して電流収支を調べる研究として読める。
- heading: 単一の表面電位から、空間構造へ
  paragraphs:
  - 表面から出た電子の一部は電場で引き戻され、シースに電位の極小が生じる場合がある。[@P000007]はPICで光電子とダストの運動を追い、[@P000030]はUVで作るシースを実験的に調べた。磁気圏尾部では、Lunar
    Prospectorを使う[@P000033]とARTEMISを使う[@P000036]が非単調な電位構造を論じている。太陽風電子の流れを含む半解析モデルは[@P000011]、イオン温度を組み込む最近の理論は[@P000055]に進める。
  - シース内を動く粒子には、場所ごとの電場と電子・イオン電流が同時に効く。[@P000167]は帯電と軌道を連成し、希薄な条件では電子1個ずつの出入りが運動を変えることを示した。
  - シース内の力をダスト輸送へ結び付ける際には、表面から離れるまでの接触も条件になる。[@P000256]の総説はレゴリスの力学と帯電・運動を横断し、離脱時の電荷分布と微小粒子の実験を課題として整理した。シースが与える電場と、粒子を保持する力を対応させるための入口となる。
- heading: 実験の光電子シースを計算と照合する
  paragraphs:
  - '[@P000030]は2010年の会議要旨、[@P000092]は2012年の雑誌論文として別に参照する。後者はUVを照射した金属面の探針計測と一次元PICを比較し、放出電子が作る電位構造を実験から検証する。金属面でのモデル実験と月面の粒子・材料条件の違いを踏まえ、月面シース計算の比較対象に使う。'
- heading: 電流収支へ入れる放出・散乱特性を観測で制約する
  paragraphs:
  - 光電子電流を計算するには、入射光子1個から何個の電子が出るかを知る必要がある。[@P000362]はARTEMISと太陽放射モデルから収率の下限を求めたが、放出電子のエネルギー分布の仮定による幅も示した。[@P000363]は後方散乱電子の表面への再衝突を扱い、[@P000364]は光電子の流束と検出確率を環境別に整理した。表面で生成された量と、シースや磁場を通って観測点へ届く量の対応が、電流収支の比較条件になる。
lineage:
- title: 放出測定から電位分布へ
  steps:
  - paper_id: P000001
    title: 月試料の光電子放出を測る
    significance: 放出収率とエネルギー分布を測り、材料の特性から月面上の光電子シースを考えた。
  - paper_id: P000002
    title: 放出と流入を電流収支にまとめる
    significance: 光電子・二次電子と周囲のプラズマを組み合わせ、昼夜の電位を同じ枠組みで扱った。
    connection: 材料の特性から環境ごとの帯電へ
  - paper_id: P000007
    title: 電子分布と粒子運動を直接追う
    significance: PICで光電子シースを解き、時間変化する帯電がダストの運動に与える影響を調べた。
    connection: 表面の収支から空間・時間の分布へ
- title: 実験・観測と計算を対応させる
  steps:
  - paper_id: P000030
    title: 光電子シースを実験室で測る
    significance: UVで電子を放出させ、面の近傍の電気的構造を調べる実験系を示した。
  - paper_id: P000092
    title: 金属面の実験をPICと比較する
    significance: UVで作った光電子シースの探針計測と一次元PICを照合する雑誌論文を示した。
    connection: 会議要旨に対し、実験・PIC比較の雑誌論文を加える
  - paper_id: P000036
    title: 月周回の電子分布をPICと比べる
    significance: ARTEMISとPICから非単調な電位構造を調べ、イオン温度の影響も示した。
    connection: 室内の測定から月周回観測へ
  - paper_id: P000011
    title: 太陽風の流れを半解析解へ
    significance: 太陽風電子の流れを含むシースを半解析モデルで記述し、電子分布を変えたPIC計算との対応を示した。
    connection: 観測・PICで扱う構造をモデル化
- title: 光電子の識別から、散乱電子と光電子の統計へ
  steps:
  - paper_id: P000362
    title: 酸素Auger電子で光電子を識別
    significance: 月面由来の光電子を選び、放出収率の下限とモデル依存の幅を求めた。
  - paper_id: P000363
    title: 表面での後方散乱と再衝突を分ける
    significance: 光電子の識別法を使って後方散乱電子が優勢な事例を選び、磁場の向きと表面脱出の関係を示した。
    connection: 光電子の特徴を、散乱電子との選別にも使う
  - paper_id: P000364
    title: 光電子の環境依存を統計化
    significance: 光電子が優勢な観測を集め、ローブ中と太陽風中の流束・検出確率を比べた。
    connection: 表面から戻る電子の選別を光電子集団の統計へ広げる
