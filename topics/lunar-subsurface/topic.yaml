- paper_id: P000296
  group: mechanics
  role: 月溶岩チューブ安定性の有限要素評価
  summary:
    question: 月重力下ではどの規模の空洞が構造的に安定か。
    method: 幅と高さの比を3対1とする空洞をAbaqusの弾塑性有限要素モデルで計算し、天井の局所破壊を評価する。
    contribution: 安定性が幅、天井厚、初期応力に依存することを示した。埋没深度500 mと初期静岩圧状態などの条件下では、幅5 kmまで安定となり得る。
