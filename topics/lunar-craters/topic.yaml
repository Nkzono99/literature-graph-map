schema_version: 1
topic_id: lunar-craters
title: 月の衝突クレーター・年代学
question: クレーターの形成・分布・二次衝突から、盆地の構造と表面年代、レゴリス更新をどう制約するか。
synopsis:
- 衝突クレーターは、表面年代の推定と盆地構造の理解の両方に使われる。サイズ別頻度を年代へ結ぶ枠組み（[@P000187]）と全球の台帳（[@P000188]、[@P000191]）が基盤であり、個数には二次クレーター（[@P000190]）と表層更新の両方が影響する。
- 時系列画像は新しい衝突を直接捉え（[@P000189]、[@P000283]）、熱赤外観測は衝突点から離れた表層の締まりの変化を示した（[@P000284]）。盆地内部のピークリングと多重リングは、崩壊と深部流動のモデルで説明される（[@P000306]、[@P000307]）。
- 岩塊の検出（[@P000333]）、熱物性（[@P000334]）、試料の衝撃記録（[@P000378]）は、それぞれ異なるスケールで表層更新を測る。これらを年代推定へ結ぶには、観測の分解能と期間、検出対象の定義をそろえる必要がある。
review:
- heading: クレーター台帳が、表面の履歴を比較する基盤になる
  paragraphs:
  - '[@P000187]はクレーターのサイズ別頻度を月の年代尺度へ結び付ける。LOLAによる大型クレーターの全球分布[@P000188]に対し、[@P000191]は1〜2
    km以上を網羅する台帳を作り、小径側の地域差も比較できるようにした。'
  - "[@P000188]はLOLA地形から直径20 km以上5185個を全球採録し、高地のN(20)=100–280（10⁶ km²当たり）が飽和平衡と整合するため、密度を地殻岩石の年代へ直接換算できないと示した。Orientale形成による既存クレーターの減少はリム外約500 kmまで及び、盆地周辺の密度差には記録のリセットが効く。表側の海とOrientaleでは直径8 kmまで調べ、高地と海のサイズ頻度分布差（KS検定P≈1.5×10⁻⁹）から二つの衝突天体集団という仮説を支持した。Orientale上の分布は海と統計的に区別できず、交代時期の解釈は盆地の層序に依存する。"
- heading: 新しい衝突と二次クレーターを見分ける
  paragraphs:
  - "[@P000189]はLROC NACの時系列14,092画像対から222個の新生クレーターと47,000超のsplotchを検出した。D≥10 mの無作為撮影標本は16個で、面積・時間をそろえたNPF予測12個より33%多いが、1年のNPFは推定誤差内にあり生成率の増加は暫定的である。縁のないsplotchの多くを緩いレゴリスの二次衝突と解釈し、径分布を1 mまで外挿して深さ/直径1:50を仮定すると、上部2 cmに相当する99%面積の攪拌時間は約81,000年となる。これは観測した反射率変化をランダム配置の仮定の下で浅い攪拌へつなぐモデル推定である。Methodsのsplotch近似式は径をmと印刷するが、同じ係数にkmの数値を入れると報告年率を再現する。意図された単位は未確定であり、小径外挿にはこの表記上の不一致も残る。一方、[@P000190]は一次衝突から飛び出した岩塊が作る二次クレーターを対象とし、岩塊の大きさと放出速度の関係を評価した。年代推定に使う個数には、地形の更新と二次衝突の両方が影響する。"
  - "[@P000190]は一次径0.83–660 kmの六領域で、二次クレーターの直径と親一次からの距離の上側分布を調べた。大型一次ほど最大二次径が遠方で急減し、弾道と衝突スケーリングから推定した岩塊寸法にも同じ規模依存が現れる。最大級の二次径を見積もる個別適合は親起源の候補を絞る手掛かりになるが、物性・放出角・形状を仮定した推定で、全二次集団の個数や全球の混入率を測ったものではない。年代推定では、時系列画像が捉える新しい一次衝突[@P000189]と、二次衝突の径・位置の制約を組み合わせて読む。"
- heading: 形成直後の衝突を、地形と熱の両方で追う
  paragraphs:
  - 時系列観測[@P000189]を個別の衝突へ絞った[@P000283]は、2024年春に形成された直径222 mのMcGetchinクレーターを捉えた。同じ場所を熱赤外で調べた[@P000284]は、幅約7
    kmの低温域から浅部レゴリスの締まりが緩んだ可能性を示す。地形の変化と熱物性の変化を重ねることで、衝突点から離れた表層更新も追える。
  - "長い時間にわたる衝突は、物質の組成と地下の空隙も変える。Chang'e-6のNi同位体[@P000286]とChang'e-5の二次鉱物[@P000287]は蒸発・再凝縮を調べ、GRAILの密度推定[@P000301]は破砕と堆積が残す多孔質な浅部地殻を扱う。"
  - "[@P000286]は、Chang’e-6レゴリスの重いNi同位体を微小隕石の供給と蒸発が繰り返される累積記録として、軽い玄武岩片を衝突蒸気の再凝縮として解釈した。Ni/Coを保つ混合モデルではレゴリスNiの約92%が外来で、約2 wt%のコンドライト付加に相当する。蒸発による残留効果を補正したNi異常は内太陽系主体の長期平均供給を示唆するが、供給端成分と蒸発条件に依存する推定である。"
- heading: 中央丘と環の形成を、崩壊モデルで説明する
  paragraphs:
  - "[@P000306]は盆地内部の環状の峰、ピークリングについて、壁の内向きの崩壊と中央隆起が相互作用する仮説を観測と比べた。[@P000298]は音響流動化の条件を変え、中央丘から環へ移る直径と最終的な深さを調べる。遷移径を再現できても峰や環の直径には過大評価が残り、複数の形状指標を同時に比べる必要がある。"
  - "[@P000306]は、月の形態・鉱物・重力の制約を、融解と壁の回転を重視する概念モデルと、過大な中央隆起が外へ崩れる数値モデルに照合した。鉛直15 km/s、均質な初期非多孔質地殻、30/60 kmの地殻厚と簡略な弱化を使うiSALE系列は深さとリング径の大筋を再現する一方、中央峰からリング径への不連続、75 km例の広すぎる中央構造、145/290 km例の最低床の位置を十分に再現しない。代表計算では地殻肥厚の最大がリング直下にあり、重力から推定するリングと外縁の中間の位置とも異なる。著者は離散断層、融解物の冷却・収縮、弱化条件を複数の盆地サイズで調べるよう提案し、過大中央峰を経ないリング形成も定量検証を要する候補として残した。要点はSpiralの2015年受理原稿に基づく。"
  - "[@P000307]は、垂直15 km/sの2次元軸対称計算でOrientale形成を追い、直径64 km衝突体・初期地殻52 km・温度勾配14 K/kmの最適条件では、半径約195 kmの一時クレーターが後の崩壊で消えると示した。暖かい弱い深部の内向き流動はOuter RookとCordilleraを地殻を貫く正断層として作り、Inner Rookは深い地殻の隆起崩壊から形成する。Inner Depression境界崖は再現されず、現在の環を一時空洞の縁に直接対応させるには限界がある。要点は機関リポジトリの投稿稿に基づく。"
- heading: 岩塊と熱物性で表層更新を調べる
  paragraphs:
  - "[@P000333]のBoulderNetは衛星画像から岩塊の輪郭を抽出する。これを散乱光条件へ進めた[@P000327]は、ShadowCamの永久影画像で約4 m以上の岩塊を検出した。岩塊分布はレーダーの粗さ解釈と着陸条件を補う。[@P000334]の全球熱物性は若いクレーターや噴出物の局所差を示し、[@P000331]は粒子構造から熱伝導率を成熟度指標へ結び付けた。温度観測、岩塊の分布、試料の成熟度はそれぞれ異なるスケールを測る。"
  - "[@P000333]は地球・月・火星の画像から岩塊を個別に囲むBoulderNetを開発し、面積等価直径・縦横比・長軸方向を計測した。地点別閾値調整などを含む最良モデルの手描き輪郭に対するテスト適合率/再現率は、IoU50で72/64%、IoU75で40/35%である。月の3地点の例ではIoU50の適合率66–70%、再現率53–73%を得て、サイズ頻度分布の形を概ね再現した。原画像内タイルの分割評価であり、小岩塊の欠落、解像度・照明による差、大型岩塊の重複除去、二次クレーターの誤検出を伴う。クレーター周辺の岩塊カタログを形状・配向へ広げる方法として位置づけられる。要点はarXiv v1原稿に基づく。"
  - "[@P000331]は、微小衝突で形成されるアグルチネートの複雑な内部構造と小さい接触面を熱抵抗として取り込み、成熟度が高い粒種分布ほど低い巨視的熱伝導率になるモデルを示した。粒径40–60 µmの変動が亜成熟〜成熟の差を覆い得るため、大きい成熟度差を比較する補完指標として捉える。これはクレーター年代の直接較正ではなく、表面更新と風化で変わる粒種・粒径を熱物性へつなぐ研究である。"
  - '[@P000334]はDivinerの夜間温度から上部4–7 cmの熱慣性を地図化し、若いクレーターの岩石質噴出物と、さらに新しい衝突を囲む低熱慣性のコールドスポットを区別した。9クレーターの既存年代に対するHの増加を年代推定の候補として提案するが、適用下限と精度は未確定で、平均半径範囲の本文・図注にも不一致がある。露出大岩石の存在量と、微小岩片・浅い埋没岩石を含む熱慣性は異なる粒径・感度深度を捉えるため、岩塊検出や光学成熟度と合わせると表層更新を比較しやすい。'
  - "極域クレーターでは、形状が日射と多重散乱を変え、氷の保存条件にも関わる。[@P000325]は表面・浅部温度を計算し、露出氷と埋没氷の安定性を区別した。Chandrayaan-2の偏波レーダー[@P000328]は内外の散乱成分とCPRを比較して氷候補を評価する。氷と粗さの寄与を考える際に、岩塊分布と熱モデルを合わせて参照できる。"
  - "[@P000328]はL帯完全偏波DFSARを同じ処理枠組みで解析し、Hermite-A内部のY4R散乱パワーの約74%を体積成分、外部の約85%を表面成分に分解した。Pearyの内部も高CPR・体積散乱として解釈する一方、非極域Gardner・Korolev Xの底は表面散乱が優勢で、局所的にはCPR>1が現れた。内外差には局所入射角や斜面方位、岩塊・地下不均質も寄与する。この4例の比較は表面構造の読み分けを補い、全クレーターに適用できる組成判別精度を示すものではない。"
- heading: 地形と時系列画像からクレーターを調べる
  paragraphs:
  - LOLAのレーザー高度データを使った大型クレーターの全球分布は[@P000188]、LROCの時系列画像による新しい衝突とレゴリス更新の研究は[@P000189]を入口にできる。前者は地形に残る集団を、後者は観測期間内の変化を扱う。クレーター数から年代を推定する際には、観測の分解能と期間に加え、二次クレーターや表層更新の影響を考える。
  - "観測を統合するプレプリント[@P000329]のSomBenchは、複数ミッションを位置合わせしたデータと地理的な訓練・評価分割を提供する。これを用いる[@P000330]は複数観測種・解像度の共通表現を学習し、クレーター検出などで比較した。従来の台帳との比較では、画像の分解能に加え、学習・評価地域と検出対象の定義をそろえる必要がある。"
  - "[@P000329]は、100 m/pixel・入射角60–80°のWAC画像1000枚に既存カタログのboxを重ねる課題と、6地点のNAC手注釈408枚による小クレーター課題を分けた。ImageNet済SwinV2-Bのtest mAP（IoU0.50:0.95、5 seed平均±標準偏差）はWAC全訓練で0.2420±0.0047、NACで0.1552±0.0086。NACのlargeラベルは直径10 m以上だけで、局所・径・照明・位置の条件を保った比較が必要になる。NACデータカードには元5 m画像を4 mへ拡大する説明があるが、小径のlarge分類との評価対応は未解決である。"
  - "[@P000330]は月事前学習モデルをWACとNACの検出に転用した。100 m/pixelのWACでは半分の学習ラベルでmAP0.2541±0.0018となり、全ラベルを使うSwinV2の0.2420±0.0047を上回った。一方、1–5 m/pixel像を含むNAC評価ではLoRAの0.1543±0.0098とSwinV2の0.1552±0.0086は近く、上位間の差は5乱数種のばらつき内だった。要点は未査読のarXiv:2609.13283v1原稿に基づく。"
- heading: 鉱物に残る衝撃を読み取る
  paragraphs:
  - 地形観測に対し、[@P000378]と[@P000371]はChang’e-5試料に残る衝撃の鉱物学的制約を与える。粒子が経験した衝撃と、特定クレーターの形成史との対応は別途検証が必要になる。
- heading: 噴出物の輸送が、磁性物質の分布を作る
  paragraphs:
  - "[@P000437]は盆地形成天体の磁性物質供給を、[@P000438]は対蹠点へ堆積した天体物質の冷却磁化を論じた。[@P000439]の条件探索と[@P000436]の自転を含む計算を合わせると、対蹠点堆積は衝突角度・方向・位置と輸送モデルに依存する。磁気異常の地図を衝突史へ結ぶには、物質の分布と磁化過程の両方を照合する必要がある。"
  - "[@P000437]はSPA級の斜め衝突で、天体の核とマントルが異なる割合・場所に残ることを3D計算で調べた。直径200 kmの分化天体が15 km/s、鉛直から45°で南から北へ衝突する代表例では、広く分散した蒸気を除き核79%、マントル0.5%が残り、核物質は主に下流側の盆地縁へ集まる。地殻掘削と磁性物質の供給を結ぶモデルだが、実際の楕円形や長期の沈降・粘性変形は再現していない。ここでの積算厚さは約130 km表面格子上の量で、微細層序は解像しない。補遺の別計算にはFig. S5の厚さ単位とFig. S8Bの解像度の未解決表記差があり、磁化率換算のCV3r行にも確認点が残る。"
  - "[@P000438]は100 km天体の衝突を計算し、水平から20–45°の斜め衝突が対蹠点への輸送に適することを示した。45°では天体由来層が695 m（12 km/s）または809 m（17.4 km/s）となり、月由来ejectaの遅い到着が先着層を埋める機構を提案する。Houzeauの1.3–1.5 kmの埋積推定と磁場・地形の対応はこの仮説を支持するが、埋積物のCrisium起源を直接同定した結果ではない。均質dunite、非自転月と有限格子による条件付きの輸送モデルである。材料パラメータ、月自転や解像度依存の詳細は主本文の説明に限る。"
  - "[@P000436]は、直径100 km・速度12 km/sの衝突計算に月の自転を加え、対蹠点への衝突体物質の集中が方向と角度で変わることを示した。周期27日、赤道45°では非自転の695 mに対し西向き465 m、東向きは3 m（2トレーサーで統計的に不確か）となり、東向きの集積域は衝突地点側へ約12°ずれる。一方、30°東向きは529 mから1117 mへ厚くなり、60°西向きでは非自転0 mから150 mの堆積が生じる。極の中心厚は保たれ、周期17日の45°赤道西向きでは363 mまで減る。対蹠点堆積の位置は盆地中心との対応だけでは決まらず、斜め衝突の実際の衝突地点、古い自転軸、形成時の周期を合わせて考える必要がある。"
- heading: 掘削深さと、衝突後の表面回復を読む
  paragraphs:
  - "[@P000454]は13地域346個の新鮮なクレーターを岩塊噴出物で分類し、岩塊の出現確率が50%となる掘削深度を海4.0 m・高地5.8 mと推定した。基盤への遷移深度を厚さの指標とする方法で、地域年代との関係から成長率や衝突史を分離するには追加の制約が要る。[@P000459]は衝突後の測光変化が十年程度で回復する様子を捉え、表層の再構成を論じた。衝突で更新される物質量と、その後の粒子表面・粗さの変化は異なる時間尺度として読む。"
