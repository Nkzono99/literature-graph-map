lineage:
- title: 実地形と太陽風の侵入
  steps:
  - paper_id: P000031
    title: 地形データから局所環境を予測
    significance: "LOLA実地形から太陽風の遮蔽を求め、等温膨張と簡易電流収支による予備的帯電予測を示した。ウェイクの大部分では解が得られず、帯電モデルの拡張が課題として残った。"
    connection: ''
  - paper_id: P000008
    title: 膨張と帯電を相互作用として解く
    significance: クレーターへの太陽風侵入と電位形成を同時に扱い、二次電子放出の効果も調べた。
    connection: 地形による遮蔽から場との相互作用へ
  - paper_id: P000017
    title: 南極の実地形と磁気圏条件を結ぶ
    significance: 南緯86–90度の地形を使い、環境ごとに電位と電場の分布を予測した。
    connection: 局所形状の理解を南極の分布へ
- title: 深い空洞の正帯電と条件依存
  steps:
  - paper_id: P000012
    title: 光電子がなくても底部が正帯電
    significance: 側壁での電子損失が底部への流入を変え、深い空洞に正電位を作ることを示した。
    connection: ''
  - paper_id: P000015
    title: 空洞寸法とシース厚を結び付ける
    significance: 幅と深さを変え、シースに対して大きな空洞では電子供給が増え正電位が弱まることを示した。
    connection: 深さの効果から絶対的な寸法へ
  - paper_id: P000016
    title: 流速と熱速度で電位の符号を整理
    significance: Debye長より狭い空洞で、流速の増加に伴う負・正・ほぼゼロの電位を自由落下モデルと結んだ。
    connection: 寸法に加えて流入条件を整理
