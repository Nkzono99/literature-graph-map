- paper_id: P000014
  group: grain-charging
  role: 光とプラズマの同時照射
  summary:
    question: 光電子を放出する粉体に周囲のプラズマ電子が加わると、帯電と飛び出しはどう変わるか。
    method: 模擬粉体への真空紫外線と低密度アルゴンプラズマの単独・同時照射を比べ、飛び出し数と電圧しきい値を測った。
    contribution: 同時照射で飛び出しと推定負電荷が増えることを示し、周囲の電子が光電子の移動を促すcharge pumpingで説明した。
