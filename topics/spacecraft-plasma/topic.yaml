schema_version: 1
topic_id: spacecraft-plasma
title: 宇宙機・計測器とプラズマの相互作用
question: 機体の帯電・シース・ウェイクと、電場センサや探針による計測への影響を整理する。
review:
- heading: 機体の電位と、周囲のプラズマを一緒に考える
  paragraphs:
  - 宇宙機には電子とイオンが流入し、表面からは光電子や二次電子が出ていく。その電流収支で機体の電位が決まると、周囲の粒子軌道と密度分布も変わる。電位が変化するシースと、流れの後方にできるウェイクを含めて扱うことが、宇宙機とプラズマの相互作用を理解する基礎になる。[@P000118]は帯電過程・シース理論・観測を概観し、[@P000119]は式の導出から帯電対策までを調べるための教科書である。
- heading: 材料と形状を入れて、機体の帯電を計算する
  paragraphs:
  - Mandellらの2005年会議版は、NASCAP-2Kの表面帯電と周囲のプラズマ計算をつなぐ構成を示した。希薄プラズマの表面電位は境界要素法、空間電位は入れ子格子の有限要素法で求め、イオン軌道から電荷密度を更新する方法や、EPICのプルーム密度を取り込む方法を選べる。静止軌道例の300 s後の約−7～−10 kVは指定材料配置とNASA Worst Case環境の計算値であり、ウェイクとプルームの例では電子密度をbarometricと仮定する。PICは利用可能な機能として挙げられるが、本稿の3例からその動的性能や実機予測精度を評価するには、別に挙げられた検証論文の確認が要る。[@P000120]
  - 太陽近傍を想定した[@P000121]は5つの計算モデルを比較し、浮遊電位、捕集・放出電流、密度と電位の空間分布を調べた。同じ物理過程を同様に扱う条件では予測がよく一致し、放出電子や背景磁場の扱いを変えると結果も変わる。数値手法を選ぶ際には、取り込む物理過程と幾何形状を併せて確認したい。
  - Parkerらは同じ月ウェイク環境にNASCAP-2KのinterplanetaryとGEOの計算法を適用し、材料間電位差と計算法間の違いを比較した。低速太陽風で機体全体の負電位は約−236 Vと−154 Vに分かれたが、両者とも差動帯電は小さかった。電場出力の差とGEOの数値ノイズ、太陽電池の二次電子収率とMaxwell分布への依存を示し、計算オプションの選択と非熱的分布の扱いを課題として残した。[@P000024]
- heading: 光電子と細いブームが、シースとウェイクを変える
  paragraphs:
  - Ergun et al.（2010）は、近太陽の強い光電子放出下でも、日照面の負の空間電荷が非単調な電位を作って光電子の脱出を制限し、宇宙機を負電位にし得ることを静的計算で示した。イオンウェイクは、接触面からの二次電子の脱出を妨げて負帯電をさらに強める。9.5太陽半径、電子温度85 eV、二次電子生成効率100%のSolar Probe Plus形状モデルでは機体電位は約−10 Vだった。一方、イオン温度ゼロの円筒対照では、近太陽の密度・電子温度・放出条件を保って機体と計算領域を1/4寸法にすると、−4.15 Vから+0.3 Vへ変わった。物体寸法と放出層の相対尺度、ウェイク接触面積、二次電子収率を合わせて考える必要がある。モデルはイオン密度固定とBoltzmann熱電子を用い、収率の不確かさを残す。[@P000122]
  - 希薄で低温の流れの中では、細いワイヤーブームも周囲のイオンを大きく偏向する。Clusterを計算した[@P000123]では、正帯電したブームの存在がウェイク電場を強めた。図面上の太さに加え、ブームの電位とプラズマの遮蔽距離が、計測器周辺の環境を決める。
- heading: 電場センサの信号を、機体の影響まで含めて読む
  paragraphs:
  - 二点の電位差から電場を求める方法では、各プローブがどの電位を測っているかが問題になる。[@P000124]は細い構造を境界要素法で扱うPICを使い、機体とブームが作る電位分布から、Clusterで観測される見かけの電場波形を説明している。
  - Fahleson（1967）は、同形・同材質・同じ向き・同じ負荷のプローブで局所プラズマに対する電位のずれを共通にし、二点の差電位を電場へ換算する条件を整理した。移動系の電場からv×Bを差し引く必要があり、目的の電場が運動起電力より小さい場合には、粗い電場推定にも電位差・速度・磁場の精密測定が要る。球形プローブの電流収支を近似して、電圧計の負荷、粒子の遮蔽、熱雑音を満たす最小寸法を求めた。中央電極によるバイアスは測定球をプラズマ電位近くに保ち、負荷や速度差の感度を下げるが、中央電極を含む装置は大きくなる。密度・電子温度・粒子束の二電極間差と、回転に同期する表面の接触電位のむらは残る。電離圏で10–20%程度、数地球半径まで桁の推定が可能という結論は、薄いシースと表の仮定条件に基づく設計評価である。[@P000126]
  - 周波数を持つ電場やプラズマ波を測る場合は、センサのインピーダンスも必要になる。[@P000125]は磁化プラズマ中のダイポールをPICで駆動し、応答のピークをプラズマ波の分散関係と結び付けた。静的な機体電位の補正と、センサの周波数応答の校正は、測定対象に応じて参照する論点が変わる。
  - '[@P000251]は、宇宙機が自然に放出する電子から、その電位を離れた機体で測る条件を評価した。シースとイオンウェイクの障壁が信号を弱める。二機の寸法や電位だけでなく、相手のウェイクに入る位置関係も電子の到達を変えるため、近接運用時の計測では両者が作る場を考慮する必要がある。'
- heading: 探針の電流電圧特性から、周囲の密度・温度へ戻る
  paragraphs:
  - Langmuir探針は、印加電圧を変えたときの捕集電流からプラズマを推定する。粒子軌道で捕集電流が決まるOML理論について、[@P000127]は球や円柱からさらに広い形状へ適用条件を整理した。
  - 機体のシース内に置いた小さな探針では、周囲の電位障壁が低エネルギー電子の到達を制限する。[@P000128]はこの効果を組み込んだモデルをCassiniのデータと比較し、電流電圧曲線の遷移領域と温度・電位推定への影響を論じた。探針の寸法と位置、機体の電位を同時に参照するための文献である。
- heading: 帯電を近接飛行の力へ利用する
  paragraphs:
  - '[@P000340]のE-Gliderは、宇宙機の電位分布を調整し、天体との静電相互作用で平衡を作る構想である。周辺プラズマのPIC計算と機体全域の平衡計算を接続し、天体と機体の寸法に応じた必要電位を求めた。月では高い電位を要する条件があり、現在は計算上の提案として、帯電モデルと近接飛行の工学課題をつなぐ。'
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - 放出する導電宇宙機では、日照面の光電子層と背面のイオン欠乏域が、異なる経路で正味の放出電流を制限する。Ergunら（2010）の近太陽条件の円筒対照計算は、イオンウェイクを人工的に消しても光電子障壁が残り、浮遊電位が−0.85 Vになった。イオン温度ゼロの完全ウェイクを加えると背面の二次電子脱出が抑えられ、浮遊電位は−4.15 Vへ下がった。これは固定イオン密度とBoltzmann熱電子を使うPoisson・放出電子軌道の反復解であり、流入イオンの対向流や衝撃波を時間発展で解く計算とは、物体の電気的条件と評価する電流が異なる。[@P000122]
lineage:
- title: 機体の帯電を空間分布で解く
  steps:
  - paper_id: P000120
    title: 複雑な機体と周囲の場を計算
    significance: 表面物性と回路結合を含む形状モデルから、表面帯電・空間電位・イオン軌道を計算するモジュール構成を整理した。指定した静止軌道例の300 s後に面ごとの電位（約−7～−10 kV）、イオン軌道とbarometric電子によるウェイク電位、既知プルーム密度と指定境界電位からの空間電位を示す。PICは利用可能な機能として紹介されるが、本版の例に動的PIC検証は含まれない。
  - paper_id: P000122
    title: 強い光電子放出下の負帯電を説明
    significance: 放出電子を戻す電位障壁とイオンウェイクが、太陽近傍の負帯電を維持する条件を示した。
    connection: 太陽近傍の放出シースへ
  - paper_id: P000121
    title: 同じ機体条件で予測を比較
    significance: Solar Probe Plusの簡略モデルを5つの計算で解き、物理過程の扱いと予測差を照合した。
    connection: 複数コードで帯電予測を比べる
- title: 電場計測と機体の影響
  steps:
  - paper_id: P000126
    title: 電位差から電場を測る原理を整理
    significance: 同一電極の共通浮遊電位を差電位で相殺する設計原則を定量化し、バイアスは測定球の寸法と速度感度を下げても装置全体を大きくし、プラズマ勾配と表面パッチの誤差が残ることを示した。刊行版の計算は理想化した桁の見積もりである。
  - paper_id: P000124
    title: 機体とブームが作る信号を再現
    significance: Cluster周囲のPICで、ウェイクの見かけの電場と光電子分布による短絡効果を示した。
    connection: 測定原理から実際の機体形状へ
  - paper_id: P000125
    title: センサ応答をプラズマ波と結ぶ
    significance: 磁化プラズマ中のセンサを駆動し、インピーダンスのピークと波の分散関係を対応付けた。
    connection: 静的な電位差から周波数応答へ
