review:
- heading: 鉱物の分布から、地殻と深部物質を考える
  paragraphs:
  - '[@P000172]はMIの斜長石吸収帯から、高純度の斜長岩の全球分布を調べた。地殻形成モデルに対する組成の制約になる。[@P000173]のかんらん石分布は、衝突盆地周辺で深部物質が露出した可能性を考える入口である。'
  - 元素の側からは、GRSによるウラン分布とU/Th比[@P000175]が地域差を示す。SPを再解析した[@P000174]はイルメナイトに富むスペクトルと火砕堆積物の対応を調べ、鉱物分布を資源候補の検討につないでいる。
- heading: 機器の違いをそろえてから、組成を比べる
  paragraphs:
  - One Moon, Many Measurementsの3論文は、同じ月の観測を放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]に分けて比較する。鉱物分布の差を読む前に、観測幾何と較正がそろっているかを確認するための文献群である。
