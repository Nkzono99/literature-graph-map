- paper_id: P000307
  group: interior
  role: Orientale多重リング盆地の形成計算
  summary:
    question: Orientaleの複数の環と地下構造は、衝突後の崩壊でどう作られるか。
    method: 衝突流体力学コードで盆地形成を計算し、GRAILの高分解能重力が制約する地下構造と比較する。
    contribution: 直径約390 kmの一時的な空洞の重力崩壊を再現した。深部の高温・低強度物質の流動と大規模な正断層が外側の環を作ると解釈した。
  inspection:
