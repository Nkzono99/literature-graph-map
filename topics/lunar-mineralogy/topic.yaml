review:
- heading: 鉱物の分布から、地殻と深部物質を考える
  paragraphs:
  - '[@P000172]はMIの斜長石吸収帯から、高純度の斜長岩の全球分布を調べた。地殻形成モデルに対する組成の制約になる。[@P000173]のかんらん石分布は、衝突盆地周辺で深部物質が露出した可能性を考える入口である。'
  - UとThは表側PKTで濃集し、全球の濃度相関はR²=0.97、回帰の傾きは0.269±0.007だった。一方、裏側東高地と西高地の広域平均では、Thが0.36±0.02と0.33±0.02 ppmで統計誤差内にあるのに対し、Uの報告値は0.34±0.01と0.21±0.01 ppmと異なる。併記された±は全系統誤差を含む誤差予算としては示されず、−0.11 ppmのU補正案の適用も明記されない。著者は不均一な地殻形成の可能性を示唆するが、Uの絶対較正に関する系統誤差と形成後の元素移動を残している。全球的な元素の共変動と地域的な組成差を両立させて読む結果である[@P000175]。
  - Yamamoto et al. (2025)のイルメナイト富化スペクトル候補は、表側の盆地周縁の火砕堆積物に多く、既存TiO₂地図で高Tiとされる海の主要分布域では同じ特徴が検出されなかった。この違いには輝石との混合、粒径、成熟度、Tiを含む他鉱物相が関係し得るため、未検出をイルメナイトの不存在へ置き換えることはできず、火砕堆積物と高Ti海の含有率の優劣も未確定である。（PDF pp.6–7,16,18–19, §§3.1,3.2.6,4.2–4.3）[@P000174]
  - 組成と地下熱環境をつなぐ[@P000337]は、Chang’e-2のマイクロ波輝度温度を地質図と比較し、Aristarchus周辺で火砕堆積物が光学・レーダー推定より広い可能性を示した。鉱物の吸収帯による表層の分布と、マイクロ波が捉える深さの熱的な性質を対応させて解釈する。
- heading: 機器の違いをそろえてから、組成を比べる
  paragraphs:
  - One Moon, Many Measurementsの3論文は、同じ月の観測を放射輝度[@P000277]、測光補正[@P000278]、反射率[@P000279]に分けて比較する。鉱物分布の差を読む前に、観測幾何と較正がそろっているかを確認するための文献群である。
  - 較正後の光学特性の解釈に関わる[@P000374]は、粒径と金属鉄を操作して反射・偏光を比較した。天然土壌との違いから、実験試料にないアグルチネートの役割も課題とした。
- heading: 返還試料から、衝突で動く元素と粒子の形を読む
  paragraphs:
  - Chang'e-6のNi同位体[@P000286]は、微小隕石の供給源と蒸発・再凝縮の履歴を制約する。Chang'e-5のかんらん石上に堆積したクロム鉄鉱[@P000287]は、衝突蒸気から二次鉱物が生じた証拠として解釈された。軌道から得る鉱物分布に、粒子の表面で起きる元素移動を補う研究である。
  - 粒子の形や鉱物の組合せは地盤の力学にも関わる。[@P000293]は三次元形状から粒子同士のかみ合いを計算し、[@P000290]は形状・摩擦・付着と安息角の関係を調べる。分光から読む組成と、集団としての流れやすさを結び付ける際の比較材料になる。
  - ガラス質結合に着目した[@P000373]は、焼結粒子を含む模擬地盤の強化と軟化を測定した。粒子形状の計算へ、結合構造の実験制約を補う。
- heading: 加熱によるFeの移動が磁性を変える
  paragraphs:
  - '[@P000297]は低酸素分圧で加熱した玄武岩質模擬物について、Feの移動と磁性相の生成を追った。800°C付近での磁化増加と、さらに高温での低下を、Feを含む相の変化で説明する。実験の温度・酸素条件を踏まえることで、月面物質の熱履歴と磁気特性を考える基礎になる。'
- heading: 電気的風化、水吸着、熱と磁性をつなぐ
  paragraphs:
  - '[@P000311]・[@P000312]は絶縁破壊によるレゴリス改変を推定した。表面での水保持を調べる[@P000336]は、鉱物の金属サイトと水素結合の寄与が被覆率で変わることを示す。[@P000331]は粒子構造と熱伝導率を成熟度へ接続し、[@P000323]は衝突ガラスに残るγ鉄の磁区構造を示した。鉱物相だけでなく、表面・粒子間の構造と熱履歴が、保持・熱輸送・磁化を左右する。'
- heading: 試料の鉱物とLi同位体から、分化と改変を分ける
  paragraphs:
  - Chang’e-5試料の鉱物モードと衝撃記録をラマン分光で調べた[@P000378]に対し、[@P000371]は一つの玄武岩の詳細分析からマグマ源と衝撃圧力を検討する。対象粒子数と組織の違いを踏まえて読み合わせる。
  - Li同位体の基準値を調べた[@P000375]と[@P000376]を踏まえ、[@P000377]は高温分化に伴う分別を検討した。[@P000372]は月隕石へ試料範囲を広げ、マントルの代表値と地殻の二次改変を分けて再評価している。
lineage:
- title: 分光観測で異なる地質を読む
  steps:
  - paper_id: P000172
    title: 高地の純斜長岩を調べる
    significance: MIの吸収帯から高純度斜長岩の分布を捉えた。
  - paper_id: P000173
    title: 衝突盆地周辺の深部物質へ
    significance: かんらん石の分布から深部起源の可能性を調べた。
    connection: 対象鉱物と地質条件を広げる
  - paper_id: P000174
    title: 保存スペクトルを資源候補へつなぐ
    significance: 候補の大部分は表側の盆地周縁にあり、暗い火砕堆積物が高地物質を覆う地質と対応する。既存高Ti海の主要分布域は同じ分光特徴を示さず、その原因は鉱物混合・粒径・成熟度・Tiの相配分等の複数の説明が残る。候補分布を資源探査に使う提案だが、含有率や採掘可能質量の実測ではない。
    connection: 鉱物分布から堆積物の解釈へ
- title: 粒子形状から集団の力学応答へ
  steps:
  - paper_id: P000293
    title: 月裏側粒子の形状を再構成する
    significance: 大規模な三次元形状データを離散要素法の強度評価へつないだ。
  - paper_id: P000290
    title: 鉱物と表面特性を加える
    significance: 摩擦・形状と付着の寄与が粒径・重力で変わることを調べた。
    connection: 形状の効果を鉱物・表面特性と比較する
- title: Chang’e-5のラマン分析で鉱物と衝撃を読む
  steps:
  - paper_id: P000378
    title: 多粒子の鉱物と衝撃を調べる
    significance: ラマン分光と顕微像で返還試料の鉱物学を整理した。
  - paper_id: P000371
    title: 一つの玄武岩を詳しく調べる
    significance: 鉱物の組織と組成をマグマ履歴へ接続した。
    connection: 同じ手法系列で、対象を個別岩石へ絞る
- title: Li同位体の基準値から分化・改変へ
  steps:
  - paper_id: P000375
    title: 惑星間比較の基準を得る
    significance: 月のLiを他天体と比較する出発点を示した。
  - paper_id: P000376
    title: 月内部の試料間差を比べる
    significance: 試料のリザーバーごとに同位体を比較した。
    connection: 同年の独立研究を比較軸として並べる
  - paper_id: P000377
    title: 高温分化の効果を調べる
    significance: 玄武岩の違いから同位体分別を検討した。
    connection: 組成比較から結晶化過程の解釈へ
  - paper_id: P000372
    title: 月隕石で代表値を再評価
    significance: 内部の分化と表層での改変を分けた。
    connection: 採取地点の異なる試料へ比較を広げる
