schema_version: 1
topic_id: spacecraft-plasma
title: 宇宙機・計測器とプラズマの相互作用
question: 機体の帯電・シース・ウェイクと、電場センサや探針による計測への影響を整理する。
synopsis:
- 宇宙機には電子とイオンが流入し、光電子や二次電子が出ていく。その電流収支で機体電位が決まり、周囲のシースとウェイクが粒子の軌道を変える（[@P000118]、[@P000119]）。
- 材料と形状を入れた帯電計算（[@P000120]、[@P000121]）は、取り込む物理過程の違いが予測を変えることを示した。強い光電子放出下でも非単調な電位が放出を制限し（[@P000122]）、細いブームが周囲のイオンを偏向する（[@P000123]）。
- 計測では、電場センサの二点電位差がどの電位を測っているか（[@P000124]、[@P000126]）、探針の電流電圧特性に機体のシースがどう効くか（[@P000128]）が問題になる。機体と周囲のプラズマを合わせて扱うことが、観測を解釈する条件である。
review:
- heading: 機体の電位と、周囲のプラズマを一緒に考える
  paragraphs:
  - 宇宙機には電子とイオンが流入し、表面からは光電子や二次電子が出ていく。その電流収支で機体の電位が決まると、周囲の粒子軌道と密度分布も変わる。電位が変化するシースと、流れの後方にできるウェイクを含めて扱うことが、宇宙機とプラズマの相互作用を理解する基礎になる。[@P000118]は帯電過程・シース理論・観測を概観し、[@P000119]は式の導出から帯電対策までを調べるための教科書である。
- heading: 材料と形状を入れて、機体の帯電を計算する
  paragraphs:
  - Mandellらの2005年会議版は、NASCAP-2Kの表面帯電と周囲のプラズマ計算をつなぐ構成を示した。希薄プラズマの表面電位は境界要素法、空間電位は入れ子格子の有限要素法で求め、イオン軌道から電荷密度を更新する方法や、EPICのプルーム密度を取り込む方法を選べる。静止軌道例の300
    s後の約−7～−10 kVは指定材料配置とNASA Worst Case環境の計算値であり、ウェイクとプルームの例では電子密度をbarometricと仮定する。PICは利用可能な機能として挙げられるが、本稿の3例からその動的性能や実機予測精度を評価するには、別に挙げられた検証論文の確認が要る。[@P000120]
  - "[@P000121]は、簡略化したSolar Probe Plusを5モデルで比較し、太陽風収集だけの浮遊電位が−225〜−218 V（約±1.6%）で一致することを示した。一方、密度7×10⁹ m⁻³、電子85 eVの太陽風に光電子・二次電子、太陽向き2 μTの磁場、195 km/sの軌道速度を加えた条件では、浮遊電位は−12.2〜−7.60 Vとなり、モデル差は著者記述で約±23%に広がる。6–10 Vの電位障壁が放出電子の約80%を再捕集する飽和域では、大きな放出がそのまま正味電流にならず、機体は約−10 Vの負電位を保つ。コード間の数値的一致と、放出収率・表面への注入などの物理モデルの一致を分けて評価する比較である。Table IIのRange欄は定義が曖昧なため個別値を使い、Table IIIの一部の符号・比率の曖昧さは結論に使わない。"
  - Parkerらは同じ月ウェイク環境にNASCAP-2KのinterplanetaryとGEOの計算法を適用し、材料間電位差と計算法間の違いを比較した。低速太陽風で機体全体の負電位は約−236
    Vと−154 Vに分かれたが、両者とも差動帯電は小さかった。電場出力の差とGEOの数値ノイズ、太陽電池の二次電子収率とMaxwell分布への依存を示し、計算オプションの選択と非熱的分布の扱いを課題として残した。[@P000024]
- heading: 光電子と細いブームが、シースとウェイクを変える
  paragraphs:
  - '[@P000122]は、近太陽の強い光電子放出下でも、日照面の負の空間電荷が非単調な電位を作って光電子の脱出を制限し、宇宙機を負電位にし得ることを静的計算で示した。イオンウェイクは、接触面からの二次電子の脱出を妨げて負帯電をさらに強める。9.5太陽半径、電子温度85
    eV、二次電子生成効率100%のSolar Probe Plus形状モデルでは機体電位は約−10 Vだった。一方、イオン温度ゼロの円筒対照では、近太陽の密度・電子温度・放出条件を保って機体と計算領域を1/4寸法にすると、−4.15
    Vから+0.3 Vへ変わった。物体寸法と放出層の相対尺度、ウェイク接触面積、二次電子収率を合わせて考える必要がある。モデルはイオン密度固定とBoltzmann熱電子を用い、収率の不確かさを残す。'
  - "[@P000123]は、低温・希薄なイオン流中のCluster機体と細いワイヤーブームを同時に扱い、正電位のブームがイオンを散乱してウェイクを広げる過程を計算した。基準条件の機体電位40 Vでは、10 V等電位面で測ったブーム中点の有効厚さが実直径2.2 mmから約6.6 mへ広がり、二重プローブの見かけの電場振幅はブームなしの5.5 mV/mから9.3 mV/mへ増えた。広がったイオン欠乏域がプローブ軌道の下流側半周を覆うため、波形もほぼ正弦波になる。"
  - "[@P000123]のブームありの計算では、プローブ軌道は機体の正電位の山の中にあり、負電位の井戸を直接通らない。ウェイクが作る上流・下流間の正電位減衰の差が測定値へ入るため、井戸の深さだけで観測誤差を説明できない。機体電位を下げると影響は減るが、背景電子温度とブーム端からプローブまでの距離でも振幅が変わる。実プローブ等の電流収支と流れの傾斜角はこのモデルの定量的な限界として残る。"
- heading: 電場センサの信号を、機体の影響まで含めて読む
  paragraphs:
  - 二点の電位差から電場を求める方法では、各プローブがどの電位を測っているかが問題になる。[@P000124]は細い構造を境界要素法で扱うPICを使い、機体とブームが作る電位分布から、Clusterで観測される見かけの電場波形を説明している。
  - '[@P000126]は、同形・同材質・同じ向き・同じ負荷のプローブで局所プラズマに対する電位のずれを共通にし、二点の差電位を電場へ換算する条件を整理した。移動系の電場からv×Bを差し引く必要があり、目的の電場が運動起電力より小さい場合には、粗い電場推定にも電位差・速度・磁場の精密測定が要る。球形プローブの電流収支を近似して、電圧計の負荷、粒子の遮蔽、熱雑音を満たす最小寸法を求めた。中央電極によるバイアスは測定球をプラズマ電位近くに保ち、負荷や速度差の感度を下げるが、中央電極を含む装置は大きくなる。密度・電子温度・粒子束の二電極間差と、回転に同期する表面の接触電位のむらは残る。電離圏で10–20%程度、数地球半径まで桁の推定が可能という結論は、薄いシースと表の仮定条件に基づく設計評価である。'
  - "周波数を持つ電場の計測では、センサと前置増幅器の複素インピーダンスによる分圧を校正する。[@P000125]は磁化プラズマ中の完全導体ダイポールを三次元電磁PICで駆動し、表面電流を先に仮定せずに応答を求めた。抵抗ピークは、センサ全長を半波長とする波数における、垂直配置のUHR・電子サイクロトロン高調波分枝、平行配置のLangmuir分枝と対応した。磁場方向で高調波構造が変わり、Fig.6では分枝の周波数が主にkρe<1で線形分散と定性的に対応する。機体・ブーム・太陽電池パネルはこの計算に含まれず、静的な電位差の補正と併せて、寸法と観測波動に応じた周波数応答を考えるための研究である。"
  - '[@P000251]は、宇宙機が自然に放出する電子から、その電位を離れた機体で測る条件を評価した。シースとイオンウェイクの障壁が信号を弱める。二機の寸法や電位だけでなく、相手のウェイクに入る位置関係も電子の到達を変えるため、近接運用時の計測では両者が作る場を考慮する必要がある。'
  - "[@P000251]は同幅二機・間隔一機幅の太陽風モデルで、正電位の測定機が対象機の放出電子を引き寄せ、単独機で予想した障壁があっても信号を得ることを示した。一方、対象機を300 V測定機のwake内に置くと、日照の幅比.2/1では対象が−70/−100 Vに帯電して検出電流がゼロになり、食では7.5×10−8/6×10−8 A m−2の小信号が残った。試験した条件では日照の光電子検出に50 V、食の二次電子検出に300 Vが有利で、配置回避や測定機電位の低減を対策に挙げる。測定機の自己放出はゼロとし、ESAの識別は仮定分解能4%のスペクトルモデルで評価した。 障壁定義の符号とスペクトルの定量的な識別余裕には未解決点が残る。"
  - "[@P000124]は、機体接地と同電位の細いブームのBEM電位解を静電PICへ組み込み、太陽風・tail lobe・plasmatroughの計測環境を比較した。半径44 mの仮想プローブが測るのは、負のウェイク井戸への直接侵入より、正の機体・ブーム電位丘の非対称な降下である。固定電位+10／+40／+20 Vの名目条件で、見かけ電場は太陽風約2 mV/mの鋭いピーク、lobe約4 mV/mとplasmatrough約1 mV/mのより正弦波状の信号となった。lobeの観測>10 mV/mに対し、密度0.05 cm⁻³の基準計算は小さく、密度増加による説明を検討している。plasmatroughで400 nTの磁場による外部場2 mV/mを与えると、ウェイク成分除去後は1.26 mV/mとなり、光電子雲が導体と同様に場を短絡する。ただしガード省略と過度に厚い光電子シースが、この37%の減少率を過大評価する可能性がある。"
- heading: 探針の電流電圧特性から、周囲の密度・温度へ戻る
  paragraphs:
  - Langmuir探針は、印加電圧を変えたときの捕集電流からプラズマを推定する。粒子軌道で捕集電流が決まるOML理論について、[@P000127]は球や円柱からさらに広い形状へ適用条件を整理した。
  - "[@P000128]は、負帯電した宇宙機のシース内にある小球探針を無衝突・探針半径がDebye長より十分小さい条件で扱い、局所電位より正の探針にも周囲電子を遮る電位極小が残ると説明した。この遷移領域では周囲プラズマ電位での明瞭な折れ曲がりと温度推定用の指数部分が失われ、探針半径によっても微分曲線が変わる。Cassiniの一掃引では、光電子と考える膨らみを除くと、シース内モデルの電子密度約7×10⁷ m⁻³・温度エネルギー約2.2 eVが独立密度測定に近いが、著者は粗い近似による定性的比較として留保した。密度因子の印刷負号と密度減少の説明・図には未解決の相違があり、式6–7を訂正済みの定量補正式として扱わない。"
- heading: 帯電を近接飛行の力へ利用する
  paragraphs:
  - "[@P000340]は、受動的な帯電予測から電位分布を能動的に設計する問題へ進み、局所・静電PICの応答を重力・遠心力・太陽放射圧の平衡計算へ組み込んだ。重心の一点だけでなくCore領域全体の勾配を補償する条件を置き、機体が小さいほど、また自然平衡に近い位置ほど総補償電位差が減ることを示した。図の安定分類は有効ポテンシャルのHessianに基づき、時間変動する環境での閉ループ飛行の検証は今後の課題である。"
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - 放出する導電宇宙機では、日照面の光電子層と背面のイオン欠乏域が、異なる経路で正味の放出電流を制限する。[@P000122]の近太陽条件の円筒対照計算は、イオンウェイクを人工的に消しても光電子障壁が残り、浮遊電位が−0.85
    Vになった。イオン温度ゼロの完全ウェイクを加えると背面の二次電子脱出が抑えられ、浮遊電位は−4.15 Vへ下がった。これは固定イオン密度とBoltzmann熱電子を使うPoisson・放出電子軌道の反復解であり、流入イオンの対向流や衝撃波を時間発展で解く計算とは、物体の電気的条件と評価する電流が異なる。
