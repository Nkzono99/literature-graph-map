- paper_id: P000240
  group: properties
  role: 凝集体の帯電と電子放出
  summary:
    question: 同質量の球と比べて、凝集体の見通し遮蔽、放出電子の再捕集、構成粒子の粒径が帯電にどう影響し、電荷を粒子数や疎密から推定できるかを調べた。
    method: 中性環境でPCA/CCAにより作った単分散silicate凝集体をOML_LOS法で帯電させた。直線入射とパッチの電荷・双極子を用い、二次電子放出が重要なヘリオシース条件と、光電子供給を変えた1
      AU条件で同質量球を比較した。
    contribution: ヘリオシース条件では電荷がN^0.413、compactness factorの−1.3乗で整理され、5–10 nmの構成粒子の二次電子放出の小粒子効果も残った。1
      AUの例では光電子供給次第で球との電荷の大小が変わり、帯電履歴中の符号差も生じた。正電荷の固定供給条件ではN^0.42、compactness factorの−1.3乗を報告した。
      月面への関係は形状と電子再捕集を考える基礎で、計算対象は孤立凝集体である。
- paper_id: P000241
  group: properties
  role: 少数電荷の局所非対称性と運動時間の比較
  summary:
    question: 電子・イオンの個別捕集が、凝集体の電荷統計・ゆらぎ時間と、局所電荷から受ける力・トルクを通じた成長形状をどう変えるか。
    method: 一次電子・一価イオン捕集をOMLとモノマーによる見通し遮蔽で計算し、表面パッチへ一個ずつ付着させるMarkov/Gillespie型モデルを構築した。Ar実験室プラズマと電子欠乏Hプラズマで球・凝集体を検証し、単一モノマーの追加成長を25個まで計算。PPDでは抽出した電荷を衝突中固定し、LABでは衝突中も更新した。
    contribution: LAB・PPDの成長計算では、表面パッチの局所電荷を保持したモデルが最も細長い凝集体を作った。少数電荷の非対称性と電荷・運動の時間比を考える数値的な基礎となる。月面の光電子・二次電子放出、基板接触や付着力は扱わず、月面離脱・浮遊の直接検証は行っていない。
