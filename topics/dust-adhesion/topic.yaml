- paper_id: P000212
  group: roughness
  role: フラクタル粗面上の微粒子付着
  summary:
    question: アルミニウム系粗面の凹凸は、超微細な月ダストの付着力をどう変えるか。付着を抑える表面粗さをフラクタル理論で予測できるかを調べた。
    method: 粒子と粗面の接触をフラクタルモデルで記述し、付着力を計算して最小化する粗さを求めた。エッチングしたアルミニウム表面の形状を原子間力顕微鏡で測り、計算値と遠心実験のダスト残留率を比較した。
    contribution: モデルでは超微細粒子の付着をファンデルワールス力が支配し、粒径ごとにこの力を最小にする粗さが得られた。実験では計算上の力が大きい表面ほど残留率が高く、粗面モデルと付着傾向の対応を示した。
  evidence_by_item:
