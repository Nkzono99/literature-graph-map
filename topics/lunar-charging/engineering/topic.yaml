schema_version: 1
topic_id: lunar-charging-engineering
title: 月探査の帯電リスク・除塵技術
question: 探査機の差動帯電と静電放電、機器や宇宙服に付着したダストへの対策。
review:
- heading: 差動帯電を機体設計へつなげる
  paragraphs:
  - 同じプラズマ環境でも、材質や日照が異なる表面は別々の電位になりうる。[@P000024]はNASCAP-2Kで候補宇宙機を計算し、導電性材料による電位差の低減を検討した。[@P000054]の発表資料は、月ミッションの自然・誘起帯電環境をまとめており、設計時に考えるハザードを見渡せる。
  - 着陸機の噴射は、周囲のダストに運動量と電荷を与える。[@P000165]は気固流れ・摩擦帯電・プラズマ帯電を結合し、噴射停止後も残る電荷が微粒子の輸送を変えると予測した。噴射後の付着先を考える際にも、離脱時の電荷が条件になる。
  - 対策へ入力する粒子条件は、レゴリス力学と帯電・輸送を結ぶ[@P000256]、生成・物性・移動経路を整理する[@P000249]の総説から見渡せる。機器に届く量、接触時の電荷、付着力を同じ環境条件へ対応させることが、自然環境の研究と工学試験を結ぶ出発点になる。
- heading: 電場・中和・ブラシによる除塵
  paragraphs:
  - '[@P000028]のEDSは、電極が作る電場と静電力・誘電泳動力で粒子を移動させる。特許には、宇宙服のダストを正負のイオンで中和した後、気流で吸い込み再帯電させて捕集する[@P000049]と、ブラシへEDS・UVを組み合わせる[@P000050]がある。周辺技術として収録した[@P000035]は、気体中の誘電体バリア放電が生む流れを使う太陽電池除塵である。作用する媒体と力を押さえると、各方式の対象環境を見分けやすい。'
  - '[@P000028]の透明EDSは、ガラス上のITOらせん電極を三相矩形波で駆動する。約10⁻⁶ kPaの真空中で50–75 µmのJSC-1Aを約20 mgずつ散布すると、市販太陽電池の電圧は基準の11.0–22.5%へ落ち、作動後には91.6–99.4%へ回復した。これは電極のない領域を覆った試験配置での電圧比で、発電電力や除去質量の比は報告されていない。電気系統全体へ組み込む際の電磁干渉・電磁両立性は追加解析が必要とされた。'
  - '[@P000049]の登録特許は、宇宙服上のダストの中和と、その後の回収を一つの運用へつなぐ。図2の回収器では中和粒子を再び負に帯電させて正の板に集め、床下フィルタでは濾過空気を再循環する。リングや旋回アームによる走査、施設外の梯子への仮設も例示するが、除去率・捕集率や外部真空での動作条件は示されない。比較には宇宙服に残る量と、施設内部へ入る量を分けた評価が必要になる。'
  - 電子照射で粒子を動かす[@P000164]は、宇宙服用の布と模擬レゴリスを用い、VUVの併用による除去効率の向上を測った。太陽に似た波長分布を再現し、光強度は月面より高く設定している。電極配置に加え、照射と材料の組合せも除塵の設計変数になる。
- heading: 受動表面とUV併用で除塵の選択肢を広げる
  paragraphs:
  - 受動的な表面技術の比較は[@P000257]、ZnO薄膜と立体テクスチャは[@P000258]、導電性ポリイミドは[@P000259]にまとまっている。電気力学的な除塵ではUVの併用[@P000260]と柔軟電極[@P000261]が加わる。各方式の効果は、真空・照射条件、粒径、表面形状と併せて比較する。
    Ti6Al4Vのナノチューブ配列を評価する[@P000214]は、粒子付きAFM探針の局所付着力と散布後の残留量をそれぞれ測った。接触一つの力と、機器表面に残る粉体量を分けて比較するための例になる。
- heading: 帯電を利用する飛行と、氷地盤の掘削条件
  paragraphs:
  - '[@P000340]は機体帯電を調整して静電飛行の平衡点を作る計算研究であり、帯電解析を位置制御へ広げる。極域の走行・掘削を扱う[@P000332]は、氷含有模擬物の円錐貫入試験から、氷の形態に応じた強度とエネルギーを求めた。帯電力の設計と地盤力学は別の評価軸で、いずれも機体寸法、温度、粒子・氷の構造に応じた条件設定が必要になる。'
- heading: 帯電・粒径・被覆をそろえてEDSを比べる
  paragraphs:
  - UV併用の[@P000260]に対し、[@P000368]はイオン照射でEDSの除去率と速度を改善した。照射で粒子電荷を変えるという比較軸を共有する一方、後者はイオナイザを使う気体中の実験で、月面真空での動作条件とは分けて読む。[@P000370]は粒径別の試験から、小粒子の付着、大粒子の重力・誘電泳動力と鎖状化を整理し、除去率を支配する力が粒径によって変わることを示した。
  - '[@P000369]は機能性被覆を施したEDSを高真空の連続降塵下で比較し、微小放電、残留粒径、耐久性を合わせて評価した。被覆で付着を変える効果と電場駆動を同時に扱うため、事前に積もった粉体の清掃試験とは評価量が異なる。材料・粒径・照射・降塵方法を明示すると、受動表面と能動除塵の組合せを比較しやすい。'
- heading: 地上で選んだ表面を、実月面の付着観察へつなぐ
  paragraphs:
  - '[@P000367]はRAC用の材料選定とレーザー表面加工を地上で評価した。これを材料クーポン選定の根拠に使った[@P000365]は、Blue Ghost
    Mission 1でガス採取と付着観察を行い、4回で累計約11 cm³のレゴリス捕集を画像等から推定した。クーポン像の基準面不足により付着量や加工効果を定量化できず、レンズ上のダスト除去でもガス流・粒子衝突・静電作用の寄与は分離されていない。実月面との比較には、捕集量、付着像、除去の機構をそれぞれ対応させる。'
lineage:
- title: 機体の帯電設計
  steps:
  - paper_id: P000024
    title: 材質と形状から帯電リスクを減らす
    significance: 月面の候補機体をNASCAP-2Kで計算し、導電性材料による電位差の低減を示した。
- title: 付着ダストの除去
  steps:
  - paper_id: P000028
    title: 透明電極で太陽電池電圧を回復
    significance: 透明ITOの三相EDSを高真空のJSC-1A散布試験で評価し、基準電圧の91.6–99.4%への回復を報告した。
  - paper_id: P000164
    title: VUVと電子ビームを組み合わせる
    significance: 月面より強いVUVの照射下で、電子ビームによる布上ダストの除去効率が上がった。
    connection: 電極による搬送と電子照射を比較
- title: 飛行前の材料評価から実月面の付着観察へ
  steps:
  - paper_id: P000367
    title: 材料とレーザー加工面を選ぶ
    significance: RAC用材料を地上で評価し、月面付着比較のための試料選定・加工手順を示した。
  - paper_id: P000365
    title: 月面で材料クーポンを観察する
    significance: 選定研究を参照したクーポンで実月面の付着像を取得し、画像による定量評価の課題を明らかにした。
    connection: 材料選定を参照し、地上試験を実月面の観察へつなぐ
- title: EDS性能の粒径評価から被覆との組合せへ
  steps:
  - paper_id: P000370
    title: 除去を妨げる力を粒径別に比べる
    significance: 分級した模擬物で、小粒子の付着と大粒子の重力・分極の寄与を調べた。
  - paper_id: P000369
    title: 被覆と耐久性を同じ系で評価する
    significance: 高真空の連続降塵下で、被覆に応じた蓄積抑制・微小放電・残留粒径を比較した。
    connection: 粒径による力の比較に、被覆と試験方式の違いを加える
