- paper_id: P000151
  group: lunar-materials
  role: 粉体層の総電子収率
  summary:
    question: 低ガラス含有の月高地土壌の粉体層はどれだけ電子を放出し、その分布と粒子ごとの帯電差はどう結び付くか。
    method: Apollo 16土壌61241の清浄化した粉体層を超高真空で測定。40–2000 eVの放出分布はAr+で帯電補償し、総収率は低nAパルスで測る。別の10 keV走査像で移動を観察。
    contribution: 総収率の本文最大値1.13、第一交差80 eV、第二交差>2 keVと、Ep>100 eVで放出分布ピーク1.2±0.2 eVを報告。10 keVでは粒子移動と定性的な帯電差を捉え、粉体層での再吸収と反発・衝突機構を議論した。
