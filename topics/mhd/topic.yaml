schema_version: 1
topic_id: mhd
title: 磁気流体力学（MHD）
question: 流体と磁場の基礎理論、保存則と数値解法から、太陽風・磁気圏・磁気リコネクションへの応用をたどる。
review:
- heading: MHDは流体の運動と磁場を同時に解く
  paragraphs:
  - 磁気流体力学（MHD）は、密度・流速・圧力で表す流体と磁場の相互作用を扱う。流体の運動が電流や磁場を変え、その磁場が流体へ力を返す。[@P000393]が示した波動は、この相互作用の基本例である。方程式の導出、波動、安定性を学ぶ入口には、実験室と天体プラズマを共通の理論で扱う[@P000394]がある。
  - 基本となる理想MHDでは、質量・運動量・エネルギーの保存則と磁場の誘導方程式を解き、状態方程式で系を閉じる。磁場には∇·B=0という制約がある。完全導電の近似では磁束が流体とともに運ばれ、抵抗を含めると拡散による配置の変化を扱える。[@P000394]の近似と適用条件の整理を、保存形の方程式を掲げる[@P000402]と併せて読むと、物理モデルと数値的な制約をつなげられる。
- heading: 波動の特性が、流束と時間刻みを決める
  paragraphs:
  - 磁場の張力を復元力とするAlfvén波に加え、圧縮性MHDには速い・遅い磁気音波が現れる。どの波が情報を運ぶかは、境界条件や陽解法の時間刻みに関わる（[@P000393]、[@P000394]）。衝撃波や接触不連続を含む計算では、格子面の両側の状態から波の伝播を考え、流束を求める。
  - '[@P000398]はRoe型の解法を構成し、MHDの非凸性と複合波を共平面の衝撃波管問題で示した。流体の音波だけを想定した解法から、MHD固有の波構造を扱う段階への節目となる。[@P000404]のHLLDは、複数の中間状態で接触不連続やAlfvén波を取り込む。比較では波の解像度と計算量を見たうえで、強い不連続や磁場の向きなど対象に合う試験問題を選ぶ。'
- heading: 磁場の発散制約は、保存則と合わせて評価する
  paragraphs:
  - 連続系で∇·B=0が保たれても、離散化した更新が同じ性質を持つとは限らない。[@P000399]のConstrained Transport（CT）は、格子面を通る磁束と格子辺の電場を対応させ、離散的な発散制約を丸め誤差の精度で維持する。流体量をセル中心に置く有限体積法と組み合わせる際は、磁束と数値流束の整合が必要になる。
  - '[@P000400]の上流型・適応格子法で用いる八波形式は、発散に比例する項を加え、誤差を流れとともに運ぶ。[@P000401]はCT、射影法、八波形式などを比較し、発散誤差の大きさと保存性、衝撃波の正しさを別々に確かめる必要を示した。[@P000402]のGLM法では補助変数を加え、誤差を伝播させ、混合型では減衰させる。採用する方式に応じて、保存量の収支、磁場の発散、境界での誤差の振る舞いを確認する。'
- heading: 多次元更新と格子細分化を、実装へつなぐ
  paragraphs:
  - 二次元・二次精度の方法を示したGardinerら（[@P000403]）は、セル平均磁場を隣接面磁場の平均として更新し、Godunov法の磁場流束を角電場の平均へ補正する整合条件を導いた。単純な角電場平均では一次元流れの数値粘性が半分になるため、PPM・CTUの多次元磁場源項と接触モードで風上化したCTを組み合わせる。斜め線形波は二次以上に収束する一方、回転衝撃管のセル中心磁場には約10%の振動が残り、保存的な2×1セル平均で初めて丸め誤差になる。CTの発散保存とセル尺度での無振動性を区別する結果である。[@P000403]
  - Athenaを記述したStone et al.（[@P000405]）は、質量・運動量・エネルギーの有限体積流束と、面磁場を更新するCT電場を整合させ、多次元の実装と検証問題にまとめた。標準3D CTU＋CTは6回のRiemann計算とCFL数0.5以下を用い、三次のPPM再構成を選んでも方法全体は二次精度である。斜めの線形MHD波で二次収束を確かめ、磁場ループでは格子に沿う軸方向磁場の保存と、軸も斜めの場合の打切り誤差を区別する。発散を測る離散演算子、数値拡散、強い衝撃波の頑健性を同じ条件でそろえることが、後続コードとの比較の軸になる。
  - PLUTO（[@P000406]）は、古典流体・MHD・特殊相対論流体・RMHDを、再構成、Riemann解法、時間更新から分けて選ぶ構成を示した。回転MHD衝撃波管では、基本変数での線形再構成と非分割RK2を固定した比較で、HLLDがRoeに近い誤差を保ち、同じ誤差に対する計算時間を減らした。著者は再構成の変更で時間順位が変わり得ると留保しており、解法の順位は対象と組み合わせに結び付けて読む。
  - CTと八波形式、曲線座標、閉包を同じコードで試せる点もPLUTO（[@P000406]）の特徴である。高速回転体では発散制約処理による分布が近い一方、極座標の内側セルが時間刻みを制限した。相対論的衝撃波管では閉包と薄い密度殻の解像が結果を変える。2007年稿の多次元AMRは開発中で、この版の検証と後年の実装を区別する。
  - Athena++（[@P000407]）は、AthenaのGodunov法とCTを、ブロック型AMR、曲線座標、通信と計算を重ねるtask listへ移した。粗細境界では保存量の面積積分流束と磁場更新の線積分EMFを細レベルへ合わせる。標準CTの全体空間精度は二次で、高次再構成と時間積分は誤差を減らす。解法の次数と、AMR境界の保存・発散制約の整合を合わせて確認する段階へ進んだ。
  - AMRによる高速化は、細分化条件とブロックの大きさに依存する。[@P000407]の相対論KH試験では、AMRは一様格子より速い一方、多くの短波長構造が粗細境界に由来すると著者は判断した。524,288 threadsで84%というMHD効率は、一様格子の弱スケーリングを8ノード基準で測った結果である。構造の再現と計算速度を比較する際は、最細解像度、格子配置、誤差指標と測定条件を対応させる。
- heading: 太陽風では、膨張流・磁気トルク・波動をつなぐ
  paragraphs:
  - '[@P000396]は高温コロナの流体方程式から外向きの膨張流を説明し、運ばれる磁場を考察した。[@P000397]は定常・軸対称の赤道面モデルに磁気力と回転を含め、三つの臨界点と角運動量輸送を結び付けた。このモデルでは、磁気トルクをAlfvén点までの有効な共回転と対応させて評価する。太陽風の速度を求める問題から、磁場を介して太陽の回転が失われる問題へ、扱う物理が広がる。'
  - 理論の波を観測へ結び付けたのが、Mariner 5のプラズマ・磁場データを解析した[@P000411]である。高速の太陽風に見られる大振幅の外向きAlfvén波を整理した。定常風の平均構造と、その上に重なる波動を分けて読むと、流体モデルが捉える量と観測で比べる量が明確になる。
- heading: 磁気圏の大域計算では、領域間の結合が効く
  paragraphs:
  - 太陽風と地球の磁気圏を同じ計算へつなぐには、異なる領域の空間・時間スケールと境界で交換する量をそろえる必要がある。SWMF（[@P000408]）は、コロナ・太陽圏・磁気圏・電離圏などのモデルを結合する枠組みを示した。各領域には異なる物理モデルを使い、この論文は設計・実装と実演試験を扱う。
  - OpenGGCM（[@P000409]）は外側磁気圏の抵抗性MHDを沿磁力線電流・電位・電子降下で電離圏・熱圏へ結合し、THEMISの2007年3月23日サブストームと比較した。磁場・流れの大まかな変化とサージへの磁力線写像は再現したが、開始は観測より早く、密度・温度の一致は弱かった。CTIMコンダクタンスを使う場合と一様値・夜側電子降下を切る場合で応答が変わるとの報告は、MHD本体と電離圏境界を併せて検証する必要を示す。
- heading: 再結合では、抵抗性MHDからHall・運動論へ進む
  paragraphs:
  - '[@P000395]は反平行な磁場を押し合わせ、流入・流出と拡散を伴う再結合を調べた。磁場配置とエネルギーの変化を流体で考える基礎になる。無衝突の電流層へ進むと、電子とイオンの運動の違いをどこまでモデルへ含めるかが問題になる。'
  - GEMの比較（[@P000410]）は、共通のHarris電流層と初期摂動でPICから抵抗性MHDまでを試験し、Hall効果を含むモデルがこの条件下で近い再結合率を示すことを報告した。この結果を適用する際は、初期条件と採用したOhm則を対応させる。大域MHDの中へ運動論の領域を埋め込む計算には、PIC領域を動的に変えるFLEKS（[@P000071]）がある。大域の流れを流体で追い、局所の電流層を粒子で扱う研究へつながる。
  - イオン粒子・電子流体のhybridと、MHD–PICの領域結合では、電子の記述と境界で交換する量が異なる。関連テーマの「ハイブリッドPIC法・粒子と流体の結合」で、電子慣性と圧力閉包、保存性・波動精度、月ウェイクやガニメデ磁気圏への適用を比較する。
lineage:
- title: 波動の理論から太陽風の観測へ
  steps:
  - paper_id: P000393
    title: 導電性流体と磁場の波を提示
    significance: 流体運動と誘導電流の力を結び付け、MHD波動の基本を示した。
  - paper_id: P000411
    title: 太陽風の変動からAlfvén波を読む
    significance: 磁場とプラズマの観測を対応させ、大振幅の外向き波動を整理した。
    connection: 波の理論を宇宙での同時観測へつなぐ
- title: 太陽風の膨張から角運動量輸送へ
  steps:
  - paper_id: P000396
    title: 高温コロナからの外向き流れ
    significance: 流体の膨張で太陽風を説明し、運ばれる磁場を考察した。
  - paper_id: P000397
    title: 回転と磁気トルクを含める
    significance: 臨界点を通る定常磁化風を解き、角運動量の損失を評価した。
    connection: 膨張流から回転する磁化風へ物理を広げる
- title: 磁束の保存から多次元コードへ
  steps:
  - paper_id: P000399
    title: 格子上で磁場の発散制約を維持
    significance: 磁束の積分形に合わせたCTの離散化を示した。
  - paper_id: P000403
    title: Godunov流束とCTを整合
    significance: 二次元・二次精度のCTU/CTで、Godunov面流束と格子辺の電場を整合させた。
    connection: 磁束の更新を有限体積法の多次元流束へ組み込む
  - paper_id: P000405
    title: 検証問題を持つAthenaへ実装
    significance: 保存的な流体流束とCTを一次元から三次元へ実装し、線形波・衝撃波・磁場ループの条件別試験にまとめた。
    connection: 整合的な更新を天体MHDの計算基盤へつなぐ
  - paper_id: P000407
    title: 適応格子と並列実行を拡張
    significance: ブロックAMRと曲線座標へ広げ、粗細境界の流束・EMFを整合させた。性能評価では一様格子とAMRを区別する。
    connection: 数値解法を引き継ぎ、計算の構成と規模を広げる
- title: 発散誤差の移流・比較・クリーニング
  steps:
  - paper_id: P000400
    title: 上流法と適応格子を組み合わせる
    significance: 八波形式を用いるMHD解法を太陽風・磁気圏の計算へ適用した。
  - paper_id: P000401
    title: 発散制約の方式と保存性を比較
    significance: CT、射影法、八波形式の誤差を同じ試験条件で比較した。
    connection: 方式の実装から、保存性と不連続の比較へ進む
  - paper_id: P000402
    title: 誤差を伝播させ減衰させるGLM
    significance: 局所的な補正を既存の有限体積解法へ加える方式を示した。
    connection: 制約処理の別の選択肢として、伝播と減衰を組み合わせる
- title: 流体の再結合からモデル間の比較へ
  steps:
  - paper_id: P000395
    title: 流入・流出と拡散で再結合を考える
    significance: 高い電気伝導度を持つ流体で反平行磁場の再結合を評価した。
  - paper_id: P000410
    title: 共通条件でHall・PICと比較
    significance: 再結合率の差から、無衝突電流層に必要な物理を検討した。
    connection: 抵抗性モデルの基礎から、共通初期条件でのモデル比較へ進む
public: true
scope:
  include:
  - 理想MHD・抵抗性MHDの基礎、波動・適用条件
  - 衝撃波捕獲・Riemann解法・磁場の発散制約
  - 多次元更新・適応格子・公開計算コード
  - 太陽風・地球磁気圏・再結合・MHDとPICの結合
