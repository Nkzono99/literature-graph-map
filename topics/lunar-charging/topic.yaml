- paper_id: P000017
  group: environment
  role: 南極実地形モデル
  summary:
    question: 南極の実地形と月の公転に伴うプラズマ環境の変化は、表面電位と電場をどう変えるか。
    method: LRO/LOLA標高データによる南緯86–90度の地形を用い、有限要素法とBPニューラルネットを組み合わせて半公転分を計算した。
    contribution: 地形による局所電場の増強を示し、プラズマシートでは表面電位が約−1000 V、計算領域の最大電場が約5 V/mになると予測した。
