- paper_id: P000135
  group: feature-charging
  role: 局所帯電によるエッチストップ
  summary:
    question: 深いSiO2溝の加工を、局所電位が止める条件は何か。
    method: 電子・イオンのMonte Carlo追跡を表面電荷収支とPoisson方程式に結合。
    contribution: 入射300 eVのモデルで、深い溝の正帯電がイオン到達を阻み、加工停止を生む。
  evidence_by_item:
    question:
    - paper_id: P000135
      version_id: V1
