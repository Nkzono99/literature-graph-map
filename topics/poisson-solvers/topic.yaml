    title: 孤立系の電位を格子で求める
    significance: 日本語訳では、有限支持の源の零埋めとGreen核の打切りを用い、倍長FFTの循環畳込みを物理領域の離散和へ対応づける仕組みを説明する。原著刊行版との照合は未確認。
    connection: ''
  - paper_id: P000160
    title: Green関数の扱いを高精度化
    significance: "Green核を必要距離の外側で切り、Fourier核から畳み込み重みを前計算した。十分に滑らかで格子に解像された源に超代数的収束を示す。"
    connection: 自由空間の畳み込みを改良
  - paper_id: P000083
    title: 電位と電場の誤差収束を比べる
    significance: 滑らかなGaussian密度の二次元・三次元例で、比較したHockney–Eastwood実装とVico–Greengard–Ferrando法の電位・電場の誤差収束を比較し、密度の滑らかさを条件として解法選択を精度から論じた。
    connection: 従来法との収束精度を比較
