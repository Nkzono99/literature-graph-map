- paper_id: P000192
  group: pits
  role: LROCによる縦孔の壁と張り出し
  summary:
    question: 月の海を構成する玄武岩の溶岩層はどの程度の厚さで重なり、急峻な縦孔の底は地表下へ続く空洞を示すのかを、高解像度画像で検証した。
    method: 月周回探査機LROのカメラLROCが撮影した高解像度画像を解析した。縦孔や衝突クレーター、リルに露出する地層を調べ、斜め方向からの画像で層の厚さと縦孔の床の広がりを確認した。
    contribution: 露頭に厚さ3〜14mの層を認め、約10m厚の溶岩流が重なると推定した。2つの縦孔では地表下へ続く床を確認し、横方向の規模は未確定ながら地下空洞の存在を示した。
  evidence_by_item:
    question:
    - paper_id: P000192
      version_id: V1
      url: https://asu.elsevierpure.com/en/publications/confirmation-of-sublunarean-voids-and-thin-layering-in-mare-depos/
