- paper_id: P000279
  group: calibration
  role: MI・SP・M³の反射スペクトル比較
  summary:
    question: かぐやとチャンドラヤーン1号の月面反射率データは、観測条件や較正の違いを含めてどこまで一致し、組成推定に合わせて利用できるか。
    method: 両衛星の5機器と地上望遠鏡のデータについて、放射輝度から反射率への変換手順と各データの特徴を整理し、異なる機器の反射スペクトルを比較した。
    contribution: 絶対反射率には一部で小さな差が残る一方、スペクトル形状は機器間で対応し、複数機器のデータを組み合わせて各地質領域の組成を推定できることを示した。
