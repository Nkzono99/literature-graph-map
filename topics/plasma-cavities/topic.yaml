- paper_id: P000224
  group: expansion
  role: Lunar Prospectorの電子・磁場観測
  summary:
    question: 月の近傍に生じるプラズマウェイクで、磁場・電子密度・電子温度・電位はどのような空間構造をもち、その構造は太陽風条件や月の地殻磁場にどう依存するか。
    method: Lunar Prospectorの磁場・電子分布観測と、Windによる太陽風条件の観測を組み合わせ、電子密度・温度・電位と磁場の構造を調べた。カッパ分布を用いた空洞へのプラズマ膨張解とも比較した。
    contribution: ウェイク内の電子密度低下、電子温度上昇、境界をまたぐ電位降下を確認した。磁場構造は高度によって太陽風条件や地殻磁場に左右され、電子と磁場の分布はカッパ分布を用いた膨張解でよく記述された。
