- paper_id: P000146
  group: plasma-environment
  role: 地形・磁場を含む氷の収支
  summary:
    question: 南極の実地形と比較的弱い地殻磁場は、浅い太陽風入射による陽子・電子の到達と、条件付きの局所氷収支をどう変えるか。
    method: LOLAの20 m標高製品を1,369 m格子へ写像し、Kaguya・Lunar Prospectorから推定した地殻場を完全運動論的電磁PICへ組み込む。四流向の名目太陽風準定常流束を平均し、生成・陽子侵食・電子分解/脱離・年平均温度による熱昇華を比較する。
    contribution: 地形によるクレーター底の部分的遮蔽と側壁・稜線への集中を示し、弱い磁場の効果を一律な遮蔽より流束の再配分として位置づけた。生成上限と固定損失収率の縮約式では低温PSRに正収支を得るが、収率変化で符号も変わり得る。
  evidence_by_item:
