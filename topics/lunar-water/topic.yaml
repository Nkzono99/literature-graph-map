- paper_id: P000139
  group: observations
  role: LCROSS衝突噴出物中の水
  summary:
    question: Cabeusの永久影から掘り出した物質に氷・水蒸気が含まれるか、それぞれの水量を日照噴出ダスト量と結び付けられるか。
    method: 2009年10月9日のLCROSS衝突後4分をNIR/UV・可視分光で観測。1.5・2.0 μm氷帯、1.87 μm水蒸気帯、約0.309 μm OH発光を識別し、線形混合モデル・HITRAN断面積とDISORT/Mie粒子モデルで視野内の水・ダスト質量を推定した。
    contribution: Cabeus衝突噴出物の一部を氷として同定し、水蒸気も検出した。視野内の水蒸気＋氷は最大155±12 kg、日照噴出ダストを分母にした平均水量は5.6±2.9%と推定した。
