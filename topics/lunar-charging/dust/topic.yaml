- paper_id: P000240
  group: properties
  role: 凝集体の帯電と電子放出
  summary:
    question: 同質量の球と比べて、凝集体の見通し遮蔽、放出電子の再捕集、構成粒子の粒径が帯電にどう影響し、電荷を粒子数や疎密から推定できるかを調べた。
    method: 中性環境でPCA/CCAにより作った単分散silicate凝集体をOML_LOS法で帯電させた。直線入射とパッチの電荷・双極子を用い、二次電子放出が重要なヘリオシース条件と、光電子供給を変えた1 AU条件で同質量球を比較した。
    contribution: ヘリオシース条件では電荷がN^0.413、compactness factorの−1.3乗で整理され、5–10 nmの構成粒子の二次電子放出の小粒子効果も残った。1 AUの例では光電子供給次第で球との電荷の大小が変わり、帯電履歴中の符号差も生じた。正電荷の固定供給条件ではN^0.42、compactness factorの−1.3乗を報告した。 月面への関係は形状と電子再捕集を考える基礎で、計算対象は孤立凝集体である。
