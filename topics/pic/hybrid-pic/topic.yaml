- paper_id: P000099
  group: closures
  role: 電子流体近似とウェイク
  summary:
    question: 無衝突・非磁化のmesothermal流中の無バイアス導体平板背後で、等温Boltzmann電子を使う流体解析・hybrid PICはどの領域までfull PICの密度場を表せるか。
    method: 平板長140 λD0、Mach数8の陽子–電子流を、準中性の流体解析解・静電hybrid PIC・実質量比1836.15の静電full PICで比較。局所密度差、方向別電子二次モーメントとVDF、VDFの非Maxwell性を測る指標Ψを対応付けた。
    contribution: Mach線からδθ≈2θ0≈2/M0までの初期膨張域では巨視的密度場が近く、その先の深いウェイクでは非Maxwell分布・異方性・対向電子流に伴ってBoltzmann電子閉包が崩れることを示した。10%密度差境界は本計算の密度約0.15とΨ≈0.02におよそ対応し、中心の横方向温度増大は二峰分布の対向流に由来する。
