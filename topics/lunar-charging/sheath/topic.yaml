  group: balance
  role: ARTEMISによる光電子の識別と放出収率
  summary:
    question: 月面の光電子放出収率を、軌道上の電子観測からどこまで制約できるか。
    method: ARTEMISとFISM2の太陽放射を比較し、酸素Auger電子を指標に月面由来の光電子を選別。
