- paper_id: P000275
  group: surface-and-global
  role: 電子・イオンの応答差と風洞の空洞形成
  summary:
    question: イオンの旋回半径より小さい月面磁気異常の上で、何が太陽風イオンを減速・反射し、密度空洞とスワールの明暗差を作りうるか。
    method: Lunar Prospector・Kaguya・Chandrayaan-1・Nozomiの既報の異なる事例を、電子が磁化されイオンが磁化されない二流体の電位障壁モデルでまとめ、超音速水素流を二つの双極子磁石へ当てる風洞の写真・Langmuir probe分布と比較した。観測・風洞データは引用文献に依存し、全無次元数をそろえた相似ではない。
    contribution: 小規模な磁気異常でも、電子とイオンの応答差による電荷分離の電場がイオンを偏向する機構を提案し、風洞での密度空洞と浮遊電位変化につないだ。複雑な局所磁場勾配が太陽風照射と風化を変えることでスワールの明暗差を生む可能性を論じる。実験電位予測と電子慣性長には原稿内の数値不整合があり、定量的一致は未確認。
