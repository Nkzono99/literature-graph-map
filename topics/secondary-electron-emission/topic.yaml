schema_version: 1
topic_id: secondary-electron-emission
title: 二次電子放出
question: 材料からの電子放出と再捕集が、シース・表面電位・粒子の帯電をどう変えるか。
review:
- heading: 収率と放出電子の分布をモデルに入れる
  paragraphs:
  - 電子が表面に衝突すると、材料内で励起された電子が外へ出てくる。これが二次電子放出である。帯電の電流収支には、入射電子が反射して戻る成分も加わるため、文献を比べるときは二次電子の収率と、反射を含む総電子収率を区別する。銅表面を調べた[@P000154]は、低エネルギー域の反射や電子照射履歴が収率を変えることを整理した。
  - 粒子計算では、衝突のたびに何個の電子を、どのエネルギーで放出するかを決める必要がある。[@P000091]は銅とステンレス鋼の測定に合わせた確率モデルを示した。PICへ放出過程を組み込む際の出発点になり、材料の収率と放出電子の分布を一緒に扱える。
- heading: 月試料を粉体・孤立粒子・軌道観測で比べる
  paragraphs:
  - 月試料の光電子・二次電子放出を扱う[@P000243]に加え、初期測定として、[@P000150]はApollo 14の粉体を用い、放出収率とエネルギー分布を調べた。単粒子の材料比較では、[@P000166]がApollo
    17・MLS-I・JSC-1の帯電を電子照射で測り、実月試料の収率がMLS-Iに近いと推定した。Apollo 16土壌を扱う[@P000151]は、40–2000
    eVでの総電子収率と、10 keV照射下での粒子移動を測定している。一方、[@P000153]は0.2–13 µmの粒子を個別に保持して帯電を測った。孤立粒子と粉体層では電子が周囲の粒子へ戻る経路が異なるため、粒径と試料の置き方が比較の手掛かりになる。
  - 観測へ進むと、[@P000152]は月が地球磁気圏内にある夜側のデータから、月面を出入りする電子電流を比較した。推定した実効収率は、比較対象の実験室試料の約3分の1だった。模擬レゴリス層を測る[@P000053]と併せると、材料組成や微細構造から、表面を脱出する電子の量へ議論をつなげられる。
- heading: 強い放出がシースの電位構造を変える
  paragraphs:
  - 電子放出が増えると、浮遊表面の電流収支と周囲の空間電荷が変わる。[@P000155]の空間電荷制限シースでは、放出電子の一部が表面へ戻り、正味の放出電流が制限される。さらに[@P000156]は、強い二次電子放出を伴う壁に囲まれたプラズマのPIC計算で、壁が正となる逆シースを示した。どの状態になるかは、入射・放出電子の分布や粒子供給の条件にも依存する。
  - この理論と測定をつなぐ文献として、[@P000089]は放出電子の温度を含む運動論を熱電子放出実験と比較し、[@P000090]は窒化ホウ素からの二次電子放出を伴うシースを測定した。[@P000093]では古典シース、電位の極小を持つシース、逆シースが観測されている。材料の放出率を設定する段階から、実際に逃げる電子量を電位分布とともに求める段階へ進む研究群である。
  - 定常シースの成立に加え、その安定性も放出特性に応答する。[@P000271]は収率の入射エネルギー依存とシース内の電子温度変化を結び、強い二次電子放出による不安定性を理論的に説明した。材料の収率曲線を電位・密度の変動へ対応させる研究として読める。
- heading: 再捕集が粒子間の帯電差を生む
  paragraphs:
  - 粉体では、放出電子が隣の粒子や空隙の内壁に吸収される。この電子の移動に着目した[@P000009]は、光電子・二次電子の再吸収で局所的な負帯電を作るpatched
    charge model（PCM）を提案し、粒子の跳躍を説明した。[@P000010]は固定粒子群の差動帯電と導電性を扱い、粒子間電場の強さを検討している。月面全体の電位を考えるシースの研究と、粒子表面の一部に電荷が偏る研究をつなぐ位置にある。
  - 斜入射電子ビームを使う[@P000250]は、収率が1を超える条件でビームと逆方向への粒子移動を測った。照射側と陰側で微小空洞へ届く電子が異なり、帯電差が方向性を作るという説明をPICとも比較している。再捕集を平均電荷だけでなく、粒子のどちら側へ電荷が偏るかまで扱う実験となる。
- heading: 放電・加工では入射粒子と装置条件が効く
  paragraphs:
  - イオン衝撃による放出を計算する[@P000157]は、イオンの運動エネルギーが材料内の電子へ移る過程と、その電子が外へ逃げる過程を追跡した。Ar・Kr・XeとW・Feの組合せを扱い、電気推進の材料・試験設備へつながる。磁気異常を模擬した[@P000116]では、二次電子の流入が正の表面電位の上昇を抑えるという説明が示されている。
  - 放電開始を扱う[@P000158]は、放出のエネルギー依存と微小ギャップの効果をPIC/MCCに入れ、絶縁破壊電圧を実験と比較した。加工形状まで含む[@P000137]は、PMMAの表面粗さに対するイオン反射・帯電・二次電子放出の寄与を分けている。この計算条件では二次電子の影響は小さく、放出の有無だけでなく、入射粒子の条件と評価する量を対応させて読むと使いやすい。
  - 容量結合RF放電の[@P000248]は、エネルギーに依存する二次電子放出とプラズマ密度の増幅を扱う。材料の放出特性を境界条件へ入れるモデルから、放出が装置内のプラズマ状態へ戻る影響まで論点を広げられる。
- heading: 斜長石粒子の輸送から電荷モデルを制約する
  paragraphs:
  - 350 eV照射の[@P000317]は、孤立粒子の二次電子収率と、空隙で再吸収を受ける粉体の実効収率を分けて帯電を考えた。収率の仮定によって粉体表面の極性が変わり、粒径・速度の高速側を局所帯電モデルで覆うには従来より大きい係数が必要になる。高エネルギーの後方散乱電子による空洞内帯電を候補に挙げるが、今回の実効収率・粒子電荷・表面電位を直接測定した結果ではない。
- heading: 月面での後方散乱と、磁場による再衝突
  paragraphs:
  - '[@P000363]はARTEMIS観測から、表面に衝突した入射電子が戻ってくる後方散乱の係数を推定した。一部の電子は磁場に沿って再び表面へ届くため、観測される脱出量は磁場の向きにも依存する。材料から新たに出る二次電子と、入射電子そのものが戻る後方散乱を区別すると、表面の放出特性と実効的な電流を比較しやすくなる。'
lineage:
- title: 放出シースの電位構造
  steps:
  - paper_id: P000155
    title: 放出電子を含むシースの基準を作る
    significance: 電子放出が壁への熱流と電位差を変える過程を整理し、空間電荷制限シースの基礎を示した。
  - paper_id: P000156
    title: 強い放出で逆シースへ移る
    significance: 高い放出率の条件で、壁がプラズマより正になり放出電子を戻す電位構造を示した。
    connection: 空間電荷制限から逆シースへ
  - paper_id: P000093
    title: シースの移り変わりを測る
    significance: 放出量に応じた古典シース、電位極小を持つシース、逆シースを実験で捉えた。
    connection: 電位構造を実験で調べる
- title: 放出特性から電子の行き先へ
  steps:
  - paper_id: P000154
    title: 銅の放出率と照射履歴を測る
    significance: 低エネルギー電子の反射と放出率を測り、電子照射による収率の低下を電子雲対策へ結び付けた。
  - paper_id: P000091
    title: 放出電子を確率モデルで生成
    significance: 反射・再拡散・真の二次電子を含む生成モデルに、放出率とエネルギー分布の測定値を組み込んだ。
    connection: 測定データを粒子生成モデルへ
  - paper_id: P000009
    title: 粒子間の再捕集に着目
    significance: 粉体の空隙で電子が再吸収される局所帯電モデルを提案し、ダストの離脱を説明した。
    connection: 放出後の局所的な再捕集へ
