    method: 一次元無衝突・冷イオンのSCL運動論を、壁損失を含むMaxwell電子と半Maxwell放出電子、浮遊電流釣り合い、一般化Bohm条件から構築。ArのEDIPICで超音速流に合わせた理論と比較し、HeのRF残光中の平面熱電子放出実験で温度比依存を測定。
