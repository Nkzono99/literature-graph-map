schema_version: 1
topic_id: secondary-electron-emission
title: 二次電子放出
question: 材料からの電子放出と再捕集が、シース・表面電位・粒子の帯電をどう変えるか。
synopsis:
- 電子が表面に衝突すると、材料内の電子が放出される。帯電の電流収支には反射して戻る成分も加わるため、二次電子の収率と総電子収率を区別する（[@P000154]）。粒子計算への境界条件は、電子数とエネルギーの分布まで含むモデル（[@P000091]）で与えられる。
- 月試料の収率は、粉体層の試料電流（[@P000151]）、孤立粒子の電荷変化（[@P000153]）、軌道上の電子観測（[@P000152]）という測り方で定義が異なる。粉体では放出電子が隣の粒子や空隙に再吸収され、局所的な帯電差を作る（[@P000009]）。
- 強い放出は、空間電荷制限シースや逆シースへ電位構造を組み替え（[@P000155]、[@P000156]）、収率のエネルギー依存はシースの安定性にも関わる（[@P000271]）。材料の収率曲線と、実際に脱出する電流を分けて評価することが共通の条件である。
review:
- heading: 収率と放出電子の分布をモデルに入れる
  paragraphs:
  - 電子が表面に衝突すると、材料内で励起された電子が外へ出てくる。これが二次電子放出である。帯電の電流収支には、入射電子が反射して戻る成分も加わるため、文献を比べるときは二次電子の収率と、反射を含む総電子収率を区別する。銅表面を調べた[@P000154]は、低エネルギー域の反射や電子照射履歴が収率を変えることを整理した。
  - '[@P000091]は、弾性反射・再拡散・真の二次電子の収率と個別電子のエネルギースペクトルを、衝突ごとの電子数と同時エネルギー分布へ結び付けた。侵入電流に条件付けた電子数分布と合計エネルギー上限を用い、平均収率とスペクトルの整合を保つ。以前の較正で合計エネルギーのjet
    spectrumを個別スペクトルと取り違えた点も修正した。Cu・304鋼のパラメータは処理条件の定まった特定試料への較正例であり、三成分の排他性、全成分の余弦則、低エネルギー外挿などの仮定を伴う。'
- heading: 月試料を粉体・孤立粒子・軌道観測で比べる
  paragraphs:
  - 月試料の光電子・二次電子放出を扱う[@P000243]に加え、初期測定として、[@P000150]はApollo 14の粉体を用い、放出収率とエネルギー分布を調べた。
  - Horányiらは実月試料と模擬土の平衡電荷を比較し、二次電子収率を電流釣合いモデルから推定した。全試料にピークエネルギーE_M=400 eVを仮定すると、等方入射の有効最大収率はMLS-1が3.1±0.1、JSC-1が3.4±0.1、Apollo
    17が3.2±0.1となる。20–90 eVの照射だけではピーク位置と高さが縮退し、法線入射の収率と約2倍の有効収率も区別する必要がある[@P000166]。
  - Vegaほかは、固定した月模擬物4試料について、全収率を測定し、放出電子50 eVの境界で後方散乱収率を分離した。Table Iの二次電子収率フィットでは、ピークは約1.4〜2.0、ピーク入射エネルギーは約430〜670
    eVである。成分の放出曲線を面積比で加重するpatchモデルは全収率曲線を再現したが、密度で重量比に換算しても逆算組成はassay/EDXと一致しなかった。曲線フィットと組成同定を区別し、隣接成分領域間の相互作用を無視する仮定を添える。[@P000053]
  - Dukes and Baragiolaは、ガラス含有率3.3%のApollo 16土壌61241を粒子層として測り、総収率σ=δ+ηの本文最大値1.13と第一交差80
    eVを報告した。粒子面の空隙による放出電子の再吸収と少量のガラス寄与で低い収率を説明するが、組成や粗さを独立に変えた検証ではない。40–2000 eVの分布をAr+で帯電補償すると、Ep>100
    eVでピーク1.2±0.2 eVとなり、700 eVの尾部はMaxwell型よりゆっくり減衰した。式(2)の分母表記と本文の負の指数pはFig.6の減衰と整合せず、フィット式の実装には留保が残る。本文最大収率1.13とFig.4中心点約1.11の小差は、数%の測定誤差や図読取・丸めを考慮し、誤植とは断定しない。[@P000151]
  - '[@P000152]は、地球磁気圏内の月夜側で、Lunar Prospectorへ届いた二次電子ビームの電流と、電位を補正したκ分布から推定する月面入射電流を比較した。両者の比は月面の入射エネルギー分布で平均した積分収率で、分布中心は約0.45、中央値は0.48だった。等方入射・平均κ=4.5のモデルでは、垂直入射ピーク約0.5、有効ピーク約1.0に対応し、引用された実験室値の約3分の1となる。強い地殻磁場がなく明瞭なビームを測れる場所・時刻を選び、約50
    eV未満の低温側は十分な加速が得られず測れなかったため、条件を越えた一律の収率にはできない。'
  - 負の月面電位が対象温度域で続く傾向も低い放出電流と整合するが、イオン・電子温度を等しいとする単純電流平衡モデルは負電位を過大に予測した。著者はレゴリスの粗さによる脱出途中の衝突を低収率の説明として好むものの、非単調電位構造や追加電流も代替候補に残す。軌道へ脱出する実効的な電流を制約する観測であり、局所壁で生成した電子数と再捕集率を個別に測定したものではない。[@P000152]
  - 孤立粒子では、放出電子と付着電子の競合が入射エネルギーだけでなく粒径と帯電状態にも依存する。Abbasらの月ダスト・シリカ実験では、多くの小さな正帯電粒子が10–25eVで正電荷を増やし、100eVで減らす応答が見られ、中性平面バルク材の経験式からの直接予測を問い直した。ただし収率は電荷変化からの推定で、付着効率1と局所流束の調整を含む。粒径の図が示すΔδ/Δqは絶対収率ではなく、原典には負粒子の収率表と図の方向差も残るため、定量的な収率曲線へ移す際は条件と不確かさを併記する必要がある[@P000153]。
- heading: 強い放出がシースの電位構造を変える
  paragraphs:
  - 電子放出が増えると、浮遊表面の電流収支と周囲の空間電荷が変わる。[@P000155]の空間電荷制限シースでは、放出電子の一部が表面へ戻り、正味の放出電流が制限される。さらに[@P000156]は、強い二次電子放出を伴う壁に囲まれたプラズマのPIC計算で、壁が正となる逆シースを示した。どの状態になるかは、入射・放出電子の分布や粒子供給の条件にも依存する。
  - 定常シースの成立に加え、その安定性も放出特性に応答する。[@P000271]は収率の入射エネルギー依存とシース内の電子温度変化を結び、強い二次電子放出による不安定性を理論的に説明した。材料の収率曲線を電位・密度の変動へ対応させる研究として読める。
  - SheehanらのSCL運動論では、放出電子の温度だけでなく、壁に失われるプラズマ電子による分布の変化がシース電位を左右する。冷放出極限は0.91 T_ep/e、温度比5では0.51
    T_ep/eとなり、同温度極限でゼロへ向かう。著者は二次電子放出への一般化に言及するが、実際の境界分布と検証は熱電子放出の半Maxwell分布である。材料別の放出収率や非Maxwellスペクトルを含める際は、その条件を追加して検討する必要がある。[@P000089]
  - '[@P000090]は、浮遊BN壁の二次電子放出がシース電位差を縮める遷移を、高エネルギー一次電子を含むアルゴンプラズマで調べた。平滑面は粗面より低い一次電子エネルギーで小電位差へ移り、著者は粗面の電子再捕捉による有効収率低下を推定した。使用試料の収率と放出電子温度は直接測らず、文献収率と温度比θ=10を仮定している。S字形の多重解と履歴依存性は理論予測で、臨界収率を超えるシースとヒステリシスは未測定である。'
  - '[@P000093]は、材料のSE収率γ(E)、入射電子分布、総放出J0seと実際に逃げるJseを電位分布と結び付けた。0.1 mTorrでは高温プラズマ電子のSE寄与が一次電子の約2.4–9.3倍と計算され、希薄条件では一次電子が主にSEを作る。SCLの障壁が放出電子を戻すため、γが1を超える材料でもΓや逃走量を別に評価する必要がある。'
- heading: 再捕集が粒子間の帯電差を生む
  paragraphs:
  - 粉体では、放出電子が隣の粒子や空隙の内壁に吸収される。この電子の移動に着目した[@P000009]は、光電子・二次電子の再吸収で局所的な負帯電を作るpatched
    charge model（PCM）を提案し、粒子の跳躍を説明した。[@P000010]は固定粒子群の差動帯電と導電性を扱い、粒子間電場の強さを検討している。月面全体の電位を考えるシースの研究と、粒子表面の一部に電荷が偏る研究をつなぐ位置にある。
  - 斜入射電子ビームを使う[@P000250]は、収率が1を超える条件でビームと逆方向への粒子移動を測った。照射側と陰側で微小空洞へ届く電子が異なり、帯電差が方向性を作るという説明をPICとも比較している。再捕集を平均電荷だけでなく、粒子のどちら側へ電荷が偏るかまで扱う実験となる。
- heading: 放電・加工では入射粒子と装置条件が効く
  paragraphs:
  - イオン衝撃による放出を計算する[@P000157]は、イオンの運動エネルギーが材料内の電子へ移る過程と、その電子が外へ逃げる過程を追跡した。Ar・Kr・XeとW・Feの組合せを扱い、電気推進の材料・試験設備へつながる。
  - '[@P000116]は、磁気遮蔽領域の正電位を説明するため、二次電子の放出量と近傍からの輸送を併せて検討した。[@P000116]の100–800 eV窒素ビーム実験は、高エネルギー側でローブの正電位がイオン停止の期待値を下回り、電子電流が増すことを示した。発生率を既存文献、二次電子熱エネルギーを5
    eVとする試験粒子計算では、800 eVでローブ近傍の供給が増し、磁場と外向き表面電場の下で正味回収も増えた。機構は実測を説明する候補であり、レゴリスの収率や月面電位を直接測った結果として扱うには、材料・イオン種依存と自己無撞着な帯電応答の検証が残る。'
  - 放電開始を扱う[@P000158]は、放出のエネルギー依存と微小ギャップの効果をPIC/MCCに入れ、絶縁破壊電圧を実験と比較した。加工形状まで含む[@P000137]は、PMMAの表面粗さに対するイオン反射・帯電・二次電子放出の寄与を分けている。この計算条件では二次電子の影響は小さく、放出の有無だけでなく、入射粒子の条件と評価する量を対応させて読むと使いやすい。
  - 容量結合RF放電の[@P000248]は、エネルギーに依存する二次電子放出とプラズマ密度の増幅を扱う。材料の放出特性を境界条件へ入れるモデルから、放出が装置内のプラズマ状態へ戻る影響まで論点を広げられる。
- heading: 斜長石粒子の輸送から電荷モデルを制約する
  paragraphs:
  - 350 eV照射の[@P000317]は、孤立粒子の二次電子収率と、空隙で再吸収を受ける粉体の実効収率を分けて帯電を考えた。収率の仮定によって粉体表面の極性が変わり、粒径・速度の高速側を局所帯電モデルで覆うには従来より大きい係数が必要になる。高エネルギーの後方散乱電子による空洞内帯電を候補に挙げるが、今回の実効収率・粒子電荷・表面電位を直接測定した結果ではない。
- heading: 月面での後方散乱と、磁場による再衝突
  paragraphs:
  - '[@P000363]はARTEMIS観測から、表面に衝突した入射電子が戻ってくる後方散乱の係数を推定した。一部の電子は磁場に沿って再び表面へ届くため、観測される脱出量は磁場の向きにも依存する。材料から新たに出る二次電子と、入射電子そのものが戻る後方散乱を区別すると、表面の放出特性と実効的な電流を比較しやすくなる。'
  - Dukes・Baragiolaは粉体層の総電子収率σ（二次電子δと後方散乱・再拡散電子ηの和）を、帯電を抑えた短時間・低電流照射で試料電流と収集電流から求めた。AbbasらはEDBに保持した孤立粒子の電荷変化率を電流モデルへ当てはめ、付着効率ηst=1を仮定し、電荷収支に合わせてビーム幅を調整して二次電子収率を逆算した。両者を比較するには、放出成分の定義、粒子電位による再捕捉、粒子位置での入射電子数の推定条件をそろえる必要がある。[@P000151][@P000153]
  - Halekasらが地球磁気圏内の月夜側で、強い地殻磁場がなく明瞭な二次電子ビームを持つ観測から求めたJ_SEC/J_Eは、月面からの二次電子電流と、下降電子スペクトルのκ分布・電位補正から推定した月面入射電流の比である。これは入射エネルギー分布で加重された積分二次電子収率で、Dukes・Baragiolaの粉体層の総収率σとは放出成分と入射条件が異なる。二次電子が近傍表面領域を脱出してLunar
    Prospectorへ達することと単調な電位変化を仮定しており、単色入射のピーク収率への対応づけには入射分布と収率モデルが必要になる。[@P000152][@P000151]
