  summary:
    question: 永久影の水氷はレゴリスを固め、斜面を安定させるか。
    method: 約90 Kと約220 Kで氷と高地レゴリス模擬物を混ぜ、静的・動的安息角と崩壊様式を測る。
    contribution: 約90 Kでは氷が30重量%を超えると静的安息角が増えた一方、動的安息角の変化は小さかった。実験条件下では数重量%の氷による凝集の寄与は限定的だった。
