- paper_id: P000199
  group: contact
  role: DMTの接触変形・付着理論
  summary:
    question: 球状粒子と平面の接触で、弾性変形と分子間引力が互いにどう影響し、接触面積の増大が粒子を引き離す力を増すのかを調べた。
    method: 球と平面の弾性接触と分子間引力の相互作用を記述する理論を構築し、接触面積と接触を破るのに必要な力との関係を解析した。
    contribution: 著者の理論では、ファンデルワールス力で弾性接触面積が広がっても、分離力は未変形の球と平面の点接触での引力に等しい。静電成分がなければ、その力は球半径と単位面積当たりの分離仕事に比例する。
  evidence_by_item:
    question:
    - paper_id: P000199
      version_id: V1
      url: https://www.sciencedirect.com/science/article/pii/0021979775900181/pdf
      source_type: abstract
