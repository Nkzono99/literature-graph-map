schema_version: 1
topic_id: plasma-expansion
title: プラズマ膨張・ウェイク
question: 希薄な領域への流入が、電位・粒子分布・イオン加速をどう生むか。
review:
- heading: 電子とイオンの速さの差が膨張を駆動する
  paragraphs:
  - プラズマが真空や低密度領域に接すると、動きの速い電子が先行し、電荷分離によって生じる電場がイオンを加速する。[@P000095]は、希薄化波が元のプラズマへ広がる過程と、イオン先端が空隙へ進む過程を整理し、宇宙物体背後のウェイクへ結び付けた。膨張する密度や速度をまず見通したいときの入口になる。
  - 無衝突膨張を扱う[@P000219]はイオン先端の加速を調べる。月の後方が埋まる過程や、推進機からプルームが広がる過程にも同じ膨張の発想が使える。物体による粒子の吸収、表面電位、磁場を順に加えることで、それぞれの対象に近づけていく。
  - Mora（2003）は、冷イオンと一定温度のBoltzmann電子からなる半無限プラズマの真空膨張を、Poisson方程式を含む一次元モデルで扱った。長時間には、準中性の自己相似解が破れる先端で電場が内部の約2倍となり、Znᵢ/nₑも約2となる。先端電場の補間式から速度・位置を求め、高エネルギー端をEmax≈2ZkBTₑ[ln(2τ)]²（τ=ωₚᵢt/√(2e)、eは自然対数の底、ωₚᵢt≫1）で表した。これは有限時刻の端で、固定電子温度のモデルでは時間とともに増える。イオン密度の盛り上がりがない結果も、鋭い初期境界を条件とする。[@P000096]
- heading: 電子の分布から計算モデルを選ぶ
  paragraphs:
  - Wang and Hu（2018）は、無衝突・非磁化の陽子–電子流が無バイアス導体平板の背後へ膨張する問題を、流体解析解、Boltzmann電子のhybrid PIC、実質量比のfull PICで比較した。平板長140 Debye長、Mach数8の計算では、Mach線から測った膨張角δθ≈2θ0≈2/M0までの初期域で密度場が近く、その先では電子VDFが非Maxwell化して差が増える。中心付近の横方向温度増大は、対向電子集団の二峰分布による二次モーメントの増大として説明される。等温電子による膨張則を使う際には、密度場の近似と電子分布の熱的解釈を分けて扱う必要がある。[@P000099]
  - '[@P000101]はXe推進機の条件でモデルを比較し、密度の大まかな形が似ていても、外縁の局所密度と電位には大きな差が残ることを示した。必要な出力が密度・電位・電子分布のどれかによって、モデル比較で見るべき量も変わる。'
  - Hu and Wang (2017)は、電子熱速度≫ビーム速度≫イオン熱速度を保つ完全運動論PICで、無衝突プルームの冷却と電子速度分布を結びつけた。ゼロ電流だが非中性の放出では、シースの後に中心域、電子冷却域、ほぼ等温の外側域が現れ、方向別分布は冷却域を経て初期とは異なる近Maxwell型へ移る。放出面から準中性を課した粒子計算では、巨視的構造が似ていても軸方向の冷却と電子分布が変わるため、温度と密度の関係を単一の平衡電子流体にまとめる際には、放出境界と異方性を考慮する必要がある。[@P000100]
- heading: 月ウェイクは流入経路と再充填の段階で読む
  paragraphs:
  - 月ウェイクの観測は、Windの横断観測[@P000223]、ARTEMISの三次元再構成[@P000231]をたどれる。[@P000220]は空隙断面の一次元静電PICをWind観測と比べ、境界電場で加速される対向イオン流を再現した。観測位置と膨張の段階を対応させると、理想化した空隙モデルが説明する構造を見分けられる。
  - Halekasらは、高エネルギー尾部をもつKappa電子の速度選別を含めた1次元準中性膨張解が、Lunar Prospectorで導出した電子密度・温度・電位の基本形を等温Maxwell解よりよく説明すると示した。特に自己相似変数Z=s/tが約300 km/s未満で適合がよいが、密度の全域と約75 km/sの再圧縮速度は説明しきれない。電子密度は観測精度内でほぼ軸対称でも、月近傍のLP位置では音速膨張と速度異方性1.3の高速磁気音速膨張を識別できなかった。[@P000224]
  - 真空への一次元膨張を月ウェイクと比べたOgilvieらは、入口側の指数関数的な密度減少、線形の陽子速度増加、光学的影の外へ広がる密度低下域を観測した。下流距離と太陽風速度に基づく膨張時間約24秒は、速度勾配からの約22秒と近い。一方、入口の密度適合に用いた音速40 km/sは実測電子温度からの35 km/sとずれ、出口側の回復も広域では単純な指数関数に合いにくかった。磁場方向の補正と上流条件の変化を含めて、単純解が観測のどの特徴を捉えるかを示す例である[@P000223]。
  - Nakagawa (2013)は、非磁化の絶縁障害物を太陽風中へ置く二次元電磁full-particle計算で、粒子吸収と局所的な表面帯電を扱った。夜側の負帯電を含む計算では、近傍のイオン・電子の密度差が背景密度の約50%に達し、イオンは自己相似解の希薄波先端へ来る前からwakeへ向かって加速された。著者はこの前加速を表面の負帯電に結びつけている。速度分布は一旦、有限イオン温度を含む自己相似解へ近づくが、下流で両側の流入が重なると再び外れる。中央の高い温度・圧力には、低温の二つの流れを一緒に評価した速度分散が寄与する。物体サイズに対するDebye長を下げ、全速度も遅くした比較では近傍の加速が強まった。磁場変形を議論できないとする著者の留保、光電子等の省略、完全垂直磁場を扱えない境界条件を伴う結果である。[@P000102]
  - ARTEMISで静電衝撃波を捉えた[@P000232]、電子分布から電位を復元するプレプリント[@P000262]は、計算が予測する局所的な電位構造を観測へ結び付ける。
  - Xu et al. (2019)は、ARTEMISのウェイクへ入る電子分布を内外で比較して磁力線方向電位を推定し、電子温度が高いほど負電位が深く、太陽風が速いほど下流へ長く続く傾向を示した。斜交磁場では左右の膨張時間が異なり、電位最小と電場の方向境界が片側へ移る二次元モデルを統計結果が支持する。近月の片側にはモデル差が残り、strahlのある例で中心に現れる約50 Vの接続差は左右別に置いたゼロ電位基準の制約として解釈された。[@P000104]
  - An et al. (2025)は、磁力線に沿う月ウェイク再充填を電子・イオン双方の運動論で追い、初期の自己相似的なイオン加速・平行冷却から、中央で対向流が作る静電衝撃波までを結びつけた。電子の磁場平行温度は端付近で密度低下とともに下がるため、等温電子理論は前面電場と到達位置を過大に見積もる。中央衝撃波では電位差が流入イオンを減速・反射し、磁場平行成分のエネルギー分配では主に電子熱へエネルギーを移して平坦な速度分布を作る。温度異方性を持つイオン流と同方向に進む波も増幅され、著者は右旋磁気音波と同定した。EMIC波は実行時間が短いため未確認の予測にとどまる。これらは1次元・初期Maxwell分布・質量比100の計算であり、非熱的電子や磁力線を横切る流入を含む条件への拡張が残る。[@P000105]
  - An et al.（2026）は、磁場に沿う一次元PIC計算で、膨張による大域的電位井戸と中心部のイオン音波衝撃波による局所電位上昇をつないだ。磁場平行成分のエネルギー分配では、大域的電位は電子を減速し、イオンを超音速へ加速して電子の熱をイオンの流れへ移す。中心部では、数十Debye長の衝撃波電位がイオンを減速・熱化し、電子も加熱する。左右由来の電子を追うことで、strahlの通過・反射と中心部の平坦な頂部を区別し、電位推定に用いる電子分布の物理的意味を整理した。[@P000106]
  - 2011年10月26日の単一ARTEMIS事例では、電子分布から推定した100 Vの大域的電位低下が与える陽子速度約140 km/sと、測定した磁場平行イオン流約150 km/sが概ね対応した。電子の磁場平行熱速度の増加約3000 km/sは、電位またはイオン流から見積もる約6000 km/sより小さい。計算は質量比100の一次元モデルで、入口側には磁場不連続による加熱もあるため、結果の条件を広げるには複数事例と高次元の検証が必要である。[@P000106]
  - 電子分布からの電位診断では、[@P000262]がボルツマン電位を初期値に使いつつ、左右の分布を独立に最適化し、衝撃波のある中央は捕捉電子の平坦な分布幅で解く。質量比100の一次元PICで、衝撃波のない初期（r/R_l=1.65）と衝撃波のある後期（r/R_l=5.5）を分けて検証した。ARTEMISの初期観測例にはすでに中央衝撃波があり、3領域を用いる点が初期PICと異なる。約800 Vと約200 Vは2観測事例の逆推定値であり、境界での残差と上流の定常性を条件として読む。
  - 流入する陽子には表面で反射・散乱された成分もある。近傍ウェイクのエネルギー変化[@P000186]、磁気異常からウェイクへの輸送経路[@P000273]を、ARTEMISの広域圧縮構造[@P000272]と読み比べる。Chandrayaan-2の電波観測[@P000247]は、太陽風中と磁気圏尾部の密度ゆらぎを調べる。大域的な流入・偏向と局所的な膨張を組にして扱う研究群である。
  - 月周辺の低エネルギーイオンには、昼側月面で散乱して戻る太陽風陽子も含まれる。Saito et al. (2008)は、かぐやの月面側センサーに現れる広い角度分布の成分を月面反射と解釈し、反射フラックスを元の太陽風イオンフラックスの約0.1〜1％と報告した。選択した連続2周回では太陽風約0.75 keV/qに対し最大約5 keV/qの成分が現れ、磁場から推定した対流電場方向に対応する南北変化を自己拾い上げ加速で説明した。この研究が扱うのは昼側で戻るイオンの起源と加速であり、ウェイクへの補充量は測定していない。[@P000184]
  - Nishino et al. は、先行研究のType-I進入を、境界電場で加速された陽子が磁場に垂直なラーモア運動で入る機構として紹介し、さらに昼側表面で散乱した陽子が自己ピックアップを経て最深部へ回り込むType-II経路を提案した。約100 km高度の上向き陽子の観測を、負のBy・影側磁場1.2倍・境界電場の省略を置いた軌道計算と比較した。このモデルで最深部へ上向きに達したのは、直下点から外れた昼側赤道域で散乱し、月の大きさに合うラーモア半径を持つ陽子の一部だった。南側の陽子支配領域が磁場沿いの電子を引き込むという説明は、対向電子ビームと磁力線の接続に基づく著者の提案である。[@P000103]
- heading: ダストとクレーターでは、物体の尺度が効く
  paragraphs:
  - Debye長より小さな負帯電粒子の背後では、イオンの集束が周囲の電位や粒子間力を変える。[@P000098]は動的遮蔽を求める理論と自己無撞着PICを比較しており、粒子の帯電と非線形性をどこまで扱うかを考える際に使える。
  - Hutchinson（2012）は、Te/Ti=100の一様な定常イオン流中で、小さな等電荷二粒子の横方向整列力をBoltzmann電子と粒子イオンを組み合わせた三次元PICと全運動量流束から求めた。衝突には、イオンと同じ速度で流れる中性気体との固定頻度の荷電交換を用いた。M≈0.3以下では単粒子ウェイクの正電位ピークが著しく弱まり、近線形条件では整列力もほぼ失われる。一方、Q̄=-0.2の非線形・衝突ありでは、単粒子電位勾配が反発を予測する低Mにも全力は引力を保ち、M=0.1に音速時の約1割が残る。著者は粒子へ収束するイオン流によるドラッグ摂動を候補に挙げるが、機構を一意に分離してはいない。膨張に伴う低速領域の相互作用を考える際には、Mだけでなくイオン熱速度・電荷・衝突モデルもそろえて比較する必要がある。本論文は膨張前線の時間発展自体を計算していない。[@P000097]
  - 地形の陰への膨張は、クレーターへの太陽風供給に直結する。[@P000008]は表面帯電と膨張のフィードバックを扱う。月全体のウェイク、局所地形の陰、粒子周囲では、物体サイズとDebye長、流速、磁場をそろえて比較するとつながりが見える。日夜境界の電場とダスト運動[@P000221]、日夜境界・極域での準中性破れ[@P000282]も、同じ粒子供給の違いを表面近くへつなぐ文献となる。[@P000221]の計算は定常・準中性ウェイクと滑らかな月面の鉛直電場を扱う。地形の陰による水平電場は定性的な提案で、局所電場の数値解やダストとの自己無撞着な連成計算は行っていない。
  - 太陽嵐中のクレーターと物体帯電を扱う[@P000222]は、運動論計算を等価回路へ接続した。膨張前線の下の電子雲を解く[@P000264]は、クレーター内の非中性領域を解析的に扱う。地形・材料と流入条件を対応させることで、膨張理論を具体的な空洞へ適用する筋道を追える。
  - Miyake・Nishino（2015）の50 m×45 m縦孔計算では、450 km/sの太陽風陽子は約1 keVのエネルギーでほぼ弾道的に進む一方、熱電子は負電位の影と壁への吸収により孔底への到達を制限される。日向側の電子密度低下には加速と壁損失が関わるが、流束保存による加速だけでは電流は減らず、壁への吸収が孔底の電子電流を減らす。天頂角30°では壁から孔底へ向かう光電子の下向き平均流も形成される。[@P000225]
  - 開口部から空洞へ入る流れでは、電子の熱運動と壁面捕集により、電子とイオンの底面への輸送が異なる。Gopalakrishnanらの2024年9月25日草稿のガラス管実験では、入口の負バイアスや深さの増加で底面の正電位が概ね高くなる一方、入口−40/−70 Vで模擬太陽風電子をほぼ遮っても電子電流が残る。著者はこの成分を壁へのイオン入射で生じる二次電子に帰し、底面電位の上昇を抑える機構として示した。100–800 eVの窒素由来プラズマと管径6 mmの実験であり、月の空洞に対する定量的な相似則は示されていない。[@P000226]
  - Xie et al. (2024)の静電hybrid計算では、標準条件のウェイクコーン角8.8°と温度・流速による変化はイオン音速を用いた膨張理論と整合する。一方、下降加速はクレーター上流のシースから始まり、底近くのイオン前縁は表面と局所シースのため比較理論より高くなると解釈された。三次元の横方向速度も加わり、自由な真空への膨張を地形内の局所流入へ拡張する位置付けとなる。電子雲の負電位は20秒計算の準平衡である。[@P000048]
- heading: ウェイクによる力と電荷変化を実験へつなぐ
  paragraphs:
  - '[@P000321]は流れの中のダストについて、遮蔽、ウェイク電位、イオンの運動量移行を分けて考える基礎文献である。[@P000318]は異なる粒径の粒子対を三次元追跡し、下流粒子の電荷変化とウェイク引力を推定した。粒子周囲の電位だけでなく、相手粒子の電荷も変わることが、相互作用モデルを比較する際の軸になる。'
  - XieらはBoltzmann電子とイオン粒子を非線形Poisson方程式で結ぶ静電モデルで、局所クレーターへの太陽風流入を計算した。適用条件はクレーター径が電子旋回半径より小さいことである。NishinoらはKaguyaの月ウェイク陽子観測をもとに、指定した上流磁場・速度の下で昼側散乱陽子が自己ピックアップされる軌道を計算し、ウェイク境界の内向き電場を省いた。後者は高度100 kmの仮想軌道で上向き陽子を選んで観測パターンと比較している。両者をつなぐには、地形・月の空間スケール、磁場、粒子の起源、観測・評価面の違いを保つ必要がある。 [@P000048][@P000103]
- heading: 条件を対応させて文献を比べる
  paragraphs:
  - 電子流体近似を評価するには、密度の一致と速度分布の形を併せて読む必要がある。Wang and Hu（2018）は無バイアス導体平板のウェイクで、等温Boltzmann電子を用いるhybrid PICとfull PICを比べ、深いウェイクで密度差と電子分布の非Maxwell化が強まることを示した。[@P000099] Hu and Wang（2017）は両モデルともfull PICを使い、非中性の放出面から準中性の貯蔵域へ供給条件を変えると、似た巨視的構造でも方向別電子温度と分布が変わった。[@P000100] 二次モーメントで定義する温度には対向流の速度差も入る。電子二峰分布を調べたWang and Hu（2018）と、低温イオン二群の重なりを調べたNakagawa（2013）は、全体の温度上昇と各群の熱化を分ける必要を示す。[@P000099][@P000102]
  - 磁場に沿う月ウェイクの一次元再充填では、膨張が作る対向イオン流と、中央衝撃波による減速・電子分布の平坦化がつながる。Anらの2025年計算は初期Maxwell電子、2026年計算はcore・halo・strahl電子を用い、両方とも質量比100の運動論PICである。[@P000105][@P000106] 2025年の代表的衝撃波ではイオン流のエネルギーが主に電子熱へ移り、2026年は大域的な電位井戸と局所的な電位上昇を連続した変換として追い、ARTEMISの一横断と照合した。診断時刻とイオン群の分け方が異なるため、両種への熱分配率の差はまだ直接比較できない。[@P000105][@P000106] 2025年の右旋R-mode波の増幅は計算結果だが、十分発達したEMIC波と実質量比での両波の優劣は未検証である。[@P000105]
lineage:
- title: 膨張の電荷分離と電子分布
  steps:
  - paper_id: P000096
    title: イオン先端の加速を解く
    significance: 先端電場が長時間には内部自己相似電場の約2倍になることを示し、先端速度・位置と有限時刻のエネルギー端を近似式で求めた。長時間の先端ではZnᵢ/nₑ≈2となり、本紙の鋭い初期境界ではイオン密度の盛り上がりがない。
  - paper_id: P000099
    title: 電子流体近似が崩れる領域を示す
    significance: 物体背後の解析解とPICを比べ、非平衡な電子分布がウェイクの予測を変えることを示した。
    connection: 膨張モデルの電子分布を問い直す
  - paper_id: P000105
    title: ウェイクの再充填と不安定性を追う
    significance: 初期膨張から対向イオン流の衝突後までを追跡し、衝撃波による減速・加熱と電磁波の励起を示した。
    connection: 初期膨張から対向流の衝突へ
- title: 月ウェイクへの粒子流入
  steps:
  - paper_id: P000103
    title: 昼側から回り込む陽子を捉える
    significance: 負のByを仮定した軌道計算で、昼側の正午子午面から外れた赤道域で散乱した陽子の一部が、自己ピックアップと月の大きさに合うラーモア軌道を経て最深部へ上向きに達するType-II経路を示した。南側の陽子支配領域と電子吸収を生む外向き電場は著者の提案である。
  - paper_id: P000102
    title: 表面帯電とイオン流入を同時に解く
    significance: 二次元PICで物体近傍の電荷分離と流入を扱い、Debye長と物体半径の比と全速度を同時に変えた比較で、近傍の加速の違いを調べた。
    connection: 膨張と帯電による別の流入機構へ
  - paper_id: P000104
    title: ウェイクの電位を観測から描く
    significance: ARTEMISの電子分布から電位を推定し、温度・流速・磁場方向に応じた非対称性を整理した。
    connection: 膨張モデルを電位分布と照合
