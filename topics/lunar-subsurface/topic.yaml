- paper_id: P000366
  group: in-situ
  role: ガス掘削による月地下熱測定の実証
  summary:
    question: 小型着陸機の制約下で熱プローブを月地下へ送り、複数深度で測定できるか。
    method: 窒素噴流で掘削しながらプローブを送り、荷重検知で上下動を調整した。測定時には噴流を停止し、センサーを未掘削の土へ挿入した。
    contribution: 約1 mまで到達し、0.288〜0.971 mの8深度で温度と熱伝導率を測定した。設計深度3 mには達せず、停止原因も未確定。掘削・装置性能の報告で、熱流量の詳細解析は別論文に委ねている。
