- paper_id: P000324
  role: 固相蒸発・再凝結と弾道移動を組み合わせるコールドトラップ保持理論
  summary:
    question: 月の希薄な気相から分子が逃げやすいとき、永久影に集まる水氷の長期損失と、新たに放出された水の捕捉を何が決めるか。
    method: 固相の蒸気圧から蒸発流束を求め、未相関の弾道跳躍に脱出確率と冷たい表面への付着確率を与えて、再凝結・移動中の損失・cold trapの収支を導く。地上写真から永久影面積を間接推定し、120 Kを代表上限として機構別の損失を比較する。
    contribution: cold trapの固相損失に蒸発流束による上限があることを示した。120 K・永久影面積0.5%の代表計算では、水氷の損失は全月面平均で約4 g cm⁻²／10億年、収支を補う新規放出は約7 g cm⁻²／10億年となり、100 Kでは損失が約4桁減る。
