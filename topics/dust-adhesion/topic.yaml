- paper_id: P000202
  group: roughness
  role: ナノ粗面の付着理論（第1報）
  summary:
    question: ナノメートル規模の粗面に付着した粒子を対象に、表面突起の寸法をどうモデル化し、接触部と非接触部の相互作用が付着にどう寄与するかを調べた。
    method: 測定可能な二乗平均平方根（RMS）粗さと突起間隔から突起の幾何モデルを導いた。RMS粗さがおよそ20 nm未満の表面について、既存モデルと合わせて接触・非接触相互作用の寄与を解析した。
    contribution: 同じ粗面を表す従来の近似より大きな突起半径が得られた。モデル上では、検討した表面の多くで粒子と突起の接触相互作用が支配的になると示した。
  evidence_by_item:
