- paper_id: P000114
  group: kinetic-models
  role: 電子境界電流の三次元構造と有限旋回半径
  summary:
    question: ミニ磁気圏の電子境界電流はどの三次元構造を持ち、密度が急減する内縁の強い電子流はE×Bドリフトだけで説明できるか。
    method: Reiner Gamma南西側を模す地下0.2Lの水平単一双極子に太陽風を正面入射させ、電子・イオンを粒子として解く三次元EM-PICを実施。mi/me=100、vc/vflow=20、Mach数5、圧力釣合い位置でのriL/L=4へ縮約し、固定+z IMF・光電子なしの条件で電流と電子速度分布を比較した。
    contribution: 電子が担う境界電流の赤道・高緯度での折り返しを示した。内縁では電荷分離電場で加速されたリング分布の旋回位相が偏り、約8vflowの粒子速度を持つ強い負方向電子流が生じると説明し、局所電子旋回半径約0.08Lと内縁幅約0.1Lの近い対応を得た。
