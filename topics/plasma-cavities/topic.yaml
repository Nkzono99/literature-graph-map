- paper_id: P000221
  group: expansion
  role: 日夜境界の電場とダスト運動
  summary:
    question: 月の日夜境界のウェイクで、プラズマの密度と電子温度の変化が表面電場とダスト加速をどう変えるかを調べた。夜側向きのダストの説明も目指した。
    method: 表面帯電モデルにウェイクの密度・電子温度変化を組み込んで電場を求め、付着力を無視して試験粒子の運動を計算した。アポロ17着陸地の地形による遮蔽も検討した。
    contribution: モデルでは日夜境界の夜側で表面にほぼ垂直な電場が強まり、小粒子を加速した。地形の風下の局所ウェイクが、アポロ17のLEAMが捉えた夜側向きダストを説明しうると提案した。
