review:
- heading: クレーター数と層厚から、火山活動の時間と量を調べる
  paragraphs:
  - 表面に残るクレーターのサイズ別頻度を年代へ対応させる枠組みが[@P000187]である。[@P000171]はTC画像を用いて裏側の海の年代を調べ、一部の地域で従来考えられていたより遅くまで火山活動が続いた可能性を示した。
  - '[@P000182]はMoscovienseの年代に玄武岩の層厚・体積を加え、長期間の活動と薄い地殻との関係を論じた。[@P000181]の地下反射層は、表面の年代だけでは見えない噴出の休止期を検討する材料になる。'
- heading: 水の研究を、マグマの噴火過程へつなぐ
  paragraphs:
  - '[@P000246]は水と爆発的火山活動の関係を扱う。表面での水の生成・保持を扱う研究と併せると、月内部からの供給と、その後に表面で起きる移動を別々の過程として追える。'
lineage:
- title: 裏側の火山活動を年代と体積で読む
  steps:
  - paper_id: P000171
    title: 海の年代を広域で求める
    significance: TC画像のクレーター頻度から裏側の活動時期を調べた。
  - paper_id: P000182
    title: Moscovienseの層厚と体積を加える
    significance: 活動期間と噴出量を地殻厚の違いへ結び付けた。
    connection: 広域の年代から地域の噴出史へ
