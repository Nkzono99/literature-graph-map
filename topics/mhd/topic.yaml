- paper_id: P000398
  group: riemann
  role: Roe型MHD解法と衝撃波管問題
  summary:
    question: MHDの複雑な波を、衝撃波を含む数値流束にどう取り込むか。
    method: Roe型の線形化と固有系を構成し、共平面Riemann問題を複数の差分法で比較。
    contribution: 非凸性と複合波を示し、MHD解法の精度を比較する衝撃波管問題を提供した。厳密な平均値Jacobianの構成はγ=2の場合。
  evidence_by_item:
    question:
    - paper_id: P000398
      version_id: V1
      url: https://www.sciencedirect.com/science/article/pii/0021999188901209
      source_type: abstract
      locator: 出版社公開要旨
