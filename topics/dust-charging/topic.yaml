- paper_id: P000237
  group: stochastic
  role: 離散的な流入による電荷ゆらぎ
  summary:
    question: プラズマ中のダスト粒子が電子・イオンを一個ずつ吸収すると、平衡電荷の周囲でどれほどのゆらぎが生じ、粒子の大きさによりどう変わるかを調べた。
    method: 粒子の電位に依存する捕集確率をモデル化し、電子・イオンを一個ずつ吸収する数値計算で電荷の時系列・スペクトル・分布を求めた。電子放出は含めない。
    contribution: 相対的な電荷ゆらぎの実効値は平均電荷数の絶対値の平方根に反比例し、小さい粒子ほど大きかった。極小粒子は電子放出がなくても中性や正電荷に変動しうる。
