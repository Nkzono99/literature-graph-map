- paper_id: P000288
  group: interior
  role: 月裏側試料によるダイナモ停止時期の制約
  summary:
    question: 若い月裏側の試料は全球磁場の停止時期をどう制約するか。
    method: 裏側起源と推定される月隕石NWA 15528の古地磁気を測り、若いApollo試料と比較する。
    contribution: 約7億年前の磁場を数百nT未満と推定した。表側試料と合わせ、過去約10億年間に全球的なダイナモ磁場がなかった可能性を支持した。
