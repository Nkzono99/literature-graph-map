- paper_id: P000120
  group: charging-models
  role: NASCAP-2Kの計算モデルと3適用例
  summary:
    question: 宇宙機の形状、材料、電気結合とプラズマ環境を入力し、表面帯電、周囲の電位、粒子収集、外部プルームの影響をどの計算モデルで扱うか。
    method: 2005年会議録のNASCAP-2K Version 3.0を概説。希薄プラズマの表面帯電は境界要素法、周囲の電位は入れ子格子上の高次有限要素法で扱い、マクロ粒子追跡やEPICからのイオン密度取込みを使う。静止軌道、CHAWSウェイク、NSTARプルームの3例で操作と計算結果を示す。
    contribution: 表面物性と回路結合を含む形状モデルから、表面帯電・空間電位・イオン軌道を計算するモジュール構成を整理した。指定した静止軌道例の300 s後に面ごとの電位（約−7～−10 kV）、イオン軌道とbarometric電子によるウェイク電位、既知プルーム密度と指定境界電位からの空間電位を示す。PICは利用可能な機能として紹介されるが、本版の例に動的PIC検証は含まれない。
