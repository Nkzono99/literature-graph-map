schema_version: 1
topic_id: lunar-magnetic-anomalies
title: 月の磁気異常と太陽風相互作用
question: 地殻磁場が太陽風の粒子軌道・電位・表面照射をどう変えるかを、観測・PIC・実験から整理する。
synopsis:
- 月の地殻磁場は、太陽風の粒子軌道、表面近くの電位、表面への照射を変える。中性水素原子の画像（[@P000109]）は磁気異常上で粒子到達が減ることを示し、かぐやの同時計測（[@P000111]）は磁化された電子と非磁化のイオンの運動差が作る電場を推定した。
- 三次元PIC（[@P000112]、[@P000113]）は、この電荷分離が作る電場と反射・遮蔽の分布を計算し、反射率と表面遮蔽が別の量であることを示した。室内実験（[@P000116]）は電位の形成に二次電子の輸送が関わることを加え、光電子解析（[@P000051]）は磁化地域の相対電位差を観測から示す。
- 遮蔽の分布はスワールの明暗と対応付けられるが（[@P000108]）、太陽風遮蔽と静電ダスト集積の区別は残る。磁場源の地質と磁化を担う物質（[@P000322]、[@P000323]）を合わせると、現在の相互作用と過去の磁気履歴をつなげて考えられる。
review:
- heading: 局所的な磁場が、太陽風の届き方を変える
  paragraphs:
  - 全球SVMモデルは強度に加えて方向を復元し、Reiner Gammaなどのスワールが半径方向成分ゼロ付近や低～中傾斜の領域に多いことを示した。ただし、局所的な水平場の強い面積と高アルベド域は一致せず、遮蔽や静電ダスト輸送の機構を確定した結果ではない。孤立中心異常の双極子近似からは3.3–3.5
    Gaより前の極移動を推定するが、磁源の形状と磁化が海玄武岩より古いという形成順序の仮定に依存する[@P000107]。
  - "[@P000109]は、月面から戻る中性水素を入射太陽風で規格化して磁気異常付近の遮蔽を画像化した。2009年6月17日、平均太陽風陽子エネルギー580 eV・動圧1.0–1.5 nPaの条件で、150–600 eVのENAが周囲の増強環より約50%低い、月面上で直径約360 kmの領域と幅約300 kmの増強環が現れた。著者はこの対応を局所遮蔽と太陽風の迂回として解釈する。一方、30–100 eVでは中心の減少が消え、低エネルギー水素の起源は未解決で、エネルギー依存の散乱角と観測幾何が見かけの差に寄与する可能性も残る。"
  - "[@P000110]は、安定した太陽風下で観測したGerasimovic磁気異常の水素ENAスペクトルを通常昼側の経験式で入射陽子エネルギーへ換算し、異常外と内部の差から約+135 Vを推定した。地図では磁化領域の大部分に局所>150 Vの構造があり、周辺のフラックス増強域では特性エネルギーが異常外とほぼ変わらない。この違いから著者は周辺の磁気偏向と内部の電位減速を区別する。経験式の理論的保証や通常昼側の数Vの電位、観測の空間分解能には制約があり、ダスト移動やスワール形成への効果は直接観測ではなく機構の議論である。"
  - "[@P000518]は、Kaguyaの磁力計から合成した20 km超の地殻場と、1 keV超の電子を用いた非断熱軌道追跡を組み合わせ、軌道高度で捉えにくい近表面成分を制約した。2009年5月7日の12周回によるSPA盆地南西側の地図では、水平磁場と長さの積BhLhの下限が最大200 nT kmとなり、欠ける成分にLh <20 kmを仮定すると最も強い場所のBh >10 nTが導かれる。3 kmビンの最大下限を9 kmで平滑化した地図で、強い小スケール成分は高度5 kmの大スケール水平場と重なる傾向を示した。磁場強度と長さを別々に測る方法ではなく、全球での普遍性や共通の磁化起源は可能性として残る。 有限偏向角での近似誤差は本文で定量化されていない。"
- heading: 電子とイオンの運動の違いが、電場と境界電流を作る
  paragraphs:
  - '[@P000111]の約25 km高度の同時計測は、粒子のエネルギー変化から磁気異常上空の静的な月外向き電場を推定した。電子加速とB²/nの相関0.798は、イオン慣性長程度の規模で電子とイオンの運動が分離するHall電場の説明と整合する。一方、反射イオンは磁場増強域より広く、入射太陽風より高温・低速であり、著者はかぐやより下の非断熱散乱と加熱領域を考えた。この上方の減速・加速と下方の反射・加熱の区別が、磁気異常周辺のプラズマ構造を読む手掛かりになる。'
  - '[@P000112]は、月面下の水平双極子と太陽風を質量比256の三次元・全運動論的電磁PICで計算し、磁化された電子と非磁化イオンの侵入差が作る法線電場、電子のE×Bドリフト、イオンの偏向・逆流を結び付けた。密度3
    cm⁻³、Ti=Te=35 eV、350 km/sの基準条件では、高度約13 kmに密度約1.6倍のハローが生じる。ただし表面へのイオン到達は最良遮蔽域で約8%、中心で最大約60%と位置に依存する。低速風ではハローと逆流イオンが消えても局所的な入射抑制が残り、IMFを倍にすると反射割合が下がっても表面遮蔽は強まる。反射率と表面遮蔽を分ける必要がある。月面は電荷を蓄積しない完全吸収境界で、光電子・二次電子・帯電ダストを含まないため、表面帯電やダスト輸送への接続には追加の境界物理が要る。'
  - '[@P000114]は、Reiner Gamma南西側を模した水平単一双極子と正面入射太陽風を三次元全粒子PICで計算し、電子が担う境界電流が赤道と高緯度で向きを変える構造を示した。外側の平均電子速度はE×Bドリフトでおおむね説明できるが、内縁では電荷分離電場で加速されたリング分布の旋回位相が偏り、約8倍の上流流速を持つ粒子の負方向流が強くなる。局所電子旋回半径約0.08Lは内縁幅約0.1Lと近かった。これは質量比100、固定IMF、光電子放出なしという縮約条件の結果であり、表面帯電と電流閉路の定量解析は課題として残る。'
  - '[@P000113]は、表面法線方向の単一双極子を三次元の全運動論的電磁PICで計算し、中心カスプへ太陽風が流れ込み、その周囲に部分遮蔽の環ができることを示した。IMFを省き、上流密度3
    cm⁻³、電子・イオン温度35 eV、太陽風速度350 km/s、縮約質量比mi/me=256を用いた事例である。最も強い環状遮蔽部では電子71%、イオン28%が表面到達を阻まれる一方、中心には高密度のhaloに囲まれた密度空洞が表面を守る従来型小磁気圏は形成されない。カスプ直上の局所分布では反射イオン成分が約21%を占め、著者は既報の水平双極子の約4倍と比較する。この値は限定された集計体積から得た割合であり、異常域全体の積分反射率ではない。環状の風化模様との関連は、この粒子照射・遮蔽の分布から示唆される。'
  - ミニ磁気圏の実験とスワール形成を結ぶ[@P000275]は、局所磁場による遮蔽を室内でも調べる研究として参照できる。かぐや低高度観測の[@P000178]は電子のみが関わる磁気リコネクションの候補を検討する。表面への粒子到達に加え、磁場近傍でのエネルギー変換も比較の対象となる。
  - '[@P000275][@P000275]は、磁化された電子と十分に磁化されないイオンの応答差が作る電位障壁を、既報の衛星観測とプラズマ風洞の空洞形成につないだ。太陽風イオンが減速・偏向されることで、局所磁場の勾配に応じた照射と風化の差がスワールの明暗を作りうると論じる。ただし読んだarXiv
    v1では、実験電位と電子慣性長の数値を印刷値から再現できず、定量的一致と表面形成の実証は区別して扱う必要がある。'
  - "[@P000506]は、太陽風ウェイクに入ったCrisium Antipode磁気異常上でも電子が一様に減少しないことを、SELENEの連続2周回の上空14–15 km観測から示した。70–84 nTの強磁場付近では約100 eVの微分エネルギーフラックスが10^5.5–10^6 eV/(cm² s sr eV)となり、150 eV未満の双方向ビームと150–300 eVの二重ロスコーンは両端が月面へ結ぶ閉磁力線を示唆する。一方、北縁の約21–25 nTの磁場増強域では同フラックスが10^4未満へ減少した。地殻磁場の強さと電子空洞を単純に対応づけるより、磁力線の接続と粒子供給を分けて考える必要がある。著者の双極子赤道面モデルでは、100 eV電子、80 nT、磁場勾配約10 nT/kmから勾配ドリフトによる損失時間を約0.2 sと見積もる。これは日側から2.7日間保持された電子という仮説を難しくするが、夜側の供給・加熱機構と北縁だけの空洞形成は未解決である。"
  - "[@P000519]は、1998年の高度約100 kmで得た昼側太陽風中の選択4902分布を解析し、約58%に斜め上向き増加（Conic）、約12%に上向きBeamを認めた。Conicは強い地殻磁場の周縁、Beamはより強い磁場域に多く、Beam時には入射超熱電子が相対的に等方化していた。移動月面によるエネルギー獲得を除くdHT系でも損失円錐のエネルギー依存が残り、探査機下の下向き電場と上流への先行作用が示唆される。ただし最強異常の一部を除く選択標本であり、定常電位層や波動を直接測った結果ではない。非単調電位は候補だが、推定電位差約10–100 Vが電子温度約5–25 eVを上回る観測や温度との相関の弱さが説明を制限する。"
- heading: 実際の磁場配置と表面帯電へ広げる
  paragraphs:
  - "[@P000115]は、Kaguya・Lunar Prospectorに基づく磁場を全運動論的PICへ入力し、太陽風の入射角と磁気シース通過を含む8条件を比較した。45°太陽風の高度15 kmでは、極方向と赤道方向の最大電場が33、69 mV/mとなり、風上の密度集積と下流のmini-wake・集束が異なる。局所軌道で見える反射粒子と、表面への入射を抑える働きを分けて読む手掛かりとなる。"
  - "低動圧の磁気シースを模した条件では、密度ハローが30–40 kmに上がり、高度15 kmの軌道はその下を通るため中心の密度が減る。磁場強度差の形状も太陽風条件より高い所まで残るが、実際の外部磁場と乱流は計測を難しくしうる。計算は外部磁場を省き、下流の月面近傍には非物理的な電場構造も生じたため、近表面の結果を解釈するときには入力磁場と境界条件を合わせて確認する必要がある[@P000115]。"
  - '[@P000116]は、電子が磁化されイオンが非磁化となる垂直双極子と絶縁板に100–800 eVの窒素プラズマを照射した。ローブの正電位は100–200
    eVではイオン停止の期待値に近づくが、400–800 eVでは下回り、ローブ内の電子電流も増えた。測定場の試験粒子計算では上空電子を電場だけで引き込む説明は不十分で、近傍で生まれたイオン誘起二次電子の輸送が有力な機構となる。ただし自己無撞着な電位再現は未了で、月面への適用には磁場形状、イオン種・表面材質、光電子環境を考慮する必要がある。'
  - Katoらは、ローブ様プラズマ中のかぐや光電子を表面磁場強度図と比較し、強い地殻磁場ほど光電子が減速する統計的傾向を示した。Reiner Gammaのswirlを横切る事例でも、電子フラックスの低下と負側のエネルギーずれが局所的に対応した。Fe重量比で高地・海側を分けても磁場強度への依存が残るが、磁場方向や空間的広がりは解析していない。磁化表面が相対的に正側となる解釈を支持する一方、電場の機構や全プラズマ環境への一般化には既報との比較とモデル仮定が伴う。[@P000051]
- heading: 局所の遮蔽から、広域の照射とスワールへ
  paragraphs:
  - '[@P000117]はChandrayaan-1/SARAのENAと反射陽子を集積し、主要磁気異常の欠乏域の周囲に1,000 kmを超えるENA増強域を示した。ENA観測/予測比を陽子降下量の指標とするには、表面の後方散乱比と経験的散乱モデルの仮定がある。動圧が高いほどGerasimovich・Orientale
    Antipodeの遮蔽は弱まる一方、広いSPA磁気群では欠乏と周辺増強が強まる。著者は反射陽子の再入射と、反射陽子群による太陽風の偏向を説明機構として提案した。SWIMの領域平均反射比は視野・空間分解能に影響され、高緯度のENA定量解釈にも制約がある。'
  - '[@P000108]はClementineの多波長画像と高度30 kmにそろえたLunar Prospector磁場を15地点で比較した。調査したスワールはすべて磁化地殻と対応し、明るい部分は光学的に未成熟だったが、Abelなど4磁場異常では明確なスワールを認めなかった。海ではFeO推定値が周囲より約1–4
    wt.%低い一方、高地では差が小さく、Gerasimovichでは周囲とほぼ同じ値になる。FeOは絶対精度約±1–2 wt.%の分光推定であり、著者は低FeOの外来放出物や斜長石に富む微粒子の集積に加え、遮蔽下の異常風化が見かけのFeOを下げる可能性を示した。この解析では太陽風遮蔽と静電ダスト集積を明確には区別できない。'
  - 続く[@P000163]は、Chandrayaan-1の夕方側57周回の観測から、高度約100 kmのSPA磁気群上空で太陽風の偏向・加熱・減速が繰り返し現れることを調べた。反射陽子との相互作用で生じる広域のproto-magnetosheathという解釈により、フラックスの再分配を上空の流れの変化へ結び付けている。
- heading: 遮蔽を比べ、散乱粒子の行き先を追う
  paragraphs:
  - '[@P000274]は複数の磁気異常を比較し、単純な磁場構造で見られる遮蔽の傾向が、複雑な構造では一様に成り立たないことを示した。[@P000272]はARTEMISの統計から高高度・下流の圧縮構造を調べ、[@P000273]は磁気異常で散乱された陽子が月ウェイクへ届く経路を観測と軌道追跡から検討している。'
  - '[@P000274]はCENAの複数磁気異常を比較し、Gerasimovichでは、異常より広い地表視野を持つ外側セクターを除くと、磁場が強いほど中性水素の減少率が高く、同程度の磁場では太陽風動圧が低い群の減少率が高いことを示した。外側セクターのみの1領域を除いた9領域中4領域で磁場との相関が見られたが、他の領域には相関が見えない例や観測不足があった。ENA減少には表面の反射効率の違いも重なるため、地域間の比較には磁場構造、観測視野、太陽風条件を合わせる必要がある。'
  - "[@P000273]は、2009年4月20日のSWIM観測で約800 eV・広い到来方向の陽子を明暗境界から近傍ウェイクに捉え、処方したIMF・電場での逆追跡終点が昼側SPA近傍の磁気異常と対応することを示した。表面終点で推定した散乱角は90°未満・約50°にピークを持ち、前方散乱を支持する。代表例では正Byと負BzのIMF配向が輸送に関わり、30°の角度pixelを仮定した検出フラックスは同時太陽風の5×10−4だった。LMA固有の場はモデルに含めず、5°×5°の起源対応に基づく推定である。対流電場の印刷尺度と次元検算の関係も未解決である。"
- heading: 磁化が記録した磁場と、磁化を担う物質を分けて調べる
  paragraphs:
  - 現在の磁気異常の背景には、過去の磁場と磁性鉱物の履歴がある。[@P000288]は裏側起源と推定される月隕石から約7億年前の弱い磁場を読み、全球ダイナモの停止時期を制約する。一方、[@P000297]は模擬物の加熱によるFeの再分配と磁性相の生成を追う。試料の磁化を解釈する際には、磁場の強さと、物質が磁化を保持する条件の両方を参照できる。
  - "[@P000288]は、裏側起源候補のレゴリス角礫岩NWA 15528から、約0.7 Gaの周囲磁場に小さい上限を与えた。地球上の手持ち磁石による低保磁力の上書きを除き、方向が散る高保磁力成分を比較する。ゼロに整合する12片・f′=4の主解析の95%上限は0.32 μTだが、f′=1.34なら0.95 μTとなり、忠実度実験の検出下限は約1 μTである。現在の地殻残留磁場が裏側に集中していても、この若い年代の全球ダイナモ活動を直ちに意味しない。表側の既報近ゼロ磁場と合わせた全球停止の解釈は、推定起源・局所記録・離散年代という条件で読む必要がある。"
- heading: 磁場源の地質と、磁化を担うナノ粒子
  paragraphs:
  - '[@P000322]はDewar領域の重力と磁場を共同逆解析し、埋没火成岩体と古いダイナモを結び付けた。[@P000323]はChang’e-6衝突ガラスのγ鉄と磁気ボルテックスを調べた。前者は磁場源の形状・年代のモデル制約、後者は磁化を担う相と衝撃記録の試料制約であり、両者を組み合わせて月の磁気履歴を考える。'
  - "[@P000323]は室温電子ホログラフィーで、衝突ガラス中の>100 nmのαFeとγFeに渦磁区を観察した。γ相が減衰する衝突磁場の早期、α相が後期を記録する可能性を論じるが、天然γFeのブロッキング温度は未拘束である。γ相の記録後、α相がブロックする前に衝突磁場が消える冷却条件が成立すれば、両相比較が磁場起源の識別に役立つという仮説である。"
  - "[@P000322]はDewarの密度・磁化対応を低Ti玄武岩体と解釈し、全体が玄武岩でイルメナイトが完全還元された最大鉄供給条件から、標準パラメータで古磁場下限11.4 μT、強いセル群の95パーセンタイルでは22.0 μTを得た。岩石磁気・イルメナイト量の範囲を組み合わせると下限は約5.4 μTまで低下しうる。4.22 ±0.08 Gaは盆地モデル年代とcryptomareの層序による範囲であり、ゆっくり冷えた岩体と安定磁場の仮定とともに初期ダイナモを支持する。また水平磁化だけでswirlを説明せず、FeOに富む表面との組合せを太陽風遮蔽によるコントラスト形成の候補とした。 還元率の例は本文のDiscussion約31%とMethods約40%で集計条件差が未解決であり、イルメナイト空隙率の対象にも本文と補足captionの表現差がある。"
- heading: 磁化する物質の供給と、対蹠点への輸送を分ける
  paragraphs:
  - "[@P000437]は盆地形成天体から磁化しやすい外来物質を供給する仮説を示し、[@P000438]は斜め衝突の対蹠点堆積と加熱・冷却を計算した。[@P000439]は十分な堆積を得る衝突条件を広く検討し、[@P000436]は現在の月自転周期を導入すると赤道付近の堆積が方向・角度に敏感になると示した。磁性物質の存在、堆積位置、冷却時の背景磁場はそれぞれ別の制約であり、対蹠点への位置対応だけで起源が確定するわけではない。"
  - "[@P000437]は、SPA形成天体由来の高磁化率物質が北縁の異常群を記録したと提案した。直径200 km・核110 kmの分化天体を15 km/s、鉛直から45°で衝突させる代表計算では、核物質に熱残留磁化率0.5 SIと古い双極子磁場5 µTを仮定すると、高度30 kmで10 nTを超える複数の異常が生じる。磁場の発生源と記録媒体の供給を結ぶ条件付き説明であり、ダイナモや個別異常の起源を一意に決める結果ではない。遠方放出物による孤立異常の説明には、月自転や後続過程を含む検証が残る。ここでの積算厚さは約130 km表面格子上の量で、微細層序は解像しない。補遺の別計算にはFig. S5の厚さ単位とFig. S8Bの解像度の未解決表記差があり、磁化率換算のCV3r行にも確認点が残る。"
  - "[@P000438]は対蹠点異常の磁性物質を衝突天体が供給するモデルを示す。100 km天体・45°衝突の対蹠点ejectaは、12 km/sで89%、17.4 km/sで15%が非融解となり、着地まで高温を保つ固体が熱残留磁化を記録しやすい。Crisium対蹠点のswirl地下に面積6.4×10⁸ m²・厚さ700 mの層を仮定すると必要磁化は29 A/m、コンドライトに似たXTRMを0.9/0.5と置くと古磁場は約40/73 μTとなる。これは組成・幾何・磁化特性に依存する推定で、swirl形成や古磁場の直接測定ではない。材料パラメータ、月自転や解像度依存の詳細は主本文の説明に限る。"
  - "[@P000436]は、直径100 km・速度12 km/sの衝突計算に月の自転を加え、対蹠点への衝突体物質の集中が方向と角度で変わることを示した。周期27日、赤道45°では非自転の695 mに対し西向き465 m、東向きは3 m（2トレーサーで統計的に不確か）となり、東向きの集積域は衝突地点側へ約12°ずれる。一方、30°東向きは529 mから1117 mへ厚くなり、60°西向きでは非自転0 mから150 mの堆積が生じる。極の中心厚は保たれ、周期17日の45°赤道西向きでは363 mまで減る。磁気異常の不在や対蹠点からのずれは輸送条件にも左右され、古磁場の有無や衝突方向を単独では決められない。熱残留磁化の解釈には当時の磁場と高温の衝突体物質の冷却が条件となる。"
- heading: 磁場の影響を、外圏の再配分と波動の接続で調べる
  paragraphs:
  - "[@P000442]は地殻磁場による太陽風反射をスパッタ源へ写し、中性外圏に生じる非等方性を計算した。一方、[@P000434]の波動統計では約90%の事例に月との直接の磁力線接続がなかった。表面の粒子再配分を示す根拠と、月近傍の波動を局所異常へ帰属させる根拠を分けると、磁気異常の作用範囲を検討しやすい。"
  - "[@P000434]は2012〜2023年のARTEMIS P2から左旋かつ波法線角60°未満の狭帯域波37,983観測点を選び、測定磁場方向の直線が月に交差するのは3,504点（約9.2%）と示した。接続群の足元では高度30 kmのモデル磁場2 nT等高線で示す磁気異常と出現・振幅が対応する。各時刻の直線判定は過去の接続や横方向への伝播を含まないため、非接続点を月以外の起源と断定できない。振幅と動圧・IMF強度の全標本相関はいずれも0.24で、反射イオンを有力源とする解釈と、励起場所・伝播を分離する課題が残る。"
  - "[@P000442]はKaguyaの反射率とLunar Prospectorの磁場地図を用いて電位を推定し、磁気異常の影響をスパッタ源へ広げた。採用収率は約100 eV以下で急減するため、完全反射しない減速でも源を強く抑える。新月・250 km/s・alpha 1%の合計源は異常域で1桁超低下する一方、450 km/s・alpha 5%ではalphaが約250 km/sの収率最大へ近づき、局所源を増やす場合がある。合計源は後者でも南半球で50%超低下する。推定は静電反射とカスプPICの一次近似に基づき、異常域の加熱・非断熱磁気散乱を含めない。"
